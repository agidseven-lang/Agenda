    const phone=(phoneEl&&phoneEl.value||'').replace(/[^\d]/g,'');
    if(phone.length<10){ setStatus('Informe o WhatsApp do responsável com DDD (ex.: 55 11 99999-9999).','err'); if(phoneEl)phoneEl.focus(); return; }
    if(!ctx.token){ setStatus('Link do cliente sem token — gere o cronograma novamente.','err'); return; }
    btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=svg('send')+'Enviando…';
    setStatus('Enviando o card premium pela WhatsApp Cloud API…');

    const payload={ token:ctx.token, clientName:ctx.client||'', phone:phone, cronogramaTipo:ctx.type||'' };
    let r=null, data=null;
    try{
      r=await fetch(PREMIUM_SEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      try{ data=await r.json(); }catch(_){ data=null; }
    }catch(e){
      btn.disabled=false; btn.innerHTML=old;
      setStatus('Sem conexão com o servidor de envio. Verifique a internet e tente de novo.','err'); return;
    }

    if((r&&r.status===503)||(data&&data.error==='WHATSAPP_CLOUD_API_NOT_CONFIGURED')){
      btn.disabled=false; btn.innerHTML=old;
      setStatus('A integração WhatsApp Cloud API ainda não está configurada. Configure as credenciais da Meta para habilitar o envio automático do card premium.','blocked');
      return;
    }

    if(r&&r.ok&&data&&data.ok&&data.message_id){
      btn.innerHTML=svg('check')+'Enviado'; btn.classList.add('is-done');
      setStatus('Card premium enviado ao responsável ✓ (id: '+esc(String(data.message_id))+').','ok');
      flashToast('Card premium enviado ao responsável (Cloud API).');
      return;
    }

    btn.disabled=false; btn.innerHTML=old;
    const code=(data&&(data.error||data.status))||(r&&r.status)||'desconhecido';
    setStatus('Não foi possível enviar agora. Código: '+esc(String(code))+'. Nenhuma mensagem foi enviada.','err');
  });
}
// 1.0.120-whatsapp-guided-card-send — ASSISTENTE GUIADO em 3 ETAPAS BLOQUEADAS (à prova de erro).
// ETAPA 1: gera/salva a imagem REAL do card (Aurora Glass), copia a imagem p/ o clipboard (se
//          suportado) e abre a pasta. Só conclui se a imagem foi SALVA com sucesso.
// ETAPA 2: valida link+token e copia APENAS a legenda limpa. Liberada só após a etapa 1.
// ETAPA 3: abre SOMENTE https://web.whatsapp.com/ (sem send?text=). Liberada só após 1 e 2
//          (imagem salva + legenda copiada + link validado). NUNCA antes.
function _gateValidLink(ctx,msg){
  // 1.0.124 — a mensagem deve conter o LINK DE COMPARTILHAMENTO (/share/...), que gera o preview
  // premium no WhatsApp. Valida domínio premium + token presente; rejeita workers.dev e link sem token.
  let url='';
  try{ url=buildShareClientUrl(ctx&&ctx.token); }catch(_){ return {ok:false,url:''}; }
  const ok = !!url
    && url.indexOf('https://aprovar.agendaidseven.com.br/share/cronograma/')===0
    && !/\/share\/cronograma\/?$/.test(url)
    && !/workers\.dev/.test(url)
    && String(msg).indexOf(url)>-1;
  return {ok:ok,url:url};
}
function openWhatsAppWebOnly(){
  // ABRE SOMENTE https://web.whatsapp.com/ — nunca send?text=, nunca whatsapp://send.
  const ext=window.desktopAPI&&window.desktopAPI.openExternal;
  const WEB='https://web.whatsapp.com/';
  if(ext){ try{ ext(WEB); }catch(_){ try{window.open(WEB,'_blank');}catch(__){} } }
  else { try{window.open(WEB,'_blank');}catch(_){} }
  return WEB;
}
// 1.0.123-whatsapp-group-copy — FLUXO PRINCIPAL "Enviar no grupo do cliente" (1 CLIQUE).
// "Copiar mensagem para o grupo" copia a MENSAGEM COMPLETA (texto + link público) p/ a área de
// transferência. O operador cola no grupo do WhatsApp Business do cliente e o WhatsApp renderiza
// a PRÉVIA PREMIUM do link (card OG do Worker, "Toque no link abaixo →"). NÃO salva arquivo, NÃO
// abre pasta, NÃO copia imagem como ação principal. O botão "Revisar e aprovar" vive no PORTAL.
// "Copiar card (imagem)"/"Salvar e abrir pasta" existem só como fallback recolhido (opções avançadas).
async function _wireGroupSend(ctx, msg, cardFile){
  const api=(window.desktopAPI||{});
  let bytes=null, savedPath=null;
  const $=id=>document.getElementById(id);
  const on=(id,fn)=>{const b=$(id); if(b) b.addEventListener('click',fn);};
  const img=$('groupCardPreview'), status=$('groupStatus');
  function setStatus(txt,cls,html){ if(!status)return; status.className='gcs-status'+(cls?(' '+cls):''); if(html) status.innerHTML=txt; else status.textContent=txt; }
  // Imagem do card só ILUSTRA a prévia do link (embutida, sem rede). Não é anexada por padrão.
  try{
    const bin=atob(CARD_IMG_B64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); bytes=u.buffer;
    if(img) img.src='data:image/jpeg;base64,'+CARD_IMG_B64;
  }catch(e){
    try{ const r=await fetch(CARD_IMG_URL,{cache:'no-store'}); if(r.ok){ bytes=await r.arrayBuffer(); if(img) img.src=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'})); } }catch(_){ if(img) img.src=CARD_IMG_URL; }
  }
  // Fallbacks (opções avançadas) — só sob demanda; nunca na ação principal.
  async function ensureSaved(){
    if(savedPath) return savedPath;
    if(!bytes) return null;
    if(api.saveCardImage){ const r=await api.saveCardImage(new Uint8Array(bytes),cardFile); if(r&&r.ok){ savedPath=r.path; return savedPath; } return null; }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'})); a.download=cardFile; a.click(); savedPath=cardFile; return cardFile; }catch(_){ return null; }
  }
  async function copyCard(){
    if(!bytes) return {ok:false};
    if(api.copyCardImage){ try{ const r=await api.copyCardImage(new Uint8Array(bytes)); return {ok:!!(r&&r.ok)}; }catch(_){ return {ok:false}; } }
    return {ok:false};
  }
  // Copia a MENSAGEM COMPLETA (texto + link /share) — valida o link antes. Sem pasta/arquivo.
  function copyMsgClean(){
    const lk=_gateValidLink(ctx,msg);                              // valida link público /share + token
    if(!lk.ok){ setStatus('Link inválido — gere o cronograma novamente.','err'); flashToast('Link inválido — gere o cronograma novamente.'); return false; }
    copyToClipboard(msg);                                          // copia a MENSAGEM COMPLETA (texto + link /share)
    return true;
  }
  /* ===== PRINCIPAL — ABRIR WHATSAPP BUSINESS (copia a mensagem AUTOMATICAMENTE + abre o app) =====
     É o fluxo que funcionou no teste real: 1 clique copia a mensagem e abre o WhatsApp Business.
     Sem pasta, sem salvar arquivo, sem etapas. O link /share gera a prévia premium ao colar. */
  on('btnOpenWaMain', function(){
    if(!copyMsgClean()) return;                                    // 1) copia a mensagem automaticamente
    openWhatsAppWebOnly();                                         // 2) abre o WhatsApp Business (só web.whatsapp.com/)
    const b=$('btnOpenWaMain'); if(b){ b.classList.add('is-done'); b.innerHTML=svg('check')+'WhatsApp aberto · mensagem copiada'; }
    setStatus(svg('check')+'<span>Mensagem copiada e WhatsApp Business aberto. Escolha o grupo do cliente e cole (Ctrl+V) — a prévia premium aparece pelo link.</span>','ok',true);
    flashToast('Mensagem copiada e WhatsApp Business aberto. Escolha o grupo do cliente e cole.');
    // Reprovação 1.0.138 (causa-raiz da notificação inicial): este é o botão REAL usado
    // pela Social e ele NÃO registrava o envio — sem persistClientSend não há contentSent
    // e o Notification Engine nunca recebe themes_sent_to_client. O registro roda em
    // segundo plano (não trava o WhatsApp); o dedup de 60s do engine cobre o duplo clique.
    if(ctx&&ctx.id&&ctx.id!=='__form__')persistClientSend(ctx.id);
  });
  /* ===== Secundários discretos ===== */
  on('btnCopyGroupMsg', function(){                                // copia só a mensagem (se útil), sem abrir o WhatsApp
    if(!copyMsgClean()) return;
    const b=$('btnCopyGroupMsg'); if(b){ b.classList.add('is-done'); b.innerHTML=svg('check')+'Mensagem copiada'; }
    flashToast('Mensagem copiada. Cole no grupo do WhatsApp Business do cliente.');
    // Copiar a mensagem É o passo de envio manual no grupo — registra igual.
    if(ctx&&ctx.id&&ctx.id!=='__form__')persistClientSend(ctx.id);
  });
  on('btnTestLink', function(){                                    // abre o LINK DE COMPARTILHAMENTO p/ conferir a prévia premium + portal
    let url=''; try{ url=buildShareClientUrl(ctx&&ctx.token); }catch(_){ flashToast('Link inválido — gere o cronograma novamente.'); return; }
    const ext=api.openExternal; if(ext){ try{ ext(url); }catch(_){ try{window.open(url,'_blank');}catch(__){} } } else { try{window.open(url,'_blank');}catch(_){} }
    flashToast('Abrindo o link de compartilhamento (prévia premium + portal) para teste.');
  });
  /* ===== Fallback (opções avançadas) — card como arquivo; NUNCA na ação principal ===== */
  on('btnCopyImg', async function(){ if(!bytes){flashToast('A imagem ainda não carregou.');return;} const cp=await copyCard(); if(cp.ok){ flashToast('Card copiado — cole (Ctrl+V) como imagem no grupo.'); } else { const p=await ensureSaved(); flashToast(p?('Card salvo: '+p):'Não foi possível preparar o card.'); } });
  on('btnOpenFolder', async function(){ const p=await ensureSaved(); if(p&&api.showInFolder){ api.showInFolder(p); flashToast('Card salvo e pasta aberta: '+p); } else if(p){ flashToast('Card salvo: '+p); } else { flashToast('Não foi possível salvar o card.'); } });

/* ===== VISÃO DO CLIENTE — tela real (rota dedicada) =====
   Aberta via state.clientView=<taskId>. Le a tarefa AO VIVO de state.tasks
   (onSnapshot -> render), entao acoes do cliente refletem em tempo real
   tanto aqui quanto na janela da Social. Regra de visibilidade: esta tela

function openClientView(taskId){
  if(!taskId){flashToast('Salve o cronograma antes de abrir a Visão do cliente.');return;}

  state.clientAction=null;            // 'revisao' | 'editar' quando um campo de nota esta aberto

  // contexto capturado no envio para renderizar de imediato. A versao ao vivo
  // (com clientReview/history) substitui assim que o snapshot chega.
  state._clientFallback=(state._sendCtx&&state._sendCtx.id===taskId)?state._sendCtx:null;

async function clientReviewAction(taskId,kind,note){
  const map={aprovar:{cronStatus:'aprovado_cliente',rev:'aprovado',type:'cliente_aprovou',label:'Cliente aprovou o cronograma'},
             revisao:{cronStatus:'em_revisao_cliente',rev:'revisao',type:'cliente_pediu_revisao',label:'Cliente pediu revisão'},
             editar:{cronStatus:'editado_cliente',rev:'editado',type:'cliente_editou',label:'Cliente solicitou edição'}};
  const m=map[kind];if(!m)return;
  const now=Date.now();const u=state.user||{};
  const t=state.tasks.find(x=>x.id===taskId)||null;
  const review={status:m.rev,note:note||'',at:now,byId:u.id||null,byName:u.name||''};
  const patch={
    cronStatus:m.cronStatus,
    clientReview:review,
    clientReviewAt:now,
    history:firebase.firestore.FieldValue.arrayUnion({
      type:m.type,label:m.label,by:u.name||'',byId:u.id||null,
      at:now,client:(t&&t.client)||(state._clientFallback&&state._clientFallback.client)||'',channel:'client_vision',note:note||''
    })
  };
  // atualizacao otimista (refletir imediato mesmo antes do round-trip),
  // tanto na tarefa ao vivo quanto no fallback (recem-criada ainda sem snapshot)
  if(t){t.cronStatus=m.cronStatus;t.clientReview=review;}
  if(state._clientFallback&&state._clientFallback.id===taskId){state._clientFallback.status=m.cronStatus;state._clientFallback._review=review;}
  state.clientAction=null;render();
  try{await db.collection('tasks').doc(taskId).update(patch);}catch(e){console.warn('clientReviewAction',e);}
  flashToast(kind==='aprovar'?'Cronograma aprovado. Equipe notificada.':kind==='revisao'?'Revisão enviada à equipe.':'Edição enviada à equipe.');
}
function flashToast(msg){
  let t=document.getElementById('flashToast');
  if(!t){t=document.createElement('div');t.id='flashToast';t.className='flash-toast';document.body.appendChild(t);}
  t.innerHTML=svg('info')+'<span>'+esc(msg)+'</span>';t.classList.add('show');
  clearTimeout(window.__ft);window.__ft=setTimeout(()=>t.classList.remove('show'),2600);
}
async function persistClientSend(taskId){
  const now=Date.now();const u=state.user||{};
  const t=state.tasks.find(x=>x.id===taskId)||{};
  // EIXO DO CLIENTE: 1º envio = 'enviado'; reenvio após revisão/produção = 'reenviado'.
  const prev=clientCol(t);
  const cflow=(prev==='revisao'||prev==='producao'||prev==='reenviado'||prev==='aprovado')?'reenviado':'enviado';
  // V1.0.98 — FASE de aprovação do cliente. 1º envio: 'themes'. Conteúdos com legenda+Feed: 'production'.
  const arr=Array.isArray(t.cronContents)?t.cronContents:[];const total=arr.length||0;
  const withLegend=arr.filter(c=>c&&c.legenda&&String(c.legenda).trim()).length;
  const withFeed=arr.filter(c=>c&&c.feedImageUrl).length;
  const phase=(prev==='afazer'||cflow==='enviado'||total===0||withLegend<total||withFeed<total)?'themes':'production';
  try{
    await db.collection('tasks').doc(taskId).update({
      cronStatus:'enviado_cliente',
      clientFlowStatus:cflow, clientWorkflowStage:cflow,
      clientApprovalPhase:phase,
      clientSentAt:now,
      clientSentBy:u.id||null,
      clientPreviewLink:'idseven://client/'+taskId,
      history:firebase.firestore.FieldValue.arrayUnion({
        type:'cronograma_enviado_cliente',
        label:(phase==='themes'?'Cronograma enviado ao cliente (aprovação de TEMAS)':'Reenviado ao cliente (aprovação de legendas/artes)'),
        by:u.name||'', byId:u.id||null,
        at:now, client:t.client||'', channel:'whatsapp_fallback', clientTo:cflow, phase:phase
      })
    });
    if(t){t.clientFlowStatus=cflow;t.clientApprovalPhase=phase;}
  }catch(e){console.warn('persistClientSend',e);}
  // Bug 1.0.133 (notificação inicial): o envio real é manual (WhatsApp Business) e NUNCA
  // passava pelo Worker — themes_sent_to_client não disparava nem com avisos ativados.
  // Avisa o Notification Engine via team-action 'contentSent' (Bearer teamSessionJwt +
  // idempotência). BEST-EFFORT: sem JWT ou sem rede, segue em silêncio — o WhatsApp
  // continua sendo o canal principal; o Worker loga push real × fallback whatsapp_premium.
  try{
    const token=t&&(t.clientReviewToken||t.shareToken)||'';
    // JWT ausente/expirado → modal de renovação (senha não persistida). Recusou? Erro
    // CLARO, nunca silêncio: o cliente segue avisado pelo WhatsApp, sem push.
    if(token&&!(await ensureTeamSession())){
      flashToast('Aviso em tempo real NÃO enviado — sessão de equipe não renovada. O cliente ainda recebe pelo WhatsApp.');
    }
    const jwt=localStorage.getItem('wp_team_jwt')||'';
    if(token&&jwt){
      const idem=(u.id||'')+'|sent|'+taskId+'|'+Math.floor(now/10000);
      const res=await fetch(CLIENT_REVIEW_BASE+'/cliente/cronograma/'+encodeURIComponent(token)+'/team-action',{
        method:'POST',
        headers:{'Content-Type':'application/json','Idempotency-Key':idem,'Authorization':'Bearer '+jwt},
        body:JSON.stringify({action:'contentSent',byName:u.name||''})
      });
      if(res.status===401){localStorage.removeItem('wp_team_jwt');
        flashToast('Aviso em tempo real NÃO enviado (sessão expirada) — saia e entre novamente. O cliente ainda recebe pelo WhatsApp.');}
      else{const j=await res.json().catch(()=>null);
        const p=j&&j.push;console.log('[contentSent] push=',p?JSON.stringify(p):'(sem resposta)');
        if(p&&p.sent>0)flashToast('Cliente avisado por notificação em tempo real.');
        else if(p&&p.reason==='send_failed')flashToast('Falha REAL no envio do aviso ('+(p.error||'push_send_failed')+') — cliente segue avisado pelo WhatsApp.');}
    }
  }catch(e){console.warn('contentSent (best-effort)',e&&e.message);}
}

// Abrir WhatsApp: tenta o app instalado (whatsapp://) via shell.openExternal;
// se o SO nao abrir, cai para o WhatsApp Web. Fora do Electron, abre o web.
// As URLs aqui sao TECNICAS e usadas SO para abrir o app — nunca como conteudo.
function openWhatsApp(appUrl,webUrl){
  const ext=window.desktopAPI&&window.desktopAPI.openExternal;
  if(ext){
    Promise.resolve(ext(appUrl)).then(ok=>{ if(ok===false){ ext(webUrl); } })
      .catch(()=>{ try{ext(webUrl);}catch(_){} });
  }else{
    try{window.open(webUrl,'_blank');}catch(_){}
  }
}
// 1.0.119-whatsapp-clean-send-hotfix — abre SOMENTE o WhatsApp (app nativo ou web), SEM
// nenhuma mensagem na URL. NUNCA usa send?text=. A mensagem limpa vai pelo CLIPBOARD; o
// usuário cola no chat. Isso impede que a URL técnica vá parar no chat do cliente.
function openWhatsAppPlain(){
  const ext=window.desktopAPI&&window.desktopAPI.openExternal;
  const APP='whatsapp://', WEB='https://web.whatsapp.com/';
  if(ext){
    Promise.resolve(ext(APP)).then(ok=>{ if(ok===false){ ext(WEB); } })
      .catch(()=>{ try{ext(WEB);}catch(_){} });
  }else{
    try{window.open(WEB,'_blank');}catch(_){}
  }
}

  if(!a)return false;
  const isField=(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);

function canSendToClient(f){
  if(!f||!f.sector)return false;
  if(secOf(f.sector).key!=='cronograma')return false;
  if(!f.client||!String(f.client).trim())return false;
  const filled=(f.contents||[]).filter(c=>c&&(c.tema||c.legenda)).length;
  if(filled<1)return false;
  const u=state.user;if(!u)return false;
  return canSeeAll(u); // Admin/Manager/Social — ja modelado em MANAGER_KW
}

  bind('[data-item]',e=>state.form.items[+e.dataset.item]=e.value);

function composedDesc(){const f=state.form;const sub=curSub();const t=tpl();let lines=[];
  if(sub)lines.push(sub.formTitle);
  const fields=(sub?sub.fields:(t?t.fields:[]))||[];
  fields.forEach(fl=>{const v=f.fields[fl.k];if(v!==undefined&&v!==''&&v!==false)lines.push(fl.l+': '+(v===true?'Sim':v));});
  if(sub&&sub.contentCount){for(let i=0;i<sub.contentCount;i++){const c=f.contents[i];if(c&&(c.tema||c.legenda)){lines.push('Conteúdo '+(i+1)+':');if(c.tema)lines.push('  Tema: '+c.tema);if(c.legenda)lines.push('  Legenda: '+c.legenda);}}}
  if(sub&&sub.items){for(let i=0;i<sub.items;i++){if(f.items[i])lines.push((sub.itemLabel||'Item')+' '+(i+1)+': '+f.items[i]);}}
  if(f.obs)lines.push('',f.obs);
  return lines.join('\n').trim();
}
async function saveTask(){const f=state.form;
  if(!f)return;
  // 1.0.104 — trava anti-duplo-envio: dois cliques rápidos em "Confirmar/Enviar" criavam
  // DOIS docs de tarefa (duas telas/cards). Um único add por submissão.
  if(f._saving)return; f._saving=true;
  if(!f.sector){f._saving=false;alert('Selecione o setor.');f.step=0;render();return;}
  const t=tpl();
  if(t&&t.clientRequired&&!f.client.trim()){f._saving=false;alert('Para Cronograma o cliente é obrigatório.');f.step=1;render();return;}
  if(!f.title.trim()){f._saving=false;alert('Informe o título.');f.step=1;render();return;}
  const u=f.assigneeId?state.users.find(x=>x.id===f.assigneeId):null;
  const data={title:f.title.trim(),client:f.client.trim(),sector:f.sector,desc:composedDesc(),status:f.status,assignee:u?u.name:'',assigneeId:f.assigneeId||null,link:f.link.trim(),priority:!!f.priority,startDate:f.startDate||'',startTime:f.startTime||'',endDate:f.endDate||'',endTime:f.endTime||'',dueDate:f.dueDate||'',dueTime:f.dueTime||'',due:f.dueDate||'',checklist:f.checklist.filter(c=>c.t.trim()),by:state.user.id,createdAt:Date.now(),src:'webpreview'};
  if(f.contents.length)data.cronContents=f.contents;
  // EIXO SOCIAL (aditivo): dono social = responsável social, senão o criador se for social.
  // Persistido p/ a tarefa NÃO sair do quadro da Social Media ao ser enviada a um designer.
  const socialOwner=(u&&isSocialUser(u))?u:(isSocialUser(state.user)?state.user:null);
  if(socialOwner){data.socialOwnerId=socialOwner.id;data.socialOwnerName=socialOwner.name||'';data.socialFlowStatus='afazer';data.socialWorkflowStage='afazer';}
  // Aditivo: cronograma inicia em 'rascunho_social' (ou 'pronto_cliente' se chamada do botao Enviar)
  if(secOf(f.sector).key==='cronograma'){data.cronStatus=f._sendAfterSave?'pronto_cliente':'rascunho_social';if(f.subtype)data.cronSub=f.subtype;
    data.clientFlowStatus=f._sendAfterSave?'enviado':'afazer';data.clientWorkflowStage=data.clientFlowStatus;}
  const sendAfter=!!f._sendAfterSave;
  let ref;
  try{ref=await db.collection('tasks').add(data);}
  catch(e){f._saving=false;console.warn('saveTask add',e);alert('Não foi possível salvar a tarefa. Verifique a conexão e tente novamente.');render();return;}
  const sector=f.sector;state.form=null;
  if(sendAfter&&ref&&ref.id){
    // mantemos o board aberto e abrimos o modal de envio com a tarefa recem-criada
    state.tab='tarefas';state.boardSector=sector;boardCol=0;render();
    openSendClientModal({id:ref.id,client:data.client,title:data.title,cronContents:data.cronContents||[],cronSub:data.cronSub,cronStatus:data.cronStatus});
  }else{
    state.tab='tarefas';state.boardSector=sector;boardCol=0;render();
  }
}

/* ---- EVENT DELEGATION ----
   ATENCAO: o handler fica em `document` (nao em #app) porque os modais sao
   injetados em #modalRoot, que e IRMAO de #app. Preso em #app, nenhum clique
   dentro de um modal era capturado -> seletor de responsavel/mover status/
   sheets ficavam mortos. Em document, captura tudo (com guarda de sessao). */
// FIEL À REFERÊNCIA em qualquer tela: o print autoritativo é um frame 1366×768. Em telas
// MAIORES, escala a composição inteira (zoom) — a relação card × coluna × quadro do print
// vale em 1080p/1440p, em vez de coluna gigante com card perdido. Em telas ≤ referência,
// zoom 1 (os media de altura cuidam do encaixe). Teto 1.5 p/ não exagerar em 4K.
function fitZoom(){
  if(typeof isDesktop==='function'&&!isDesktop())return;
  const z=Math.min(1.5,Math.max(1,Math.min(window.innerWidth/1366,window.innerHeight/812)));
  document.body.style.zoom=z>1.005?z.toFixed(3):'';
  document.documentElement.style.setProperty('--fitz',z>1.005?z.toFixed(3):'1');
}
window.addEventListener('resize',fitZoom);
fitZoom();
// popover '⋯' do card V4: PORTAL no <body> (escapa contain/overflow). Fecha devolvendo o nó
// ao card de origem; fecha também em rolagem/resize/Escape para não ficar "órfão" do botão.
function closeCardMenus(){
  document.querySelectorAll('.tcv4-menu.open').forEach(m=>{m.classList.remove('open');m.style.left='';m.style.top='';
    const host=document.querySelector('[data-cardmenu="'+(m.dataset.menuOf||'')+'"]');
    const w=host&&host.closest('.tcv4-more');if(w)w.appendChild(m);else m.remove();});
  document.querySelectorAll('.tcv4-more.open').forEach(x=>x.classList.remove('open'));
}
document.addEventListener('scroll',closeCardMenus,true);
window.addEventListener('resize',closeCardMenus);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCardMenus();});
document.addEventListener('click',async e=>{
  if(!state.user)return;                       // login tem seu proprio handler
  if(!(e.target&&e.target.closest))return;
  const g=sel=>e.target.closest(sel);let el;
  if(el=g('[data-tab]')){state.form=null;state.boardSector=null;state.personBoard=null;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.tab=el.dataset.tab;closeModal();render();return;}
  if(el=g('[data-fab]')){closeModal();if(state.tab==='tarefas')openTaskForm(state.boardSector);else{state.tab='tarefas';openTaskForm(null);}return;}
  if(el=g('[data-sector]')){state.boardSector=el.dataset.sector;state.personBoard=null;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;boardCol=0;boardMine=false;boardQuery='';render();return;}
  if(el=g('[data-myboard]')){state.personBoard=state.user&&state.user.id;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-roleboards]')){state.roleBoards=true;state.personBoard=null;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-personboard]')){state.personBoard=el.dataset.personboard;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-flowclient]')){state.flowView='client';state.designerBoard=null;state.socialBoard=null;state.personBoard=null;state.roleBoards=false;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-flowdesigners]')){state.flowView='designers';state.designerBoard=null;state.socialBoard=null;state.personBoard=null;state.roleBoards=false;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-designerboard]')){state.flowView='designers';state.designerBoard=el.dataset.designerboard;state.socialBoard=null;boardQuery='';render();return;}
  if(el=g('[data-flowsocials]')){state.flowView='socials';state.socialBoard=null;state.designerBoard=null;state.personBoard=null;state.roleBoards=false;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-socialboard]')){state.flowView='socials';state.socialBoard=el.dataset.socialboard;state.designerBoard=null;boardQuery='';render();return;}
  if(el=g('[data-board]')){const a=el.dataset.board;
    if(a==='back')state.boardSector=null;
    else if(a==='hub'){state.boardSector=null;state.personBoard=null;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;}
    else if(a==='roleboards'){state.personBoard=null;state.roleBoards=true;}
    else if(a==='flowdesigners'){state.designerBoard=null;state.socialBoard=null;state.flowView='designers';}
    else if(a==='flowsocials'){state.socialBoard=null;state.designerBoard=null;state.flowView='socials';}
    else if(a==='new'){openTaskForm(state.boardSector);return;}
    render();return;}
  if(el=g('[data-bcol]')){boardCol=+el.dataset.bcol;render();return;}
  if(el=g('[data-bmine]')){boardMine=!boardMine;render();return;}
  if(el=g('[data-ag]')){const a=el.dataset.ag;if(a==='today'){agCursor=new Date();agSel=todayStr();}else if(a==='prev')agCursor.setMonth(agCursor.getMonth()-1);else if(a==='next')agCursor.setMonth(agCursor.getMonth()+1);else if(a==='vmonth')agView='month';else if(a==='vlist')agView='list';render();return;}
  if(el=g('[data-agf]')){agFilter=el.dataset.agf;render();return;}
  if(el=g('[data-day]')){agSel=el.dataset.day;render();return;}
  // menu '⋯' do card V4: popover FIXED via PORTAL no <body>, ancorado ao botão (abre para
  // cima; vira para baixo se faltar espaço; nunca é cortado). Clique fora fecha todos.
  if(el=g('[data-cardmenu]')){const w=el.closest('.tcv4-more');const open=w.classList.contains('open');
    closeCardMenus();
    if(!open){w.classList.add('open');const m=w.querySelector('.tcv4-menu');if(m){
      document.body.appendChild(m);m.classList.add('open');
      // calibração: sob zoom (fitZoom), 'left:Npx' não pinta em N px de viewport — mede-se
      // onde 0 e 100 caem de verdade e converte (funciona em zoom legado E padronizado).
      m.style.left='0px';m.style.top='0px';
      const c0=m.getBoundingClientRect();
      m.style.left='100px';m.style.top='100px';
      const c1=m.getBoundingClientRect();
      const kx=(c1.left-c0.left)/100||1,ky=(c1.top-c0.top)/100||1;
      const r=el.getBoundingClientRect(),mr0=m.getBoundingClientRect(),mw=mr0.width,mh=mr0.height;
      let lf=Math.max(8,Math.min(r.right-mw,window.innerWidth-mw-8));
      let tp=r.top-mh-8;if(tp<8)tp=Math.min(r.bottom+8,window.innerHeight-mh-8);
      m.style.left=((lf-c0.left)/kx)+'px';m.style.top=((tp-c0.top)/ky)+'px';}}
    return;}
  closeCardMenus();
  if(el=g('[data-detail]')){openDetails(el.dataset.detail);return;}
  if(el=g('[data-move]')){openMove(el.dataset.move);return;}
  if(el=g('[data-domove]')){const parts=el.dataset.domove.split('|');await moveStatus(parts[0],parts[1]);return;}
  if(el=g('[data-del]')){openDeleteConfirm(el.dataset.del);return;}
  if(el=g('[data-dodelete]')){await deleteTask(el.dataset.dodelete);return;}
  if(el=g('[data-modalclose]')){closeModal();return;}
  if(el=g('[data-formgoto]')){const v=el.dataset.formgoto;if(v==='resp'){state.form.step=1;render();openAssignee();}else{state.form.step=+v;render();}return;}
  if(el=g('[data-sendclient]')){
    // se estamos no wizard (state.form), salva primeiro com cronStatus=pronto_cliente e entao abre o modal de envio
    if(state.form){state.form._sendAfterSave=true;await saveTask();}
    else{openSendClientModal(state.tasks.find(x=>x.id===el.dataset.taskid));}
    return;
  }
  if(el=g('[data-senddesigner]')){openDesignerModal(el.dataset.senddesigner);return;}
  // detail-hierarchy-v2: marcar item(ns) como corrigido(s) + atalho p/ quadro do designer
  if(el=g('[data-teamfix]')){await markItemsAdjusted(el.dataset.teamfix);return;}
  if(el=g('[data-goboard]')){closeModal();state.flowView='designers';state.designerBoard=el.dataset.goboard;state.personBoard=null;state.boardSector=null;state.socialBoard=null;render();return;}
  if(el=g('[data-pickdesigner]')){const p=el.dataset.pickdesigner.split('|');openDesignerDeadline(p[0],p[1]);return;}
  if(el=g('[data-designersend]')){
    const p=el.dataset.designersend.split('|');const gid=id=>document.getElementById(id);
    const sd=(gid('dlSd')||{}).value||'',st=(gid('dlSt')||{}).value||'',ed=(gid('dlEd')||{}).value||'',et=(gid('dlEt')||{}).value||'',obs=(gid('dlObs')||{}).value||'';
    const err=gid('dlErr');const fail=m=>{if(err)err.textContent=m;};
    if(!sd||!st||!ed||!et){fail('Preencha início e término completos (data e hora).');return;}
    const sMs=dtMs(sd,st),eMs=dtMs(ed,et);
    if(eMs!=null&&sMs!=null&&eMs<sMs){fail('O término não pode ser antes do início.');return;}
    sendToDesigner(p[0],p[1],{startDate:sd,startTime:st,endDate:ed,endTime:et,obs:obs});
    return;
  }
  if(el=g('[data-itemfix]')){const p=el.dataset.itemfix.split('|');openItemFix(p[0],+p[1],p[2]);return;}
  if(el=g('[data-itemfixsave]')){const p=el.dataset.itemfixsave.split('|');const ta=document.getElementById('ifIn');const val=ta?ta.value:'';saveItemFix(p[0],+p[1],p[2],val,p[3]==='resend');return;}
  if(el=g('[data-ceopen]')){openContentEditor(el.dataset.ceopen);return;}
  if(el=g('[data-cesave]')){saveContentEdits(el.dataset.cesave);return;}
  if(el=g('[data-prodopen]')){openProductionModal(el.dataset.prodopen);return;}
  if(el=g('[data-prodclear]')){const[i,k]=el.dataset.prodclear.split('|');if(k==='feed')state._prod.items[+i].feedImageUrl='';else state._prod.items[+i].storyImageUrl='';renderProductionModal();return;}
  if(el=g('[data-prodsave]')){saveProduction(el.dataset.prodsave,false);return;}
  if(el=g('[data-prodresend]')){saveProduction(el.dataset.prodresend,true);return;}
  if(el=g('[data-sendclient-task]')){const t=state.tasks.find(x=>x.id===el.dataset.sendclientTask);if(t)openSendClientModal(t);return;}
  if(el=g('[data-clientview]')){openClientView(el.dataset.clientview||(state._sendCtx&&state._sendCtx.id));return;}
  if(el=g('[data-clientviewback]')){closeClientView();return;}
  if(el=g('[data-clientact]')){const a=el.dataset.clientact;if(a==='aprovar'){clientReviewAction(state.clientView,'aprovar','');}else{state.clientAction=a;render();}return;}
  if(el=g('[data-clientcancel]')){state.clientAction=null;render();return;}
  if(el=g('[data-clientsubmit]')){const kind=el.dataset.clientsubmit;const ta=document.getElementById('cvwNote');const note=ta?ta.value.trim():'';if((kind==='revisao'||kind==='editar')&&!note){flashToast('Descreva o que precisa antes de enviar.');if(ta)ta.focus();return;}clientReviewAction(state.clientView,kind,note);return;}
  if(el=g('[data-copymsg]')){copyClientMessage(el);return;}
  if(el=g('[data-openwa]')){
    const id=el.dataset.openwa;
    const ctx=state._sendCtx;if(!ctx){closeModal();return;}
    // HOTFIX (link orfao): ULTIMA confirmacao antes de abrir o WhatsApp. Para uma
    // tarefa salva, re-garante que o token do ctx esta REALMENTE no Firestore. Se a
    // confirmacao falhar, NAO abre o WhatsApp com link orfao — avisa e mantem o modal.
    if(id&&id!=='__form__'){
      try{
        const tok=await ensureReviewToken(id);
        if(tok)ctx.token=tok;                 // garante que a msg use o token confirmado
      }catch(e){
        console.warn('ensureReviewToken (openwa)',e);
        flashToast('Não foi possível confirmar o link do cliente. Verifique a conexão e tente novamente.');
        return;                               // aborta: nada de link orfao no WhatsApp
      }
      if(!ctx.token){ flashToast('Link do cliente indisponível. Tente novamente.'); return; }
    }
    // 1.0.119 — COPIA só a mensagem limpa e abre o WhatsApp SEM texto na URL.
    // NUNCA envia send?text= ao cliente. O usuário cola a mensagem no chat.
    const msg=buildClientMessage(ctx);
    copyToClipboard(msg);
    if(id&&id!=='__form__')await persistClientSend(id);
    closeModal();
    openWhatsAppPlain();
    flashToast('Mensagem copiada. Cole no WhatsApp (e anexe a imagem do card).');
    return;
  }
  if(el=g('[data-sheet]')){openSheet(el.dataset.sheet);return;}
  if(el=g('[data-cfgnotiftest]')){try{window.desktopAPI&&window.desktopAPI.notifTest&&window.desktopAPI.notifTest();}catch(_){}flashToast('Notificação de teste disparada.');return;}
  if(el=g('[data-logout]')){closeModal();logout();return;}
  if(el=g('[data-pickasg]')){if(state.form){const id=el.dataset.pickasg||null;state.form.assigneeId=id;const u=id?state.users.find(x=>x.id===id):null;state.form.assignee=u?(u.name||''):'';}closeModal();render();return;}
  if(el=g('[data-form]')){const a=el.dataset.form;if(a==='close'){state.form=null;render();}else if(a==='back'){state.form.step=Math.max(0,state.form.step-1);render();}else if(a==='next')stepNext();else if(a==='save')await saveTask();return;}
  if(el=g('[data-fsector]')){state.form.sector=el.dataset.fsector;state.form.subtype=null;state.form.contents=[];state.form.checklist=[];render();return;}
  if(el=g('[data-fstatus]')){state.form.status=el.dataset.fstatus;render();return;}
  if(el=g('[data-ftoggle]')){state.form[el.dataset.ftoggle]=!state.form[el.dataset.ftoggle];render();return;}
  if(el=g('[data-fsub]')){state.form.subtype=el.dataset.fsub;state.form.checklist=[];state.form.contents=[];state.form._openContent=0;render();return;}
  if(el=g('[data-fchoice]')){const p=el.dataset.fchoice.split('|');state.form.fields[p[0]]=p[1];render();return;}
  if(el=g('[data-fbool]')){const k=el.dataset.fbool;state.form.fields[k]=!state.form.fields[k];render();return;}
  if(el=g('[data-content]')){state.form._openContent=(state.form._openContent===+el.dataset.content)?null:+el.dataset.content;render();return;}
  if(el=g('[data-chkadd]')){state.form.checklist.push({t:'',d:false});render();return;}
  if(el=g('[data-chkdel]')){state.form.checklist.splice(+el.dataset.chkdel,1);render();return;}
  if(el=g('[data-assignee]')){openAssignee();return;}
});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('modal-back'))closeModal();});
// 1.0.102 — ao sair de um campo, se houve render adiado durante a edição, aplica agora.
document.addEventListener('focusout',function(){if(_deferRender)setTimeout(function(){if(!_editingNow()){_deferRender=false;render();}},80);});
function stepNext(){const f=state.form;
  if(f.step===0&&!f.sector){alert('Escolha o setor.');return;}
  if(f.step===1){const t=tpl();if(t&&t.clientRequired&&!f.client.trim()){alert('Para Cronograma o cliente é obrigatório.');return;}if(!f.title.trim()){alert('Informe o título.');return;}}
  f.step=Math.min(3,f.step+1);render();
}

try{window.desktopAPI&&window.desktopAPI.onNotifOpen(function(t){if(!state.user)return;if(t&&t.indexOf("client/")===0){openClientView(t.slice(7));return;}else if(t&&t.indexOf("board/")===0){state.tab="tarefas";state.boardSector=t.slice(6);}else if(t=="agenda"){state.tab="agenda";state.boardSector=null;}render();})}catch(_){}
function afterClientView(){const ta=document.getElementById('cvwNote');if(ta){ta.focus();}}
(async function boot(){
  renderLogin();
  const uid=localStorage.getItem('wp_uid');
  if(uid){try{const doc=await db.collection('users').doc(uid).get();if(doc.exists){startApp(Object.assign({id:doc.id},doc.data()));return;}}catch(_){}clearSession();}
})();
