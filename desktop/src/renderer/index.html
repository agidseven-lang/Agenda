/* ===== P3/P4 — Fluxo do Cliente x Fluxo dos Designers ===== */
// ===== EIXOS SEPARADOS (visibility-fix) =====
// Designer flow: a tarefa foi atribuída a um designer (designerAssignment.designerId).
function hasDesigner(t){return !!(t&&t.designerAssignment&&t.designerAssignment.designerId);}
function isDesignerFlow(t){return hasDesigner(t);}
function designerOf(t){return (t&&t.designerAssignment&&t.designerAssignment.designerId)||(t&&t.assigneeId)||null;}
// Client flow: TODO cronograma vive no fluxo do cliente — INDEPENDENTE do designer.
// A tarefa só "conclui" o fluxo do cliente na aprovação final (clientFlowStatus='concluido').
function isClientFlow(t){return !!t&&secOf(t.sector).key==='cronograma';}
// Colunas do FLUXO DO CLIENTE (eixo próprio, separado do designer).
const CLIENT_COLS=[
  {key:'afazer',    label:'A Fazer',                     color:'#6E7480'},
  {key:'enviado',   label:'Temas enviados ao cliente',   color:'#5B6CFF'},
  {key:'aprovado',  label:'Temas aprovados pelo cliente',color:'#22D3EE'},
  {key:'producao',  label:'Em produção',                 color:'#A78BFA'},
  {key:'revisao',   label:'Ajuste solicitado pelo cliente',color:'#F59E0B'},
  {key:'reenviado', label:'Reenviado ao cliente',        color:'#34D399'},
  {key:'concluido', label:'Concluído final',             color:'#10B981'},
];
// Coluna do cliente: usa clientFlowStatus (gravado por Worker/Desktop); senão deriva (compat).
function clientCol(t){
  const v=(t&&t.clientFlowStatus||'').toString();
  if(CLIENT_COLS.some(c=>c.key===v)){
    // 'concluido' explícito só vale se o fluxo realmente encerrou; senão ainda é reenvio/aprov. final.
    if(v==='concluido'&&!isFullyComplete(t))return 'reenviado';
    return v;
  }
  const ws=(t&&t.workflowStage||'').toString();
  const cs=(t&&t.cronStatus||'').toString();
  const cr=(t&&t.clientReview&&t.clientReview.status||'').toString();
  // CORREÇÃO (status-consistency): o status BRUTO do kanban (t.status==='concluido')
  // NÃO força mais a coluna 'concluido'. Conclusão só via isFullyComplete (aprovação final real).
  if(isFullyComplete(t))return 'concluido';
  if(cr==='revisao'||cs==='em_revisao_cliente'||cs==='editado_cliente')return 'revisao';
  if(cs==='ready_for_final_client_review'||cs==='reenviado_cliente')return 'reenviado';
  if(hasDesigner(t)||cs==='sent_to_designer'||ws==='producao'||ws==='entrega'||ws==='revisao_final')return 'producao';

/* ===== FLUXO DAS SOCIAL MEDIAS (eixo próprio, por Social Media) ===== */
// É Social Media? cargo contém "social" (espelha MANAGER_KW). Admin é tratado à parte.
function isSocialUser(u){return !!u&&norm(u.role||'').includes('social');}
// Social media "dona" da tarefa: socialOwnerId explícito; senão criador (by) se social; senão responsável se social.
function socialOf(t){
  if(t&&t.socialOwnerId)return t.socialOwnerId;
  const byU=t&&state.users.find(u=>u.id===t.by); if(byU&&isSocialUser(byU))return t.by;
  const asU=t&&state.users.find(u=>u.id===t.assigneeId); if(asU&&isSocialUser(asU))return t.assigneeId;
  return null;
}
function socialUsers(){return state.users.filter(u=>u&&!['pendente','removido','excluido'].includes(u.status||'')&&isSocialUser(u));}
// Coluna do quadro da Social Media: cronograma deriva do eixo do cliente; demais usam status.
function socialCol(t){
  if(secOf(t.sector).key==='cronograma'){const c=clientCol(t);
    if(c==='concluido')return 'concluido';if(c==='revisao')return 'revisao';if(c==='afazer')return 'afazer';
    return 'andamento';}                 // enviado/aprovado/producao/reenviado = em andamento (produzindo/acompanhando)
  return t.status||'afazer';
}

/* ===== EIXO OPERACIONAL (status REAL da operação ≠ aprovação do cliente) =====
   A aprovação parcial do cliente NÃO conclui a operação: enquanto faltar designer,
   legenda, post ou aprovação final, a tarefa fica num estágio operacional aberto. */
const OPERATIONAL_COLS=[
  {key:'afazer',              label:'A Fazer',                          color:'#6E7480'},
  {key:'producao',            label:'Aguardando aprovação dos temas',   color:'#22D3EE'},
  {key:'aguardando_envio',    label:'Aguardando envio ao designer',     color:'#22D3EE'},
  {key:'aguardando_designer', label:'Designer em produção',             color:'#A78BFA'},
  {key:'aguardando_legenda',  label:'Aguardando legendas e posts',      color:'#5B6CFF'},
  {key:'aguardando_revisao',  label:'Ajuste solicitado pelo cliente',   color:'#F59E0B'},
  {key:'aguardando_final',    label:'Aguardando aprovação final',       color:'#34D399'},
  {key:'concluido',           label:'Concluído final',                  color:'#10B981'},
];
const OP_KEYS=OPERATIONAL_COLS.map(c=>c.key);
// Há produção pendente? (alguma legenda vazia OU algum Feed sem arte)
function pendingLegend(t){const a=Array.isArray(t.cronContents)?t.cronContents:[];return !a.length||a.some(c=>!(c&&c.legenda&&String(c.legenda).trim()));}
function pendingFeed(t){const a=Array.isArray(t.cronContents)?t.cronContents:[];return !a.length||a.some(c=>!(c&&c.feedImageUrl));}
function pendingStory(t){const a=Array.isArray(t.cronContents)?t.cronContents:[];return a.some(c=>c&&c.storyImageUrl)&&a.some(c=>!(c&&c.storyImageUrl));}
function pendingProduction(t){return pendingLegend(t)||pendingFeed(t);}
function designerDelivered(t){return hasDesigner(t)&&designerCol(t)==='concluido';}
// Ajuste pedido pelo cliente em ALGUM conteúdo (aprovação parcial) — via clientItems granular.
function hasPendingItemRevision(t){const ci=t&&t.clientItems;if(!ci||typeof ci!=='object')return false;return Object.keys(ci).some(k=>{const cs=ci[k]&&ci[k].cs;return cs==='em_revisao'||cs==='editado';});}
/* ===== FONTE ÚNICA DA VERDADE — o fluxo está REALMENTE encerrado? =====
   "Concluído" exige aprovação FINAL do cliente E zero pendências operacionais.
   O status BRUTO do kanban (t.status) NUNCA, sozinho, conclui um cronograma. */
function isFullyComplete(t){
  if(secOf(t.sector).key!=='cronograma')return (t&&t.status)==='concluido';
  // Guardas duras: qualquer pendência aberta => NUNCA concluído.
  if(hasDesigner(t)&&!designerDelivered(t))return false;                 // designer ainda produzindo
  if(pendingProduction(t))return false;                                  // legenda/Feed pendente
  if(pendingStory(t))return false;                                       // Story pendente (quando aplicável)
  if((t.clientReview&&t.clientReview.status)==='revisao')return false;   // revisão solicitada pelo cliente
  // Sinais DELIBERADOS de encerramento (escritos só na aprovação final pelo Worker/Desktop).
  return !!(t.finalApprovalCompleted===true||t.operationalStatus==='concluido'||t.clientFlowStatus==='concluido');
}
// Status operacional REAL — DERIVADO dos eixos + pendências (sempre dinâmico).
// 'concluido' tem caminho ÚNICO: isFullyComplete (aprovação final real + sem pendências).
function operationalCol(t){
  if(secOf(t.sector).key!=='cronograma')return t.status||'afazer';
  if(isFullyComplete(t))return 'concluido';                              // ÚNICO caminho para concluído
  const cf=clientCol(t);
  if(cf==='revisao'||hasPendingItemRevision(t))return 'aguardando_revisao'; // cliente pediu ajuste
  if(cf==='reenviado')return 'aguardando_final';
  if(hasDesigner(t)){
    if(designerCol(t)!=='concluido')return 'aguardando_designer';   // designer ainda produzindo
    return pendingProduction(t)?'aguardando_legenda':'aguardando_final'; // entregou: falta legenda/post ou pronto p/ reenvio
  }
  // SEM designer atribuído: NUNCA mostrar produção/legenda/entrega.
  if(cf==='aprovado')return 'aguardando_envio';                          // temas aprovados → falta ENVIAR ao designer
  if(cf==='afazer')return 'afazer';
  return 'producao';                                                  // enviado ao cliente, aguardando feedback
}
// "Próxima ação" em destaque para a Social/Admin.
function nextActionText(t){
  switch(operationalCol(t)){
    case 'afazer':              return 'Criar o cronograma e enviar ao cliente.';
    case 'producao':            return 'Enviado ao cliente. Próxima etapa: aguardar o feedback do cliente sobre os temas.';
    case 'aguardando_envio':    return 'Temas aprovados. Próxima etapa: enviar o cronograma ao designer.';
    case 'aguardando_designer': return 'Designer produzindo. Próxima etapa: aguardar a entrega do designer.';
    case 'aguardando_legenda':  return 'Designer entregou. Próxima etapa: revisar, adicionar legenda e posts (Feed/Story).';
    case 'aguardando_revisao':  return 'Cliente pediu ajuste. Próxima etapa: corrigir o conteúdo e reenviar pelo mesmo link.';
    case 'aguardando_final':    return 'Tudo pronto. Próxima etapa: reenviar ao cliente e aguardar a aprovação final.';
    case 'concluido':           return 'Aprovação final concluída. Tarefa encerrada operacionalmente.';
  }
  return 'Acompanhar o andamento.';
}
function opColOf(k){return OPERATIONAL_COLS.find(c=>c.key===k)||OPERATIONAL_COLS[0];}
// Bucket de 4 colunas (afazer/andamento/revisao/concluido) para os quadros por SETOR e
// "Meu quadro". Para CRONOGRAMA, deriva do eixo OPERACIONAL — assim o status BRUTO nunca
// coloca um cronograma em "Concluído" antes da aprovação final real (paridade com o card).
function boardCol4(t){
  if(secOf(t.sector).key!=='cronograma')return t.status||'afazer';
  const oc=operationalCol(t);
  if(oc==='concluido')return 'concluido';            // só quando isFullyComplete
  if(oc==='aguardando_revisao')return 'revisao';
  if(oc==='afazer')return 'afazer';
  return 'andamento';                                 // producao/aguardando_designer/legenda/final
}
/* 1.0.105 — COLUNAS POR CONTEXTO (reduz o excesso de colunas; o detalhe operacional
   continua visível no badge do card via taskCard). Cada quadro mostra só as colunas
   do SEU papel: Social=4, Designer=3, Cliente=4, Meu quadro/Setor=4. */
const SOCIAL_COLS4=[
  {key:'afazer',    label:'A Fazer',      color:'#9BA0AB'},
  {key:'andamento', label:'Em andamento', color:'#F59E0B'},
  {key:'revisao',   label:'Revisão',      color:'#60A5FA'},
  {key:'concluido', label:'Finalizado',   color:'#34D399'},
];
const DESIGNER_COLS3=[
  {key:'afazer',    label:'A Fazer',      color:'#9BA0AB'},

  {key:'entregue',  label:'Entregue',     color:'#34D399'},
];
const CLIENT_COLS4=[

  {key:'analise',  label:'Em análise',          color:'#22D3EE'},

  {key:'aprovado', label:'Aprovado',            color:'#34D399'},

// Bucket de 3 colunas do DESIGNER (a partir do eixo de trabalho do designer).
function designerCol3(t){const c=designerCol(t);return c==='concluido'?'entregue':(c==='afazer'?'afazer':'andamento');}
// Bucket de 4 colunas do CLIENTE (a partir do eixo do cliente).
function clientCol4(t){const c=clientCol(t);
  if(c==='revisao')return 'revisao';
  if(c==='aprovado'||c==='concluido')return 'aprovado';
  if(c==='producao'||c==='reenviado')return 'analise';
  return 'enviado';                                   // afazer/enviado
}
// Bucket de 4 colunas DERIVADO DO PAPEL DE QUEM VÊ. Se quem abre o quadro é o DESIGNER
// atribuído à tarefa, usa o eixo de trabalho do designer (assim um cronograma recém-enviado
// cai em "A Fazer" do designer — paridade com o Android). Senão, usa o eixo operacional.
function boardCol4For(t,uid){
  if(secOf(t.sector).key!=='cronograma')return t.status||'afazer';
  if(uid&&hasDesigner(t)&&designerOf(t)===uid){
    const dc=designerCol(t);
    return dc==='concluido'?'concluido':dc==='revisao'?'revisao':dc==='andamento'?'andamento':'afazer';
  }
  return boardCol4(t);
}

function fmtDateTimeBR(v){
  if(v===undefined||v===null||v==='')return 'Não informado';
  let ms=null;
  if(typeof v==='number')ms=v;
  else if(typeof v==='object'){if(typeof v.toDate==='function'){try{ms=v.toDate().getTime();}catch(_){}}else if(typeof v.seconds==='number')ms=v.seconds*1000;}
  else if(typeof v==='string'){const n=Number(v);if(v.trim()!==''&&!isNaN(n))ms=n;else{const dt=new Date(v);if(!isNaN(dt.getTime()))ms=dt.getTime();}}
  if(ms===null||isNaN(ms))return 'Não informado';
  const dt=new Date(ms),p=n=>String(n).padStart(2,'0');
  return p(dt.getDate())+'/'+p(dt.getMonth()+1)+'/'+dt.getFullYear()+' às '+p(dt.getHours())+':'+p(dt.getMinutes());
}
function cronOf(t){
  const arr=Array.isArray(t.cronContents)?t.cronContents:(Array.isArray(t.contents)?t.contents:null);
  if(!arr||!arr.length)return null;
  const list=arr.map((c,i)=>({tema:c&&c.tema,legenda:c&&c.legenda,_i:i})).filter(c=>c.tema||c.legenda);
  const count=arr.length;
  const label=count>=12?'Mensal':count>=6?'Quinzenal':count>=3?'Semanal':'Cronograma';
  return {list,count,label};
}
function lastUpdate(t){
  if(t.updatedAt)return t.updatedAt;
  if(Array.isArray(t.history)&&t.history.length){const ats=t.history.map(h=>h&&h.at).filter(Boolean);if(ats.length)return Math.max.apply(null,ats);}
  return t.doneAt||t.startedAt||null;
}

async function moveStatus(taskId,newStatus){

    if(newStatus!=='afazer'&&!t.startedAt)patch.startedAt=now;

// V1.0.98 — Fase de aprovação do cliente (espelha o Worker).
function clientApprovalPhaseOf(t){
  const e=(t&&t.clientApprovalPhase||'').toString();if(e==='themes'||e==='production'||e==='final')return e;
  if(t&&t.finalApprovalCompleted===true)return 'final';
  if(t&&(t.cronStatus==='ready_for_final_client_review'||t.workflowStage==='entrega'||t.workflowStage==='revisao_final'))return 'final';
  const arr=Array.isArray(t&&t.cronContents)?t.cronContents:[];const total=arr.length||0;
  if(total>0){const withLeg=arr.filter(c=>c&&c.legenda&&String(c.legenda).trim()).length;
    const withFeed=arr.filter(c=>c&&c.feedImageUrl).length;
    if(withLeg===total&&withFeed===total)return 'production';}
  return 'themes';
}

      '<button class="btn send-go" data-itemfixsave="'+taskId+'|'+idx+'|'+field+'|resend">'+svg('send')+'Salvar e reenviar ao cliente</button></div>'+
  '</div></div>';
  // 1.0.105 — foco GARANTIDO no PRIMEIRO clique (Problema do teste real: input "não
  // respondia de primeira"). autofocus + dupla tentativa via rAF e timeout, posicionando
  // o cursor no fim do texto. Idempotente e null-safe.
  var _focusIf=function(){var i=document.getElementById('ifIn');if(!i)return;try{i.focus();var n=(i.value||'').length;if(i.setSelectionRange)i.setSelectionRange(n,n);}catch(e){}};
  requestAnimationFrame(function(){_focusIf();requestAnimationFrame(_focusIf);});
  setTimeout(_focusIf,60);
}
async function saveItemFix(taskId,idx,field,val,resend){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const arr=Array.isArray(t.cronContents)?t.cronContents.slice():[];
  while(arr.length<=idx)arr.push({});
  const c=Object.assign({},arr[idx]||{});const old=field==='tema'?(c.tema||''):(c.legenda||'');
  if(field==='tema')c.tema=val;else c.legenda=val;arr[idx]=c;
  const now=Date.now();const u=state.user||{};
  const patch={cronContents:arr,
    history:firebase.firestore.FieldValue.arrayUnion({type:'social_corrigiu',label:'Social corrigiu '+(field==='tema'?'o tema':'a legenda')+' do Conteúdo '+(idx+1),
      by:u.name||'',byId:u.id||null,at:now,channel:'social_edit',contentIndex:idx,field:field,oldValue:String(old).slice(0,300),newValue:String(val).slice(0,300)})};
  t.cronContents=arr;
  closeModal();
  try{await db.collection('tasks').doc(taskId).update(patch);}catch(e){console.warn('saveItemFix',e);}
  flashToast('Correção salva no Conteúdo '+(idx+1)+'.');
  if(resend){const lt=state.tasks.find(x=>x.id===taskId)||t;openSendClientModal(lt);}
  else render();
}

async function sendToDesigner(taskId,designerId,dl){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const d=state.users.find(u=>u.id===designerId);if(!d)return;
  dl=dl||{};
  const now=Date.now();const u=state.user||{};
  const assignment={designerId:designerId,designerName:d.name||'',designerAvatar:d.photo||d.avatar||'',
    assignedAt:now,assignedBy:u.id||null,status:'sent',
    startDate:dl.startDate||'',startTime:dl.startTime||'',endDate:dl.endDate||'',endTime:dl.endTime||'',obs:dl.obs||''};
  const patch={
    designerAssignment:assignment,
    assigneeId:designerId,                 // isola no quadro do designer (visibleTasks)
    assignee:d.name||'',
    assigneeName:d.name||'',
    cronStatus:'sent_to_designer',
    status:'afazer',                       // entra na coluna A Fazer do designer
    // EIXOS SEPARADOS (visibility-fix): a tarefa CONTINUA no fluxo do cliente como
    // "Em produção" e ENTRA no quadro do designer em "A Fazer". Não some do Cliente.
    clientFlowStatus:'producao', clientWorkflowStage:'producao',
    designerFlowStatus:'afazer', designerWorkflowStage:'afazer',
    // EIXO OPERACIONAL (snapshot): aguardando o designer entregar.
    operationalStatus:'aguardando_designer', socialFlowStatus:'aguardando_designer', socialWorkflowStage:'aguardando_designer',
    designerResponsibleId:designerId, designerResponsibleName:(d.name||''),
    pendingDesignerDelivery:true, pendingSocialReview:true, finalApprovalRequired:true, finalApprovalCompleted:false,
    // Preserva o DONO SOCIAL: a tarefa continua no quadro da Social Media mesmo após
    // assigneeId virar o designer (socialOf usa socialOwnerId, não o assigneeId).
    socialOwnerId:(socialOf(t)||(isSocialUser(u)?u.id:null)),
    socialOwnerName:((state.users.find(x=>x.id===socialOf(t))||{}).name)||(isSocialUser(u)?u.name:'')||'',
    startedAt:null,                        // reinicia o tracking p/ o designer
    // PRAZO OBRIGATÓRIO (BUG3): início + término (data/hora). dueDate/dueTime = término,
    // para o card calcular "Atrasada" e o cron do Worker notificar atraso ao designer.
    startDate:dl.startDate||'',startTime:dl.startTime||'',
    endDate:dl.endDate||'',endTime:dl.endTime||'',
    dueDate:dl.endDate||'',dueTime:dl.endTime||'',
    lateNotifiedAt:null,                   // zera flag de atraso p/ o novo prazo
    history:firebase.firestore.FieldValue.arrayUnion({
      type:'enviado_designer',label:'Enviado ao designer '+(d.name||'')+(dl.endDate?(' · prazo '+fmtDateBR(dl.endDate)+(dl.endTime?' '+dl.endTime:'')):''),
      by:u.name||'',byId:u.id||null,at:now,designerId:designerId,channel:'designer_flow',
      startDate:dl.startDate||'',startTime:dl.startTime||'',endDate:dl.endDate||'',endTime:dl.endTime||'',note:dl.obs||''
    })
  };
  if(dl.obs&&String(dl.obs).trim())patch.desc=String(dl.obs).trim();
  // otimista
  Object.assign(t,{designerAssignment:assignment,assigneeId:designerId,assignee:d.name||'',assigneeName:d.name||'',cronStatus:'sent_to_designer',status:'afazer',
    clientFlowStatus:'producao',clientWorkflowStage:'producao',designerFlowStatus:'afazer',designerWorkflowStage:'afazer',
    startDate:dl.startDate||'',startTime:dl.startTime||'',endDate:dl.endDate||'',endTime:dl.endTime||'',dueDate:dl.endDate||'',dueTime:dl.endTime||''});
  closeModal();render();flashToast('Enviado para '+(d.name||'designer')+'. Notificação disparada.');
  try{
    await db.collection('tasks').doc(taskId).update(patch);
    fetch(CLIENT_REVIEW_BASE+'/notify-designer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:taskId})}).catch(()=>{});
  }catch(e){console.warn('sendToDesigner',e);}

function ikAuthUrl(){return CLIENT_REVIEW_BASE+'/imagekit-auth';}
// Upload real via ImageKit (mesmo padrão do PWA). Fora do ambiente sandbox a rede
// e liberada; aqui a UI tambem aceita colar URL como alternativa.
async function ikUpload(file,folder){
  const a=await fetch(ikAuthUrl()).then(r=>r.json());
  if(!a||!a.token||!a.signature||!a.expire)throw new Error('assinatura ImageKit inválida');
  const fd=new FormData();
  fd.append('file',file);fd.append('fileName',file.name||('art_'+Date.now()+'.jpg'));
  fd.append('publicKey',IK_PUBLIC_KEY);fd.append('signature',a.signature);
  fd.append('expire',String(a.expire));fd.append('token',a.token);
  fd.append('folder',folder||'/cronogramas');fd.append('useUniqueFileName','true');
  const up=await fetch('https://upload.imagekit.io/api/v1/files/upload',{method:'POST',body:fd});
  if(!up.ok)throw new Error('ImageKit '+up.status);
  const j=await up.json();if(!j||!j.url)throw new Error('ImageKit sem URL');return j.url;
}

// 1.0.119 — HARDENING: o link público do cliente NUNCA pode sair sem token. Se o token
// vier vazio/nulo, LANÇA (em vez de emitir .../cliente/cronograma/ sem token) — assim é
// impossível copiar/enviar um link incompleto. O fluxo de envio já garante o token
// (ensureReviewToken + read-back no Firestore) antes de montar a mensagem.
function buildPublicClientUrl(token){
  var t=(token==null?'':String(token)).trim();
  if(!t){throw new Error('buildPublicClientUrl: link do cliente NUNCA pode sair sem token');}
  return CLIENT_LINK_BASE+'/cliente/cronograma/'+t;
}
// Token seguro, aleatorio, nao previsivel (48 hex). Capability do link publico.
function genReviewToken(){
  const a=new Uint8Array(24);(self.crypto||window.crypto).getRandomValues(a);
  return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
}
// (2b) Link interno/deep-link (uso do time dentro do app; NUNCA vai na mensagem do cliente).
function buildInternalClientLink(ctx){return 'idseven://client/'+((ctx&&ctx.id)||'<id>');}

// (1) Mensagem profissional, texto humano, com LINK PÚBLICO HTTPS. Sem idseven://, sem encode.
function buildClientMessage(ctx){
  const nome=(ctx&&ctx.client)||'cliente';
  const tipoRaw=((ctx&&ctx.type)||'').toLowerCase().trim();
  const url=buildPublicClientUrl(ctx&&ctx.token);
  // 1.0.119-whatsapp-real-card-send — CAPTION CURTA e LIMPA. O card vai como IMAGEM REAL
  // anexada; o link (com token) fica sozinho num bloco abaixo. SEM duplicar periodicidade
  // (nunca "cronograma semanal (cronograma quinzenal)") — um único tipo correto.
  const tdc = (!tipoRaw) ? 'cronograma'
    : (tipoRaw.indexOf('cronograma')>=0 ? tipoRaw : ('cronograma '+tipoRaw));
  return 'Olá, '+nome+'. 👋\n\n'+
    'Seu *'+tdc+'* já está disponível para avaliação.\n\n'+
    'Toque no link abaixo para revisar e aprovar:\n\n'+
    url+'\n\n'+
    '*Equipe ID Seven*';
}

// (3) URLs TÉCNICAS — codificam a mensagem APENAS no momento de abrir o WhatsApp.
// 1.0.119-whatsapp-clean-send-hotfix — REMOVIDO o uso de send?text=. A mensagem NUNCA vai
// pela URL (evita que o cliente receba uma URL técnica web.whatsapp.com/send?text=...).
// Abrir WhatsApp = openWhatsAppPlain() (só app/site); mensagem = clipboard limpo.

// Garante que a tarefa tenha clientReviewToken + clientReviewUrl (gera e persiste se faltar).
// Funciona mesmo se a tarefa ainda nao chegou em state.tasks (recem-criada).
//
// HOTFIX (link orfao): ANTES, um update() com erro engolido (console.warn) retornava
// o token mesmo sem ter gravado -> o cliente recebia um link cujo token nunca foi salvo
// no Firestore, e o Worker respondia "Cronograma nao encontrado". Agora:
//   1) usa set(...,{merge:true}) em vez de update() -> robusto se o doc ainda nao existir
//      (corrida apos o add() do saveTask); continua aditivo (so mescla 2 campos).
//   2) NAO engole o erro: confirma a escrita com um get() de leitura (read-back).
//   3) se a gravacao/confirmacao falhar, LANCA -> o chamador aborta o envio em vez de
//      mandar um link orfao. So persiste a versao otimista em memoria APOS confirmar.
async function ensureReviewToken(taskId){
  if(!taskId)return null;
  const t=state.tasks.find(x=>x.id===taskId);
  if(t&&t.clientReviewToken)return t.clientReviewToken;
  const token=genReviewToken();const url=buildPublicClientUrl(token);
  // set merge: cria/mescla mesmo se o doc acabou de ser criado (sem depender de update).
  await db.collection('tasks').doc(taskId).set({clientReviewToken:token,clientReviewUrl:url},{merge:true});
  // Read-back: confirma que o token REALMENTE esta no servidor antes de liberar o envio.
  const snap=await db.collection('tasks').doc(taskId).get();
  const saved=snap&&snap.exists?snap.get('clientReviewToken'):null;
  if(saved!==token){throw new Error('clientReviewToken nao confirmado no Firestore');}
  // So agora atualiza o cache em memoria (estado consistente com o servidor).
  if(t){t.clientReviewToken=token;t.clientReviewUrl=url;}
  return token;
}

// 1.0.121-whatsapp-cloud-api-send — ENVIO AUTOMÁTICO OFICIAL (à prova de erro de verdade).
// O botão "Enviar card premium agora" chama a rota SEGURA do Worker (POST /client/send-premium-whatsapp),
// que envia a imagem real do card + legenda + link via WhatsApp Business Cloud API (server-side).
// O token da Meta NUNCA fica no client. Sucesso SÓ é exibido com message_id real devolvido pela Meta.
// Sem credenciais (503 WHATSAPP_CLOUD_API_NOT_CONFIGURED) → mensagem clara, sem cair para WhatsApp Web.
function _wireAutoSend(ctx){
  const $=id=>document.getElementById(id);
  const img=$('autoCardPreview');
  // Card oficial Aurora Glass embutido (mesma fonte do envio manual).
  try{ if(img) img.src='data:image/jpeg;base64,'+CARD_IMG_B64; }catch(_){ if(img) img.src=CARD_IMG_URL; }
  const btn=$('btnSendAuto'), status=$('autoStatus'), phoneEl=$('waPhone');
  function setStatus(txt,cls){ if(!status)return; status.className='gcs-status'+(cls?(' '+cls):''); status.textContent=txt; }
  if(!btn) return;
  btn.addEventListener('click', async function(){
    const phone=(phoneEl&&phoneEl.value||'').replace(/[^\d]/g,'');
    if(phone.length<10){ setStatus('Informe o WhatsApp do cliente com DDD (ex.: 55 11 99999-9999).','err'); if(phoneEl)phoneEl.focus(); return; }
    if(!ctx.token){ setStatus('Link do cliente sem token — gere o cronograma novamente.','err'); return; }
    btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=svg('send')+'Enviando…';
    setStatus('Enviando o card premium pela WhatsApp Cloud API…');
    // Payload: SOMENTE dados do cronograma/cliente. NENHUM segredo da Meta sai do client.
    const payload={ token:ctx.token, clientName:ctx.client||'', phone:phone, cronogramaTipo:ctx.type||'' };
    let r=null, data=null;
    try{
      r=await fetch(PREMIUM_SEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      try{ data=await r.json(); }catch(_){ data=null; }
    }catch(e){
      btn.disabled=false; btn.innerHTML=old;
      setStatus('Sem conexão com o servidor de envio. Verifique a internet e tente de novo.','err'); return;
    }
    // Cloud API ainda não configurada (sem secrets) — mensagem clara, sem fallback para WhatsApp Web.
    if((r&&r.status===503)||(data&&data.error==='WHATSAPP_CLOUD_API_NOT_CONFIGURED')){
      btn.disabled=false; btn.innerHTML=old;
      setStatus('A integração WhatsApp Cloud API ainda não está configurada. Configure as credenciais da Meta para habilitar o envio automático do card premium.','blocked');
      return;
    }
    // Sucesso REAL: só com message_id devolvido pela Meta.
    if(r&&r.ok&&data&&data.ok&&data.message_id){
      btn.innerHTML=svg('check')+'Enviado'; btn.classList.add('is-done');
      setStatus('Card premium enviado ao WhatsApp do cliente ✓ (id: '+esc(String(data.message_id))+').','ok');
      flashToast('Card premium enviado pelo WhatsApp (Cloud API).');
      return;
    }
    // Falha controlada — mostra o código retornado pelo Worker/Meta.
    btn.disabled=false; btn.innerHTML=old;
    const code=(data&&(data.error||data.status))||(r&&r.status)||'desconhecido';
    setStatus('Não foi possível enviar agora. Código: '+esc(String(code))+'. Nenhuma mensagem foi enviada.','err');
  });
}
// 1.0.120-whatsapp-guided-card-send — ASSISTENTE GUIADO em 3 ETAPAS BLOQUEADAS (à prova de erro).
// ETAPA 1: gera/salva a imagem REAL do card (Aurora Glass), copia a imagem p/ o clipboard (se
//          suportado) e abre a pasta. Só conclui se a imagem foi SALVA com sucesso.
// ETAPA 2: valida link+token e copia APENAS a legenda limpa. Liberada só após a etapa 1.
// ETAPA 3: abre SOMENTE https://web.whatsapp.com/ (sem send?text=). Liberada só após 1 e 2
//          (imagem salva + legenda copiada + link validado). NUNCA antes.
function _gateValidLink(ctx,msg){
  let url='';
  try{ url=buildPublicClientUrl(ctx&&ctx.token); }catch(_){ return {ok:false,url:''}; }
  const ok = !!url
    && url.indexOf('https://aprovar.agendaidseven.com.br/cliente/cronograma/')===0
    && !/\/cliente\/cronograma\/?$/.test(url)
    && !/workers\.dev/.test(url)
    && String(msg).indexOf(url)>-1;
  return {ok:ok,url:url};
}
function openWhatsAppWebOnly(){
  // ABRE SOMENTE https://web.whatsapp.com/ — nunca send?text=, nunca whatsapp://send.
  const ext=window.desktopAPI&&window.desktopAPI.openExternal;
  const WEB='https://web.whatsapp.com/';
  if(ext){ try{ ext(WEB); }catch(_){ try{window.open(WEB,'_blank');}catch(__){} } }
  else { try{window.open(WEB,'_blank');}catch(_){} }
  return WEB;
}

async function clientReviewAction(taskId,kind,note){
  const map={aprovar:{cronStatus:'aprovado_cliente',rev:'aprovado',type:'cliente_aprovou',label:'Cliente aprovou o cronograma'},
             revisao:{cronStatus:'em_revisao_cliente',rev:'revisao',type:'cliente_pediu_revisao',label:'Cliente pediu revisão'},
             editar:{cronStatus:'editado_cliente',rev:'editado',type:'cliente_editou',label:'Cliente solicitou edição'}};
  const m=map[kind];if(!m)return;
  const now=Date.now();const u=state.user||{};
  const t=state.tasks.find(x=>x.id===taskId)||null;
  const review={status:m.rev,note:note||'',at:now,byId:u.id||null,byName:u.name||''};
  const patch={
    cronStatus:m.cronStatus,
    clientReview:review,
    clientReviewAt:now,
    history:firebase.firestore.FieldValue.arrayUnion({
      type:m.type,label:m.label,by:u.name||'',byId:u.id||null,
      at:now,client:(t&&t.client)||(state._clientFallback&&state._clientFallback.client)||'',channel:'client_vision',note:note||''
    })
  };
  // atualizacao otimista (refletir imediato mesmo antes do round-trip),
  // tanto na tarefa ao vivo quanto no fallback (recem-criada ainda sem snapshot)
  if(t){t.cronStatus=m.cronStatus;t.clientReview=review;}
  if(state._clientFallback&&state._clientFallback.id===taskId){state._clientFallback.status=m.cronStatus;state._clientFallback._review=review;}
  state.clientAction=null;render();
  try{await db.collection('tasks').doc(taskId).update(patch);}catch(e){console.warn('clientReviewAction',e);}
  flashToast(kind==='aprovar'?'Cronograma aprovado. Equipe notificada.':kind==='revisao'?'Revisão enviada à equipe.':'Edição enviada à equipe.');
}
function flashToast(msg){
  let t=document.getElementById('flashToast');
  if(!t){t=document.createElement('div');t.id='flashToast';t.className='flash-toast';document.body.appendChild(t);}
  t.innerHTML=svg('info')+'<span>'+esc(msg)+'</span>';t.classList.add('show');
  clearTimeout(window.__ft);window.__ft=setTimeout(()=>t.classList.remove('show'),2600);
}
async function persistClientSend(taskId){
  const now=Date.now();const u=state.user||{};
  const t=state.tasks.find(x=>x.id===taskId)||{};
  // EIXO DO CLIENTE: 1º envio = 'enviado'; reenvio após revisão/produção = 'reenviado'.
  const prev=clientCol(t);
  const cflow=(prev==='revisao'||prev==='producao'||prev==='reenviado'||prev==='aprovado')?'reenviado':'enviado';
  // V1.0.98 — FASE de aprovação do cliente. 1º envio: 'themes'. Conteúdos com legenda+Feed: 'production'.
  const arr=Array.isArray(t.cronContents)?t.cronContents:[];const total=arr.length||0;
  const withLegend=arr.filter(c=>c&&c.legenda&&String(c.legenda).trim()).length;
  const withFeed=arr.filter(c=>c&&c.feedImageUrl).length;
  const phase=(prev==='afazer'||cflow==='enviado'||total===0||withLegend<total||withFeed<total)?'themes':'production';
  try{
    await db.collection('tasks').doc(taskId).update({
      cronStatus:'enviado_cliente',
      clientFlowStatus:cflow, clientWorkflowStage:cflow,
      clientApprovalPhase:phase,
      clientSentAt:now,
      clientSentBy:u.id||null,
      clientPreviewLink:'idseven://client/'+taskId,
      history:firebase.firestore.FieldValue.arrayUnion({
        type:'cronograma_enviado_cliente',
        label:(phase==='themes'?'Cronograma enviado ao cliente (aprovação de TEMAS)':'Reenviado ao cliente (aprovação de legendas/artes)'),
        by:u.name||'', byId:u.id||null,
        at:now, client:t.client||'', channel:'whatsapp_fallback', clientTo:cflow, phase:phase
      })
    });
    if(t){t.clientFlowStatus=cflow;t.clientApprovalPhase=phase;}
  }catch(e){console.warn('persistClientSend',e);}
}

// Abrir WhatsApp: tenta o app instalado (whatsapp://) via shell.openExternal;
// se o SO nao abrir, cai para o WhatsApp Web. Fora do Electron, abre o web.
// As URLs aqui sao TECNICAS e usadas SO para abrir o app — nunca como conteudo.
function openWhatsApp(appUrl,webUrl){
  const ext=window.desktopAPI&&window.desktopAPI.openExternal;
  if(ext){
    Promise.resolve(ext(appUrl)).then(ok=>{ if(ok===false){ ext(webUrl); } })
      .catch(()=>{ try{ext(webUrl);}catch(_){} });
  }else{
    try{window.open(webUrl,'_blank');}catch(_){}
  }
}
// 1.0.119-whatsapp-clean-send-hotfix — abre SOMENTE o WhatsApp (app nativo ou web), SEM
// nenhuma mensagem na URL. NUNCA usa send?text=. A mensagem limpa vai pelo CLIPBOARD; o
// usuário cola no chat. Isso impede que a URL técnica vá parar no chat do cliente.
function openWhatsAppPlain(){
  const ext=window.desktopAPI&&window.desktopAPI.openExternal;
  const APP='whatsapp://', WEB='https://web.whatsapp.com/';
  if(ext){
    Promise.resolve(ext(APP)).then(ok=>{ if(ok===false){ ext(WEB); } })
      .catch(()=>{ try{ext(WEB);}catch(_){} });
  }else{
    try{window.open(WEB,'_blank');}catch(_){}
  }
}

// 1.0.104 — guarda de edição ESCOPADA. Só adia o render (snapshot do Firestore) quando há
// uma edição REAL aberta que seria destruída: (a) um modal aberto com campo de edição, ou
// (b) o wizard de criação (state.form) com um campo em foco DENTRO do #content.
// NÃO adia mais por causa da busca/chips da toolbar do quadro — era isso que travava a
// toolbar "Meu quadro / Cliente / Designer / Social Media / Setores" de aparecer sem dar
// um passo de navegação extra (Problema 2). A toolbar e os cards re-renderizam na hora.
let _deferRender=false;
function _editingNow(){
  const mr=document.getElementById('modalRoot');
  if(mr&&mr.firstChild&&mr.querySelector('input,textarea,select'))return true;
  const a=document.activeElement;
  if(!a)return false;
  const isField=(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);
  if(!isField)return false;
  // Foco na busca/filtros da toolbar do quadro NUNCA bloqueia o render.
  if(a.closest&&a.closest('.d-board-tools,.tbar,.tflow-tabs,.tflow-chipbar,.bsearch'))return false;
  // Só adia quando o foco está num campo do wizard de criação aberto.
  if(state.form&&a.closest&&a.closest('#content'))return true;
  return false;
}

function canSendToClient(f){
  if(!f||!f.sector)return false;

  const u=state.user;if(!u)return false;
  return canSeeAll(u); // Admin/Manager/Social — ja modelado em MANAGER_KW
}

function composedDesc(){const f=state.form;const sub=curSub();const t=tpl();let lines=[];
  if(sub)lines.push(sub.formTitle);
  const fields=(sub?sub.fields:(t?t.fields:[]))||[];
  fields.forEach(fl=>{const v=f.fields[fl.k];if(v!==undefined&&v!==''&&v!==false)lines.push(fl.l+': '+(v===true?'Sim':v));});
  if(sub&&sub.contentCount){for(let i=0;i<sub.contentCount;i++){const c=f.contents[i];if(c&&(c.tema||c.legenda)){lines.push('Conteúdo '+(i+1)+':');if(c.tema)lines.push('  Tema: '+c.tema);if(c.legenda)lines.push('  Legenda: '+c.legenda);}}}
  if(sub&&sub.items){for(let i=0;i<sub.items;i++){if(f.items[i])lines.push((sub.itemLabel||'Item')+' '+(i+1)+': '+f.items[i]);}}
  if(f.obs)lines.push('',f.obs);
  return lines.join('\n').trim();
}
async function saveTask(){const f=state.form;
  if(!f)return;
  // 1.0.104 — trava anti-duplo-envio: dois cliques rápidos em "Confirmar/Enviar" criavam
  // DOIS docs de tarefa (duas telas/cards). Um único add por submissão.
  if(f._saving)return; f._saving=true;
  if(!f.sector){f._saving=false;alert('Selecione o setor.');f.step=0;render();return;}
  const t=tpl();
  if(t&&t.clientRequired&&!f.client.trim()){f._saving=false;alert('Para Cronograma o cliente é obrigatório.');f.step=1;render();return;}
  if(!f.title.trim()){f._saving=false;alert('Informe o título.');f.step=1;render();return;}
  const u=f.assigneeId?state.users.find(x=>x.id===f.assigneeId):null;
  const data={title:f.title.trim(),client:f.client.trim(),sector:f.sector,desc:composedDesc(),status:f.status,assignee:u?u.name:'',assigneeId:f.assigneeId||null,link:f.link.trim(),priority:!!f.priority,startDate:f.startDate||'',startTime:f.startTime||'',endDate:f.endDate||'',endTime:f.endTime||'',dueDate:f.dueDate||'',dueTime:f.dueTime||'',due:f.dueDate||'',checklist:f.checklist.filter(c=>c.t.trim()),by:state.user.id,createdAt:Date.now(),src:'webpreview'};
  if(f.contents.length)data.cronContents=f.contents;
  // EIXO SOCIAL (aditivo): dono social = responsável social, senão o criador se for social.
  // Persistido p/ a tarefa NÃO sair do quadro da Social Media ao ser enviada a um designer.
  const socialOwner=(u&&isSocialUser(u))?u:(isSocialUser(state.user)?state.user:null);
  if(socialOwner){data.socialOwnerId=socialOwner.id;data.socialOwnerName=socialOwner.name||'';data.socialFlowStatus='afazer';data.socialWorkflowStage='afazer';}
  // Aditivo: cronograma inicia em 'rascunho_social' (ou 'pronto_cliente' se chamada do botao Enviar)
  if(secOf(f.sector).key==='cronograma'){data.cronStatus=f._sendAfterSave?'pronto_cliente':'rascunho_social';if(f.subtype)data.cronSub=f.subtype;
    data.clientFlowStatus=f._sendAfterSave?'enviado':'afazer';data.clientWorkflowStage=data.clientFlowStatus;}
  const sendAfter=!!f._sendAfterSave;
  let ref;
  try{ref=await db.collection('tasks').add(data);}
  catch(e){f._saving=false;console.warn('saveTask add',e);alert('Não foi possível salvar a tarefa. Verifique a conexão e tente novamente.');render();return;}
  const sector=f.sector;state.form=null;
  if(sendAfter&&ref&&ref.id){
    // mantemos o board aberto e abrimos o modal de envio com a tarefa recem-criada
    state.tab='tarefas';state.boardSector=sector;boardCol=0;render();
    openSendClientModal({id:ref.id,client:data.client,title:data.title,cronContents:data.cronContents||[],cronSub:data.cronSub,cronStatus:data.cronStatus});
  }else{
    state.tab='tarefas';state.boardSector=sector;boardCol=0;render();
  }
}

/* ---- EVENT DELEGATION ----
   ATENCAO: o handler fica em `document` (nao em #app) porque os modais sao
   injetados em #modalRoot, que e IRMAO de #app. Preso em #app, nenhum clique
   dentro de um modal era capturado -> seletor de responsavel/mover status/
   sheets ficavam mortos. Em document, captura tudo (com guarda de sessao). */
document.addEventListener('click',async e=>{
  if(!state.user)return;                       // login tem seu proprio handler
  if(!(e.target&&e.target.closest))return;
  const g=sel=>e.target.closest(sel);let el;
  if(el=g('[data-tab]')){state.form=null;state.boardSector=null;state.personBoard=null;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.tab=el.dataset.tab;closeModal();render();return;}
  if(el=g('[data-fab]')){closeModal();if(state.tab==='tarefas')openTaskForm(state.boardSector);else{state.tab='tarefas';openTaskForm(null);}return;}
  if(el=g('[data-sector]')){state.boardSector=el.dataset.sector;state.personBoard=null;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;boardCol=0;boardMine=false;boardQuery='';render();return;}
  if(el=g('[data-myboard]')){state.personBoard=state.user&&state.user.id;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-roleboards]')){state.roleBoards=true;state.personBoard=null;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-personboard]')){state.personBoard=el.dataset.personboard;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-flowclient]')){state.flowView='client';state.designerBoard=null;state.socialBoard=null;state.personBoard=null;state.roleBoards=false;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-flowdesigners]')){state.flowView='designers';state.designerBoard=null;state.socialBoard=null;state.personBoard=null;state.roleBoards=false;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-designerboard]')){state.flowView='designers';state.designerBoard=el.dataset.designerboard;state.socialBoard=null;boardQuery='';render();return;}
  if(el=g('[data-flowsocials]')){state.flowView='socials';state.socialBoard=null;state.designerBoard=null;state.personBoard=null;state.roleBoards=false;state.boardSector=null;boardQuery='';render();return;}
  if(el=g('[data-socialboard]')){state.flowView='socials';state.socialBoard=el.dataset.socialboard;state.designerBoard=null;boardQuery='';render();return;}
  if(el=g('[data-board]')){const a=el.dataset.board;
    if(a==='back')state.boardSector=null;
    else if(a==='hub'){state.boardSector=null;state.personBoard=null;state.roleBoards=false;state.flowView=null;state.designerBoard=null;state.socialBoard=null;}
    else if(a==='roleboards'){state.personBoard=null;state.roleBoards=true;}
    else if(a==='flowdesigners'){state.designerBoard=null;state.socialBoard=null;state.flowView='designers';}
    else if(a==='flowsocials'){state.socialBoard=null;state.designerBoard=null;state.flowView='socials';}
    else if(a==='new'){openTaskForm(state.boardSector);return;}
    render();return;}
  if(el=g('[data-bcol]')){boardCol=+el.dataset.bcol;render();return;}
  if(el=g('[data-bmine]')){boardMine=!boardMine;render();return;}
  if(el=g('[data-ag]')){const a=el.dataset.ag;if(a==='today'){agCursor=new Date();agSel=todayStr();}else if(a==='prev')agCursor.setMonth(agCursor.getMonth()-1);else if(a==='next')agCursor.setMonth(agCursor.getMonth()+1);else if(a==='vmonth')agView='month';else if(a==='vlist')agView='list';render();return;}
  if(el=g('[data-agf]')){agFilter=el.dataset.agf;render();return;}
  if(el=g('[data-day]')){agSel=el.dataset.day;render();return;}
  if(el=g('[data-detail]')){openDetails(el.dataset.detail);return;}
  if(el=g('[data-move]')){openMove(el.dataset.move);return;}
  if(el=g('[data-domove]')){const parts=el.dataset.domove.split('|');await moveStatus(parts[0],parts[1]);return;}
  if(el=g('[data-del]')){openDeleteConfirm(el.dataset.del);return;}
  if(el=g('[data-dodelete]')){await deleteTask(el.dataset.dodelete);return;}
  if(el=g('[data-modalclose]')){closeModal();return;}
  if(el=g('[data-formgoto]')){const v=el.dataset.formgoto;if(v==='resp'){state.form.step=1;render();openAssignee();}else{state.form.step=+v;render();}return;}
  if(el=g('[data-sendclient]')){
    // se estamos no wizard (state.form), salva primeiro com cronStatus=pronto_cliente e entao abre o modal de envio
    if(state.form){state.form._sendAfterSave=true;await saveTask();}
    else{openSendClientModal(state.tasks.find(x=>x.id===el.dataset.taskid));}
    return;
  }
  if(el=g('[data-senddesigner]')){openDesignerModal(el.dataset.senddesigner);return;}
  if(el=g('[data-pickdesigner]')){const p=el.dataset.pickdesigner.split('|');openDesignerDeadline(p[0],p[1]);return;}
  if(el=g('[data-designersend]')){
    const p=el.dataset.designersend.split('|');const gid=id=>document.getElementById(id);
    const sd=(gid('dlSd')||{}).value||'',st=(gid('dlSt')||{}).value||'',ed=(gid('dlEd')||{}).value||'',et=(gid('dlEt')||{}).value||'',obs=(gid('dlObs')||{}).value||'';
    const err=gid('dlErr');const fail=m=>{if(err)err.textContent=m;};
    if(!sd||!st||!ed||!et){fail('Preencha início e término completos (data e hora).');return;}
    const sMs=dtMs(sd,st),eMs=dtMs(ed,et);
    if(eMs!=null&&sMs!=null&&eMs<sMs){fail('O término não pode ser antes do início.');return;}
    sendToDesigner(p[0],p[1],{startDate:sd,startTime:st,endDate:ed,endTime:et,obs:obs});
    return;
  }
  if(el=g('[data-itemfix]')){const p=el.dataset.itemfix.split('|');openItemFix(p[0],+p[1],p[2]);return;}
  if(el=g('[data-itemfixsave]')){const p=el.dataset.itemfixsave.split('|');const ta=document.getElementById('ifIn');const val=ta?ta.value:'';saveItemFix(p[0],+p[1],p[2],val,p[3]==='resend');return;}
  if(el=g('[data-ceopen]')){openContentEditor(el.dataset.ceopen);return;}
  if(el=g('[data-cesave]')){saveContentEdits(el.dataset.cesave);return;}
  if(el=g('[data-prodopen]')){openProductionModal(el.dataset.prodopen);return;}
  if(el=g('[data-prodclear]')){const[i,k]=el.dataset.prodclear.split('|');if(k==='feed')state._prod.items[+i].feedImageUrl='';else state._prod.items[+i].storyImageUrl='';renderProductionModal();return;}
  if(el=g('[data-prodsave]')){saveProduction(el.dataset.prodsave,false);return;}
  if(el=g('[data-prodresend]')){saveProduction(el.dataset.prodresend,true);return;}
  if(el=g('[data-sendclient-task]')){const t=state.tasks.find(x=>x.id===el.dataset.sendclientTask);if(t)openSendClientModal(t);return;}
  if(el=g('[data-clientview]')){openClientView(el.dataset.clientview||(state._sendCtx&&state._sendCtx.id));return;}
  if(el=g('[data-clientviewback]')){closeClientView();return;}
  if(el=g('[data-clientact]')){const a=el.dataset.clientact;if(a==='aprovar'){clientReviewAction(state.clientView,'aprovar','');}else{state.clientAction=a;render();}return;}
  if(el=g('[data-clientcancel]')){state.clientAction=null;render();return;}
  if(el=g('[data-clientsubmit]')){const kind=el.dataset.clientsubmit;const ta=document.getElementById('cvwNote');const note=ta?ta.value.trim():'';if((kind==='revisao'||kind==='editar')&&!note){flashToast('Descreva o que precisa antes de enviar.');if(ta)ta.focus();return;}clientReviewAction(state.clientView,kind,note);return;}
  if(el=g('[data-copymsg]')){copyClientMessage(el);return;}
  if(el=g('[data-openwa]')){
    const id=el.dataset.openwa;
    const ctx=state._sendCtx;if(!ctx){closeModal();return;}
    // HOTFIX (link orfao): ULTIMA confirmacao antes de abrir o WhatsApp. Para uma
    // tarefa salva, re-garante que o token do ctx esta REALMENTE no Firestore. Se a
    // confirmacao falhar, NAO abre o WhatsApp com link orfao — avisa e mantem o modal.
    if(id&&id!=='__form__'){
      try{
        const tok=await ensureReviewToken(id);
        if(tok)ctx.token=tok;                 // garante que a msg use o token confirmado
      }catch(e){
        console.warn('ensureReviewToken (openwa)',e);
        flashToast('Não foi possível confirmar o link do cliente. Verifique a conexão e tente novamente.');
        return;                               // aborta: nada de link orfao no WhatsApp
      }
      if(!ctx.token){ flashToast('Link do cliente indisponível. Tente novamente.'); return; }
    }
    // 1.0.119 — COPIA só a mensagem limpa e abre o WhatsApp SEM texto na URL.
    // NUNCA envia send?text= ao cliente. O usuário cola a mensagem no chat.
    const msg=buildClientMessage(ctx);
    copyToClipboard(msg);
    if(id&&id!=='__form__')await persistClientSend(id);
    closeModal();
    openWhatsAppPlain();
    flashToast('Mensagem copiada. Cole no WhatsApp (e anexe a imagem do card).');
    return;
  }
  if(el=g('[data-sheet]')){openSheet(el.dataset.sheet);return;}
  if(el=g('[data-cfgnotiftest]')){try{window.desktopAPI&&window.desktopAPI.notifTest&&window.desktopAPI.notifTest();}catch(_){}flashToast('Notificação de teste disparada.');return;}
  if(el=g('[data-logout]')){closeModal();logout();return;}
  if(el=g('[data-pickasg]')){if(state.form){const id=el.dataset.pickasg||null;state.form.assigneeId=id;const u=id?state.users.find(x=>x.id===id):null;state.form.assignee=u?(u.name||''):'';}closeModal();render();return;}
  if(el=g('[data-form]')){const a=el.dataset.form;if(a==='close'){state.form=null;render();}else if(a==='back'){state.form.step=Math.max(0,state.form.step-1);render();}else if(a==='next')stepNext();else if(a==='save')await saveTask();return;}
  if(el=g('[data-fsector]')){state.form.sector=el.dataset.fsector;state.form.subtype=null;state.form.contents=[];state.form.checklist=[];render();return;}
  if(el=g('[data-fstatus]')){state.form.status=el.dataset.fstatus;render();return;}
  if(el=g('[data-ftoggle]')){state.form[el.dataset.ftoggle]=!state.form[el.dataset.ftoggle];render();return;}
  if(el=g('[data-fsub]')){state.form.subtype=el.dataset.fsub;state.form.checklist=[];state.form.contents=[];state.form._openContent=0;render();return;}
  if(el=g('[data-fchoice]')){const p=el.dataset.fchoice.split('|');state.form.fields[p[0]]=p[1];render();return;}
  if(el=g('[data-fbool]')){const k=el.dataset.fbool;state.form.fields[k]=!state.form.fields[k];render();return;}
  if(el=g('[data-content]')){state.form._openContent=(state.form._openContent===+el.dataset.content)?null:+el.dataset.content;render();return;}
  if(el=g('[data-chkadd]')){state.form.checklist.push({t:'',d:false});render();return;}
  if(el=g('[data-chkdel]')){state.form.checklist.splice(+el.dataset.chkdel,1);render();return;}
  if(el=g('[data-assignee]')){openAssignee();return;}
});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('modal-back'))closeModal();});
// 1.0.102 — ao sair de um campo, se houve render adiado durante a edição, aplica agora.
document.addEventListener('focusout',function(){if(_deferRender)setTimeout(function(){if(!_editingNow()){_deferRender=false;render();}},80);});
function stepNext(){const f=state.form;
  if(f.step===0&&!f.sector){alert('Escolha o setor.');return;}
  if(f.step===1){const t=tpl();if(t&&t.clientRequired&&!f.client.trim()){alert('Para Cronograma o cliente é obrigatório.');return;}if(!f.title.trim()){alert('Informe o título.');return;}}
  f.step=Math.min(3,f.step+1);render();
}

/* ---- BOOT ---- */
try{window.desktopAPI&&window.desktopAPI.onNotifOpen(function(t){if(!state.user)return;if(t&&t.indexOf("client/")===0){openClientView(t.slice(7));return;}else if(t&&t.indexOf("board/")===0){state.tab="tarefas";state.boardSector=t.slice(6);}else if(t=="agenda"){state.tab="agenda";state.boardSector=null;}render();})}catch(_){}
function afterClientView(){const ta=document.getElementById('cvwNote');if(ta){ta.focus();}}
(async function boot(){
  renderLogin();
  const uid=localStorage.getItem('wp_uid');
  if(uid){try{const doc=await db.collection('users').doc(uid).get();if(doc.exists){startApp(Object.assign({id:doc.id},doc.data()));return;}}catch(_){}clearSession();}
})();
</script>
