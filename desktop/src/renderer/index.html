    --maxw:920px;        /* mobile shell */
    --d-maxw:1400px;     /* desktop content cap */
    --d-side:216px;      /* desktop sidebar width (referência medida) */
    --d-topbar:64px;     /* desktop topbar height */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'InterVar',"Segoe UI Variable Text","Segoe UI",Inter,-apple-system,Roboto,system-ui,sans-serif;font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"ss01","cv11","kern";
    font-synthesis:none;
    -webkit-text-size-adjust:100%;
  }
  body{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .hidden{display:none!important}
  a{color:var(--accent)}

  .logo{background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .logo.lg{width:72px;height:72px;border-radius:20px;font-size:34px}
  .logo.sm{width:42px;height:42px;border-radius:13px;font-size:20px}
  .logo.brandlogo{background:var(--logo) center/contain no-repeat!important;border-radius:0!important;box-shadow:none!important;color:transparent!important;font-size:0!important}

  /* ====== Login ====== */
  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 26px;max-width:480px;margin:0 auto}
  .brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:8px}
  .brand h1{margin:0;color:var(--accent);font-size:26px;font-weight:800;letter-spacing:-.01em}
  .brand .sub{color:var(--soft);font-size:13px;font-weight:500}
  #login .title{font-size:22px;font-weight:800;margin:28px 0 4px}
  #login .subtitle{font-size:13px;color:var(--soft);text-align:center;line-height:1.5;max-width:380px}
  .fld{width:100%;margin-top:12px}
  .fld label{display:block;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
  .inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-size:15px;padding:13px 14px;outline:none;transition:border-color .15s;color-scheme:dark}
  .inp::placeholder{color:var(--faint);opacity:1}
  .inp:focus{border-color:var(--accent)}
  /* date/time: OCULTA totalmente o indicador nativo (era preto/invisivel no dark).
     Usamos icone SVG claro proprio (.dt-field) + showPicker() no clique. */
  .inp[type=date]::-webkit-calendar-picker-indicator,
  .inp[type=time]::-webkit-calendar-picker-indicator{-webkit-appearance:none;appearance:none;opacity:0;display:none;width:0;height:0;margin:0;padding:0;background:none}
  .inp[type=date]::-webkit-inner-spin-button,.inp[type=time]::-webkit-inner-spin-button,
  .inp[type=date]::-webkit-clear-button,.inp[type=time]::-webkit-clear-button{-webkit-appearance:none;display:none;margin:0}
  .inp[type=date],.inp[type=time]{color:var(--ink);cursor:pointer}
  .inp::selection{background:rgba(91,108,255,.4)}
  textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
  .pwwrap{position:relative}
  .pwwrap .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:12px;font-weight:700}
  .btn{width:100%;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
  .btn:active{filter:brightness(.94)}
  .btn[disabled]{opacity:.6;pointer-events:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  .btn.soft{background:rgba(91,108,255,.12);color:var(--accent);height:46px;border-radius:12px}
  .txtbtn{background:none;font-size:13px;font-weight:600;padding:8px;width:100%}
  .txtbtn.accent{color:var(--accent);font-weight:700}
  .txtbtn.soft{color:var(--soft)}
  .banner{width:100%;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500;margin-top:6px}
  .banner.err{background:rgba(248,113,113,.12);color:var(--red)}
  .banner.ok{background:rgba(52,211,153,.12);color:var(--green)}
  .spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vfooter{margin-top:28px;text-align:center;color:var(--soft);font-size:11px;line-height:1.6}
  .vfooter .pill-ver{display:inline-block;background:rgba(91,108,255,.14);color:var(--accent);font-weight:800;
    padding:4px 10px;border-radius:999px;margin-bottom:5px}

  /* ====== App shell ====== */
  #app{display:none;flex-direction:column;min-height:100vh;max-width:var(--maxw);margin:0 auto;position:relative}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--line-soft)}
  .topbar .tt{flex:1;min-width:0}
  .topbar .tt .nm{font-size:17px;font-weight:800}
  .topbar .tt .sy{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--soft);margin-top:1px}
  .topbar .tt .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .content{flex:1;padding-bottom:96px}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;overflow:hidden;flex:none;background-size:cover;background-position:center}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:var(--maxw);margin:0 auto;
    background:rgba(10,11,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0)) 6px}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10px;font-weight:600;padding:6px 0;border-radius:12px}
  .nav button.on{color:var(--accent);font-weight:800}
  .nav button svg{width:23px;height:23px}
  .nav .fab{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 4px;box-shadow:0 8px 20px -6px rgba(91,108,255,.6)}
  .nav .fab svg{width:26px;height:26px}

  /* layer mobile remains; desktop overrides ficam no bloco .desktop abaixo */

  .scr{padding:14px 18px}
  .scr-head{padding:16px 18px 6px}
  .h-title{font-size:26px;font-weight:800;letter-spacing:-.01em}
  .h-sub{font-size:12.5px;color:var(--faint);font-weight:500;margin-top:2px}
  .sect{font-size:17px;font-weight:800;margin:0 0 12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
  .row{display:flex;align-items:center}
  .pill{display:inline-flex;align-items:center;border-radius:7px;padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .badge-round{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--soft)}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px;gap:10px}
  .empty .ebox{width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)}
  .empty .et{font-size:15px;font-weight:800;color:var(--soft)}
  .empty .es{font-size:12.5px;color:var(--faint)}
  .emptyline{font-size:13px;color:var(--faint);padding:4px 2px 8px}

  .stats{display:flex;gap:10px;margin-bottom:24px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
  .stat.accent{background:var(--accent);border-color:transparent}
  .stat .ic{width:20px;height:20px;color:var(--accent)}

  .stat .l{font-size:11.5px;color:var(--soft);margin-top:1px}

  .stat.accent .l{color:rgba(255,255,255,.85)}

  .evc{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px 14px;margin-bottom:10px}
  .evc .bar{width:4px;border-radius:3px;flex:none;align-self:stretch;min-height:46px}
  .evc .main{flex:1;min-width:0}
  .evc .toprow{display:flex;align-items:flex-start;gap:10px}
  .evc .ti{font-size:17px;font-weight:800;flex:1;min-width:0}
  .evc .time{text-align:right}
  .evc .time .s{font-size:16px;font-weight:800}
  .evc .time .e{font-size:12px;color:var(--faint)}
  .evc .meta{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--soft);margin-top:7px}
  .evc .meta svg{width:16px;height:16px;flex:none}

  .tc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
  .tc .metar{display:flex;align-items:center;gap:7px}
  .tc .sdot{width:8px;height:8px;border-radius:50%}
  .tc .slab{font-size:11.5px;font-weight:800}
  .tc .client{font-size:10.5px;font-weight:800;color:var(--soft);letter-spacing:.04em;text-transform:uppercase;margin-top:12px}
  .tc .tt{font-size:16.5px;font-weight:800;margin-top:3px;line-height:1.25}
  .tc .ds{font-size:12.5px;color:var(--faint);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  .tc .pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tc .asg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--faint)}
  .tc .move{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;height:42px;border-radius:12px;background:rgba(91,108,255,.12);color:var(--accent);font-size:13px;font-weight:800;width:100%}
  .tc .move svg{width:18px;height:18px}

  .bcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;width:100%;text-align:left}
  .bcard .icb{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .bcard .icb svg{width:24px;height:24px}
  .bcard .bm{flex:1;min-width:0}
  .bcard .bl{font-size:16px;font-weight:800}
  .bcard .bd{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bcard .bp{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
  .bcard .arr{color:var(--faint);flex:none}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .colsel{display:flex;gap:8px;margin:10px 0}
  .colsel .c{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;text-align:center}
  .colsel .c .cl{font-size:10px;font-weight:800}
  .colsel .c .cn{font-size:15px;font-weight:800}

  .iconbtn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
  .iconbtn svg{width:22px;height:22px}

  .colhead{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:16px;margin:4px 0 12px;border:1px solid var(--line)}
  .colhead .cc{width:12px;height:12px;border-radius:50%;flex:none}
  .colhead .cm{flex:1}
  .colhead .clab{font-size:17px;font-weight:800}
  .colhead .cdesc{font-size:12px;color:var(--faint)}
  .colhead .cb{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800}

  .stepper{display:flex;align-items:center;padding:8px 16px}
  .stepper .st{display:flex;align-items:center;gap:6px}
  .stepper .sc{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--faint)}
  .stepper .sc.on,.stepper .sc.done{background:var(--accent);border-color:transparent;color:#fff}
  .stepper .slab{font-size:11.5px;color:var(--faint);font-weight:600}
  .stepper .slab.on{color:var(--ink);font-weight:800}
  .stepper .ln{flex:1;height:1.5px;background:var(--line);margin:0 6px}
  .stepper .ln.done{background:var(--accent)}

  .sector-card{display:flex;align-items:center;gap:11px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:10px;margin-bottom:8px;width:100%;text-align:left}
  .sector-card.sel{border-width:1.5px}
  .sector-card .icb{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .sector-card .icb svg{width:19px;height:19px}
  .sector-card .sm{flex:1;min-width:0}
  .sector-card .sl{font-size:14.5px;font-weight:800}
  .sector-card .sd{font-size:11.5px;color:var(--faint)}
  .lbl{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
  .content-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden}
  .content-card .ch{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left;background:none}
  .content-card .ch .cd{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .content-card .ch .cd.fill{background:var(--green)}
  .content-card .ch .ct{flex:1;font-size:13.5px;font-weight:700}
  .content-card .cb{padding:0 12px 12px;display:none}
  .content-card.open .cb{display:block}
  .review .rr{display:flex;padding:5px 0;font-size:13.5px}
  .review .rr .rl{width:120px;color:var(--faint);flex:none}
  .review .rr .rv{flex:1;font-weight:600}
  .switchrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
  .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
  .sw.on{background:var(--accent)}
  .sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
  .sw.on::after{left:21px}
  .footer-nav{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;padding:12px 20px}
  .footer-nav .btn{height:50px;border-radius:25px}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:700px){.modal-back{align-items:center}}
  .sheet{background:var(--surface);width:100%;max-width:var(--maxw);border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}
  @media(min-width:700px){.sheet{border-radius:22px;max-width:560px}}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .moveopt{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
  .moveopt .icb{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
  .infoline{display:flex;padding:5px 0;font-size:14px}
  .infoline .il{width:120px;color:var(--faint);flex:none;font-size:13px}
  .infoline .iv{flex:1;font-weight:600;word-break:break-word}

  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:18px}
  .settrow{display:flex;align-items:center;gap:13px;padding:14px;width:100%;text-align:left}
  .settrow .icb{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
  .settrow .icb svg{width:20px;height:20px}
  .settrow .sm{flex:1;min-width:0}
  .settrow .sl{font-size:14.5px;font-weight:800}
  .settrow .ss{font-size:12px;color:var(--faint)}
  .settrow .arr{color:var(--faint)}
  .divline{height:1px;background:#222633;margin-left:65px}

  .wpbadge{position:fixed;z-index:90;right:14px;bottom:84px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:6px 11px;border-radius:999px;box-shadow:0 6px 18px -6px rgba(0,0,0,.6);pointer-events:none;opacity:.92}

  /* ============================================================
     DESKTOP LAYER (>=1024px)  — ativada por body.desktop (JS toggle)
     ============================================================ */
  body.desktop{
    /* shell */
  }
  body.desktop #login{max-width:520px}
  body.desktop #app{
    display:grid !important;
    grid-template-columns:var(--d-side) 1fr;
    grid-template-rows:calc(100vh/var(--fitz,1));
    max-width:none !important;
    margin:0 !important;
    min-height:calc(100vh/var(--fitz,1));
    box-shadow:none !important;
  }
  body.desktop{min-height:calc(100vh/var(--fitz,1))}
  /* SIDEBAR (vira a nav) */
  body.desktop .nav{
    position:relative !important;
    left:auto !important;right:auto !important;bottom:auto !important;
    max-width:none !important;margin:0 !important;
    grid-column:1;grid-row:1;
    display:flex !important;flex-direction:column;justify-content:flex-start;align-items:stretch;
    gap:3px;padding:14px 12px 14px 12px;
    background:#0D0E14;border-top:none;border-right:1px solid var(--line-soft);
    backdrop-filter:none;height:calc(100vh/var(--fitz,1));overflow-y:auto;
  }
  body.desktop .nav .sb-brand{
    display:flex;align-items:center;gap:11px;padding:4px 6px 13px 6px;border-bottom:1px solid var(--line-soft);margin-bottom:10px
  }
  body.desktop .nav .sb-brand .logo.sm{width:32px;height:32px;border-radius:10px;font-size:15px}
  body.desktop .nav .sb-brand .nm{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  body.desktop .nav .sb-brand .sy{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:5px;margin-top:2px}
  body.desktop .nav .sb-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  body.desktop .nav .sb-sect{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;padding:10px 10px 5px}
  body.desktop .nav button.sb-item{
    flex:none !important;flex-direction:row !important;align-items:center !important;
    gap:10px !important;padding:6px 10px !important;border-radius:10px;
    color:var(--soft) !important;font-size:12.5px !important;font-weight:600 !important;
    justify-content:flex-start !important;width:100%;text-align:left;transition:background .12s,color .12s;
  }
  body.desktop .nav button.sb-item svg{width:17px !important;height:17px !important;flex:none}
  body.desktop .nav button.sb-item span{font-size:12.5px !important;font-weight:600 !important}
  body.desktop .nav button.sb-item:hover{background:rgba(255,255,255,.05);color:var(--ink) !important}
  body.desktop .nav button.sb-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* barra de acento a esquerda no item ativo (padrao SaaS) */
  body.desktop .nav button.sb-item.on{background:rgba(91,108,255,.16);color:var(--accent) !important;font-weight:800 !important;position:relative}
  body.desktop .nav button.sb-item.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--accent)}
  body.desktop .nav button.sb-item.on span{font-weight:800 !important}
  body.desktop .nav button.sb-item.on svg{color:var(--accent)}
  /* Botao primario "Nova tarefa" — HORIZONTAL premium: [ +  Nova tarefa ]
     Override do .nav button base (que e flex-direction:column) -> aqui ROW. */
  body.desktop .nav .new-task-btn{
    flex:none !important;width:100% !important;
    display:flex !important;flex-direction:row !important;align-items:center !important;justify-content:center !important;
    gap:8px !important;height:38px;margin:2px 0 8px 0;padding:0 12px;border-radius:10px;
    color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.01em;
    background:linear-gradient(135deg,#5B6CFF 0%,#6E5BFF 100%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 6px 16px -6px rgba(91,108,255,.55),inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
  }
  body.desktop .nav .new-task-btn:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 10px 22px -6px rgba(91,108,255,.7),inset 0 1px 0 rgba(255,255,255,.22)}
  body.desktop .nav .new-task-btn:active{transform:translateY(0);filter:brightness(.98)}
  body.desktop .nav .new-task-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  body.desktop .nav .new-task-btn .new-task-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none}
  body.desktop .nav .new-task-btn .new-task-icon svg{width:18px !important;height:18px !important;display:block}
  body.desktop .nav .new-task-btn .new-task-label{line-height:1;display:inline-flex;align-items:center;white-space:nowrap}
  body.desktop .nav .sb-footer{margin-top:auto;padding:10px 11px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.02);font-size:11px;color:var(--faint);line-height:1.5}
  body.desktop .nav .sb-footer .sbf-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:7px;box-shadow:0 0 5px rgba(52,211,153,.7)}
  body.desktop .nav .sb-footer .ver{display:inline-block;background:rgba(91,108,255,.14);color:var(--accent);font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:6px;font-size:10.5px}

  /* TOPBAR + CONTENT */
  body.desktop #app > .topbar{
    grid-column:2;grid-row:1;
    height:var(--d-topbar);position:sticky;top:0;
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
    padding:0 32px;background:rgba(10,11,16,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
    align-self:start;z-index:25;
  }
  /* topbar limpa no desktop: a marca/sync ja vivem na sidebar -> sem duplicar */
  body.desktop #app > .topbar .logo.sm,
  body.desktop #app > .topbar .tt{display:none}
  body.desktop #app > .topbar #topAvatar{display:flex;align-items:center;height:100%}
  body.desktop #app > .topbar .tt .nm{font-size:15px}
  body.desktop #app > .topbar .tt .sy{font-size:11.5px}
  body.desktop #app > .content{
    grid-column:2;grid-row:1;
    padding:calc(var(--d-topbar) + 8px) 32px 48px 32px !important;
    overflow-y:auto;height:calc(100vh/var(--fitz,1));
  }
  body.desktop #app > .content > *{max-width:var(--d-maxw);margin-left:auto;margin-right:auto}
  body.desktop .scr,body.desktop .scr-head{padding-left:0;padding-right:0}
  body.desktop .h-title{font-size:30px}
  body.desktop .sect{font-size:18px;margin:0 0 16px}

  /* HOME GRID (desktop) */
  body.desktop .d-home{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
  body.desktop .d-home .col-tasks{grid-column:2;grid-row:1 / span 2}
  body.desktop .d-home .col-future{grid-column:1 / -1}
  @media(min-width:1500px){
    body.desktop .d-home{grid-template-columns:1fr 1fr 1fr}
    body.desktop .d-home .col-events{grid-column:1}
    body.desktop .d-home .col-tasks{grid-column:2;grid-row:1}
    body.desktop .d-home .col-future{grid-column:3;grid-row:1}
  }
  body.desktop .stats{gap:16px}
  body.desktop .stat{padding:20px;border-radius:18px}
  body.desktop .stat .v{font-size:32px}
  body.desktop .stat .l{font-size:13px;margin-top:4px}
  body.desktop .stat .ic{width:24px;height:24px}

  /* HUB grid (Quadros) */
  body.desktop .d-hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  body.desktop .d-hub .bcard{margin-bottom:0;padding:18px;border-radius:18px;min-height:104px}
  body.desktop .d-hub .bcard .icb{width:56px;height:56px;border-radius:16px}
  body.desktop .d-hub .bcard .icb svg{width:28px;height:28px}
  body.desktop .d-hub .bcard .bl{font-size:17px}
  body.desktop .d-hub .bcard .bd{font-size:13px;margin-top:2px}

  /* EQUIPE / CHAT grid */
  body.desktop .d-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  body.desktop .d-team .card{margin-bottom:0}

  /* AGENDA: cal + lista lado a lado */
  body.desktop .d-agenda-month{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:start}
  body.desktop .d-agenda-month .d-cal-card{padding:18px}

  /* KANBAN — 4 colunas lado a lado */
  /* Reprovação 1.0.136: coluna NUNCA é espremida. Largura mínima REAL (320px) e, se a
     janela/zoom não der espaço (ex.: 1366 com escala 125% → viewport ~1092px), o BOARD
     rola na horizontal — cards mantêm o tamanho legível em qualquer resolução. */
  body.desktop .kanban{
    display:grid;grid-template-columns:repeat(4,minmax(300px,1fr));gap:18px;
    align-items:start;margin-top:12px;overflow-x:auto;overscroll-behavior-x:contain;
    padding-bottom:8px;scrollbar-gutter:stable;
  }
  body.desktop .kanban .kcol{min-width:300px}
  /* Reprovação 1.0.135 (card cortado): FIX ESTRUTURAL, sem cálculo em px.
     Nas telas de quadro o #content vira coluna FLEX na altura real da janela
     (qualquer resolução/zoom/taskbar): cabeçalho e toolbar são flex-none e o
     kanban ocupa o restante (flex:1 + min-height:0). As colunas têm height:100%
     e SÓ o .kbody rola — topo (header da coluna) sempre visível, base sempre
     dentro da janela, último card com respiro + scroll-margin. */
  body.desktop #content.board-mode{display:flex;flex-direction:column;align-items:center;overflow:hidden;height:calc(100vh/var(--fitz,1));padding-bottom:16px!important;padding-left:34px!important;padding-right:34px!important}
  /* Reprovação 1.0.137: o cap de 1400px deixava ~200px ociosos nas laterais enquanto as
     colunas ficavam estreitas. Nas telas de QUADRO o cap cai: o board usa a largura útil
     REAL (viewport - sidebar - 48px) — colunas largas quando há espaço; scroll horizontal
     SÓ quando a janela realmente não comporta 4 colunas confortáveis (≥300px). */
  body.desktop #content.board-mode > *{max-width:none}
  body.desktop #content.board-mode > .scr-head{flex:none;width:100%}
  body.desktop #content.board-mode > .scr{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;overflow:visible}
  body.desktop #content.board-mode .d-board-tools{flex:none}
  body.desktop #content.board-mode{padding-top:19px!important}
  /* referência: sem faixa de topbar nos quadros — só o avatar flutua à direita */
  /* Reprovação 1.0.140: a foto flutuante do topo direito colidia com os chips do
     quadro. No desktop o perfil vive no CANTO INFERIOR ESQUERDO da sidebar. */
  body.desktop #app > .topbar{display:none !important}
  /* avatar do canto superior direito — presente no print de referência */
  .corner-avatar{display:none}
  body.desktop .corner-avatar{display:flex;position:fixed;top:10px;right:16px;z-index:40;border-radius:50%;padding:0;box-shadow:0 0 0 2px rgba(91,108,255,.45);transition:transform .12s, box-shadow .12s}
  body.desktop .corner-avatar:hover{transform:scale(1.05);box-shadow:0 0 0 3px rgba(91,108,255,.35)}
  /* flex:none anula o flex:1 do .nav button base: sem ele o botão de perfil ESTICAVA e engolia
     todo o espaço livre da coluna em telas altas (perfil "flutuando" com buraco enorme abaixo). */
  body.desktop .nav .sb-user{display:flex !important;flex:none !important;flex-direction:row !important;align-items:center !important;justify-content:flex-start !important;gap:9px !important;width:100%;margin-top:auto;padding:7px 9px !important;border-radius:10px;text-align:left;transition:background .12s}
  body.desktop .nav .sb-user .su-m{display:flex;flex-direction:column;min-width:0}
  body.desktop .nav .sb-user:hover{background:rgba(255,255,255,.05)}
  body.desktop .nav .sb-user .av{flex:none}
  body.desktop .nav .sb-user .su-m{flex:1;min-width:0}
  body.desktop .nav .sb-user .su-n{font-size:12px;font-weight:750;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  body.desktop #content.board-mode .d-board-head{margin-bottom:0}

  body.desktop #content.board-mode .kcol .kbody .tc:last-child:not(:only-child){margin-bottom:14px}

  /* FIEL À REFERÊNCIA: colunas preenchem a altura (como no print autoritativo — a coluna
     se estende ~50px abaixo do card e chega perto da borda da janela). Em telas MAIORES que
     1366×768 o fitZoom() escala a composição inteira: a relação card × coluna do print vale

  body.desktop #content.board-mode .kanban{display:flex;flex:1 1 auto;min-height:0;overflow-x:auto;overflow-y:hidden;

  /* max-width: em telas grandes a coluna NÃO balona (card "esticado" reprovado na 1.0.141);

  body.desktop #content.board-mode .kanban .kcol{flex:1 1 0;min-width:232px;max-width:340px}
  /* referência: a coluna EM FOCO (com cards) respira mais que as vazias */
  body.desktop #content.board-mode .kanban .kcol.kcol-live{flex:1.16 1 0;max-width:380px}
  /* Reprovação 1.0.138: coluna NÃO estica até o chão — cresce só até caber na janela
     (max-height). Coluna com 1 card = card inteiro, sem scrollbar interna. Com vários
     cards, SÓ o .kbody rola, com barra fina/discreta afastada dos cards. */
  body.desktop #content.board-mode .kanban .kcol{height:100%;max-height:100%;min-height:0}
  body.desktop .kanban .kcol .kbody::-webkit-scrollbar{width:8px}

  body.desktop .kanban .kcol .kbody:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:2px solid transparent;background-clip:content-box}
  /* fallback (telas sem board-mode): limite conservador para nunca estourar a janela */

  /* ═══════════ CARD V4 — fiel à referência aprovada (premium glass) ═══════════ */
  .tcv4{position:relative;padding:13px 13px 9px !important;border-radius:10px;container-type:inline-size;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008) 40%),var(--surface);
    box-shadow:0 1px 0 rgba(255,255,255,.045) inset,0 16px 36px -20px rgba(0,0,0,.7);
    transition:transform .16s ease,border-color .16s ease,box-shadow .2s ease}
  .tcv4:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 40%,rgba(255,255,255,.09));
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 22px 46px -20px rgba(0,0,0,.8),0 0 22px -6px color-mix(in srgb,var(--acc) 35%,transparent)}
  .tcv4-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tcv4-st,.tcv4-due{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;border:1px solid;font-size:9.5px;font-weight:740;min-width:0;letter-spacing:-.005em}

  .tcv4-st b{font-weight:750;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;text-align:left}
  .tcv4-st .dotc{width:6px;height:6px;border-radius:50%;flex:none}

  .tcv4-person-m{flex:1;min-width:0}
  .tcv4-name{font-size:14px;font-weight:740;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tcv4-role{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--soft);margin-top:1px}
  .tcv4-avw{position:relative;flex:none;display:inline-flex}
  /* referência: presença = bolinha verde com anel escuro no canto inferior direito da FOTO */
  .tcv4-presence{position:absolute;left:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid #14151d;box-shadow:0 0 5px rgba(52,211,153,.7)}
  .tcv4-origin{display:flex;align-items:flex-start;gap:7px;margin-top:13px;padding:5px 10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.05);border-radius:10px;font-size:10.5px;color:var(--soft);line-height:1.35}
  .tcv4-origin svg{width:11px;height:11px;flex:none;margin-top:1px;opacity:.7}
  .tcv4-origin b{color:var(--ink);font-weight:700}
  .tcv4-main{margin-top:8px}
  .tcv4-client{font-size:8.5px;font-weight:720;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcv4-title{font-size:15px;font-weight:780;line-height:1.3;letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* wrap: chip de estágio longo ocupa a linha; os demais fluem p/ a linha seguinte — sem corte.
     métricas compactas (gap/padding) p/ os 3 chips da referência caberem em UMA linha na
     largura real da coluna (antes o 3º chip era cortado em silêncio pelo overflow:hidden). */
  .tcv4-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tcv4-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:7px;font-size:10px;font-weight:720;white-space:nowrap;min-width:0;flex:0 1 auto;overflow:hidden}
  .tcv4-chip .dotc{width:4px;height:4px;border-radius:50%;flex:none}

     além da largura da linha quebram em 2 linhas dentro do chip (sem corte de informação). */
  .tcv4-chips .tcv4-chip:first-child{max-width:100%;white-space:normal;line-height:1.3;text-align:left}
  .tcv4-chip-soft{color:#C7CEE9;background:rgba(86,104,196,.22);box-shadow:inset 0 0 0 1px rgba(150,168,235,.3)}
  .tcv4-rail{display:flex;align-items:center;margin-top:18px;padding:0 1px}

  .tcv4-rail i.cur{width:8px;height:8px}
  .tcv4-rail i.att{background:#F59E0B;margin-left:6px;box-shadow:0 0 6px rgba(245,158,11,.7)}

  .tcv4-steps{margin-top:11px}

  .tcv4-next{font-size:11px;font-weight:550;color:var(--soft);min-width:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .tcv4-themes{margin-top:10px;padding:8px 11px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.05);border-radius:10px}

  .tcv4-theme-more{font-size:9.5px;color:var(--accent);font-weight:700;padding:1px 0 0 22px}

  .tcv4-mini-n.ok{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:var(--green)}
  .tcv4-mini-n.rev{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.45);color:#F59E0B}
  .tcv4-chkline{margin-top:8px;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tcv4-date{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.055);font-size:11.5px;font-weight:680;color:var(--ink)}

  .tcv4 .tcv4-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px !important;flex:none !important;width:auto !important;margin:0 !important;padding:0 12px !important;border:none !important;border-radius:9px;font-size:11.5px !important;font-weight:740;color:var(--soft);background:rgba(255,255,255,.05);box-shadow:none;transition:background .14s,color .14s,transform .1s}

  /* Popover premium do "⋯" — position:FIXED + PORTAL (ao abrir, o nó vai para o <body>):

  .tcv4-menu{display:none;position:fixed;z-index:80;min-width:198px;padding:6px;

    border:1px solid rgba(255,255,255,.10);border-radius:13px;
    box-shadow:0 24px 56px -16px rgba(0,0,0,.78),0 2px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}

  /* MODAL polish — centrado, premium */
  body.desktop .modal-back{align-items:center;justify-content:center;background:rgba(6,7,11,.62);backdrop-filter:blur(3px)}

  body.desktop .sheet .settrow:active,body.desktop .sheet .moveopt:active{transform:scale(.995)}

  /* Topbar avatar clicavel */
  body.desktop #app > .topbar #topAvatar .topav-btn{padding:0;border-radius:50%;cursor:pointer;transition:transform .12s}
  body.desktop #app > .topbar #topAvatar .topav-btn:hover{transform:scale(1.06)}
  body.desktop #app > .topbar #topAvatar .av{box-shadow:0 0 0 2px var(--line) !important}

  /* HOVER/FOCUS de cards e botoes (padrao SaaS) */
  body.desktop .bcard,body.desktop .stat,body.desktop .sector-card,body.desktop .settrow{transition:transform .12s,border-color .12s,background .12s,box-shadow .12s}
  body.desktop .bcard:hover,body.desktop .stat:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px -16px rgba(91,108,255,.55)}
  body.desktop .sector-card:hover{border-color:var(--accent)}
  body.desktop .kanban .tc{transition:transform .1s,box-shadow .12s,border-color .12s}
  body.desktop .kanban .tc:hover{transform:translateY(-1px);border-color:var(--line);box-shadow:0 8px 20px -14px rgba(0,0,0,.7)}
  body.desktop button:focus-visible,body.desktop .inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  body.desktop .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,108,255,.18)}
  body.desktop .btn{transition:transform .1s,filter .12s,box-shadow .12s}
  body.desktop .btn:not(.ghost):hover{filter:brightness(1.05)}
  body.desktop .btn:active{transform:translateY(1px)}

  /* Estados vazios mais respiraveis no desktop */
  body.desktop .empty{padding:48px 20px}

  /* Esconde wpbadge no desktop (versão já aparece no rodapé da sidebar) */
  body.desktop .wpbadge{display:none}

  /* Scrollbar desktop polish */
  body.desktop ::-webkit-scrollbar{width:10px;height:10px}
  body.desktop ::-webkit-scrollbar-thumb{background:#262A36;border-radius:8px;border:2px solid #0A0B10}
  body.desktop ::-webkit-scrollbar-thumb:hover{background:#34384A}

  /* Para evitar reflow horizontal quando aparece scrollbar Y */
  body.desktop #app > .content{scrollbar-gutter:stable}

  /* =====================================================================
     PREMIUM UI POLISH (desktop)
     ===================================================================== */
  /* Sidebar refino: respiro, brand, sync com leve pulse */
  body.desktop .nav{padding:20px 16px 16px;gap:3px;background:linear-gradient(180deg,#0D0E14 0%,#0B0C11 100%)}
  body.desktop .nav .sb-brand{padding:4px 6px 14px;margin-bottom:10px}
  body.desktop .nav .sb-brand .logo.sm{width:32px;height:32px;border-radius:10px;font-size:15px;box-shadow:0 4px 14px -6px rgba(91,108,255,.6)}
  body.desktop .nav .sb-brand .dot{box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:syncpulse 2.4s ease-out infinite}
  @keyframes syncpulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 5px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  body.desktop .nav .sb-sect{padding:11px 10px 5px;font-size:10px;letter-spacing:.1em}
  body.desktop .nav button.sb-item{height:30px;padding:0 10px !important;gap:11px !important;border-radius:10px}
  body.desktop .nav button.sb-item svg{width:17px !important;height:17px !important;opacity:.85}
  body.desktop .nav button.sb-item.on svg{opacity:1}
  body.desktop .nav .sb-footer{font-size:10.5px}
  body.desktop .nav .sb-footer .ver{font-size:10px;padding:3px 10px}

  /* Conteudo: cabecalho com mais ar */
  body.desktop .h-title{font-size:28px;letter-spacing:-.02em}
  body.desktop .scr-head{padding-bottom:4px}

  /* INPUTS premium */
  body.desktop .inp{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;transition:border-color .12s,box-shadow .12s,background .12s}

  body.desktop .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,108,255,.20);background:var(--surface)}
  body.desktop textarea.inp{min-height:84px}

  /* FORM: grupos visuais (estilo Linear/Notion) */
  body.desktop .form-wrap{max-width:680px}
  body.desktop .fgroup{background:var(--surface2);border:1px solid var(--line-soft);border-radius:16px;padding:18px 18px 20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
  body.desktop .fgroup .fgroup-h{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:15px}
  body.desktop .fgroup .fgroup-h::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
  body.desktop .fgroup .inp{background:var(--surface)}      /* input recuado dentro do painel claro */
  body.desktop .fgroup .lbl{font-size:10.5px;letter-spacing:.06em;color:var(--soft);margin-bottom:7px}
  body.desktop .fgroup .req{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--amber);background:rgba(245,158,11,.14);padding:2px 7px;border-radius:999px;vertical-align:middle;text-transform:none}
  body.desktop .fgroup .sector-card{background:var(--surface);border-radius:12px;padding:11px}
  body.desktop .fgroup .chips{gap:8px}
  body.desktop .fgroup .chip{padding:8px 14px;font-size:13px;border-radius:10px;transition:background .12s,border-color .12s,color .12s}
  body.desktop .fgroup .chip:hover{border-color:#3a4054;color:var(--ink)}

  /* date/time premium: icone SVG claro a esquerda + indicador nativo visivel */
  body.desktop .dt-field{position:relative;display:flex;align-items:center}
  body.desktop .dt-field>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--soft);pointer-events:none;z-index:1}
  body.desktop .dt-field .inp.dt{padding-left:40px;width:100%}
  body.desktop .dt-field:focus-within>svg{color:var(--accent)}

  /* SWITCH premium */
  body.desktop .switchrow{padding:6px 0 2px}
  body.desktop .sw{width:48px;height:28px}
  body.desktop .sw::after{box-shadow:0 1px 3px rgba(0,0,0,.4)}
  body.desktop .sw.on{box-shadow:0 0 0 3px rgba(91,108,255,.18)}

  /* STEPPER premium */
  body.desktop .stepper{max-width:680px;margin:0 auto;padding:20px 0 24px;gap:0}
  body.desktop .stepper .sc{width:28px;height:28px;font-size:12.5px;font-weight:800;transition:box-shadow .15s,background .15s}
  body.desktop .stepper .sc.on{box-shadow:0 0 0 4px rgba(91,108,255,.2)}
  body.desktop .stepper .sc.done{background:var(--accent);border-color:transparent}
  body.desktop .stepper .slab{font-size:12.5px;margin-left:2px}
  body.desktop .stepper .ln{margin:0 10px;height:2px;border-radius:2px}

  /* FOOTER nav premium */
  body.desktop .footer-nav{padding:14px 32px;gap:12px;background:rgba(11,12,17,.92)}
  body.desktop .footer-nav .btn{height:44px;border-radius:11px;font-size:14px;font-weight:700;min-width:150px}
  body.desktop .footer-nav .btn:not(.ghost){background:linear-gradient(135deg,#5B6CFF 0%,#6E5BFF 100%);box-shadow:0 6px 16px -6px rgba(91,108,255,.5)}
  body.desktop .footer-nav .btn.ghost{min-width:118px;background:transparent;border:1px solid var(--line);color:var(--soft)}
  body.desktop .footer-nav .btn.ghost:hover{border-color:#3a4054;color:var(--ink);background:rgba(255,255,255,.03)}

  /* SECTOR cards (etapa Setor) premium */
  body.desktop .sector-card{border-radius:13px;padding:13px;transition:border-color .12s,background .12s,transform .1s}
  body.desktop .sector-card:hover{transform:translateY(-1px)}
  body.desktop .sector-card.sel{box-shadow:0 0 0 3px rgba(91,108,255,.14)}

  /* REVIEW card premium */
  body.desktop .review{background:var(--surface2);border:1px solid var(--line-soft);border-radius:16px}
  body.desktop .review .rr{padding:11px 0;border-bottom:1px solid var(--line-soft)}
  body.desktop .review .rr:last-child{border-bottom:none}

  /* Conteudo do cronograma — cards premium */
  body.desktop .content-card{border-radius:12px;border:1px solid var(--line-soft);overflow:hidden;margin-bottom:8px}

  /* =====================================================================
     REVISAO premium + EXCLUSAO  — base (mobile+desktop)
     ===================================================================== */
  .rev-head{margin-bottom:16px}
  .rev-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.01em}
  .rev-badge svg{width:15px;height:15px}
  .rev-h-title{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:12px}
  .rev-h-sub{font-size:13px;color:var(--soft);margin-top:3px}
  .rev-card{background:var(--surface2);border:1px solid var(--line-soft);border-radius:18px;padding:20px;box-shadow:0 8px 30px -18px rgba(0,0,0,.7)}
  .rev-name{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .rev-client{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:13.5px;font-weight:600;margin-top:6px}
  .rev-client svg{width:15px;height:15px;color:var(--faint)}
  .rev-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .rev-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}
  .rev-chip .dotc{width:7px;height:7px;border-radius:50%}
  .rev-chip-soft{background:var(--surface);color:var(--soft);border:1px solid var(--line)}
  .rev-divider{height:1px;background:var(--line-soft);margin:18px 0}
  .rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .rev-it{display:flex;align-items:flex-start;gap:11px}
  .rev-it>svg{width:18px;height:18px;color:var(--faint);flex:none;margin-top:2px}
  .rev-it-l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .rev-it-v{font-size:14px;font-weight:600;margin-top:2px}
  .rev-resp{display:flex;align-items:center;gap:13px}
  .rev-resp-m{flex:1;min-width:0}
  .rev-resp-l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .rev-resp-n{font-size:15.5px;font-weight:800;margin-top:2px}
  .rev-resp-r{font-size:12.5px;color:var(--soft);margin-top:1px}
  .rev-edit{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--soft);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;transition:border-color .12s,color .12s}
  .rev-edit:hover{border-color:var(--accent);color:var(--accent)}
  .rev-sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px;font-size:13px;font-weight:800;letter-spacing:.02em}
  .rev-count{font-size:12px;font-weight:800;color:var(--accent);background:rgba(91,108,255,.14);padding:3px 11px;border-radius:999px}
  .rev-contents{display:flex;flex-direction:column;gap:10px}
  .rev-content{display:flex;gap:13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px}
  .rev-content-n{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(91,108,255,.16);color:var(--accent);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .rev-content-t{font-size:14.5px;font-weight:800}
  .rev-content-l{font-size:13px;color:var(--soft);margin-top:4px;line-height:1.5;white-space:pre-wrap}
  .rev-quick{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .rev-edit2{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--soft);font-size:13px;font-weight:700;padding:10px 16px;border-radius:11px;transition:border-color .12s,color .12s,background .12s}
  .rev-edit2 svg{width:16px;height:16px}
  .rev-edit2:hover{border-color:var(--accent);color:var(--ink);background:rgba(91,108,255,.06)}

  /* Acoes do card (Mover + Remover) */
  .tc-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
  .tc-actions .move{flex:1;margin:0}
  .del-btn{flex:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.28);color:#F87171;transition:background .12s,border-color .12s}
  .del-btn svg{width:18px;height:18px}
  .del-btn:hover{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.5)}

  /* Modal de exclusao */
  .del-sheet{text-align:center}
  .del-ic{width:54px;height:54px;border-radius:15px;background:rgba(248,113,113,.14);color:#F87171;display:flex;align-items:center;justify-content:center;margin:4px auto 14px}
  .del-ic svg{width:26px;height:26px}
  .del-title{font-size:19px;font-weight:800}
  .del-msg{font-size:13.5px;color:var(--soft);line-height:1.55;margin:9px 0 20px}
  .del-actions{display:flex;gap:12px}
  .del-actions .btn{flex:1;height:46px;border-radius:12px}
  .btn-danger{background:#F8717122;color:#F87171;border:1px solid rgba(248,113,113,.45);font-weight:800}
  .btn-danger:hover{background:rgba(248,113,113,.22)}

  /* Desktop refino da revisao */
  body.desktop .rev-card{padding:24px;border-radius:20px}
  body.desktop .rev-h-title{font-size:24px}
  body.desktop .del-sheet{max-width:440px}
  body.desktop .tc-actions .del-btn:hover{transform:translateY(-1px)}

  /* =====================================================================
     CARD DE TAREFA premium + DETALHES
     ===================================================================== */
  .tc{padding:18px}
  /* 1a) Meta row: status (esq) + prazo (dir) */
  .tc-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .tc-st{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
  .tc-st .dotc{width:6px;height:6px;border-radius:50%;flex:none}
  .tc-due{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
  /* 1b) Pessoa: avatar grande + nome (ate 2 linhas, largura total) */
  /* Identidade COMPACTA do card (reprovação 1.0.138): 1 linha, mesma informação. */
  .tc-who{display:flex;align-items:center;gap:10px;margin-top:6px;min-width:0}
  .tc-who .av{flex:none}
  .tc-who-m{flex:1;min-width:0}
  .tc-who .tc-asg-n{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tc-who-sub{font-size:11px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Temas em LINHA ÚNICA (lista completa no Detalhes). */
  .tc-themes-line{display:flex;align-items:center;gap:7px;margin-top:8px;padding:6px 10px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:11px;font-size:11.5px;color:var(--soft);min-width:0}
  .tc-themes-line svg{width:14px;height:14px;flex:none;color:var(--faint)}
  .tc-themes-line b{flex:none;color:var(--ink);font-weight:800}
  .tc-themes-line span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Rodapé ÚNICO: prazo + ações na mesma linha. */
  .tc-footrow{display:flex;align-items:center;gap:10px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft)}
  .tc-footrow .tc-prazo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-footrow .tc-actions{margin-top:0;flex:none}
  .tc-person{display:flex;align-items:center;gap:13px}
  .tc-person .av{flex:none}
  .tc-av-empty{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface2);color:var(--faint);flex:none}
  .tc-av-empty svg{width:24px;height:24px}
  .tc-person-m{flex:1;min-width:0}
  .tc-asg-n{font-size:15.5px;font-weight:800;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .tc-asg-r{font-size:12px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 2) Faixa enviado por (wrap elegante) */
  .tc-origin{display:flex;align-items:flex-start;gap:8px;margin-top:14px;padding:10px 12px;background:var(--bg);border:1px solid var(--line-soft);border-radius:11px;font-size:12px;color:var(--soft);line-height:1.45}
  .tc-origin svg{width:15px;height:15px;color:var(--faint);flex:none;margin-top:1px}
  .tc-origin b{color:var(--ink);font-weight:700}
  /* 3) Corpo */
  .tc-body{margin-top:10px}
  .tc-client{font-size:10.5px;font-weight:800;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
  .tc-title{font-size:15px;font-weight:800;margin-top:3px;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tc-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .tc-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9px;font-size:11.5px;font-weight:800;white-space:nowrap}
  /* FASE 2 (passo 2) — timeline COMPACTA do card (discreta, premium, ~3 linhas) */
  /* task-flow-fix — timeline COMPACTA do card: legível e premium em qualquer largura.
     Cada linha tem uma "etiqueta" curta (Agora/Próxima/Último) + valor que QUEBRA em até
     2 linhas (line-clamp), em vez de cortar com reticências numa linha só. */
  .tc-tl{margin-top:8px;padding-top:7px;border-top:1px solid var(--line-soft)}
  .tc-tl-next>span:last-child{-webkit-line-clamp:1 !important}
  .tc-tl-rail{display:flex;align-items:center;gap:0;margin-bottom:6px}
  .tc-tl-rail i{width:9px;height:9px;border-radius:50%;flex:none}
  .tc-tl-rail .ln{flex:1;height:2px;border-radius:1px;min-width:5px}
  .tc-tl-k{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--faint);background:var(--surface2);border-radius:5px;padding:2px 6px;line-height:1.2;align-self:flex-start;margin-top:1px}
  .tc-tl-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--soft);line-height:1.35;min-width:0}
  .tc-tl-row svg{width:13px;height:13px;flex:none;color:var(--faint)}
  .tc-tl-now{font-weight:800;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-tl-next{display:flex;align-items:flex-start;gap:7px;margin-top:5px;font-size:11.5px;color:var(--soft);line-height:1.35}
  .tc-tl-next>span:last-child{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tc-tl-last{display:flex;align-items:flex-start;gap:7px;margin-top:5px;font-size:11px;color:var(--faint);line-height:1.3}
  .tc-tl-last>span:last-child{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tc-tag-soft{background:var(--surface2);color:var(--soft)}
  /* 4) Temas (premium) */
  .tc-themes{margin-top:14px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:14px;padding:14px}
  .tc-themes-h{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
  .tc-theme{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}
  .tc-theme:last-child{margin-bottom:0}
  .tc-theme-n{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(91,108,255,.18);color:var(--accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .tc-theme-t{font-size:13.5px;font-weight:700;line-height:1.35;padding-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .tc-more{font-size:12px;font-weight:800;color:var(--accent);margin-top:10px;padding-left:35px}
  .tc-brief{font-size:13px;color:var(--soft);margin-top:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* checklist */
  .tc-chk{margin-top:14px}
  .tc-chk-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .tc-chk-bar>div{height:100%;background:var(--green)}
  .tc-chk-l{font-size:11.5px;color:var(--faint);margin-top:6px}
  /* 6) Rodape */
  .tc-foot{display:flex;align-items:center;margin-top:15px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .tc-prazo{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--soft)}
  .tc-prazo svg{width:15px;height:15px;color:var(--faint);flex:none}
  .tc-prazo-empty{color:var(--faint);font-weight:600}
  .tc-actions{display:flex;align-items:stretch;gap:9px;margin-top:12px}
  .tc-act{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;font-size:13px;font-weight:800;transition:background .12s,border-color .12s,transform .1s,color .12s;white-space:nowrap}
  .tc-act svg{width:17px;height:17px;flex:none}
  .tc-detail{flex:1;background:var(--accent);color:#fff;box-shadow:0 6px 16px -8px rgba(91,108,255,.6)}
  .tc-detail:hover{filter:brightness(1.06)}
  .tc-act.move{flex:1;background:var(--surface2);color:var(--soft);border:1px solid var(--line)}
  .tc-act.move:hover{border-color:var(--accent);color:var(--ink)}
  .tc-act.del-btn{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.28);color:#F87171;margin:0}
  .tc-act.del-btn:hover{background:rgba(248,113,113,.18)}
  body.desktop .tc-act:active{transform:translateY(1px)}
  body.desktop .tc-detail:active{filter:brightness(.97)}

  /* DETALHES (modal) — largo o suficiente p/ nomes longos, scroll vertical */
  body.desktop .det-sheet{max-width:720px;width:100%;text-align:left;max-height:88vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
  .det-sheet .det-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 0;gap:14px}
  .det-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:800}
  .det-badge svg{width:15px;height:15px;flex:none}
  .det-x{width:36px;height:36px;border-radius:11px;background:var(--surface2);color:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;transition:background .12s,color .12s}
  .det-x:hover{color:var(--ink);background:#262a36}
  .det-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .det-x svg{width:18px;height:18px}
  .det-title{font-size:23px;font-weight:800;letter-spacing:-.015em;padding:14px 26px 0;line-height:1.2}
  .det-client{display:flex;align-items:center;gap:7px;color:var(--soft);font-size:14px;font-weight:600;padding:8px 26px 0}
  .det-client svg{width:16px;height:16px;color:var(--faint);flex:none}
  .det-chips{display:flex;flex-wrap:wrap;gap:9px;padding:15px 26px 0}
  .det-body{padding:20px 26px 6px;overflow-y:auto;flex:1;scrollbar-gutter:stable}
  .det-people{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .det-person{display:flex;align-items:center;gap:13px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:15px;padding:15px}
  .det-person .av{flex:none}
  .det-person-m{min-width:0;flex:1}
  .det-person-l{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .det-person-n{font-size:15px;font-weight:800;margin-top:3px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .det-person-r{font-size:12.5px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .det-sec{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin:22px 0 12px;display:flex;align-items:center;gap:9px}
  .det-sec-c{font-size:11px;font-weight:800;color:var(--accent);background:rgba(91,108,255,.14);padding:3px 10px;border-radius:999px;text-transform:none}
  .det-dates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
  .det-date{display:flex;align-items:flex-start;gap:10px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:13px;padding:13px}
  .det-date>svg{width:17px;height:17px;color:var(--green);flex:none;margin-top:1px}
  .det-date-m{min-width:0}
  .det-date-l{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .det-date-v{font-size:13px;font-weight:700;margin-top:4px;line-height:1.3}
  .det-contents{display:flex;flex-direction:column;gap:11px}
  .det-content{display:flex;gap:13px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:14px;padding:15px}
  .det-content-n{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(91,108,255,.18);color:var(--accent);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .det-content-m{min-width:0;flex:1}
  .det-content-t{font-size:15px;font-weight:800;line-height:1.3;word-break:break-word}
  .det-content-l{font-size:13px;color:var(--soft);margin-top:5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .det-desc{font-size:13.5px;color:var(--soft);line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--line-soft);border-radius:14px;padding:15px}
  .det-check{display:flex;flex-direction:column;gap:2px}
  .det-check-i{display:flex;align-items:center;gap:11px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .det-check-i:last-child{border-bottom:none}
  .det-check-b{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
  .det-check-b.on{background:var(--green);border-color:transparent}
  .det-check-done{color:var(--faint);text-decoration:line-through}
  .det-link{font-size:13px;color:var(--accent);word-break:break-all;background:var(--surface2);border:1px solid var(--line-soft);border-radius:13px;padding:13px}
  /* Footer premium agrupado — header fixo + body scroll + footer fixo (det-sheet e flex-column).
     Cada grupo e flex-wrap com min-width: os botoes NUNCA cortam, quebram em 2 linhas. */
  .det-actions{display:flex;flex-direction:column;gap:14px;padding:16px 26px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);background:var(--surface);flex:none}
  .det-act-group{display:flex;flex-direction:column;gap:8px;min-width:0}
  .det-act-lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .det-act-row{display:flex;flex-wrap:wrap;gap:10px;min-width:0}
  .det-act-row .btn{flex:1 1 auto;min-width:150px;width:auto;height:46px;border-radius:12px;font-size:13.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .det-act-row .btn svg{width:17px;height:17px;flex:none}
  .det-act-row .btn-danger{flex:0 1 auto;min-width:130px}
  .det-act-row .det-close{flex:0 1 auto;min-width:120px;background:var(--surface2);border:1px solid var(--line);color:var(--soft)}
  .det-act-row .det-close:hover{border-color:var(--accent);color:var(--ink)}
  .det-act-row .btn:not(.ghost):not(.btn-danger):not(.det-close){box-shadow:0 6px 16px -8px rgba(91,108,255,.6)}
  @media(max-width:560px){.det-people,.det-dates{grid-template-columns:1fr}.det-act-row .btn{min-width:46%}}

  /* Configuracoes — icone do cabecalho */
  .cfg-ic{width:44px;height:44px;border-radius:13px;background:rgba(91,108,255,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .cfg-ic svg{width:24px;height:24px}

  /* Cronograma — botao Enviar para cliente (Fase 1) */
  .rev-send{margin-top:18px}
  .rev-send-btn{width:100%;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#5B6CFF 0%,#22D3EE 55%,#10B981 100%);box-shadow:0 10px 26px -10px rgba(34,211,238,.55),inset 0 1px 0 rgba(255,255,255,.2);border:none;letter-spacing:.005em}
  .rev-send-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .rev-send-btn:active{filter:brightness(.98);transform:translateY(0)}
  .rev-send-btn svg{width:18px;height:18px}
  .rev-send-hint{font-size:12px;color:var(--soft);margin-top:8px;text-align:center}

  /* ===== Modal premium "Enviar cronograma para o cliente" ===== */
  .sp-sheet{position:relative;text-align:center}
  body.desktop .sp-sheet{max-width:560px}
  .sp-x{position:absolute;top:14px;right:14px;color:var(--faint)}
  .sp-ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;margin:4px auto 16px;color:#10B981;
    background:linear-gradient(160deg,rgba(34,211,238,.20),rgba(16,185,129,.16));border:1px solid rgba(16,185,129,.32);box-shadow:0 10px 26px -14px rgba(16,185,129,.7)}
  .sp-ic svg{width:28px;height:28px}
  .sp-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .sp-sub{font-size:13px;color:var(--soft);margin:8px auto 18px;max-width:440px;line-height:1.5}
  .sp-lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:left;margin-bottom:8px}
  .sp-lbl-note{font-weight:600;letter-spacing:0;text-transform:none;color:var(--soft);opacity:.8}
  .sp-prev{background:var(--surface2);border:1px solid var(--line-soft);border-radius:16px;padding:15px;text-align:left;box-shadow:0 8px 30px -20px rgba(0,0,0,.8)}
  .sp-prev-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .sp-prev-av{width:40px;height:40px;border-radius:11px;background:rgba(34,211,238,.14);color:#22D3EE;display:flex;align-items:center;justify-content:center;flex:none}
  .sp-prev-av svg{width:21px;height:21px}
  .sp-prev-id{flex:1;min-width:0}
  .sp-prev-n{font-size:14.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-prev-r{font-size:11.5px;color:var(--faint);margin-top:1px}
  .sp-chip{display:inline-flex;align-items:center;gap:6px;flex:none;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;background:rgba(16,185,129,.12);color:#10B981;border:1px solid rgba(16,185,129,.28)}
  .sp-chip svg{width:14px;height:14px}
  .sp-prev-msg{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0 0 13px;white-space:pre-wrap;word-break:break-word;font-family:inherit;background:var(--surface);border:1px solid var(--line-soft);border-radius:11px;padding:13px;max-height:220px;overflow:auto}
  .sp-cta{display:flex;align-items:center;gap:13px;padding:13px;border-radius:13px;cursor:pointer;
    background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(16,185,129,.08));border:1px solid rgba(34,211,238,.30);transition:border-color .14s,transform .14s,box-shadow .14s}
  .sp-cta:hover{border-color:rgba(34,211,238,.6);transform:translateY(-1px);box-shadow:0 10px 24px -16px rgba(34,211,238,.8)}
  .sp-cta-ic{width:42px;height:42px;border-radius:11px;background:rgba(16,185,129,.16);color:#10B981;display:flex;align-items:center;justify-content:center;flex:none}
  .sp-cta-ic svg{width:21px;height:21px}
  .sp-cta-m{flex:1;min-width:0}
  .sp-cta-t{font-size:14.5px;font-weight:800}
  .sp-cta-s{font-size:12px;color:var(--soft);margin-top:2px}
  .sp-cta-ext{color:#22D3EE;flex:none}
  .sp-cta-ext svg{width:18px;height:18px}
  .sp-warn{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--amber);background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.28);border-radius:11px;padding:11px;margin:14px 0;text-align:left;line-height:1.45}
  .sp-warn svg{width:15px;height:15px;flex:none;margin-top:1px}
  .sp-actions{display:flex;gap:10px}
  .sp-actions .btn{flex:1;height:46px;border-radius:12px;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
  .sp-actions .btn svg{width:16px;height:16px}
  .sp-copied-w{display:inline-flex;align-items:center;gap:8px}
  .btn.sp-share{flex:1.15;color:#22D3EE;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.34);font-weight:800}
  .btn.sp-share:hover{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.55)}
  .btn.sp-go{flex:1.3;color:#fff;border:none;background:linear-gradient(135deg,#5B6CFF 0%,#22D3EE 60%,#10B981 100%);box-shadow:0 8px 20px -10px rgba(34,211,238,.6)}
  .btn.sp-go:hover{filter:brightness(1.07)}

  /* ===== 1.0.120 — ASSISTENTE GUIADO "Enviar card premium ao cliente" (3 etapas, à prova de erro) ===== */
  .gcs-sheet{position:relative;text-align:left;padding:22px 22px 18px}
  /* BLINDAGEM contra ícone gigante: TODO svg dentro do modal tem tamanho fixo. */
  .gcs-sheet svg{width:18px;height:18px;flex:none}
  .gcs-x{position:absolute;top:13px;right:13px;color:var(--faint)}
  .gcs-head{display:flex;align-items:center;gap:13px;padding-right:36px}
  .gcs-headic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#10B981;background:linear-gradient(160deg,rgba(34,211,238,.20),rgba(16,185,129,.16));border:1px solid rgba(16,185,129,.32)}
  .gcs-headic svg{width:20px;height:20px}
  /* 1.0.121 — marca ID Seven oficial no cabeçalho do modal (usa a logo embutida --logo) */
  .gcs-headic.brand{background:var(--logo) center/contain no-repeat;border:none}
  .gcs-title{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .gcs-sub{font-size:12.5px;color:var(--soft);margin-top:3px;line-height:1.45}
  .gcs-checklist{display:flex;gap:8px;margin:16px 0 2px;flex-wrap:wrap}
  .gcs-chk{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--faint);background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:7px 11px}
  .gcs-chk .gcs-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:var(--surface2);color:var(--faint);border:1px solid var(--line)}
  .gcs-chk .gcs-dot svg{width:11px;height:11px}
  .gcs-chk.is-done{color:#34D399;border-color:rgba(52,211,153,.4)}
  .gcs-chk.is-done .gcs-dot{background:#34D399;color:#04140d;border-color:#34D399}
  .gcs-step{margin-top:15px;border:1px solid var(--line-soft);border-radius:16px;padding:15px;background:var(--surface);transition:opacity .15s}
  .gcs-step.is-locked{opacity:.45;filter:grayscale(.35)}
  .gcs-steplabel{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .gcs-lock{font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint);font-size:11px}
  .gcs-card{border-radius:13px;overflow:hidden;border:1px solid var(--line-soft);background:var(--surface2)}
  .gcs-card img{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover}
  .gcs-stepmsg{font-size:12px;color:var(--soft);margin:11px 0;line-height:1.45}
  .gcs-legend{font-size:13px;color:var(--ink);line-height:1.55;margin:0 0 12px;white-space:pre-wrap;word-break:break-word;font-family:inherit;background:var(--surface2);border:1px solid var(--line-soft);border-radius:11px;padding:13px;max-height:230px;overflow:auto}
  .gcs-go{width:100%;height:48px;border-radius:12px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,#5B6CFF 0%,#22D3EE 60%,#10B981 100%);box-shadow:0 8px 20px -10px rgba(34,211,238,.6)}
  .gcs-go svg{width:18px;height:18px}
  .gcs-go:hover:not(:disabled){filter:brightness(1.07)}
  .gcs-go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:grayscale(.5)}
  .gcs-go.is-done{background:linear-gradient(135deg,#10B981,#34D399);box-shadow:none}
  .gcs-status{font-size:11.5px;color:var(--faint);margin-top:9px;display:flex;align-items:center;gap:6px;line-height:1.4}
  .gcs-status svg{width:14px;height:14px;flex:none}
  .gcs-status.ok{color:#34D399}
  /* 1.0.122 — nota honesta (botão fica no portal) + chips do fluxo de grupo */
  .gcs-note{font-size:11.5px;color:var(--soft);margin-top:11px;line-height:1.45;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px}
  .gcs-grpchk{margin:13px 0 2px}
  /* 1.0.123 — prévia do LINK como o WhatsApp renderiza (card OG premium vem do link público) */
  .gcs-lp{border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;background:var(--surface2);margin:0 0 13px}
  .gcs-lp-img{width:100%;background:#0b0c12}
  .gcs-lp-img img{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover}
  .gcs-lp-meta{padding:10px 12px}
  .gcs-lp-title{font-size:13px;font-weight:800;line-height:1.3;color:var(--ink)}
  .gcs-lp-desc{font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gcs-lp-dom{font-size:10.5px;color:var(--faint);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
  .gcs-secondary{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .gcs-secondary .btn{width:auto;flex:0 0 auto;height:32px;padding:0 12px;font-size:11.5px}
  /* 1.0.121 — bloco de ENVIO AUTOMÁTICO (oficial, via Cloud API) */
  .gcs-auto{margin-top:14px;border:1px solid rgba(52,211,153,.30);border-radius:16px;padding:15px;background:linear-gradient(160deg,rgba(34,211,238,.06),rgba(16,185,129,.05))}
  .gcs-auto .gcs-steplabel{color:#34D399}
  .gcs-input{width:100%;height:46px;margin-top:11px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:14px;padding:0 13px;box-sizing:border-box}
  .gcs-input:focus{outline:none;border-color:#34D399}
  .gcs-go#btnSendAuto{margin-top:11px}
  .gcs-status.err{color:#F87171}
  .gcs-status.blocked{color:#F59E0B}
  .gcs-divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}

  .dz-row-go{width:34px;height:34px;border-radius:10px;background:rgba(124,92,255,.16);color:#A78BFA;display:flex;align-items:center;justify-content:center;flex:none}
