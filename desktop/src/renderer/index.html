  .dz-empty{font-size:13px;color:var(--faint);padding:18px;text-align:center;background:var(--surface2);border:1px solid var(--line-soft);border-radius:13px}
  /* resposta do cliente no Detalhes (Social) */
  .det-cresp{display:flex;align-items:flex-start;gap:12px;border:1px solid;border-radius:13px;padding:14px}
  .det-cresp-ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none}
  .det-cresp-ic svg{width:19px;height:19px}
  .det-cresp-t{font-size:14px;font-weight:800}
  .det-cresp-n{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.5;font-style:italic}
  .det-cresp-d{font-size:11.5px;color:var(--faint);margin-top:5px}
  /* P1: correções pedidas pelo cliente (por conteúdo) no Detalhes */
  .det-fix{border:1px solid;border-radius:13px;padding:14px;margin-bottom:11px;background:var(--surface2)}
  .det-fix-h{display:flex;align-items:center;gap:10px}
  .det-fix-n{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
  .det-fix-tt{font-size:13.5px;font-weight:800}
  .det-fix-note{font-size:13px;color:var(--ink);margin-top:9px;line-height:1.5;font-style:italic;border-left:2px solid var(--line);padding-left:10px}
  .det-fix-cur{margin-top:10px}
  .det-fix-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
  .det-fix-val{font-size:13px;color:var(--ink);line-height:1.45}
  .det-fix-acts{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
  .det-fix-acts .btn{height:40px;border-radius:11px;font-size:12.5px;padding:0 14px;display:inline-flex;align-items:center;gap:7px}
  .det-fix-acts .btn svg{width:15px;height:15px}
  /* P1: editor focado de um conteúdo (antes/depois) */
  .if-ba{text-align:left;margin-bottom:16px}
  .if-lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .if-before{font-size:13px;color:var(--soft);line-height:1.5;background:var(--surface2);border:1px solid var(--line-soft);border-radius:11px;padding:11px 13px;white-space:pre-wrap}
  .if-in{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:14px;font-family:inherit;line-height:1.5;margin-bottom:16px;box-sizing:border-box;resize:vertical}
  .if-in:focus{outline:none;border-color:var(--accent)}
  /* 1.0.103 — Filtros/abas premium em CHIPS COM ÍCONES (Meu quadro · Cliente · Designers · Social Medias · Setores) */
  .tflow-tabs{display:flex;gap:8px;padding:14px 20px 4px;flex-wrap:wrap}
  .tflow-chipbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tflow-chipbar::-webkit-scrollbar{display:none}
  /* 1.0.106 — chips moveram para a toolbar do quadro (ao lado da busca); sem barra no topo global */
  /* chip individual */
  /* 1.0.107 — chips MENOS arredondados, alinhados ao input "Buscar tarefa…" (mesma borda/raio/altura).
     Sem aparência de cápsula (border-radius do input = 11px no desktop). */
  .tchip{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;height:36px;padding:0 12px;border-radius:11px;
    background:var(--surface);border:1px solid var(--line);color:var(--soft);font-size:13px;font-weight:700;
    cursor:pointer;transition:background .14s,border-color .14s,color .14s;white-space:nowrap}
  .tchip svg{width:15px;height:15px;flex:none;opacity:.9}
  .tchip:hover{color:var(--ink);border-color:var(--accent)}
  .tchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tchip.on svg{opacity:1}
  /* Toolbar dos quadros: BUSCA + CHIPS na mesma moldura */
  .d-board-tools.tbar{display:flex;align-items:center;gap:12px;margin:14px 0 4px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:9px 12px;flex-wrap:nowrap}
  .d-board-tools.tbar .bsearch-wrap{position:relative;flex:0 1 320px;min-width:150px;display:flex}
  .d-board-tools.tbar .bsearch{flex:1;min-width:0;margin:0;height:36px;padding-right:58px}
  .bsearch-kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:9.5px;font-weight:700;color:var(--faint);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:6px;padding:2px 7px;pointer-events:none}
  .d-board-tools.tbar .tchips{display:flex;align-items:center;gap:8px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none;justify-content:flex-end}
  .d-board-tools.tbar .tchips::-webkit-scrollbar{display:none}
  body:not(.desktop) .d-board-tools.tbar{flex-wrap:wrap}
  body:not(.desktop) .d-board-tools.tbar .bsearch{flex:1 1 100%}
  body:not(.desktop) .d-board-tools.tbar .tchips{justify-content:flex-start;flex:1 1 100%}
  /* task-flow-fix — barra de ABAS dos HUBS (sem busca): mesma moldura integrada da toolbar,
     mas com as abas alinhadas à ESQUERDA (não há campo de busca à esquerda). NÃO é flutuante. */
  /* ===== detail-hierarchy-v2 — HERO do detalhe (status + próxima + responsável + ações) ===== */
  .det-hero{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .det-hero-status{display:flex;align-items:flex-start;gap:12px;border:1px solid;border-radius:13px;padding:14px 16px}
  .det-hero-dot{width:11px;height:11px;border-radius:99px;flex:none;margin-top:4px}
  .det-hero-l{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
  .det-hero-s{font-size:12.5px;color:var(--soft);margin-top:2px}
  .det-hero-next{background:var(--surface2);border:1px solid var(--line-soft);border-radius:13px;padding:11px 14px}
  .det-hero-nk{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .det-hero-nt{font-size:13.5px;color:var(--ink);margin-top:3px}
  .det-hero-owner{display:flex;align-items:center;gap:10px;padding:2px 4px}
  .det-hero-ava{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;flex:none}
  .det-hero-ava.own-social{background:linear-gradient(135deg,#22D3EE,#5B9BFF)}
  .det-hero-ava.own-designer{background:linear-gradient(135deg,#F5A524,#C64BD8)}
  .det-hero-ava.own-cliente{background:linear-gradient(135deg,#7C5CFF,#C64BD8)}
  .det-hero-ava.own-none{background:var(--surface2);color:var(--faint)}
  .det-hero-ok{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .det-hero-on{font-size:13px;font-weight:700}
  .det-hero-or{font-size:11.5px;color:var(--soft);font-weight:600}
  .det-hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
  .det-hero-actions .btn svg{width:17px;height:17px;flex:none}
  .det-teamfix{border-color:rgba(52,211,153,.45)!important;color:#9BEECB!important}
  /* "Detalhes do fluxo" colapsado (nativo <details>) */
  .det-flowdet{margin-top:14px;border:1px solid var(--line-soft);border-radius:13px;overflow:hidden}
  .det-flowdet>summary{cursor:pointer;list-style:none;padding:11px 15px;font-size:12.5px;font-weight:700;color:var(--soft);background:var(--surface2);user-select:none}
  .det-flowdet>summary::-webkit-details-marker{display:none}
  .det-flowdet>summary::after{content:'▾';float:right;color:var(--faint);transition:transform .15s}
  .det-flowdet[open]>summary::after{transform:rotate(180deg)}
  .det-flowdet-body{padding:4px 15px 15px;border-top:1px solid var(--line-soft)}
  /* Resumo dos dois eixos no Detalhes */
  .det-flow{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:13px;padding:13px 15px}
  .det-flow-col{flex:1;min-width:160px}
  .det-flow-lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .det-flow-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px}
  .det-flow-pill.det-flow-soft{background:var(--surface);color:var(--faint);border:1px solid var(--line)}
  .det-flow-dl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--soft);margin-left:8px}
  .det-flow-dl svg{width:13px;height:13px}
  /* Próxima ação + linha do tempo operacional */
  .det-next{display:flex;align-items:flex-start;gap:12px;border:1px solid;border-radius:13px;padding:13px 15px;background:var(--surface2)}
  .det-next-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
  .det-next-ic svg{width:20px;height:20px}
  .det-next-l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .det-next-t{font-size:14px;color:var(--ink);font-weight:600;margin-top:4px;line-height:1.45}
  .det-tl{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:13px;padding:8px 12px}
  .det-tl-row{display:flex;align-items:center;gap:11px;padding:8px 2px}
  .det-tl-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex:none;background:var(--surface);border:1px solid var(--line);color:var(--faint)}
  .det-tl-dot svg{width:14px;height:14px}
  .det-tl-l{flex:1;font-size:13px;color:var(--soft);min-width:0}
  .det-tl-opt{color:var(--faint);font-size:11.5px}
  /* FASE 2 (passo 3) — meta por marco no detalhe (data · relativo · autor) */
  .det-tl-meta{font-size:11px;color:var(--faint);margin-top:2px;line-height:1.35;white-space:normal;word-break:break-word}
  .det-tl-row.done .det-tl-meta{color:var(--soft)}
  .det-tl-s{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  .det-tl-row.done .det-tl-dot{background:var(--green);border-color:transparent;color:#062}
  .det-tl-row.done .det-tl-l{color:var(--ink)}
  .det-tl-row.done .det-tl-s{color:var(--green)}
  .det-tl-row.cur .det-tl-dot{background:rgba(91,108,255,.18);border-color:var(--accent);color:var(--accent)}
  .det-tl-row.cur .det-tl-l{color:var(--ink);font-weight:700}
  .det-tl-row.cur .det-tl-s{color:var(--accent)}

  /* mobile: tela do cliente ocupa largura total */
  /* conteudo com Feed/Story */
  .cvw-item{flex-direction:column;align-items:stretch}
  .cvw-item-head{display:flex;align-items:flex-start;gap:13px}
  .cvw-arts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .cvw-art-lbl{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .cvw-feed,.cvw-story{width:100%;border-radius:10px;border:1px solid var(--line);object-fit:cover;display:block;background:var(--surface)}
  .cvw-feed{aspect-ratio:1080/1440}.cvw-story{aspect-ratio:1080/1920}
  /* ===== Resumo editorial premium (cards por conteúdo) ===== */
  .cvw-ed-list{display:flex;flex-direction:column;gap:12px}
  .cvw-ed{background:var(--surface2);border:1px solid var(--line-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
  .cvw-ed-head{display:flex;align-items:flex-start;gap:12px}
  .cvw-ed-n{width:30px;height:30px;border-radius:10px;background:rgba(91,108,255,.16);color:var(--accent);font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .cvw-ed-h-m{flex:1;min-width:0}
  .cvw-ed-kicker{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .cvw-ed-tema{font-size:15.5px;font-weight:800;line-height:1.3;margin-top:2px}
  .cvw-ed-sit{flex:none;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .cvw-ed-sit .dotc{width:6px;height:6px;border-radius:50%;background:currentColor}
  /* ===== Retorno granular do cliente (V1.0.91) ===== */
  .cvw-cfb{border:1px solid;border-radius:16px;padding:16px 16px 6px;margin-top:18px;background:linear-gradient(180deg,rgba(91,108,255,.06),transparent)}
  .cvw-cfb-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .cvw-cfb-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .cvw-cfb-ic svg{width:17px;height:17px}
  .cvw-cfb-t{font-size:14px;font-weight:800}
  .cvw-cfb-s{font-size:12px;color:var(--faint);margin-top:1px}
  .cvw-hl{display:flex;flex-direction:column;gap:9px;margin-top:13px}
  .cvw-hl-i{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface2)}
  .cvw-hl-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
  .cvw-hl-ic svg{width:14px;height:14px}
  .cvw-hl-m{flex:1;min-width:0}
  .cvw-hl-tt{font-size:13px;font-weight:700}
  .cvw-hl-d{margin-top:6px;font-size:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .cvw-hl-time{font-size:11px;color:var(--faint);white-space:nowrap;flex:none}
  /* overlay por conteúdo: o que o cliente fez naquele item */
  .cvw-cli{margin-top:2px;border-top:1px dashed var(--line-soft);padding-top:12px;display:flex;flex-direction:column;gap:9px}
  .cvw-cli-badge{align-self:flex-start;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .cvw-cli-badge .dotc{width:6px;height:6px;border-radius:50%;background:currentColor}
  .cvw-cli-row{display:flex;gap:9px;align-items:flex-start;font-size:12.5px}
  .cvw-cli-row .ci{width:24px;height:24px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}
  .cvw-cli-row .ci svg{width:13px;height:13px}
  .cvw-cli-row .cm{flex:1;min-width:0}
  .cvw-cli-row .cl{font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
  .cvw-cli-row .cv{margin-top:2px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .cvw-cli-time{font-size:11px;color:var(--faint);margin-top:1px}
  .cvw-ed-flbl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .cvw-ed-leg{font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap}
  .cvw-ed-leg.pend{color:var(--faint);font-style:italic}
  /* miniaturas pequenas, alinhadas (não ocupam a largura toda) */
  .cvw-ed-media{display:flex;gap:12px;flex-wrap:wrap}
  .cvw-ed-mthumb{position:relative;display:block;width:120px;flex:none;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
  .cvw-ed-mthumb img{width:100%;display:block;object-fit:cover}
  .cvw-ed-mthumb.feed img{aspect-ratio:1080/1440}.cvw-ed-mthumb.story img{aspect-ratio:1080/1920}
  .cvw-ed-mtag{position:absolute;left:6px;bottom:6px;font-size:9px;font-weight:800;color:#fff;background:rgba(10,11,16,.74);padding:2px 6px;border-radius:6px;letter-spacing:.02em}
  .cvw-ed-mpend{width:120px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1.5px dashed var(--line);border-radius:11px;color:var(--faint);background:var(--surface);text-align:center;padding:12px 6px}
  .cvw-ed-mpend.feed{aspect-ratio:1080/1440}.cvw-ed-mpend.story{aspect-ratio:1080/1920}
  .cvw-ed-mpend svg{width:20px;height:20px;opacity:.75}
  .cvw-ed-mpend-t{font-size:11px;font-weight:800;color:var(--soft);line-height:1.2}
  .cvw-ed-mpend-d{font-size:9.5px;font-weight:700;letter-spacing:.03em}
  .cvw-note-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:14px;padding:15px}
  .cvw-note-ic{width:36px;height:36px;border-radius:10px;background:rgba(124,92,255,.14);color:#A78BFA;display:flex;align-items:center;justify-content:center;flex:none}
  .cvw-note-ic svg{width:18px;height:18px}
  .cvw-note-tx{flex:1;min-width:0;font-size:13.5px;color:var(--ink);line-height:1.6}
  @media (max-width:720px){.cvw-grid{grid-template-columns:1fr}.cvw-scroll{padding:12px 16px 36px}.cvw-arts{grid-template-columns:1fr 1fr}}
  @media (max-width:440px){.cvw-arts{grid-template-columns:1fr}}

  /* =====================================================================
     RETOQUE DE QUALIDADE — paleta navy + efeitos do print de referência
     (amostragem pixel a pixel: fundo rgb(8,13,27)→(3,9,18) com vinheta;
      colunas azul-profundo; card com gradiente interno azulado claro→escuro;
      Nova tarefa 74,66,251→gloss→121,63,224; Detalhes 87,97,233→62,52,240;
      véu âmbar atrás do header da coluna ativa; busca em poço escuro)
     ===================================================================== */
  body.desktop{
    --surface:#101729; --surface2:#1A2138;
    --line:rgba(150,170,255,.10); --line-soft:rgba(150,170,255,.07);
    background:radial-gradient(1400px 900px at 70% -12%, #0E1730 0%, #0A0F22 40%, #060B18 72%, #040810 100%) fixed;
  }
  body.desktop .nav{background:linear-gradient(180deg,#070E20 0%,#060B1A 60%,#050917 100%)}
  body.desktop .kanban .kcol{background:linear-gradient(180deg,#151B30 0%,#0F1426 100%);
    border-color:rgba(150,170,255,.08);box-shadow:0 22px 44px -26px rgba(0,0,0,.65)}
  body.desktop .kanban .kcol.kcol-live{
    background:linear-gradient(180deg,#161C32,#101529) padding-box,
      linear-gradient(140deg,rgba(34,211,238,.85),rgba(99,102,241,.7) 38%,rgba(244,114,182,.7)) border-box;
    box-shadow:0 0 18px -4px color-mix(in srgb,var(--kc) 38%,transparent),
      0 0 60px -16px rgba(96,140,255,.45),0 18px 40px -20px rgba(0,0,0,.7)}
  body.desktop .kanban .kcol.kcol-live .khead{background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 12%,transparent),transparent)}
  body.desktop .tcv4{background:linear-gradient(180deg,rgba(96,134,255,.075) 0%,rgba(40,58,110,.05) 32%,rgba(4,7,16,.3) 100%),#0C1120;
    border-color:rgba(150,170,255,.11);
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 26px 50px -24px rgba(0,0,0,.8)}
  body.desktop .tcv4-origin{background:rgba(4,8,20,.5)}
  body.desktop .tcv4-themes{background:rgba(9,14,30,.55);border-color:rgba(150,170,255,.07)}
  body.desktop .d-board-tools.tbar .bsearch{background:rgba(4,7,16,.8) !important;border-color:rgba(150,170,255,.08)}
  body.desktop .nav .new-task-btn{background:linear-gradient(115deg,#4A42FB 0%,#8B7BFF 48%,#7B3FE0 100%);
    box-shadow:0 10px 26px -8px rgba(104,77,255,.6),inset 0 1px 0 rgba(255,255,255,.32)}
  body.desktop .tcv4 .tcv4-btn-main{background:linear-gradient(110deg,#4F5BEC 0%,#7C3BEF 100%);
    box-shadow:0 8px 20px -8px rgba(83,86,240,.6),inset 0 1px 0 rgba(255,255,255,.22)}
  body.desktop .tcv4 .tcv4-btn-main:hover{background:linear-gradient(110deg,#5E69F3 0%,#8B4DF6 100%)}
  body.desktop .kempty-ic{color:rgba(150,172,220,.30)}
  body.desktop .kempty{border-color:rgba(150,170,255,.10)}
</style>
</head>
<body>

<section id="login">
  <div class="brand">
    <div class="logo lg brandlogo"></div>
    <h1>ID Seven</h1>
    <div class="sub">Desktop · Paridade APK</div>
  </div>

async function sha256Hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function hashPw(pw,salt){return 's2:'+await sha256Hex(salt+'|'+pw);}
function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0);}
async function verifyPw(pass,salt,pw){if(!pass)return false;if(salt&&pass.startsWith('s2:'))return pass===await hashPw(pw,salt);return pass===djb2(pw);}
function randSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');}

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function roleCat(u){if(!u)return'UNKNOWN';if(u.admin)return'ADMIN';const r=norm(u.role);if(!r)return'UNKNOWN';return MANAGER_KW.some(k=>r.includes(k))?'MANAGER':'OPERATIONAL';}
function canSeeAll(u){const c=roleCat(u);return c==='ADMIN'||c==='MANAGER';}
function canSeeTask(u,t){if(canSeeAll(u))return true;const uid=u&&u.id;if(!uid)return false;return t.assigneeId===uid||t.by===uid;}
function visibleTasks(u,list){return canSeeAll(u)?list:list.filter(t=>canSeeTask(u,t));}

function dtMs(date,time){if(!date)return null;const[y,m,d]=date.split('-').map(Number);const[hh,mm]=((time||'00:00').split(':')).map(Number);return new Date(y,(m||1)-1,d||1,hh||0,mm||0).getTime();}
function humanDur(ms){const min=Math.floor(ms/60000);if(min<60)return min+' min';const h=Math.floor(min/60);if(h<24){const r=min%60;return r?h+'h '+r+'min':h+'h';}const d=Math.floor(h/24);const rh=h%24;return rh?d+'d '+rh+'h':d+'d';}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}

function digits(s){return (s||'').replace(/\D/g,'');}
async function doLogin(idOrPhone,password){
  const id=idOrPhone.trim().toLowerCase();const d=digits(idOrPhone);
  const snap=await db.collection('users').get();let m=null;
  snap.forEach(doc=>{if(m)return;const u=doc.data();const em=(u.email||'').toLowerCase();if(em===id||(d&&digits(u.phone)===d))m=Object.assign({id:doc.id},u);});
  if(!m)throw 'E-mail/WhatsApp ou senha incorretos.';
  const st=m.status||'';if(st==='pendente')throw 'Cadastro aguardando aprovação.';if(st==='removido'||st==='excluido')throw 'Conta inativa.';
  if(!await verifyPw(m.pass,m.salt,password))throw 'E-mail/WhatsApp ou senha incorretos.';
  // detail-hierarchy-v2: adquire o teamSessionJwt do Worker (autenticação FORTE p/ ações
  // de workflow). Fire-and-forget: falha NÃO bloqueia o login (a ação avisa na hora).
  // A senha é usada SÓ nesta chamada HTTPS — nunca persistida no app.
  acquireTeamSession(m.id,password);
  if(m.mustChangePassword){state.pending={user:m};return null;}
  return m;
}
/* Sessão de EQUIPE (Worker V64.45): POST /team/session {uid, password} → JWT HS256
   ({sub, aud:'idseven-team', scope:'workflow:team_adjusted_item', exp:+12h}) assinado
   server-side com TEAM_SESSION_SECRET. Guardamos APENAS o JWT (expira sozinho);
   nenhum secret do Worker e nenhuma senha ficam no app. */
async function acquireTeamSession(uid,password){
  try{
    const r=await fetch(CLIENT_REVIEW_BASE+'/team/session',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid:uid,password:password})});
    const j=await r.json().catch(()=>null);
    if(r.ok&&j&&j.ok===true&&j.token){localStorage.setItem('wp_team_jwt',j.token);return true;}
    localStorage.removeItem('wp_team_jwt');
    console.warn('team session indisponível:',(j&&j.error)||('HTTP '+r.status));
  }catch(e){localStorage.removeItem('wp_team_jwt');console.warn('team session falhou:',e&&e.message);}
  return false;
}
/* Reprovação 1.0.138 — JWT só era emitido no LOGIN com senha; quem restaura a sessão
   salva (wp_uid) ficava dias com JWT expirado (TTL 12h) e os avisos ao cliente falhavam
   com um toast genérico. Agora: validade checada localmente (exp do payload) e, quando
   ausente/expirado, um modal pede a senha SÓ para renovar a sessão de equipe — a senha
   vai direto ao /team/session e NUNCA é persistida. */
function teamJwtValid(){
  try{const j=localStorage.getItem('wp_team_jwt')||'';if(!j)return false;
    const p=JSON.parse(atob(j.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return ((p.exp||0)*1000)>Date.now()+60000;          // 60s de folga p/ não expirar em voo
  }catch(_){return false;}
}
function ensureTeamSession(){
  if(teamJwtValid())return Promise.resolve(true);
  return new Promise(resolve=>{
    const u=state.user||{};
    document.getElementById('modalRoot').innerHTML='<div class="modal-back" data-modalbg-keep="1"><div class="sheet" style="max-width:420px">'+
      '<div class="grab"></div><div style="font-size:17px;font-weight:800;margin-bottom:6px">Renovar sessão de equipe</div>'+
      '<div style="font-size:13px;color:var(--soft);line-height:1.5;margin-bottom:12px">Para avisar o cliente em tempo real, confirme sua senha. Ela é usada apenas nesta confirmação e não fica salva.</div>'+
      '<input class="inp" id="tsPw" type="password" autocomplete="current-password" placeholder="Sua senha de acesso">'+
      '<div id="tsErr" style="font-size:12.5px;color:var(--red);min-height:18px;margin-top:6px"></div>'+
      '<div class="row" style="gap:10px;margin-top:8px">'+
        '<button class="btn ghost" id="tsCancel" style="flex:1">Agora não</button>'+
        '<button class="btn" id="tsGo" style="flex:1.4">Renovar e avisar</button>'+
      '</div></div></div>';
    const done=ok=>{closeModal();resolve(ok);};
    document.getElementById('tsCancel').addEventListener('click',()=>done(false));
    document.getElementById('tsGo').addEventListener('click',async()=>{
      const pw=(document.getElementById('tsPw')||{}).value||'';
      const err=document.getElementById('tsErr');
      if(!pw){if(err)err.textContent='Digite a senha.';return;}
      if(err)err.textContent='';
      const ok=await acquireTeamSession((state.user&&state.user.id)||u.id,pw);
      if(ok){flashToast('Sessão de equipe renovada.');done(true);}
      else if(err)err.textContent='Senha incorreta ou serviço indisponível. Tente novamente.';
    });
    const inp=document.getElementById('tsPw');if(inp)inp.focus();
  });
}
async function doRegister(name,role,phone,email,password){
  if(!name.trim()||!email.trim()||!password)throw 'Preencha nome, e-mail e senha.';
  const salt=randSalt();const pass=await hashPw(password,salt);
  await db.collection('users').add({name:name.trim(),role:role.trim(),phone:phone.trim(),email:email.trim().toLowerCase(),pass,salt,status:'pendente',admin:false,createdAt:Date.now()});
}

function subscribeData(){
  unsub.users=db.collection('users').onSnapshot(s=>{state.users=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(state.user){const me=state.users.find(x=>x.id===state.user.id);if(me)state.user=me;}renderFromSnapshot();});

  unsub.tasks=db.collection('tasks').onSnapshot(s=>{state.tasks=dedupById(s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(t=>!isTestTask(t)));renderFromSnapshot();});

// 1.0.121 — BLINDAGEM: nunca renderizar dados de teste/QA no quadro operacional, mesmo que
// algum escape para o Firestore. Marcadores inequívocos de teste (jamais cliente real):
//  - flag isCloudApiTest:true
//  - id começando com "qa-demo"
//  - cliente/título de seeds conhecidos de teste.
function isTestTask(t){
  if(!t) return false;
  const c=String(t.client||''), ti=String(t.title||''), id=String(t.id||'');
  return t.isCloudApiTest===true
    || /^qa-demo/i.test(id)
    || c==='Cliente Demo ID Seven' || ti==='Cronograma Demo (teste do card)'
    || c==='Hospital Visão (Teste Cloud API)' || ti==='Cronograma de teste — Cloud API';
}
// 1.0.104 — dedup defensivo por id: garante uma ÚNICA fonte por tarefa antes do render.
// Se o snapshot trouxer (ou um fallback acumular) o mesmo id, mantém a última ocorrência.
// Corrige cards/telas empilhados (dois cards um embaixo do outro).
function dedupById(arr){
  if(!Array.isArray(arr))return [];
  const m=new Map();
  for(const it of arr){if(it&&it.id!=null)m.set(it.id,it);}
  return Array.from(m.values());
}

async function pendingChange(p1,p2,btn){

  await db.collection('users').doc(state.pending.user.id).update({pass,salt,mustChangePassword:false,passwordChangedAt:Date.now()});

}

function calendarGrid(y,m,evs){
  const firstD=new Date(y,m,1);const start=new Date(firstD);start.setDate(1-firstD.getDay());
  const byDay={};evs.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const inM=d.getMonth()===m,isT=ds===todayStr(),isS=ds===agSel;
    const dots=(byDay[ds]||[]).slice(0,4).map(e=>'<span style="width:5px;height:5px;border-radius:50%;background:'+typeOf(e.type).color+'"></span>').join('');
    cells+='<button data-day="'+ds+'" style="aspect-ratio:1;border-radius:10px;background:'+(isS?'var(--accent)':'transparent')+';border:1px solid '+(isT&&!isS?'var(--accent)':'transparent')+';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:'+(isS?'#fff':inM?'var(--ink)':'var(--faint)')+';font-size:13px;font-weight:700">'+d.getDate()+'<div style="display:flex;gap:2px;height:5px">'+(isS?'':dots)+'</div></button>';
  }
  return '<div class="card" style="padding:14px 8px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px">'+DOW.map(d=>'<div style="text-align:center;font-size:10px;font-weight:800;color:var(--faint)">'+d+'</div>').join('')+'</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+cells+'</div></div>';
}

/* ===== P3/P4 — Fluxo do Cliente x Fluxo dos Designers ===== */
// ===== EIXOS SEPARADOS (visibility-fix) =====
// Designer flow: a tarefa foi atribuída a um designer (designerAssignment.designerId).
function hasDesigner(t){return !!(t&&t.designerAssignment&&t.designerAssignment.designerId);}
function isDesignerFlow(t){return hasDesigner(t);}
function designerOf(t){return (t&&t.designerAssignment&&t.designerAssignment.designerId)||(t&&t.assigneeId)||null;}
// Client flow: TODO cronograma vive no fluxo do cliente — INDEPENDENTE do designer.
// A tarefa só "conclui" o fluxo do cliente na aprovação final (clientFlowStatus='concluido').
function isClientFlow(t){return !!t&&secOf(t.sector).key==='cronograma';}
// Colunas do FLUXO DO CLIENTE (eixo próprio, separado do designer).
const CLIENT_COLS=[
  {key:'afazer',    label:'A Fazer',                     color:'#6E7480'},
  {key:'enviado',   label:'Temas enviados ao cliente',   color:'#5B6CFF'},
  {key:'aprovado',  label:'Temas aprovados pelo cliente',color:'#22D3EE'},
  {key:'producao',  label:'Em produção',                 color:'#A78BFA'},
  {key:'revisao',   label:'Ajuste solicitado pelo cliente',color:'#F59E0B'},
  {key:'reenviado', label:'Reenviado ao cliente',        color:'#34D399'},
  {key:'concluido', label:'Concluído final',             color:'#10B981'},
];
// Coluna do cliente: usa clientFlowStatus (gravado por Worker/Desktop); senão deriva (compat).
function clientCol(t){
  const v=(t&&t.clientFlowStatus||'').toString();
  if(CLIENT_COLS.some(c=>c.key===v)){
    // 'concluido' explícito só vale se o fluxo realmente encerrou; senão ainda é reenvio/aprov. final.
    if(v==='concluido'&&!isFullyComplete(t))return 'reenviado';
    // V64.49: o fechamento da fase é SÓ explícito (botão "Aprovar temas" → approveAll).
    // O estado "todos os itens aprovados com global 'revisao' herdado" NÃO vira 'aprovado'
    // aqui — ele é tratado como AGUARDANDO CONFIRMAÇÃO do cliente (ver clientCol4/detailState).
    return v;
  }
  const ws=(t&&t.workflowStage||'').toString();
  const cs=(t&&t.cronStatus||'').toString();
  const cr=(t&&t.clientReview&&t.clientReview.status||'').toString();
  // CORREÇÃO (status-consistency): o status BRUTO do kanban (t.status==='concluido')
  // NÃO força mais a coluna 'concluido'. Conclusão só via isFullyComplete (aprovação final real).
  if(isFullyComplete(t))return 'concluido';
  if(cr==='revisao'||cs==='em_revisao_cliente'||cs==='editado_cliente')return 'revisao';
  if(cs==='ready_for_final_client_review'||cs==='reenviado_cliente')return 'reenviado';
  if(hasDesigner(t)||cs==='sent_to_designer'||ws==='producao'||ws==='entrega'||ws==='revisao_final')return 'producao';
  if(cr==='aprovado'||cs==='aprovado_cliente')return 'aprovado';
  if(cs==='enviado_cliente'||t.clientSentBy||t.clientReviewToken||t.shareToken)return 'enviado';
  return 'afazer';
}
// Coluna do DESIGNER: eixo de trabalho do designer (designerFlowStatus; senão status).
function designerCol(t){const v=(t&&t.designerFlowStatus||'').toString();if(['afazer','andamento','revisao','concluido'].indexOf(v)>=0)return v;return (t&&t.status)||'afazer';}
// Lista de designers que têm tarefas atribuídas (fluxo de designer).
function designerBoardsList(){
  const ids={};
  state.tasks.forEach(t=>{if(!isDesignerFlow(t))return;const did=designerOf(t);if(did)ids[did]=(ids[did]||0)+1;});
  return Object.keys(ids).map(id=>{const u=state.users.find(x=>x.id===id)||{id:id,name:'Designer'};return {u:u,count:ids[id]};})
    .sort((a,b)=>(a.u.name||'').toLowerCase()<(b.u.name||'').toLowerCase()?-1:1);
}

// Cliente/Designers/Social Medias só para Social/Admin (canSeeAll); designer comum vê só Meu quadro.

  return 'hub';
}

/* ===== FLUXO DAS SOCIAL MEDIAS (eixo próprio, por Social Media) ===== */
// É Social Media? cargo contém "social" (espelha MANAGER_KW). Admin é tratado à parte.
function isSocialUser(u){return !!u&&norm(u.role||'').includes('social');}
// Social media "dona" da tarefa: socialOwnerId explícito; senão criador (by) se social; senão responsável se social.
function socialOf(t){
  if(t&&t.socialOwnerId)return t.socialOwnerId;
  const byU=t&&state.users.find(u=>u.id===t.by); if(byU&&isSocialUser(byU))return t.by;
  const asU=t&&state.users.find(u=>u.id===t.assigneeId); if(asU&&isSocialUser(asU))return t.assigneeId;
  return null;
}
function socialUsers(){return state.users.filter(u=>u&&!['pendente','removido','excluido'].includes(u.status||'')&&isSocialUser(u));}
// Coluna do quadro da Social Media: cronograma deriva do eixo do cliente; demais usam status.
function socialCol(t){
  if(secOf(t.sector).key==='cronograma'){const c=clientCol(t);
    if(c==='concluido')return 'concluido';if(c==='revisao')return 'revisao';if(c==='afazer')return 'afazer';
    return 'andamento';}                 // enviado/aprovado/producao/reenviado = em andamento (produzindo/acompanhando)
  return t.status||'afazer';
}

/* ===== EIXO OPERACIONAL (status REAL da operação ≠ aprovação do cliente) =====
   A aprovação parcial do cliente NÃO conclui a operação: enquanto faltar designer,
   legenda, post ou aprovação final, a tarefa fica num estágio operacional aberto. */
const OPERATIONAL_COLS=[
  {key:'afazer',                     label:'A Fazer',                          color:'#6E7480'},
  {key:'producao',                   label:'Aguardando aprovação dos temas',   color:'#22D3EE'},
  {key:'aguardando_envio',           label:'Aguardando envio ao designer',     color:'#22D3EE'},
  // FLUXO CORRETO (task-flow-fix): "enviado ao designer" ≠ "designer produzindo".
  // Designer recebeu mas AINDA NÃO iniciou (designerFlowStatus afazer/vazio) → este estado.
  {key:'aguardando_designer_iniciar',label:'Aguardando designer iniciar',      color:'#7C83FF'},
  // "Designer em produção" SÓ quando o designer move p/ "Em andamento" (designerFlowStatus='andamento').
  {key:'aguardando_designer',        label:'Designer em produção',             color:'#A78BFA'},
  // role-aware (passo 2): designer está corrigindo um ajuste (designerFlowStatus='revisao').
  {key:'aguardando_designer_revisao',label:'Designer em revisão',              color:'#60A5FA'},
  {key:'aguardando_legenda',         label:'Aguardando legendas e posts',      color:'#5B6CFF'},
  {key:'aguardando_revisao',         label:'Ajuste solicitado pelo cliente',   color:'#F59E0B'},
  {key:'aguardando_final',           label:'Aguardando aprovação final',       color:'#34D399'},
  {key:'concluido',                  label:'Concluído final',                  color:'#10B981'},
];
const OP_KEYS=OPERATIONAL_COLS.map(c=>c.key);
// Há produção pendente? (alguma legenda vazia OU algum Feed sem arte)
function pendingLegend(t){const a=Array.isArray(t.cronContents)?t.cronContents:[];return !a.length||a.some(c=>!(c&&c.legenda&&String(c.legenda).trim()));}
function pendingFeed(t){const a=Array.isArray(t.cronContents)?t.cronContents:[];return !a.length||a.some(c=>!(c&&c.feedImageUrl));}
function pendingStory(t){const a=Array.isArray(t.cronContents)?t.cronContents:[];return a.some(c=>c&&c.storyImageUrl)&&a.some(c=>!(c&&c.storyImageUrl));}
function pendingProduction(t){return pendingLegend(t)||pendingFeed(t);}
function designerDelivered(t){return hasDesigner(t)&&designerCol(t)==='concluido';}
// Ajuste pedido pelo cliente em ALGUM conteúdo (aprovação parcial) — via clientItems granular.
/* detail-hierarchy-v2 — PHASE-AWARE (espelho do Worker V64.41): pendência de item só conta
   na FASE ATUAL (clientItems.iX.phase === clientApprovalPhaseOf). Ajustes de TEMAS resolvidos
   não contaminam a fase final — corrige o card preso em "Ajuste solicitado". */
function pendingClientItems(t){const ci=t&&t.clientItems;if(!ci||typeof ci!=='object')return [];
  const ph=clientApprovalPhaseOf(t);const out=[];
  Object.keys(ci).forEach(k=>{const m=k.match(/^i(\d+)$/);if(!m)return;const it=ci[k]||{};
    if((it.cs==='em_revisao'||it.cs==='editado')&&it.phase===ph)out.push({idx:+m[1],cs:it.cs,note:it.note||''});});
  return out;}
function hasPendingItemRevision(t){return pendingClientItems(t).length>0;}
/* equipe já corrigiu (teamAdjustedAt) e cliente ainda não reanalisou? */
function hasTeamAdjustedAwaiting(t){const ci=t&&t.clientItems;if(!ci||typeof ci!=='object')return false;
  if(pendingClientItems(t).length)return false;
  return Object.keys(ci).some(k=>{const it=ci[k];return it&&it.teamAdjustedAt&&!it.cs;});}
/* V64.47 (bug 1.0.132) — TODOS os conteúdos da FASE ATUAL aprovados pelo cliente?
   (espelho do fechamento de fase do Worker; item legado sem phase NÃO conta).
   Destrava docs com o global 'revisao' herdado do ciclo ajuste→correção→aprovação. */
function allPhaseItemsApproved(t){
  const ci=t&&t.clientItems;if(!ci||typeof ci!=='object')return false;
  const arr=Array.isArray(t&&t.cronContents)?t.cronContents:[];const total=arr.length;
  if(!total)return false;
  const ph=clientApprovalPhaseOf(t);
  for(let i=0;i<total;i++){const it=ci['i'+i];if(!(it&&it.cs==='aprovado'&&it.phase===ph))return false;}
  return true;
}
/* ===== FONTE ÚNICA DA VERDADE — o fluxo está REALMENTE encerrado? =====
   "Concluído" exige aprovação FINAL do cliente E zero pendências operacionais.
   O status BRUTO do kanban (t.status) NUNCA, sozinho, conclui um cronograma. */
function isFullyComplete(t){
  if(secOf(t.sector).key!=='cronograma')return (t&&t.status)==='concluido';
  // Guardas duras: qualquer pendência aberta => NUNCA concluído.
  if(hasDesigner(t)&&!designerDelivered(t))return false;                 // designer ainda produzindo
  if(pendingProduction(t))return false;                                  // legenda/Feed pendente
  if(pendingStory(t))return false;                                       // Story pendente (quando aplicável)
  if((t.clientReview&&t.clientReview.status)==='revisao')return false;   // revisão solicitada pelo cliente
  // Sinais DELIBERADOS de encerramento (escritos só na aprovação final pelo Worker/Desktop).
  return !!(t.finalApprovalCompleted===true||t.operationalStatus==='concluido'||t.clientFlowStatus==='concluido');
}
// Status operacional REAL — DERIVADO dos eixos + pendências (sempre dinâmico).
// 'concluido' tem caminho ÚNICO: isFullyComplete (aprovação final real + sem pendências).
function operationalCol(t){
  if(secOf(t.sector).key!=='cronograma')return t.status||'afazer';
  if(isFullyComplete(t))return 'concluido';                              // ÚNICO caminho para concluído
  const cf=clientCol(t);
  // V64.49: todos os itens aprovados com 'revisao' herdado = aguardando o cliente CONFIRMAR
  // no portal (botão "Aprovar temas") — para a Social isso é "Aguardando aprovação dos temas".
  if(cf==='revisao'&&!hasPendingItemRevision(t)&&allPhaseItemsApproved(t))return 'producao';
  if(cf==='revisao'||hasPendingItemRevision(t))return 'aguardando_revisao'; // cliente pediu ajuste
  if(cf==='reenviado')return 'aguardando_final';
  if(hasDesigner(t)){
    const dc=designerCol(t);
    if(dc==='concluido')return pendingProduction(t)?'aguardando_legenda':'aguardando_final'; // entregou: falta legenda/post ou pronto p/ reenvio
    // FLUXO CORRETO (task-flow-fix + role-aware passo 2): "Designer em produção" SÓ quando o
    // designer iniciou (andamento); "Designer em revisão" quando está corrigindo um ajuste
    // (revisao); recém-enviado (afazer/vazio) → "Aguardando designer iniciar".
    if(dc==='andamento')return 'aguardando_designer';
    if(dc==='revisao')return 'aguardando_designer_revisao';
    return 'aguardando_designer_iniciar';
  }
  // SEM designer atribuído: NUNCA mostrar produção/legenda/entrega.
  if(cf==='aprovado')return 'aguardando_envio';                          // temas aprovados → falta ENVIAR ao designer
  if(cf==='afazer')return 'afazer';
  return 'producao';                                                  // enviado ao cliente, aguardando feedback
}

function opColOf(k){return OPERATIONAL_COLS.find(c=>c.key===k)||OPERATIONAL_COLS[0];}
// ===== FASE 1 — STATUS UNIFICADO (clientStatusView) =====================================
// FONTE ÚNICA de leitura do status VISUAL (badge) da tarefa. PURA, read-time e ADITIVA:
// NÃO altera schema, NÃO altera bucketing de coluna e NÃO é usada por nenhum render ainda
// (passo 1 — função dormente). É um wrapper FIEL de operationalCol(t):
//  • cronograma  → key = operationalCol(t) (que já encadeia isFullyComplete > revisão >
//                  reenvio/final > designer > envio > afazer > produção); label/color de OPERATIONAL_COLS.
//  • outros setores → key = t.status; label/color de STATUS[] (stOf).
// Garantia (E2E de não-regressão): clientStatusView(t).{key,label,color} === o que o badge
// já mostra hoje via opColOf(operationalCol(t)) — mesmo resultado, agora em um lugar só.
function clientStatusView(t){
  if(!t)return {key:'afazer',label:'A Fazer',color:'#9BA0AB',axis:'status'};
  if(secOf(t.sector).key!=='cronograma'){const s=stOf(t.status);return {key:(t.status||'afazer'),label:s.label,color:s.color,axis:'status'};}
  const k=operationalCol(t);const c=opColOf(k);
  return {key:k,label:c.label,color:c.color,axis:'operational'};
}
// ===== FASE 2 (passo 1) — TIMELINE OPERACIONAL (taskTimeline) ===========================
// Função PURA, read-only e DORMENTE (nenhum render a usa ainda). Centraliza a leitura da
// história operacional da tarefa reaproveitando EXATAMENTE as flags do opPanelBlock
// (themesOk, hasDesigner, designerDelivered, pendingProduction, resent, finalOk) — os
// estados dos marcos são idênticos aos de hoje. Acrescenta {current,last,next,owner} e
// tenta enriquecer cada marco com {at,by} a partir de history[] (formato kind OU type),
// clientActions[] e timestamps; tudo TOLERANTE: ausência de data/autor → null (sem quebrar).
function _tlEventAt(t, keys){
  // varre history[] (kind|type|label|channel) + clientActions[] buscando o evento mais recente
  // cujo "rótulo" casa com alguma palavra-chave; devolve {at,by} ou null. Nunca lança.
  let best=null;
  const consider=(txt,at,by)=>{ if(!at)return; const s=(txt||'').toString().toLowerCase();
    if(keys.some(k=>s.indexOf(k)>=0)){ if(!best||at>best.at) best={at:Number(at),by:by||null}; } };
  try{ const h=Array.isArray(t&&t.history)?t.history:[]; h.forEach(e=>{ if(!e)return;
    consider((e.kind||'')+' '+(e.type||'')+' '+(e.label||'')+' '+(e.channel||'')+' '+(e.to||''), e.at, e.byId||e.by||null); }); }catch(_){ }
  try{ const ca=(t&&t.clientActions&&typeof t.clientActions==='object')?t.clientActions:{}; Object.keys(ca).forEach(k=>{const a=ca[k];if(!a)return;
    consider((a.type||'')+' client', a.at, a.by||a.byId||null); }); }catch(_){ }
  return best;
}
// FASE 2 (passo 2.1) — HUMANIZAÇÃO de rótulos de evento (read-only). Mapeia kind/type internos
// para texto humano; nunca expõe código técnico no card. Não altera history[]/clientActions[].
const TL_EVENT_LABELS={
  designer_moved:'Designer atualizou', designer_andamento:'Designer em produção', designer_done:'Designer entregou',
  moved:'Tarefa movida', created:'Criado', criado:'Criado',
  reviseItem:'Cliente pediu ajuste', revision:'Cliente pediu revisão', edit_request:'Cliente pediu edição',
  approveAll:'Cliente aprovou tudo', approve:'Cliente aprovou', approveItem:'Cliente aprovou conteúdo',
  editTheme:'Cliente editou tema', editLegenda:'Cliente editou legenda', noteItem:'Cliente comentou', comment:'Cliente comentou',
  enviado_cliente:'Enviado ao cliente', sent_to_client:'Enviado ao cliente',
  sent_to_designer:'Enviado ao designer', designer_atribuido:'Enviado ao designer',
  social_producao:'Legendas/artes atualizadas', social_editou_conteudo:'Conteúdo editado', social_corrigiu:'Conteúdo corrigido',
  reenviado_cliente:'Enviado para aprovação final', final_sent:'Enviado para aprovação final', final_review:'Enviado para aprovação final',
  final_approved:'Aprovado final', ackFeedback:'Feedback enviado à equipe',
};
function _tlRelAgo(ms){ if(!ms)return ''; const dif=Date.now()-Number(ms); if(dif<0||isNaN(dif))return '';
  const mi=Math.floor(dif/60000); if(mi<1)return 'agora'; if(mi<60)return 'há '+mi+' min';
  const hr=Math.floor(mi/60); if(hr<24)return 'há '+hr+'h'; const dd=Math.floor(hr/24); return 'há '+dd+' dia'+(dd>1?'s':''); }
function _tlHumanLabel(ev){
  if(!ev)return 'Atualização';
  const key=(ev.kind||ev.type||'').toString();
  if(TL_EVENT_LABELS[key])return TL_EVENT_LABELS[key];
  const lbl=(ev.label||'').toString().trim();
  // descarta "label" que pareça código (snake_case ou camelCase técnico).
  const looksCode = (/^[a-z0-9]+(_[a-z0-9]+)+$/i.test(lbl)) || (/^[a-z]+[A-Z][a-zA-Z]*$/.test(lbl));
  if(lbl && !looksCode) return lbl;
  if(TL_EVENT_LABELS[lbl]) return TL_EVENT_LABELS[lbl];
  return 'Atualização';
}
function taskTimeline(t){
  t=t||{};
  const cur=clientStatusView(t);
  const cf=clientCol(t);
  const hasD=hasDesigner(t);
  const delivered=designerDelivered(t);
  // FLUXO CORRETO (task-flow-fix): o designer só está "em produção" quando moveu p/ andamento
  // (ou retrabalho 'revisao'), ou já entregou. Recém-enviado (afazer) NÃO conta como produção.
  const designerStarted=hasD&&(designerCol(t)==='andamento'||designerCol(t)==='revisao'||delivered);
  // MESMAS expressões do opPanelBlock (não-regressão de estado):
  const themesOk=(cf==='aprovado'||cf==='producao'||cf==='revisao'||cf==='reenviado'||cf==='concluido'||(t.clientReview&&t.clientReview.status==='aprovado'));
  const sent=(cf!=='afazer')||!!(t.clientSentBy||t.clientReviewToken||t.shareToken);
  const prodOk=!pendingProduction(t);
  const resent=(cf==='reenviado'||cf==='concluido');
  const finalOk=!!(t.finalApprovalCompleted||cf==='concluido'||operationalCol(t)==='concluido');
  const ajusteAtivo=!!((t.clientReview&&t.clientReview.status==='revisao')||hasPendingItemRevision(t));
  // 10 marcos canônicos com o done reaproveitando as flags acima.
  const RAW=[
    {key:'criado',            label:'Criado',                        done:true,            ev:['criado','created']},
    {key:'enviado_cliente',   label:'Enviado ao cliente',            done:!!sent,          ev:['enviado_cliente','enviou','share','link','sent_to_client']},
    {key:'temas_aprovados',   label:'Temas aprovados',               done:!!themesOk,      ev:['approveall','approve','aprovou','aprovado']},
    {key:'enviado_designer',  label:'Enviado ao designer',           done:!!hasD,          ev:['designer','sent_to_designer','atribu']},
    {key:'designer_producao', label:'Designer em produção',          done:!!designerStarted, ev:['designer_moved','andamento','producao']},
    {key:'designer_entregou', label:'Designer entregou',             done:!!delivered,     ev:['concluido','entreg','delivered']},
    {key:'aguardando_legenda',label:'Aguardando legenda / posts',    done:!!prodOk,        ev:['social_producao','production','legenda','social_editou']},
    {key:'enviado_final',     label:'Enviado para aprovação final',  done:!!resent,        ev:['reenviado_cliente','final_review','reenviado']},
    {key:'ajuste',            label:'Cliente pediu ajuste',          done:false, optional:true, active:ajusteAtivo, ev:['reviseitem','revision','revis','em_revisao','editou']},
    {key:'concluido',         label:'Aprovado final / Concluído',    done:!!finalOk,       ev:['final','concluido','aprovado final','ackfeedback']},
  ];
  // "current" = primeiro marco não-concluído (ignorando o de ajuste), quando ainda não encerrou.
  const firstPending = finalOk ? -1 : RAW.findIndex(m=>!m.done && m.key!=='ajuste');
  const milestones=RAW.map((m,i)=>{
    let state;
    if(m.key==='ajuste') state=m.active?'attention':'optional';
    else if(m.done) state='done';
    else if(i===firstPending) state='current';
    else state='pending';
    const e=_tlEventAt(t,m.ev);
    let at=e?e.at:null, by=e?e.by:null;
    if(m.key==='criado'&&!at) at=t.createdAt||null;
    if(m.key==='concluido'&&!at&&finalOk) at=t.doneAt||null;
    return {key:m.key,label:m.label,state:state,done:!!m.done,optional:!!m.optional,at:at,by:by};
  });
  // ÚLTIMO evento (cronológico) — o item mais recente de history[]/clientActions[].
  // FASE 2 (passo 2.1): o rótulo é HUMANIZADO (via _tlHumanLabel) — nunca expõe kind/type cru.
  let last=null;
  try{
    const ev=[];
    (Array.isArray(t.history)?t.history:[]).forEach(e=>{ if(e&&e.at) ev.push({label:e.label,type:e.type,kind:e.kind,at:Number(e.at),by:e.byId||e.by||null}); });
    const ca=(t.clientActions&&typeof t.clientActions==='object')?t.clientActions:{};
    Object.keys(ca).forEach(k=>{const a=ca[k];if(a&&a.at)ev.push({type:a.type,at:Number(a.at),by:a.by||a.byId||null});});
    if(ev.length){ ev.sort((a,b)=>b.at-a.at); const e0=ev[0]; last={label:_tlHumanLabel(e0),at:e0.at,by:e0.by}; }
  }catch(_){ }
  if(!last){ // fallback: último marco "done" sem data
    for(let i=milestones.length-1;i>=0;i--){ if(milestones[i].done){ last={label:milestones[i].label,at:milestones[i].at||null,by:milestones[i].by||null}; break; } }
  }
  // RESPONSÁVEL agora — papel que deve agir no estágio atual.
  let owner={role:'—',id:null};
  if(finalOk) owner={role:'—',id:null};
  else if(hasD&&!delivered) owner={role:'Designer',id:designerOf(t)};
  else if(operationalCol(t)==='aguardando_legenda'||operationalCol(t)==='aguardando_envio'||operationalCol(t)==='afazer') owner={role:'Social',id:(t.clientSentBy||t.by||t.assigneeId||null)};
  else if(['enviado','producao','reenviado'].indexOf(cf)>=0||ajusteAtivo) owner={role:'Cliente',id:null};
  return { current:cur, last:last, next:nextActionText(t), owner:owner, milestones:milestones };
}
// Bucket de 4 colunas (afazer/andamento/revisao/concluido) para os quadros por SETOR e
// "Meu quadro". Para CRONOGRAMA, deriva do eixo OPERACIONAL — assim o status BRUTO nunca
// coloca um cronograma em "Concluído" antes da aprovação final real (paridade com o card).
function boardCol4(t){
  if(secOf(t.sector).key!=='cronograma')return t.status||'afazer';
  const oc=operationalCol(t);
  if(oc==='concluido')return 'concluido';            // só quando isFullyComplete
  if(oc==='aguardando_revisao')return 'revisao';
  if(oc==='afazer')return 'afazer';
  return 'andamento';                                 // producao/aguardando_designer/legenda/final
}

function designerNextShort(t){switch(designerColView(t)){

// Timeline COMPACTA do card na perspectiva do DESIGNER: mini-trilho do fluxo DELE (A Fazer →
// Em andamento → Entregue, com marcador de Revisão) + "Sua etapa" + "Próxima". NÃO mostra o
// Bucket de 4 colunas do CLIENTE (a partir do eixo do cliente).
// REGRA DEFINITIVA (bug 1.0.133): a coluna "Aprovado" do quadro Cliente é SÓ a conclusão
// REAL do cronograma (aprovação final — clientCol 'concluido' via isFullyComplete).
// Temas aprovados ('aprovado') é etapa INTERMEDIÁRIA → fica em "Em análise" com a produção.
function clientCol4(t){const c=clientCol(t);
  if(c==='revisao'&&allPhaseItemsApproved(t))return 'analise';   // aguardando confirmação do cliente
  if(c==='revisao')return 'revisao';
  if(c==='concluido')return 'aprovado';
  if(c==='aprovado'||c==='producao'||c==='reenviado')return 'analise';
  return 'enviado';                                   // afazer/enviado
}
// Linguagem do QUADRO CLIENTE (bug 1.0.133): o card da aba Cliente NÃO usa o jargão
// operacional interno ("Aguardando designer iniciar" etc.). Status simples, na linguagem
// que o cliente entenderia — derivado dos MESMOS eixos (clientCol/operationalCol), só leitura.
function clientFacingStatusView(t){
  const c=clientCol(t);
  if(c==='concluido')return {key:'concluido',label:'Cronograma concluído',color:'#10B981'};
  if(c==='revisao'&&allPhaseItemsApproved(t))return {key:'aguarda_confirmacao',label:'Temas aprovados — aguardando confirmação',color:'#22D3EE'};
  if(c==='revisao')return {key:'revisao',label:'Ajuste solicitado — equipe corrigindo',color:'#F59E0B'};
  if(c==='reenviado')return {key:'final',label:'Versão final disponível para análise',color:'#34D399'};
  if(c==='aprovado'||c==='producao'){
    const oc=operationalCol(t);
    if(oc==='aguardando_envio')return {key:'temas_ok',label:'Temas aprovados — produção em andamento',color:'#34D399'};
    if(oc==='aguardando_legenda')return {key:'legendas',label:'Aguardando legendas e posts',color:'#5B6CFF'};
    if(oc==='aguardando_final')return {key:'final',label:'Versão final disponível para análise',color:'#34D399'};
    return {key:'producao',label:'A equipe está produzindo as artes',color:'#A78BFA'};
  }
  if(c==='enviado')return {key:'enviado',label:'Temas enviados — aguardando análise',color:'#22D3EE'};
  return {key:'preparacao',label:'Em preparação',color:'#6E7480'};
}
// "Próxima" CURTA do card do QUADRO CLIENTE — mesma linguagem simples (sem jargão interno).
function clientFacingNextShort(t){switch(clientFacingStatusView(t).key){
  case 'aguarda_confirmacao':return 'Cliente confirma a aprovação no portal';
  case 'temas_ok':  return 'Equipe inicia a produção das artes';
  case 'producao':  return 'Aguardar a produção das artes';
  case 'legendas':  return 'Equipe adiciona legendas e posts';
  case 'final':     return 'Aguardar a aprovação final do cliente';
  case 'revisao':   return 'Equipe corrige e reenvia ao cliente';
  case 'enviado':   return 'Aguardar a análise dos temas';
  case 'concluido': return 'Cronograma encerrado';
} return 'Acompanhar o andamento';}
// Bucket de 4 colunas DERIVADO DO PAPEL DE QUEM VÊ. Se quem abre o quadro é o DESIGNER
// atribuído à tarefa, usa o eixo de trabalho do designer (assim um cronograma recém-enviado
// cai em "A Fazer" do designer — paridade com o Android). Senão, usa o eixo operacional.
function boardCol4For(t,uid){
  if(secOf(t.sector).key!=='cronograma')return t.status||'afazer';
  if(uid&&hasDesigner(t)&&designerOf(t)===uid){
    const dc=designerCol(t);
    return dc==='concluido'?'concluido':dc==='revisao'?'revisao':dc==='andamento'?'andamento':'afazer';
  }
  return boardCol4(t);
}

function fmtDateTimeBR(v){
  if(v===undefined||v===null||v==='')return 'Não informado';
  let ms=null;
  if(typeof v==='number')ms=v;
  else if(typeof v==='object'){if(typeof v.toDate==='function'){try{ms=v.toDate().getTime();}catch(_){}}else if(typeof v.seconds==='number')ms=v.seconds*1000;}
  else if(typeof v==='string'){const n=Number(v);if(v.trim()!==''&&!isNaN(n))ms=n;else{const dt=new Date(v);if(!isNaN(dt.getTime()))ms=dt.getTime();}}
  if(ms===null||isNaN(ms))return 'Não informado';
  const dt=new Date(ms),p=n=>String(n).padStart(2,'0');
  return p(dt.getDate())+'/'+p(dt.getMonth()+1)+'/'+dt.getFullYear()+' às '+p(dt.getHours())+':'+p(dt.getMinutes());
}
function cronOf(t){
  const arr=Array.isArray(t.cronContents)?t.cronContents:(Array.isArray(t.contents)?t.contents:null);
  if(!arr||!arr.length)return null;
  const list=arr.map((c,i)=>({tema:c&&c.tema,legenda:c&&c.legenda,_i:i})).filter(c=>c.tema||c.legenda);
  const count=arr.length;
  const label=count>=12?'Mensal':count>=6?'Quinzenal':count>=3?'Semanal':'Cronograma';
  return {list,count,label};
}
function lastUpdate(t){
  if(t.updatedAt)return t.updatedAt;
  if(Array.isArray(t.history)&&t.history.length){const ats=t.history.map(h=>h&&h.at).filter(Boolean);if(ats.length)return Math.max.apply(null,ats);}
  return t.doneAt||t.startedAt||null;
}

function taskCard(t, persp){
  /* ═══ CARD V4 — implementação FIEL ao print de referência aprovado pelo usuário
     (estrutura completa do card original com acabamento premium):
     pill de status + prazo → pessoa (avatar 44 + nome + cargo c/ presença) →
     caixa "Enviado por" → cliente/título → chips → trilho de progresso →
     SUA ETAPA/PRÓXIMA → TEMAS com círculos de estado → data → Detalhes/Mover/⋯.
     Fontes únicas preservadas (designerStatusView × clientFacing × clientStatusView ×

  const designerView = persp==='designer' && secOf(t.sector).key==='cronograma' && hasDesigner(t);

  const req=t.by?state.users.find(u=>u.id===t.by):null;const reqName=req?req.name:'';
  const cron=cronOf(t);const isCron=s.key==='cronograma';
  const stage=isCron?(designerView?designerStatusView(t):(clientView?clientFacingStatusView(t):clientStatusView(t))):null;
  const topSt=designerView?designerStatusView(t):st;           // pill superior (como no modelo)
  const acc=(stage&&stage.color)||topSt.color;
  let prog=null;
  if(isCron){
    if(designerView){
      const cur=designerColView(t);const ci=cur==='entregue'?3:(cur==='afazer'?0:1);
      prog={total:3,done:ci===3?3:ci,curIdx:ci===3?-1:ci,next:designerNextShort(t),attention:cur==='revisao'};
    }else{
      const tl=taskTimeline(t);const main=tl.milestones.filter(m=>m.key!=='ajuste');
      const ownU=tl.owner&&tl.owner.id?state.users.find(u=>u.id===tl.owner.id):null;
      prog={total:main.length,done:main.filter(m=>m.state==='done').length,
            curIdx:main.findIndex(m=>m.state==='current'),
            owner:(tl.owner&&tl.owner.role!=='—')?(tl.owner.role+(ownU&&ownU.name?(' · '+ownU.name.split(' ')[0]):'')):'Concluído',
            next:clientView?clientFacingNextShort(t):nextActionShort(t),

    }

  let chk='';

  }
  const dShort=d?d.text:'';
  let h='<div class="tc tcv4" style="--acc:'+acc+'">';
  // 1) pill de STATUS + prazo
  h+='<div class="tcv4-top">'+
       '<span class="tcv4-st" style="color:'+topSt.color+';background:'+withAlpha(topSt.color,.13)+';border-color:'+withAlpha(topSt.color,.3)+'" title="'+esc(topSt.label)+'"><span class="dotc" style="background:'+topSt.color+'"></span><b>'+esc(designerView?topSt.label.replace('Designer em ','Em '):topSt.label)+'</b></span>'+
       (d?'<span class="tcv4-due" style="color:'+d.color+';background:'+withAlpha(d.color,.18)+';border-color:'+withAlpha(d.color,.35)+'">'+esc(dShort)+'</span>':'')+
     '</div>';

  h+='<div class="tcv4-person">'+
       '<span class="tcv4-avw">'+(asgName?avatar(asg||{name:asgName,id:t.assigneeId},52):'<div class="av" style="width:52px;height:52px;background:var(--surface2);color:var(--faint)">'+svg('person')+'</div>')+'<i class="tcv4-presence"></i></span>'+

  h+='<div class="tcv4-chips">'+
       (stage&&!designerView?'<span class="tcv4-chip" style="color:'+stage.color+';background:'+withAlpha(stage.color,.13)+'"><span class="dotc" style="background:'+stage.color+'"></span>'+esc(stage.label)+'</span>':

       '<span class="tcv4-chip" style="color:'+s.color+';background:'+withAlpha(s.color,.13)+'">'+esc(s.label)+'</span>'+
       (cron?'<span class="tcv4-chip tcv4-chip-soft">'+esc(cron.label)+'</span>':'')+
       (t.priority?'<span class="tcv4-chip" style="color:#F87171;background:'+withAlpha('#F87171',.13)+'">⚑ Prioridade</span>':'')+
     '</div>';
  // 6) trilho de progresso (pontos) + 7) SUA ETAPA / PRÓXIMA
  if(prog){
    let rail='';

      const cls=i2<prog.done?'done':(i2===prog.curIdx?'cur':'');
      rail+='<i class="'+cls+'"'+(i2===prog.curIdx?' style="background:'+acc+';box-shadow:0 0 7px '+withAlpha(acc,.8)+'"':'')+'></i>'+

    h+='<div class="tcv4-steps">'+

       '</div>';

  if(cron&&cron.list.length){
    const lim=3;const show=cron.list.slice(0,lim);const rest=cron.count-show.length;
    const mini=cron.list.slice(0,6).map(c=>{
      const ci=(t.clientItems||{})['i'+c._i]||{};
      const cls=ci.cs==='aprovado'||(ci.teamAdjustedAt&&!ci.cs)?'ok':(ci.cs==='em_revisao'||ci.cs==='editado'?'rev':'');
      return '<span class="tcv4-mini-n '+cls+'" title="'+esc(c.tema||('Conteúdo '+(c._i+1)))+'">'+(c._i+1)+'</span>';
    }).join('')+(cron.count>6?'<span class="tcv4-mini-n">+'+(cron.count-6)+'</span>':'');
    h+='<div class="tcv4-themes"><div class="tcv4-themes-h">Temas</div>'+
       '<div class="tcv4-mini">'+mini+'</div>'+

         const fixed=ci.teamAdjustedAt&&!ci.cs;

       }).join('')+
       (rest>0?'<div class="tcv4-theme-more">+ '+rest+' conteúdo'+(rest>1?'s':'')+'</div>':'')+'</div>';
  }
  h+=chk;
  // 9) data limite
  if(t.dueDate||t.due)h+='<div class="tcv4-date">'+svg('calendar')+fmtDateBR(t.dueDate||t.due)+(t.dueTime?' às '+esc(t.dueTime):'')+'</div>';
  // 10) ações — Detalhes / Mover / ⋯ (menu com Excluir)
  h+='<div class="tcv4-foot">'+
       '<button class="tcv4-btn tcv4-btn-main tc-detail" data-detail="'+t.id+'">'+svg('eye')+'<span>Detalhes</span></button>'+

         '<span class="tcv4-menu" data-menu-of="'+t.id+'"><button class="tcv4-menu-it del-btn" data-del="'+t.id+'">'+svg('trash')+'Excluir tarefa</button></span></span>':'')+
     '</div>';
  return h+'</div>';
}

async function moveStatus(taskId,newStatus){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;const now=Date.now();
  if(isDesignerAxisMove(t)){
    // EIXO DO DESIGNER (fonte única): grava designerFlowStatus; NÃO toca em status genérico nem doneAt.
    const old=designerCol(t);
    const patch={designerFlowStatus:newStatus,designerWorkflowStage:newStatus,history:firebase.firestore.FieldValue.arrayUnion({kind:'designer_moved',at:now,byId:state.user.id,from:old,to:newStatus})};
    if(newStatus!=='afazer'&&!t.startedAt)patch.startedAt=now;
    closeModal();await db.collection('tasks').doc(taskId).update(patch);return;
  }
  const old=t.status||'afazer';
  const patch={status:newStatus,history:firebase.firestore.FieldValue.arrayUnion({kind:'moved',at:now,byId:state.user.id,from:old,to:newStatus})};
  if(newStatus!=='afazer'&&!t.startedAt)patch.startedAt=now;
  if(newStatus==='concluido'){patch.doneAt=now;patch.doneBy=state.user.id;}
  closeModal();await db.collection('tasks').doc(taskId).update(patch);
}

    next:'Nada a fazer — aprovação final registrada'+(t.clientFinalApprovedAt?(' em '+fmtDateTimeBR(t.clientFinalApprovedAt)):'')+'.',
    owner:'none',actions:['clientview']};

      next:'Aguardar o designer finalizar a revisão e entregar.',
      owner:'designer',actions:['dboard']};
    return {key:'designer_producao',color:'#F5A524',
      label:'Designer em produção', sub:'O designer está produzindo as artes do cronograma.',
      next:'Aguardar a entrega das artes pelo designer.',

    next:'Revisar as artes, adicionar legendas e posts e enviar ao cliente.',
    owner:'social',actions:['prod','sendclient']};

    label:'Em preparação', sub:'O cronograma ainda não foi enviado ao cliente.',

/* "Marcar como corrigido" — CAMADA CENTRAL (Worker V64.44 team-action). O Desktop NÃO
   grava direto no Firestore para este evento: a rota central limpa clientItems[iX].cs
   (preserva phase), registra history e chama notifyWorkflowEvent() — Web Push real ao
   cliente quando configurado, fallback WhatsApp sinalizado, dedup + idempotência.
   Auth: capability do clientReviewToken (URL) + uid Social/Admin validado por role-lookup
   REAL no Worker (users/{uid} via service account). NENHUM secret embutido no app. */
async function markItemsAdjusted(taskId){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const pend=pendingClientItems(t);if(!pend.length){flashToast('Nenhum ajuste pendente nesta fase.');return;}
  const token=t.clientReviewToken||t.shareToken||'';
  if(!token){flashToast('Tarefa sem link de cliente — envie ao cliente antes de marcar correções.');return;}
  const idxs=pend.map(p=>p.idx);
  // AUTENTICAÇÃO FORTE: Bearer teamSessionJwt (emitido em /team/session no login).
  // uid declarado NÃO é enviado — a identidade vem do `sub` do JWT verificado no Worker.
  // JWT ausente/expirado → modal de renovação na hora (senha não persistida).
  if(!(await ensureTeamSession())){flashToast('Correção NÃO registrada — sessão de equipe não renovada.');return;}
  const jwt=localStorage.getItem('wp_team_jwt')||'';
  if(!jwt){flashToast('Sessão de equipe indisponível — tente novamente.');return;}
  // Idempotência: chave estável por (uid|tarefa|itens|janela de 10s) — o duplo clique
  // reaproveita a MESMA chave (replay no Worker); um novo ajuste depois gera chave nova.
  const idem=state.user.id+'|'+taskId+'|'+idxs.join(',')+'|'+Math.floor(Date.now()/10000);
  let r=null;
  try{
    const res=await fetch(CLIENT_REVIEW_BASE+'/cliente/cronograma/'+encodeURIComponent(token)+'/team-action',{
      method:'POST',
      headers:{'Content-Type':'application/json','Idempotency-Key':idem,'Authorization':'Bearer '+jwt},
      body:JSON.stringify({action:'adjustedItem',contentIndexes:idxs,byName:state.user.name||''})
    });
    r=await res.json();
    // hardening: QUALQUER 401 (expirado, adulterado, revogado) limpa o token e orienta
    // novo login — nunca insiste com credencial inválida.
    if(res.status===401){localStorage.removeItem('wp_team_jwt');
      flashToast('Sessão de equipe expirada ou inválida — saia e entre novamente para registrar correções.');return;}
    if(!res.ok||!r||r.ok!==true){flashToast('Não foi possível registrar a correção: '+((r&&r.error)||('HTTP '+res.status)));return;}
  }catch(e){flashToast('Falha de rede ao registrar a correção. Tente novamente.');return;}
  // Otimista APÓS confirmação do Worker (o onSnapshot confirma na sequência).
  const now=r.at||Date.now();
  pend.forEach(p=>{const it=(t.clientItems||{})['i'+p.idx];if(it){it.cs=null;it.teamAdjustedAt=now;it.teamAdjustedBy=state.user.name||'Equipe';}});
  const pushed=(r.push&&r.push.sent)||0;
  flashToast(pushed>0?'Correção registrada — cliente avisado por notificação.':'Correção registrada — o cliente verá ao abrir o link (aviso por WhatsApp se necessário).');
  openDetails(taskId);
}

// V1.0.98 — Fase de aprovação do cliente (espelha o Worker).
function clientApprovalPhaseOf(t){
  const e=(t&&t.clientApprovalPhase||'').toString();if(e==='themes'||e==='production'||e==='final')return e;
  if(t&&t.finalApprovalCompleted===true)return 'final';
  if(t&&(t.cronStatus==='ready_for_final_client_review'||t.workflowStage==='entrega'||t.workflowStage==='revisao_final'))return 'final';
  const arr=Array.isArray(t&&t.cronContents)?t.cronContents:[];const total=arr.length||0;
  if(total>0){const withLeg=arr.filter(c=>c&&c.legenda&&String(c.legenda).trim()).length;
    const withFeed=arr.filter(c=>c&&c.feedImageUrl).length;
    if(withLeg===total&&withFeed===total)return 'production';}
  return 'themes';
}

  });
  h+='</div>';
  return h;

function clientRevisionFixBlock(t){
  const ci=(t.clientItems&&typeof t.clientItems==='object')?t.clientItems:null;
  if(!ci)return '';
  const arr=Array.isArray(t.cronContents)?t.cronContents:[];
  const rows=[];
  Object.keys(ci).forEach(k=>{const m=k.match(/^i(\d+)$/);if(!m)return;const idx=+m[1];const it=ci[k]||{};
    if(it.cs!=='em_revisao'&&it.cs!=='editado')return;
    const c=arr[idx]||{};const tema=(typeof it.theme==='string'&&it.theme)?it.theme:(c.tema||'(sem tema)');const leg=(typeof it.legenda==='string')?it.legenda:(c.legenda||'');
    const isRev=it.cs==='em_revisao';const col=isRev?'#F59E0B':'#A78BFA';
    rows.push({idx:idx,tema:tema,leg:leg,note:it.note||'',col:col,isRev:isRev});});
  if(!rows.length)return '';
  let h='<div class="det-sec">Correções pedidas pelo cliente</div>';
  rows.forEach(r=>{

const IK_PUBLIC_KEY='public_wD+TthW+vGHy/VK37SgcGhDP5Pg=';
// HOTFIX 1.0.86: URL montada em RUNTIME (função), nao em const top-level.
// Antes era `const IK_AUTH_URL=CLIENT_REVIEW_BASE+...`, mas CLIENT_REVIEW_BASE
// e declarado mais abaixo no arquivo -> TDZ abortava o script e o login nao

function ikAuthUrl(){return CLIENT_REVIEW_BASE+'/imagekit-auth';}
// Upload real via ImageKit (mesmo padrão do PWA). Fora do ambiente sandbox a rede
// e liberada; aqui a UI tambem aceita colar URL como alternativa.
async function ikUpload(file,folder){
  const a=await fetch(ikAuthUrl()).then(r=>r.json());
  if(!a||!a.token||!a.signature||!a.expire)throw new Error('assinatura ImageKit inválida');
  const fd=new FormData();
  fd.append('file',file);fd.append('fileName',file.name||('art_'+Date.now()+'.jpg'));
  fd.append('publicKey',IK_PUBLIC_KEY);fd.append('signature',a.signature);
  fd.append('expire',String(a.expire));fd.append('token',a.token);
  fd.append('folder',folder||'/cronogramas');fd.append('useUniqueFileName','true');
  const up=await fetch('https://upload.imagekit.io/api/v1/files/upload',{method:'POST',body:fd});
  if(!up.ok)throw new Error('ImageKit '+up.status);
  const j=await up.json();if(!j||!j.url)throw new Error('ImageKit sem URL');return j.url;
}

    catch(err){console.warn('ikUpload',err);flashToast('Falha no upload. Cole a URL da arte como alternativa.');}
  }));
  // 1.0.110 — restaura o scroll da lista após re-render (não pula para o 1º post ao anexar arte).
  const _pl=document.querySelector('.pr-list');if(_pl&&state._prodScroll){try{_pl.scrollTop=state._prodScroll;}catch(_){}}

// guarda o scrollTop da lista de produção antes de um re-render disparado por upload/URL.
function _prodKeepScroll(){const l=document.querySelector('.pr-list');state._prodScroll=l?l.scrollTop:0;}
function prodCollect(){return (state._prod&&state._prod.items||[]).map(it=>({tema:it.tema||'',legenda:it.legenda||'',feedImageUrl:it.feedImageUrl||'',storyImageUrl:it.storyImageUrl||''}));}
async function saveProduction(taskId,resend){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const contents=prodCollect();const now=Date.now();const u=state.user||{};
  const tmp=Object.assign({},t,{cronContents:contents});   // p/ calcular pendências já com o novo conteúdo
  const pLeg=pendingLegend(tmp),pFeed=pendingFeed(tmp),pStory=pendingStory(tmp);
  const opSnap=resend?'aguardando_final':(pLeg||pFeed?'aguardando_legenda':'aguardando_final');
  const patch={cronContents:contents,
    // Social produzindo legendas/posts: eixo do cliente = "Em produção" (não some, não conclui).
    clientFlowStatus:'producao', clientWorkflowStage:'producao',
    // EIXO OPERACIONAL (snapshot) + pendências reais (legenda/feed/story).
    operationalStatus:opSnap, socialFlowStatus:opSnap, socialWorkflowStage:opSnap,
    pendingLegend:pLeg, pendingFeed:pFeed, pendingStory:pStory, pendingSocialReview:!resend,
    history:firebase.firestore.FieldValue.arrayUnion({type:'social_producao',label:'Social atualizou legendas/artes',by:u.name||'',byId:u.id||null,at:now,channel:'production'})};
  if(resend){patch.cronStatus='ready_for_final_client_review';patch.finalApprovalRequired=true;
    // V1.0.98 — reenvio com versão final = fase FINAL no cliente.
    patch.clientApprovalPhase='final';
    patch.history=firebase.firestore.FieldValue.arrayUnion({type:'reenviado_cliente',label:'Reenviado ao cliente (versão FINAL)',by:u.name||'',byId:u.id||null,at:now,channel:'final_review',phase:'final'});}
  t.cronContents=contents;t.clientFlowStatus='producao';t.operationalStatus=opSnap;if(resend){t.cronStatus='ready_for_final_client_review';t.clientApprovalPhase='final';}   // otimista
  closeModal();render();
  try{await db.collection('tasks').doc(taskId).update(patch);}catch(e){console.warn('saveProduction',e);}
  if(resend){
    // ensureReviewToken pode lançar (token não confirmado): nesse caso openSendClientModal
    // re-tenta e aborta com aviso se ainda falhar — nunca reenvia link órfão.
    try{await ensureReviewToken(taskId);}catch(e){console.warn('ensureReviewToken (resend)',e);}
    const tk=state.tasks.find(x=>x.id===taskId);flashToast('Versão final pronta. Reenviando ao cliente…');openSendClientModal(tk||t);
  }
  else flashToast('Produção salva. Reflete no link do cliente.');
}

// Designer = usuario OPERACIONAL (nao-MANAGER). Social/Admin veem tudo.
// Designer = quem PRODUZ. Inclui funcao de design/edicao E donos/admins (ex.: CEO
// que tambem atua como designer/responsavel tecnico) — sem hardcode de nome.
const DESIGNER_KW=['design','editor','edicao','edição','arte','video','vídeo','motion','ilustr','produç','produc'];
function isDesignerCandidate(u){
  if(!u)return false;const r=norm(u.role||'');
  if(DESIGNER_KW.some(k=>r.includes(norm(k))))return true;  // funcao de design/edicao
  // dono/CEO/responsavel tecnico (cargo permite produzir) — NAO inclui admin generico.
  return ['ceo','dono','owner','founder','socio'].some(k=>r.includes(norm(k)));
}
function designerUsers(){
  return state.users.filter(u=>u&&!['pendente','removido','excluido'].includes(u.status||'')
    && (!state.user||u.id!==state.user.id) && isDesignerCandidate(u));
}
// Cliente respondeu de forma que habilita envio ao designer (aprovou)?
function clientApproved(t){return t&&(t.cronStatus==='aprovado_cliente'||t.cronStatus==='client_approved'||(t.clientReview&&t.clientReview.status==='aprovado'));}
function isSentToDesigner(t){return t&&(t.cronStatus==='sent_to_designer'||t.designerAssignment);}
function cronStatusLabel(k){return (CRON_STATES[k]||{label:k}).label;}
function cronStatusColor(k){return (CRON_STATES[k]||{color:'#9BA0AB'}).color;}
// Deriva o tipo do cronograma (Semanal/Quinzenal/Mensal) de um form ou tarefa salva
function cronTypeLabel(o){
  const map={semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal'};
  if(o.subtype&&map[o.subtype])return map[o.subtype];
  if(o.cronSub&&map[o.cronSub])return map[o.cronSub];
  const n=(o.contents||o.cronContents||[]).length;
  if(n>=12)return 'Mensal';if(n>=6)return 'Quinzenal';if(n>=1)return 'Semanal';return 'Cronograma';
}
// Normaliza form ou tarefa salva num contexto unico para envio/preview
function cronCtx(o){
  const isForm=!o.id;
  return {
    id:o.id||null, isForm,
    client:(o.client||'').trim(),
    title:(o.title||'').trim()||'Cronograma',
    type:cronTypeLabel(o),
    status:o.cronStatus||(isForm?'pronto_cliente':'rascunho_social'),
    contents:(o.contents||o.cronContents||[]).filter(c=>c&&(c.tema||c.legenda||c.feedImageUrl||c.storyImageUrl)),
    assignee:o.assignee||'',
    token:o.clientReviewToken||null,
    phone:(o.clientPhone||o.phone||o.clientWhatsapp||'').toString().trim(),
    startDate:o.startDate||'',startTime:o.startTime||'',endDate:o.endDate||'',endTime:o.endTime||'',
    dueDate:o.dueDate||o.due||'',dueTime:o.dueTime||'',
  };
}

// 1.0.119 — HARDENING: o link público do cliente NUNCA pode sair sem token. Se o token
// vier vazio/nulo, LANÇA (em vez de emitir .../cliente/cronograma/ sem token) — assim é
// impossível copiar/enviar um link incompleto. O fluxo de envio já garante o token
// (ensureReviewToken + read-back no Firestore) antes de montar a mensagem.
function buildPublicClientUrl(token){
  var t=(token==null?'':String(token)).trim();
  if(!t){throw new Error('buildPublicClientUrl: link do cliente NUNCA pode sair sem token');}
  return CLIENT_LINK_BASE+'/cliente/cronograma/'+t;
}
// 1.0.124 — LINK DE COMPARTILHAMENTO (preview premium garantido no WhatsApp). Página leve
// /share/cronograma/<token> só com OG no <head> (card OG absoluto 1200×630, image/jpeg) que
// redireciona ao portal. É ESTE link que vai na mensagem colada no grupo — assim o WhatsApp
// renderiza a prévia premium do card. NUNCA sai sem token.
function buildShareClientUrl(token){
  var t=(token==null?'':String(token)).trim();
  if(!t){throw new Error('buildShareClientUrl: link de compartilhamento NUNCA pode sair sem token');}
  return CLIENT_LINK_BASE+'/share/cronograma/'+t;
}
// Token seguro, aleatorio, nao previsivel (48 hex). Capability do link publico.
function genReviewToken(){
  const a=new Uint8Array(24);(self.crypto||window.crypto).getRandomValues(a);
  return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
}
// (2b) Link interno/deep-link (uso do time dentro do app; NUNCA vai na mensagem do cliente).
function buildInternalClientLink(ctx){return 'idseven://client/'+((ctx&&ctx.id)||'<id>');}

// (1) Mensagem profissional, texto humano, com LINK PÚBLICO HTTPS. Sem idseven://, sem encode.
function buildClientMessage(ctx){
  const nome=(ctx&&ctx.client)||'cliente';
  // 1.0.124 — a mensagem usa o LINK DE COMPARTILHAMENTO (/share/...), que gera a prévia premium
  // do card no WhatsApp (OG dedicado) e redireciona ao portal. Sem asteriscos/emoji; modelo aprovado.
  // O botão "Revisar e aprovar" vive no PORTAL (aberto pelo link) — não há botão dentro do grupo.
  const url=buildShareClientUrl(ctx&&ctx.token);
  return 'Olá, '+nome+'.\n'+
    'Seu cronograma já está pronto para avaliação.\n\n'+
    'Acesse o link abaixo para revisar os temas, aprovar ou solicitar ajustes:\n\n'+
    url+'\n\n'+
    'Equipe ID Seven';
}

// (3) URLs TÉCNICAS — codificam a mensagem APENAS no momento de abrir o WhatsApp.
// 1.0.119-whatsapp-clean-send-hotfix — REMOVIDO o uso de send?text=. A mensagem NUNCA vai
// pela URL (evita que o cliente receba uma URL técnica web.whatsapp.com/send?text=...).
// Abrir WhatsApp = openWhatsAppPlain() (só app/site); mensagem = clipboard limpo.

// Garante que a tarefa tenha clientReviewToken + clientReviewUrl (gera e persiste se faltar).
// Funciona mesmo se a tarefa ainda nao chegou em state.tasks (recem-criada).
//
// HOTFIX (link orfao): ANTES, um update() com erro engolido (console.warn) retornava
// o token mesmo sem ter gravado -> o cliente recebia um link cujo token nunca foi salvo
// no Firestore, e o Worker respondia "Cronograma nao encontrado". Agora:
//   1) usa set(...,{merge:true}) em vez de update() -> robusto se o doc ainda nao existir
//      (corrida apos o add() do saveTask); continua aditivo (so mescla 2 campos).
//   2) NAO engole o erro: confirma a escrita com um get() de leitura (read-back).
//   3) se a gravacao/confirmacao falhar, LANCA -> o chamador aborta o envio em vez de
//      mandar um link orfao. So persiste a versao otimista em memoria APOS confirmar.
async function ensureReviewToken(taskId){
  if(!taskId)return null;
  const t=state.tasks.find(x=>x.id===taskId);
  if(t&&t.clientReviewToken)return t.clientReviewToken;
  const token=genReviewToken();const url=buildPublicClientUrl(token);
  // set merge: cria/mescla mesmo se o doc acabou de ser criado (sem depender de update).
  await db.collection('tasks').doc(taskId).set({clientReviewToken:token,clientReviewUrl:url},{merge:true});
  // Read-back: confirma que o token REALMENTE esta no servidor antes de liberar o envio.
  const snap=await db.collection('tasks').doc(taskId).get();
  const saved=snap&&snap.exists?snap.get('clientReviewToken'):null;
  if(saved!==token){throw new Error('clientReviewToken nao confirmado no Firestore');}
  // So agora atualiza o cache em memoria (estado consistente com o servidor).
  if(t){t.clientReviewToken=token;t.clientReviewUrl=url;}
  return token;
}

// 1.0.121-whatsapp-cloud-api-send — ENVIO AUTOMÁTICO OFICIAL (à prova de erro de verdade).
// O botão "Enviar card premium agora" chama a rota SEGURA do Worker (POST /client/send-premium-whatsapp),
// que envia a imagem real do card + legenda + link via WhatsApp Business Cloud API (server-side).
// O token da Meta NUNCA fica no client. Sucesso SÓ é exibido com message_id real devolvido pela Meta.
// Sem credenciais (503 WHATSAPP_CLOUD_API_NOT_CONFIGURED) → mensagem clara, sem cair para WhatsApp Web.
function _wireAutoSend(ctx){
  const $=id=>document.getElementById(id);
  const img=$('autoCardPreview');
  // Card oficial Aurora Glass embutido (mesma fonte do envio manual).
  try{ if(img) img.src='data:image/jpeg;base64,'+CARD_IMG_B64; }catch(_){ if(img) img.src=CARD_IMG_URL; }
  const btn=$('btnSendAuto'), status=$('autoStatus'), phoneEl=$('waPhone');
