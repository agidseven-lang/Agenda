<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ID Seven · Desktop 1.0.70 (Premium UI Polish)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0B10">
<style>
  /* ====== Design system espelhado do APK nativo (Theme.kt) ====== */
  :root{
    color-scheme: dark;   /* faz o Chromium/Electron pintar controles nativos (date/time, scrollbars) em tema escuro */
    --bg:#0A0B10; --surface:#15171F; --surface2:#1C1F29; --line:#262A36; --line-soft:#1F222C;
    --ink:#F1F2F4; --soft:#9BA0AB; --faint:#6E7480;
    --accent:#5B6CFF; --green:#34D399; --amber:#F59E0B; --red:#F87171; --violet:#A78BFA; --cyan:#22D3EE; --pink:#F472B6;
    --grad:linear-gradient(135deg,#22D3EE,#5B6CFF,#F472B6);
    --maxw:920px;        /* mobile shell */
    --d-maxw:1400px;     /* desktop content cap */
    --d-side:248px;      /* desktop sidebar width */
    --d-topbar:64px;     /* desktop topbar height */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",Inter,-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"ss01","cv11","kern";
    font-synthesis:none;
    -webkit-text-size-adjust:100%;
  }
  body{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .hidden{display:none!important}
  a{color:var(--accent)}

  .logo{background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .logo.lg{width:72px;height:72px;border-radius:20px;font-size:34px}
  .logo.sm{width:42px;height:42px;border-radius:13px;font-size:20px}

  /* ====== Login ====== */
  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 26px;max-width:480px;margin:0 auto}
  .brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:8px}
  .brand h1{margin:0;color:var(--accent);font-size:26px;font-weight:800;letter-spacing:-.01em}
  .brand .sub{color:var(--soft);font-size:13px;font-weight:500}
  #login .title{font-size:22px;font-weight:800;margin:28px 0 4px}
  #login .subtitle{font-size:13px;color:var(--soft);text-align:center;line-height:1.5;max-width:380px}
  .fld{width:100%;margin-top:12px}
  .fld label{display:block;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
  .inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-size:15px;padding:13px 14px;outline:none;transition:border-color .15s;color-scheme:dark}
  .inp::placeholder{color:var(--faint);opacity:1}
  .inp:focus{border-color:var(--accent)}
  /* date/time: indicador nativo do calendario/relogio VISIVEL no dark (era preto) */
  .inp[type=date]::-webkit-calendar-picker-indicator,
  .inp[type=time]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(1.7);opacity:.55;cursor:pointer;transition:opacity .12s}
  .inp[type=date]::-webkit-calendar-picker-indicator:hover,
  .inp[type=time]::-webkit-calendar-picker-indicator:hover{opacity:.95}
  .inp[type=date],.inp[type=time]{color:var(--ink)}
  .inp::selection{background:rgba(91,108,255,.4)}
  textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
  .pwwrap{position:relative}
  .pwwrap .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:12px;font-weight:700}
  .btn{width:100%;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
  .btn:active{filter:brightness(.94)}
  .btn[disabled]{opacity:.6;pointer-events:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  .btn.soft{background:rgba(91,108,255,.12);color:var(--accent);height:46px;border-radius:12px}
  .txtbtn{background:none;font-size:13px;font-weight:600;padding:8px;width:100%}
  .txtbtn.accent{color:var(--accent);font-weight:700}
  .txtbtn.soft{color:var(--soft)}
  .banner{width:100%;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500;margin-top:6px}
  .banner.err{background:rgba(248,113,113,.12);color:var(--red)}
  .banner.ok{background:rgba(52,211,153,.12);color:var(--green)}
  .spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vfooter{margin-top:28px;text-align:center;color:var(--soft);font-size:11px;line-height:1.6}
  .vfooter .pill-ver{display:inline-block;background:rgba(91,108,255,.14);color:var(--accent);font-weight:800;
    padding:4px 10px;border-radius:999px;margin-bottom:5px}

  /* ====== App shell ====== */
  #app{display:none;flex-direction:column;min-height:100vh;max-width:var(--maxw);margin:0 auto;position:relative}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--line-soft)}
  .topbar .tt{flex:1;min-width:0}
  .topbar .tt .nm{font-size:17px;font-weight:800}
  .topbar .tt .sy{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--soft);margin-top:1px}
  .topbar .tt .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .content{flex:1;padding-bottom:96px}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;overflow:hidden;flex:none;background-size:cover;background-position:center}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:var(--maxw);margin:0 auto;
    background:rgba(10,11,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0)) 6px}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10px;font-weight:600;padding:6px 0;border-radius:12px}
  .nav button.on{color:var(--accent);font-weight:800}
  .nav button svg{width:23px;height:23px}
  .nav .fab{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 4px;box-shadow:0 8px 20px -6px rgba(91,108,255,.6)}
  .nav .fab svg{width:26px;height:26px}

  /* layer mobile remains; desktop overrides ficam no bloco .desktop abaixo */

  .scr{padding:14px 18px}
  .scr-head{padding:16px 18px 6px}
  .h-title{font-size:26px;font-weight:800;letter-spacing:-.01em}
  .h-sub{font-size:12.5px;color:var(--faint);font-weight:500;margin-top:2px}
  .sect{font-size:17px;font-weight:800;margin:0 0 12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
  .row{display:flex;align-items:center}
  .pill{display:inline-flex;align-items:center;border-radius:7px;padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .badge-round{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--soft)}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px;gap:10px}
  .empty .ebox{width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)}
  .empty .et{font-size:15px;font-weight:800;color:var(--soft)}
  .empty .es{font-size:12.5px;color:var(--faint)}
  .emptyline{font-size:13px;color:var(--faint);padding:4px 2px 8px}

  .stats{display:flex;gap:10px;margin-bottom:24px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
  .stat.accent{background:var(--accent);border-color:transparent}
  .stat .ic{width:20px;height:20px;color:var(--accent)}
  .stat.accent .ic{color:#fff}
  .stat .v{font-size:24px;font-weight:800;margin-top:8px}
  .stat .l{font-size:11.5px;color:var(--soft);margin-top:1px}
  .stat.accent .v,.stat.accent .l{color:#fff}
  .stat.accent .l{color:rgba(255,255,255,.85)}

  .evc{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px 14px;margin-bottom:10px}
  .evc .bar{width:4px;border-radius:3px;flex:none;align-self:stretch;min-height:46px}
  .evc .main{flex:1;min-width:0}
  .evc .toprow{display:flex;align-items:flex-start;gap:10px}
  .evc .ti{font-size:17px;font-weight:800;flex:1;min-width:0}
  .evc .time{text-align:right}
  .evc .time .s{font-size:16px;font-weight:800}
  .evc .time .e{font-size:12px;color:var(--faint)}
  .evc .meta{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--soft);margin-top:7px}
  .evc .meta svg{width:16px;height:16px;flex:none}

  .tc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
  .tc .metar{display:flex;align-items:center;gap:7px}
  .tc .sdot{width:8px;height:8px;border-radius:50%}
  .tc .slab{font-size:11.5px;font-weight:800}
  .tc .client{font-size:10.5px;font-weight:800;color:var(--soft);letter-spacing:.04em;text-transform:uppercase;margin-top:12px}
  .tc .tt{font-size:16.5px;font-weight:800;margin-top:3px;line-height:1.25}
  .tc .ds{font-size:12.5px;color:var(--faint);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  .tc .pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tc .asg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--faint)}
  .tc .move{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;height:42px;border-radius:12px;background:rgba(91,108,255,.12);color:var(--accent);font-size:13px;font-weight:800;width:100%}
  .tc .move svg{width:18px;height:18px}

  .bcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;width:100%;text-align:left}
  .bcard .icb{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .bcard .icb svg{width:24px;height:24px}
  .bcard .bm{flex:1;min-width:0}
  .bcard .bl{font-size:16px;font-weight:800}
  .bcard .bd{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bcard .bp{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
  .bcard .arr{color:var(--faint);flex:none}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .colsel{display:flex;gap:8px;margin:10px 0}
  .colsel .c{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;text-align:center}
  .colsel .c .cl{font-size:10px;font-weight:800}
  .colsel .c .cn{font-size:15px;font-weight:800}

  .iconbtn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
  .iconbtn svg{width:22px;height:22px}

  .colhead{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:16px;margin:4px 0 12px;border:1px solid var(--line)}
  .colhead .cc{width:12px;height:12px;border-radius:50%;flex:none}
  .colhead .cm{flex:1}
  .colhead .clab{font-size:17px;font-weight:800}
  .colhead .cdesc{font-size:12px;color:var(--faint)}
  .colhead .cb{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800}

  .stepper{display:flex;align-items:center;padding:8px 16px}
  .stepper .st{display:flex;align-items:center;gap:6px}
  .stepper .sc{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--faint)}
  .stepper .sc.on,.stepper .sc.done{background:var(--accent);border-color:transparent;color:#fff}
  .stepper .slab{font-size:11.5px;color:var(--faint);font-weight:600}
  .stepper .slab.on{color:var(--ink);font-weight:800}
  .stepper .ln{flex:1;height:1.5px;background:var(--line);margin:0 6px}
  .stepper .ln.done{background:var(--accent)}

  .sector-card{display:flex;align-items:center;gap:11px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:10px;margin-bottom:8px;width:100%;text-align:left}
  .sector-card.sel{border-width:1.5px}
  .sector-card .icb{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .sector-card .icb svg{width:19px;height:19px}
  .sector-card .sm{flex:1;min-width:0}
  .sector-card .sl{font-size:14.5px;font-weight:800}
  .sector-card .sd{font-size:11.5px;color:var(--faint)}
  .lbl{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
  .content-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden}
  .content-card .ch{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left;background:none}
  .content-card .ch .cd{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .content-card .ch .cd.fill{background:var(--green)}
  .content-card .ch .ct{flex:1;font-size:13.5px;font-weight:700}
  .content-card .cb{padding:0 12px 12px;display:none}
  .content-card.open .cb{display:block}
  .review .rr{display:flex;padding:5px 0;font-size:13.5px}
  .review .rr .rl{width:120px;color:var(--faint);flex:none}
  .review .rr .rv{flex:1;font-weight:600}
  .switchrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
  .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
  .sw.on{background:var(--accent)}
  .sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
  .sw.on::after{left:21px}
  .footer-nav{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;padding:12px 20px}
  .footer-nav .btn{height:50px;border-radius:25px}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:700px){.modal-back{align-items:center}}
  .sheet{background:var(--surface);width:100%;max-width:var(--maxw);border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}
  @media(min-width:700px){.sheet{border-radius:22px;max-width:560px}}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .moveopt{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
  .moveopt .icb{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
  .infoline{display:flex;padding:5px 0;font-size:14px}
  .infoline .il{width:120px;color:var(--faint);flex:none;font-size:13px}
  .infoline .iv{flex:1;font-weight:600;word-break:break-word}

  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:18px}
  .settrow{display:flex;align-items:center;gap:13px;padding:14px;width:100%;text-align:left}
  .settrow .icb{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
  .settrow .icb svg{width:20px;height:20px}
  .settrow .sm{flex:1;min-width:0}
  .settrow .sl{font-size:14.5px;font-weight:800}
  .settrow .ss{font-size:12px;color:var(--faint)}
  .settrow .arr{color:var(--faint)}
  .divline{height:1px;background:#222633;margin-left:65px}

  .wpbadge{position:fixed;z-index:90;right:14px;bottom:84px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:6px 11px;border-radius:999px;box-shadow:0 6px 18px -6px rgba(0,0,0,.6);pointer-events:none;opacity:.92}

  /* ============================================================
     DESKTOP LAYER (>=1024px)  — ativada por body.desktop (JS toggle)
     ============================================================ */
  body.desktop{
    /* shell */
  }
  body.desktop #login{max-width:520px}
  body.desktop #app{
    display:grid !important;
    grid-template-columns:var(--d-side) 1fr;
    grid-template-rows:100vh;
    max-width:none !important;
    margin:0 !important;
    min-height:100vh;
    box-shadow:none !important;
  }
  /* SIDEBAR (vira a nav) */
  body.desktop .nav{
    position:relative !important;
    left:auto !important;right:auto !important;bottom:auto !important;
    max-width:none !important;margin:0 !important;
    grid-column:1;grid-row:1;
    display:flex !important;flex-direction:column;justify-content:flex-start;align-items:stretch;
    gap:4px;padding:18px 14px 18px 14px;
    background:#0D0E14;border-top:none;border-right:1px solid var(--line-soft);
    backdrop-filter:none;height:100vh;overflow-y:auto;
  }
  body.desktop .nav .sb-brand{
    display:flex;align-items:center;gap:11px;padding:6px 6px 18px 6px;border-bottom:1px solid var(--line-soft);margin-bottom:14px
  }
  body.desktop .nav .sb-brand .logo.sm{width:38px;height:38px;border-radius:12px;font-size:18px}
  body.desktop .nav .sb-brand .nm{font-size:15px;font-weight:800;letter-spacing:-.01em}
  body.desktop .nav .sb-brand .sy{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:5px;margin-top:2px}
  body.desktop .nav .sb-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  body.desktop .nav .sb-sect{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;padding:14px 10px 6px}
  body.desktop .nav button.sb-item{
    flex:none !important;flex-direction:row !important;align-items:center !important;
    gap:12px !important;padding:10px 12px !important;border-radius:11px;
    color:var(--soft) !important;font-size:14px !important;font-weight:600 !important;
    justify-content:flex-start !important;width:100%;text-align:left;transition:background .12s,color .12s;
  }
  body.desktop .nav button.sb-item svg{width:20px !important;height:20px !important;flex:none}
  body.desktop .nav button.sb-item span{font-size:14px !important;font-weight:600 !important}
  body.desktop .nav button.sb-item:hover{background:rgba(255,255,255,.05);color:var(--ink) !important}
  body.desktop .nav button.sb-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* barra de acento a esquerda no item ativo (padrao SaaS) */
  body.desktop .nav button.sb-item.on{background:rgba(91,108,255,.16);color:var(--accent) !important;font-weight:800 !important;position:relative}
  body.desktop .nav button.sb-item.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--accent)}
  body.desktop .nav button.sb-item.on span{font-weight:800 !important}
  body.desktop .nav button.sb-item.on svg{color:var(--accent)}
  /* Botao primario "Nova tarefa" — premium (icone em chip translucido) */

/* ---- Visibilidade (TaskVisibility.kt) ---- */
const MANAGER_KW=['social','gestor','gerente','diretor','coordena','supervisor','admin','dono','owner','ceo','head'];
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function roleCat(u){if(!u)return'UNKNOWN';if(u.admin)return'ADMIN';const r=norm(u.role);if(!r)return'UNKNOWN';return MANAGER_KW.some(k=>r.includes(k))?'MANAGER':'OPERATIONAL';}
function canSeeAll(u){const c=roleCat(u);return c==='ADMIN'||c==='MANAGER';}
function canSeeTask(u,t){if(canSeeAll(u))return true;const uid=u&&u.id;if(!uid)return false;return t.assigneeId===uid||t.by===uid;}
function visibleTasks(u,list){return canSeeAll(u)?list:list.filter(t=>canSeeTask(u,t));}

/* ---- Deadline ---- */
function dtMs(date,time){if(!date)return null;const[y,m,d]=date.split('-').map(Number);const[hh,mm]=((time||'00:00').split(':')).map(Number);return new Date(y,(m||1)-1,d||1,hh||0,mm||0).getTime();}
function humanDur(ms){const min=Math.floor(ms/60000);if(min<60)return min+' min';const h=Math.floor(min/60);if(h<24){const r=min%60;return r?h+'h '+r+'min':h+'h';}const d=Math.floor(h/24);const rh=h%24;return rh?d+'d '+rh+'h':d+'d';}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function taskDeadline(t){if(t.status==='concluido')return{text:'Concluída',color:'#34D399',late:false};const dd=t.dueDate||t.due;if(!dd)return null;const due=dtMs(dd,(t.dueTime&&t.dueTime.trim())||'23:59');const now=Date.now();if(now>due)return{text:'Atrasada',color:'#F87171',late:true};if(dd===todayStr())return{text:'Hoje',color:'#F59E0B',late:false};return{text:'Faltam '+humanDur(due-now),color:'#34D399',late:false};}

/* ---- Util ---- */
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function first(s){return (s||'').trim().split(/\s+/)[0]||'';}
function initials(n){const p=(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}
function photoOf(u){if(!u)return'';for(const k of ['photo','photoUrl','avatar','avatarUrl','image','imageUrl','picture','foto']){if(u[k]&&String(u[k]).trim())return u[k];}return'';}
function avatar(u,size){const ph=photoOf(u);const col=userColor(u&&u.id);const st='width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.36)+'px;box-shadow:0 0 0 2px '+col+'55';if(ph&&/^https?:|^data:/.test(ph))return '<div class="av" style="'+st+';background-image:url(\''+esc(ph)+'\')"></div>';return '<div class="av" style="'+st+';background:'+col+'">'+esc(initials(u&&u.name).toUpperCase())+'</div>';}

function dayShort(date){const[y,m,d]=date.split('-').map(Number);const dt=new Date(y,m-1,d);return ['dom','seg','ter','qua','qui','sex','sáb'][dt.getDay()]+', '+d+' de '+MONTHS[m-1].toLowerCase();}
function withAlpha(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

/* ---- AUTH ---- */
function digits(s){return (s||'').replace(/\D/g,'');}
async function doLogin(idOrPhone,password){
  const id=idOrPhone.trim().toLowerCase();const d=digits(idOrPhone);
  const snap=await db.collection('users').get();let m=null;
  snap.forEach(doc=>{if(m)return;const u=doc.data();const em=(u.email||'').toLowerCase();if(em===id||(d&&digits(u.phone)===d))m=Object.assign({id:doc.id},u);});
  if(!m)throw 'E-mail/WhatsApp ou senha incorretos.';
  const st=m.status||'';if(st==='pendente')throw 'Cadastro aguardando aprovação.';if(st==='removido'||st==='excluido')throw 'Conta inativa.';
  if(!await verifyPw(m.pass,m.salt,password))throw 'E-mail/WhatsApp ou senha incorretos.';
  if(m.mustChangePassword){state.pending={user:m};return null;}
  return m;
}
async function doRegister(name,role,phone,email,password){
  if(!name.trim()||!email.trim()||!password)throw 'Preencha nome, e-mail e senha.';
  const salt=randSalt();const pass=await hashPw(password,salt);
  await db.collection('users').add({name:name.trim(),role:role.trim(),phone:phone.trim(),email:email.trim().toLowerCase(),pass,salt,status:'pendente',admin:false,createdAt:Date.now()});
}
function saveSession(u){localStorage.setItem('wp_uid',u.id);localStorage.setItem('wp_name',u.name||'');}
function clearSession(){localStorage.removeItem('wp_uid');localStorage.removeItem('wp_name');}
function startApp(u){state.user=u;saveSession(u);document.getElementById("login").classList.add("hidden");document.getElementById("app").style.display="flex";subscribeData();render();try{window.desktopAPI&&window.desktopAPI.sessionLogin(u.id)}catch(_){}}
function logout(){try{window.desktopAPI&&window.desktopAPI.sessionLogout()}catch(_){} for(const k in unsub){if(unsub[k])unsub[k]();unsub[k]=null;}clearSession();state.user=null;document.getElementById('app').style.display='none';document.getElementById('login').classList.remove('hidden');loginMode='login';renderLogin();}
function subscribeData(){
  unsub.users=db.collection('users').onSnapshot(s=>{state.users=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(state.user){const me=state.users.find(x=>x.id===state.user.id);if(me)state.user=me;}render();});
  unsub.events=db.collection('events').onSnapshot(s=>{state.events=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();});
  unsub.tasks=db.collection('tasks').onSnapshot(s=>{state.tasks=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();});
}

  }else if(loginMode==='forgot'&&forgotStep===1){
    h+='<div class="fld"><label>E-mail cadastrado</label><input class="inp" id="fEmail" placeholder="E-mail cadastrado" inputmode="email"></div>'+
      '<div style="height:10px"></div><button class="btn" id="btnFreq">Enviar código</button>'+
      '<button class="txtbtn soft" data-mode="login">Voltar ao login</button>';
  }else if(loginMode==='forgot'){
    h+='<div class="fld"><label>Código de 6 dígitos</label><input class="inp" id="fCode" placeholder="Código de 6 dígitos" inputmode="numeric" maxlength="6"></div>'+
      pw('fPw','Nova senha')+pw('fPw2','Confirmar nova senha')+
      '<div style="height:10px"></div><button class="btn" id="btnFconf">Criar nova senha</button>'+
      '<button class="txtbtn accent" id="btnResend">Reenviar código</button>'+
      '<button class="txtbtn soft" data-mode="login">Voltar ao login</button>';
  }else if(loginMode==='pending'){
    h+=pw('pPw','Nova senha')+pw('pPw2','Confirmar nova senha')+
      '<div style="height:10px"></div><button class="btn" id="btnPend">Salvar nova senha</button>'+
      '<button class="txtbtn soft" data-mode="login">Cancelar e voltar ao login</button>';
  }
  f.innerHTML=h;
}
function banner(msg,ok){document.getElementById('loginBanner').innerHTML=msg?'<div class="banner '+(ok?'ok':'err')+'">'+esc(msg)+'</div>':'';}
function loading(btn,on){if(!btn)return;btn.disabled=on;btn.innerHTML=on?'<span class="spinner"></span>':btn.dataset.t;}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
document.getElementById('login').addEventListener('click',async e=>{
  const t=e.target.closest('[data-mode]');if(t){loginMode=t.dataset.mode;forgotStep=1;banner('');renderLogin();return;}
  const tg=e.target.closest('[data-toggle]');if(tg){const inp=document.getElementById(tg.dataset.toggle);const sh=inp.type==='password';inp.type=sh?'text':'password';tg.textContent=sh?'Ocultar':'Mostrar';return;}
  const btn=e.target.closest('button');if(!btn||!btn.id||btn.dataset.toggle)return;btn.dataset.t=btn.textContent;
  try{
    if(btn.id==='btnLogin'){banner('');loading(btn,true);const u=await doLogin(val('liId'),val('liPw'));if(u)startApp(u);else{loginMode='pending';renderLogin();banner('Senha temporária — defina uma nova senha.',true);}}
    else if(btn.id==='btnReg'){banner('');loading(btn,true);await doRegister(val('rName'),val('rRole'),val('rPhone'),val('rEmail'),val('rPw'));loginMode='login';renderLogin();banner('Cadastro enviado! Aguarde aprovação do administrador.',true);}
    else if(btn.id==='btnFreq'){forgotEmail=val('fEmail');if(!/.+@.+\..+/.test(forgotEmail)){banner('Informe um e-mail válido.');return;}forgotStep=2;renderLogin();banner('Se o e-mail existir, enviamos um código. (O backend de reset roda nas Cloud Functions de produção — não alterado nesta prévia.)',true);}
    else if(btn.id==='btnResend'){banner('Código reenviado (se o e-mail existir).',true);}
    else if(btn.id==='btnFconf'){banner('A redefinição usa as Cloud Functions de produção, que não são tocadas nesta homologação. Use sua senha atual para entrar.',true);}
    else if(btn.id==='btnPend'){await pendingChange(val('pPw'),val('pPw2'),btn);}
  }catch(err){banner(typeof err==='string'?err:('Não foi possível agora. '+(err&&err.message||err)));}
  finally{loading(btn,false);}
});
async function pendingChange(p1,p2,btn){
  if((p1||'').length<6){banner('A nova senha precisa ter pelo menos 6 caracteres.');return;}
  if(p1!==p2){banner('As senhas não coincidem.');return;}
  if(!state.pending){banner('Sessão expirada, refaça o login.');return;}
  loading(btn,true);const salt=randSalt();const pass=await hashPw(p1,salt);
  await db.collection('users').doc(state.pending.user.id).update({pass,salt,mustChangePassword:false,passwordChangedAt:Date.now()});
  const u=Object.assign({},state.pending.user,{pass,salt,mustChangePassword:false});state.pending=null;startApp(u);
}

function calendarGrid(y,m,evs){
  const firstD=new Date(y,m,1);const start=new Date(firstD);start.setDate(1-firstD.getDay());

}

async function moveStatus(taskId,newStatus){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;const old=t.status||'afazer';const now=Date.now();
  const patch={status:newStatus,history:firebase.firestore.FieldValue.arrayUnion({kind:'moved',at:now,byId:state.user.id,from:old,to:newStatus})};
  if(newStatus!=='afazer'&&!t.startedAt)patch.startedAt=now;
  if(newStatus==='concluido'){patch.doneAt=now;patch.doneBy=state.user.id;}

}

/* ---- TASK FORM (wizard) ---- */
function newForm(sector){return {id:null,step:0,sector:sector||null,title:'',client:'',assigneeId:null,assignee:'',status:'afazer',dueDate:'',dueTime:'',priority:false,subtype:null,fields:{},contents:[],items:[],checklist:[],link:'',obs:'',_openContent:null};}
function openTaskForm(sector){state.form=newForm(sector);if(sector)state.form.step=1;render();}
function tpl(){return state.form.sector?TEMPLATES[secOf(state.form.sector).key]:null;}
function curSub(){const t=tpl();return (t&&t.subtypes&&state.form.subtype)?t.subtypes[state.form.subtype]:null;}
function renderForm(){
  const f=state.form;const s=f.sector?secOf(f.sector):null;const STEPS=['Setor','Dados','Briefing','Revisão'];
  let h='<div class="scr-head"><div class="row"><div style="flex:1"><div style="font-size:20px;font-weight:800">'+(f.id?'Editar tarefa':'Nova tarefa')+'</div>'+
    '<div style="font-size:12px;color:var(--faint)">'+(s?esc(s.label)+(f.client?' · '+esc(f.client):''):'Selecione o setor')+'</div></div>'+
    '<button class="iconbtn" data-form="close">'+svg('close')+'</button></div></div>'+
    '<div class="stepper">'+STEPS.map((st,i)=>'<div class="st"><div class="sc '+(i<f.step?'done':'')+' '+(i===f.step?'on':'')+'">'+(i<f.step?'✓':(i+1))+'</div><div class="slab '+(i===f.step?'on':'')+'">'+st+'</div></div>'+(i<3?'<div class="ln '+(i<f.step?'done':'')+'"></div>':'')).join('')+'</div><div class="scr">';
  if(f.step===0)h+=stepSector();else if(f.step===1)h+=stepDados();else if(f.step===2)h+=stepBriefing();else h+=stepReview();
  h+='</div><div class="footer-nav">'+(f.step>0?'<button class="btn ghost" data-form="back">Voltar</button>':'')+(f.step<3?'<button class="btn" data-form="next">Próximo</button>':'<button class="btn" data-form="save">'+(f.id?'Salvar alterações':'Salvar tarefa')+'</button>')+'</div>';
  return '<div class="form-wrap">'+h+'</div>';
}
function stepSector(){const f=state.form;let h='<div class="lbl">Escolha o setor</div>';
  SECTORS.forEach(s=>{const sel=f.sector===s.key;h+='<button class="sector-card '+(sel?'sel':'')+'" data-fsector="'+s.key+'" style="'+(sel?'background:'+withAlpha(s.color,.12)+';border-color:'+s.color:'')+'"><div class="icb" style="background:'+withAlpha(s.color,.18)+';color:'+s.color+'">'+svg(s.icon)+'</div><div class="sm"><div class="sl">'+esc(s.label)+'</div><div class="sd">'+esc(s.desc)+'</div></div>'+(sel?'<div style="color:'+s.color+'">✓</div>':'')+'</button>';});
  return h;
}

  '<div class="fgroup"><div class="fgroup-h">Prazo &amp; prioridade</div>'+

function stepBriefing(){const f=state.form;const t=tpl();const s=secOf(f.sector);let h='';
  if(t&&t.subtypes){
    h+='<div class="lbl">'+esc(t.subLabel||'Tipo')+'</div><div class="chips" style="margin-bottom:14px">'+Object.keys(t.subtypes).map(k=>'<button class="chip" data-fsub="'+k+'" style="'+(f.subtype===k?'background:var(--accent);border-color:transparent;color:#fff':'')+'">'+esc(t.subtypes[k].label)+'</button>').join('')+'</div>';
    const sub=curSub();
    if(sub){
      h+='<div style="background:'+withAlpha('#5B6CFF',.12)+';color:var(--accent);font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;margin-bottom:12px">'+esc(sub.formTitle)+'</div>'+fieldsHtml(sub.fields);
      if(sub.contentCount){h+='<div class="lbl" style="margin-top:6px">Conteúdos do cronograma ('+sub.contentCount+')</div>';
        for(let i=0;i<sub.contentCount;i++){const c=f.contents[i]||{tema:'',legenda:''};const filled=(c.tema||c.legenda);const open=f._openContent===i;
          h+='<div class="content-card '+(open?'open':'')+'"><button class="ch" data-content="'+i+'"><span class="cd '+(filled?'fill':'')+'"></span><span class="ct">Conteúdo '+(i+1)+'</span><span style="color:var(--soft)">'+(open?'▲':'▼')+'</span></button><div class="cb"><div class="lbl">Tema</div><input class="inp" data-ctema="'+i+'" placeholder="Tema do conteúdo '+(i+1)+'" value="'+esc(c.tema||'')+'"><div style="height:8px"></div><div class="lbl">Legenda</div><textarea class="inp" data-cleg="'+i+'" placeholder="Legenda do conteúdo '+(i+1)+'">'+esc(c.legenda||'')+'</textarea></div></div>';}}
      if(sub.items){h+='<div class="lbl" style="margin-top:6px">Itens do pacote</div>';
        for(let i=0;i<sub.items;i++)h+='<div class="row" style="gap:10px;margin-bottom:8px"><div style="width:80px;font-size:11.5px;font-weight:700;color:var(--faint)">'+esc(sub.itemLabel||'Item')+' '+(i+1)+'</div><input class="inp" data-item="'+i+'" placeholder="Descrição" value="'+esc(f.items[i]||'')+'"></div>';}
      h+=checklistHtml(sub.checklist);
    }
  }else if(t){h+='<div class="lbl">Briefing · '+esc(s.label)+'</div>'+fieldsHtml(t.fields)+checklistHtml(t.checklist);}
  h+='<div style="height:6px"></div><div class="lbl">Link / anexo</div><input class="inp" id="fLink" placeholder="URL (Drive, Figma, etc.)" value="'+esc(f.link)+'"><div style="height:12px"></div><div class="lbl">Observações livres</div><textarea class="inp" id="fObs" placeholder="Notas adicionais…">'+esc(f.obs)+'</textarea>';
  return h;
}
function fieldsHtml(fields){const f=state.form;return (fields||[]).map(fl=>{const v=f.fields[fl.k]||'';
  if(fl.kind==='choice')return '<div class="lbl">'+esc(fl.l)+'</div><div class="chips" style="margin-bottom:12px">'+fl.opts.map(o=>'<button class="chip" data-fchoice="'+fl.k+'|'+esc(o)+'" style="'+(v===o?'background:var(--accent);border-color:transparent;color:#fff':'')+'">'+esc(o)+'</button>').join('')+'</div>';
  if(fl.kind==='bool')return '<div class="switchrow" style="margin-bottom:10px"><span style="font-size:14px">'+esc(fl.l)+'</span><button class="sw '+(v===true?'on':'')+'" data-fbool="'+fl.k+'"></button></div>';
  return '<div class="lbl">'+esc(fl.l)+'</div><input class="inp" data-ffield="'+fl.k+'" placeholder="'+esc(fl.ph||'')+'" value="'+esc(v)+'" style="margin-bottom:12px">';}).join('');}
function checklistHtml(def){const f=state.form;if(f.checklist.length===0&&def&&def.length)f.checklist=def.map(t=>({t,d:false}));
  let h='<div class="lbl" style="margin-top:6px">Checklist</div>';
  f.checklist.forEach((c,i)=>{h+='<div class="row" style="gap:8px;margin-bottom:8px"><input class="inp" data-chk="'+i+'" value="'+esc(c.t)+'"><button class="iconbtn" data-chkdel="'+i+'" style="color:var(--red)">'+svg('close')+'</button></div>';});
  return h+'<button class="btn soft" data-chkadd="1" style="height:42px">+ Adicionar item</button>';
}
function stepReview(){const f=state.form;const s=secOf(f.sector);const sub=curSub();const u=f.assigneeId?state.users.find(x=>x.id===f.assigneeId):null;
  const rows=[['Setor',s.label]];if(sub)rows.push(['Subtipo',sub.formTitle]);
  if(sub&&sub.contentCount){const filled=f.contents.filter(c=>c&&(c.tema||c.legenda)).length;rows.push(['Conteúdos',filled+' de '+sub.contentCount+' preenchidos']);}
  rows.push(['Cliente',f.client||'—'],['Título',f.title||'—'],['Responsável',u?u.name:'Ninguém'],['Etapa',stOf(f.status).label],['Prazo',f.dueDate?(f.dueDate+(f.dueTime?' '+f.dueTime:'')):'—'],['Prioridade',f.priority?'Alta':'Normal']);
  return '<div class="lbl">Revisão</div><div class="card review" style="padding:16px">'+rows.map(r=>'<div class="rr"><div class="rl">'+esc(r[0])+'</div><div class="rv">'+esc(r[1])+'</div></div>').join('')+'</div>';
}
function afterForm(){
  const c=document.getElementById('content');
  const bind=(sel,fn)=>c.querySelectorAll(sel).forEach(el=>el.oninput=()=>fn(el));
  bind('#fTitle',e=>state.form.title=e.value);bind('#fClient',e=>state.form.client=e.value);
  bind('#fDue',e=>state.form.dueDate=e.value);bind('#fDueT',e=>state.form.dueTime=e.value);
  bind('#fLink',e=>state.form.link=e.value);bind('#fObs',e=>state.form.obs=e.value);
  bind('[data-ffield]',e=>state.form.fields[e.dataset.ffield]=e.value);
  bind('[data-ctema]',e=>{const i=+e.dataset.ctema;state.form.contents[i]=state.form.contents[i]||{};state.form.contents[i].tema=e.value;});
  bind('[data-cleg]',e=>{const i=+e.dataset.cleg;state.form.contents[i]=state.form.contents[i]||{};state.form.contents[i].legenda=e.value;});
  bind('[data-item]',e=>state.form.items[+e.dataset.item]=e.value);
  bind('[data-chk]',e=>state.form.checklist[+e.dataset.chk].t=e.value);
}
function composedDesc(){const f=state.form;const sub=curSub();const t=tpl();let lines=[];
  if(sub)lines.push(sub.formTitle);
  const fields=(sub?sub.fields:(t?t.fields:[]))||[];
  fields.forEach(fl=>{const v=f.fields[fl.k];if(v!==undefined&&v!==''&&v!==false)lines.push(fl.l+': '+(v===true?'Sim':v));});
  if(sub&&sub.contentCount){for(let i=0;i<sub.contentCount;i++){const c=f.contents[i];if(c&&(c.tema||c.legenda)){lines.push('Conteúdo '+(i+1)+':');if(c.tema)lines.push('  Tema: '+c.tema);if(c.legenda)lines.push('  Legenda: '+c.legenda);}}}
  if(sub&&sub.items){for(let i=0;i<sub.items;i++){if(f.items[i])lines.push((sub.itemLabel||'Item')+' '+(i+1)+': '+f.items[i]);}}
  if(f.obs)lines.push('',f.obs);
  return lines.join('\n').trim();
}
async function saveTask(){const f=state.form;
  if(!f.sector){alert('Selecione o setor.');f.step=0;render();return;}
  const t=tpl();
  if(t&&t.clientRequired&&!f.client.trim()){alert('Para Cronograma o cliente é obrigatório.');f.step=1;render();return;}
  if(!f.title.trim()){alert('Informe o título.');f.step=1;render();return;}
  const u=f.assigneeId?state.users.find(x=>x.id===f.assigneeId):null;
  const data={title:f.title.trim(),client:f.client.trim(),sector:f.sector,desc:composedDesc(),status:f.status,assignee:u?u.name:'',assigneeId:f.assigneeId||null,link:f.link.trim(),priority:!!f.priority,dueDate:f.dueDate||'',dueTime:f.dueTime||'',due:f.dueDate||'',checklist:f.checklist.filter(c=>c.t.trim()),by:state.user.id,createdAt:Date.now(),src:'webpreview'};
  if(f.contents.length)data.cronContents=f.contents;
  await db.collection('tasks').add(data);
  const sector=f.sector;state.form=null;state.tab='tarefas';state.boardSector=sector;boardCol=0;render();
}

/* ---- EVENT DELEGATION ----
   ATENCAO: o handler fica em `document` (nao em #app) porque os modais sao
   injetados em #modalRoot, que e IRMAO de #app. Preso em #app, nenhum clique
   dentro de um modal era capturado -> seletor de responsavel/mover status/
   sheets ficavam mortos. Em document, captura tudo (com guarda de sessao). */
document.addEventListener('click',async e=>{
  if(!state.user)return;                       // login tem seu proprio handler
  if(!(e.target&&e.target.closest))return;
  const g=sel=>e.target.closest(sel);let el;
  if(el=g('[data-tab]')){state.form=null;state.boardSector=null;state.tab=el.dataset.tab;closeModal();render();return;}
  if(el=g('[data-fab]')){closeModal();if(state.tab==='tarefas')openTaskForm(state.boardSector);else{state.tab='tarefas';openTaskForm(null);}return;}
  if(el=g('[data-sector]')){state.boardSector=el.dataset.sector;boardCol=0;boardMine=false;boardQuery='';render();return;}
  if(el=g('[data-board]')){const a=el.dataset.board;if(a==='back')state.boardSector=null;else if(a==='new'){openTaskForm(state.boardSector);return;}render();return;}
  if(el=g('[data-bcol]')){boardCol=+el.dataset.bcol;render();return;}
  if(el=g('[data-bmine]')){boardMine=!boardMine;render();return;}
  if(el=g('[data-ag]')){const a=el.dataset.ag;if(a==='today'){agCursor=new Date();agSel=todayStr();}else if(a==='prev')agCursor.setMonth(agCursor.getMonth()-1);else if(a==='next')agCursor.setMonth(agCursor.getMonth()+1);else if(a==='vmonth')agView='month';else if(a==='vlist')agView='list';render();return;}
  if(el=g('[data-agf]')){agFilter=el.dataset.agf;render();return;}
  if(el=g('[data-day]')){agSel=el.dataset.day;render();return;}
  if(el=g('[data-move]')){openMove(el.dataset.move);return;}
  if(el=g('[data-domove]')){const parts=el.dataset.domove.split('|');await moveStatus(parts[0],parts[1]);return;}
  if(el=g('[data-sheet]')){openSheet(el.dataset.sheet);return;}
  if(el=g('[data-logout]')){closeModal();logout();return;}
  if(el=g('[data-pickasg]')){if(state.form){const id=el.dataset.pickasg||null;state.form.assigneeId=id;const u=id?state.users.find(x=>x.id===id):null;state.form.assignee=u?(u.name||''):'';}closeModal();render();return;}
  if(el=g('[data-form]')){const a=el.dataset.form;if(a==='close'){state.form=null;render();}else if(a==='back'){state.form.step=Math.max(0,state.form.step-1);render();}else if(a==='next')stepNext();else if(a==='save')await saveTask();return;}
  if(el=g('[data-fsector]')){state.form.sector=el.dataset.fsector;state.form.subtype=null;state.form.contents=[];state.form.checklist=[];render();return;}
  if(el=g('[data-fstatus]')){state.form.status=el.dataset.fstatus;render();return;}
  if(el=g('[data-ftoggle]')){state.form[el.dataset.ftoggle]=!state.form[el.dataset.ftoggle];render();return;}
  if(el=g('[data-fsub]')){state.form.subtype=el.dataset.fsub;state.form.checklist=[];state.form.contents=[];state.form._openContent=0;render();return;}
  if(el=g('[data-fchoice]')){const p=el.dataset.fchoice.split('|');state.form.fields[p[0]]=p[1];render();return;}
  if(el=g('[data-fbool]')){const k=el.dataset.fbool;state.form.fields[k]=!state.form.fields[k];render();return;}
  if(el=g('[data-content]')){state.form._openContent=(state.form._openContent===+el.dataset.content)?null:+el.dataset.content;render();return;}
  if(el=g('[data-chkadd]')){state.form.checklist.push({t:'',d:false});render();return;}
  if(el=g('[data-chkdel]')){state.form.checklist.splice(+el.dataset.chkdel,1);render();return;}
  if(el=g('[data-assignee]')){openAssignee();return;}
});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('modal-back'))closeModal();});
function stepNext(){const f=state.form;
  if(f.step===0&&!f.sector){alert('Escolha o setor.');return;}
  if(f.step===1){const t=tpl();if(t&&t.clientRequired&&!f.client.trim()){alert('Para Cronograma o cliente é obrigatório.');return;}if(!f.title.trim()){alert('Informe o título.');return;}}
  f.step=Math.min(3,f.step+1);render();
}

/* ---- BOOT ---- */
try{window.desktopAPI&&window.desktopAPI.onNotifOpen(function(t){if(!state.user)return;if(t&&t.indexOf("board/")===0){state.tab="tarefas";state.boardSector=t.slice(6);}else if(t=="agenda"){state.tab="agenda";state.boardSector=null;}render();})}catch(_){}
(async function boot(){
  renderLogin();
  const uid=localStorage.getItem('wp_uid');
  if(uid){try{const doc=await db.collection('users').doc(uid).get();if(doc.exists){startApp(Object.assign({id:doc.id},doc.data()));return;}}catch(_){}clearSession();}
})();
</script>
