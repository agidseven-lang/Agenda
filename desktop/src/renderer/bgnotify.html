<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Agenda ID Seven — Notificação</title>
<style>
  /* F3.3.10-BG — card premium (paridade visual com o toast in-app aprovado). Janela transparente. */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #stack{display:flex;flex-direction:column;gap:10px;padding:8px 10px 10px;align-items:flex-end}
  .ntf{width:404px;max-width:100%;transform:translateY(8px);opacity:0;transition:transform .18s ease,opacity .18s ease}
  .ntf.in{transform:translateY(0);opacity:1}
  .ntf-card{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 34px 12px 15px;border-radius:15px;cursor:pointer;background:linear-gradient(180deg,rgba(26,32,46,.99),rgba(17,22,32,.99));border:1px solid rgba(255,255,255,.10);box-shadow:0 26px 60px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07)}
  .ntf-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--nac,#5B6CFF)}
  .ntf-info{--nac:#5B6CFF}.ntf-success{--nac:#2FCF8F}.ntf-warning{--nac:#F2A93B}.ntf-critical{--nac:#EF4444}
  .ntf-av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px rgba(91,108,255,.45)}
  .ntf-av.gen{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5B6CFF,#22D3EE);color:#fff;font-weight:800;font-size:17px}
  .ntf-bd{flex:1 1 auto;min-width:0}
  .ntf-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .ntf-hd b{color:#eef2f8;font-size:13.5px;font-weight:800;line-height:1.3;flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .ntf-tm{color:#8b97a8;font-size:11px;flex:0 0 auto;margin-top:1px}
  .ntf-ti{color:#cdd6e6;font-size:12.5px;font-weight:700;margin-top:2px;line-height:1.3}
  .ntf-attr-task{color:#eef2f8;font-size:13px;font-weight:700;margin-top:7px;line-height:1.3;overflow-wrap:anywhere;word-break:break-word}
  .ntf-attr-cli{color:#9fb0c8;font-size:12px;margin-top:1px;line-height:1.3;overflow-wrap:anywhere;word-break:break-word}
  .ntf-ds{color:#9fb0c8;font-size:12px;margin-top:2px;line-height:1.38;overflow-wrap:anywhere;word-break:break-word}
  .ntf-ctx{color:#7f8aa0;font-size:11px;margin-top:4px;line-height:1.3}
  .ntf-resp{display:flex;align-items:center;gap:6px;margin-top:5px;color:#9fb0c8;font-size:11.5px;line-height:1.25}
  .ntf-resp-av{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 1.5px rgba(91,108,255,.5)}
  .ntf-resp-av.gen{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5B6CFF,#22D3EE);color:#fff;font-weight:800;font-size:9px}
  .ntf-cta{margin-top:9px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;border:1px solid rgba(91,108,255,.55);background:rgba(91,108,255,.16);color:#cdd6ff;font-size:12px;font-weight:700;cursor:pointer}
  .ntf-cta:hover{background:rgba(91,108,255,.28)}
  .ntf-sev{position:absolute;right:30px;top:12px;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--nac) 20%,transparent);color:var(--nac);font-size:13px;font-weight:900}
  .ntf-x{position:absolute;top:8px;right:9px;width:20px;height:20px;border:0;border-radius:6px;background:transparent;color:#7f8aa0;font-size:15px;line-height:1;cursor:pointer}
  .ntf-x:hover{background:rgba(255,255,255,.08);color:#cdd6e6}
  /* F3.5.4O — card AGRUPADO (N atualizações em [task]): lista de itens + "+N outras atualizações". */
  .ntf-glist{margin-top:7px;display:flex;flex-direction:column;gap:3px}
  .ntf-gi{color:#9fb0c8;font-size:12px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}
  .ntf-gi b{color:#eef2f8;font-weight:700}
  .ntf-more{color:#7f8aa0;font-size:11px;margin-top:3px;font-weight:600}
  /* F3.5.4U — LAYOUT PREMIUM das notificações COMUNS (atrás da flag premiumCommonNotificationsEnabled).
     Hierarquia: TIPO(eyebrow) → ATOR → TÍTULO dominante → MOVIMENTO(chips) → COMPLEMENTARES. Informações
     maiores; título da tarefa é o elemento mais importante. IDÊNTICO ao index.html (teste de paridade). */
  .ntf-card.ntfp{gap:14px;padding:14px 16px 15px 17px}
  .ntfp-av{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px rgba(109,91,255,.5),0 6px 16px -6px rgba(0,0,0,.7)}
  .ntfp-av.gen{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6D5BFF,#22D3EE);color:#fff;font-weight:800;font-size:20px;letter-spacing:.5px}
  .ntfp-bd{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ntfp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  /* F3.5.4U-H1 (Defeito 1) — CABEÇALHO em GRID com COLUNAS RESERVADAS: [eyebrow 1fr] [horário auto] [fechar auto].
     Elimina 3 elementos disputando a mesma posição absoluta (horário × ícone verde × X). O ícone de nível vira
     um glifo PEQUENO integrado ao eyebrow (esev); horário e X nunca se sobrepõem, em qualquer escala/resolução. */
  .ntfp-hd{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:9px;min-width:0}
  .ntfp-eyebrow .esev{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:5px;background:color-mix(in srgb,var(--nac) 22%,transparent);color:var(--nac);font-size:10.5px;font-weight:900;line-height:1}
  .ntf-card.ntfp .ntfp-hd .ntf-x{position:static;top:auto;right:auto;flex:0 0 auto;width:22px;height:22px;font-size:16px}
  .ntfp-eyebrow{display:inline-flex;align-items:center;gap:6px;min-width:0;color:#a9b4ff;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ntfp-eyebrow .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--nac,#5B6CFF)}
  .ntfp-tm{flex:0 0 auto;color:#8b97a8;font-size:11px}
  .ntfp-actor{color:#e7ecf6;font-size:15px;font-weight:700;line-height:1.25;margin-top:2px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ntfp-task{color:#ffffff;font-size:18px;font-weight:800;line-height:1.25;margin-top:2px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ntfp-chips{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:8px}
  .ntfp-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.25;border:1px solid var(--cbd,rgba(255,255,255,.16));background:var(--cbg,rgba(255,255,255,.06));color:var(--cfg,#cdd6e6);white-space:nowrap}
  .ntfp-chip .cdot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--cfg,#cdd6e6)}
  .ntfp-arrow{flex:0 0 auto;color:#8b97a8;font-size:14px;font-weight:800}
  .ntfp-action{color:#c3ccdb;font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.35;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .ntfp-meta{color:#8792a6;font-size:11.5px;margin-top:8px;line-height:1.3;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .ntfp-cta{margin-top:10px;display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:5px 12px;border-radius:9px;border:1px solid rgba(109,91,255,.5);background:rgba(109,91,255,.16);color:#cdd6ff;font-size:12px;font-weight:700;cursor:pointer}
  .ntfp-cta:hover{background:rgba(109,91,255,.28)}
  .ntfp-sev{position:absolute;right:36px;top:14px;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--nac) 22%,transparent);color:var(--nac);font-size:12px;font-weight:900}
  .ntfp-glist{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .ntfp-gi{color:#aeb8ca;font-size:12.5px;line-height:1.4;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .ntfp-gi b{color:#e7ecf6;font-weight:700}
  .ntfp-more{color:#8792a6;font-size:11.5px;margin-top:3px;font-weight:600}
  /* chips por ESTADO real (cor associada ao estado; NUNCA só cor — sempre com rótulo textual legível). */
  .cs-afazer{--cfg:#c3ccdb;--cbg:rgba(148,163,184,.14);--cbd:rgba(148,163,184,.34)}
  .cs-andamento{--cfg:#8FA2FF;--cbg:rgba(91,108,255,.16);--cbd:rgba(91,108,255,.44)}
  .cs-revisao{--cfg:#F2C46B;--cbg:rgba(242,169,59,.15);--cbd:rgba(242,169,59,.44)}
  .cs-concluido{--cfg:#4FD9A0;--cbg:rgba(47,207,143,.15);--cbd:rgba(47,207,143,.44)}
  /* F3.5.4U — card premium ocupa a largura RESPONSIVA da janela (dimensionada em bgNotify.ts); o card
     antigo (fallback) permanece 404px, ancorado no mesmo canto inferior direito (janela transparente). */
  .ntf.ntfp-w{width:100%;max-width:100%}
  @media (prefers-reduced-motion: reduce){ .ntf{transition:none} }
</style>
</head>
<body>
<div id="stack"></div>
<script>
(function(){
  "use strict";
  var stack=document.getElementById('stack');
  var seen=Object.create(null);
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function initials(name){try{var p=String(name||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '';var a=p[0][0]||'';var b=p.length>1?(p[p.length-1][0]||''):'';return (a+b).toUpperCase();}catch(_){return '';}}
  function nowHM(){try{var d=new Date();var z=function(n){return(n<10?'0':'')+n;};return z(d.getHours())+':'+z(d.getMinutes());}catch(_){return '';}}
  function sevClass(s){return s==='critical'?'ntf-critical':(s==='warning'?'ntf-warning':(s==='success'?'ntf-success':'ntf-info'));}
  function sevIcon(s){return s==='critical'?'!':(s==='warning'?'⏱':(s==='success'?'✓':'i'));}
  function report(){ try{ var h=stack.scrollHeight; if(!stack.children.length){ if(window.bgAPI)bgAPI.empty(); } else if(window.bgAPI){ bgAPI.resize(h); } }catch(_){ } }

  /* F3.5.4U — LAYOUT PREMIUM das notificações COMUNS. Construtores INLINE e IDÊNTICOS ao index.html
     (janela premium × toast in-app) — o teste de paridade obriga o MESMO DOM. CSP intacta (sem script
     externo). Presentation-only: monta a partir dos campos ESTRUTURADOS (eventType/actorName/taskTitle/
     fromStatus/toStatus/setor/cliente/hora); NÃO usa o body genérico (evita repetir ator/tarefa). */
  var PREMIUM_TYPES={task_moved:1,task_assigned:1,task_reassigned:1,task_updated:1,task_completed:1,task_reopened:1,designer_assigned:1};
  function premiumUse(p){ return !!(p&&p._premiumCommon===true&&PREMIUM_TYPES[String(p.eventType||'')]); }
  function premiumSevIcon(s){ return s==='critical'?'!':(s==='warning'?'⏱':(s==='success'?'✓':'i')); }
  function premiumHM(){ try{ var d=new Date(); var z=function(n){return(n<10?'0':'')+n;}; return z(d.getHours())+':'+z(d.getMinutes()); }catch(_){ return ''; } }
  function premiumChip(k){ var s=String(k||''); var m={afazer:['A Fazer','cs-afazer'],andamento:['Em andamento','cs-andamento'],revisao:['Revisão','cs-revisao'],concluido:['Concluído','cs-concluido'],entregue:['Concluído','cs-concluido']}; var e=m[s]; return e?{label:e[0],cls:e[1]}:{label:s,cls:'cs-afazer'}; }
  function premiumAvatar(name,photo,sev){ var ini=''; try{ ini=(initials(name)||'').toUpperCase(); }catch(_){} return photo?('<div class="ntfp-av" style="background-image:url(\''+esc(photo)+'\')" aria-hidden="true"></div>'):(name?('<div class="ntfp-av gen" aria-hidden="true">'+esc(ini||'?')+'</div>'):('<div class="ntfp-av gen" aria-hidden="true">'+esc(premiumSevIcon(sev))+'</div>')); }
  function premiumCommonInner(p){
    p=p||{}; var sev=p.severity||'info'; var sic=premiumSevIcon(sev);
    var type=String(p.title||'Atualização'); var actor=String(p.actorName||p.responsibleName||''); var task=String(p.taskTitle||'');
    var av=premiumAvatar(actor,String(p.actorAvatar||''),sev);
    var from=String(p.fromStatus||''), to=String(p.toStatus||''), et=String(p.eventType||''); var mid='';
    if(from&&to){ var cf=premiumChip(from), ct=premiumChip(to);
      mid='<div class="ntfp-chips" role="group" aria-label="Movimento de '+esc(cf.label)+' para '+esc(ct.label)+'"><span class="ntfp-chip '+cf.cls+'"><span class="cdot"></span>'+esc(cf.label)+'</span><span class="ntfp-arrow" aria-hidden="true">→</span><span class="ntfp-chip '+ct.cls+'"><span class="cdot"></span>'+esc(ct.label)+'</span></div>';
    } else if(et==='task_assigned'||et==='task_reassigned'||et==='designer_assigned'){ var resp=String(p.responsibleName||''); mid='<div class="ntfp-action">'+(resp?('Atribuída a '+esc(resp)):'Nova atribuição')+'</div>';
    } else { var ctx=String(p.context||''); if(ctx&&ctx!=='Tarefas') mid='<div class="ntfp-action">'+esc(ctx)+'</div>'; }
    var comp=[]; if(p.sector) comp.push(esc(String(p.sector))); if(p.clientName) comp.push(esc(String(p.clientName)));
    var meta=comp.length?('<div class="ntfp-meta">'+comp.join(' · ')+'</div>'):'';
    return av+'<div class="ntfp-bd"><div class="ntfp-hd"><span class="ntfp-eyebrow"><span class="esev" aria-hidden="true">'+esc(sic)+'</span>'+esc(type)+'</span><span class="ntfp-tm">'+esc(premiumHM())+'</span><button class="ntf-x" title="Fechar" aria-label="Fechar">×</button></div>'+(actor?('<div class="ntfp-actor">'+esc(actor)+'</div>'):'')+(task?('<div class="ntfp-task">'+esc(task)+'</div>'):'')+mid+meta+'<div class="ntfp-cta" data-cta="1">Abrir tarefa</div></div>';
  }
  function premiumGroupAction(t){ var s=String(t||''); var m={'Tarefa movimentada':'movimentou a tarefa','Tarefa concluída':'concluiu a tarefa','Tarefa reaberta':'reabriu a tarefa','Tarefa atribuída':'atribuiu a tarefa','Tarefa atualizada':'atualizou a tarefa'}; return m[s]||s; }
  function premiumGroupInner(view){
    view=view||{}; var sev=view.severity||'info'; var sic=premiumSevIcon(sev);
    var count=String(view.count||0); var task=String(view.taskTitle||'Tarefa');
    var av=premiumAvatar(String(view.primaryName||''),String(view.primaryAvatar||''),sev);
    var items=view.items||[], lines='';
    for(var i=0;i<items.length;i++){ var it=items[i]||{}; var who=esc(String(it.actorName||'')); lines+='<div class="ntfp-gi">'+(who?('<b>'+who+'</b> '):'')+esc(premiumGroupAction(it.title))+'</div>'; }
    if((view.extraCount||0)>0) lines+='<div class="ntfp-more">+'+esc(String(view.extraCount))+' outras atualizações</div>';
    return av+'<div class="ntfp-bd"><div class="ntfp-hd"><span class="ntfp-eyebrow"><span class="esev" aria-hidden="true">'+esc(sic)+'</span>'+esc(count)+' atualizações</span><span class="ntfp-tm">'+esc(premiumHM())+'</span><button class="ntf-x" title="Fechar" aria-label="Fechar">×</button></div><div class="ntfp-task">'+esc(task)+'</div><div class="ntfp-glist">'+lines+'</div><div class="ntfp-cta" data-cta="1">Abrir tarefa</div></div>';
  }

  function render(p){
    p=p||{};
    var key=String(p.dedupKey||p.eventId||(p.eventType+':'+(p.taskId||'')));
    if(seen[key]) return; seen[key]=1;
    var sev=p.severity||'info';
    var isAttr=(p.eventType==='designer_assigned'||p.eventType==='task_assigned');
    var isSla=/^sla_/.test(p.eventType||'')||p.eventType==='operational_block';
    var primName=isSla?(p.responsibleName||p.actorName||''):(p.actorName||p.responsibleName||'');
    var primPhoto=isSla?(p.responsibleAvatar||''):(p.actorAvatar||p.responsibleAvatar||'');
    var ini=initials(primName);
    var av=primPhoto?('<div class="ntf-av" style="background-image:url(\''+esc(primPhoto)+'\')"></div>')
          :(primName?('<div class="ntf-av gen">'+esc(ini||'?')+'</div>')
                    :('<div class="ntf-av gen">'+esc(sevIcon(sev))+'</div>'));
    var deep=(p.action&&p.action.deep)?String(p.action.deep):'';
    var respRow='';
    if(!isSla && p.responsibleName && p.responsibleName!==primName){
      var rav=p.responsibleAvatar?('<span class="ntf-resp-av" style="background-image:url(\''+esc(p.responsibleAvatar)+'\')"></span>')
                                 :('<span class="ntf-resp-av gen">'+esc(initials(p.responsibleName)||'?')+'</span>');
      respRow='<div class="ntf-resp">'+rav+'<span>Responsável: '+esc(p.responsibleName)+'</span></div>';
    }
    var inner;
    if(isAttr){
      inner='<div class="ntf-bd"><div class="ntf-hd"><b>'+esc(primName||'Nova tarefa atribuída a você')+'</b><span class="ntf-tm">'+esc(nowHM())+'</span></div>'
        +(primName?'<div class="ntf-ti">atribuiu uma tarefa</div>':'')
        +(p.taskTitle?'<div class="ntf-attr-task">'+esc(p.taskTitle)+'</div>':'')
        +(p.clientName?'<div class="ntf-attr-cli">'+esc(p.clientName)+'</div>':'')
        +respRow
        +(p.context?'<div class="ntf-ctx">'+esc(p.context)+'</div>':'')
        +'<div class="ntf-cta" data-cta="1">Abrir tarefa</div></div>';
    } else {
      var sub=(p.subtitle!=null&&p.subtitle!=='')?p.subtitle:(p.taskTitle||'');
      inner='<div class="ntf-bd"><div class="ntf-hd"><b>'+esc(p.title||'Notificação')+'</b><span class="ntf-tm">'+esc(nowHM())+'</span></div>'
        +(sub?'<div class="ntf-ti">'+esc(sub)+'</div>':'')
        +(p.body?'<div class="ntf-ds">'+esc(p.body).replace(/\n/g,'<br>')+'</div>':'')
        +respRow
        +(p.context?'<div class="ntf-ctx">'+esc(p.context)+'</div>':'')
        +'<div class="ntf-cta" data-cta="1">Abrir tarefa</div></div>';
    }
    var el=document.createElement('div'); el.className='ntf '+sevClass(sev)+(premiumUse(p)?' ntfp-w':''); // F3.5.4U — largura responsiva só no premium
    if(p.groupKey) el.setAttribute('data-group',String(p.groupKey)); // F3.5.4O — endereço p/ atualização de grupo (comum)
    if(premiumUse(p)){ el.innerHTML='<div class="ntf-card ntfp">'+premiumCommonInner(p)+'</div>'; } // F3.5.4U — layout premium (flag ON + tipo comum)
    else el.innerHTML='<div class="ntf-card">'+av+inner  // F3.5.4U — fallback: markup equivalente à 1.0.208 (flag OFF / tipo fora do escopo)
      +'<span class="ntf-sev">'+esc(sevIcon(sev))+'</span>'
      +'<button class="ntf-x" title="Fechar" aria-label="Fechar">×</button></div>';
    stack.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('in'); report(); });
    var dismiss=function(){ try{ el.classList.remove('in'); setTimeout(function(){ if(el.parentNode){el.parentNode.removeChild(el);} report(); },200); }catch(_){ } };
    var openTask=function(){ try{ if(window.bgAPI)bgAPI.open(deep); }catch(_){ } dismiss(); };
    var xb=el.querySelector('.ntf-x'); if(xb)xb.addEventListener('click',function(ev){ ev.stopPropagation(); dismiss(); });
    var cta=el.querySelector('[data-cta]'); if(cta)cta.addEventListener('click',function(ev){ ev.stopPropagation(); openTask(); });
    var card=el.querySelector('.ntf-card'); if(card)card.addEventListener('click',openTask);
    var ttl=sev==='critical'?11000:(sev==='warning'?8000:6000);
    // F3.5.4O — guarda o dismiss/timer/1º instante no próprio elemento p/ a atualização de grupo poder
    // religar handlers e REFRESCAR o TTL com TETO de permanência (sem alterar o caminho não-agrupado).
    el.__ntfDismiss=dismiss; el.__ntfFirstAt=Date.now(); el.__ntfTimer=setTimeout(dismiss,ttl);
    // limita a 5 cards visíveis
    while(stack.children.length>5){ stack.removeChild(stack.firstChild); }
    try{ if(window.bgAPI)bgAPI.rendered({dedupKey:key,severity:sev,eventType:p.eventType||'',isAttr:isAttr,count:stack.children.length}); }catch(_){ }
  }

  // F3.5.4O — ATUALIZAÇÃO DE GRUPO COMUM: morfa EM VIGOR o card existente (data-group) para o card
  // agrupado "N atualizações em [task]" (até 5 itens + "+N outras atualizações"). SEM novo card, SEM
  // re-animar a entrada, SEM som (a janela premium já é silenciosa), SEM roubar foco. TTL refrescado
  // com TETO de permanência (GROUP_MAX_MS desde o 1º evento). No-op se o card já saiu (groupKey ausente).
  var GROUP_MAX_MS=15000;
  function groupInner(view){
    var t=esc(view.taskTitle||'Tarefa');
    var head='<b>'+esc(String(view.count||0))+' atualizações em ‘'+t+'’</b>';
    var lines=''; var items=view.items||[];
    for(var i=0;i<items.length;i++){ var it=items[i]||{}; var who=it.actorName?('<b>'+esc(it.actorName)+'</b> '):''; var txt=esc(String(it.body||it.title||'')); lines+='<div class="ntf-gi">'+who+txt+'</div>'; }
    if((view.extraCount||0)>0) lines+='<div class="ntf-more">+'+esc(String(view.extraCount))+' outras atualizações</div>';
    return '<div class="ntf-bd"><div class="ntf-hd">'+head+'<span class="ntf-tm">'+esc(nowHM())+'</span></div>'
      +'<div class="ntf-glist">'+lines+'</div>'
      +'<div class="ntf-cta" data-cta="1">Abrir tarefa</div></div>';
  }
  function renderGroupUpdate(view){
    try{
      view=view||{}; var gk=String(view.groupKey||''); if(!gk) return;
      var el=null, kids=stack.children;
      for(var i=0;i<kids.length;i++){ if(kids[i].getAttribute&&kids[i].getAttribute('data-group')===gk){ el=kids[i]; break; } }
      if(!el) return; // card já sumiu (TTL) ⇒ no-op; o evento segue no sino individualmente
      var sev=view.severity||'info';
      var primName=view.primaryName||''; var primPhoto=view.primaryAvatar||'';
      var ini=initials(primName);
      var av=primPhoto?('<div class="ntf-av" style="background-image:url(\''+esc(primPhoto)+'\')"></div>')
            :(primName?('<div class="ntf-av gen">'+esc(ini||'?')+'</div>'):('<div class="ntf-av gen">'+esc(sevIcon(sev))+'</div>'));
      el.className='ntf '+sevClass(sev)+((view._premiumCommon===true)?' ntfp-w':'')+' in'; // F3.5.4U — largura responsiva no grupo premium; mantém visível (sem re-animar entrada), só atualiza a cor
      var deep=String(view.deep||'');
      if(view._premiumCommon===true){ el.innerHTML='<div class="ntf-card ntfp">'+premiumGroupInner(view)+'</div>'; } // F3.5.4U — grupo premium
      else el.innerHTML='<div class="ntf-card">'+av+groupInner(view)  // F3.5.4U — fallback: grupo equivalente à 1.0.208
        +'<span class="ntf-sev">'+esc(sevIcon(sev))+'</span>'
        +'<button class="ntf-x" title="Fechar" aria-label="Fechar">×</button></div>';
      var dismiss=el.__ntfDismiss||function(){ try{ el.classList.remove('in'); setTimeout(function(){ if(el.parentNode){el.parentNode.removeChild(el);} report(); },200); }catch(_){ } };
      var openTask=function(){ try{ if(window.bgAPI)bgAPI.open(deep); }catch(_){ } dismiss(); };
      var xb=el.querySelector('.ntf-x'); if(xb)xb.addEventListener('click',function(ev){ ev.stopPropagation(); dismiss(); });
      var cta=el.querySelector('[data-cta]'); if(cta)cta.addEventListener('click',function(ev){ ev.stopPropagation(); openTask(); });
      var card=el.querySelector('.ntf-card'); if(card)card.addEventListener('click',openTask);
      try{ if(el.__ntfTimer) clearTimeout(el.__ntfTimer); }catch(_){ }
      var ttl=sev==='critical'?11000:(sev==='warning'?8000:6000);
      var firstAt=el.__ntfFirstAt||Date.now(); var cap=GROUP_MAX_MS-(Date.now()-firstAt); if(cap<1200) cap=1200;
      el.__ntfTimer=setTimeout(dismiss, Math.min(ttl,cap));
      report();
    }catch(_){ }
  }

  try{ if(window.bgAPI&&typeof bgAPI.onCard==='function'){ bgAPI.onCard(function(p){ try{ render(p); }catch(_){ } }); } }catch(_){ }
  // F3.5.4O — canal de ATUALIZAÇÃO de grupo comum (morfa o card existente; sem novo card/som/foco).
  try{ if(window.bgAPI&&typeof bgAPI.onGroupUpdate==='function'){ bgAPI.onGroupUpdate(function(v){ try{ renderGroupUpdate(v); }catch(_){ } }); } }catch(_){ }
})();
</script>
</body>
</html>
