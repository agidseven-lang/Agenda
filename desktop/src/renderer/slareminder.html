<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https: http:; media-src data:; font-src 'none'; connect-src 'none'" />
<title>Agenda ID Seven — Lembrete de SLA</title>
<style>
  :root{ --amber:#F59E0B; --amber-d:#B45309; --red:#DC2626; --red-d:#991B1B; --ink:#0F172A; --muted:#64748B; --line:rgba(15,23,42,.12); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; overflow:hidden; -webkit-user-select:none; user-select:none; font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; }
  /* #wrap reserva 46px no topo p/ o avatar transbordar SEM ser cortado pela borda da janela.
     position:relative => o avatar (irmão do card) posiciona-se relativo ao #wrap, não ao card. */
  /* F3.5.4U-H1 (Defeito 2 — área preta): padding lateral/inferior AMPLIADO p/ CONTER integralmente a sombra
     do card DENTRO da janela transparente. Assim a borda retangular da BrowserWindow cai numa região 100%
     transparente (sem sombra escura vazando p/ a borda) — elimina o "retângulo/halo preto" no Windows. */
  #wrap{ position:relative; padding:46px 30px 40px; display:flex; justify-content:center; }
  /* overflow:hidden encaixa a faixa superior perfeitamente nos cantos arredondados do card;
     o avatar é IRMÃO (fora do card), então não é afetado por este clip. */
  /* F3.5.4U-H1 (Defeito 2 — área preta): sombra ENXUTA e clara (alcance ~36px, contido no padding do #wrap),
     em vez da sombra escura de 80px que vazava até a borda da janela transparente e virava um retângulo preto
     no Windows. Elegante, uniforme, apenas ao redor do card. */
  .card{ position:relative; z-index:1; width:100%; max-width:420px; background:#FFFFFF; border-radius:20px;
    overflow:hidden; box-shadow:0 10px 26px -10px rgba(2,6,23,.30), 0 2px 8px rgba(2,6,23,.10);
    padding:52px 22px 20px; text-align:center; border:1px solid rgba(15,23,42,.06); }
  .card::before{ content:""; position:absolute; left:0; right:0; top:0; height:6px; background:var(--amber); }
  .card.red::before{ background:var(--red); }
  /* avatar: irmão do card, sobreposto ao topo; top:14px (>0) garante 100% visível na janela. */
  .av{ position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:3; width:72px; height:72px; border-radius:50%;
    border:4px solid #fff; box-shadow:0 10px 24px -4px rgba(2,6,23,.34), 0 0 0 3px rgba(245,158,11,.22); background:#E2E8F0 center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:26px; overflow:hidden; }
  .av.red{ box-shadow:0 10px 24px -4px rgba(2,6,23,.34), 0 0 0 3px rgba(220,38,38,.24); }
  .kicker{ font-size:13px; font-weight:800; letter-spacing:2px; color:var(--amber-d); margin-bottom:2px; }
  .card.red .kicker{ color:var(--red-d); }
  .name{ font-size:15px; font-weight:700; color:var(--ink); margin-bottom:10px; }
  .msg{ font-size:15px; color:var(--ink); line-height:1.4; margin:0 4px 8px; }
  .task{ font-size:14px; font-weight:600; color:var(--ink); margin:6px 8px 2px; }
  .ctx{ font-size:12.5px; color:var(--muted); margin:0 8px 14px; }
  /* Botão OK (flag OFF = 1.0.205 idêntico) */
  .ok{ display:block; width:100%; border:none; border-radius:12px; padding:13px 16px; font-size:15px; font-weight:800;
    letter-spacing:.5px; color:#fff; cursor:pointer; background:var(--amber); box-shadow:0 8px 18px -6px rgba(245,158,11,.7); }
  .card.red .ok{ background:var(--red); box-shadow:0 8px 18px -6px rgba(220,38,38,.7); }
  .ok:active{ transform:translateY(1px); }
  .pend{ margin-top:10px; font-size:11.5px; color:var(--muted); min-height:14px; }
  /* ── F3.5.4P — área de decisão ── */
  #foot{ margin-top:2px; }
  .decisions{ display:flex; flex-direction:column; gap:8px; }
  .dbtn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border-radius:11px; padding:11px 14px;
    font-size:14px; font-weight:700; cursor:pointer; border:1.5px solid var(--line); background:#fff; color:var(--ink); text-align:center; }
  .dbtn:active{ transform:translateY(1px); }
  .dbtn.primary{ border:none; color:#fff; background:var(--amber); box-shadow:0 8px 18px -8px rgba(245,158,11,.7); }
  .card.red .dbtn.primary{ background:var(--red); box-shadow:0 8px 18px -8px rgba(220,38,38,.7); }
  .dbtn.ghost{ border:none; background:transparent; color:var(--muted); font-weight:600; font-size:13px; padding:8px; }
  .dbtn .ic{ font-size:15px; line-height:1; }
  .subpanel{ text-align:left; border:1px solid var(--line); border-radius:12px; padding:12px; background:#F8FAFC; }
  .sp-title{ font-size:13px; font-weight:800; color:var(--ink); margin-bottom:8px; }
  .sp-note{ font-size:11.5px; color:var(--muted); margin:8px 2px 0; line-height:1.35; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ border:1.5px solid var(--line); background:#fff; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }
  .chip.sel{ border-color:var(--amber); background:rgba(245,158,11,.12); color:var(--amber-d); }
  .card.red .chip.sel{ border-color:var(--red); background:rgba(220,38,38,.10); color:var(--red-d); }
  .stepper{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .stepper button{ width:34px; height:34px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:18px; font-weight:800; color:var(--ink); cursor:pointer; }
  .stepper .val{ font-size:15px; font-weight:800; color:var(--ink); min-width:70px; text-align:center; }
  .reason-list{ display:flex; flex-direction:column; gap:2px; max-height:210px; overflow-y:auto; }
  .rrow{ display:flex; align-items:center; gap:9px; padding:7px 6px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--ink); }
  .rrow:hover{ background:rgba(15,23,42,.04); }
  .rrow .dot{ width:15px; height:15px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; }
  .rrow.sel .dot{ border-color:var(--amber); background:radial-gradient(circle,var(--amber) 0 5px, transparent 6px); }
  .card.red .rrow.sel .dot{ border-color:var(--red); background:radial-gradient(circle,var(--red) 0 5px, transparent 6px); }
  textarea, input[type=text]{ width:100%; margin-top:9px; border:1.5px solid var(--line); border-radius:9px; padding:9px 10px; font:inherit; font-size:13px; color:var(--ink); resize:none; background:#fff; }
  textarea:focus, input[type=text]:focus{ outline:none; border-color:var(--amber); }
  .recip{ font-size:13px; color:var(--ink); margin-bottom:6px; }
  .recip b{ color:var(--amber-d); } .card.red .recip b{ color:var(--red-d); }
  .picker{ display:flex; flex-direction:column; gap:2px; max-height:150px; overflow-y:auto; margin-top:4px; }
  .confirm-row{ display:flex; gap:9px; margin-top:12px; }
  .btn2{ flex:1; border-radius:11px; padding:11px 12px; font-size:14px; font-weight:800; cursor:pointer; border:1.5px solid var(--line); background:#fff; color:var(--ink); }
  .btn2.go{ border:none; color:#fff; background:var(--amber); }
  .card.red .btn2.go{ background:var(--red); }
  .btn2[disabled]{ opacity:.5; cursor:default; }
  .busy{ display:flex; align-items:center; justify-content:center; gap:10px; padding:14px; font-size:14px; font-weight:700; color:var(--muted); }
  .spin{ width:18px; height:18px; border-radius:50%; border:3px solid rgba(100,116,139,.25); border-top-color:var(--amber); animation:spin .8s linear infinite; }
  .card.red .spin{ border-top-color:var(--red); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .statebox{ text-align:center; }
  .statebox .txt{ font-size:14px; color:var(--ink); line-height:1.4; margin:4px 6px 12px; }
  .errbanner{ margin-top:10px; font-size:12.5px; color:var(--red-d); background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.25); border-radius:9px; padding:9px 10px; text-align:left; }
  /* ── F3.5.4Q — CHECK-IN DE TAREFA PARADA (identidade AZUL/neutra, NÃO acusatória) ── */
  :root{ --blue:#2563EB; --blue-d:#1E40AF; --orange:#EA7A17; --orange-d:#C2590A; }
  /* F3.5.5A — CHECK-IN DE EXECUÇÃO (laranja): mesma casca do checkin, cor própria */
  .card.exec::before{ background:var(--orange); }
  .card.exec .kicker{ color:var(--orange-d); }
  .av.exec{ box-shadow:0 10px 24px -4px rgba(2,6,23,.34), 0 0 0 3px rgba(234,122,23,.24); }
  .card.exec .dbtn.primary{ background:var(--orange); box-shadow:0 8px 18px -8px rgba(234,122,23,.7); }
  .card.exec .chip.sel{ border-color:var(--orange); background:rgba(234,122,23,.12); color:var(--orange-d); }
  .card.exec .rrow.sel .dot{ border-color:var(--orange); background:radial-gradient(circle,var(--orange) 0 5px, transparent 6px); }
  .card.exec .btn2.go{ background:var(--orange); }
  .card.exec .spin{ border-top-color:var(--orange); }
  .card.exec .ok{ background:var(--orange); box-shadow:0 8px 18px -6px rgba(234,122,23,.7); }
  .card.checkin::before{ background:var(--blue); }
  .card.checkin .kicker{ color:var(--blue-d); }
  .av.checkin{ box-shadow:0 10px 24px -4px rgba(2,6,23,.34), 0 0 0 3px rgba(37,99,235,.22); }
  .card.checkin .dbtn.primary{ background:var(--blue); box-shadow:0 8px 18px -8px rgba(37,99,235,.7); }
  .card.checkin .chip.sel{ border-color:var(--blue); background:rgba(37,99,235,.12); color:var(--blue-d); }
  .card.checkin .rrow.sel .dot{ border-color:var(--blue); background:radial-gradient(circle,var(--blue) 0 5px, transparent 6px); }
  .card.checkin .btn2.go{ background:var(--blue); }
  .card.checkin .recip b{ color:var(--blue-d); }
  .card.checkin .spin{ border-top-color:var(--blue); }
  .card.checkin .ok{ background:var(--blue); box-shadow:0 8px 18px -6px rgba(37,99,235,.7); }
  .dbtn.danger{ border:1.5px solid rgba(220,38,38,.4); color:var(--red-d); }
</style>
</head>
<body>
<div id="wrap">
  <div class="card" id="card">
    <div class="kicker" id="kicker">ATENÇÃO</div>
    <div class="name" id="name"></div>
    <div class="msg" id="msg"></div>
    <div class="task" id="task"></div>
    <div class="ctx" id="ctx"></div>
    <div id="foot"></div>
    <div class="pend" id="pend"></div>
  </div>
  <div class="av" id="av"></div>
</div>
<script>
(function(){
  "use strict";
  var api = window.slaAPI || {};
  var cur = null;            // view atual
  var lastSoundKey = "";     // toca 1x por chave (abrir) e na promoção (chave muda de nível)
  var audio = null;
  var mode = "idle";         // idle | finishing | blocked | help | busy | msg
  var busy = false;
  var lastError = "";        // banner de erro (retry preservando dados)
  var draft = { decisionType:"", etaMinutes:0, reasonCode:"", reasonText:"", helpText:"", helpRecipientId:"", helpRecipientName:"" };
  var help = { loading:false, reason:"", preselect:null, eligible:[] };

  var REASONS = [
    ["material","Aguardando material"],
    ["social","Aguardando Social Media"],
    ["cliente","Aguardando cliente"],
    ["aprovacao","Aguardando aprovação"],
    ["tecnico","Problema técnico"],
    ["informacao","Falta de informação"],
    ["dependencia","Dependência de outra tarefa"],
    ["demanda","Demanda maior que o previsto"],
    ["outro","Outro (especificar)"]
  ];

  function initials(name){
    var n = String(name||"").trim(); if(!n) return "?";
    var p = n.split(/\s+/); var a = (p[0]||"")[0]||""; var b = (p.length>1?(p[p.length-1][0]||""):"");
    return (a+b).toUpperCase() || "?";
  }
  function colorFor(name){
    var s = String(name||""); var h = 0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
    var hues=[210,265,330,20,150,190]; return "hsl("+hues[h%hues.length]+" 55% 55%)";
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function resizeSelf(){ try{ var h = document.getElementById("wrap").getBoundingClientRect().height; api.resize && api.resize(Math.ceil(h)); }catch(_e){} }
  function taskIdOf(v){ return String((v&&v.taskId) || ((v&&v.deep)||"").replace(/^detail\//,"") || ""); }

  // ── F3.5.4U-H2 — PROCESSAMENTO ATÔMICO (correção da sobreposição do "Registrando…") ──
  // Ao clicar numa ação, CONGELAMOS a altura do #foot (medida ANTES de trocar os botões pelo spinner) e NÃO
  // pedimos resize ao main. Assim o card NÃO encolhe e a janela NÃO redimensiona/move → some o artefato de
  // sobreposição (backing-store do card antigo aparecendo atrás do "Registrando…"). Só o #foot MORFA, no mesmo
  // ciclo, para o spinner; cabeçalho/tarefa/prazo permanecem. UM único card, sempre.
  function freezeFoot(){ try{ var f=document.getElementById("foot"); if(f){ f.style.minHeight=Math.ceil(f.getBoundingClientRect().height)+"px"; f.style.display="flex"; f.style.flexDirection="column"; f.style.justifyContent="center"; } }catch(_e){} }
  function unfreezeFoot(){ try{ var f=document.getElementById("foot"); if(f){ f.style.minHeight=""; f.style.display=""; f.style.flexDirection=""; f.style.justifyContent=""; } }catch(_e){} }
  // Prova SANITIZADA no clique: contagens de DOM (nunca nome/título/cliente/UID/conteúdo).
  function centralCounts(){
    var cards=document.querySelectorAll(".card"); var vis=0;
    for(var i=0;i<cards.length;i++){ try{ if(cards[i].getClientRects().length>0) vis++; }catch(_e){} }
    return { cardElementCount:cards.length, visibleCardCount:vis, processingLayerCount:document.querySelectorAll(".busy").length };
  }
  function sendObs(actionType){ try{ var cc=centralCounts(); api.obs && api.obs({ actionType:String(actionType||""), cardElementCount:cc.cardElementCount, visibleCardCount:cc.visibleCardCount, processingLayerCount:cc.processingLayerCount, rendererState:"processing" }); }catch(_e){} }

  function playSound(v){
    if(v.soundDataUri && v.key && v.key !== lastSoundKey){
      lastSoundKey = v.key;
      try { audio = new Audio(v.soundDataUri); audio.play().catch(function(){}); } catch(_e){}
    }
  }

  // ── header (comum a todos os estados) ──
  function renderHeader(v){
    var card = document.getElementById("card");
    var red = (v.level === "critical");
    card.className = "card" + (red ? " red" : "");
    document.getElementById("kicker").textContent = red ? "URGENTE" : "ATENÇÃO";
    var av = document.getElementById("av");
    av.className = "av" + (red ? " red" : "");
    if(v.actorAvatar){ av.style.backgroundImage = "url('"+String(v.actorAvatar).replace(/'/g,"")+"')"; av.textContent=""; av.style.background = "#E2E8F0 center/cover no-repeat"; av.style.backgroundImage="url('"+String(v.actorAvatar).replace(/'/g,"")+"')"; }
    else { av.style.backgroundImage=""; av.style.background = colorFor(v.actorName); av.textContent = initials(v.actorName); }
    document.getElementById("name").textContent = v.actorName || "";
    document.getElementById("msg").textContent = v.body || "";
    var tk = v.taskTitle || "Tarefa"; if(v.clientName) tk += " — " + v.clientName;
    document.getElementById("task").textContent = tk;
    document.getElementById("ctx").textContent = v.context || "";
    var pend = document.getElementById("pend");
    pend.textContent = (Number(v.queueLen)>1) ? (v.queueLen + " alertas pendentes") : "";
  }

  function bind(id, ev, fn){ var e=document.getElementById(id); if(e) e.addEventListener(ev, fn); }

  // ── footer por estado ──
  function renderFoot(v){
    var foot = document.getElementById("foot");
    if(!busy){ unfreezeFoot(); }   // F3.5.4U-H2: fora do processamento, sem trava de altura (restore/promoção/novo)
    var html = "";
    if(mode === "msg"){ html = footMsg(); }
    else if(busy){ html = '<div class="busy"><span class="spin"></span><span>Registrando…</span></div>'; }
    else if(!v.decisionsEnabled){ html = '<button class="ok" id="ok" type="button">OK</button>'; }   // FLAG OFF = 1.0.205
    else if(mode === "idle"){ html = footDecisions(); }
    else if(mode === "finishing"){ html = footFinishing(); }
    else if(mode === "blocked"){ html = footBlocked(); }
    else if(mode === "help"){ html = footHelp(); }
    if(lastError && mode !== "msg" && !busy){ html += '<div class="errbanner">'+esc(lastError)+'</div>'; }
    foot.innerHTML = html;
    wire(v);
  }

  function footDecisions(){
    return '<div class="decisions">'
      + '<button class="dbtn primary" id="d_start" type="button"><span class="ic">▶</span>Iniciar agora</button>'
      + '<button class="dbtn" id="d_fin" type="button"><span class="ic">⏱</span>Estou finalizando</button>'
      + '<button class="dbtn" id="d_blk" type="button"><span class="ic">⛔</span>Estou bloqueado</button>'
      + '<button class="dbtn" id="d_help" type="button"><span class="ic">🆘</span>Preciso de ajuda</button>'
      + '<button class="dbtn ghost" id="d_ack" type="button">Apenas reconhecer</button>'
      + '</div>';
  }

  function footFinishing(){
    var presets=[10,20,30]; var chips="";
    for(var i=0;i<presets.length;i++){ var m=presets[i]; chips += '<div class="chip'+(draft.etaMinutes===m?' sel':'')+'" data-eta="'+m+'">+'+m+' min</div>'; }
    var isOutro = draft.etaMinutes>0 && presets.indexOf(draft.etaMinutes)<0;
    chips += '<div class="chip'+(isOutro?' sel':'')+'" id="eta_outro">Outro…</div>';
    var stepper = isOutro ? ('<div class="stepper"><button type="button" id="eta_dec">−</button><span class="val" id="eta_val">+'+draft.etaMinutes+' min</span><button type="button" id="eta_inc">+</button></div>') : "";
    return '<div class="subpanel"><div class="sp-title">Em quanto tempo você prevê finalizar?</div>'
      + '<div class="chips">'+chips+'</div>'+stepper
      + '<div class="sp-note">É uma PREVISÃO — não altera o prazo, o SLA nem os avisos.</div></div>'
      + confirmRow("Confirmar previsão", draft.etaMinutes>0);
  }

  function footBlocked(){
    var rows="";
    for(var i=0;i<REASONS.length;i++){ var r=REASONS[i]; rows += '<div class="rrow'+(draft.reasonCode===r[0]?' sel':'')+'" data-rc="'+r[0]+'"><span class="dot"></span><span>'+esc(r[1])+'</span></div>'; }
    var obs = (draft.reasonCode==="outro") ? ('<textarea id="blk_obs" rows="2" maxlength="200" placeholder="Descreva o motivo (obrigatório)">'+esc(draft.reasonText)+'</textarea>') : "";
    var valid = !!draft.reasonCode && (draft.reasonCode!=="outro" || (draft.reasonText||"").trim().length>0);
    return '<div class="subpanel"><div class="sp-title">Qual o motivo do bloqueio?</div>'
      + '<div class="reason-list">'+rows+'</div>'+obs
      + '<div class="sp-note">O bloqueio é registrado; o SLA e o prazo NÃO são pausados.</div></div>'
      + confirmRow("Registrar bloqueio", valid);
  }

  function footHelp(){
    var body="";
    if(help.loading){ body = '<div class="busy"><span class="spin"></span><span>Localizando destinatário…</span></div>'; }
    else if(help.reason==="preselected" && help.preselect){
      body = '<div class="recip">Seu pedido será enviado para: <b>'+esc(help.preselect.name)+'</b></div>';
    } else if(help.reason==="ambiguous" && help.eligible.length){
      var opts="";
      for(var i=0;i<help.eligible.length;i++){ var u=help.eligible[i]; opts += '<div class="rrow'+(draft.helpRecipientId===u.id?' sel':'')+'" data-uid="'+esc(u.id)+'" data-uname="'+esc(u.name)+'"><span class="dot"></span><span>'+esc(u.name)+'</span></div>'; }
      body = '<div class="recip">Para quem enviar o pedido?</div><div class="picker">'+opts+'</div>';
    } else {
      body = '<div class="recip">Nenhum destinatário elegível foi encontrado automaticamente.</div>';
      if(help.eligible.length){ var o2=""; for(var j=0;j<help.eligible.length;j++){ var u2=help.eligible[j]; o2 += '<div class="rrow'+(draft.helpRecipientId===u2.id?' sel':'')+'" data-uid="'+esc(u2.id)+'" data-uname="'+esc(u2.name)+'"><span class="dot"></span><span>'+esc(u2.name)+'</span></div>'; } body += '<div class="picker">'+o2+'</div>'; }
    }
    var desc = '<textarea id="help_txt" rows="2" maxlength="200" placeholder="Descreva rapidamente (opcional)">'+esc(draft.helpText)+'</textarea>';
    var valid = !help.loading && !!draft.helpRecipientId;
    return '<div class="subpanel"><div class="sp-title">Pedir ajuda</div>'+body+desc
      + '<div class="sp-note">Notificação individual e imediata ao destinatário.</div></div>'
      + confirmRow("Enviar pedido", valid);
  }

  function confirmRow(goLabel, enabled){
    return '<div class="confirm-row"><button class="btn2" id="c_back" type="button">Voltar</button>'
      + '<button class="btn2 go" id="c_go" type="button"'+(enabled?"":" disabled")+'>'+esc(goLabel)+'</button></div>';
  }

  function footMsg(){
    var s = msgState || {};
    var actions = "";
    if(s.action==="dismiss"){ actions = '<button class="ok" id="m_dismiss" type="button">Fechar</button>'; }
    else if(s.action==="ackonly"){ actions = '<button class="ok" id="m_ack" type="button">OK</button>'; }
    else if(s.action==="back"){ actions = '<button class="ok" id="m_back" type="button">Voltar</button>'; }
    return '<div class="statebox"><div class="txt">'+esc(s.text||"")+'</div>'+actions+'</div>';
  }

  var msgState = null;
  function showMsg(text, action){ mode="msg"; busy=false; lastError=""; try{ api.setProcessing && api.setProcessing(false); }catch(_e){} msgState={ text:text, action:action }; if(cur) renderFoot(cur); resizeSelf(); }
  function showError(text){ lastError=text; busy=false; try{ api.setProcessing && api.setProcessing(false); }catch(_e){} if(cur) renderFoot(cur); resizeSelf(); }

  // ── wiring por estado (após innerHTML) ──
  function wire(v){
    if(mode==="msg"){
      bind("m_dismiss","click",function(){ try{ api.dismiss && api.dismiss(cur.key); }catch(_e){} });
      bind("m_ack","click",function(){ try{ api.ok && api.ok(cur.key); }catch(_e){} });
      bind("m_back","click",function(){ mode="idle"; lastError=""; renderFoot(cur); resizeSelf(); });
      return;
    }
    if(busy) return;
    if(!v.decisionsEnabled){ bind("ok","click",function(){ if(cur&&cur.key){ try{ api.ok && api.ok(cur.key); }catch(_e){} } }); return; }

    if(mode==="idle"){
      bind("d_start","click",function(){ sendDecision({ decisionType:"start_now" }); });
      bind("d_ack","click",function(){ sendDecision({ decisionType:"acknowledge_only" }); });
      bind("d_fin","click",function(){ mode="finishing"; lastError=""; if(!draft.etaMinutes) draft.etaMinutes=0; renderFoot(cur); resizeSelf(); });
      bind("d_blk","click",function(){ mode="blocked"; lastError=""; renderFoot(cur); resizeSelf(); });
      bind("d_help","click",function(){ startHelp(); });
      return;
    }
    // confirm-row comum
    bind("c_back","click",function(){ mode="idle"; lastError=""; renderFoot(cur); resizeSelf(); });

    if(mode==="finishing"){
      var chips=document.querySelectorAll(".chip[data-eta]");
      for(var i=0;i<chips.length;i++){ (function(c){ c.addEventListener("click",function(){ draft.etaMinutes=parseInt(c.getAttribute("data-eta"),10)||0; renderFoot(cur); resizeSelf(); }); })(chips[i]); }
      bind("eta_outro","click",function(){ if(!(draft.etaMinutes>0 && [10,20,30].indexOf(draft.etaMinutes)<0)) draft.etaMinutes=45; renderFoot(cur); resizeSelf(); });
      bind("eta_dec","click",function(){ draft.etaMinutes=Math.max(5,(draft.etaMinutes||45)-5); renderFoot(cur); resizeSelf(); });
      bind("eta_inc","click",function(){ draft.etaMinutes=Math.min(480,(draft.etaMinutes||45)+5); renderFoot(cur); resizeSelf(); });
      bind("c_go","click",function(){ if(draft.etaMinutes>0) sendDecision({ decisionType:"finishing", etaMinutes:draft.etaMinutes }); });
      return;
    }
    if(mode==="blocked"){
      var rows=document.querySelectorAll(".rrow[data-rc]");
      for(var j=0;j<rows.length;j++){ (function(r){ r.addEventListener("click",function(){ draft.reasonCode=r.getAttribute("data-rc"); renderFoot(cur); resizeSelf(); }); })(rows[j]); }
      var obs=document.getElementById("blk_obs"); if(obs){ obs.addEventListener("input",function(){ draft.reasonText=obs.value; var go=document.getElementById("c_go"); if(go){ if((obs.value||"").trim().length>0) go.removeAttribute("disabled"); else go.setAttribute("disabled","disabled"); } }); }
      bind("c_go","click",function(){ var valid = !!draft.reasonCode && (draft.reasonCode!=="outro" || (draft.reasonText||"").trim().length>0); if(valid) sendDecision({ decisionType:"blocked", reasonCode:draft.reasonCode, reasonText:(draft.reasonCode==="outro"?draft.reasonText.trim():"") }); });
      return;
    }
    if(mode==="help"){
      var picks=document.querySelectorAll(".rrow[data-uid]");
      for(var k=0;k<picks.length;k++){ (function(p){ p.addEventListener("click",function(){ draft.helpRecipientId=p.getAttribute("data-uid"); draft.helpRecipientName=p.getAttribute("data-uname"); renderFoot(cur); resizeSelf(); }); })(picks[k]); }
      var ht=document.getElementById("help_txt"); if(ht){ ht.addEventListener("input",function(){ draft.helpText=ht.value; }); }
      bind("c_go","click",function(){ if(draft.helpRecipientId) sendDecision({ decisionType:"help_requested", helpText:(draft.helpText||"").trim(), helpRecipientId:draft.helpRecipientId, helpRecipientName:draft.helpRecipientName }); });
      return;
    }
  }

  function startHelp(){
    mode="help"; lastError=""; help={ loading:true, reason:"", preselect:null, eligible:[] };
    draft.helpRecipientId=""; draft.helpRecipientName="";
    renderFoot(cur); resizeSelf();
    try{ api.resolveHelp && api.resolveHelp({ key:cur.key, taskId:taskIdOf(cur) }); }catch(_e){}
  }

  function sendDecision(extra){
    if(busy) return;             // idempotência de UI: bloqueia duplo-clique (1º passo da ordem obrigatória)
    freezeFoot();                // F3.5.4U-H2: congela a altura do #foot ANTES de trocar botões→spinner (sem encolher/mover)
    busy = true; lastError=""; mode = (mode==="idle"?mode:mode);
    try{ api.setProcessing && api.setProcessing(true); }catch(_e){}   // main CONGELA os bounds (nenhum setBounds visível)
    var payload = { key: (cur&&cur.key)||"", decisionType: extra.decisionType };
    if(extra.etaMinutes) payload.etaMinutes = extra.etaMinutes;
    if(extra.reasonCode) payload.reasonCode = extra.reasonCode;
    if(extra.reasonText) payload.reasonText = extra.reasonText;
    if(extra.helpText) payload.helpText = extra.helpText;
    if(extra.helpRecipientId){ payload.helpRecipientId = extra.helpRecipientId; payload.helpRecipientName = extra.helpRecipientName||""; }
    renderFoot(cur);             // troca ATÔMICA só do #foot → "Registrando…" (mesmo card, mesma altura). SEM resizeSelf.
    sendObs(extra.decisionType); // prova sanitizada no clique: 1 card / 1 camada / 1 janela
    try{ api.decide && api.decide(payload); }catch(_e){ busy=false; showError("Não foi possível registrar a resposta. Tente novamente."); }
  }

  // ── entrada do card (main → janela) ──
  function render(v){
    if(!v) return; cur = v;
    renderHeader(v);
    renderFoot(v);
    resizeSelf();
    try{ api.rendered && api.rendered(v.key); }catch(_e){}
  }

  if(api.onCard) api.onCard(function(v){
    if(!v) return;
    // F3.5.4Q — CHECK-IN de tarefa parada usa a MESMA janela central (view AZUL, kind:'checkin').
    if(v.kind==="checkin" && String(v.checkinKind||"")==="execution"){
      // F3.5.5A — CHECK-IN DE EXECUÇÃO (laranja): mesma janela/fila; respostas e decide próprios (server-side)
      var eprev=ecur;
      if(!eprev || eprev.key!==v.key){ emode="idle"; ebusy=false; eerr=""; emsgState=null; try{ api.setProcessing && api.setProcessing(false); }catch(_e){}
        edraft={ answer:"", reasonCode:"", observation:"", waitingOrigin:"", pauseSel:"", progressPct:"" }; }
      if(v.draft && typeof v.draft==="object" && v.draft.exec===true){   // RESTORE pós-preempção crítica: texto preservado
        edraft.answer=v.draft.answer||""; edraft.reasonCode=v.draft.reasonCode||""; edraft.observation=v.draft.observation||"";
        edraft.waitingOrigin=v.draft.waitingOrigin||""; edraft.pauseSel=v.draft.pauseSel||""; edraft.progressPct=v.draft.progressPct||"";
        var em=String(v.draft.mode||"idle"); if(["idle","sim","nao"].indexOf(em)>=0) emode=em;
      }
      renderExecution(v);
      return;
    }
    if(v.kind==="checkin"){
      var cprev=ccur;
      if(!cprev || cprev.key!==v.key){   // ciclo novo ⇒ reset total
        cmode="idle"; cbusy=false; cerr=""; cmsgState=null;
        try{ api.setProcessing && api.setProcessing(false); }catch(_e){}   // F3.5.4U-H2: novo check-in ⇒ sem trava de processamento
        cdraft={ reasonCode:"", reasonText:"", helpText:"", helpRecipientId:"", helpRecipientName:"" };
        chelp={ loading:false, reason:"", preselect:null, eligible:[] };
      }
      if(v.draft && typeof v.draft==="object"){   // RESTORE após suspensão pelo SLA: rehidrata o rascunho
        cdraft.reasonCode=v.draft.reasonCode||""; cdraft.reasonText=v.draft.reasonText||"";
        cdraft.helpText=v.draft.helpText||""; cdraft.helpRecipientId=v.draft.helpRecipientId||""; cdraft.helpRecipientName=v.draft.helpRecipientName||"";
        var dm=String(v.draft.responseType||"idle");
        if(["blocked","help","return","idle"].indexOf(dm)>=0) cmode=dm;
        if(cmode==="help" && !chelp.eligible.length){ chelp={ loading:true, reason:"", preselect:null, eligible:[] }; try{ api.checkinResolveHelp && api.checkinResolveHelp({ key:v.key, taskId:taskIdOf(v) }); }catch(_e){} }
      }
      renderCheckin(v);
      return;
    }
    var prev = cur;
    var promoted = !!(prev && taskIdOf(prev)===taskIdOf(v) && prev.level!=="critical" && v.level==="critical");
    var sameKey = !!(prev && prev.key===v.key);
    if(promoted){
      // Promoção amarelo→vermelho: PRESERVA rascunho/painel aberto; exige decisão do vermelho (cancela busy).
      busy=false; if(mode==="msg") mode="idle"; lastError="";
      try{ api.setProcessing && api.setProcessing(false); }catch(_e){}   // F3.5.4U-H2: libera bounds p/ o card vermelho renderizar/recentralizar
    } else if(!sameKey){
      // Novo alerta (não é promoção nem re-render do mesmo): reset total.
      mode="idle"; busy=false; lastError=""; msgState=null;
      try{ api.setProcessing && api.setProcessing(false); }catch(_e){}   // F3.5.4U-H2: novo card ⇒ sem trava de processamento
      draft={ decisionType:"", etaMinutes:0, reasonCode:"", reasonText:"", helpText:"", helpRecipientId:"", helpRecipientName:"" };
      help={ loading:false, reason:"", preselect:null, eligible:[] };
    }
    cur = v;
    render(v);
    playSound(v);
  });

  if(api.onResult) api.onResult(function(r){
    r = r || {}; busy = false;
    if(r.status==="already_decided"){ showMsg("Este alerta já foi respondido neste ou em outro dispositivo.","dismiss"); }
    else if(r.status==="task_completed"){ showMsg("Esta tarefa foi concluída enquanto o alerta estava aberto.","ackonly"); }
    else if(r.status==="task_deleted"){ showMsg("Esta tarefa foi excluída — nada a registrar.","dismiss"); }
    else if(r.status==="queued"){ showMsg("Resposta salva neste computador e aguardando sincronização.","dismiss"); }
    else if(r.status==="error"){
      if(r.error==="not_authorized"){ showMsg("Você não é o responsável atual por esta tarefa.","back"); }
      else { showError("Não foi possível registrar a resposta. Verifique e tente novamente."); }
    }
    // committed ⇒ a janela é fechada pelo main; nada a fazer aqui.
  });

  if(api.onHelpCandidates) api.onHelpCandidates(function(c){
    c = c || {}; if(mode!=="help") return;
    help.loading=false; help.reason=String(c.reason||"none");
    help.preselect = c.preselect || null;
    help.eligible = Array.isArray(c.eligible) ? c.eligible : [];
    if(c.preselect && c.reason==="preselected"){ draft.helpRecipientId=String(c.preselect.id||""); draft.helpRecipientName=String(c.preselect.name||""); }
    renderFoot(cur); resizeSelf();
  });

  // ═══════════════ F3.5.5A — CHECK-IN DE EXECUÇÃO (view LARANJA; decide SERVER-SIDE) ═══════════════
  var ecur=null, emode="idle", ebusy=false, eerr="", emsgState=null;
  var edraft={ answer:"", reasonCode:"", observation:"", waitingOrigin:"", pauseSel:"", progressPct:"" };
  var EREASONS=[["nao_nao_iniciei","Ainda não iniciei"],["nao_bloqueado","Estou bloqueado"],["nao_aguardando_material","Aguardando material ou retorno"],["nao_conclui_minha_parte","Concluí minha parte"],["nao_outro","Outro"]];
  function ePushDraft(){ try{ api.checkinDraft && api.checkinDraft({ key:(ecur&&ecur.key)||"", draft:{ exec:true, mode:emode, answer:edraft.answer, reasonCode:edraft.reasonCode, observation:edraft.observation, waitingOrigin:edraft.waitingOrigin, pauseSel:edraft.pauseSel, progressPct:edraft.progressPct } }); }catch(_e){} }
  function renderExecHeader(v){
    var card=document.getElementById("card"); card.className="card checkin exec";
    document.getElementById("kicker").textContent="CHECK-IN DE EXECUÇÃO";
    var av=document.getElementById("av"); av.className="av checkin exec";
    if(v.actorAvatar){ av.style.background="#E2E8F0 center/cover no-repeat"; av.style.backgroundImage="url('"+String(v.actorAvatar).replace(/'/g,"")+"')"; av.textContent=""; }
    else { av.style.backgroundImage=""; av.style.background=colorFor(v.actorName); av.textContent=initials(v.actorName); }
    document.getElementById("name").textContent=v.actorName||"";
    document.getElementById("msg").textContent=String(v.message||"Você está executando esta tarefa neste momento?");
    var tk=v.taskTitle||"Tarefa"; if(v.clientName) tk+=" — "+v.clientName;
    document.getElementById("task").textContent=tk;
    document.getElementById("ctx").textContent=(v.etapa||"Em andamento");
    document.getElementById("pend").textContent="";
  }
  function eFootMsg(){ var st=emsgState||{}; var a=""; if(st.action==="dismiss"){ a='<button class="ok" id="em_dismiss" type="button">Fechar</button>'; } else if(st.action==="back"){ a='<button class="ok" id="em_back" type="button">Voltar</button>'; } return '<div class="statebox"><div class="txt">'+esc(st.text||"")+'</div>'+a+'</div>'; }
  function renderExecFoot(v){
    var foot=document.getElementById("foot"); var html="";
    if(!ebusy){ unfreezeFoot(); }
    if(emode==="msg"){ html=eFootMsg(); }
    else if(ebusy){ html='<div class="busy"><span class="spin"></span><span>Registrando…</span></div>'; }
    else if(emode==="idle"){
      var snz=(v.snoozeAllowed!==false && !(v.draft&&v.draft.snoozeUsed))?'<button class="dbtn ghost" id="e_snz" type="button">Responder em 10 minutos</button>':"";
      html='<div class="decisions">'
        +'<button class="dbtn primary" id="e_sim" type="button"><span class="ic">✅</span>Sim, estou executando</button>'
        +'<button class="dbtn" id="e_nao" type="button"><span class="ic">✋</span>Não</button>'
        +snz
        +'<button class="dbtn ghost" id="e_open" type="button">Abrir tarefa</button>'
        +'</div>';
    }
    else if(emode==="sim"){
      html='<div class="subpanel"><div class="sp-title">Ótimo! Quer registrar um avanço? (opcional)</div>'
        +'<textarea id="e_obs" rows="2" maxlength="2000" placeholder="Observação de progresso (opcional)">'+esc(edraft.observation)+'</textarea>'
        +'<div class="sp-note">A observação vai para os Detalhes da tarefa e o Social Media é avisado em tempo real.</div></div>'
        +eConfirmRow("Confirmar", true);
    }
    else if(emode==="nao"){
      var rows=""; for(var i=0;i<EREASONS.length;i++){ var r=EREASONS[i]; rows+='<div class="rrow'+(edraft.reasonCode===r[0]?' sel':'')+'" data-erc="'+r[0]+'"><span class="dot"></span><span>'+esc(r[1])+'</span></div>'; }
      var extra="";
      if(edraft.reasonCode==="nao_aguardando_material"){
        extra='<input id="e_worig" type="text" maxlength="200" placeholder="De quem/do que está aguardando?" value="'+esc(edraft.waitingOrigin)+'" style="width:100%;margin-top:8px;padding:8px;border:1px solid #CBD5E1;border-radius:8px;font:inherit">'
          +'<div class="sp-note" style="margin-top:6px">Pausar novos check-ins por: '
          +'<select id="e_pause" style="font:inherit;padding:4px 6px;border-radius:6px;border:1px solid #CBD5E1">'
          +'<option value=""'+(edraft.pauseSel===""?" selected":"")+'>não pausar</option>'
          +'<option value="60"'+(edraft.pauseSel==="60"?" selected":"")+'>1 hora</option>'
          +'<option value="120"'+(edraft.pauseSel==="120"?" selected":"")+'>2 horas</option>'
          +'<option value="240"'+(edraft.pauseSel==="240"?" selected":"")+'>4 horas</option>'
          +'</select></div>';
      }
      if(edraft.reasonCode==="nao_conclui_minha_parte"){
        extra='<div class="sp-note" style="margin-top:6px">Confirma que a sua parte está concluída? A tarefa segue para o fluxo de Revisão.</div>';
      }
      var needObs=(v.requireObservationOnNegative===true);
      var obs='<textarea id="e_obs2" rows="2" maxlength="2000" placeholder="Observação'+(needObs?" (obrigatória)":" (opcional)")+'">'+esc(edraft.observation)+'</textarea>';
      var valid=!!edraft.reasonCode && (!needObs || (edraft.observation||"").trim().length>0) && (edraft.reasonCode!=="nao_outro" || (edraft.observation||"").trim().length>0);
      html='<div class="subpanel"><div class="sp-title">O que está acontecendo?</div><div class="reason-list">'+rows+'</div>'+extra+obs
        +'<div class="sp-note">O Social Media é notificado em tempo real. Os alertas de prazo continuam valendo.</div></div>'
        +eConfirmRow(edraft.reasonCode==="nao_conclui_minha_parte"?"Confirmar conclusão":"Registrar", valid);
    }
    if(eerr && emode!=="msg" && !ebusy){ html+='<div class="errbanner">'+esc(eerr)+'</div>'; }
    foot.innerHTML=html; ewire(v);
  }
  function eConfirmRow(goLabel, enabled){ return '<div class="confirm-row"><button class="btn2" id="ec_back" type="button">Voltar</button><button class="btn2 go" id="ec_go" type="button"'+(enabled?"":" disabled")+'>'+esc(goLabel)+'</button></div>'; }
  function eShowMsg(text, action){ emode="msg"; ebusy=false; eerr=""; try{ api.setProcessing && api.setProcessing(false); }catch(_e){} emsgState={text:text,action:action}; if(ecur) renderExecFoot(ecur); resizeSelf(); }
  function eShowError(text){ eerr=text; ebusy=false; try{ api.setProcessing && api.setProcessing(false); }catch(_e){} if(ecur) renderExecFoot(ecur); resizeSelf(); }
  function ewire(v){
    if(emode==="msg"){ bind("em_dismiss","click",function(){ try{ api.checkinDismiss && api.checkinDismiss(ecur.key); }catch(_e){} }); bind("em_back","click",function(){ emode="idle"; eerr=""; ePushDraft(); renderExecFoot(ecur); resizeSelf(); }); return; }
    if(ebusy) return;
    if(emode==="idle"){
      bind("e_sim","click",function(){ emode="sim"; eerr=""; edraft.answer="sim"; ePushDraft(); renderExecFoot(ecur); resizeSelf(); });
      bind("e_nao","click",function(){ emode="nao"; eerr=""; edraft.answer="nao"; ePushDraft(); renderExecFoot(ecur); resizeSelf(); });
      bind("e_snz","click",function(){ eSend({ executionSnooze:true }); });
      bind("e_open","click",function(){ try{ api.open && api.open((ecur&&ecur.deep)||""); }catch(_e){} });   // abre a tarefa; NÃO resolve o check-in
      return;
    }
    bind("ec_back","click",function(){ emode="idle"; eerr=""; ePushDraft(); renderExecFoot(ecur); resizeSelf(); });
    if(emode==="sim"){
      var o=document.getElementById("e_obs"); if(o){ o.addEventListener("input",function(){ edraft.observation=o.value; ePushDraft(); }); }
      bind("ec_go","click",function(){ eSend({ executionResponseType:"sim", observation:(edraft.observation||"").trim() }); });
      return;
    }
    if(emode==="nao"){
      var rr=document.querySelectorAll(".rrow[data-erc]");
      for(var i=0;i<rr.length;i++){ (function(el){ el.addEventListener("click",function(){ edraft.reasonCode=el.getAttribute("data-erc"); ePushDraft(); renderExecFoot(ecur); resizeSelf(); }); })(rr[i]); }
      var o2=document.getElementById("e_obs2"); if(o2){ o2.addEventListener("input",function(){ edraft.observation=o2.value; ePushDraft(); var go=document.getElementById("ec_go"); if(go){ var needObs=(ecur&&ecur.requireObservationOnNegative===true); var valid=!!edraft.reasonCode && (!needObs || (o2.value||"").trim().length>0) && (edraft.reasonCode!=="nao_outro" || (o2.value||"").trim().length>0); if(valid) go.removeAttribute("disabled"); else go.setAttribute("disabled","disabled"); } }); }
      var wo=document.getElementById("e_worig"); if(wo){ wo.addEventListener("input",function(){ edraft.waitingOrigin=wo.value; ePushDraft(); }); }
      var ps=document.getElementById("e_pause"); if(ps){ ps.addEventListener("change",function(){ edraft.pauseSel=ps.value; ePushDraft(); }); }
      bind("ec_go","click",function(){
        if(!edraft.reasonCode) return;
        var payload={ executionResponseType: edraft.reasonCode, observation:(edraft.observation||"").trim() };
        if(edraft.reasonCode==="nao_aguardando_material"){ payload.waitingOrigin=(edraft.waitingOrigin||"").trim(); var mins=parseInt(edraft.pauseSel||"",10); if(mins>0) payload.pauseUntilMs=Date.now()+mins*60000; }
        if(edraft.reasonCode==="nao_conclui_minha_parte"){ payload.confirmPartComplete=true; }
        eSend(payload);
      });
      return;
    }
  }
  function eSend(extra){
    if(ebusy) return;
    if(extra.executionSnooze){ try{ api.checkinDecide && api.checkinDecide({ key:(ecur&&ecur.key)||"", executionSnooze:true }); }catch(_e){} return; }
    freezeFoot(); ebusy=true; eerr="";
    try{ api.setProcessing && api.setProcessing(true); }catch(_e){}   // main CONGELA os bounds (semântica 1.0.211)
    var payload={ key:(ecur&&ecur.key)||"" };
    for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra,k)) payload[k]=extra[k]; }
    renderExecFoot(ecur);             // troca ATÔMICA só do #foot → "Registrando…" (mesma altura). SEM resizeSelf.
    sendObs("execution_"+String(extra.executionResponseType||"decide"));
    try{ api.checkinDecide && api.checkinDecide(payload); }catch(_e){ ebusy=false; eShowError("Não foi possível registrar a resposta. Tente novamente."); }
  }
  function renderExecution(v){ ecur=v; renderExecHeader(v); renderExecFoot(v); resizeSelf(); try{ api.rendered && api.rendered(v.key); }catch(_e){} playSound(v); }

  // ═══════════════════════════ F3.5.4Q — CHECK-IN DE TAREFA PARADA (view AZUL) ═══════════════════════════
  var ccur=null, cmode="idle", cbusy=false, cerr="", cmsgState=null;
  var cdraft={ reasonCode:"", reasonText:"", helpText:"", helpRecipientId:"", helpRecipientName:"" };
  var chelp={ loading:false, reason:"", preselect:null, eligible:[] };
  function cPushDraft(){ try{ api.checkinDraft && api.checkinDraft({ key:(ccur&&ccur.key)||"", draft:{ responseType:cmode, reasonCode:cdraft.reasonCode, reasonText:cdraft.reasonText, helpText:cdraft.helpText, helpRecipientId:cdraft.helpRecipientId, helpRecipientName:cdraft.helpRecipientName } }); }catch(_e){} }

  function renderCheckinHeader(v){
    var card=document.getElementById("card"); card.className="card checkin";
    document.getElementById("kicker").textContent="CHECK-IN DE ATIVIDADE";
    var av=document.getElementById("av"); av.className="av checkin";
    if(v.actorAvatar){ av.style.background="#E2E8F0 center/cover no-repeat"; av.style.backgroundImage="url('"+String(v.actorAvatar).replace(/'/g,"")+"')"; av.textContent=""; }
    else { av.style.backgroundImage=""; av.style.background=colorFor(v.actorName); av.textContent=initials(v.actorName); }
    document.getElementById("name").textContent=v.actorName||"";
    document.getElementById("msg").textContent="A tarefa permanece sem uma atualização registrada há "+(v.sinceText||"")+". Esta tarefa ainda está sendo executada?";
    var tk=v.taskTitle||"Tarefa"; if(v.clientName) tk+=" — "+v.clientName;
    document.getElementById("task").textContent=tk;
    document.getElementById("ctx").textContent=(v.etapa||"Em andamento");
    document.getElementById("pend").textContent="";
  }
  function cConfirmRow(goLabel, enabled){ return '<div class="confirm-row"><button class="btn2" id="cc_back" type="button">Voltar</button><button class="btn2 go" id="cc_go" type="button"'+(enabled?"":" disabled")+'>'+esc(goLabel)+'</button></div>'; }
  function cFootMsg(){ var s=cmsgState||{}; var a=""; if(s.action==="dismiss"){ a='<button class="ok" id="cm_dismiss" type="button">Fechar</button>'; } else if(s.action==="back"){ a='<button class="ok" id="cm_back" type="button">Voltar</button>'; } return '<div class="statebox"><div class="txt">'+esc(s.text||"")+'</div>'+a+'</div>'; }
  function renderCheckinFoot(v){
    var foot=document.getElementById("foot"); var html="";
    if(!cbusy){ unfreezeFoot(); }   // F3.5.4U-H2: fora do processamento, sem trava de altura
    if(cmode==="msg"){ html=cFootMsg(); }
    else if(cbusy){ html='<div class="busy"><span class="spin"></span><span>Registrando…</span></div>'; }
    else if(cmode==="idle"){
      html='<div class="decisions">'
        +'<button class="dbtn primary" id="c_work" type="button"><span class="ic">✅</span>Sim, estou trabalhando</button>'
        +'<button class="dbtn" id="c_blk" type="button"><span class="ic">⛔</span>Estou bloqueado</button>'
        +'<button class="dbtn" id="c_help" type="button"><span class="ic">🆘</span>Preciso de ajuda</button>'
        +'<button class="dbtn danger" id="c_ret" type="button"><span class="ic">↩</span>Devolver para A Fazer</button>'
        +'<button class="dbtn ghost" id="c_open" type="button">Abrir tarefa</button>'
        +'</div>';
    }
    else if(cmode==="blocked"){
      var rows=""; for(var i=0;i<REASONS.length;i++){ var r=REASONS[i]; rows+='<div class="rrow'+(cdraft.reasonCode===r[0]?' sel':'')+'" data-crc="'+r[0]+'"><span class="dot"></span><span>'+esc(r[1])+'</span></div>'; }
      var obs=(cdraft.reasonCode==="outro")?('<textarea id="cblk_obs" rows="2" maxlength="200" placeholder="Descreva o motivo (obrigatório)">'+esc(cdraft.reasonText)+'</textarea>'):"";
      var bvalid=!!cdraft.reasonCode && (cdraft.reasonCode!=="outro" || (cdraft.reasonText||"").trim().length>0);
      html='<div class="subpanel"><div class="sp-title">Qual o motivo do bloqueio?</div><div class="reason-list">'+rows+'</div>'+obs+'<div class="sp-note">O bloqueio é registrado; o SLA e o prazo NÃO são pausados.</div></div>'+cConfirmRow("Registrar bloqueio", bvalid);
    }
    else if(cmode==="help"){
      var body="";
      if(chelp.loading){ body='<div class="busy"><span class="spin"></span><span>Localizando destinatário…</span></div>'; }
      else if(chelp.reason==="preselected" && chelp.preselect){ body='<div class="recip">Seu pedido será enviado para: <b>'+esc(chelp.preselect.name)+'</b></div>'; }
      else if(chelp.reason==="ambiguous" && chelp.eligible.length){ var opts=""; for(var h=0;h<chelp.eligible.length;h++){ var u=chelp.eligible[h]; opts+='<div class="rrow'+(cdraft.helpRecipientId===u.id?' sel':'')+'" data-cuid="'+esc(u.id)+'" data-cuname="'+esc(u.name)+'"><span class="dot"></span><span>'+esc(u.name)+'</span></div>'; } body='<div class="recip">Para quem enviar o pedido?</div><div class="picker">'+opts+'</div>'; }
      else { body='<div class="recip">Nenhum destinatário elegível foi encontrado automaticamente.</div>'; if(chelp.eligible.length){ var o2=""; for(var h2=0;h2<chelp.eligible.length;h2++){ var u2=chelp.eligible[h2]; o2+='<div class="rrow'+(cdraft.helpRecipientId===u2.id?' sel':'')+'" data-cuid="'+esc(u2.id)+'" data-cuname="'+esc(u2.name)+'"><span class="dot"></span><span>'+esc(u2.name)+'</span></div>'; } body+='<div class="picker">'+o2+'</div>'; } }
      var cdesc='<textarea id="chelp_txt" rows="2" maxlength="200" placeholder="Descreva rapidamente (opcional)">'+esc(cdraft.helpText)+'</textarea>';
      var hvalid=!chelp.loading && !!cdraft.helpRecipientId;
      html='<div class="subpanel"><div class="sp-title">Pedir ajuda</div>'+body+cdesc+'<div class="sp-note">Notificação individual e imediata ao destinatário.</div></div>'+cConfirmRow("Enviar pedido", hvalid);
    }
    else if(cmode==="return"){
      html='<div class="subpanel"><div class="sp-title">Devolver esta tarefa para “A Fazer”?</div><div class="sp-note">A tarefa volta para a coluna “A Fazer”. Não altera o prazo. Todos os dispositivos são atualizados em tempo real.</div></div>'+cConfirmRow("Sim, devolver", true);
    }
    if(cerr && cmode!=="msg" && !cbusy){ html+='<div class="errbanner">'+esc(cerr)+'</div>'; }
    foot.innerHTML=html; cwire(v);
  }
  function cShowMsg(text, action){ cmode="msg"; cbusy=false; cerr=""; try{ api.setProcessing && api.setProcessing(false); }catch(_e){} cmsgState={text:text,action:action}; if(ccur) renderCheckinFoot(ccur); resizeSelf(); }
  function cShowError(text){ cerr=text; cbusy=false; try{ api.setProcessing && api.setProcessing(false); }catch(_e){} if(ccur) renderCheckinFoot(ccur); resizeSelf(); }
  function cwire(v){
    if(cmode==="msg"){ bind("cm_dismiss","click",function(){ try{ api.checkinDismiss && api.checkinDismiss(ccur.key); }catch(_e){} }); bind("cm_back","click",function(){ cmode="idle"; cerr=""; cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); }); return; }
    if(cbusy) return;
    if(cmode==="idle"){
      bind("c_work","click",function(){ cSend({ responseType:"working" }); });
      bind("c_blk","click",function(){ cmode="blocked"; cerr=""; cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); });
      bind("c_help","click",function(){ cStartHelp(); });
      bind("c_ret","click",function(){ cmode="return"; cerr=""; cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); });
      bind("c_open","click",function(){ try{ api.open && api.open((ccur&&ccur.deep)||""); }catch(_e){} });   // abre a tarefa; NÃO resolve o check-in (exige uma das 4 decisões)
      return;
    }
    bind("cc_back","click",function(){ cmode="idle"; cerr=""; cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); });
    if(cmode==="blocked"){
      var brows=document.querySelectorAll(".rrow[data-crc]");
      for(var i=0;i<brows.length;i++){ (function(rr){ rr.addEventListener("click",function(){ cdraft.reasonCode=rr.getAttribute("data-crc"); cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); }); })(brows[i]); }
      var obs=document.getElementById("cblk_obs"); if(obs){ obs.addEventListener("input",function(){ cdraft.reasonText=obs.value; cPushDraft(); var go=document.getElementById("cc_go"); if(go){ if((obs.value||"").trim().length>0) go.removeAttribute("disabled"); else go.setAttribute("disabled","disabled"); } }); }
      bind("cc_go","click",function(){ var valid=!!cdraft.reasonCode && (cdraft.reasonCode!=="outro" || (cdraft.reasonText||"").trim().length>0); if(valid) cSend({ responseType:"blocked", reasonCode:cdraft.reasonCode, reasonText:(cdraft.reasonCode==="outro"?cdraft.reasonText.trim():"") }); });
      return;
    }
    if(cmode==="help"){
      var picks=document.querySelectorAll(".rrow[data-cuid]");
      for(var k=0;k<picks.length;k++){ (function(p){ p.addEventListener("click",function(){ cdraft.helpRecipientId=p.getAttribute("data-cuid"); cdraft.helpRecipientName=p.getAttribute("data-cuname"); cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); }); })(picks[k]); }
      var ht=document.getElementById("chelp_txt"); if(ht){ ht.addEventListener("input",function(){ cdraft.helpText=ht.value; cPushDraft(); }); }
      bind("cc_go","click",function(){ if(cdraft.helpRecipientId) cSend({ responseType:"help_requested", helpText:(cdraft.helpText||"").trim(), helpRecipientId:cdraft.helpRecipientId, helpRecipientName:cdraft.helpRecipientName }); });
      return;
    }
    if(cmode==="return"){ bind("cc_go","click",function(){ cSend({ responseType:"return_to_todo", confirmReturn:true }); }); return; }
  }
  function cStartHelp(){ cmode="help"; cerr=""; chelp={ loading:true, reason:"", preselect:null, eligible:[] }; cdraft.helpRecipientId=""; cdraft.helpRecipientName=""; cPushDraft(); renderCheckinFoot(ccur); resizeSelf(); try{ api.checkinResolveHelp && api.checkinResolveHelp({ key:ccur.key, taskId:taskIdOf(ccur) }); }catch(_e){} }
  function cSend(extra){
    if(cbusy) return; freezeFoot();   // F3.5.4U-H2: congela a altura ANTES de trocar botões→spinner (sem encolher/mover)
    cbusy=true; cerr="";
    try{ api.setProcessing && api.setProcessing(true); }catch(_e){}   // main CONGELA os bounds
    var payload={ key:(ccur&&ccur.key)||"", responseType:extra.responseType };
    if(extra.reasonCode) payload.reasonCode=extra.reasonCode;
    if(extra.reasonText) payload.reasonText=extra.reasonText;
    if(extra.helpText) payload.helpText=extra.helpText;
    if(extra.helpRecipientId){ payload.helpRecipientId=extra.helpRecipientId; payload.helpRecipientName=extra.helpRecipientName||""; }
    if(extra.confirmReturn) payload.confirmReturn=true;
    renderCheckinFoot(ccur);          // troca ATÔMICA só do #foot → "Registrando…" (mesmo card, mesma altura). SEM resizeSelf.
    sendObs(extra.responseType);      // prova sanitizada no clique
    try{ api.checkinDecide && api.checkinDecide(payload); }catch(_e){ cbusy=false; cShowError("Não foi possível registrar a resposta. Tente novamente."); }
  }
  function renderCheckin(v){ ccur=v; renderCheckinHeader(v); renderCheckinFoot(v); resizeSelf(); try{ api.rendered && api.rendered(v.key); }catch(_e){} playSound(v); }
  if(api.onCheckinResult) api.onCheckinResult(function(r){
    r=r||{};
    if(ecur && ebusy){   // F3.5.5A — resultado do decide de EXECUÇÃO (server-side)
      ebusy=false;
      if(r.status==="already_answered"){ eShowMsg("Este check-in já foi respondido neste ou em outro dispositivo.","dismiss"); }
      else if(r.status==="activity_changed"){ eShowMsg("Este check-in não vale mais (prazo ou responsável mudou).","dismiss"); }
      else if(r.status==="queued"){ eShowError("Sem conexão no momento. Seu texto foi mantido — tente novamente."); }
      else if(r.status==="error"){
        if(r.error==="observation_required"){ eShowError("Descreva a observação antes de registrar."); }
        else { eShowError("Não foi possível registrar a resposta. Verifique e tente novamente."); }
      }
      return; // committed ⇒ janela fechada pelo main
    }
    cbusy=false;
    if(r.status==="already_answered"){ cShowMsg("Este check-in já foi respondido neste ou em outro dispositivo.","dismiss"); }
    else if(r.status==="activity_changed"){ cShowMsg("A tarefa recebeu uma nova atualização. Este check-in não é mais necessário.","dismiss"); }
    else if(r.status==="task_completed"){ cShowMsg("Esta tarefa foi concluída — nada a registrar.","dismiss"); }
    else if(r.status==="task_deleted"){ cShowMsg("Esta tarefa foi excluída — nada a registrar.","dismiss"); }
    else if(r.status==="queued"){ cShowMsg("Resposta salva neste computador e aguardando sincronização.","dismiss"); }
    else if(r.status==="error"){ if(r.error==="not_authorized"){ cShowMsg("Você não é o responsável atual por esta tarefa.","back"); } else { cShowError("Não foi possível registrar a resposta. Verifique e tente novamente."); } }
    // committed ⇒ o main fecha a janela (e abre a tarefa em working/return_to_todo).
  });
  if(api.onCheckinHelpCandidates) api.onCheckinHelpCandidates(function(c){
    c=c||{}; if(cmode!=="help") return;
    chelp.loading=false; chelp.reason=String(c.reason||"none"); chelp.preselect=c.preselect||null; chelp.eligible=Array.isArray(c.eligible)?c.eligible:[];
    if(c.preselect && c.reason==="preselected"){ cdraft.helpRecipientId=String(c.preselect.id||""); cdraft.helpRecipientName=String(c.preselect.name||""); }
    renderCheckinFoot(ccur); resizeSelf();
  });

  // clique no cartão (fora dos botões) NÃO fecha nada. Sem ESC/click-fora.
})();
</script>
</body>
</html>
