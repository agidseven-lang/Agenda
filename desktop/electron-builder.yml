# Electron Builder — Agenda ID Seven Desktop (Windows)
# Sem code-sign nesta fase (SmartScreen mostrara aviso — esperado).
appId: br.com.idseven.agenda.desktop
productName: Agenda ID Seven Desktop
copyright: ID Seven
directories:
  output: dist-installer
  buildResources: build
files:
  - dist/**/*
  - src/renderer/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules/firebase/**/{*.md,*.ts,LICENSE,*.flow,docs/**}"
# F3.3.22-TRAY-FIX — empacota o icone do tray como recurso REAL em disco (resources/icon.png),
# resolvendo process.resourcesPath/icon.png usado por src/main/tray.ts (candidato #2). Sem isto,
# build/icon.png nao entra no pacote e o Tray cai em nativeImage.createEmpty() -> icone invisivel.
extraResources:
  - from: build/icon.png
    to: icon.png
  # F3.3.74C — helper nativo do Windows Share (compilado no CI antes do electron-builder;
  # instalado junto, sem atalho proprio, chamado só pelo processo main via IPC native-share)
  - from: native-share/publish
    to: native-share
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "Agenda-ID-Seven-Desktop-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agenda ID Seven Desktop
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
msi:
  oneClick: false
  perMachine: false
