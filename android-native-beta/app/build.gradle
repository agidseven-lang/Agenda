apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "io.github.takahirom.roborazzi"

// ─── F4.2E — Assinatura OFICIAL de producao (Play) ────────────────────────────────
// Resolvida EXCLUSIVAMENTE dos Secrets do CI, via variaveis de ambiente. NUNCA versionada,
// NUNCA hardcoded, NUNCA logada. SEM fallback: se qualquer parte faltar, hasOfficialSigning
// = false e a build RELEASE FALHA (guard em tasks.configureEach abaixo) — jamais assina com
// idseven-test.keystore / debug.keystore.
def officialStoreFile     = System.getenv("ANDROID_OFFICIAL_KEYSTORE_FILE")     // .p12 decodificado no runner
def officialStorePassword = System.getenv("ANDROID_OFFICIAL_KEYSTORE_PASSWORD")
def officialKeyAlias      = System.getenv("ANDROID_OFFICIAL_KEY_ALIAS")
def officialKeyPassword   = System.getenv("ANDROID_OFFICIAL_KEY_PASSWORD")
def hasOfficialSigning = officialStoreFile?.trim() && officialStorePassword?.trim() &&
                         officialKeyAlias?.trim() && officialKeyPassword?.trim() &&
                         file(officialStoreFile).exists()

android {
    namespace "br.com.idseven.agenda"
    compileSdk 34

    defaultConfig {
        // F4.2E — IDENTIDADE OFICIAL de producao (primeira publicacao na Play; Play nunca recebeu
        // este pacote). Sem sufixos de pre-lancamento no applicationId/versionName.
        applicationId "br.com.idseven.agenda"
        minSdk 26
        targetSdk 34
        versionCode 129
        versionName "1.0.0"
        vectorDrawables { useSupportLibrary true }

        // URLs reais das Cloud Functions Gen2 sao resolvidas no CI via
        // `gcloud functions describe ... --format=value(serviceConfig.uri)` e
        // injetadas no build por -PPASSWORD_RESET_REQUEST_URL / -P...CONFIRM_URL.
        // Em build local sem essas properties, ficam vazias e o AuthRepo retorna
        // mensagem amigavel + log tecnico em vez de chamar URL presumida.
        def _resetReq = project.findProperty('PASSWORD_RESET_REQUEST_URL') ?: ''
        def _resetCnf = project.findProperty('PASSWORD_RESET_CONFIRM_URL') ?: ''
        buildConfigField "String", "PASSWORD_RESET_REQUEST_URL", "\"${_resetReq}\""
        buildConfigField "String", "PASSWORD_RESET_CONFIRM_URL", "\"${_resetCnf}\""

        // F4.2B — Endpoints server-side REAIS de autenticacao (Cloud Run Gen2), os MESMOS
        // usados pela Desktop oficial 1.0.181 (desktop/src/main/auth-core.ts @ e4692c9). NAO sao
        // secret (o cliente Desktop os expoe); vem de configuracao de build AUDITAVEL, com default
        // publico e override por -P (nunca repetidos em varias classes; nunca token/credencial).
        def _loginUrl  = project.findProperty('AUTH_LOGIN_URL')           ?: 'https://loginuser-de36pi7vza-uc.a.run.app'
        def _selfUrl   = project.findProperty('AUTH_SELF_URL')            ?: 'https://getuserself-de36pi7vza-uc.a.run.app'
        def _chPwUrl   = project.findProperty('AUTH_CHANGE_PASSWORD_URL') ?: 'https://changepassword-de36pi7vza-uc.a.run.app'
        buildConfigField "String", "AUTH_LOGIN_URL", "\"${_loginUrl}\""
        buildConfigField "String", "AUTH_SELF_URL", "\"${_selfUrl}\""
        buildConfigField "String", "AUTH_CHANGE_PASSWORD_URL", "\"${_chPwUrl}\""

        // F4.2C — Endpoints server-side REAIS adicionados: issueFirebaseAuthToken (Firebase Custom
        // Token, Bearer da sessao) e registerFcmToken (FCM sem write direto no Firestore). Forma
        // canonica cloudfunctions.net Gen2 (projeto agenda-id-seven, us-central1), a MESMA usada por
        // functions/index.js; sobreponivel por -P no CI (-PAUTH_FIREBASE_TOKEN_URL / -PAUTH_REGISTER_FCM_URL).
        // NAO sao secret; NUNCA token/credencial em BuildConfig.
        def _fbTokUrl  = project.findProperty('AUTH_FIREBASE_TOKEN_URL')  ?: 'https://us-central1-agenda-id-seven.cloudfunctions.net/issueFirebaseAuthToken'
        def _fcmRegUrl = project.findProperty('AUTH_REGISTER_FCM_URL')    ?: 'https://us-central1-agenda-id-seven.cloudfunctions.net/registerFcmToken'
        buildConfigField "String", "AUTH_FIREBASE_TOKEN_URL", "\"${_fbTokUrl}\""
        buildConfigField "String", "AUTH_REGISTER_FCM_URL", "\"${_fcmRegUrl}\""
    }

    signingConfigs {
        // Assinatura de TESTE (keystore FIXO versionado, senha padrao "android"). LEGADO —
        // usada SOMENTE em builds DEBUG/QA locais. NUNCA referenciada pelo release oficial.
        debugtest {
            storeFile file("idseven-test.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Assinatura OFICIAL (Play). So e registrada quando TODOS os Secrets existem — sem
        // fallback. storeType PKCS12 (formato da chave oficial idseven-agenda-upload).
        if (hasOfficialSigning) {
            official {
                storeFile file(officialStoreFile)
                storePassword officialStorePassword
                keyAlias officialKeyAlias
                keyPassword officialKeyPassword
                storeType "PKCS12"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug { }
        release {
            // debuggable nao definido -> default FALSE (release nao-depuravel).
            // PRODUCAO: assinatura OFICIAL exclusiva. Sem Secrets -> signingConfig null e o
            // guard (tasks.configureEach) ABORTA o build release (nunca teste/debug/nao-assinado).
            if (hasOfficialSigning) {
                signingConfig signingConfigs.official
            } else {
                signingConfig null
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // Testes unitários JVM (Robolectric/Roborazzi) precisam dos recursos Android e do
    // modo gráfico NATIVE para renderizar o Compose em PNG real, sem emulador.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                it.systemProperty "robolectric.graphicsMode", "NATIVE"
                it.systemProperty "robolectric.pixelCopyRenderMode", "hardware"
                it.testLogging {
                    events "passed", "failed", "skipped"
                    exceptionFormat "full"
                    showStackTraces true
                    showCauses true
                    showStandardStreams true
                }
            }
        }
    }
}

// ─── F4.2E — GATE de assinatura oficial (fail-closed) ─────────────────────────────
// Sem os Secrets oficiais, QUALQUER empacotamento de release aborta — nunca gera APK/AAB
// nao-assinado nem assinado com chave de teste/debug. Duas camadas:
//  (1) config-time: se o alvo pedido for assemble/bundleRelease, falha ANTES de compilar.
//  (2) execution-time (doFirst): rede de seguranca em qualquer caminho ate o empacotamento.
def _officialSigningError =
    "NO-GO F4.2E: build RELEASE oficial exige os Secrets ANDROID_OFFICIAL_KEYSTORE_B64/_PASSWORD, " +
    "ANDROID_OFFICIAL_KEY_ALIAS/_PASSWORD (decodificados em ANDROID_OFFICIAL_KEYSTORE_FILE). " +
    "Sem fallback para idseven-test.keystore/debug.keystore."
def _releaseTaskNames = ["assemblerelease", "bundlerelease", "packagerelease", "packagereleasebundle"]
def _wantsReleasePackaging = gradle.startParameter.taskNames.any { n ->
    _releaseTaskNames.contains(n.toLowerCase().replaceFirst(/^:?app:/, "").replaceFirst(/^:/, ""))
}
if (_wantsReleasePackaging && !hasOfficialSigning) {
    throw new GradleException(_officialSigningError + " (config-time)")
}
tasks.configureEach { task ->
    if (task.name in ["packageRelease", "packageReleaseBundle", "assembleRelease", "bundleRelease"]) {
        task.doFirst {
            if (!hasOfficialSigning) {
                throw new GradleException(_officialSigningError + " (execution-time)")
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    // Sessão local (DataStore Preferences)
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Firebase Android NATIVO. BoM controla as versões. F4.2C adiciona firebase-auth (Custom Token
    // via issueFirebaseAuthToken) para autenticar o Firestore com request.auth real.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-functions"

    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.8.3"
    implementation "io.coil-kt:coil-compose:2.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // ===== Teste de screenshot do card (JVM, sem emulador) =====
    // Roborazzi renderiza o Compose com Robolectric (graphicsMode NATIVE) -> PNG real.
    testImplementation "junit:junit:4.13.2"
    // F4.2B — org.json REAL no classpath dos testes JVM (o org.json do android.jar e stub/mock);
    // e coroutines-test opcional (usamos runBlocking do core, ja transitivo). So testes; nao vai no APK.
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation platform("androidx.compose:compose-bom:2024.10.01")
    testImplementation "androidx.compose.ui:ui-test-junit4"
    // ui-test-manifest precisa ser debugImplementation: registra a ComponentActivity
    // no MANIFEST do variant debug, que o testDebugUnitTest (Robolectric) usa.
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.30.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.30.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:1.30.1"
}

// Processa app/google-services.json (DEVE ficar no final). F4.2C usa Firebase Auth (Custom Token).
apply plugin: "com.google.gms.google-services"
