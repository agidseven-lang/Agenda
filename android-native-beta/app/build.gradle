apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "br.com.idseven.agenda.nativebeta"
    compileSdk 34

    defaultConfig {
        // App SaaS beta — instala LADO A LADO do app aprovado e do PWA (package distinto).
        applicationId "br.com.idseven.agenda.nativebeta"
        minSdk 26
        targetSdk 34
        versionCode 29
        versionName "1.0.25-beta-chat-immediate-push"
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        // Assinatura de TESTE (debug keystore) p/ gerar release instalável. NÃO usar na Play.
        debugtest {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.debugtest
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    // Sessão local (DataStore Preferences)
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Firebase Android NATIVO (Firestore). BoM controla as versões. NÃO usa Firebase Auth.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-messaging"

    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.8.3"
    implementation "io.coil-kt:coil-compose:2.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
}

// Processa app/google-services.json (DEVE ficar no final). NÃO usa Firebase Auth.
apply plugin: "com.google.gms.google-services"
