apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "br.com.idseven.agenda.nativebeta"
    compileSdk 34

    defaultConfig {
        // App SaaS beta — instala LADO A LADO do app aprovado e do PWA (package distinto).
        applicationId "br.com.idseven.agenda.nativebeta"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-beta-fase0"
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        // Assinatura de TESTE (debug keystore) p/ gerar release instalável. NÃO usar na Play.
        debugtest {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.debugtest
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    debugImplementation "androidx.compose.ui:ui-tooling"
}

// Firebase (Firestore/FCM) entra na Fase 1 — plugin google-services será aplicado então,
// após o package br.com.idseven.agenda.nativebeta ser registrado no projeto Firebase.
