apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "io.github.takahirom.roborazzi"

android {
    namespace "br.com.idseven.agenda.nativebeta"
    compileSdk 34

    defaultConfig {
        // App SaaS beta — instala LADO A LADO do app aprovado e do PWA (package distinto).
        applicationId "br.com.idseven.agenda.nativebeta"
        minSdk 26
        targetSdk 34
        versionCode 109
        versionName "1.0.129-beta-task-flow-tabs-fix"
        vectorDrawables { useSupportLibrary true }

        // URLs reais das Cloud Functions Gen2 sao resolvidas no CI via
        // `gcloud functions describe ... --format=value(serviceConfig.uri)` e
        // injetadas no build por -PPASSWORD_RESET_REQUEST_URL / -P...CONFIRM_URL.
        // Em build local sem essas properties, ficam vazias e o AuthRepo retorna
        // mensagem amigavel + log tecnico em vez de chamar URL presumida.
        def _resetReq = project.findProperty('PASSWORD_RESET_REQUEST_URL') ?: ''
        def _resetCnf = project.findProperty('PASSWORD_RESET_CONFIRM_URL') ?: ''
        buildConfigField "String", "PASSWORD_RESET_REQUEST_URL", "\"${_resetReq}\""
        buildConfigField "String", "PASSWORD_RESET_CONFIRM_URL", "\"${_resetCnf}\""
    }

    signingConfigs {
        // Assinatura de TESTE com keystore FIXO versionado no repo
        // (idseven-test.keystore). Garante o MESMO certificado em todo build
        // (GitLab, GitHub Actions e local) -> APKs sempre atualizaveis entre si.
        // NAO e chave de producao/Play (senha padrao "android").
        debugtest {
            storeFile file("idseven-test.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { }
        release {
            // debuggable nao definido -> default FALSE (release nao-depuravel).
            signingConfig signingConfigs.debugtest
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // Testes unitários JVM (Robolectric/Roborazzi) precisam dos recursos Android e do
    // modo gráfico NATIVE para renderizar o Compose em PNG real, sem emulador.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                it.systemProperty "robolectric.graphicsMode", "NATIVE"
                it.systemProperty "robolectric.pixelCopyRenderMode", "hardware"
                it.testLogging {
                    events "passed", "failed", "skipped"
                    exceptionFormat "full"
                    showStackTraces true
                    showCauses true
                    showStandardStreams true
                }
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    // Sessão local (DataStore Preferences)
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Firebase Android NATIVO (Firestore). BoM controla as versões. NÃO usa Firebase Auth.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-functions"

    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.8.3"
    implementation "io.coil-kt:coil-compose:2.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // ===== Teste de screenshot do card (JVM, sem emulador) =====
    // Roborazzi renderiza o Compose com Robolectric (graphicsMode NATIVE) -> PNG real.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation platform("androidx.compose:compose-bom:2024.10.01")
    testImplementation "androidx.compose.ui:ui-test-junit4"
    // ui-test-manifest precisa ser debugImplementation: registra a ComponentActivity
    // no MANIFEST do variant debug, que o testDebugUnitTest (Robolectric) usa.
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.30.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.30.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:1.30.1"
}

// Processa app/google-services.json (DEVE ficar no final). NÃO usa Firebase Auth.
apply plugin: "com.google.gms.google-services"
