# .gitlab-ci.yml — Build Android Nativo Beta (1.0.14)
# Continuidade enquanto o GitHub está suspenso. NÃO toca PWA, Worker, Firebase web ou schema.
# Pipeline SÓ é criado quando você clicar "Run pipeline" no GitLab (manual only).
# Secret GOOGLE_SERVICES_JSON_BETA vem de CI/CD Variables (File type).

workflow:
  rules:
    # "Run pipeline" na UI (web) continua valido.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Push na branch de trabalho cria pipeline automaticamente (para o deploy das Functions).
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat/android-native-saas"'

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"   # confira em https://developer.android.com/studio
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  APK_OUT: "idseven-nativebeta-1.0.40-beta-password-reset-email-ready.apk"
  APP_DIR: "android-native-beta"

stages:
  - build
  - deploy

cache:
  key: android-beta-v1
  paths:
    - .android-sdk/
    - .gradle/

build_android_beta:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  # Build pesado do APK NAO roda em todo push. Roda em:
  #  - "Run pipeline" (web); OU
  #  - push cujo commit tenha o marcador [build-apk] (gera APK sob demanda,
  #    sem clique e sem buildar em pushes normais; auto-restaura por commit).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat/android-native-saas" && $CI_COMMIT_MESSAGE =~ /\[build-apk\]/'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip curl ca-certificates git
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - |
      if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
        curl -fsSL -o /tmp/cmdtools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"
        unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null
    - mkdir -p ~/.android
    - |
      if [ ! -f ~/.android/debug.keystore ]; then
        keytool -genkeypair -v -keystore ~/.android/debug.keystore \
          -storepass android -keypass android -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
      fi
    # Secret: GOOGLE_SERVICES_JSON_BETA do tipo File -> $GOOGLE_SERVICES_JSON_BETA é o caminho do arquivo
    - |
      if [ -z "$GOOGLE_SERVICES_JSON_BETA" ] || [ ! -f "$GOOGLE_SERVICES_JSON_BETA" ]; then
        echo "ERRO: variavel GOOGLE_SERVICES_JSON_BETA (File) ausente ou inacessivel."
        exit 1
      fi
    - cp "$GOOGLE_SERVICES_JSON_BETA" "$APP_DIR/app/google-services.json"
    - echo "google-services.json gravado ($(wc -c < "$APP_DIR/app/google-services.json") bytes)."
    # CI-only: ajuste de estabilidade para runner pequeno. Apenda override em gradle.properties
    # (Gradle lê top-down, linhas posteriores ganham). Arquivo do repositorio NAO e modificado
    # no commit — so existe dentro do container do job. Nenhum codigo Kotlin/app e alterado.
    - |
      {
        echo ""
        echo "# ---- CI override: estabilidade em runner pequeno (injetado por .gitlab-ci.yml) ----"
        echo "org.gradle.daemon=false"
        echo "org.gradle.parallel=false"
        echo "org.gradle.workers.max=1"
        echo "org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8"
        echo "kotlin.daemon.jvmargs=-Xmx768m"
      } >> "$APP_DIR/gradle.properties"
    - echo "gradle.properties efetivo no CI (tail):" && tail -10 "$APP_DIR/gradle.properties"
    # Limpeza defensiva de daemons remanescentes (no-op em runner novo, util em re-run)
    - pkill -f GradleDaemon 2>/dev/null || true
    - pkill -f aapt2 2>/dev/null || true
  script:
    - cd "$APP_DIR"
    - chmod +x ./gradlew
    - ./gradlew clean assembleRelease --no-daemon --max-workers=1 --no-parallel --stacktrace --info
    - cd "$CI_PROJECT_DIR"
    - cp "$APP_DIR/app/build/outputs/apk/release/app-release.apk" "$APK_OUT"
    - ls -lh "$APK_OUT"
  artifacts:
    name: "idseven-nativebeta-1.0.40-beta-password-reset-email-ready-$CI_COMMIT_SHORT_SHA"
    paths:
      - "$APK_OUT"
    expire_in: 30 days
    when: on_success

# Deploy MANUAL e AUTOSSUFICIENTE das Firebase Functions (push imediato:
# onEventCreated/onTaskCreated). Roda no runner do GitLab. A credencial NUNCA fica
# no codigo: vem da variavel CI/CD GOOGLE_APPLICATION_CREDENTIALS (tipo FILE = caminho
# para o JSON da service account). O job faz um PREFLIGHT profissional via gcloud antes
# do firebase deploy: habilita APIs e aplica os bindings IAM exigidos pelos gatilhos
# Firestore v2 (Eventarc/Pub/Sub/Cloud Run) — tudo idempotente. Imagem google/cloud-sdk
# (tem gcloud); Node 20 e instalado no job para o firebase-tools.
#   Fallback: se so existir FIREBASE_TOKEN, faz deploy sem o preflight gcloud.
deploy_firebase_functions:
  stage: deploy
  image: google/cloud-sdk:slim
  variables:
    GCP_PROJECT: "agenda-id-seven"
    GCP_PROJECT_NUMBER: "391529908613"
  rules:
    # Push na branch de trabalho: roda AUTOMATICAMENTE (sem botao manual).
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat/android-native-saas"'
      when: on_success
    # "Run pipeline" pela UI: continua manual (fallback).
    - if: '$CI_COMMIT_BRANCH == "feat/android-native-saas"'
      when: manual
      allow_failure: true
  script:
    - |
      set -e

      # ---------- Node 20 (firebase-tools precisa de Node; a imagem cloud-sdk traz gcloud) ----------
      if ! command -v node >/dev/null 2>&1; then
        echo ">> Instalando Node 20 (NodeSource)…"
        apt-get update -qq
        apt-get install -y -qq curl ca-certificates gnupg >/dev/null
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y -qq nodejs >/dev/null
      fi
      echo "Ambiente: node $(node -v) | npm $(npm -v) | $(gcloud --version | head -1)"

      # ---------- Fallback FIREBASE_TOKEN (sem credencial File => sem preflight gcloud) ----------
      if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ] || [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
        if [ -n "$FIREBASE_TOKEN" ]; then
          echo ">> Sem GOOGLE_APPLICATION_CREDENTIALS (File); usando FIREBASE_TOKEN. Preflight gcloud IGNORADO."
          npm install -g firebase-tools >/dev/null 2>&1
          ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          firebase deploy --only functions --project "$GCP_PROJECT" --token "$FIREBASE_TOKEN" --non-interactive --force
          exit $?
        fi
        echo "::error:: defina GOOGLE_APPLICATION_CREDENTIALS (File) OU FIREBASE_TOKEN em Settings > CI/CD > Variables."
        exit 1
      fi

      # ---------- Autenticacao gcloud com a MESMA service account (mesma variavel File) ----------
      echo ">> Autenticando gcloud via service account…"
      gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
      gcloud config set project "$GCP_PROJECT" >/dev/null
      echo "Conta ativa: $(gcloud config get-value account 2>/dev/null) | Projeto: $(gcloud config get-value project 2>/dev/null)"

      # ---------- Helpers idempotentes (nao derrubam o job; logam diagnostico claro) ----------
      enable_api() {
        echo ">> enable $1"
        if gcloud services enable "$1" --project "$GCP_PROJECT" 2>/tmp/api.err; then
          echo "   ok ($1)"
        else
          echo "   AVISO: nao habilitou $1 (pode ja estar ativa, ou faltar serviceusage.services.enable na SA):"
          sed 's/^/      /' /tmp/api.err || true
        fi
      }
      bind_iam() {   # $1=member  $2=role  (retry: service agent pode demorar a provisionar)
        member="$1"; role="$2"; tries=0; max=5
        echo ">> IAM binding: $role  ->  $member"
        while : ; do
          if gcloud projects add-iam-policy-binding "$GCP_PROJECT" \
               --member="$member" --role="$role" --condition=None --quiet >/dev/null 2>/tmp/iam.err; then
            echo "   ok (idempotente)"
            return 0
          fi
          tries=$((tries+1))
          if [ "$tries" -ge "$max" ]; then
            echo "   AVISO: binding nao aplicado apos $max tentativas (pode faltar setIamPolicy na SA, ou service agent ainda nao provisionado):"
            sed 's/^/      /' /tmp/iam.err || true
            return 0
          fi
          echo "   tentativa $tries falhou; aguardando 15s (provisionamento/propagacao do service agent)…"
          sleep 15
        done
      }

      # ---------- 1) Habilitar APIs necessarias (idempotente) ----------
      echo "===== Preflight 1/3: habilitar APIs ====="
      for API in \
        cloudbilling.googleapis.com \
        cloudfunctions.googleapis.com \
        cloudbuild.googleapis.com \
        artifactregistry.googleapis.com \
        firebaseextensions.googleapis.com \
        run.googleapis.com \
        eventarc.googleapis.com \
        pubsub.googleapis.com \
        storage.googleapis.com \
        runtimeconfig.googleapis.com ; do
        enable_api "$API"
      done

      # ---------- 2) Esperar provisionamento dos service agents (pubsub etc.) ----------
      echo ">> Aguardando propagacao dos service agents (20s)…"
      sleep 20

      # ---------- 3) Bindings IAM exigidos pelos gatilhos Firestore v2 (idempotente) ----------
      echo "===== Preflight 2/3: IAM bindings ====="
      PUBSUB_SA="serviceAccount:service-${GCP_PROJECT_NUMBER}@gcp-sa-pubsub.iam.gserviceaccount.com"
      EVENTARC_SA="serviceAccount:service-${GCP_PROJECT_NUMBER}@gcp-sa-eventarc.iam.gserviceaccount.com"
      COMPUTE_SA="serviceAccount:${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com"

      # Forca a criacao do P4SA (service agent) do Eventarc/Pub/Sub caso ainda nao exista
      # (best-effort; sem 'beta' nao falha o job). Garante que o binding abaixo tenha alvo.
      gcloud beta services identity create --service=eventarc.googleapis.com --project="$GCP_PROJECT" >/dev/null 2>&1 || true
      gcloud beta services identity create --service=pubsub.googleapis.com   --project="$GCP_PROJECT" >/dev/null 2>&1 || true

      # Papel exigido pelo erro "Permission denied while using the Eventarc Service Agent":
      bind_iam "$EVENTARC_SA" "roles/eventarc.serviceAgent"
      bind_iam "$PUBSUB_SA"   "roles/iam.serviceAccountTokenCreator"
      bind_iam "$COMPUTE_SA"  "roles/run.invoker"
      bind_iam "$COMPUTE_SA"  "roles/eventarc.eventReceiver"

      # ---------- 4) Propagacao IAM antes do deploy ----------
      # 1o deploy de Functions 2nd Gen: a config do Eventarc pode levar alguns minutos
      # para propagar. Esperamos 90s para reduzir falha por propagacao incompleta.
      echo ">> Aguardando propagacao IAM / config 2nd Gen (90s)…"
      sleep 90

      # ---------- 5) firebase-tools + deps das functions ----------
      echo "===== Preflight 3/3: ferramentas ====="
      npm install -g firebase-tools >/dev/null 2>&1
      echo "firebase-tools $(firebase --version)"
      ( cd functions && if [ -f package-lock.json ]; then echo "deps: npm ci"; npm ci; else echo "deps: npm install"; npm install; fi )

      # ---------- 5b) Garantir que o secret RESEND_API_KEY EXISTE no Secret Manager ----------
      # As callables requestPasswordReset/confirmPasswordReset declaram
      # `secrets: [RESEND_API_KEY]`. Se o secret nao existir no projeto,
      # `firebase deploy --only functions` falha em criar essas duas Functions
      # (sem isso, o cliente recebe NOT_FOUND e o app mostra "Nao foi possivel"
      # — exatamente o sintoma da 1.0.39-self-service em producao).
      # Aqui criamos o secret + uma versao PLACEHOLDER para destravar o deploy.
      # O valor real eh configurado depois pelo job setup_password_reset_provider.
      gcloud services enable secretmanager.googleapis.com --project "$GCP_PROJECT" >/dev/null 2>&1 || true
      if gcloud secrets describe RESEND_API_KEY --project="$GCP_PROJECT" >/dev/null 2>&1; then
        echo ">> RESEND_API_KEY secret ja existe."
      else
        echo ">> Criando RESEND_API_KEY (placeholder) para destravar o deploy das callables…"
        gcloud secrets create RESEND_API_KEY --replication-policy=automatic --project="$GCP_PROJECT" >/dev/null 2>/tmp/sm.err || {
          echo "AVISO: nao foi possivel criar RESEND_API_KEY:"; sed 's/^/    /' /tmp/sm.err || true
        }
        if gcloud secrets describe RESEND_API_KEY --project="$GCP_PROJECT" >/dev/null 2>&1; then
          printf 'PLACEHOLDER_NOT_CONFIGURED_RUN_setup_password_reset_provider' \
            | gcloud secrets versions add RESEND_API_KEY --data-file=- --project="$GCP_PROJECT" >/dev/null 2>&1 \
            && echo ">> Placeholder adicionado. Funcao deploya, mas Resend rejeita ate o setup real."
        fi
      fi

      # ---------- 6) Deploy (firebase-tools usa GOOGLE_APPLICATION_CREDENTIALS via ADC) ----------
      # --force: configura automaticamente a cleanup policy do Artifact Registry
      # (us-central1), evitando o aviso pos-deploy. Idempotente em re-execucoes.
      echo "===== Deploy ====="
      firebase deploy --only functions --project "$GCP_PROJECT" --non-interactive --force

      # ---------- 7) Cloud Run invoker publico para as 2 callables ----------
      # Defesa em profundidade: garante que cliente nao-autenticado pode invocar
      # (o app NAO usa Firebase Auth). firebase-tools ja deveria fazer isso para
      # callables, mas idempotencia em re-deploys de Gen2 ajuda.
      for SVC in requestPasswordReset confirmPasswordReset; do
        if gcloud run services describe "$SVC" --region us-central1 --project="$GCP_PROJECT" >/dev/null 2>&1; then
          gcloud run services add-iam-policy-binding "$SVC" \
            --member="allUsers" --role="roles/run.invoker" \
            --region=us-central1 --project="$GCP_PROJECT" --quiet >/dev/null 2>/tmp/inv.err \
            && echo ">> $SVC: invoker publico OK." \
            || { echo "AVISO: nao consegui ajustar invoker de $SVC:"; sed 's/^/    /' /tmp/inv.err || true; }
        else
          echo "AVISO: servico Cloud Run '$SVC' ainda nao existe — provavel deploy falhou."
        fi
      done

# ─────────────────────────────────────────────────────────────────────────────
# AUTOPUBLICA Firestore Rules — adiciona somente o bloco passwordResetRequests
# nas regras de PRODUCAO, preservando todo o resto. NAO substitui o ruleset.
# Dispara automaticamente em PUSH com [deploy-rules] na mensagem do commit.
# Idempotente: se o bloco ja existir, o deploy efetivamente nao muda a release.
# Nao toca PWA / Worker / Cloudflare / Functions / Android / schema.
# Pre-requisito IAM da service account: roles/firebaserules.admin (tenta
# garantir via gcloud — se nao tiver permissao de setIamPolicy, prossegue
# e o deploy falha visivelmente com causa exata no log).
# ─────────────────────────────────────────────────────────────────────────────
deploy_password_reset_firestore_rules_autonomous:
  stage: deploy
  image: google/cloud-sdk:slim
  variables:
    GCP_PROJECT: "agenda-id-seven"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat/android-native-saas" && $CI_COMMIT_MESSAGE =~ /\[deploy-rules\]/'
      when: on_success
  script:
    - |
      set -e
      if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ] || [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
        echo "::error:: GOOGLE_APPLICATION_CREDENTIALS (File) ausente em Settings > CI/CD > Variables."
        exit 1
      fi
      apt-get update -qq
      apt-get install -y -qq jq curl ca-certificates gnupg >/dev/null
      if ! command -v node >/dev/null 2>&1; then
        echo ">> Instalando Node 20…"
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y -qq nodejs >/dev/null
      fi
      echo "Ambiente: node $(node -v) | $(gcloud --version | head -1)"

      # ---------- Auth ----------
      gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
      gcloud config set project "$GCP_PROJECT" >/dev/null
      SA_EMAIL=$(jq -r '.client_email' "$GOOGLE_APPLICATION_CREDENTIALS")
      echo "Conta ativa: $(gcloud config get-value account 2>/dev/null) | SA arquivo: $SA_EMAIL"

      # ---------- APIs (idempotente) ----------
      gcloud services enable firebaserules.googleapis.com --project "$GCP_PROJECT" >/dev/null 2>&1 || true

      # ---------- IAM best-effort (idempotente) ----------
      echo ">> Tentando garantir roles/firebaserules.admin para $SA_EMAIL…"
      if gcloud projects add-iam-policy-binding "$GCP_PROJECT" \
           --member="serviceAccount:$SA_EMAIL" --role="roles/firebaserules.admin" \
           --condition=None --quiet >/dev/null 2>/tmp/iam.err; then
        echo "   ok (idempotente)"
      else
        echo "   AVISO: nao foi possivel aplicar IAM agora (pode ja existir, ou a SA nao tem setIamPolicy). Prossigo:"
        sed 's/^/      /' /tmp/iam.err || true
      fi

      # ---------- 1) Buscar rules de PRODUCAO via Firebase Rules REST ----------
      TOKEN="$(gcloud auth print-access-token)"
      echo ">> Resolvendo release cloud.firestore em $GCP_PROJECT…"
      REL=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
        "https://firebaserules.googleapis.com/v1/projects/${GCP_PROJECT}/releases/cloud.firestore")
      RULESET=$(echo "$REL" | jq -r '.rulesetName')
      if [ -z "$RULESET" ] || [ "$RULESET" = "null" ]; then
        echo "::error:: rulesetName nao encontrado na release cloud.firestore."
        echo "$REL" | head -40
        exit 1
      fi
      echo "Ruleset PROD atual: $RULESET"
      RS=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
        "https://firebaserules.googleapis.com/v1/${RULESET}")
      FILES_COUNT=$(echo "$RS" | jq -r '.source.files | length')
      if [ "$FILES_COUNT" != "1" ]; then
        echo "::error:: esperava 1 arquivo no ruleset; encontrei $FILES_COUNT. Abortando para nao perder regras."
        echo "$RS" | jq '.source.files[]?.name'
        exit 1
      fi
      echo "$RS" | jq -r '.source.files[0].content' > firestore.rules.from-prod
      cp firestore.rules.from-prod "firestore.rules.backup-pre-${CI_COMMIT_SHORT_SHA}"
      echo "Backup salvo: firestore.rules.backup-pre-${CI_COMMIT_SHORT_SHA} ($(wc -l < firestore.rules.from-prod) linhas)"

      # ---------- 2) Patch idempotente (preserva tudo, injeta apenas o bloco) ----------
      # O script Node eh a UNICA fonte de validacao: idempotencia, schema do
      # output (rules_version / service / match /databases), exatamente 1x
      # passwordResetRequests, ausencia de cerca markdown, chaves balanceadas,
      # nao introducao de crases (delta) e zero linhas removidas do input.
      # Falha do script aborta o job (set -e). Nada de validacao duplicada em
      # bash aqui — a tentativa anterior quebrava com "[: 0\n0: integer
      # expression expected" e rejeitava crases legitimas em comentarios.
      echo ">> Aplicando patch passwordResetRequests…"
      node scripts/patch-firestore-password-reset-rules.mjs firestore.rules.from-prod firestore.rules.generated

      # ---------- 3) Diff resumido (apenas para o log do CI) ----------
      echo "===== diff (-u from-prod -> generated) ====="
      diff -u firestore.rules.from-prod firestore.rules.generated || true
      echo "==========================================="

      # ---------- 4) Pre-checagens minimas do generated (existencia + nao-vazio) ----------
      if [ ! -s firestore.rules.generated ]; then
        echo "::error:: firestore.rules.generated ausente ou vazio apos o patch."
        exit 1
      fi

      # ---------- 5) firebase.ci.json temporario apontando para o arquivo gerado ----------
      printf '%s\n' '{"firestore":{"rules":"firestore.rules.generated"}}' > firebase.ci.json
      echo "firebase.ci.json: $(cat firebase.ci.json)"

      # ---------- 6) Deploy via firebase-tools ----------
      npm install -g firebase-tools >/dev/null 2>&1
      echo "firebase-tools $(firebase --version)"
      echo ">> Publicando firestore:rules em $GCP_PROJECT…"
      firebase deploy --only firestore:rules --project "$GCP_PROJECT" --config firebase.ci.json --non-interactive

      # ---------- 7) Confirmar release ----------
      echo ">> Confirmando nova release…"
      NEW=$(curl -fsSL -H "Authorization: Bearer $(gcloud auth print-access-token)" \
        "https://firebaserules.googleapis.com/v1/projects/${GCP_PROJECT}/releases/cloud.firestore")
      echo "$NEW" | jq '{name, rulesetName, updateTime}'
      NEW_RULESET=$(echo "$NEW" | jq -r '.rulesetName')
      if [ "$NEW_RULESET" = "$RULESET" ]; then
        echo "Observacao: ruleset nao mudou ($NEW_RULESET) — patch ja estava presente em prod (idempotente)."
      else
        echo "Sucesso: ruleset $RULESET  ->  $NEW_RULESET"
      fi
  artifacts:
    name: "firestore-rules-autodeploy-$CI_COMMIT_SHORT_SHA"
    paths:
      - "firestore.rules.from-prod"
      - "firestore.rules.generated"
      - "firestore.rules.backup-pre-*"
    expire_in: 90 days
    when: always

# ─────────────────────────────────────────────────────────────────────────────
# SETUP do provedor de e-mail para o reset de senha (Resend).
# Configura SECRET (RESEND_API_KEY) e ENV (RESET_EMAIL_FROM etc.) a partir
# de variaveis PROTEGIDAS do GitLab. Dispara em push com [setup-reset] na
# mensagem do commit. Fail-fast se faltar var critica. Nao expoe segredos.
# Nao toca Android, PWA, Worker, Cloudflare, rules ou chat.
#
# Variaveis (Settings > CI/CD > Variables — Protected + Masked recomendado):
#   - RESEND_API_KEY        (OBRIGATORIO) — API key do painel Resend
#   - RESET_EMAIL_FROM      (OBRIGATORIO) — ex. no-reply@seu-dominio.com.br
#   - RESET_EMAIL_FROM_NAME (opcional, default "ID Seven Agenda")
#   - RESET_EMAIL_PROVIDER  (opcional, default "resend")
# ─────────────────────────────────────────────────────────────────────────────
setup_password_reset_provider:
  stage: deploy
  image: google/cloud-sdk:slim
  variables:
    GCP_PROJECT: "agenda-id-seven"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat/android-native-saas" && $CI_COMMIT_MESSAGE =~ /\[setup-reset\]/'
      when: on_success
  script:
    - |
      set -e

      # ---------- 1) Validacao das variaveis do GitLab ----------
      MISSING=""
      [ -z "$RESEND_API_KEY" ]   && MISSING="$MISSING RESEND_API_KEY"
      [ -z "$RESET_EMAIL_FROM" ] && MISSING="$MISSING RESET_EMAIL_FROM"
      if [ -n "$MISSING" ]; then
        echo "::error:: Falta configurar$MISSING nas variaveis protegidas do GitLab."
        echo "  Settings > CI/CD > Variables: adicione cada uma (Protected, Masked recomendado)."
        echo "  - RESEND_API_KEY        : API key do painel Resend (https://resend.com/api-keys)"
        echo "  - RESET_EMAIL_FROM      : remetente verificado no Resend (ex. no-reply@seu-dominio.com.br)"
        echo "  - RESET_EMAIL_FROM_NAME : opcional, default 'ID Seven Agenda'"
        echo "  - RESET_EMAIL_PROVIDER  : opcional, default 'resend'"
        exit 1
      fi
      if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ] || [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
        echo "::error:: GOOGLE_APPLICATION_CREDENTIALS (File) ausente em Settings > CI/CD > Variables."
        exit 1
      fi

      apt-get update -qq && apt-get install -y -qq curl ca-certificates gnupg >/dev/null
      if ! command -v node >/dev/null 2>&1; then
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y -qq nodejs >/dev/null
      fi

      # ---------- 2) Auth ----------
      gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
      gcloud config set project "$GCP_PROJECT" >/dev/null
      gcloud services enable secretmanager.googleapis.com --project "$GCP_PROJECT" >/dev/null 2>&1 || true

      # ---------- 3) Atualizar SECRET RESEND_API_KEY (cria se nao existir) ----------
      if ! gcloud secrets describe RESEND_API_KEY --project="$GCP_PROJECT" >/dev/null 2>&1; then
        echo ">> Criando secret RESEND_API_KEY…"
        gcloud secrets create RESEND_API_KEY --replication-policy=automatic --project="$GCP_PROJECT" >/dev/null
      fi
      echo ">> Adicionando NOVA versao ao secret RESEND_API_KEY (a anterior fica em historico)…"
      printf '%s' "$RESEND_API_KEY" | gcloud secrets versions add RESEND_API_KEY \
        --data-file=- --project="$GCP_PROJECT" >/dev/null
      echo "   versao mais recente: $(gcloud secrets versions list RESEND_API_KEY --project=$GCP_PROJECT --limit=1 --format='value(name)')"

      # ---------- 4) Conceder acesso a service account das Functions (idempotente) ----------
      # firebase-functions com `secrets: [RESEND_API_KEY]` ja faz binding no deploy,
      # mas garantimos aqui caso o secret tenha sido criado SO agora.
      RUNTIME_SA="serviceAccount:${GCP_PROJECT}@appspot.gserviceaccount.com"
      gcloud secrets add-iam-policy-binding RESEND_API_KEY \
        --member="$RUNTIME_SA" --role="roles/secretmanager.secretAccessor" \
        --project="$GCP_PROJECT" --quiet >/dev/null 2>&1 || true

      # ---------- 5) Escrever .env.agenda-id-seven em functions/ ----------
      # firebase-tools le esse arquivo no deploy e injeta como env vars do
      # process.env da Function. Arquivo NUNCA eh commitado (.gitignore tem .env.*).
      ENV_FILE="functions/.env.${GCP_PROJECT}"
      {
        printf 'RESET_EMAIL_FROM=%s\n' "$RESET_EMAIL_FROM"
        printf 'RESET_EMAIL_FROM_NAME=%s\n' "${RESET_EMAIL_FROM_NAME:-ID Seven Agenda}"
        printf 'RESET_EMAIL_PROVIDER=%s\n' "${RESET_EMAIL_PROVIDER:-resend}"
      } > "$ENV_FILE"
      echo ">> $ENV_FILE gravado:"
      sed -E 's/^(RESET_EMAIL_FROM=.{3}).*/\1***/' "$ENV_FILE"  # mascara local

      # ---------- 6) Re-deploy APENAS das 2 callables ----------
      ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
      npm install -g firebase-tools >/dev/null 2>&1
      echo "firebase-tools $(firebase --version)"
      echo ">> Re-deploy: functions:requestPasswordReset, functions:confirmPasswordReset"
      firebase deploy \
        --only "functions:requestPasswordReset,functions:confirmPasswordReset" \
        --project "$GCP_PROJECT" --non-interactive --force

      # ---------- 7) Defesa em profundidade: invoker publico ----------
      for SVC in requestPasswordReset confirmPasswordReset; do
        if gcloud run services describe "$SVC" --region us-central1 --project="$GCP_PROJECT" >/dev/null 2>&1; then
          gcloud run services add-iam-policy-binding "$SVC" \
            --member="allUsers" --role="roles/run.invoker" \
            --region=us-central1 --project="$GCP_PROJECT" --quiet >/dev/null 2>&1 \
            && echo ">> $SVC: invoker publico OK."
        fi
      done

      # ---------- 8) Limpeza local — NAO deixa segredo em artifact ----------
      rm -f "$ENV_FILE"
      echo ""
      echo "=================================================================="
      echo "OK — Provider de e-mail configurado e callables re-deployadas."
      echo "Teste real:"
      echo "  1) abra o app (1.0.39+ self-service) e toque 'Esqueci minha senha';"
      echo "  2) informe um e-mail cadastrado em users/* e toque 'Enviar codigo';"
      echo "  3) deve chegar um e-mail do Resend com codigo de 6 digitos;"
      echo "  4) informe codigo + nova senha; faca login com a nova senha."
      echo "=================================================================="
  # Sem artifacts neste job — nada de segredo expirando no GitLab.

# ─────────────────────────────────────────────────────────────────────────────
# DIAGNOSTICO REAL do backend de reset de senha. Dispara em push com [test-reset].
# Confirma que as callables existem, que o secret nao eh placeholder, que as
# env vars foram aplicadas, e faz UMA chamada real a requestPasswordReset
# capturando o erro tecnico verdadeiro. Falha com mensagem objetiva e unica.
# NUNCA imprime a RESEND_API_KEY nem o codigo gerado. Nao toca Android/PWA/etc.
# ─────────────────────────────────────────────────────────────────────────────
test_password_reset_backend:
  stage: deploy
  image: google/cloud-sdk:slim
  variables:
    GCP_PROJECT: "agenda-id-seven"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feat/android-native-saas" && $CI_COMMIT_MESSAGE =~ /\[test-reset\]/'
      when: on_success
  script:
    - |
      set -e
      if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ] || [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
        echo "::error:: GOOGLE_APPLICATION_CREDENTIALS (File) ausente."; exit 1
      fi
      apt-get update -qq && apt-get install -y -qq jq curl ca-certificates >/dev/null
      gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
      gcloud config set project "$GCP_PROJECT" >/dev/null
      PLACEHOLDER="PLACEHOLDER_NOT_CONFIGURED_RUN_setup_password_reset_provider"
      FAIL=""

      echo "===== 1) Functions Gen2 existem em us-central1? ====="
      gcloud functions list --gen2 --regions=us-central1 --project="$GCP_PROJECT" \
        --format='table(name,state,serviceConfig.uri)' 2>/dev/null || true
      for FN in requestPasswordReset confirmPasswordReset; do
        if gcloud functions describe "$FN" --gen2 --region=us-central1 --project="$GCP_PROJECT" >/tmp/fn.json 2>/dev/null; then
          STATE=$(gcloud functions describe "$FN" --gen2 --region=us-central1 --project="$GCP_PROJECT" --format='value(state)' 2>/dev/null)
          echo "  $FN: existe (state=$STATE)"
          [ "$STATE" = "ACTIVE" ] || FAIL="$FAIL\n  - $FN nao esta ACTIVE (state=$STATE)"
        else
          echo "  $FN: NAO EXISTE"
          FAIL="$FAIL\n  - Function $FN nao publicada em us-central1 (deploy falhou)."
        fi
      done

      echo "===== 2) Secret RESEND_API_KEY existe, enabled e != placeholder? ====="
      if gcloud secrets describe RESEND_API_KEY --project="$GCP_PROJECT" >/dev/null 2>&1; then
        VER=$(gcloud secrets versions list RESEND_API_KEY --project="$GCP_PROJECT" --filter='state=ENABLED' --limit=1 --format='value(name)' 2>/dev/null)
        if [ -z "$VER" ]; then
          echo "  secret existe, mas SEM versao ENABLED."
          FAIL="$FAIL\n  - RESEND_API_KEY sem versao habilitada."
        else
          echo "  secret RESEND_API_KEY: versao enabled = $VER"
          # Le o valor SO para comparar com o placeholder; nunca imprime o valor.
          if gcloud secrets versions access latest --secret=RESEND_API_KEY --project="$GCP_PROJECT" >/tmp/key 2>/dev/null; then
            if [ "$(cat /tmp/key)" = "$PLACEHOLDER" ]; then
              echo "  valor = PLACEHOLDER (setup real nao rodou)."
              FAIL="$FAIL\n  - RESEND_API_KEY ainda eh PLACEHOLDER. Rode setup_password_reset_provider com a key real."
            else
              echo "  valor real configurado (len=$(wc -c < /tmp/key) bytes)."
            fi
            shred -u /tmp/key 2>/dev/null || rm -f /tmp/key
          else
            echo "  (SA do CI nao tem acesso de leitura ao secret — ok; sera lido em runtime pela SA das Functions)"
          fi
        fi
      else
        echo "  secret RESEND_API_KEY NAO existe."
        FAIL="$FAIL\n  - RESEND_API_KEY ausente no Secret Manager."
      fi

      echo "===== 3) Env vars aplicadas na requestPasswordReset? ====="
      if gcloud functions describe requestPasswordReset --gen2 --region=us-central1 --project="$GCP_PROJECT" \
           --format='json(serviceConfig.environmentVariables)' >/tmp/env.json 2>/dev/null; then
        FROM=$(jq -r '.serviceConfig.environmentVariables.RESET_EMAIL_FROM // empty' /tmp/env.json)
        PROV=$(jq -r '.serviceConfig.environmentVariables.RESET_EMAIL_PROVIDER // empty' /tmp/env.json)
        NAME=$(jq -r '.serviceConfig.environmentVariables.RESET_EMAIL_FROM_NAME // empty' /tmp/env.json)
        echo "  RESET_EMAIL_FROM=${FROM:-(vazio)} | RESET_EMAIL_PROVIDER=${PROV:-(vazio)} | RESET_EMAIL_FROM_NAME=${NAME:-(vazio)}"
        [ -n "$FROM" ] || FAIL="$FAIL\n  - RESET_EMAIL_FROM nao aplicado na Function (rode setup_password_reset_provider)."
      else
        echo "  (nao consegui ler env vars — Function pode nao existir)"
      fi

      echo "===== 4) Invoker publico (allUsers) nas callables? ====="
      for SVC in requestPasswordReset confirmPasswordReset; do
        if gcloud run services get-iam-policy "$SVC" --region=us-central1 --project="$GCP_PROJECT" --format='value(bindings.members)' 2>/dev/null | grep -q allUsers; then
          echo "  $SVC: allUsers OK"
        else
          echo "  $SVC: SEM allUsers invoker"
          FAIL="$FAIL\n  - $SVC sem 'allUsers' run.invoker (app sem Firebase Auth recebe UNAUTHENTICATED). Pode ser org policy iam.allowedPolicyMemberDomains bloqueando allUsers."
        fi
      done

      echo "===== 5) Chamada REAL a requestPasswordReset (protocolo callable) ====="
      TEST_EMAIL="${PASSWORD_RESET_TEST_EMAIL:-idseven@idseven.com.br}"
      URI=$(gcloud functions describe requestPasswordReset --gen2 --region=us-central1 --project="$GCP_PROJECT" --format='value(serviceConfig.uri)' 2>/dev/null || true)
      if [ -n "$URI" ]; then
        echo "  POST $URI (email de teste mascarado)"
        # Identity token autentica o invoker IAM; o wrapper callable trata como
        # chamada nao-autenticada do ponto de vista do Firebase Auth (ok).
        IDTOKEN=$(gcloud auth print-identity-token 2>/dev/null || true)
        HTTP=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$URI" \
          -H "Authorization: Bearer $IDTOKEN" \
          -H "Content-Type: application/json" \
          --data "{\"data\":{\"email\":\"$TEST_EMAIL\"}}" || echo "000")
        echo "  HTTP=$HTTP"
        echo "  corpo:"; jq '.' /tmp/resp.json 2>/dev/null | sed 's/^/    /' || sed 's/^/    /' /tmp/resp.json
        if [ "$HTTP" = "200" ] && jq -e '.result.ok == true' /tmp/resp.json >/dev/null 2>&1; then
          echo "  -> Function respondeu {ok:true} (caminho generico OK)."
        else
          echo "  -> Function NAO retornou 200/{ok:true}."
          FAIL="$FAIL\n  - Chamada real retornou HTTP=$HTTP (veja corpo acima: NOT_FOUND/UNAUTHENTICATED/INTERNAL?)."
        fi
      else
        echo "  (sem URI — Function nao publicada)"
        FAIL="$FAIL\n  - requestPasswordReset sem URI (nao publicada)."
      fi

      echo "===== 6) Logs recentes (sem segredo) ====="
      gcloud functions logs read requestPasswordReset --gen2 --region=us-central1 --project="$GCP_PROJECT" --limit=20 2>/dev/null \
        | grep -iE 'password-reset:|error|resend' | sed 's/^/    /' | head -20 || echo "    (sem logs ou sem permissao de leitura de logs)"

      echo ""
      if [ -n "$FAIL" ]; then
        echo "::error:: DIAGNOSTICO DO RESET FALHOU. Causa(s):"
        printf "%b\n" "$FAIL"
        echo ""
        echo "Acoes:"
        echo "  * placeholder/secret/env ausente -> push com [setup-reset] (vars protegidas no GitLab)."
        echo "  * sem allUsers invoker -> checar org policy iam.allowedPolicyMemberDomains."
        echo "  * dominio nao verificado no Resend -> verifique o dominio do RESET_EMAIL_FROM no painel Resend."
        exit 1
      fi
      echo "OK — backend de reset operacional. Verifique a caixa de $TEST_EMAIL para o codigo real."
  # Sem artifacts — evita expor qualquer resposta com dado sensivel.
