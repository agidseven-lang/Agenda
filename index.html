<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ID Seven">
<meta name="mobile-web-app-capable" content="yes">
<title>Agenda ID Seven</title>
<style>
  :root{
    --bg:#0b0c0f; --bg-2:#111319; --surface:#15171e; --surface-2:#1c1f28;
    --line:#262a35; --line-soft:#1e212a;
    --ink:#f3f4ef; --ink-soft:#9a9da9; --ink-faint:#62646f;
    --accent:#d8ff3e; --accent-ink:#13160a;
    --c-grav:#ff5a4d; --c-foto:#ffb02e; --c-reuni:#4d9fff;
    --c-trafego:#36d399; --c-edicao:#b072ff; --c-outro:#8a8a96;
    --radius:18px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 520px at 88% -12%,rgba(216,255,62,.07),transparent 60%),
    radial-gradient(720px 600px at -12% 112%,rgba(77,159,255,.05),transparent 55%)}
  #app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
  .hidden{display:none!important}
  button,input,textarea,select{font-family:inherit}

  header{padding:calc(var(--st) + 18px) 20px 12px;flex-shrink:0}
  .hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .hbrand{display:flex;align-items:center;gap:11px}
  .hbrand .mk{width:34px;height:34px;border-radius:10px;background:var(--accent);
    display:grid;place-items:center;flex-shrink:0;
    box-shadow:0 0 0 1px rgba(216,255,62,.3),0 8px 22px -8px rgba(216,255,62,.5)}
  .hbrand .mk svg{width:18px;height:18px}
  .hbrand h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .hbrand h1 b{color:var(--accent)}
  .hbrand .sub{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:1px}
  .hbtns{display:flex;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;
    cursor:pointer;transition:.18s}
  .icon-btn:active{transform:scale(.92);background:var(--surface-2)}
  .icon-btn svg{width:18px;height:18px}

  .month-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .mt{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1;text-transform:capitalize}
  .mt span{color:var(--ink-faint);font-weight:700}
  .navg{display:flex;gap:8px;align-items:center}
  .pill{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-size:12px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.16s}
  .pill:active{transform:scale(.95)}
  .arrows{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .arrows button{width:36px;height:34px;background:none;border:none;color:var(--ink-soft);
    display:grid;place-items:center;cursor:pointer;transition:.15s}
  .arrows button:active{background:var(--surface-2)}
  .arrows button:first-child{border-right:1px solid var(--line)}
  .arrows svg{width:15px;height:15px}
  .switch{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    padding:4px;border-radius:13px;margin-top:16px}
  .switch button{flex:1;background:none;border:none;color:var(--ink-soft);font-size:12.5px;
    font-weight:700;padding:9px;border-radius:9px;cursor:pointer;transition:.2s}
  .switch button.on{background:var(--ink);color:var(--bg)}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 130px;-webkit-overflow-scrolling:touch}
  main::-webkit-scrollbar{width:0}

  .search-wrap{margin:14px 0 2px;display:none}
  .search-wrap.on{display:block}
  .search-wrap input{width:100%;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;padding:13px 15px;color:var(--ink);font-size:14px;outline:none}
  .search-wrap input:focus{border-color:var(--accent)}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);font-size:11.5px;font-weight:700;
    padding:7px 12px;border-radius:999px;cursor:pointer;transition:.16s;white-space:nowrap}
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .chip.on{background:var(--ink);color:var(--bg)}
  .chip:active{transform:scale(.95)}

  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);margin:8px 0 6px}
  .cal-head div{text-align:center;font-size:10px;font-weight:800;color:var(--ink-faint);letter-spacing:.06em}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{aspect-ratio:1/1.06;border-radius:13px;border:1px solid transparent;background:var(--surface);
    display:flex;flex-direction:column;align-items:center;padding-top:8px;cursor:pointer;
    transition:.15s;position:relative}
  .cell.dim{background:transparent;border-color:var(--line-soft)}
  .cell.dim .num{opacity:.45}
  .cell:active{transform:scale(.94)}
  .cell .num{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .cell.today{background:var(--accent)}
  .cell.today .num{color:var(--accent-ink);font-weight:800}
  .cell.sel{border-color:var(--ink)}
  .dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;justify-content:center;max-width:80%}
  .dots i{width:5px;height:5px;border-radius:50%}
  .cell .more{font-size:8px;color:var(--ink-faint);position:absolute;bottom:5px}
  .cell.today .more{color:var(--accent-ink)}

  .day-panel{margin-top:22px}
  .dph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
  .dph h3{font-size:15px;font-weight:800;text-transform:capitalize}
  .dph .cnt{font-size:12px;color:var(--ink-faint);font-weight:700}

  .group{margin-top:24px}.group:first-child{margin-top:8px}
  .glabel{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .glabel .d{font-size:13px;font-weight:800;text-transform:capitalize}
  .glabel .dd{font-size:11.5px;color:var(--ink-faint);font-weight:700}
  .glabel.tdy .d{color:var(--accent)}
  .glabel .ln{flex:1;height:1px;background:var(--line-soft)}

  .ev{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 15px;margin-bottom:9px;cursor:pointer;
    transition:.16s;position:relative;overflow:hidden}
  .ev:active{transform:scale(.985);background:var(--surface-2)}
  .ev.done{opacity:.55}
  .ev.done .tt{text-decoration:line-through}
  .ev .bar{width:3px;border-radius:3px;flex-shrink:0}
  .ev .tm{display:flex;flex-direction:column;min-width:46px;flex-shrink:0}
  .ev .tm .t1{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .ev .tm .t2{font-size:10.5px;color:var(--ink-faint);font-weight:700;margin-top:2px}
  .ev .bd{flex:1;min-width:0}
  .ev .tt{font-size:14.5px;font-weight:700;line-height:1.3;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
  .ev .mt2{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
  .ev .tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
  .ev .inf{font-size:11px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:4px}
  .ev .inf svg{width:11px;height:11px;opacity:.7}
  .ev .dchk{position:absolute;top:13px;right:13px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--line);display:grid;place-items:center}
  .ev.done .dchk{background:var(--c-trafego);border-color:var(--c-trafego)}
  .ev.done .dchk svg{display:block}
  .ev .dchk svg{width:11px;height:11px;display:none;color:#0b0c0f}

  .empty{text-align:center;padding:46px 20px;color:var(--ink-faint)}
  .empty .ic{width:58px;height:58px;border-radius:17px;background:var(--surface);
    border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px}
  .empty .ic svg{width:25px;height:25px;color:var(--ink-faint)}
  .empty p{font-size:14px;font-weight:700;color:var(--ink-soft)}
  .empty span{font-size:12.5px;display:block;margin-top:5px}

  .stat-strip{display:flex;gap:9px;margin-top:16px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .stat .n{font-size:21px;font-weight:800;letter-spacing:-.03em}
  .stat .l{font-size:10px;color:var(--ink-faint);font-weight:700;margin-top:3px;
    text-transform:uppercase;letter-spacing:.04em}
  .stat.acc{background:var(--accent);border-color:var(--accent)}
  .stat.acc .n,.stat.acc .l{color:var(--accent-ink)}

  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:14px 20px calc(14px + var(--sb));
    background:linear-gradient(to top,var(--bg) 55%,transparent);
    max-width:520px;margin:0 auto;pointer-events:none}
  .fab{pointer-events:auto;width:100%;height:54px;border:none;border-radius:16px;
    background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:800;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 14px 30px -10px rgba(216,255,62,.5);transition:.16s;letter-spacing:-.01em}
  .fab:active{transform:scale(.97)}
  .fab svg{width:19px;height:19px}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;opacity:0;
    pointer-events:none;transition:.25s;backdrop-filter:blur(3px)}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg-2);
    border-radius:26px 26px 0 0;border-top:1px solid var(--line);max-width:520px;margin:0 auto;
    max-height:92vh;display:flex;flex-direction:column;transform:translateY(110%);
    transition:transform .32s cubic-bezier(.22,1,.36,1);padding-bottom:var(--sb)}
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:11px auto 4px;flex-shrink:0}
  .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 16px;flex-shrink:0}
  .sh h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .sbody{overflow-y:auto;padding:0 20px 20px;-webkit-overflow-scrolling:touch}
  .sbody::-webkit-scrollbar{width:0}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:11px;font-weight:700;color:var(--ink-faint);
    margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
  .fld input,.fld textarea{width:100%;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;padding:14px 15px;color:var(--ink);font-size:15px;outline:none;transition:.16s}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent);background:var(--surface-2)}
  .fld input::placeholder,.fld textarea::placeholder{color:var(--ink-faint)}
  .fld textarea{resize:none;min-height:74px;line-height:1.5}
  .r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .topt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 6px;
    cursor:pointer;text-align:center;transition:.15s}
  .topt:active{transform:scale(.94)}
  .topt .td{width:9px;height:9px;border-radius:50%;margin:0 auto 6px}
  .topt span{font-size:10.5px;font-weight:700;color:var(--ink-soft)}
  .topt.on{border-color:var(--ink);background:var(--surface-2)}
  .topt.on span{color:var(--ink)}
  .sfoot{display:flex;gap:10px;padding:16px 20px calc(20px + var(--sb));
    border-top:1px solid var(--line-soft);flex-shrink:0;background:var(--bg-2)}
  .btn{flex:1;height:50px;border-radius:14px;font-size:14.5px;font-weight:800;cursor:pointer;
    border:none;transition:.16s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);flex:0 0 auto;width:54px}
  .btn-ghost svg{width:18px;height:18px}

  .detail .dt-type{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
    padding:5px 11px;border-radius:8px;margin-bottom:14px}
  .detail h2.dtt{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:18px}
  .dt-list{display:flex;flex-direction:column}
  .dti{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
  .dti:last-child{border-bottom:none}
  .dti .ic2{width:34px;height:34px;border-radius:10px;background:var(--surface);
    display:grid;place-items:center;flex-shrink:0;border:1px solid var(--line)}
  .dti .ic2 svg{width:16px;height:16px;color:var(--ink-soft)}
  .dti .tx .l{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:3px}
  .dti .tx .v{font-size:14.5px;font-weight:600;line-height:1.45}
  .done-toggle{width:100%;margin-top:18px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);font-size:13.5px;font-weight:800;padding:14px;border-radius:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px}
  .done-toggle svg{width:17px;height:17px}
  .done-toggle.is-done{background:rgba(54,211,153,.12);border-color:rgba(54,211,153,.3);color:var(--c-trafego)}

  .set-item{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;
    cursor:pointer;transition:.16s;width:100%;text-align:left;color:var(--ink)}
  .set-item:active{transform:scale(.985);background:var(--surface-2)}
  .set-item .si{width:38px;height:38px;border-radius:11px;background:var(--bg-2);
    border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
  .set-item .si svg{width:18px;height:18px;color:var(--accent)}
  .set-item .st-tx{flex:1}
  .set-item .st-tx .l{font-size:14px;font-weight:700}
  .set-item .st-tx .d{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-top:3px;line-height:1.4}
  .set-item .arr{color:var(--ink-faint)}
  .set-item .arr svg{width:16px;height:16px}
  .set-note{font-size:11.5px;color:var(--ink-faint);line-height:1.6;margin-top:14px;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:13px 15px}

  .toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translate(-50%,20px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:12px 20px;
    border-radius:13px;z-index:80;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;
    box-shadow:0 12px 28px -10px rgba(0,0,0,.5);max-width:90%}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp .35s ease both}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="hbrand">
        <div class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3v3M17 3v3M3.5 9h17M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" stroke="#13160a" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div><h1>Agenda <b>ID Seven</b></h1><div class="sub">sua agenda criativa</div></div>
      </div>
      <div class="hbtns">
        <button class="icon-btn" id="searchToggle"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="icon-btn" id="setBtn"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1c.6.5 1.3.9 2 1.2L10 21h4l.5-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="month-row">
      <div class="mt" id="monthTitle">—</div>
      <div class="navg">
        <button class="pill" id="todayBtn">Hoje</button>
        <div class="arrows">
          <button id="prevBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="nextBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
    </div>
    <div class="switch">
      <button id="vMonth" class="on">Mês</button>
      <button id="vAgenda">Agenda</button>
    </div>
  </header>

  <main id="main">
    <div class="search-wrap" id="searchWrap">
      <input id="searchInput" placeholder="Buscar por cliente, serviço ou local…">
    </div>
    <div id="content"></div>
  </main>

  <div class="bottom">
    <button class="fab" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      Novo compromisso
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="formSheet">
  <div class="grab"></div>
  <div class="sh"><h2 id="formTitle">Novo compromisso</h2>
    <button class="icon-btn" id="formClose"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <div class="sbody">
    <div class="fld"><label>Tipo de serviço</label><div class="type-grid" id="typeGrid"></div></div>
    <div class="fld"><label>Nome do cliente / empresa</label><input id="fClient" placeholder="Ex.: Loja Aurora"></div>
    <div class="fld"><label>Título / descrição do serviço</label><input id="fTitle" placeholder="Ex.: Gravação de reels institucional"></div>
    <div class="fld"><label>Local do serviço</label><input id="fLoc" placeholder="Estúdio, endereço ou link da call"></div>
    <div class="fld"><label>Data</label><input id="fDate" type="date"></div>
    <div class="fld"><div class="r2">
      <div><label style="display:block;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase">Início</label><input id="fStart" type="time"></div>
      <div><label style="display:block;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase">Término</label><input id="fEnd" type="time"></div>
    </div></div>
    <div class="fld"><label>Responsável / Equipe</label><input id="fOwner" placeholder="Quem executa o serviço"></div>
    <div class="fld"><label>Observações</label><textarea id="fNotes" placeholder="Roteiro, equipamentos, briefing…"></textarea></div>
  </div>
  <div class="sfoot">
    <button class="btn btn-ghost" id="delBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn btn-primary" id="saveBtn">Salvar</button>
  </div>
</div>

<div class="sheet" id="detailSheet">
  <div class="grab"></div>
  <div class="sh"><h2>Detalhes</h2>
    <button class="icon-btn" id="detailClose"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <div class="sbody detail" id="detailBody"></div>
  <div class="sfoot">
    <button class="btn btn-ghost" id="detailDel"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn btn-primary" id="detailEdit">Reagendar / Editar</button>
  </div>
</div>

<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <div class="sh"><h2>Ajustes & Backup</h2>
    <button class="icon-btn" id="setClose"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <div class="sbody">
    <button class="set-item" id="exportBtn">
      <div class="si"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="st-tx"><div class="l">Fazer backup</div><div class="d">Baixa um arquivo com toda a sua agenda. Guarde em local seguro.</div></div>
      <div class="arr"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    </button>
    <button class="set-item" id="importBtn">
      <div class="si"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15V3m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="st-tx"><div class="l">Restaurar backup</div><div class="d">Carrega uma agenda salva de um arquivo de backup.</div></div>
      <div class="arr"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    </button>
    <input id="importInput" type="file" accept="application/json,.json" class="hidden">
    <button class="set-item" id="wipeBtn" style="margin-top:18px">
      <div class="si" style="border-color:rgba(255,90,77,.3)"><svg viewBox="0 0 24 24" fill="none" style="color:#ff8c83"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="st-tx"><div class="l" style="color:#ff8c83">Apagar tudo</div><div class="d">Remove todos os compromissos deste aparelho.</div></div>
    </button>
    <div class="set-note">Os dados ficam salvos apenas neste aparelho. Faça backup de vez em quando para não perder sua agenda caso troque de celular ou limpe o navegador.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S={
  KEY:"idseven_agenda_v1",
  async load(){
    try{ if(window.storage){ const r=await window.storage.get(this.KEY,false); return r?JSON.parse(r.value):[]; } }catch(e){}
    try{ const v=localStorage.getItem(this.KEY); return v?JSON.parse(v):[]; }catch(e){ return []; }
  },
  async save(d){
    const s=JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(this.KEY,s,false); return; } }catch(e){}
    try{ localStorage.setItem(this.KEY,s); }catch(e){}
  }
};
const TYPES={
  gravacao:{label:"Gravação",color:"var(--c-grav)"},
  foto:{label:"Fotografia",color:"var(--c-foto)"},
  reuniao:{label:"Reunião",color:"var(--c-reuni)"},
  trafego:{label:"Tráfego pago",color:"var(--c-trafego)"},
  edicao:{label:"Edição",color:"var(--c-edicao)"},
  outro:{label:"Outro",color:"var(--c-outro)"}
};
const RGBA={"var(--c-grav)":"rgba(255,90,77,.16)","var(--c-foto)":"rgba(255,176,46,.16)",
  "var(--c-reuni)":"rgba(77,159,255,.16)","var(--c-trafego)":"rgba(54,211,153,.16)",
  "var(--c-edicao)":"rgba(176,114,255,.16)","var(--c-outro)":"rgba(138,138,150,.16)"};

let events=[],view="month",cursor=new Date(),selDay=todayISO(),filter="all",editingId=null,detailId=null,searchTerm="";

function todayISO(){return iso(new Date());}
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
function parseISO(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
const MO=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DW=["dom","seg","ter","qua","qui","sex","sáb"];
const DWF=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function dayLabel(s){const t=todayISO();if(s===t)return"Hoje";
  const a=new Date();a.setDate(a.getDate()+1);if(s===iso(a))return"Amanhã";
  const b=new Date();b.setDate(b.getDate()-1);if(s===iso(b))return"Ontem";
  return DWF[parseISO(s).getDay()];}
function dayShort(s){const d=parseISO(s);return d.getDate()+" de "+MO[d.getMonth()];}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2400);}

function render(){
  document.getElementById("monthTitle").innerHTML=
    MO[cursor.getMonth()].replace(/^./,x=>x.toUpperCase())+" <span>"+cursor.getFullYear()+"</span>";
  document.getElementById("vMonth").classList.toggle("on",view==="month");
  document.getElementById("vAgenda").classList.toggle("on",view==="agenda");
  const c=document.getElementById("content");
  c.className="";void c.offsetWidth;c.className="fade";
  c.innerHTML=renderFilters()+(view==="month"?renderMonth():renderAgenda());
  bind();
}
function renderFilters(){
  let h='<div class="filters"><button class="chip '+(filter==="all"?"on":"")+'" data-f="all">Todos</button>';
  for(const k in TYPES)h+='<button class="chip '+(filter===k?"on":"")+'" data-f="'+k+'"><span class="dot" style="background:'+TYPES[k].color+'"></span>'+TYPES[k].label+'</button>';
  return h+'</div>';
}
function visible(){
  return events.filter(e=>{
    if(filter!=="all"&&e.type!==filter)return false;
    if(searchTerm){const s=searchTerm.toLowerCase();
      if(!((e.client||"").toLowerCase().includes(s)||(e.title||"").toLowerCase().includes(s)||
           (e.location||"").toLowerCase().includes(s)||(e.owner||"").toLowerCase().includes(s)))return false;}
    return true;
  });
}
function renderMonth(){
  const y=cursor.getFullYear(),m=cursor.getMonth();
  const sd=new Date(y,m,1).getDay(),dn=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate();
  const by={};visible().forEach(e=>{(by[e.date]=by[e.date]||[]).push(e);});
  let h='<div class="cal-head">'+DW.map(d=>'<div>'+d.toUpperCase()+'</div>').join("")+'</div><div class="cal-grid">';
  for(let i=0;i<sd;i++)h+='<div class="cell dim"><span class="num">'+(pd-sd+i+1)+'</span></div>';
  for(let d=1;d<=dn;d++){
    const ds=iso(new Date(y,m,d)),li=(by[ds]||[]).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    const iT=ds===todayISO(),iS=ds===selDay;let dots="";
    li.slice(0,4).forEach(e=>dots+='<i style="background:'+TYPES[e.type].color+'"></i>');
    h+='<div class="cell '+(iT?"today":"")+' '+(iS&&!iT?"sel":"")+'" data-day="'+ds+'"><span class="num">'+d+'</span><div class="dots">'+dots+'</div>'+(li.length>4?'<span class="more">+'+(li.length-4)+'</span>':"")+'</div>';
  }
  const tot=sd+dn,rest=(7-tot%7)%7;
  for(let i=1;i<=rest;i++)h+='<div class="cell dim"><span class="num">'+i+'</span></div>';
  h+='</div>';
  const li=(by[selDay]||[]).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  h+='<div class="day-panel"><div class="dph"><h3>'+dayLabel(selDay)+' · '+dayShort(selDay)+'</h3><span class="cnt">'+li.length+(li.length===1?" item":" itens")+'</span></div>';
  h+= li.length? li.map(evCard).join("") :
    '<div class="empty"><div class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><p>Dia livre</p><span>Toque em “Novo compromisso” para agendar</span></div>';
  return h+'</div>';
}
function renderAgenda(){
  const evs=visible().sort((a,b)=>a.date===b.date?(a.start||"").localeCompare(b.start||""):a.date.localeCompare(b.date));
  const t0=new Date(todayISO()),we=new Date();we.setDate(we.getDate()+7);
  const wk=events.filter(e=>{const d=parseISO(e.date);return d>=t0&&d<=we;});
  const up=events.filter(e=>e.date>=todayISO()&&!e.done);
  let h='<div class="stat-strip"><div class="stat acc"><div class="n">'+wk.length+'</div><div class="l">Próx. 7 dias</div></div><div class="stat"><div class="n">'+up.length+'</div><div class="l">Em aberto</div></div><div class="stat"><div class="n">'+events.length+'</div><div class="l">Total</div></div></div>';
  if(!evs.length)return h+'<div class="empty" style="padding-top:54px"><div class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><p>'+(searchTerm?"Nada encontrado":"Nenhum compromisso ainda")+'</p><span>'+(searchTerm?"Tente outra busca":"Crie o primeiro no botão “Novo compromisso”")+'</span></div>';
  const g={};evs.forEach(e=>{(g[e.date]=g[e.date]||[]).push(e);});
  Object.keys(g).sort().forEach(d=>{
    const iT=d===todayISO();
    h+='<div class="group"><div class="glabel '+(iT?"tdy":"")+'"><span class="d">'+dayLabel(d)+'</span><span class="dd">'+dayShort(d)+'</span><span class="ln"></span></div>'+g[d].map(evCard).join("")+'</div>';
  });
  return h;
}
function evCard(e){
  const t=TYPES[e.type]||TYPES.outro;
  return '<div class="ev '+(e.done?"done":"")+'" data-id="'+e.id+'"><div class="bar" style="background:'+t.color+'"></div><div class="tm"><span class="t1">'+(e.start||"--:--")+'</span>'+(e.end?'<span class="t2">'+e.end+'</span>':"")+'</div><div class="bd"><div class="tt">'+(esc(e.title)||esc(e.client)||"Sem título")+'</div><div class="mt2"><span class="tag" style="background:'+RGBA[t.color]+';color:'+t.color+'">'+t.label+'</span>'+(e.client?'<span class="inf"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'+esc(e.client)+'</span>':"")+(e.location?'<span class="inf"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/></svg>'+esc(e.location)+'</span>':"")+'</div></div><div class="dchk"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>';
}
function bind(){
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
  document.querySelectorAll(".cell[data-day]").forEach(c=>c.onclick=()=>{selDay=c.dataset.day;render();});
  document.querySelectorAll(".ev[data-id]").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

const scrim=document.getElementById("scrim");
const formSheet=document.getElementById("formSheet");
const detailSheet=document.getElementById("detailSheet");
const setSheet=document.getElementById("setSheet");
function openSheet(s){scrim.classList.add("open");s.classList.add("open");}
function closeSheets(){scrim.classList.remove("open");formSheet.classList.remove("open");detailSheet.classList.remove("open");setSheet.classList.remove("open");}
scrim.onclick=closeSheets;
document.getElementById("formClose").onclick=closeSheets;
document.getElementById("detailClose").onclick=closeSheets;
document.getElementById("setClose").onclick=closeSheets;

let selType="gravacao";
function buildTypeGrid(){
  const g=document.getElementById("typeGrid");g.innerHTML="";
  for(const k in TYPES){
    const o=document.createElement("div");
    o.className="topt"+(k===selType?" on":"");
    o.innerHTML='<div class="td" style="background:'+TYPES[k].color+'"></div><span>'+TYPES[k].label+'</span>';
    o.onclick=()=>{selType=k;buildTypeGrid();};
    g.appendChild(o);
  }
}
function openForm(ev){
  editingId=ev?ev.id:null;
  document.getElementById("formTitle").textContent=ev?"Reagendar / Editar":"Novo compromisso";
  document.getElementById("delBtn").style.display=ev?"block":"none";
  selType=ev?ev.type:"gravacao";buildTypeGrid();
  st("fClient",ev?.client);st("fTitle",ev?.title);st("fLoc",ev?.location);
  st("fDate",ev?.date||selDay||todayISO());st("fStart",ev?.start||"09:00");
  st("fEnd",ev?.end||"");st("fOwner",ev?.owner);st("fNotes",ev?.notes);
  openSheet(formSheet);
}
function st(id,val){document.getElementById(id).value=val||"";}
function gv(id){return document.getElementById(id).value.trim();}
document.getElementById("addBtn").onclick=()=>openForm(null);

document.getElementById("saveBtn").onclick=async()=>{
  const client=gv("fClient"),date=document.getElementById("fDate").value;
  if(!client){toast("Informe o cliente / empresa");return;}
  if(!date){toast("Escolha a data");return;}
  const data={id:editingId||("e"+Date.now()+Math.random().toString(36).slice(2,5)),
    type:selType,client,title:gv("fTitle"),location:gv("fLoc"),date,
    start:document.getElementById("fStart").value,end:document.getElementById("fEnd").value,
    owner:gv("fOwner"),notes:gv("fNotes"),
    done:editingId?(events.find(e=>e.id===editingId)?.done||false):false};
  if(editingId){const i=events.findIndex(e=>e.id===editingId);if(i>-1)events[i]=data;toast("Compromisso atualizado");}
  else{events.push(data);toast("Compromisso criado");}
  selDay=date;await S.save(events);closeSheets();render();
};
document.getElementById("delBtn").onclick=async()=>{
  if(!editingId||!confirm("Excluir este compromisso?"))return;
  events=events.filter(e=>e.id!==editingId);await S.save(events);
  toast("Compromisso excluído");closeSheets();render();
};

function openDetail(id){
  const e=events.find(x=>x.id===id);if(!e)return;detailId=id;
  const t=TYPES[e.type]||TYPES.outro;
  const di=(svg,l,val)=>val?'<div class="dti"><div class="ic2"><svg viewBox="0 0 24 24" fill="none">'+svg+'</svg></div><div class="tx"><div class="l">'+l+'</div><div class="v">'+esc(val)+'</div></div></div>':"";
  const tt=e.start?(e.end?e.start+" — "+e.end:e.start):"—";
  const dd=dayLabel(e.date)+" · "+dayShort(e.date)+", "+parseISO(e.date).getFullYear();
  document.getElementById("detailBody").innerHTML=
    '<span class="dt-type" style="background:'+RGBA[t.color]+';color:'+t.color+'"><span style="width:7px;height:7px;border-radius:50%;background:'+t.color+';display:inline-block"></span>'+t.label+'</span>'+
    '<h2 class="dtt">'+(esc(e.title)||esc(e.client)||"Sem título")+'</h2><div class="dt-list">'+
    di('<circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',"Cliente / Empresa",e.client)+
    di('<rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',"Data",dd)+
    di('<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',"Horário",tt)+
    di('<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/>',"Local",e.location)+
    di('<rect x="8" y="2" width="8" height="5" rx="1.5" stroke="currentColor" stroke-width="2"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke="currentColor" stroke-width="2"/>',"Responsável / Equipe",e.owner)+
    di('<path d="M5 4h14M5 9h14M5 14h9M5 19h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',"Observações",e.notes)+
    '</div><button class="done-toggle '+(e.done?"is-done":"")+'" id="doneToggle"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'+(e.done?"Serviço finalizado ✓":"Marcar serviço como finalizado")+'</button>';
  document.getElementById("doneToggle").onclick=async()=>{
    e.done=!e.done;await S.save(events);
    toast(e.done?"Serviço finalizado":"Serviço reaberto");closeSheets();render();
  };
  openSheet(detailSheet);
}
document.getElementById("detailEdit").onclick=()=>{
  const e=events.find(x=>x.id===detailId);closeSheets();setTimeout(()=>openForm(e),260);
};
document.getElementById("detailDel").onclick=async()=>{
  if(!confirm("Excluir este compromisso?"))return;
  events=events.filter(e=>e.id!==detailId);await S.save(events);
  toast("Compromisso excluído");closeSheets();render();
};

document.getElementById("prevBtn").onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render();};
document.getElementById("nextBtn").onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render();};
document.getElementById("todayBtn").onclick=()=>{cursor=new Date();selDay=todayISO();render();};
document.getElementById("vMonth").onclick=()=>{view="month";render();};
document.getElementById("vAgenda").onclick=()=>{view="agenda";render();};
const sw=document.getElementById("searchWrap");
document.getElementById("searchToggle").onclick=()=>{
  sw.classList.toggle("on");
  if(sw.classList.contains("on"))document.getElementById("searchInput").focus();
  else{searchTerm="";document.getElementById("searchInput").value="";render();}
};
document.getElementById("searchInput").oninput=e=>{
  searchTerm=e.target.value.trim();if(view==="month")view="agenda";render();
};

document.getElementById("setBtn").onclick=()=>openSheet(setSheet);
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"Agenda ID Seven",exportedAt:new Date().toISOString(),events},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="agenda-id-seven-backup-"+todayISO()+".json";
  document.body.appendChild(a);a.click();a.remove();
  toast("Backup gerado");
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importInput").click();
document.getElementById("importInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      const arr=Array.isArray(d)?d:d.events;
      if(!Array.isArray(arr))throw 0;
      if(!confirm("Restaurar este backup? A agenda atual deste aparelho será substituída."))return;
      events=arr;await S.save(events);closeSheets();render();
      toast("Backup restaurado ("+arr.length+" itens)");
    }catch(_){ toast("Arquivo de backup inválido"); }
  };
  r.readAsText(f);
  e.target.value="";
};
document.getElementById("wipeBtn").onclick=async()=>{
  if(!confirm("Apagar TODOS os compromissos deste aparelho? Isso não pode ser desfeito."))return;
  events=[];await S.save(events);closeSheets();render();toast("Tudo apagado");
};

function makeIcon(s){
  const c=document.createElement("canvas");c.width=c.height=s;const x=c.getContext("2d");
  x.fillStyle="#0b0c0f";x.fillRect(0,0,s,s);
  x.fillStyle="#d8ff3e";x.beginPath();x.roundRect(s*.2,s*.2,s*.6,s*.6,s*.16);x.fill();
  x.strokeStyle="#13160a";x.lineWidth=s*.045;x.lineCap="round";x.lineJoin="round";
  const ix=s*.32,iw=s*.36;x.strokeRect(ix,s*.36,iw,iw*.92);
  x.beginPath();x.moveTo(ix,s*.46);x.lineTo(ix+iw,s*.46);
  x.moveTo(s*.4,s*.3);x.lineTo(s*.4,s*.4);x.moveTo(s*.6,s*.3);x.lineTo(s*.6,s*.4);x.stroke();
  return c.toDataURL("image/png");
}
try{
  const i192=makeIcon(192),i512=makeIcon(512);
  const al=document.createElement("link");al.rel="apple-touch-icon";al.href=i192;document.head.appendChild(al);
  const mf={name:"Agenda ID Seven",short_name:"ID Seven",start_url:".",display:"standalone",
    background_color:"#0b0c0f",theme_color:"#0b0c0f",orientation:"portrait",
    icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
           {src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  const b=new Blob([JSON.stringify(mf)],{type:"application/json"});
  const ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(b);
  document.head.appendChild(ml);
}catch(e){}
