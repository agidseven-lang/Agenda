# =====================================================================
# [manual] F3.3.20-B1.7-E — SECRET-ONLY: define o valor real de AUTH_SESSION_SECRET.
# Pre-requisito do deploy futuro de loginUser (que declara secrets:[AUTH_SESSION_SECRET]).
# Este fluxo SO mexe no Secret Manager. Ele NAO obtem o codigo-fonte do repo, NAO
# publica nada (Functions/Hosting/Rules), NAO altera variaveis de runtime das funcoes,
# NAO toca Firestore docs nem usuario real, NAO ativa Web Push. O valor e gerado por
# CSPRNG DENTRO do runner e canalizado DIRETO para o Secret Manager: nunca em variavel,
# nunca em arquivo, nunca impresso, nunca em log. Validacao apenas por metadados (sem
# nunca ler/acessar o valor). Secret DEDICADO e SEPARADO do trilho notifPrefs.
# =====================================================================
name: "[manual] AUTH_SESSION_SECRET — set real value (secret-only, no publish)"

on:
  workflow_dispatch:
    inputs:
      confirm_update:
        description: "Digite UPDATE_AUTH_SESSION_SECRET para confirmar (qualquer outro valor aborta)"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: auth-session-secret-set
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  SECRET_NAME: "AUTH_SESSION_SECRET"

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Guard confirm (== UPDATE_AUTH_SESSION_SECRET)
        env:
          CONFIRM: ${{ github.event.inputs.confirm_update }}
        run: |
          set -eu
          if [ "$CONFIRM" != "UPDATE_AUTH_SESSION_SECRET" ]; then
            echo "::error:: confirm_update invalido — abortando antes de tudo."
            exit 1
          fi
          echo "confirm OK."

      - name: Setup Node 20 (CSPRNG)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auth gcloud (service account via secret -> arquivo temporario)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: service account ausente."; exit 1; }
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null

      - name: Garante que o segredo existe (nao adiciona versao aqui)
        run: |
          set -eu
          if gcloud secrets describe "$SECRET_NAME" --project "$GCP_PROJECT" >/dev/null 2>&1; then
            echo "$SECRET_NAME ja existe (nao recriado)."
          else
            gcloud secrets create "$SECRET_NAME" --replication-policy=automatic --project "$GCP_PROJECT" >/dev/null
            echo "$SECRET_NAME criado."
          fi

      - name: Gera valor forte (CSPRNG) e adiciona NOVA versao (sem imprimir)
        run: |
          set -euo pipefail
          # 48 bytes aleatorios (> 32) em base64url, canalizados DIRETO para o stdin do
          # gcloud (nunca em variavel, nunca em arquivo, nunca impresso). Sem rastreio de shell.
          node -e 'process.stdout.write(require("crypto").randomBytes(48).toString("base64url"))' \
            | gcloud secrets versions add "$SECRET_NAME" --data-file=- --project "$GCP_PROJECT" >/dev/null
          echo "Nova versao adicionada (valor nao exibido)."

      - name: Validacao por metadados (sem ler o valor)
        run: |
          set -eu
          gcloud secrets describe "$SECRET_NAME" --project "$GCP_PROJECT" --format='value(name)'
          gcloud secrets versions list "$SECRET_NAME" --project "$GCP_PROJECT" \
            --sort-by=~createTime --limit=3 --format='table(name,state,createTime)'
          STATE="$(gcloud secrets versions describe latest --secret="$SECRET_NAME" --project "$GCP_PROJECT" --format='value(state)')"
          if [ "$STATE" != "ENABLED" ]; then
            echo "::error:: ultima versao nao ENABLED ($STATE)"
            exit 1
          fi
          echo "OK: segredo existe; ultima versao ENABLED; valor nunca lido nem impresso."

      - name: Limpeza (remove arquivo temporario da service account)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" 2>/dev/null || true
