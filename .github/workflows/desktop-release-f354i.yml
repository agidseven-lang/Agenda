# =====================================================================
# F3.5.4I — Publicacao da Desktop 1.0.200 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.200 (F3.5.4I: correcao do SALVAMENTO/ENVIO de Cronograma ao cliente — que na 1.0.199
# falhava com "Nao foi possivel salvar a tarefa. Verifique a conexao". Causa-raiz: array de temas
# ESPARSO/undefined => Firestore rejeita o add(). Agora o payload e saneado [compacta buracos, remove
# undefined], validado, escrito de forma idempotente com read-back, e o erro REAL deixa de ser
# mascarado como conexao. Fluxo-cliente/Card Premium/cache-bust CONGELADOS, chamados so APOS o save) no canal
# consumido pelo electron-updater da producao (provider github -> release Latest nao-prerelease
# com latest.yml): a 1.0.199/1.0.198 instaladas passam a DETECTAR a 1.0.200 em Configuracoes ->
# Atualizacoes -> Verificar -> Baixar -> Instalar e reiniciar. NENHUM download manual pelo owner.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4I 30584390968 (gated, verde; --publish never):
# NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests dos
# artifacts, 5 hashes SHA-256, tag v1.0.200 no head EXATO da branch. 6 assets conforme a
# autorizacao F3.5.4I: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main e INTOCAVEL nesta fase): dispara no push DESTE arquivo
# (pipeline automatico autorizado pela F3.5.4I apos gates verdes) + workflow_dispatch p/ reexecucao.
# v1.0.198, v1.0.197 e v1.0.196 permanecem PRESERVADAS (releases/tags intocadas).
# NAO builda, NAO altera codigo, NAO toca Firebase/Worker/Rules/Functions/Android.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois,
# exclusivamente pelo atualizador interno.
# =====================================================================
name: "F3.5.4I Desktop Release — 1.0.200 no canal do updater (correcao do salvamento/envio de Cronograma; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354i-cronograma-save-send-fix-1.0.200"
    paths:
      - ".github/workflows/desktop-release-f354i.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4I GO tecnico; run de build (pinado abaixo) verde nos 2 jobs) ──
      RUN_ID: "30584390968"
      STABLE_SHA: "e601eaa3f529ff4ab57ab97d22da6ca855ae5bca"
      TEST_BRANCH: "desktop/f354i-cronograma-save-send-fix-1.0.200"
      BASE_198_SHA: "009f2c6ef2064dbdd18f5a2995669128df13a9ce"
      TAG: "v1.0.200"
      TITLE: "Agenda ID Seven Desktop 1.0.200 — Correção do Salvamento e Envio de Cronograma"
      ART_INST: "agenda-id-seven-desktop-1.0.200-test-installer"
      ART_INST_DIGEST: "sha256:f22b0043e413057a9d8c7e420d5b9e8d8491699168fef1d685cfa2f7ea727fe4"
      ART_META: "agenda-id-seven-desktop-1.0.200-test-updatemeta"
      ART_META_DIGEST: "sha256:eed1359ed38ceebc78b99bbf1620160f4ecb16aee92999ff25e57f0f17a5d082"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.200-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.200-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.200-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "7aadabbe4beed914f83543ba1f234b521fe031c735d96b3255ed0d54a82c5029"
      EXP_MSI: "bbb3de863f705a0dbb13136cbb43a9ab9256d3e28b4d4153e069c7ad66de1342"
      EXP_LY: "2cb1d87a60f67e51e4f1fb1722f877137c7bcdbac92a6dfb8f4672057594ecb8"
      EXP_BM: "629b18a884a31a3242e7bc580d60681e1d9944b7f662c87190a2122de38ef510"
      EXP_SBOM: "573702ca9d304bdccb5a4c21704c51b90155e9a2703ecb89f13d4afb1993a90c"
      PROD_PREV_TAG: "v1.0.199"
      PROD_ROLLBACK_TAG: "v1.0.198"
      PROD_HIST_TAG: "v1.0.197"
      PROD_HIST2_TAG: "v1.0.196"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4I)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4I completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          # os commits entre o candidato buildado e o tip devem tocar APENAS este workflow de
          # release (o PRODUTO publicado e exatamente o dos bytes do run em STABLE_SHA)
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354i\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_198_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.198 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.198 na linhagem"

      - name: "Gate 3 — release v1.0.200 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.200" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.200"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.200" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.200"; exit 1; }
          grep -q "1.0.200-red-notification-boundary-fix" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.200/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.200 — Correção do Salvamento e Envio de Cronograma

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações →
          Atualizações → Verificar atualizações → Baixar → Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.199 (F3.5.4I — correção do salvamento/envio de Cronograma ao cliente)
          - SINTOMA (produção): ao criar um Cronograma e clicar em "Enviar para o cliente" na última
            etapa do assistente, o Windows exibia a caixa nativa "Não foi possível salvar a tarefa.
            Verifique a conexão e tente novamente." e o Cronograma NÃO era salvo nem enviado.
          - A mensagem "verifique a conexão" era um CATCH GENÉRICO — não o erro real. O erro real
            ficava escondido; foi descoberto com reprodução determinística e observabilidade saneada.
          - CAUSA-RAIZ (provada): a lista de temas do assistente (contents) era preenchida de forma
            preguiçosa/fora de ordem, gerando um ARRAY ESPARSO com buracos "undefined". O Firestore
            REJEITA qualquer escrita que contenha "undefined" (invalid-argument) e esse erro real era
            mascarado como "conexão". A hipótese de que a mudança da 1.0.199 (persistência de
            startAt/dueAt dos cards) fosse a culpada foi DESCARTADA: saveTask é byte-idêntico da
            1.0.198 para a 1.0.199 (diferencial provado em teste).
          - CORREÇÃO (cirúrgica, só no saveTask + auxiliares "cron*"):
            • Saneamento recursivo do payload: remove "undefined", compacta os buracos do array de
              temas e REJEITA NaN/Data inválida (sem coerção silenciosa).
            • Validação antes de gravar: bloqueia datas inválidas e campos obrigatórios ausentes,
              PRESERVANDO o assistente (nada do que foi digitado é perdido).
            • Idempotência: id de rascunho fixo + botão desabilitado + estado "Salvando cronograma…";
              reenvio/duplo-clique NÃO cria tarefas duplicadas.
            • Atomicidade: grava → RELÊ (read-back) → só ENTÃO gera token/link e abre o WhatsApp. O
              WhatsApp nunca abre antes de o salvamento estar confirmado.
            • Erro real deixa de ser mascarado: erros são classificados (validação vs permissão vs
              rede vs inesperado CRON-XXXX); "verifique a conexão" só aparece em erro real de rede/offline.

          PRESERVAÇÃO (provado por gates no build)
          - Fluxo-cliente CONGELADO e chamado só APÓS o save confirmado: Card Premium, colagem na
            Legenda, cache-bust (?v=), gerador de mensagem/preview do WhatsApp Business e domínio de
            aprovação — as 6 funções do fluxo-cliente byte-idênticas à 1.0.199.
          - index.html muda APENAS nas regiões do saveTask/edição de cards (auxiliares "cron*"); o
            restante do renderer intacto. main/núcleo durável (notifier/tray/atualizador), notificação
            vermelha T-10 (1.0.199), login/logout, agenda, roster, aprovação, portal — INTOCADOS.
          - Worker/Cloudflare/Firebase/Rules/Functions/banco: INTOCADOS. Android permanece PAUSADO.
          - Rollback: 1.0.199, 1.0.198 e 1.0.197 PRESERVADAS (releases e tags intactas).

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner (criar um Cronograma real,
          clicar em "Enviar para o cliente" e confirmar que ele é salvo e que a mensagem/link do
          WhatsApp é gerada — sem a caixa de "conexão"). A publicação apenas disponibiliza a
          atualização pelo mecanismo oficial.

          Procedência: run de build F3.5.4I 30584390968 (success; --publish never; gates de verificação
          + Windows verdes, incluindo os 20 gates F3.5.4I no app.asar) @ commit
          e601eaa3f529ff4ab57ab97d22da6ca855ae5bca (branch desktop/f354i-cronograma-save-send-fix-1.0.200
          = tag v1.0.199 + commits da fase). Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.200 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.200; 1.0.199 prev + 1.0.198/1.0.197/1.0.196 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.200 no canal do updater (Latest); 1.0.199/1.0.198/1.0.197/1.0.196 preservadas ====="

      - name: "Smoke do FEED DO UPDATER — exatamente o que o electron-updater consome (sem instalar)"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          # feed publico identico ao consultado pelo app (provider github, canal latest)
          curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" -o smoke/latest.yml
          [ "$(sha256sum smoke/latest.yml | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::feed latest.yml hash divergente"; exit 1; }
          grep -q "version: 1.0.200" smoke/latest.yml || { echo "::error::feed sem version 1.0.200"; exit 1; }
          grep -qE "^path: $EXE_NAME" smoke/latest.yml || { echo "::error::feed sem path do EXE"; exit 1; }
          curl -fsSL -o smoke/"$EXE_NAME" "https://github.com/$REPO/releases/latest/download/$EXE_NAME"
          [ "$(sha256sum smoke/$EXE_NAME | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::EXE do canal divergente"; exit 1; }
          curl -fsSL -o smoke/"$BM_NAME" "https://github.com/$REPO/releases/latest/download/$BM_NAME"
          [ "$(sha256sum smoke/$BM_NAME | awk '{print $1}')" = "$EXP_BM" ] || { echo "::error::blockmap do canal divergente"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' smoke/latest.yml | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "smoke/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do feed != EXE do feed"; exit 1; }
          echo "SMOKE DO UPDATER OK: 1.0.199/1.0.198 vao detectar/baixar a 1.0.200 (versao+path+sha512+blockmap integros). Nenhuma instalacao executada no CI."
