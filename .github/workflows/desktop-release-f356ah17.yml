# =====================================================================
# F3.5.6A-H17 — Publicacao da Desktop 1.0.243 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# A 1.0.242 (H16) corrigiu a tela Detalhes pos-conclusao (precedencia isTaskCompleted + bloqueio de
# reenvio). Restavam 3 residuos operacionais na tarefa CONCLUIDA: (1) marco final da timeline sem
# "por Cliente" (ator so em clientReview.byName); (2) "Editar prazo" ainda gravava designerSla.* +
# scheduleRevision++; (3) "Mover status" ainda gravava status/eixo + history 'moved'. CORRECAO
# renderer-only (index.html): C1 ator do marco final via clientReview com PROVA de identidade temporal
# (status 'aprovado' && at===FINAL_AT); C2 SLA pos-conclusao SOMENTE LEITURA (Editar prazo oculto +
# guardas em slaEditPrazoOpen/slaEditPrazoCommit, ZERO escrita); C3 MOVER bloqueado (guardas em
# openMove/moveStatus, ZERO escrita/evento; conclusao de PRODUCAO do designer NAO afetada, roda antes);
# C4 Remover preservado (canDelTask + "digite EXCLUIR"; deleteTask INALTERADO). isTaskCompleted/
# isFullyComplete/slaRules.js/Worker V64.61 INALTERADOS. Distribuida EXCLUSIVAMENTE pelo updater. USA os
# BYTES do run de build F3.5.6A-H17 31435174810 (gated, verde nos 2 jobs; --publish never): NAO
# RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests, 5 hashes
# SHA-256, tag v1.0.243 no head EXATO. ESCRITAS so via GitHub App "Agenda ID Seven Release Bot".
# baseline fisica 1.0.228; ROLLBACK IMEDIATO 1.0.228.
# =====================================================================
name: "F3.5.6A-H17 Desktop Release — 1.0.243 no canal do updater (ator final + SLA read-only + bloqueio de move; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356ah17-post-completion-write-guards-1.0.243"
    paths:
      - ".github/workflows/desktop-release-f356ah17.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A-H17; preenchida apos o run de build verde) ──
      RUN_ID: "31435174810"
      STABLE_SHA: "d954b9b2ffdbeecc8db73ae5837b33878c0a73a7"
      TEST_BRANCH: "desktop/f356ah17-post-completion-write-guards-1.0.243"
      BASE_242_SHA: "dcc07e68452e2a9c78fb8fdc90d2c41edb93e414"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      TAG: "v1.0.243"
      TITLE: "Agenda ID Seven Desktop 1.0.243 — ator final + SLA somente leitura + bloqueio de mover apos concluir (pelo updater)"
      ART_INST: "agenda-id-seven-desktop-1.0.243-installer"
      ART_INST_DIGEST: "sha256:e37415f55e394172faee5b79f440831827b5374a582abae7ab705b2b1409566f"
      ART_META: "agenda-id-seven-desktop-1.0.243-updatemeta"
      ART_META_DIGEST: "sha256:c48b7215b7e72c5c96739f1762ec6f18e51dc519808a46b30cff677fc20ca82e"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.243-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.243-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.243-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "9f4de633e618acca9fb26843a13037b8f87dc04869248f2a3198a9005ea8d46d"
      EXP_MSI: "bb6e15372fd44684d2a6cfc44e605b9dc2126653044761446fb1892acaf87d8a"
      EXP_LY: "01d97e143d7783db99106f17b1ccfc051af593350a75bf46e8124bf3e02b7bfb"
      EXP_BM: "ea9fc335457c17f687d92ca5b57417852e7fd45400fb0f9cd3e9a23b81de8548"
      EXP_SBOM: "536da9bb445072d88c0fb8fa80de8003155208efed143c19ba3b1f692f251084"
      PREV_LATEST_TAG: "v1.0.242"
      PRES_241_TAG: "v1.0.241"
      PRES_240_TAG: "v1.0.240"
      PRES_239_TAG: "v1.0.239"
      PRES_238_TAG: "v1.0.238"
      PRES_237_TAG: "v1.0.237"
      PRES_236_TAG: "v1.0.236"
      PRES_234_TAG: "v1.0.234"
      PRES_232_TAG: "v1.0.232"
      PRES_230_TAG: "v1.0.230"
      PRES_228_TAG: "v1.0.228"
      PROD_ROLLBACK_TAG: "v1.0.223"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A-H17)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A-H17 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356ah17\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_242_SHA" "$BASE_228_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.242/1.0.228 na linhagem"

      - name: "Gate 3 — release v1.0.243 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.243" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.243"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.243" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.243"; exit 1; }
          grep -q "1.0.243-f356ah17-postcompletion-write-guards" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.243/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.243 — autor real no marco final + prazo somente leitura + bloqueio de mover apos concluir (pelo atualizador interno)

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).

          Continuação da 1.0.242. A 1.0.242 já deixou a tela Detalhes correta depois da aprovação final.
          A 1.0.243 fecha três detalhes residuais numa tarefa JÁ CONCLUÍDA.

          O QUE MUDA vs 1.0.242 (SÓ o renderer index.html):
          - Linha do tempo: o marco "Aprovado final / Concluído" passa a mostrar o AUTOR real da
            aprovação ("por Cliente") junto do horário — inclusive quando esse autor só existia na
            "Resposta do cliente". O autor só é usado quando o horário dele bate exatamente com o da
            aprovação final (nunca reaproveita a aprovação dos TEMAS). Não inventa "Cliente".
          - SLA do designer (somente leitura após concluir): o bloco de início/prazo continua visível
            como histórico, mas o botão "Editar prazo" não aparece mais numa tarefa concluída. Mesmo por
            atalho, tentar editar o prazo de uma tarefa concluída não grava nada — apenas avisa "Esta
            tarefa já foi concluída. O prazo está disponível apenas para consulta."
          - "Mover status" deixa de aparecer numa tarefa concluída. Mesmo por atalho, mover uma tarefa
            concluída não faz nada além de avisar "Esta tarefa já foi concluída e não pode ser
            movimentada." — ZERO gravação, nenhum evento.
          - "Remover" continua disponível (ação administrativa, com a confirmação "digite EXCLUIR").

          O QUE NÃO MUDA (preservado; garantido por gate):
          - a conclusão continua exigindo a aprovação FINAL real do cliente; tarefas ainda em
            produção/aguardando seguem com edição de prazo e movimentação normais (a conclusão da
            produção do designer NÃO é bloqueada — acontece antes da aprovação final);
          - a tela Detalhes concluída (H16), card, tela do Cliente, linha do tempo (H14), "Próxima ação"
            (H15), Designer, Central, notificações 1.0.228 seguem intactos; isTaskCompleted/
            isFullyComplete INALTERADOS; slaRules.js byte-idêntico; Worker V64.61 INALTERADO.
          Delta de produção vs 1.0.242: SOMENTE desktop/src/renderer/index.html.

          COMO VALIDAR (reutilize o Cronograma Teste 6, já concluído):
          Detalhes -> a linha do tempo mostra o marco final "Aprovado final / Concluído · 15:43 · por
          Cliente"; o bloco SLA do designer aparece mas SEM o botão "Editar prazo"; NÃO aparece "Mover
          status"; "Remover" continua disponível (não clique). Em caso de problema: ROLLBACK IMEDIATO
          v1.0.228.

          Procedencia: run de build F3.5.6A-H17 31435174810 (success; --publish never; verify + Windows
          verdes: marcadores H17 C1..C4 (9 sitios; ordem das guardas antes do update) + H16 E1..E6
          preservados + isTaskCompleted/isFullyComplete/deleteTask INALTERADOS; nova suite
          f356ah17-postcompletion-write-guards (RED 14-fail na base 1.0.242 -> GREEN 38/0 na 1.0.243,
          incluindo SLA/MOVE write-guards por chamada direta e as 4 fixtures de ator); H16 41/0, H15 30/0,
          H12 35/0 contra o app.asar REAL; golden master F3.4.4; isolamento: delta de producao vs 1.0.242
          SO em index.html; slaRules.js e infra 1.0.228 byte-identicos)
          @ commit d954b9b2ffdbeecc8db73ae5837b33878c0a73a7
          (branch desktop/f356ah17-post-completion-write-guards-1.0.243). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.243 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.243; 1.0.242/241/240/239/238/237/236/234/232/230/228 preservadas; rollback 1.0.223 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_241_TAG" "$PRES_240_TAG" "$PRES_239_TAG" "$PRES_238_TAG" "$PRES_237_TAG" "$PRES_236_TAG" "$PRES_234_TAG" "$PRES_232_TAG" "$PRES_230_TAG" "$PRES_228_TAG" "$PROD_ROLLBACK_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.243 (ator final + SLA read-only + bloqueio de move) no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228; 1.0.242/241/240/239/238/237/236/234/232/230/228 preservadas ====="
