# F3.5.6A-H12 — Desktop 1.0.238 (correção do ESTADO DE APROVAÇÃO FINAL prematuro).
# 1.0.237 passou fisicamente até "Designer entregou"; após a entrega (workflowPhase=captions_preparation,
# bola de volta à Social p/ legendas/posts) DUAS superfícies marcavam o ENVIO FINAL como já feito —
# "Fluxo do cliente: Reenviado ao cliente" e timeline "Enviado para aprovação final — OK" — (e uma 3ª:
# clientFacingStatusView "Versão final disponível"). CAUSA-RAIZ (reader/derivação): o espelho legado
# clientFlowStatus='reenviado' é gravado na ENTREGA do designer e três leitores o interpretavam como
# "2ª rodada enviada" SEM o portão canônico flowSentToClientSignal (workflowPhase='captions_waiting_client').
# CORREÇÃO renderer-only: (1) taskTimeline resent=flowSentToClientSignal(t)||finalOk; (2) helper
# clientFlowDisplayLabel(t) guardado (flowSummaryBlock); (3) clientFacingStatusView guardado. clientCol
# NÃO alterado; writers INTOCADOS. MUDANÇA de produção = SOMENTE desktop/src/renderer/index.html.
# build GATED, --publish never. Publicação no Latest só no desktop-release-f356ah12.yml (mesmos bytes).
# Base técnica 1.0.237 (7b8d228). BASELINE FÍSICA 1.0.228. ROLLBACK IMEDIATO 1.0.228. Worker V64.61 INALTERADO.
name: "[push/manual] F3.5.6A-H12 — Desktop 1.0.238 (estado de aprovação final honesto) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah12-final-state-premature-1.0.238"]
    paths-ignore: [".github/workflows/desktop-release-f356ah12.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah12-final-state-premature-1.0.238"
  BASE_237_SHA: "7b8d22864ea9f4565de7311b2cb6db9bbe283027"
  BASE_236_SHA: "b7cf531afdf77ba9f94a7bcca495c3fe5254686a"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.237 base técnica, 1.0.236 e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_237_SHA" "$BASE_236_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.238 (package + lock x2 + marcador H12 + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.238'){console.error('versão',p.version);process.exit(1);} for(const m of ['final-state-premature-fix','team-session-recovery','durable-diag-honest-timeline']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.238"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES H12 (3 leitores guardados por flowSentToClientSignal) no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # (1) timeline: marco final usa o portão canônico (não o espelho cru)
          grep -qF "const resent=flowSentToClientSignal(t)||finalOk;" "$S"
          if grep -qF "const resent=(cf==='reenviado'||cf==='concluido');" "$S"; then echo "::error::timeline ainda usa o espelho cru"; exit 1; fi
          # (2) helper guardado + uso em flowSummaryBlock
          grep -qF "function clientFlowDisplayLabel(t)" "$S"
          grep -qF "col==='reenviado'&&!flowSentToClientSignal(t)) return {key:'aguardando_envio_final',label:'Aguardando envio final'" "$S"
          grep -qF "const cc=clientFlowDisplayLabel(t);" "$S"
          # (3) clientFacingStatusView guardado
          grep -qF "if(c==='reenviado')return flowSentToClientSignal(t)" "$S"
          grep -qF "A equipe está finalizando as artes" "$S"
          # clientCol NÃO alterado (produtor segue devolvendo o valor do espelho)
          grep -qF "if(CLIENT_COLS.some(c=>c.key===v)){" "$S"
          # writer da entrega do designer INTOCADO
          grep -qF "newStatus==='entregue'||newStatus==='concluido')patch.clientFlowStatus='reenviado';" "$S"
          # portão canônico intacto
          grep -qF "if(wp==='captions_waiting_client')return true;" "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function taskTimeline(');const j=s.indexOf('\nfunction ',i+10);const body=s.slice(i,j>0?j:s.length);if(/const resent=\(cf==='reenviado'/.test(body)){console.error('taskTimeline ainda tem resent cru');process.exit(1);}if(!/const resent=flowSentToClientSignal\(t\)\|\|finalOk;/.test(body)){console.error('taskTimeline sem gate');process.exit(1);}console.log('H12 timeline gate OK');"
          echo "MARCADORES H12: VERIFIED."
      - name: "Gate MARCADORES herdados H10 (team session) + H8 (diag durável + timeline honesta) preservados"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # H10
          grep -qF "root.id='tsAuthRoot'; root.className='ts-auth-back';" "$S"
          grep -qF "document.body.appendChild(root);" "$S"
          grep -qF "if(ok&&teamJwtValid()){ finish(true); return; }" "$S"
          grep -qF "flashToast('Envio não confirmado. A autenticação foi cancelada.',7000);" "$S"
          # H8 durável + timeline honesta do 1º envio
          grep -qF "__csDiagPersist(ctx&&ctx.id)" "$S"
          grep -qF "if(__csDiagLoad(ctx&&ctx.id)){" "$S"
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$S"
          # H5/H4/H3
          grep -q 'id="btnConfirmSend" title=' "$S"
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$S"
          grep -q "THEMES_READY:'themes_ready'" "$S"
          grep -q 'legacyCursor' dist/main/workflowNotifier.js
          echo "MARCADORES herdados H10/H8/H5/H4/H3: VERIFIED."
      - name: "Gate SUÍTES H12 (nova) + H10 + H8 + PIN F3.5.6A + linhagem + golden master F3.4.4 + H2 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356ah12-final-state-premature.test.mjs
          node scripts/f356ah10-team-session-recovery.test.mjs
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.238 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.238 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.238 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.238 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.237 (7b8d228); src/main INALTERADO; slaRules byte-idêntico; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_237_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.237 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah12\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f356ah12-final-state-premature\.test\.mjs$|desktop/scripts/f356ah5-red-main\.js$|desktop/scripts/(f354p-sla-decision-actions|f354vh1-session-persistence|f354wh2-immediate-notification-sound|f355a-integration|f355ah1-internal-notes|f355b-agenda-premium|f355c-script-quantity-rich-editor|f355d-cron-quantity-universal-paste|f355e-retire-modules-premium-notifications|f355eh2-reference-notification|f355eh3-global-notification-visibility|f355eh4-grouped-notification-handoff|f356a-workflow-orchestration|f356ah2-client-approvals|f356ah3-single-source-sent-state|f356ah8-durable-diagnostic|f356ah8-honest-timeline|f356ah10-team-session-recovery)\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H12: $BAD"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_237_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H12 não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_237_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H12 altera SOMENTE o renderer index.html"; exit 1; }
          git diff --quiet "$BASE_237_SHA"..HEAD -- desktop/src/main/slaRules.js || { echo "::error::slaRules.js alterado (paridade golden master exige byte-idêntico)"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H12: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.237; slaRules INALTERADO; infra 1.0.228 congelada)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão 1.0.238 + marcadores H12 + H10/H8 preservados no app.asar"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.238') process.exit(1);"
          I=asar-x/src/renderer/index.html
          grep -qF "const resent=flowSentToClientSignal(t)||finalOk;" "$I"
          if grep -qF "const resent=(cf==='reenviado'||cf==='concluido');" "$I"; then echo "::error::pacote: timeline espelho cru"; exit 1; fi
          grep -qF "function clientFlowDisplayLabel(t)" "$I"
          grep -qF "const cc=clientFlowDisplayLabel(t);" "$I"
          grep -qF "if(c==='reenviado')return flowSentToClientSignal(t)" "$I"
          grep -qF "A equipe está finalizando as artes" "$I"
          grep -qF "if(CLIENT_COLS.some(c=>c.key===v)){" "$I"
          grep -qF "newStatus==='entregue'||newStatus==='concluido')patch.clientFlowStatus='reenviado';" "$I"
          # herdados
          grep -qF "root.id='tsAuthRoot'; root.className='ts-auth-back';" "$I"
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$I"
          grep -qF "__csDiagPersist(ctx&&ctx.id)" "$I"
          grep -q 'function flowCanonicalSentSignal' asar-x/dist/main/slaRules.js
          grep -q 'legacyCursor' asar-x/dist/main/workflowNotifier.js
          F356AH12_SRC=asar-x/src/renderer/index.html F356AH12_PKG=asar-x/package.json node scripts/f356ah12-final-state-premature.test.mjs
          F356AH10_SRC=asar-x/src/renderer/index.html F356AH10_PKG=asar-x/package.json node scripts/f356ah10-team-session-recovery.test.mjs
          echo "GATE F3.5.6A-H12 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.238"; echo "rotulo      : 1.0.238-f356ah12-final-state-premature-fix (estado de aprovacao final honesto — pelo updater interno)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.237 (7b8d228). BASELINE FISICA 1.0.228 (3f0d0af1). ROLLBACK imediato 1.0.228."; echo "origem      : F3.5.6A-H12 — apos 'Designer entregou' (captions_preparation) duas superficies marcavam o ENVIO FINAL como feito. Correcao renderer-only: 3 leitores (timeline resent, clientFlowDisplayLabel, clientFacingStatusView) passam a usar o portao flowSentToClientSignal; clientCol e writers INTOCADOS. MUDANCA: SOMENTE index.html. slaRules.js e Worker V64.61 INALTERADOS."; echo "distribuicao: pelo updater interno; publicacao no Latest ocorre no workflow desktop-release-f356ah12.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.238-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.238-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
