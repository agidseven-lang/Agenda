# =====================================================================
# [manual] F3.4.2A Stage-2C — Publicacao da PRERELEASE canario Desktop 1.0.179-canary.5
# ---------------------------------------------------------------------
# Publica a prerelease CANARIO 1.0.179-canary.5 (Stage-2C: broadcast LIGADO no Worker
# canario + notificacoes REAIS de entrada/saida pelo HUB nativo, produtor unico; snooze
# "Lembrar mais tarde"; tela Equipe em tempo real) do run 29826844542. TUDO PINADO:
# run id, SHA do codigo canario (alvo da tag), ids+digests dos artifacts, hashes SHA-256
# (EXE/MSI/canary.yml/blockmap), tag e titulo.
# O job:
#   1) exige confirmacao literal (input);
#   2) valida run 29826844542 = completed/success;
#   3) confirma o head do branch canario == SHA pinado (alvo da tag);
#   4) aborta se a tag/release v1.0.179-canary.5 ja existir;
#   5) baixa os 2 artifacts (installer + updatemeta), confere ids+digests e
#      os hashes byte a byte (divergiu => aborta SEM publicar);
#   6) cria a release prerelease=true, latest=false, tag no SHA canario;
#   7) anexa 7 assets: EXE, MSI, canary.yml, blockmap, SHA256SUMS,
#      VERSAO-DESKTOP.txt, RELATORIO-DESKTOP.txt (app-update.yml NAO e asset);
#   8) pos-verifica flags/assets/target + confirma que a 1.0.178 SEGUE Latest
#      (canario NUNCA vira latest) e as tags historicas intactas;
#   9) smoke: re-baixa EXE + canary.yml da release e reconfere os hashes.
# NAO builda, NAO deploya, NAO toca Firebase/Worker J6/Cloud Run/Rules/flags, NAO mexe
# na producao estavel 1.0.178 nem em releases/tags antigas. So GITHUB_TOKEN padrao.
# Execucao SOMENTE manual (workflow_dispatch).
# =====================================================================
name: "[manual] F3.4.2A Stage-2C Desktop Canary Release — 1.0.179-canary.5"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.179-CANARY.5 para autorizar"
        required: true
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      RUN_ID: "29826844542"
      CANARY_SHA: "35bc8b18813766d53c37eac2d53fe73646b7e6d8"
      DESK_BRANCH: "desktop/f342a-x-tray-presence-persistence-canary"
      TAG: "v1.0.179-canary.5"
      TITLE: "Agenda ID Seven Desktop 1.0.179-canary.5 — Presence broadcast + native join/leave notifications (CANARIO)"
      ART_INST: "agenda-id-seven-desktop-1.0.179-canary.5-installer"
      ART_INST_DIGEST: "sha256:ec43683d8ec425aa7c263b33a73c9ed810c9445a4490c5dc336b83d20cb10bee"
      ART_META: "agenda-id-seven-desktop-1.0.179-canary.5-updatemeta"
      ART_META_DIGEST: "sha256:544cbbb98164f75a3282d49bc1a64903f7a5db585649a3558229cef344c8df99"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.179-canary.5-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.179-canary.5-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.179-canary.5-x64.exe.blockmap"
      CY_NAME: "canary.yml"
      EXP_EXE: "cdbb55189bf9f68cc7271f309efd4b17860e90f3de56450451e42c36b21d8c0b"
      EXP_MSI: "2427c3a5bbf045d60e43e40b898b474090a5a59313f36f4fa29b976b3211f38a"
      EXP_CY: "d64c312f3f97e59dc79604ef3190b29da902f9524c6710fb1c46398c7960efad"
      EXP_BM: "f56e35735d1ab1ad183929b5ae27b42beb5f0f6a5e9b83bd483cd95c0492f3af"
      LATEST_TAG_EXP: "v1.0.178"
    steps:
      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PUBLICAR-DESKTOP-1.0.179-CANARY.5" ]; then
            echo "::error::confirmacao invalida — nada foi publicado"; exit 1
          fi
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run invalido para publicacao"; exit 1; }

      - name: "Gate 3 — head do branch canario == SHA pinado (alvo da tag)"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          echo "head $DESK_BRANCH: $H (esperado $CANARY_SHA)"
          [ "$H" = "$CANARY_SHA" ] || { echo "::error::branch canario moveu; alvo da tag divergiu"; exit 1; }

      - name: "Gate 4 — tag e release nao podem existir"
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "::error::tag $TAG ja existe"; exit 1; fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          echo "OK: tag e release livres"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          check() {
            local name="$1" digest="$2"
            local d
            d="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .digest')"
            echo "artifact $name: $d"
            [ "$d" = "$digest" ] || { echo "::error::digest do artifact $name divergente ($d != $digest)"; exit 1; }
            local exp
            exp="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .expired')"
            [ "$exp" = "false" ] || { echo "::error::artifact $name expirado"; exit 1; }
          }
          check "$ART_INST" "$ART_INST_DIGEST"
          check "$ART_META" "$ART_META_DIGEST"
          echo "OK: artifacts intactos"

      - name: "Baixar artifacts (installer + updatemeta)"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          ls -lh pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$CY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::asset ausente no artifact: $f"; exit 1; }
          done
          test -f pacote/app-update.yml && { echo "::error::app-update.yml NAO deve ser asset publico"; exit 1; } || true

      - name: "Gate 6 — hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          H_EXE="$(sha256sum "pacote/$EXE_NAME" | awk '{print $1}')"
          H_MSI="$(sha256sum "pacote/$MSI_NAME" | awk '{print $1}')"
          H_CY="$(sha256sum "pacote/$CY_NAME" | awk '{print $1}')"
          H_BM="$(sha256sum "pacote/$BM_NAME" | awk '{print $1}')"
          echo "exe=$H_EXE"; echo "msi=$H_MSI"; echo "canary.yml=$H_CY"; echo "blockmap=$H_BM"
          [ "$H_EXE" = "$EXP_EXE" ] || { echo "::error::hash EXE divergente"; exit 1; }
          [ "$H_MSI" = "$EXP_MSI" ] || { echo "::error::hash MSI divergente"; exit 1; }
          [ "$H_CY" = "$EXP_CY" ] || { echo "::error::hash canary.yml divergente"; exit 1; }
          [ "$H_BM" = "$EXP_BM" ] || { echo "::error::hash blockmap divergente"; exit 1; }
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.179-canary.5" "pacote/$CY_NAME" || { echo "::error::canary.yml version incorreta"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$CY_NAME" || { echo "::error::canary.yml nao referencia o EXE"; exit 1; }
          echo "OK: hashes conferem + canary.yml coerente"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.179-canary.5 — Presence broadcast + native join/leave notifications (CANARIO)

          PRERELEASE de teste (canal `canary`). NAO e latest, NAO e para distribuicao geral.
          Instalar SOMENTE em maquina real autorizada (owner / 2o computador).

          O QUE MUDA vs 1.0.179-canary.4
          - Stage-2C — BROADCAST LIGADO no Worker canario (PRESENCE_BROADCAST_ENABLED=true). O Durable
            Object transmite SOMENTE as transicoes canonicas 0<->1 (entrou/saiu), com auto-exclusao do
            proprio usuario NA FONTE. NAO transmite heartbeat, pending, reconexao do mesmo dispositivo,
            1->2, 2->1, baseline nem snapshots repetidos. Payload de wire sanitizado:
            { eventId, type:"presence_transition", online, user:{id,name,photo,role}, transitionedAt,
            transitionRevision }. NUNCA token/ticket/deviceId/IP/hostname/e-mail/localizacao/SO.
          - NOTIFICACOES REAIS de entrada/saida pelo HUB nativo (deliverNotification), PRODUTOR UNICO —
            toast in-app quando visivel, premium/nativa quando na bandeja/oculto/bloqueado:
              ENTRADA: "USUARIO ON-LINE" — "[Nome] entrou no sistema." (verde)
              SAIDA:   "USUARIO OFF-LINE" — "[Nome] saiu do sistema." (neutro/cinza)
            Mostra foto real, nome, cargo e horario canonico; clique abre a Equipe. NUNCA notifica o
            proprio usuario (guardiao no cliente + exclusao na fonte).
          - DEDUPE robusto: por eventId E revision > baseline conhecida. Baseline (conexao/reconexao)
            atualiza a tela sem notificar; alarm/reconexao/replay NAO duplicam.
          - TELA EQUIPE em tempo real: ponto verde (on-line) / cinza (off-line), "On-line agora",
            "Visto por ultimo as HH:MM" e quantidade de sessoes SO para administrador. Nunca exibe
            deviceId. Injecao aditiva (nao altera a tela de negocio; byte-identidade preservada).
          - ATUALIZACAO — "LEMBRAR MAIS TARDE" (snooze) persistido com relogio canonico: silencia a
            RENOTIFICACAO da mesma versao (nao repete a cada verificacao automatica); limpa ao iniciar
            download, instalar, ou quando a versao deixa de ser superior. Uma versao diferente sempre
            volta a notificar. Produtor unico de update preservado (toast DOM ja neutralizado).

          LATENCIA DA NOTIFICACAO DE UPDATE (honesto)
          - O electron-updater CONSULTA o feed canary.yml (poll); NAO ha push de lancamento. A
            notificacao e IMEDIATA quando o update-available e DETECTADO, mas NAO e instantanea no
            momento da publicacao: a deteccao ocorre em ate ~6h (verificacao periodica) OU na hora ao
            clicar "Verificar atualizacoes" (ou no resume, se ja passou 6h).

          PRESERVACAO (zero regressao, congelado da 1.0.177)
          - Todas as funcoes de negocio byte-identicas a 1.0.177 (gate region-scoped removendo UPDATER+
            PRESENCE, verificado tambem DENTRO do app.asar empacotado). auth-core/clock/notifier/tray
            intocados. Worker J6 (idseven-push) byte-identico. Nenhum segredo empacotado; token so no
            main; preload/renderer sem token; body do /auth so { deviceId }.
          - 1.0.178 SEGUE Latest (producao estavel); rollback = reinstalar 1.0.178. Canario NUNCA vira latest.
          - Prereleases/tags historicas preservadas: v1.0.177-production, v1.0.178, v1.0.178-canary.1,
            v1.0.178-canary.2, v1.0.179-canary.1, v1.0.179-canary.2.

          HASHES OFICIAIS (SHA-256)
          - EXE: cdbb55189bf9f68cc7271f309efd4b17860e90f3de56450451e42c36b21d8c0b
          - MSI: 2427c3a5bbf045d60e43e40b898b474090a5a59313f36f4fa29b976b3211f38a
          - canary.yml: d64c312f3f97e59dc79604ef3190b29da902f9524c6710fb1c46398c7960efad
          - blockmap: f56e35735d1ab1ad183929b5ae27b42beb5f0f6a5e9b83bd483cd95c0492f3af
          Confira com SHA256SUMS anexado (sha256sum -c SHA256SUMS) ou certutil -hashfile <arquivo> SHA256.

          PROVA FISICA (parte do owner) — contas REAIS, SEM usuarios ficticios (owner + Tatiana, 2 maquinas)
          1. ENTRADA: owner conectado; Tatiana faz login -> owner recebe UMA "Tatiana ... entrou no
             sistema"; Tatiana NAO recebe sobre si.
          2. X: Tatiana fecha no X -> NENHUMA saida; permanece on-line na Equipe.
          3. LOGOUT: Tatiana faz logout -> owner recebe UMA saida.
          4. SAIR (bandeja): Tatiana entra e usa Sair -> owner recebe UMA saida.
          5. QUEDA CURTA (< 90s): sem saida/entrada falsa.
          6. QUEDA LONGA (> 90s TTL): uma saida; ao voltar, uma entrada.
          7. DUAS MAQUINAS: login gera UMA entrada; sair de uma NAO gera saida; sair da ultima gera UMA saida.
          8. UPDATE: com canary.5, publique a proxima e clique "Verificar atualizacoes" -> "NOVA
             ATUALIZACAO DISPONIVEL" imediata apos deteccao; autorizar download -> "ATUALIZACAO PRONTA";
             instalar/reiniciar preserva a sessao.

          RISCOS CONHECIDOS
          - Instalador nao assinado (SmartScreen/MOTW). Integridade por SHA-512 (canary.yml) + SHA-256 (release).
          - MSI e contingencia manual; o auto-update usa SOMENTE o EXE NSIS (canal canary).
          - Broadcast e notificacoes sao CANARIO: rollout estavel e estagio futuro autorizado.

          Procedencia: run 29826844542 (success); fonte desktop/f342a-x-tray-presence-persistence-canary @ 35bc8b1.
          Worker canario Stage-2C: idseven-presence-canary @ eed520e (deploy run 29826843152, /health broadcast:true).
          NOTAS
          wc -l notas.md

      - name: "Publicar prerelease (prerelease=true, latest=false) — 7 assets"
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$CANARY_SHA" \
            --prerelease \
            --latest=false \
            --title "$TITLE" \
            --notes-file notas.md \
            "pacote/$EXE_NAME" \
            "pacote/$MSI_NAME" \
            "pacote/$CY_NAME" \
            "pacote/$BM_NAME" \
            "pacote/SHA256SUMS" \
            "pacote/VERSAO-DESKTOP.txt" \
            "pacote/RELATORIO-DESKTOP.txt"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (flags/assets/target + 1.0.178 segue Latest)"
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" \
            --json tagName,targetCommitish,isPrerelease,isDraft,assets \
            --jq '{tag:.tagName,target:.targetCommitish,prerelease:.isPrerelease,draft:.isDraft,assets:[.assets[].name]}'
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "true|false" ] || { echo "::error::flags incorretas: $FLAGS (esperado true|false)"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "7" ] || { echo "::error::esperado 7 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$CY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset ausente na release: $a"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TGT="$(gh release view "$TAG" -R "$REPO" --json targetCommitish --jq '.targetCommitish')"
          [ "$TGT" = "$CANARY_SHA" ] || { echo "::error::target incorreto: $TGT"; exit 1; }
          # A 1.0.178 PRECISA continuar sendo o Latest do repo (canario NUNCA vira latest).
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          echo "Latest do repo: $LATEST_TAG"
          [ "$LATEST_TAG" = "$LATEST_TAG_EXP" ] || { echo "::error::Latest do repo mudou: $LATEST_TAG (esperado $LATEST_TAG_EXP)"; exit 1; }
          [ "$LATEST_TAG" != "$TAG" ] || { echo "::error::canario virou Latest!"; exit 1; }
          echo "===== GO: PRERELEASE CANARIO 1.0.179-canary.5 PUBLICADA; 1.0.178 segue Latest ====="

      - name: "Smoke — re-baixar EXE + canary.yml da release e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$CY_NAME" -D smoke
          S_EXE="$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')"
          S_CY="$(sha256sum "smoke/$CY_NAME" | awk '{print $1}')"
          [ "$S_EXE" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$S_CY" = "$EXP_CY" ] || { echo "::error::smoke canary.yml hash divergente"; exit 1; }
          echo "SMOKE OK: EXE e canary.yml publicados conferem byte a byte."
