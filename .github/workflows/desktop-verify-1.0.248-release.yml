            ${{ runner.temp }}/canary-sessionA.json
            ${{ runner.temp }}/canary-transition.json
            ${{ runner.temp }}/monitor1.jsonl
            ${{ runner.temp }}/canary-after.json
            ${{ runner.temp }}/canary-reopen.json
            ${{ runner.temp }}/CANARY-248-LIGHT-ON.png
            ${{ runner.temp }}/CANARY-248-CLEAN-PROFILE.png
          if-no-files-found: warn
