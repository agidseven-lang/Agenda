# Build Android Nativo Beta (port do GitLab build_android_beta).
# PREPARADO — execucao SOMENTE manual (workflow_dispatch). NAO roda em push/PR.
# Nao faz deploy. Gera APK + ZIP de distribuicao como artifacts. GitLab continua principal.
name: "[manual] Android Beta Build"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit a buildar (default: app/local-1.0.131-beta-role-flow-fix)"
        required: true
        default: "app/local-1.0.131-beta-role-flow-fix"
      resolve_urls:
        description: "Resolver URLs reais das Functions Gen2 via gcloud (true/false)"
        required: false
        default: "true"

# Sem permissoes de escrita: este workflow nao publica nada.
permissions:
  contents: read

jobs:
  # GATE de evidencia visual ANTES do APK: renderiza o card de tarefa em PNG
  # (Roborazzi + Robolectric NATIVE, JVM, sem emulador). Se nao compilar/renderizar,
  # o job falha e o build do APK (needs: screenshot) NEM roda.
  screenshot:
    runs-on: ubuntu-latest
    env:
      APP_DIR: "android-native-beta"
    steps:
      - name: Checkout (ref escolhido)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Restaurar google-services.json (secret texto puro)
        env:
          GOOGLE_SERVICES_JSON_BETA: ${{ secrets.GOOGLE_SERVICES_JSON_BETA }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BETA" ]; then
            echo "::error:: secret GOOGLE_SERVICES_JSON_BETA ausente."; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BETA" > "$APP_DIR/app/google-services.json"
      - name: Roborazzi — renderizar o card em PNG (record)
        run: |
          cd "$APP_DIR"
          chmod +x ./gradlew
          ./gradlew :app:recordRoborazziDebug --no-daemon --stacktrace
      - name: Listar PNGs gerados
        if: always()
        run: ls -lh "$APP_DIR/app/build/outputs/roborazzi" || echo "nenhum PNG"
      - name: Dump PNGs em base64 no log (inspecao sem download externo)
        if: always()
        run: |
          cd "$APP_DIR/app/build/outputs/roborazzi" || exit 0
          for f in *.png; do
            [ -f "$f" ] || continue
            echo "=====B64START:$f====="
            base64 -w0 "$f"; echo
            echo "=====B64END:$f====="
          done
      - name: Upload relatorio de teste (diagnostico, se falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-card-test-report
          path: |
            android-native-beta/app/build/reports/tests/**
            android-native-beta/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload screenshots do card (PNG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-task-card-screenshots
          path: android-native-beta/app/build/outputs/roborazzi/*.png
          if-no-files-found: error
          retention-days: 30

  build:
    needs: screenshot
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: "agenda-id-seven"
      APP_DIR: "android-native-beta"
      DIST_BASENAME: "idseven-nativebeta-1.0.87-beta-operational-status-consistency-fix"
    steps:
      - name: Checkout (ref escolhido)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # CI-only: deriva DIST_BASENAME do versionName REAL do build.gradle (evita rotulo defasado).
      - name: Definir DIST_BASENAME a partir do versionName (build.gradle)
        run: |
          VN="$(sed -nE 's/.*versionName[[:space:]]+"([^"]+)".*/\1/p' "$APP_DIR/app/build.gradle" | head -1)"
          if [ -n "$VN" ]; then echo "DIST_BASENAME=idseven-nativebeta-${VN}" >> "$GITHUB_ENV"; fi
          echo "DIST_BASENAME=idseven-nativebeta-${VN}"

      # Assinatura: keystore FIXO versionado (android-native-beta/app/idseven-test.keystore).
      # Sem geracao aleatoria -> certificado estavel entre builds (GitLab/GitHub/local).
      - name: Restaurar google-services.json (secret texto puro)
        env:
          GOOGLE_SERVICES_JSON_BETA: ${{ secrets.GOOGLE_SERVICES_JSON_BETA }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BETA" ]; then
            echo "::error:: secret GOOGLE_SERVICES_JSON_BETA ausente."; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BETA" > "$APP_DIR/app/google-services.json"
          echo "google-services.json gravado ($(wc -c < "$APP_DIR/app/google-services.json") bytes)."

      - name: Resolver URLs reais das Functions (opcional, sem deploy)
        id: urls
        if: ${{ github.event.inputs.resolve_urls == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "::error:: secret GOOGLE_APPLICATION_CREDENTIALS_JSON ausente (necessario p/ resolver URLs)."; exit 1
          fi
          KEY="$(mktemp)"; printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$KEY"
          gcloud auth activate-service-account --key-file="$KEY" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null
          REQ=$(gcloud functions describe requestPasswordResetHttp --gen2 --region=us-central1 --project="$GCP_PROJECT" --format='value(serviceConfig.uri)' 2>/dev/null || true)
          CNF=$(gcloud functions describe confirmPasswordResetHttp --gen2 --region=us-central1 --project="$GCP_PROJECT" --format='value(serviceConfig.uri)' 2>/dev/null || true)
          rm -f "$KEY"
          if [ -z "$REQ" ] || [ -z "$CNF" ]; then
            echo "::error:: URLs vazias — Functions de reset nao publicadas. Rode o deploy de Functions antes."; exit 1
          fi
          case "$REQ" in https://*.run.app|https://*.run.app/*|https://*.cloudfunctions.net|https://*.cloudfunctions.net/*) : ;; *) echo "::error:: URL request inesperada: $REQ"; exit 1 ;; esac
          case "$CNF" in https://*.run.app|https://*.run.app/*|https://*.cloudfunctions.net|https://*.cloudfunctions.net/*) : ;; *) echo "::error:: URL confirm inesperada: $CNF"; exit 1 ;; esac
          echo "req=$REQ" >> "$GITHUB_OUTPUT"
          echo "cnf=$CNF" >> "$GITHUB_OUTPUT"
          echo "URL request: $REQ"
          echo "URL confirm: $CNF"

      - name: gradlew clean assembleRelease (com URLs reais, se resolvidas)
        run: |
          cd "$APP_DIR"
          chmod +x ./gradlew
          # Limpeza defensiva: remove APK de qualquer build anterior antes do clean build,
          # garantindo que o artifact NUNCA reaproveite binario antigo.
          rm -rf app/build/outputs/apk || true
          EXTRA=""
          if [ -n "${{ steps.urls.outputs.req }}" ] && [ -n "${{ steps.urls.outputs.cnf }}" ]; then
            EXTRA="-PPASSWORD_RESET_REQUEST_URL=${{ steps.urls.outputs.req }} -PPASSWORD_RESET_CONFIRM_URL=${{ steps.urls.outputs.cnf }}"
          fi
          ./gradlew clean assembleRelease --no-daemon --stacktrace $EXTRA

      # Empacotamento p/ distribuicao DIRETA (sem Play Store):
      # renomeia APK (nome unico), gera relatorio + VERSAO-DO-APK.txt + instrucoes.
      - name: Renomear + verificar + gerar relatorio/instrucoes
        if: always()
        run: |
          set +e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="${BT}apksigner"; AAPT="${BT}aapt"; ZIPALIGN="${BT}zipalign"
          SRC="$APP_DIR/app/build/outputs/apk/release/app-release.apk"
          OUTDIR="$GITHUB_WORKSPACE/dist"; rm -rf "$OUTDIR"; mkdir -p "$OUTDIR"
          APK="$OUTDIR/${DIST_BASENAME}.apk"
          REPORT="$OUTDIR/RELATORIO-INSTALACAO.txt"
          INSTR="$OUTDIR/INSTRUCOES-INSTALACAO.txt"
          VERFILE="$OUTDIR/VERSAO-DO-APK.txt"
          if [ ! -f "$SRC" ]; then echo "::error:: APK nao gerado ($SRC ausente)."; exit 1; fi
          cp "$SRC" "$APK"
          VER="$("$AAPT" dump badging "$APK" 2>/dev/null | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          VC="$("$AAPT" dump badging "$APK" 2>/dev/null | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          PKG="$("$AAPT" dump badging "$APK" 2>/dev/null | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "===== RELATORIO DE INSTALACAO - idseven nativebeta ====="
            echo "Gerado (UTC)   : $(date -u)"
            echo "Ref / commit   : ${{ github.event.inputs.ref }} @ $GITHUB_SHA"
            echo "Arquivo APK    : $(basename "$APK")"
            echo "Tamanho        : $(wc -c < "$APK") bytes"
            echo "SHA-256 (apk)  : $SHA"
            echo ""
            echo "----- Identidade do pacote (aapt badging) -----"
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "^package:|sdkVersion:|targetSdkVersion:|application-label:"
            if "$AAPT" dump badging "$APK" 2>/dev/null | grep -q "application-debuggable"; then
              echo "debuggable     : TRUE (ATENCAO - nao deveria em release)"
            else
              echo "debuggable     : FALSE (ok - release nao-depuravel)"
            fi
            echo ""
            echo "----- Permissoes declaradas (uses-permission) -----"
            "$AAPT" dump permissions "$APK" 2>/dev/null | grep "uses-permission:" | sed "s/uses-permission: name=//"
            echo ""
            echo "----- zipalign -c -v 4 (alinhamento 4 bytes) -----"
            if "$ZIPALIGN" -c -v 4 "$APK" >/dev/null 2>&1; then echo "zipalign       : OK (4-byte aligned)"; else echo "zipalign       : FALHOU"; fi
            echo ""
            echo "----- apksigner verify --verbose --print-certs -----"
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1
            echo ""
            echo "----- keytool: fingerprints do keystore versionado -----"
            keytool -list -v -keystore "$APP_DIR/app/idseven-test.keystore" -storepass android 2>/dev/null | grep -E "Alias name:|Owner:|SHA1:|SHA256:|Valid"
          } | tee "$REPORT"
          # VERSAO-DO-APK.txt: prova rapida do que esta dentro do APK (lido do binario).
          printf '%s\n' \
            "versionName : $VER" \
            "versionCode : $VC" \
            "packageName : $PKG" \
            "SHA-256     : $SHA" \
            "commit      : $GITHUB_SHA" \
            "ref         : ${{ github.event.inputs.ref }}" \
            "arquivo     : $(basename "$APK")" \
            > "$VERFILE"
          echo "== VERSAO-DO-APK =="; cat "$VERFILE"
          printf '%s\n' \
            "==== COMO INSTALAR (APK DIRETO, SEM PLAY STORE) ====" \
            "" \
            "IMPORTANTE: instale o arquivo com NOME COMPLETO abaixo (nao o app-release.apk):" \
            "  ${DIST_BASENAME}.apk" \
            "" \
            "1) Baixe o .apk pelo NAVEGADOR (Chrome) do celular -> pasta Downloads." \
            "2) Abra Meus Arquivos (ou Arquivos) > Download e toque no arquivo." \
            "3) Se aparecer 'Instalar apps desconhecidos': habilite p/ Meus Arquivos (ou Chrome)." \
            "4) Confirme a versao na tela de login (rodape) e em Perfil > Sobre o app." \
            "" \
            "==== APOS INSTALAR: ATIVAR NOTIFICACOES ====" \
            "No Android 13+ a reinstalacao reseta a permissao de notificacoes. Aceite o pedido," \
            "ou va em Perfil > Notificacoes > 'Permitir notificacoes'. Token FCM sincroniza sozinho." \
            "" \
            "==== PRIMEIRA INSTALACAO DESTA LINHA (faca uma vez) ====" \
            "Se ja teve a 1.0.46/1.0.47 instalada, DESINSTALE primeiro (inclusive Dual Apps /" \
            "Espaco Seguro / 2o usuario). Depois desta, as proximas atualizam por cima." \
            "" \
            "==== SE O PLAY PROTECT BLOQUEAR ====" \
            "'Mais detalhes' > 'Instalar mesmo assim'. Se nao aparecer: e bloqueio de sideload" \
            "do Google (nao e erro do app) — Play Store > perfil > Play Protect > desligar" \
            "'Verificar apps' temporariamente, instalar, religar." \
            > "$INSTR"
          echo "Conteudo de dist/:"; ls -lh "$OUTDIR"

      - name: Montar ZIP de distribuicao (APK + relatorio + versao + instrucoes)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/dist" || exit 1
          zip -j "${DIST_BASENAME}.zip" \
            "${DIST_BASENAME}.apk" "VERSAO-DO-APK.txt" "RELATORIO-INSTALACAO.txt" "INSTRUCOES-INSTALACAO.txt"
          ls -lh

      - name: Upload APK (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_BASENAME }}
          path: dist/${{ env.DIST_BASENAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP de distribuicao (APK + relatorio + versao + instrucoes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_BASENAME }}-bundle
          path: dist/${{ env.DIST_BASENAME }}.zip
          if-no-files-found: error
          retention-days: 30
