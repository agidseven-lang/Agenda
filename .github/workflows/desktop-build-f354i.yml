# =====================================================================
# [push/manual] F3.5.4H — Desktop Build de TESTE (candidata 1.0.200 — correcao do salvamento/envio de Cronograma)
# ---------------------------------------------------------------------
# Build da CANDIDATA DE TESTE 1.0.200 (rotulo: 1.0.200-red-notification-boundary-fix) sobre a base
# 1.0.198 OFICIAL (@009f2c6, tag v1.0.198). Delta CIRURGICO F3.5.4H (a 1.0.198 foi aprovada
# fisicamente em TUDO exceto o MOMENTO do disparo da notificacao NATIVA vermelha, que ocorria ANTES
# da janela T-10 correta). Causa-raiz DUPLA provada por reproducao deterministica (scheduler REAL):
#   (1) nenhum timestamp canonico persistido — os saves gravavam so strings dueDate/dueTime e cada
#       maquina RE-PARSEAVA via new Date LOCAL; fuso divergente do leitor deslocava TODOS os marcos
#       (Recife x UTC => redAt -180min => vermelha nativa 3h ANTES da janela real);
#   (2) o estado 'overdue' (now>=redAt SEM teto) permitia catch-up RETROATIVO apos o prazo no
#       boot/reconexao, com corpo falso "Faltam 10 minutos".
# Correcao (SO logica do disparo): (a) persistir dueAt/startAt em ms (maquina de quem DEFINE) em
# saveCardsBatch/saveCardsEdit; cardFinishMs e kbv2SlaLiveData priorizam Number(t.dueAt) (fallback
# compat parse); (b) GATE TEMPORAL VERMELHO puro shouldFireRedNotification: emite SOMENTE quando
# now >= dueAt-10min E now < dueAt E !completed E uid==designer atribuido E !consumida (nunca antes,
# 1x ao cruzar, sem repeticao, sem retro); (c) edicao de prazo cancela o antigo (rev bump + dueAt
# novo) e a dedup passa a incluir o uid (cards_{warning,overdue}:taskId:UID:dueAtMs:rN) com
# legacyDedupKeys carregando a chave 1.0.198 p/ migracao SEM duplicata.
# GATES ANTIGOS SUBSTITUIDOS (nao apagados silenciosamente): a Categoria B da F3.5.4G exigia
# slaScheduler.ts E cardsRules.js byte-identicos; como a F3.5.4H os altera cirurgicamente, esses 2
# saem da byte-identidade e ganham um gate DIFF CONTROLADO F3.5.4H (cardsRules: gate puro presente +
# literais WARN/RED preservados + chaves uid+legacy; slaScheduler: diff = SO o bloco aditivo
# legacyDedupKeys, 0 remocoes). Os outros 6 arquivos da Categoria B seguem byte-identicos a 1.0.198.
# O index.html muda em APENAS 3 pontos autorizados (saveCardsBatch/saveCardsEdit gravam dueAt/startAt
# + kbv2SlaLiveData prioriza dueAt) — gate dedicado garante que o LAYOUT 1.0.198 (card/monitor/sino/
# tipografia) fica intacto. Todos os gates de layout da F3.5.4G sao PRESERVADOS (verificam que a
# 1.0.198 aprovada nao regride). PROVA VISUAL: 6 evidencias reais F3.5.4H (docs/f354h-qa) do momento
# do disparo (amarelo antes de T-10 sem vermelho; vermelho no T-10 exato; +1s sem duplicata; prazo
# editado sem alerta antigo; minimizado no T-10; fechado no X no T-10) — SUBSTITUEM as 15 cenas de
# layout da F3.5.4G (que este delta nao toca; layout gated estruturalmente).
# Congelados byte-identicos a 1.0.198: main.ts, slaSeenUser.ts, os 6 arquivos frozen da Categoria B,
# nucleo duravel (notifier/notifierA/notifEvents/notifStore/toastAck/actorProfile/preloads/bgnotify),
# Card Premium e colagem fora do diff. Worker/Rules/Functions/Android intocados (gate de isolamento).
#
# Roda no PROPRIO ref (on: push desta branch de teste + workflow_dispatch): NENHUM commit em main.
# `--publish never`: NUNCA publica; NAO cria release/tag/stable/latest. Artefatos = artifacts
# PRIVADOS do run, exclusivamente para TESTE FISICO do owner. Producao 1.0.198 permanece intocada.
# =====================================================================
name: "[push/manual] F3.5.4I Desktop Build (candidata 1.0.200 — correcao do salvamento/envio de Cronograma)"
"on":
  push:
    branches:
      - "desktop/f354i-cronograma-save-send-fix-1.0.200"
    paths-ignore:
      - ".github/workflows/desktop-release-f354i.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_198_SHA: "009f2c6ef2064dbdd18f5a2995669128df13a9ce" # Desktop 1.0.198 OFICIAL (referencia historica)
  BASE_199_SHA: "891150fb88e2c7c0d5e5885b4f71ec3e206912c2" # Desktop 1.0.199 OFICIAL (tag v1.0.199; BASE do delta F3.5.4I)
  TEST_BRANCH: "desktop/f354i-cronograma-save-send-fix-1.0.200"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (SHA do push nesta branch de teste; history completo p/ baselines)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA — branch de teste correta e descendente da 1.0.198 pinada
        run: |
          set -e
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error:: ref '${{ github.ref_name }}' != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_198_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.198 ($BASE_198_SHA)"; exit 1; }
          echo "ref=$TEST_BRANCH head=$(git rev-parse HEAD) base=$BASE_198_SHA OK"

      - name: Derivar versao — exige 1.0.200 exato, sem sufixo (candidata de teste; NAO producao)
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "versao=$APP_VERSION"
          [ "$APP_VERSION" = "1.0.200" ] || { echo "::error:: versao != 1.0.200"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido ($APP_VERSION)"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      - name: Instalar Playwright/Chromium (suites INTERATIVAS F3.5.4G + provas visuais)
        working-directory: desktop
        run: |
          set -e
          sudo mkdir -p /opt/pw-browsers && sudo chown "$USER" /opt/pw-browsers
          npm i --no-save playwright@1.56.1 --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium

      - name: Gate F3.5.3 — notificacoes duraveis 37/37 + colagem 15/15
        working-directory: desktop
        run: |
          set -e
          node scripts/f353-durable-notifications.test.mjs || { echo "::error:: f353 duraveis vermelho"; exit 1; }
          node scripts/f353-paste-recovery.test.mjs || { echo "::error:: f353 colagem vermelho"; exit 1; }

      - name: Gate F3.5.3A — foto do ator 25/25 (resolvedor canonico + payload + notifierA ponta-a-ponta)
        working-directory: desktop
        run: |
          set -e
          node scripts/f353a-actor-photo.test.mjs || { echo "::error:: f353a foto do ator vermelho"; exit 1; }

      - name: Gate F3.5.4/B/E/F/G — Kanban 40/40 + Designers + notificacoes 38/38 + SHELL + SLA + EDICAO 32/32 + MONITOR 26/26 + SINO 15/15 (layout 1.0.198 preservado)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354-kanban-unified.test.mjs || { echo "::error:: f354 kanban unificado (RESTAURADA 1.0.196) vermelho"; exit 1; }
          node scripts/f354-designer-autoload.test.mjs || { echo "::error:: f354 designers autoload vermelho"; exit 1; }
          node scripts/f354-notifications-reliability.test.mjs || { echo "::error:: f354 notificacoes (C3e emendada F3.5.4H: DIFF CONTROLADO) vermelho"; exit 1; }
          node scripts/f354e-card-template-unification.test.mjs || { echo "::error:: f354e UNIFICACAO do card (RESTAURADA 1.0.196) vermelho"; exit 1; }
          node scripts/f354f-sla-designer-live-timer.test.mjs || { echo "::error:: f354f SLA (banda->monitor) vermelho"; exit 1; }
          node scripts/f354f-task-edit-update-notification.test.mjs || { echo "::error:: f354f EDICAO/task_updated (emendada F3.5.4H: chave uid+legacy) vermelho"; exit 1; }
          node scripts/f354g-sla-top-monitor.test.mjs || { echo "::error:: f354g MONITOR SUPERIOR (layout 1.0.198 preservado) vermelho"; exit 1; }
          node scripts/f354g-bell-notification-panel.test.mjs || { echo "::error:: f354g SINO (layout 1.0.198 preservado) vermelho"; exit 1; }

      - name: Gate F3.5.4H — disparo vermelho T-10 (boundary 45/45 fake-timer + reproducao deterministica scheduler REAL)
        working-directory: desktop
        run: |
          set -e
          # A suite principal cobre: gate puro shouldFireRedNotification; linha do tempo T-31->T+1 (T-30
          # amarela, T-10 vermelha, nada antes/no prazo/depois); +1s sem duplicata; init/reconexao sem
          # retro; prazo editado (zero no antigo, unica no novo com rev2); multimaquina por relogio
          # canonico (offset +/-15min NAO antecipa); migracao de chave 1.0.198 sem duplicata.
          node scripts/f354h-red-notification-boundary.test.mjs || { echo "::error:: f354h boundary do disparo vermelho vermelho"; exit 1; }
          # Reproducao deterministica no slaScheduler REAL (relogio fake): timeline canonica + boot retro
          # + multimaquina (subprocesso TZ) provando redAt IDENTICO com dueAt canonico persistido.
          node scripts/f354h-repro.mjs || { echo "::error:: f354h reproducao deterministica vermelho"; exit 1; }

      - name: Gate F3.5.2/A funcionais (notify + source-invariance/Card-Premium + recipient + substituicao + intervalo + packaging)
        working-directory: desktop
        run: |
          set -e
          for t in f352-cards-notify f352-cards-source-invariance f352-cards-recipient f352-cards-channel-substitution f352a-cards-interval; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate F3.5.2/A $t vermelho"; exit 1; }
          done
          echo "== f352-cards-packaging =="
          node scripts/f352-cards-packaging.mjs || { echo "::error:: gate de empacotamento cardsRules vermelho"; exit 1; }

      - name: Gate PRESERVACAO aplicavel (golden masters + canal/dedup/SLA/opblock/updater/bg/central/clock/baseline)
        working-directory: desktop
        run: |
          set -e
          for t in f343-sla-golden-master f344-flow-golden-master f345-sla-timestamp-golden-master \
                   f343-delivery-channel f343-preservation f341a-updater-state-machine \
                   f347-immediate-visual-delivery f347-independent-behavior f33F-bg-notify \
                   f343-main-scheduler f343-operational-block f33A-notif-central \
                   f3377a-r4b-http-date-clock f3311-baseline-freeze; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate de preservacao $t vermelho"; exit 1; }
          done
          echo "PRESERVACAO APLICAVEL: TODOS VERDES."

      - name: Gate F3.5.4I — salvar/enviar Cronograma (40 itens + cenarios de erro Firestore + diferencial 198x199 + regressoes) + reproducao
        working-directory: desktop
        run: |
          set -e
          # temas esparsos/undefined saneados (TODOS os preenchidos persistem), read-back confirma antes de
          # compartilhar, erros REAIS classificados (rede x permissao x validacao x inesperado), idempotencia;
          # diferencial git 1.0.198x1.0.199 provando saveTask BYTE-IDENTICO; regressoes congeladas.
          node scripts/f354i-cronograma-save-send-client.test.mjs || { echo "::error:: f354i cronograma save/send vermelho"; exit 1; }
          # reproducao RED->GREEN no saveTask REAL + mock fiel do Firestore (rejeita undefined/holes).
          node scripts/f354i-repro.mjs || { echo "::error:: f354i reproducao vermelho"; exit 1; }

      - name: Gate MAIN CONGELADO — desktop/src/main byte-identico a 1.0.199 (SLA/sino/notif/scheduler/updater/tray/cardsRules intocados)
        run: |
          set -e
          # F3.5.4I NAO toca o processo main: TODO desktop/src/main deve ser byte-identico a 1.0.199 (congela a
          # correcao vermelha 1.0.199, o SLA, o sino, as notificacoes, o updater, o tray, o cardsRules/scheduler).
          D=$(git diff "$BASE_199_SHA" HEAD -- desktop/src/main || true)
          [ -z "$D" ] || { echo "::error:: desktop/src/main ALTERADO vs 1.0.199 (F3.5.4I e SO renderer/scripts/docs/workflows):"; printf '%s\n' "$D" | head -40; exit 1; }
          for f in desktop/src/preload/preload.ts desktop/src/preload/bgnotify-preload.ts desktop/src/renderer/bgnotify.html; do
            E=$(git diff "$BASE_199_SHA" HEAD -- "$f" || true); [ -z "$E" ] || { echo "::error:: $f ALTERADO vs 1.0.199 (congelado)"; exit 1; }
          done
          echo "MAIN CONGELADO: desktop/src/main + preloads + bgnotify byte-identicos a 1.0.199."

      - name: Gate INDEX.HTML — diff vs 1.0.199 confinado as regioes F3.5.4I; layout/Card Premium/notif/SLA/sino/colagem congelados
        run: |
          set -e
          H="desktop/src/renderer/index.html"
          DIFF=$(git diff -U0 "$BASE_199_SHA" HEAD -- "$H" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
          # (a) NENHUM token de superficie congelada nas linhas alteradas (layout/Card Premium/cache-bust/notif/SLA/sino/colagem)
          if printf '%s\n' "$DIFF" | grep -qE 'kbv2-sla-live|sla-monitor|f354g[A-Za-z]*Mon|slaib|kbv2-card|kbv2-theme|notif-toast|bgnotify|buildClientMessage|buildShareClientUrl|ensureStableClientReviewToken|openSendClientModal|clientReviewToken|og:image|/share/|[?]v=|f353WirePasteRecovery|shouldFireRedNotification|kbv2SlaLiveData'; then
            echo "::error:: index.html diff toca superficie CONGELADA"; printf '%s\n' "$DIFF" | grep -nE 'kbv2-sla-live|sla-monitor|slaib|kbv2-card|notif-toast|buildClientMessage|[?]v='; exit 1; fi
          # (b) as ancoras F3.5.4I estao PRESENTES (a correcao foi mesmo empacotada na fonte)
          for anc in 'function cronSanitizeDeep(' 'function cronValidateSend(' 'function cronClassifyError(' '_draftId' 'cronContents=_cc' 'Salvando cronograma'; do
            printf '%s\n' "$DIFF" | grep -qF "$anc" || { echo "::error:: ancora F3.5.4I ausente do diff: $anc"; exit 1; }
          done
          echo "INDEX.HTML: diff confinado as regioes F3.5.4I; superficies congeladas intactas."

      - name: Gate CARD PREMIUM / FLUXO-CLIENTE — funcoes byte-identicas a 1.0.199 (mensagem/token/link/cache-bust/portal)
        run: |
          set -e
          git show "$BASE_199_SHA:desktop/src/renderer/index.html" > /tmp/base199.html
          CUR="desktop/src/renderer/index.html" BASE="/tmp/base199.html" node -e '
            const fs=require("fs"); const cur=fs.readFileSync(process.env.CUR,"utf8"), base=fs.readFileSync(process.env.BASE,"utf8");
            const res=[/function buildClientMessage\([^]*?\n\}/,/function buildShareClientUrl\([^]*?\n\}/,/function ensureStableClientReviewToken\([^]*?\n\}/,/function openSendClientModal\([^]*?\n\}/,/function canSendToClient\([^]*?\n\}/,/function isClientSector\(k\)\{return[^}]*\}/];
            const names=["buildClientMessage","buildShareClientUrl","ensureStableClientReviewToken","openSendClientModal","canSendToClient","isClientSector"];
            for(let i=0;i<res.length;i++){ const a=(cur.match(res[i])||[])[0], b=(base.match(res[i])||[])[0]; if(!a||!b||a!==b){ console.error("::error:: funcao do fluxo-cliente ALTERADA vs 1.0.199: "+names[i]); process.exit(1);} }
            console.log("CARD PREMIUM/FLUXO-CLIENTE: 6 funcoes byte-identicas a 1.0.199.");'

      - name: Gate ISOLAMENTO — diff vs 1.0.199 SO nos arquivos autorizados F3.5.4I
        run: |
          set -e
          # Allowlist F3.5.4I: renderer (saveTask+helpers+botao+newForm), scripts f354i-*, as 4 suites emendadas
          # (byte-pins do saveTask alterado), docs F3.5.4I + docs/f354i-qa, package*, e os 2 workflows f354i.
          # Android/Worker/Rules/Functions/main/nucleo duravel/Card Premium: INTOCAVEIS.
          git diff --name-only "$BASE_199_SHA" HEAD | grep -vE '^(desktop/src/renderer/index\.html$|desktop/scripts/f354i-cronograma-save-send-client\.test\.mjs$|desktop/scripts/f354i-repro\.mjs$|desktop/scripts/f354i-qa-evidence\.mjs$|desktop/scripts/f352a-cards-interval\.test\.mjs$|desktop/scripts/f352-cards-source-invariance\.test\.mjs$|desktop/scripts/f3377a-media-editing\.test\.mjs$|desktop/scripts/f343d-designer-assignment-reauth-audit\.test\.mjs$|desktop/package\.json$|desktop/package-lock\.json$|docs/F3\.5\.4I-|docs/f354i-qa/|\.github/workflows/desktop-build-f354i\.yml$|\.github/workflows/desktop-release-f354i\.yml$)' | tee /tmp/outside.txt || true
          [ ! -s /tmp/outside.txt ] || { echo "::error:: mudanca FORA do escopo F3.5.4I (Android/Worker/Rules/Functions/main/nucleo duravel intocaveis)"; exit 1; }
          echo "OK: diff vs 1.0.199 contem SOMENTE os arquivos autorizados F3.5.4I."

      - name: PROVAS VISUAIS F3.5.4I — 6 evidencias reais (Chromium; markup REAL do botao rev-send + mensagens REAIS)
        working-directory: desktop
        run: |
          set -e
          # markup real do botao (Enviar / Salvando cronograma...) + mensagens REAIS de cronValidateSend/
          # cronClassifyError sobre o CSS real; sem IA. 01 preenchido; 02 salvando; 03 sucesso; 04 validacao;
          # 05 falha de rede com dados preservados; 06 WhatsApp so apos o save.
          node scripts/f354i-qa-evidence.mjs
          git diff --quiet -- package.json package-lock.json || { echo "::error:: provas visuais alteraram package.json/lock"; exit 1; }
          N=$(ls ../docs/f354i-qa/*.png | wc -l | tr -d ' '); echo "PNGs: $N"; [ "$N" = "6" ] || { echo "::error:: esperadas 6 evidencias, vi $N"; exit 1; }
          test -f ../docs/f354i-qa/metrics-f354i.json || { echo "::error:: metrics-f354i.json ausente"; exit 1; }

      - name: Upload evidencias reais F3.5.4I (artifact PRIVADO)
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.200-test-evidencias
          path: |
            docs/f354i-qa/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
    steps:
      - name: Forcar LF no checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA (windows)
        run: |
          set -e
          git merge-base --is-ancestor "$BASE_198_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.198"; exit 1; }

      - name: Gate LINE ENDINGS LF
        run: |
          set -e
          FILES="desktop/src/renderer/index.html desktop/src/main/main.ts desktop/src/main/firebase.ts desktop/src/main/bgNotify.ts desktop/src/main/slaScheduler.ts desktop/src/main/cardsRules.js desktop/src/main/notifierA.ts desktop/src/main/notifStore.ts desktop/src/main/toastAck.ts desktop/src/main/notifEvents.js desktop/src/main/actorProfile.js desktop/src/main/slaSeenUser.ts"
          git ls-files --eol -- $FILES | tee "$RUNNER_TEMP/eol.txt"
          if grep -Eq 'w/(crlf|mixed)' "$RUNNER_TEMP/eol.txt"; then echo "::error:: CRLF/mixed em arquivo-chave"; exit 1; fi
          N=$(git ls-files --eol -- $FILES | wc -l | tr -d ' '); [ "$N" -ge 12 ] || { echo "::error:: esperados >=12, vi $N"; exit 1; }
          echo "LINE ENDINGS: LF CONFIRMED"

      - name: Derivar versao — exige 1.0.200 exato
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          [ "$APP_VERSION" = "1.0.200" ] || { echo "::error:: versao != 1.0.200"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f "dist-installer/win-unpacked/resources/icon.png" || { echo "::error:: resources/icon.png AUSENTE"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.200) + renderer EMPACOTADO == fonte + F4.2F AUSENTE
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.200" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.200"; exit 1; }
          EX="$EXDIR/src/renderer/index.html"; SRC="src/renderer/index.html"; test -f "$EX" || { echo "::error:: index.html ausente no asar"; exit 1; }
          EX="$EX" SRC="$SRC" node -e 'const fs=require("fs");const nrm=s=>String(s).replace(/\r\n/g,"\n");if(nrm(fs.readFileSync(process.env.EX,"utf8"))!==nrm(fs.readFileSync(process.env.SRC,"utf8"))){console.error("index.html EMPACOTADO != fonte");process.exit(1);}'
          echo "  index.html EMPACOTADO == fonte"
          test ! -f "$EXDIR/src/renderer/firebaseAuthBridge.js" || { echo "::error:: firebaseAuthBridge.js presente (F4.2F)"; exit 1; }
          for k in 'firebase-auth-compat' 'signInWithCustomToken' 'startFirebaseAuthBridge' 'DESKTOP_FIREBASE_AUTH'; do
            if grep -q "$k" "$EX"; then echo "::error:: '$k' presente no renderer (F4.2F)"; exit 1; fi
          done
          echo "GATE prova-de-versao 1.0.200 + renderer==fonte + F4.2F AUSENTE OK."

      - name: Gate F3.5.3/A + F3.5.4 EMPACOTADOS (nucleo duravel + actorProfile + slaSeenUser + autoload + retry + IPCs + colagem)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
