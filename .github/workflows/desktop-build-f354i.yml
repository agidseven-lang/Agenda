      - name: Gate F3.5.4H EMPACOTADO — logica do disparo vermelho T-10 no app.asar (20 gates da diretiva)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; DM="$EXDIR/dist/main"; EXH="$EXDIR/src/renderer/index.html"
          CR="$DM/cardsRules.js"; SC="$DM/slaScheduler.js"
          # 1 — funcao PURA presente e exportada (unica autorizacao de emissao vermelha)
          grep -qF 'function shouldFireRedNotification(' "$CR" || { echo "::error:: (1) gate puro ausente"; exit 1; }
          node -e 'const c=require(process.env.RUNNER_TEMP+"/asarx/dist/main/cardsRules.js"); if(typeof c.shouldFireRedNotification!=="function"){console.error("shouldFireRedNotification nao exportada");process.exit(1);}'
          # 2-3 — FORMULAS: amarela=due-30min, vermelha=due-10min (literais herdados INTACTOS)
          grep -qF 'var CARDS_WARN_MS = 30 * 60000' "$CR" || { echo "::error:: (2) formula amarela (30min) alterada"; exit 1; }
          grep -qF 'var CARDS_RED_MS  = 10 * 60000' "$CR" || { echo "::error:: (3) formula vermelha (10min) alterada"; exit 1; }
          # 4 — SEM Math.abs (comparacoes em ms crus; nenhuma simetria acidental). Casa a CHAMADA
          # `Math.abs(` — nao o texto "Math.abs;" que aparece no COMENTARIO explicativo da funcao.
          if grep -qE 'Math\.abs\(' "$CR"; then echo "::error:: (4) chamada Math.abs( presente em cardsRules"; exit 1; fi
          # 5 — cardFinishMs prioriza o dueAt CANONICO persistido (parse local so como fallback compat)
          grep -qF 'var ca = Number(t && t.dueAt) || 0; if(ca > 0) return ca;' "$CR" || { echo "::error:: (5) cardFinishMs nao prioriza dueAt canonico"; exit 1; }
          # 6 — relogio canonico UNICO no renderer (offset aplicado 1x; espelho do main)
          grep -qF 'function canonicalNowMs(' "$EXH" || { echo "::error:: (6) canonicalNowMs ausente do renderer"; exit 1; }
          grep -qF '_slaApplyClockState' "$EXH" || { echo "::error:: (6) espelho do estado do relogio ausente"; exit 1; }
          # 7 — guarda now >= redAt (nunca antes da janela T-10)
          grep -qF 'if(now < due - CARDS_RED_MS) return false;' "$CR" || { echo "::error:: (7) guarda now>=redAt ausente"; exit 1; }
          # 8 — guarda now < dueAt (nunca no prazo nem depois; sem retro)
          grep -qF 'if(now >= due) return false;' "$CR" || { echo "::error:: (8) guarda now<dueAt (sem retro) ausente"; exit 1; }
          # 9 — guarda de conclusao (tarefa concluida nao dispara)
          grep -qF 'if(o.completed) return false;' "$CR" || { echo "::error:: (9) guarda completed ausente"; exit 1; }
          # 10 — guarda de destinatario (uid == designer atualmente atribuido)
          grep -qF "if(!uid || !cur || uid !== cur) return false;" "$CR" || { echo "::error:: (10) guarda de destinatario (uid) ausente"; exit 1; }
          # 11 — dedup por task + uid + dueAt + rev
          grep -qF "dedupKey:'cards_overdue:' + t.id + ':' + uid + ':' + d.finishMs + ':r' + rev" "$CR" || { echo "::error:: (11) dedup vermelho sem uid/dueAt/rev"; exit 1; }
          # 12-13 — catch-up UNICO via gate + migracao de chave 1.0.198 (legacyDedupKeys no scheduler)
          grep -qF 'legacyDedupKeys' "$CR" || { echo "::error:: (12) legacyDedupKeys ausente do produtor"; exit 1; }
          grep -qF 'legacyDedupKeys' "$SC" || { echo "::error:: (13) migracao legacyDedupKeys ausente do scheduler empacotado"; exit 1; }
          grep -qF 'sla.dedup.legacy' "$SC" || { echo "::error:: (13) log da migracao legada ausente"; exit 1; }
          # 14 — o gate revalida em cada avaliacao (okRed chama shouldFireRedNotification)
          grep -qF 'var okRed = shouldFireRedNotification({' "$CR" || { echo "::error:: (14) emissao vermelha nao passa pelo gate puro"; exit 1; }
          # 15 — edicao de prazo cancela o antigo: rev bump + dueAt novo gravado (renderer)
          grep -qF 'patch.cardDeadlineRev=(Number(t.cardDeadlineRev)||1)+1;' "$EXH" || { echo "::error:: (15) bump de rev na edicao ausente"; exit 1; }
          grep -qF "dueAt:(Number(dtMs(c.endDate,c.endTime||'23:59'))||0)," "$EXH" || { echo "::error:: (15) dueAt canonico nao regravado na edicao/criacao"; exit 1; }
          # 16 — renderer NAO e produtor (notifScan vazio; produtor unico no main)
          grep -qF 'function notifScan(){}' "$EXH" || { echo "::error:: (16) renderer voltou a ser produtor (notifScan nao-vazio)"; exit 1; }
          # 17-18 — Monitor SLA e Sino NAO disparam a nativa (sem api.notify/notifEmit nas fontes visuais)
          # (o EXH= vem ANTES do `node` — prefixo de env; depois do comando seria arg posicional e
          #  process.env.EXH ficaria indefinido, quebrando o readFileSync.)
          EXH="$EXH" node -e 's=require("fs").readFileSync(process.env.EXH,"utf8");if(/f354gMon\w*[\s\S]{0,400}?api\.notify/.test(s)){console.error("(17) Monitor dispara nativa");process.exit(1);}if(/slaib\w*[\s\S]{0,300}?api\.notify/.test(s)){console.error("(18) Sino dispara nativa");process.exit(1);}'
          # 19 — tray PRESERVADO (close->tray; produtor autoritativo segue vivo no main)
          grep -qF 'ensureTray' "$DM/main.js" || { echo "::error:: (19) ensureTray ausente"; exit 1; }
          grep -qF 'startSlaScheduler' "$DM/main.js" || { echo "::error:: (19) produtor autoritativo (scheduler) nao ligado no main"; exit 1; }
          # 20 — LAYOUT 1.0.198 preservado: index.html EMPACOTADO diff vs 1.0.198 SO nos 3 pontos autorizados
          # (este passo roda com working-directory=desktop; o pathspec do git e relativo ao CWD, entao
          #  usamos `git -C "$GITHUB_WORKSPACE"` p/ ancorar na RAIZ do repo. O passo 12 ja provou que o
          #  index.html EMPACOTADO no app.asar == fonte, logo diffar a fonte aqui e equivalente.)
          DIFF=$(git -C "$GITHUB_WORKSPACE" diff -U0 "$BASE_198_SHA" HEAD -- desktop/src/renderer/index.html | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
          if printf '%s\n' "$DIFF" | grep -qE 'kbv2-sla-live|sla-monitor|f354g-|slaib|f354b-card-styles|f354e-card-styles|kbv2-card-notes|line-clamp|kbv2-theme'; then echo "::error:: (20) diff empacotado toca LAYOUT congelado"; exit 1; fi
          printf '%s\n' "$DIFF" | grep -qF 'var due=Number(t.dueAt)||0;' || { echo "::error:: (20) index empacotado nao prioriza dueAt"; exit 1; }
          echo "GATE F3.5.4H EMPACOTADO (20 gates): VERIFIED"

      - name: Gate F3.5.4I EMPACOTADO — salvamento/envio de Cronograma no app.asar (20 gates da diretiva)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; DM="$EXDIR/dist/main"; EXH="$EXDIR/src/renderer/index.html"
          test -f "$EXH" || { echo "::error:: index.html AUSENTE no app.asar"; exit 1; }
          # 1 — handler correto do botao (data-sendclient => _sendAfterSave + "Salvando..." + saveTask)
          grep -qF 'data-sendclient="1"' "$EXH" || { echo "::error:: (1) botao data-sendclient ausente"; exit 1; }
          grep -qF 'state.form._sendAfterSave=true;state.form._sending=true;render();await saveTask();' "$EXH" || { echo "::error:: (1) handler do envio incorreto"; exit 1; }
          # 2 — validacao ANTES da escrita
          grep -qF 'function cronValidateSend(' "$EXH" || { echo "::error:: (2) cronValidateSend ausente"; exit 1; }
          grep -qF 'const _v=cronValidateSend(f,_isClientSend); if(!_v.ok){' "$EXH" || { echo "::error:: (2) validacao nao ocorre antes da escrita"; exit 1; }
          # 3 — payload saneado
          grep -qF 'const _payload=cronSanitizeDeep(data);' "$EXH" || { echo "::error:: (3) payload nao saneado"; exit 1; }
          # 4 — sem undefined (sanitizer remove)
          grep -qF 'if(val===undefined) continue;' "$EXH" || { echo "::error:: (4) sanitizer nao remove undefined"; exit 1; }
          # 5 — sem NaN/Infinity
          grep -qF "if(typeof v==='number' && !isFinite(v)) return undefined;" "$EXH" || { echo "::error:: (5) NaN/Infinity nao barrado"; exit 1; }
          # 6 — sem Invalid Date (validacao de datas bloqueia)
          grep -qF 'if(!isFinite(ms)||ms<=0) return {ok:false' "$EXH" || { echo "::error:: (6) data invalida nao bloqueia"; exit 1; }
          # 7 — startAt/dueAt seguros: temas compactados (buracos/undefined fora do payload)
          grep -qF "var _cc=(Array.isArray(f.contents)?f.contents:[]).filter(function(c){return c&&(c.tema||c.legenda);});" "$EXH" || { echo "::error:: (7) temas nao compactados"; exit 1; }
          # 8 write confirmado + 9 read-back confirmado
          grep -qF "cronDiag('cron.firestore.write.success'" "$EXH" || { echo "::error:: (8) write.success ausente"; exit 1; }
          grep -qF "cronDiag('cron.readback.success'" "$EXH" || { echo "::error:: (9) readback.success ausente"; exit 1; }
          grep -qF "await db.collection('tasks').doc(ref.id).get();" "$EXH" || { echo "::error:: (9) read-back nao le o doc"; exit 1; }
          # 10-11 token/WhatsApp SO depois do save (modal ocorre APOS a escrita)
          EXH="$EXH" node -e 's=require("fs").readFileSync(process.env.EXH,"utf8");var w=s.indexOf(".doc(f._draftId).set(_payload)"),m=s.indexOf("openSendClientModal({id:ref.id");if(!(w>0&&m>w)){console.error("(10-11) modal/WhatsApp NAO vem depois do save");process.exit(1);}'
          # 12 idempotencia (id estavel + set)
          grep -qF 'f._draftId=db.collection' "$EXH" || { echo "::error:: (12) draftId estavel ausente"; exit 1; }
          grep -qF "await db.collection('tasks').doc(f._draftId).set(_payload)" "$EXH" || { echo "::error:: (12) escrita idempotente ausente"; exit 1; }
          # 13 clique duplo bloqueado
          grep -qF 'if(f._saving)return; f._saving=true;' "$EXH" || { echo "::error:: (13) trava anti-duplo-clique ausente"; exit 1; }
          # 14 falha preserva wizard (state.form=null SO depois do try; catch NAO limpa a form)
          EXH="$EXH" node -e 's=require("fs").readFileSync(process.env.EXH,"utf8");var c=s.indexOf("const _cls=cronClassifyError(e);"),f=s.indexOf("const sector=f.sector;state.form=null;",c);if(!(c>0&&f>c)){console.error("(14) form limpa antes/no catch");process.exit(1);}'
          # 15 diagnostico sanitizado (canal aprovado)
          grep -qF 'window.desktopAPI.diagLog(topic, p)' "$EXH" || { echo "::error:: (15) diagLog sanitizado ausente"; exit 1; }
          grep -qF 'function cronClassifyError(' "$EXH" || { echo "::error:: (15) classificacao de erro ausente"; exit 1; }
          # 16 Card Premium intacto + 17 cache-bust (mensagem/URL no asar)
          grep -qF 'function buildClientMessage(' "$EXH" || { echo "::error:: (16) buildClientMessage ausente no asar"; exit 1; }
          grep -qF 'function buildShareClientUrl(' "$EXH" || { echo "::error:: (17) buildShareClientUrl (cache-bust) ausente no asar"; exit 1; }
          # 18 notificacoes intactas (renderer nao-produtor)
          grep -qF 'function notifScan(){}' "$EXH" || { echo "::error:: (18) renderer virou produtor (notifScan nao-vazio)"; exit 1; }
          # 19 SLA/sino intactos (Monitor no asar + correcao vermelha 1.0.199 no main)
          grep -qF 'sla-monitor' "$EXH" || { echo "::error:: (19) Monitor SLA ausente no asar"; exit 1; }
          node -e 'const c=require(process.env.RUNNER_TEMP+"/asarx/dist/main/cardsRules.js"); if(typeof c.shouldFireRedNotification!=="function"){console.error("(19) correcao vermelha 1.0.199 ausente");process.exit(1);}'
          # 20 Android intocado (o app.asar e desktop; nenhum caminho android empacotado)
          if [ -d "$EXDIR/android" ]; then echo "::error:: (20) android empacotado no asar"; exit 1; fi
          echo "GATE F3.5.4I EMPACOTADO (20 gates): VERIFIED"

      - name: Gate FLAGS do updater no app.asar (estrutural; build de teste NAO publica)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          US="$RUNNER_TEMP/asarx/dist/main/updaterService.js"; test -f "$US" || { echo "::error:: updaterService.js ausente"; exit 1; }
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowPrerelease != false"; exit 1; }
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"latest"' "$US" || { echo "::error:: channel != latest"; exit 1; }
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowDowngrade != false"; exit 1; }
          if grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"canary"' "$US"; then echo "::error:: channel=canary"; exit 1; fi
          echo "GATE flags do updater OK (estrutura stable/latest; nada publicado)."

      - name: Gate identidade Windows (AppUserModelId + appId + close-to-tray)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          MAINJS="$RUNNER_TEMP/asarx/dist/main/main.js"
          grep -q 'br.com.idseven.agenda.desktop' "$MAINJS" || { echo "::error:: AppUserModelId ausente"; exit 1; }
          grep -q 'setAppUserModelId' "$MAINJS" || { echo "::error:: setAppUserModelId ausente"; exit 1; }
          grep -q 'preventDefault' "$MAINJS" || { echo "::error:: close-to-tray ausente"; exit 1; }
          grep -q 'appId: br.com.idseven.agenda.desktop' electron-builder.yml || { echo "::error:: appId divergente"; exit 1; }
          echo "GATE identidade Windows OK."

      - name: Inspecao de ASSINATURA Authenticode (paridade 1.0.198)
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $exe = (Get-ChildItem dist-installer -Filter 'Agenda-ID-Seven-Desktop-*-x64.exe' | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          "EXE: $exe"; "AuthenticodeStatus: $($sig.Status)"
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'NotSigned') { Write-Error "Status inesperado: $($sig.Status)"; exit 1 }
          "PARIDADE 1.0.198: mesmo processo (sem cert -> NotSigned)."

      - name: Gate metadata de update (latest.yml 1.0.200 + blockmap + app-update.yml sem segredo; NADA e publicado)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          LY="dist-installer/latest.yml"; test -f "$LY" || { echo "::error:: latest.yml NAO gerado"; ls -la dist-installer || true; exit 1; }
          if [ -f "dist-installer/canary.yml" ]; then echo "::error:: canary.yml gerado"; exit 1; fi
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap 2>/dev/null | head -1); test -n "$BM" || { echo "::error:: blockmap NAO gerado"; exit 1; }
          AU="dist-installer/win-unpacked/resources/app-update.yml"; test -f "$AU" || { echo "::error:: app-update.yml NAO empacotado"; exit 1; }
          EXE_PATH=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); EXE_NAME=$(basename "$EXE_PATH")
          grep -q "version: $APP_VERSION" "$LY" || { echo "::error:: latest.yml version != $APP_VERSION"; exit 1; }
          grep -qE "^path: $EXE_NAME" "$LY" || { echo "::error:: latest.yml path != $EXE_NAME"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "$LY" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "$EXE_PATH" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error:: sha512 do latest.yml != EXE"; exit 1; }
          grep -q "provider: github" "$AU" && grep -q "owner: agidseven-lang" "$AU" && grep -q "repo: Agenda" "$AU" || { echo "::error:: app-update.yml provider/owner/repo divergente"; exit 1; }
          if grep -qiE '(token|secret|password|pat)[[:space:]]*[:=][[:space:]]*[^[:space:]]' "$AU"; then echo "::error:: app-update.yml com possivel segredo"; exit 1; fi
          echo "GATE metadata OK: latest.yml 1.0.200 + app-update.yml github SEM segredo (arquivos ficam SO no artifact)."

      - name: SBOM (CycloneDX via npm sbom) + fallback
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null
          if [ ! -s "$RUNNER_TEMP/sbom-cyclonedx.json" ]; then npm ls --all --json > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/sbom-cyclonedx.json"; fi
          wc -c "$RUNNER_TEMP/sbom-cyclonedx.json"

      - name: Empacotar bundle (instalador + metadata + SBOM + hashes)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"
          cp "$RUNNER_TEMP/sbom-cyclonedx.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.200-red-notification-boundary-fix (CANDIDATA — correcao do salvamento/envio de Cronograma)"
            echo "channel     : latest (estrutura do updater; NADA publicado)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "baseline    : Desktop 1.0.198 OFICIAL (commit 009f2c6; tag v1.0.198 preservada)"
            echo "origem      : F3.5.4H — correcao CIRURGICA do momento do disparo da notificacao NATIVA vermelha: dueAt/startAt canonicos persistidos (mesmo instante em todas as maquinas); GATE TEMPORAL VERMELHO puro shouldFireRedNotification (emite SO em [dueAt-10min, dueAt): nunca antes, 1x ao cruzar, sem repeticao, sem retro); edicao de prazo cancela o antigo (rev bump + dueAt novo); dedup com uid + legacyDedupKeys (migracao 1.0.198 sem duplicata). Layout 1.0.198 (card/monitor/sino) INTACTO; Categoria B (6 frozen) byte-identica; slaScheduler/cardsRules com DIFF CONTROLADO"
            echo "assinatura  : mesmo processo da 1.0.198 (sem code-signing -> NotSigned)"
            echo "distribuicao: CANDIDATA DE TESTE PRIVADA — SEM release, SEM tag, SEM stable/latest, SEM deploy; somente artifact p/ teste fisico do owner"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload installer (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.200-test-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload metadata + SBOM + hashes (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.200-test-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
