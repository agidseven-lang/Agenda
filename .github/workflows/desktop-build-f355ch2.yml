# F3.5.5C-H2 — Desktop 1.0.222 (Hotfix P0: Invalidação de Alertas Residuais de Tarefas Concluídas)
# build GATED, --publish never. Publicação SÓ no desktop-release-f355ch2.yml (mesmos bytes).
# Base de código 1.0.221 @ 98caad68 (Latest publicada); rollback técnico 1.0.221; baseline FÍSICA
# 1.0.218 @ 1a94515; adicional 1.0.216 @ e509f43. Delta: slaReminder.ts (taskGate/Barreiras 2-3 +
# invalidateTerminal/Barreira 1 + cleanupStale + auto-close "Esta tarefa já foi encerrada.") +
# main.ts (mapa canônico vivo de tasks + gate + invalidação na transição terminal + limpeza no 1º
# snapshot) + versão + suítes/provas/docs/workflows da fase + re-pins herdados. auth-core (H1),
# index.html, slareminder.html, store/janela do SLA, motores, preload, worker, functions e android
# CONGELADOS byte a byte vs 1.0.221 — regra máxima do owner: ZERO regressão no aprovado.
name: "[push/manual] F3.5.5C-H2 — Desktop 1.0.222 (Alertas Residuais) — Desktop Build"
"on":
  push:
    branches: ["desktop/f355c-h2-stale-alert-terminal-task-hotfix-1.0.222"]
    paths-ignore: [".github/workflows/desktop-release-f355ch2.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f355c-h2-stale-alert-terminal-task-hotfix-1.0.222"
  BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
  BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
  BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
  BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.221, 1.0.220, 1.0.218 e 1.0.216)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          git merge-base --is-ancestor "$BASE_221_SHA" HEAD || { echo "::error::não descende da 1.0.221"; exit 1; }
          git merge-base --is-ancestor "$BASE_220_SHA" HEAD || { echo "::error::não descende da 1.0.220"; exit 1; }
          git merge-base --is-ancestor "$BASE_218_SHA" HEAD || { echo "::error::não descende da 1.0.218"; exit 1; }
          git merge-base --is-ancestor "$BASE_216_SHA" HEAD || { echo "::error::não descende da 1.0.216"; exit 1; }
      - name: "Gate VERSAO 1.0.222 (package + lock x2 + description do hotfix + bases preservadas)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.222') process.exit(1); if(!/stale-alert-terminal-task-hotfix/.test(p.description||'')) process.exit(1); if(!/session-restore-boot-hotfix/.test(p.description||'')) process.exit(1); if(!/custom-script-quantity-rich-editor/.test(p.description||'')) process.exit(1);"
          [ "$(grep -c '"version": "1.0.222"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (index TODOS os blocos inline) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]);"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]);"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline (guarda + principal)');process.exit(1);}b.forEach(x=>new Function(x));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "Gate F3.5.5C-H2 — alertas residuais 53 (3 barreiras + limpeza + ciclos 20x + legítimos) [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
          node scripts/f355ch2-stale-alert.test.mjs
      - name: "Gate central herdado — f354l 56 (re-pinado: 'já foi encerrada' auto-close) + f354p 126 + f354q 94 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354q-task-idle-detection.test.mjs
      - name: "Gate F3.5.5C-H1 herdado — restauração de sessão 29 + auth-core 16 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355ch1-session-restore.test.mjs
          node scripts/f3356-auth-core.test.mjs
      - name: "Gate F3.5.5C herdado — quantidade + editor rico 128"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
      - name: "Gate F3.5.5C herdado — validador RTE do PORTAL 97"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-rte-worker-validator.test.mjs
      - name: "Gate F3.5.5B herdado — Agenda Premium 84"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355b-agenda-premium.test.mjs
      - name: "Gate F3.5.5A-H1 herdado — observações internas 72"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355ah1-internal-notes.test.mjs
      - name: "Gate F3.5.5A herdado — planner 98 + orquestrador 38 + central 33 + integração 25 (dist)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355a-execution-planner.test.mjs
          node scripts/f355a-orchestrator.test.mjs
          node scripts/f355a-execution-central.test.mjs
          node scripts/f355a-integration.test.mjs
      - name: "Gate REGRESSÃO canônica — som 37 + detalhes 74 + cards 53 + sessão 40"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354wh1-details-status-notes.test.mjs
          node scripts/f354w-compact-cards-details.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate PROVAS REAIS Electron — F3.5.5C-H2 (9 cenas: janela slareminder REAL, PNGs) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          timeout -k 15 500 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch2-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5C-H1 — boot de sessão (10 cenas) + ciclos 20x — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-electron-proof-main.js
          timeout -k 15 400 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-cycle-proof-main.js
      - name: "Gate SMOKE RTE herdado — 91 comportamentais no Chromium REAL"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 300 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-rte-behavior-main.js
      - name: "Gate PROVAS herdadas — F3.5.5C (32) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-proof-main.js
      - name: "Gate PARIDADE CRUZADA herdada — canônicos validados pelo Worker"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-canon-crossparity.mjs
      - name: "Gate PROVAS herdadas — F3.5.5B (20) + F3.5.5A-H1 (15) + F3.5.5A (25) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355b-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ah1-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355a-execution-proof-main.js
      - uses: actions/upload-artifact@v4
        with: { name: f355ch2-provas-qa, path: "docs/f355ch2-qa/**", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: f355ch2-provas-herdadas-qa, path: "docs/f355ch1-qa/**\ndocs/f355c-qa/**", if-no-files-found: error, retention-days: 30 }
      - name: "Gate ISOLAMENTO — delta vs 1.0.221 SÓ nos arquivos autorizados; congelados diff-vazio"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_221_SHA"..HEAD > /tmp/delta.txt; cat /tmp/delta.txt
          # allowlist F3.5.5C-H2: slaReminder.ts + main.ts (a correção) + versão + suítes/provas/docs/
          # workflows da fase + re-pins herdados de versão/comportamento-mandado (precedente F3.5.5C/H1)
          # + trilha da PUBLICAÇÃO H1 herdada na linhagem (release yml pinado — nenhum insumo de build).
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f355ch2\.yml$|\.github/workflows/desktop-release-f355ch1\.yml$|desktop/src/main/slaReminder\.ts$|desktop/src/main/main\.ts$|desktop/package(-lock)?\.json$|desktop/scripts/f355ch2-|desktop/scripts/f355ch1-|desktop/scripts/f354l-sla-central-persistent-reminders\.test\.mjs$|desktop/scripts/f354p-sla-decision-actions\.test\.mjs$|desktop/scripts/f355c-script-quantity-rich-editor\.test\.mjs$|desktop/scripts/f355c-proof-preload\.js$|desktop/scripts/f355b-agenda-premium\.test\.mjs$|desktop/scripts/f355b-proof-preload\.js$|desktop/scripts/f355ah1-internal-notes\.test\.mjs$|desktop/scripts/f355ah1-proof-preload\.js$|desktop/scripts/f355a-integration\.test\.mjs$|desktop/scripts/f354wh2-immediate-notification-sound\.test\.mjs$|desktop/scripts/f354vh1-session-persistence\.test\.mjs$|docs/f355ch2(-qa)?/)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist: $BAD"; exit 1; }
          # No MAIN, as ÚNICAS mudanças permitidas são slaReminder.ts + main.ts (Barreiras 1/2/3):
          MAINDELTA=$(git diff --name-only "$BASE_221_SHA"..HEAD -- desktop/src/main | sort | tr '\n' ' ')
          [ "$MAINDELTA" = "desktop/src/main/main.ts desktop/src/main/slaReminder.ts " ] || { echo "::error::main alterado além do esperado: $MAINDELTA"; exit 1; }
          # CONGELADOS byte-idênticos vs 1.0.221: auth-core (H1!) + renderers + store/janela do SLA +
          # motores + preload + sons + priorityEngine + build config + WORKER + worker-ops + Functions + Android.
          git diff --quiet "$BASE_221_SHA"..HEAD -- desktop/src/main/auth-core.ts desktop/src/main/slaReminderStore.ts desktop/src/main/slaReminderWindow.ts desktop/src/main/slaRules.js desktop/src/main/slaScheduler.ts desktop/src/main/taskIdle.ts desktop/src/main/taskIdleScheduler.ts desktop/src/main/taskIdleStore.ts desktop/src/main/executionOrchestrator.ts desktop/src/preload desktop/src/renderer/index.html desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/sounds desktop/src/renderer/priorityEngine.js desktop/scripts/copy-renderer.js desktop/tsconfig.json desktop/electron-builder.yml cloudflare-worker.js scripts/worker-ops functions android-native android-native-beta || { echo "::error::módulo congelado alterado"; exit 1; }
      - name: "Gate MARCADORES F3.5.5C-H2 — 3 barreiras + limpeza + aviso literal (fonte)"
        run: |
          set -euo pipefail
          grep -q 'taskGate' desktop/src/main/slaReminder.ts
          grep -q 'stale_terminal_task' desktop/src/main/slaReminder.ts
          grep -q 'stale_missing_task' desktop/src/main/slaReminder.ts
          grep -q 'stale_assignee_changed' desktop/src/main/slaReminder.ts
          grep -q 'invalidateTerminal' desktop/src/main/slaReminder.ts
          grep -q 'cleanupStale' desktop/src/main/slaReminder.ts
          grep -q 'onTaskGateReady' desktop/src/main/slaReminder.ts
          grep -q 'Esta tarefa já foi encerrada.' desktop/src/main/slaReminder.ts
          grep -q 'deferred_awaiting_snapshot' desktop/src/main/slaReminder.ts
          grep -q 'sla.stale.cleanup.scan' desktop/src/main/slaReminder.ts
          grep -q 'slaTaskMapReady' desktop/src/main/main.ts
          grep -q 'invalidateTerminal' desktop/src/main/main.ts
          grep -q 'slaPanelDelivered(t)) return "terminal"' desktop/src/main/main.ts
          # H1 preservado (fonte):
          grep -q 'server_unauthorized_confirmed' desktop/src/main/auth-core.ts
          grep -q 'authRetryNow' desktop/src/renderer/index.html
          echo "MARCADORES F3.5.5C-H2: VERIFIED."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão + 3 barreiras + herdados no app.asar (suítes contra o pacote)"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.222') process.exit(1);"
          # correção H2 nos BYTES do pacote (controlador compilado + wiring):
          grep -q 'stale_terminal_task' asar-x/dist/main/slaReminder.js
          grep -q 'cleanupStale' asar-x/dist/main/slaReminder.js
          grep -q 'Esta tarefa já foi encerrada.' asar-x/dist/main/slaReminder.js
          grep -q 'deferred_awaiting_snapshot' asar-x/dist/main/slaReminder.js
          grep -q 'slaTaskMapReady' asar-x/dist/main/main.js
          # H1 intacto no pacote:
          grep -q 'server_unauthorized_confirmed' asar-x/dist/main/auth-core.js
          grep -q 'authRetryNow' asar-x/src/renderer/index.html
          # herdados intactos no pacote:
          grep -q 'id="fScriptQty"' asar-x/src/renderer/index.html
          grep -q 'function rteSanitize' asar-x/src/renderer/index.html
          grep -q "CHECK-IN DE EXECUÇÃO" asar-x/src/renderer/slareminder.html
          test -f asar-x/dist/main/executionOrchestrator.js
          grep -q 'mode: "off"' asar-x/dist/main/main.js
          # SUÍTES DA FASE contra os BYTES EMPACOTADOS:
          SLA_DIST=asar-x/dist/main node scripts/f355ch2-stale-alert.test.mjs
          AUTH_CORE_SRC=asar-x/dist/main/auth-core.js node scripts/f355ch1-session-restore.test.mjs
          # herdadas contra o pacote:
          SRC=asar-x/src/renderer/index.html WSRC=../cloudflare-worker.js node scripts/f355c-script-quantity-rich-editor.test.mjs
          SRC=asar-x/src/renderer/index.html node scripts/f355b-agenda-premium.test.mjs
          SRC=asar-x/src/renderer/index.html node scripts/f355ah1-internal-notes.test.mjs
          SRC=asar-x/src/renderer/index.html BG_SRC=asar-x/src/renderer/bgnotify.html MAIN_SRC=src/main/main.ts BGM_SRC=src/main/bgNotify.ts node scripts/f354wh2-immediate-notification-sound.test.mjs
          SRC=asar-x/src/renderer/index.html node scripts/f354wh1-details-status-notes.test.mjs
          echo "GATE F3.5.5C-H2 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.222"; echo "rotulo      : 1.0.222-f355ch2-stale-alert-terminal-task-hotfix (CANDIDATA — Correção de Alertas Residuais)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.221 (commit 98caad68)"; echo "rollback    : técnico 1.0.221 (98caad68); físico 1.0.218 (1a94515); adicional 1.0.216 (e509f43)"; echo "origem      : F3.5.5C-H2 — HOTFIX P0 da invalidação de alertas residuais de tarefas concluídas. O documento canônico da tarefa é a AUTORIDADE: (B1) transição terminal (concluída/cancelada/removida, por QUALQUER usuário/dispositivo) invalida fila+pendentes+check-ins do taskId, e modal aberto vira o aviso 'Esta tarefa já foi encerrada.' SEM botões, com recibo imediato e fechamento automático; (B2) NENHUM modal bloqueante é exibido sem revalidar a tarefa no snapshot atual (terminal/inexistente/responsável trocado ⇒ recibo-lápide com motivo stale_*); (B3) o replay do boot só apresenta APÓS o 1º snapshot — boot offline não bloqueia por cache e não apaga nada. Limpeza reparadora local auditável (contagem primeiro; remove SÓ resíduos comprovados; por taskId; nunca altera a tarefa). Alertas legítimos (atrasada/parada/bloqueio real) PRESERVADOS; 5 botões preservados; check-in/Acompanhamento/sons/dedup/recibos/histórico intactos; sessão automática da 1.0.221 intacta; updater INALTERADO (a máquina na 1.0.219 recebe o Latest pelo fluxo normal)."; echo "distribuicao: CANDIDATA — publicação no Latest ocorre no workflow desktop-release-f355ch2.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.222-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.222-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
