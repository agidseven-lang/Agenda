# =====================================================================
# F3.5.6A-H5 — Publicacao da Desktop 1.0.234 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.234 (F3.5.6A-H5 — P0 FISICO: 1.0.233 REPROVADA no Cenario B). No modal "Enviar no
# grupo do cliente" o botao "Confirmar envio ao cliente" estava VISIVEL mas INERTE (nascia disabled;
# so armado por copiar/abrir; handler abortava em if(b.disabled)return). Correcao SO no renderer
# index.html: botao NASCE habilitado (clique = confirmacao explicita; gerar link != envio; nao marca
# automaticamente); handler ramifica no resultado real (sucesso -> "Envio confirmado ao cliente";
# falha -> reabilita + rotulo restaurado + toast de erro; tarefa segue "Temas prontos");
# wfConfirmClientSend RETORNA o resultado; idempotencia. "enviado" canonico continua EXCLUSIVO do
# Worker. Worker V64.61 INALTERADO (zero deploy). REGRA MAXIMA: correcao H4 1.0.233 preservada;
# Central 1.0.231, workflow 1.0.230/1.0.229 e infra de notificacoes 1.0.228 INTOCADAS; paridade
# renderer×main (golden master F3.4.4) mantida (slaRules.js INALTERADO).
# NATUREZA: mudanca de PRODUCAO em SO 1 arquivo vs 1.0.233 — desktop/src/renderer/index.html.
# BASE TECNICA: 1.0.233 (F3.5.6A-H4) @ b176e41. BASELINE FISICA OFICIAL: 1.0.228 (FISICAMENTE APROVADA).
# ROLLBACK IMEDIATO: v1.0.228. NAO promover 1.0.229..1.0.233.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.6A-H5 31286990527 (gated, verde nos 2 jobs; --publish
# never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests,
# 5 hashes SHA-256, tag v1.0.234 no head EXATO. 6 assets. ESCRITAS so via GitHub App "Agenda ID Seven
# Release Bot". A publicacao NAO e aprovacao fisica — o owner testara: criar -> Enviar -> Confirmar.
# =====================================================================
name: "F3.5.6A-H5 Desktop Release — 1.0.234 no canal do updater (botão Confirmar envio funcional; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356ah5-confirm-send-button-1.0.234"
    paths:
      - ".github/workflows/desktop-release-f356ah5.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A-H5; run de build 31286990527 verde nos 2 jobs) ──
      RUN_ID: "31286990527"
      STABLE_SHA: "3285a45ff40c4bcfb1b28c53819455d515af912a"
      TEST_BRANCH: "desktop/f356ah5-confirm-send-button-1.0.234"
      BASE_233_SHA: "b176e41c8be801f7d5d63fc8d2a9b9be42c643f3"
      BASE_232_SHA: "2ce29a7db056a99b1722c11287e0919dd0ce2c43"
      BASE_231_SHA: "a378e5c1f2f4217249252eae7e261e17580c2050"
      BASE_230_SHA: "e89867de5120fe88e2f639effd59d24c3181f427"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      TAG: "v1.0.234"
      TITLE: "Agenda ID Seven Desktop 1.0.234 — botão Confirmar envio ao cliente funcional"
      ART_INST: "agenda-id-seven-desktop-1.0.234-installer"
      ART_INST_DIGEST: "sha256:275e6083b5059fc11a87fb61093c343899bfab39ca7892098292b1aa7e0624a8"
      ART_META: "agenda-id-seven-desktop-1.0.234-updatemeta"
      ART_META_DIGEST: "sha256:03c86eda0a43fe22eb644c1ffb244dbf4dd6575bd37700c567c8b819f7075f03"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.234-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.234-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.234-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "c3096f83be437859428ea3d270203c6a530f9a087463c17c870ca8f2ced618b7"
      EXP_MSI: "bb33d26814be9232a610a7b9cbe738070fe36771e9eae54acde3ec1ecf8e29c4"
      EXP_LY: "6630de1d06059db1a9e7001ecf19d4d973207ec9680d397cd409aa80a5263f10"
      EXP_BM: "7adb173d3ea0e60b07ae60fe41fd7701a004116fa5def4beba0738e9e142aca5"
      EXP_SBOM: "97862d30b3625d166812b22d352d62a938d2a1c9190ab3e38c9d394be3954ba1"
      PREV_LATEST_TAG: "v1.0.233"
      PRES_232_TAG: "v1.0.232"
      PRES_231_TAG: "v1.0.231"
      PRES_230_TAG: "v1.0.230"
      PRES_228_TAG: "v1.0.228"
      PROD_ROLLBACK_TAG: "v1.0.223"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A-H5)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A-H5 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356ah5\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_233_SHA" "$BASE_232_SHA" "$BASE_231_SHA" "$BASE_230_SHA" "$BASE_228_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.233/1.0.232/1.0.231/1.0.230/1.0.228 na linhagem"

      - name: "Gate 3 — release v1.0.234 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.234" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.234"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.234" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.234"; exit 1; }
          grep -q "1.0.234-f356ah5-confirm-send-button" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.234/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.234 — botão "Confirmar envio ao cliente" funcional

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).

          CONTEXTO (P0 FÍSICO): a 1.0.233 foi REPROVADA no Cenário B. No modal "Enviar no grupo
          do cliente", o botão "Confirmar envio ao cliente" estava VISÍVEL mas INERTE — clicar
          não produzia ação alguma; o Cenário B não podia ser concluído.

          CAUSA-RAIZ (PROVADA por auditoria + RED empacotado que CLICA o botão REAL): o botão
          nascia `disabled` e só era habilitado ao clicar "Abrir WhatsApp"/"Copiar mensagem"
          (wfArmConfirmSend); o handler abortava logo em `if(b.disabled)return`. No fluxo real
          do owner (criar -> Enviar -> Confirmar direto, sem copiar/abrir), o botão permanecia
          desabilitado e o clique não fazia nada — sem qualquer feedback. Defeito latente que a
          correção H4 (Cenário A) apenas expôs, por ser a 1ª vez que o passo de confirmação era
          alcançado. Segundo defeito: o handler ignorava o resultado e marcava "Envio confirmado"
          mesmo em falha, sem reabilitar.

          O QUE MUDA vs 1.0.233 (correção cirúrgica em 1 arquivo de produção — só o renderer):
          - o botão NASCE habilitado — o clique É a confirmação explícita (gerar link continua
            NÃO significando envio; nada é marcado automaticamente);
          - ao clicar: estado "Confirmando…" + trava anti-duplo-clique (idempotência); em SUCESSO
            server-side (via Worker) o botão vira "Envio confirmado ao cliente"; em FALHA
            (sessão/token/rede/Worker/HTTP) o botão REABILITA, o rótulo é restaurado e aparece o
            aviso "Não foi possível confirmar o envio ao cliente. Tente novamente." — erro NUNCA
            silencioso; a tarefa permanece "Temas prontos" (zero falso envio);
          - teclado e mouse funcionam (button nativo habilitado).

          O QUE NÃO MUDA (preservado; garantido por gate):
          - a correção H4 (1.0.233): gerar link ≠ ENVIO; "enviado" canônico continua EXCLUSIVO
            do Worker (confirmClientSend);
          - o Worker V64.61 em produção está CORRETO e INALTERADO (nenhum deploy);
          - a Central compacta+drawer (1.0.231), o workflow (1.0.230/1.0.229) e TODA a
            infraestrutura de notificações 1.0.228 FISICAMENTE APROVADA — byte-idênticas;
          - a paridade renderer×main (golden master F3.4.4) — slaRules.js sem qualquer alteração.
          Delta de produção vs 1.0.233: SOMENTE desktop/src/renderer/index.html.

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows:
          criar tarefa -> Enviar ao cliente -> clicar "Confirmar envio ao cliente" -> o botão
          funciona, confirma, e o card muda para "Temas enviados ao cliente". A publicação não é
          aprovação física. Em caso de problema: ROLLBACK IMEDIATO v1.0.228 (baseline física);
          NÃO promover 1.0.229..1.0.233; todas as versões anteriores permanecem publicadas.

          Procedência: run de build F3.5.6A-H5 31286990527 (success; --publish never; verify +
          Windows verdes: RED empacotado que CLICA o botão REAL — 1.0.233 inerte, 1.0.234
          funciona + falha/retry + idempotência; REDs herdados H4/H3 GREEN em 1.0.234; golden
          master F3.4.4 9/9; suíte f356a 128/128; bateria herdada completa; isolamento: delta de
          produção vs 1.0.233 SÓ em index.html; slaRules.js e infra de notificações 1.0.228
          byte-idênticos) @ commit 3285a45ff40c4bcfb1b28c53819455d515af912a
          (branch desktop/f356ah5-confirm-send-button-1.0.234). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.234 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.234; 1.0.233/1.0.232/1.0.231/1.0.230/1.0.228 preservadas; rollback 1.0.223 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_232_TAG" "$PRES_231_TAG" "$PRES_230_TAG" "$PRES_228_TAG" "$PROD_ROLLBACK_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.234 no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228 (baseline fisica); 1.0.233/1.0.232/1.0.231/1.0.230/1.0.228 preservadas; NAO promover 1.0.229..1.0.233 ====="
