# =====================================================================
# [manual] I7.28.3 - PUBLIC UPDATER CANARY (Desktop 1.0.254 -> feed PUBLICO -> 1.0.255)
# ---------------------------------------------------------------------
# Espelha o precedente canonico imediato (desktop-canary-1.0.254-final.yml,
# ciclo publico do updater 253->254, PASS) com o delta da linha 1.0.255 +
# SESSAO B e SESSAO C grafadas VERBATIM das sessoes provadas do build canonico
# 33962815581 (desktop-build-1.0.255-final.yml, 18/18 SUCCESS): TASK CARD
# TC/HOV + HOJE H1-H18 + OPTION B SB/CN/NAV + freeze T/D/C/Hub + E1 manifest
# (Sessao B) e BRAND oficial + NOTIFICACAO light/dedupe (IPC real) + PARIDADE
# SLA + MATRIZ no modulo EMPACOTADO + DIALOG central do asar (Sessao C).
# Release publico 1.0.255 = release id 383332561 (tag v1.0.255 -> 03a1e663),
# publicado pelo release run 33983448781 (SUCCESS). Os builds falhos
# 33888724687 (classe C), 33961471601 e 33962039838 (classe B) NAO sao fonte
# de nada (nem updater, nem asset, nem bundle, nem evidencia, nem proveniencia).
#
# CONSUMIDOR PURO DA PRODUCAO PUBLICA. Esta fase NAO:
#   - cria tag / cria release / altera Latest / altera latest.yml / publica asset
#   - executa desktop-release / gera novo build do produto / toca RC_RELEASE_GO
#   - reescreve app-update.yml / usa feed local ou mock / instala 1.0.255 direto
# Usa EXCLUSIVAMENTE os Releases publicos v1.0.254 e v1.0.255 ja existentes e o
# app-update.yml REAL embarcado no instalador publico 1.0.254. O setup de QA da
# baseline herda a MITIGACAO classe B do build-255 (3 tentativas, verdade pelo
# resultado, diagnostico em canary255-baseline-install.json).
#
# FAIL-CLOSED: aborta antes de instalar se qualquer pre-condicao publica
# estiver incorreta (Latest, tag->sha, release id/flags, 6 assets, pins sha256).
# PowerShell 5.1: strings/scripts criticos 100% ASCII. Execucao manual apenas.
# =====================================================================
name: "[manual] I7.28.3 - Public Updater Canary 1.0.254 -> 1.0.255"
"on":
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OWNER_REPO: "agidseven-lang/Agenda"
  PRODUCT_SOURCE_SHA: "03a1e663f7365346c78831af165939a759ec1cbd"
  EXPECTED_VERSION: "1.0.255"
  BASELINE_VERSION: "1.0.254"
  LATEST_TAG: "v1.0.255"
  BASELINE_TAG: "v1.0.254"
  EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.255-x64.exe"
  BASELINE_EXE: "Agenda-ID-Seven-Desktop-1.0.254-x64.exe"
  APPROVED_EXE_SHA256: "ee82312592cd9d27338ea1fb317d86bf3e9b7e4c764098eed5734c9ae766d7a7"
  MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.255-x64.msi"
  # ---- PINS DO RELEASE PUBLICO v1.0.255 (release id + sha256 dos 6 assets do bundle canonico 33962815581; publicados pelo release run 33983448781):
  EXPECTED_RELEASE_ID: "383332561"
  EXPECTED_EXE_BYTES: "82513531"
  EXPECTED_MSI_SHA256: "72d51b412633ddf34b63a9d40f0cfb00cd49d7dd509b76614ca162a2dbe93bdd"
  EXPECTED_BLOCKMAP_SHA256: "bc9648e66901ef56e5cee1cf839f9485a21b691eaa93528e686fc235a522b532"
  EXPECTED_LATESTYML_SHA256: "d46e4f559d2276be9862c1adc5bd9aa3096a48790bce41765731e589d504def3"
  EXPECTED_SHA256SUMS_SHA256: "ce4fb2e909349f296d448c24069c8cd5409a6b1401d66b25d4942ed1871eae85"
  EXPECTED_VERSAOTXT_SHA256: "d76ded9f9d286082a5ef58166e98a64a8a1fa08c87b7767bea19540b6aad0fd8"
  # ---- PINS DA BASELINE PUBLICA v1.0.254 (rollback preservado; SHA256SUMS publico):
  BASELINE_EXE_SHA256: "a72d7e77a6e8b94f11c5b6a473bed0c1bf33404c1787cf33ba53300b521de3d5"
  BASELINE_EXE_BYTES: "82502436"

jobs:
  public-updater-canary:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: "Git sem conversao CRLF"
        run: git config --global core.autocrlf false

      - name: "GATE — PRE-CONDICOES PUBLICAS (fail-closed, antes de instalar)"
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary"
          api() { curl -sSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_API_TOKEN" "$@"; }
          LT=$(api "https://api.github.com/repos/$OWNER_REPO/releases/latest" | jq -r .tag_name)
          [ "$LT" = "$LATEST_TAG" ] || { echo "::error::Latest publico=$LT != $LATEST_TAG"; exit 1; }
          TS=$(api "https://api.github.com/repos/$OWNER_REPO/commits/$LATEST_TAG" | jq -r .sha)
          [ "$TS" = "$PRODUCT_SOURCE_SHA" ] || { echo "::error::tag $LATEST_TAG sha=$TS != $PRODUCT_SOURCE_SHA"; exit 1; }
          for T in "$BASELINE_TAG" "$LATEST_TAG"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_API_TOKEN" "https://api.github.com/repos/$OWNER_REPO/releases/tags/$T")
            [ "$code" = "200" ] || { echo "::error::release $T ausente (http $code)"; exit 1; }
          done
          REL="$RUNNER_TEMP/canary/public-release-255.json"
          api "https://api.github.com/repos/$OWNER_REPO/releases/tags/$LATEST_TAG" > "$REL"
          RID=$(jq -r .id "$REL")
          [ "$RID" = "$EXPECTED_RELEASE_ID" ] || { echo "::error::release $LATEST_TAG id=$RID != $EXPECTED_RELEASE_ID"; exit 1; }
          [ "$(jq -r .draft "$REL")" = "false" ] || { echo "::error::release $LATEST_TAG e draft"; exit 1; }
          [ "$(jq -r .prerelease "$REL")" = "false" ] || { echo "::error::release $LATEST_TAG e prerelease"; exit 1; }
          NA=$(jq '.assets|length' "$REL")
          [ "$NA" = "6" ] || { echo "::error::release $LATEST_TAG tem $NA assets != 6"; exit 1; }
          # PARIDADE PUBLICA 6/6: sha256 de cada asset publico == pin do bundle canonico (run 33962815581).
          # Fonte: digest da API (sha256:...) quando presente; senao download do asset publico + sha256sum. Sem mutacao.
          PAR=0
          chk() {
            local n="$1" e="$2" d src
            d=$(jq -r --arg n "$n" '[.assets[]|select(.name==$n)|(.digest // "")][0] // ""' "$REL" | sed 's/^sha256://')
            if [ -z "$d" ]; then
              curl -sSL -o "$RUNNER_TEMP/canary/pub-$n" "https://github.com/$OWNER_REPO/releases/download/$LATEST_TAG/$n"
              d=$(sha256sum "$RUNNER_TEMP/canary/pub-$n" | awk '{print $1}'); src="download"
            else src="api-digest"; fi
            [ "$d" = "$e" ] || { echo "::error::asset publico $n sha256=$d != pin $e ($src)"; exit 1; }
            echo "PARITY $n: $d ($src)"; PAR=$((PAR+1))
          }
          chk "$EXE_NAME" "$APPROVED_EXE_SHA256"
          chk "$EXE_NAME.blockmap" "$EXPECTED_BLOCKMAP_SHA256"
          chk "$MSI_NAME" "$EXPECTED_MSI_SHA256"
          chk "latest.yml" "$EXPECTED_LATESTYML_SHA256"
          chk "SHA256SUMS" "$EXPECTED_SHA256SUMS_SHA256"
          chk "VERSAO-DESKTOP.txt" "$EXPECTED_VERSAOTXT_SHA256"
          [ "$PAR" = "6" ] || { echo "::error::paridade publica $PAR/6"; exit 1; }
          FEED_URL="https://github.com/$OWNER_REPO/releases/download/$LATEST_TAG/latest.yml"
          curl -sSL -o "$RUNNER_TEMP/canary/public-latest.yml" "$FEED_URL"
          grep -q "^version: $EXPECTED_VERSION$" "$RUNNER_TEMP/canary/public-latest.yml" || { echo "::error::latest.yml publico version != $EXPECTED_VERSION"; exit 1; }
          FY_SHA=$(sha256sum "$RUNNER_TEMP/canary/public-latest.yml" | awk '{print $1}')
          [ "$FY_SHA" = "$EXPECTED_LATESTYML_SHA256" ] || { echo "::error::latest.yml publico sha256=$FY_SHA != pin $EXPECTED_LATESTYML_SHA256"; exit 1; }
          jq -n --arg url "$FEED_URL" --arg ver "$EXPECTED_VERSION" --arg sha "$FY_SHA" \
            --arg latest "$LT" --arg tagsha "$TS" --arg rid "$RID" \
            '{feedType:"PUBLIC GITHUB RELEASE (provider github, channel latest)", publicLatestYmlUrl:$url, latestYmlVersion:$ver, latestYmlSha256:$sha, repoLatestTag:$latest, tagCommitSha:$tagsha, releaseId:$rid, draft:false, prerelease:false, assets:6, publicAssetParity:"6/6", localhost:false, mock:false}' \
            > "$RUNNER_TEMP/canary/canary255-public-feed-proof.json"
          {
            echo "== I7.28.3 PRECONDITIONS =="
            echo "PUBLIC LATEST TAG: $LT"
            echo "TAG $LATEST_TAG -> SHA: $TS (== $PRODUCT_SOURCE_SHA)"
            echo "RELEASE $BASELINE_TAG EXISTS: YES (rollback preservado)"
            echo "RELEASE $LATEST_TAG EXISTS: YES (id=$RID draft=false prerelease=false assets=6)"
            echo "PUBLIC ASSET PARITY vs bundle canonico 33962815581: 6/6"
            echo "PUBLIC latest.yml VERSION: $EXPECTED_VERSION (sha256=$FY_SHA)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "AUDITORIA BYTE DO FEED PUBLICO 1.0.255 (latest.yml path/size/sha512 + sha256==build aprovado)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          curl -sSL -o public-255.exe "https://github.com/$OWNER_REPO/releases/download/$LATEST_TAG/$EXE_NAME"
          grep -q "url: $EXE_NAME" public-latest.yml || { echo "::error::latest.yml path != $EXE_NAME"; exit 1; }
          SIZE=$(stat -c%s public-255.exe)
          [ "$SIZE" = "$EXPECTED_EXE_BYTES" ] || { echo "::error::exe publico size=$SIZE != $EXPECTED_EXE_BYTES"; exit 1; }
          grep -q "size: $SIZE" public-latest.yml || { echo "::error::latest.yml size != $SIZE"; exit 1; }
          SHA512=$(openssl dgst -sha512 -binary public-255.exe | base64 -w0)
          grep -q "$SHA512" public-latest.yml || { echo "::error::latest.yml sha512 nao bate com o installer publico"; exit 1; }
          S256=$(sha256sum public-255.exe | awk '{print $1}')
          [ "$S256" = "$APPROVED_EXE_SHA256" ] || { echo "::error::sha256 do exe publico=$S256 != build aprovado $APPROVED_EXE_SHA256"; exit 1; }
          echo "PUBLIC FEED BYTE AUDIT OK (size=$SIZE sha256=$S256 sha512=match)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "BASELINE PUBLICA v1.0.254 — download + verificacao SHA256SUMS"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          BASE="https://github.com/$OWNER_REPO/releases/download/$BASELINE_TAG"
          curl -sSL -o baseline.exe "$BASE/$BASELINE_EXE"
          curl -sSL -o baseline-SHA256SUMS "$BASE/SHA256SUMS"
          EXP=$(grep "$BASELINE_EXE\$" baseline-SHA256SUMS | awk '{print $1}')
          GOT=$(sha256sum baseline.exe | awk '{print $1}')
          [ -n "$EXP" ] && [ "$EXP" = "$GOT" ] || { echo "::error::baseline 1.0.254 sha256 nao confere exp=$EXP got=$GOT"; exit 1; }
          [ "$GOT" = "$BASELINE_EXE_SHA256" ] || { echo "::error::baseline 1.0.254 sha256=$GOT != pin $BASELINE_EXE_SHA256"; exit 1; }
          BSZ=$(stat -c%s baseline.exe)
          [ "$BSZ" = "$BASELINE_EXE_BYTES" ] || { echo "::error::baseline 1.0.254 size=$BSZ != $BASELINE_EXE_BYTES"; exit 1; }
          echo "BASELINE PUBLIC ASSET: $BASELINE_EXE (sha256=$GOT)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "INSTALAR 1.0.254 (/S; MITIGACAO classe B: ate 3 tentativas + verdade pelo resultado + diagnostico) + CONFIRMAR FEED PUBLICO REAL (app-update.yml embarcado)"
        shell: powershell
        run: |
          # MITIGACAO classe B herdada do build canonico 1.0.255 (run 33962815581): nos runs falhos 33961471601 e
          # 33962039838 o NSIS /S da baseline PUBLICA 1.0.254 (SHA256 verificado no passo anterior) saiu com
          # -1073741819 (0xC0000005) em runners windows-2025 identicos ao do run em que o MESMO binario instalou.
          # Este passo e SETUP DE QA do canary (instala a producao publica 1.0.254 para provar o update publico
          # 254->255) - nada de produto/build. Regra: ate 3 tentativas; a verdade e o RESULTADO (diretorio + exe +
          # app.asar presentes), nao o codigo de saida; codigos != 0 e eventos de crash do Windows ficam em
          # canary255-baseline-install.json. A Sessao A segue provando que o app instalado e a 1.0.254 (a1/a4).
          $log = @()
          $dir = $null
          for ($i = 1; $i -le 3; $i++) {
            $t0 = Get-Date
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\canary\baseline.exe" -ArgumentList "/S" -Wait -PassThru
            $code = [int64]$p.ExitCode
            Start-Sleep -Seconds 5
            $dir = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue | Where-Object { (Test-Path (Join-Path $_.FullName "Agenda ID Seven Desktop.exe")) -and (Test-Path (Join-Path $_.FullName "resources\app.asar")) } | Select-Object -First 1
            $ev = @()
            try {
              $raw = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $t0.AddSeconds(-5) } -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting|\.NET Runtime' } | Select-Object -First 5)
              foreach ($r in $raw) { $m = [string]$r.Message; $m = ($m -replace '\s+', ' '); if ($m.Length -gt 400) { $m = $m.Substring(0, 400) }; $ev += ($r.ProviderName + ': ' + $m) }
            } catch { }
            $hex = '0x{0:X8}' -f ($code -band 0xFFFFFFFF)
            $log += [pscustomobject]@{ attempt = $i; exitCode = $code; exitHex = $hex; installed = [bool]$dir; dir = $(if ($dir) { $dir.FullName } else { '' }); events = $ev; at = $t0.ToString('o') }
            if ($code -ne 0) { Write-Host ("AVISO: NSIS /S da baseline saiu com {0} ({1}) na tentativa {2}" -f $code, $hex, $i) }
            foreach ($e in $ev) { Write-Host ("  evento: " + $e) }
            if ($dir) { break }
            if ($i -lt 3) { Start-Sleep -Seconds 10 }
          }
          ConvertTo-Json -InputObject $log -Depth 4 | Out-File -FilePath "$env:RUNNER_TEMP\canary\canary255-baseline-install.json" -Encoding utf8
          if (-not $dir) { Write-Error "baseline 1.0.254 nao instalada apos 3 tentativas (ver canary255-baseline-install.json)"; exit 1 }
          "INSTALL_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("baseline 1.0.254 instalada em: {0} (tentativas: {1}; exit da ultima: {2})" -f $dir.FullName, $log.Count, $log[-1].exitCode)
          $au = Join-Path $dir.FullName "resources\app-update.yml"
          if (-not (Test-Path $au)) { Write-Error "app-update.yml ausente no pacote instalado"; exit 1 }
          Copy-Item $au "$env:RUNNER_TEMP\canary\installed-app-update.yml"
          $auTxt = Get-Content $au -Raw
          Write-Host "---- app-update.yml (instalado) ----"; Write-Host $auTxt
          if ($auTxt -notmatch "provider:\s*github")      { Write-Error "app-update.yml nao e provider github"; exit 1 }
          if ($auTxt -notmatch "owner:\s*agidseven-lang") { Write-Error "app-update.yml owner incorreto"; exit 1 }
          if ($auTxt -notmatch "repo:\s*Agenda")          { Write-Error "app-update.yml repo incorreto"; exit 1 }
          if ($auTxt -match "127\.0\.0\.1" -or $auTxt -match "localhost") { Write-Error "feed LOCAL detectado - proibido no canary publico"; exit 1 }
          "UPDATE FEED TYPE: PUBLIC GITHUB RELEASE (github/agidseven-lang/Agenda, channel latest; sem localhost)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: "Preparar harness (Playwright + @electron/asar; NENHUM code de produto)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright@1.47.2 @electron/asar --no-audit --no-fund

      - name: "SESSION A — 1.0.254 REAL: baseline funcional + check(feed publico) -> 1.0.255 -> download(sha512) -> install /S"
        timeout-minutes: 20
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          cat > canary-a.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const out = { g: {} }; const g = out.g;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const app = await _electron.launch({ executablePath: exe, args: [] });
          const pg = await app.firstWindow({ timeout: 45000 });
          const perr = []; pg.on('pageerror', e => perr.push(String(e).slice(0, 160)));
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          try { await app.evaluate(({ BrowserWindow }) => { const w = BrowserWindow.getAllWindows()[0]; if (w) w.setContentSize(1920, 1080); }); } catch (_) {}
          await pg.waitForTimeout(800);
          const before = await pg.evaluate(() => ({
            ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null,
            upd: !!(window.desktopAPI && window.desktopAPI.updater),
            innerW: window.innerWidth,
            isDesktop: (typeof isDesktop === 'function') ? isDesktop() : null,
            white: (document.body.innerText || '').trim().length < 2
          }));
          const st = () => pg.evaluate(() => window.desktopAPI.updater.getState());
          const st0 = before.upd ? await st() : null;
          out.before = { ...before, st: st0 };
          g.a1_baselineIs254 = before.ver === '1.0.254';
          g.a2_updaterApi = before.upd === true;
          g.a3_appLaunch = before.white === false;
          g.a4_installedVersion254 = !!st0 && st0.installedVersion === '1.0.254';
          g.a5_channelLatest = !!st0 && st0.channel === 'latest';
          g.a6_allowPrereleaseFalse = !!st0 && st0.allowPrerelease === false;
          g.a7_desktopViewport = before.innerW >= 1900 && before.isDesktop === true;
          // baseline funcional minima (origem real do upgrade): light UI + sidebar + board
          const base = await pg.evaluate(() => {
            try {
              state.user = { id: 'carlos', name: 'Carlos Eduardo', role: 'Social Media', admin: true };
              state.users = [state.user];
              document.body.classList.add('desktop', 'authed', 'light-ui');
              const asp = document.getElementById('authSplash'); if (asp) asp.style.display = 'none';
              const lg = document.getElementById('login'); if (lg) lg.classList.add('hidden');
              const ap = document.getElementById('app'); if (ap) ap.style.display = 'flex';
              state.tasks = [{ id: 'b1', title: 'Baseline 254', client: 'QA', sector: 'edicao_cards', by: 'carlos', assigneeId: 'carlos', status: 'afazer', dueDate: '2026-08-30' }];
              state.tab = 'tarefas'; state.personBoard = 'carlos'; render();
            } catch (e) { return { err: String(e) }; }
            return {
              lightUi: document.body.classList.contains('light-ui'),
              sidebar: document.querySelectorAll('.nav .sb-item').length >= 5,
              more: !!document.querySelector('.nav .sb-more>summary'),
              newTask: !!document.querySelector('.new-task-btn'),
              client: !!document.querySelector('.nav [data-flowclient]'),
              lanes: document.querySelectorAll('.kbv2-column').length,
              cards: document.querySelectorAll('.kbv2-card').length
            };
          });
          out.baseline = base;
          g.a8_baselineLightUi = base.lightUi === true;
          g.a9_baselineSidebar = base.sidebar === true && base.more === true && base.newTask === true && base.client === true;
          g.a10_baselineBoard = base.lanes === 4 && base.cards === 1;
          // CHECK contra o FEED PUBLICO real (app-update.yml embarcado = github provider)
          const poll = async (want, ms) => { const t0 = Date.now(); for (;;) { const s = await st(); if (want.includes(s.status)) return s; if (s.status === 'error') return s; if (Date.now() - t0 > ms) return s; await sleep(500); } };
          await pg.evaluate(() => { window.desktopAPI.updater.check(); });
          let s = await poll(['update_available', 'up_to_date', 'error'], 60000);
          out.checkResult = { status: s.status, availableVersion: s.availableVersion, error: s.error };
          g.b1_updateAvailable = s.status === 'update_available';
          g.b2_availableIs255 = s.availableVersion === '1.0.255';
          // PROVA autoDownload=false (comportamento real aprovado): sem download(), NAO progride
          await sleep(4000);
          const sIdle = await st();
          out.afterCheckIdle = { status: sIdle.status, downloaded: sIdle.downloaded };
          g.b3_noAutoDownloadBeforeAction = sIdle.status === 'update_available' && sIdle.downloaded === false;
          // DOWNLOAD explicito (lib valida sha512 do latest.yml PUBLICO contra o installer PUBLICO)
          await pg.evaluate(() => { window.desktopAPI.updater.download(); });
          { const t0 = Date.now(); for (;;) { const x = await st(); if (x.status === 'downloaded' || x.status === 'error') { s = x; break; } if (Date.now() - t0 > 240000) { s = x; break; } await sleep(500); } }
          out.downloadResult = { status: s.status, downloaded: s.downloaded, availableVersion: s.availableVersion, error: s.error };
          g.c1_downloadedSha512Valid = s.status === 'downloaded' && s.downloaded === true;
          // INSTALL silencioso /S (quitAndInstall(true,true)) - zero acao do usuario
          pg.evaluate(() => { window.desktopAPI.updater.installAndRestart(); }).catch(() => {});
          let closed = false;
          try { await Promise.race([new Promise(res => app.on('close', () => { closed = true; res(); })), sleep(30000)]); } catch (_) {}
          if (!closed) { try { const x = await st(); closed = (x.status === 'installing'); } catch (_) { closed = true; } }
          out.appClosedByUpdater = closed;
          g.d1_installTriggered = closed === true;
          g.p0_noPageErrorsA = perr.length === 0;
          out.pageErrors = perr;
          const fails = Object.entries(g).filter(([k, v]) => !v).map(([k]) => k);
          out.fails = fails;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/canary/canary255-sessionA-1.0.254.json', JSON.stringify(out, null, 1));
          console.log(JSON.stringify(out, null, 1));
          try { await Promise.race([app.close(), sleep(4000)]); } catch (_) {}
          if (fails.length) { console.error('FAILS A:', fails); }
          process.exit(fails.length ? 1 : 0);
          EOF
          node canary-a.mjs

      - name: "Confirmar UPGRADE instalado == 1.0.255 (asar) + sem instalador residual + REQUIRED_USER_INSTALL_ACTIONS=0"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $work = "$env:RUNNER_TEMP\canary"
          $asar = Join-Path $env:INSTALL_DIR "resources\app.asar"
          $deadline = (Get-Date).AddSeconds(240); $ok = $false; $ver = ""
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 4
            if (Test-Path $asar) {
              Push-Location $work
              try { $ver = (& node -e "const a=require('@electron/asar');process.stdout.write(JSON.parse(a.extractFile(process.argv[1],'package.json').toString('utf8')).version)" "$asar") } catch { $ver = "" }
              Pop-Location
