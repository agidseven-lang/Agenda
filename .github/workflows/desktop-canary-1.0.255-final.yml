          node canary-c.mjs
          echo "SESSAO C 1.0.255 (binario atualizado pelo feed PUBLICO 254->255): PASS (brand oficial 3 resolucoes + notificacao light/dedupe por IPC real + paridade SLA/contexto + matriz no modulo empacotado + dialog central do asar)" >> "$GITHUB_STEP_SUMMARY"

      - name: "RESUMO DO CANARY (Sessao A publica + Sessao B + Sessao C + prova do feed publico)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          node -e '
            const fs = require("fs"); const p = process.env.RUNNER_TEMP + "/canary/";
            const A = JSON.parse(fs.readFileSync(p + "canary255-sessionA-1.0.254.json", "utf8"));
            const B = JSON.parse(fs.readFileSync(p + "canary255-sessionB.json", "utf8"));
            const C = JSON.parse(fs.readFileSync(p + "canary255-sessionC.json", "utf8"));
            const F = JSON.parse(fs.readFileSync(p + "canary255-public-feed-proof.json", "utf8"));
            const cnt = o => { const ks = Object.keys(o || {}); return { total: ks.length, pass: ks.filter(k => o[k]).length, fails: ks.filter(k => !o[k]) }; };
            const hg = {}; for (const [k, v] of Object.entries(B.g)) if (/^H\d/.test(k)) hg[k] = v;
            const BI = B.info || {}; const CI = C.info || {};
            const sum = { result: (A.fails.length + B.fails.length + C.fails.length) === 0 ? "PASS" : "FAIL",
              baseline: A.before.ver, final: (B.after || {}).ver || null, feed: F,
              updatePath: "public 1.0.254 -> public latest.yml -> update_available 1.0.255 -> download(sha512) -> silent /S -> installed 1.0.255",
              checkResult: A.checkResult || null, downloadResult: A.downloadResult || null, appClosedByUpdater: A.appClosedByUpdater,
              failsA: A.fails, failsB: B.fails, failsC: C.fails,
              pageErrorsA: A.pageErrors || [], pageErrorsB: B.pageErrors || [], pageErrorsC: C.pageErrors || [], dialogPageErrorsC: C.dialogPageErrors || [],
              gatesA: cnt(A.g), gatesB: cnt(B.g), gatesC: cnt(C.g),
              hGates: hg, parityAdmin: BI.parityAdmin || null, parityOp: BI.parityOp || null,
              revealSuppressed: BI.revealSuppressed || [], nav1366: BI.nav1366 || null,
              brand: CI.brand || null, notifShell: CI.notifShell || null, fiveMoves: CI.fiveMoves || null, listener: CI.listener || null,
              slaParity: CI.parity || null, slaMatrixRows: Array.isArray(CI.slaMatrix) ? CI.slaMatrix.length : (CI.slaMatrix ? Object.keys(CI.slaMatrix).length : null),
              dialogCritical: CI.dialogCritical || null, dialogOverdue: CI.dialogOverdue || null, workArea: CI.workArea || null };
            fs.writeFileSync(p + "canary255-summary.json", JSON.stringify(sum, null, 1));
            console.log(JSON.stringify(sum, null, 1));
            if (sum.result !== "PASS") { console.error("CANARY RESULT != PASS"); process.exit(1); }
          '
          echo "PUBLIC UPDATER CANARY 1.0.254->1.0.255: PASS" >> "$GITHUB_STEP_SUMMARY"

