          const ackCalls = await dlg.evaluate(() => window.__qa.calls());
          I.ackCalls = ackCalls;
          g.DLG_C8_entendiAckOnly = ackCalls.ok.length === 1 && ackCalls.open.length === 0;
          await dlg.evaluate(() => window.__qa.reset());
          await dlg.evaluate(v => window.__qa.deliver(v), view(true, { queueLen: 1 }));
          await dlg.waitForTimeout(600);
          const mo = await measure();
          I.dialogOverdue = mo;
          g.DLG_C9_severityRed = !!mo && mo.bg === 'rgb(255, 255, 255)' && mo.barColor === 'rgb(220, 38, 38)' && mo.lbl === 'Prazo vencido' && mo.state === 'Atrasada' && /vencido/.test(mo.rem || '') && mo.cta.bg === 'rgb(220, 38, 38)' && mo.hs === 0;
          await dlg.screenshot({ path: T + '/CANARY255-SLA-OVERDUE.png', clip: { x: 0, y: 0, width: WIN_W, height: Math.ceil(mo.wrapH) + 4 } });
          MANIFEST.push({ filename: 'CANARY255-SLA-OVERDUE.png', sourceSha: SRC, installedVersion: a.ver, viewport: WIN_W + 'x' + Math.ceil(mo.wrapH), expectedSurface: 'Dialog central de prazo (vencido)', actualSurface: mo.lbl, expectedHeading: 'Prazo vencido', actualHeading: mo.lbl, loginPresent: false, screenshotValid: mo.lbl === 'Prazo vencido' });
          await dlg.evaluate(() => window.__qa.reset());
          await dlg.evaluate(() => { const b = document.getElementById('dl_open'); if (b) b.click(); });
          await dlg.waitForTimeout(300);
          const openCalls = await dlg.evaluate(() => window.__qa.calls());
          I.openCalls = openCalls;
          g.DLG_C10_abrirSameTask = openCalls.open.length === 1 && openCalls.open[0] === 'detail/' + TID && openCalls.ok.length === 1;
          g.DLG_C11_noPageErrors = dperr.length === 0;
          out.dialogPageErrors = dperr;
          await app.evaluate(({ BrowserWindow }, id) => { const w = BrowserWindow.fromId(id); if (w) w.destroy(); }, dlgId);

          // ===== 8) fecho =====
          g.E1_screenshotNotLogin = MANIFEST.every(m => m.loginPresent === false);
          g.E1_manifestAllValid = MANIFEST.length >= 8 && MANIFEST.every(m => m.screenshotValid === true);
          g.C_noFatalPageError = perr.length === 0;
          out.pageErrors = perr; out.manifest = MANIFEST;
          const fails = Object.entries(g).filter(([k, v]) => !v).map(([k]) => k);
          out.fails = fails;
          fs.writeFileSync(T + '/canary255-evidence-manifest-c.json', JSON.stringify(MANIFEST, null, 1));
          fs.writeFileSync(T + '/canary255-sessionC.json', JSON.stringify(out, null, 1));
          console.log(JSON.stringify(out, null, 1));
          try { await Promise.race([app.close(), sleep(4000)]); } catch (_) {}
          if (fails.length) { console.error('FAILS C:', fails); }
          process.exit(fails.length ? 1 : 0);
