# =====================================================================
# [infra] Publica uma PRE-RELEASE de teste reunindo os instaladores JÁ
# gerados (NÃO rebuilda, NÃO faz merge, NÃO toca em app). Baixa os
# artifacts das runs informadas, confere SHA-256 e publica a release.
# Dispara no push desta branch (e tambem manualmente, se promovida).
# =====================================================================
name: "[infra] Publish Test Release"

"on":
  push:
    branches: ["infra/test-release-publish"]
  workflow_dispatch:
    inputs:
      desktop_run:
        description: "Run id do build Desktop"
        required: true
        default: "27073525338"
      android_run:
        description: "Run id do build Android"
        required: true
        default: "27073525730"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DESKTOP_RUN: "27073525338"
      ANDROID_RUN: "27073525730"
      TAG: "test/board-toolbar-inside-kanban-1.0.108-1.0.96"
      EXE_SHA: "caec96ea93d23f555f67b3c3ab11f8b60a142228f487bb294a9c9bfe07dbe4a7"
      MSI_SHA: "5662cc3e651e82f74b2c0c25f94af2349383d16351b11f87e8f1b221973c405d"
      APK_SHA: "8196f3c2524b9af1975388e44e42c406861806f121b95991cb9bd732f9420d57"
    steps:
      - name: Resolver run ids (input tem prioridade)
        run: |
          echo "DRUN=${{ github.event.inputs.desktop_run || env.DESKTOP_RUN }}" >> "$GITHUB_ENV"
          echo "ARUN=${{ github.event.inputs.android_run || env.ANDROID_RUN }}" >> "$GITHUB_ENV"

      - name: Baixar bundle do Desktop (run existente, sem rebuild)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.DRUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl/desktop
          pattern: "agenda-id-seven-desktop-*-bundle"

      - name: Baixar bundle do Android (run existente, sem rebuild)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.ARUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl/android
          pattern: "idseven-nativebeta-*-bundle"

      - name: Selecionar arquivos + CONFERIR SHA-256
        run: |
          set -euo pipefail
          mkdir -p out
          echo "== Arquivos baixados =="; find dl -type f | sort
          while IFS= read -r z; do
            [ -n "$z" ] || continue
            echo "unzip: $z"
            unzip -o -q "$z" -d "$(dirname "$z")/_unz" || true
          done < <(find dl -name '*.zip')
          echo "== Apos extrair zips =="; find dl -type f | sort
          EXE=$(find dl -name 'Agenda-ID-Seven-Desktop-1.0.108*.exe' | head -1)
          MSI=$(find dl -name 'Agenda-ID-Seven-Desktop-1.0.108*.msi' | head -1)
          APK=$(find dl -name 'idseven-nativebeta-1.0.96*board-toolbar-inside-kanban-fix.apk' | head -1)
          VDESK=$(find dl -name 'VERSAO-DESKTOP.txt' | head -1 || true)
          VAPK=$(find dl -name 'VERSAO-DO-APK.txt' | head -1 || true)
          for f in "$EXE" "$MSI" "$APK"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo "::error::artefato faltando ($f)"; exit 1; fi
          done
          cp "$EXE" "out/Agenda-ID-Seven-Desktop-1.0.108-x64.exe"
          cp "$MSI" "out/Agenda-ID-Seven-Desktop-1.0.108-x64.msi"
          cp "$APK" "out/idseven-nativebeta-1.0.96-beta-board-toolbar-inside-kanban-fix.apk"
          [ -n "$VDESK" ] && cp "$VDESK" out/VERSAO-DESKTOP.txt || true
          [ -n "$VAPK" ] && cp "$VAPK" out/VERSAO-DO-APK.txt || true
          cd out
          GOT_EXE=$(sha256sum "Agenda-ID-Seven-Desktop-1.0.108-x64.exe" | awk '{print $1}')
          GOT_MSI=$(sha256sum "Agenda-ID-Seven-Desktop-1.0.108-x64.msi" | awk '{print $1}')
          GOT_APK=$(sha256sum "idseven-nativebeta-1.0.96-beta-board-toolbar-inside-kanban-fix.apk" | awk '{print $1}')
          echo "exe esperado=$EXE_SHA obtido=$GOT_EXE"
          echo "msi esperado=$MSI_SHA obtido=$GOT_MSI"
          echo "apk esperado=$APK_SHA obtido=$GOT_APK"
          [ "$GOT_EXE" = "$EXE_SHA" ] || { echo "::error::SHA exe diverge"; exit 1; }
          [ "$GOT_MSI" = "$MSI_SHA" ] || { echo "::error::SHA msi diverge"; exit 1; }
          [ "$GOT_APK" = "$APK_SHA" ] || { echo "::error::SHA apk diverge"; exit 1; }
          sha256sum * > SHA256SUMS.txt
          echo "== SHA-256 conferido (todos batem) =="; cat SHA256SUMS.txt

      - name: Gerar README-TESTE-REAL.txt
        run: |
          cat > out/README-TESTE-REAL.txt <<'EOF'
          ============================================================
          Agenda ID Seven — TESTE REAL (Chips somente no Kanban)
          Pre-release de teste — NAO e producao.
          ============================================================

          VERSOES
          - Worker  : V64.18-real-flow-sync-fix (INALTERADO; ja ativo)
          - Desktop : 1.0.108-board-toolbar-inside-kanban-fix
          - Android : 1.0.96-beta-board-toolbar-inside-kanban-fix (versionCode 94)

          O QUE MUDOU (somente posicao dos chips)
          - A tela HUB "Quadros" (lista de quadros/setores) NAO mostra mais chips.
          - Os chips (Meu quadro / Cliente / Designers / Social Medias / Setores)
            aparecem SOMENTE dentro de um quadro Kanban, ao lado de "Buscar tarefa...",
            acima das colunas (A Fazer / Em andamento / Revisao / Finalizado).
          - Chip "Designers" com icone. Chips menos arredondados (estilo do input).
          - Nenhuma logica de fluxo foi alterada.

          SHA-256 (confira apos baixar)
          - Agenda-ID-Seven-Desktop-1.0.108-x64.exe
            caec96ea93d23f555f67b3c3ab11f8b60a142228f487bb294a9c9bfe07dbe4a7
          - Agenda-ID-Seven-Desktop-1.0.108-x64.msi
            5662cc3e651e82f74b2c0c25f94af2349383d16351b11f87e8f1b221973c405d
          - idseven-nativebeta-1.0.96-beta-board-toolbar-inside-kanban-fix.apk
            8196f3c2524b9af1975388e44e42c406861806f121b95991cb9bd732f9420d57
          (o arquivo SHA256SUMS.txt traz todos os hashes)

          ------------------------------------------------------------
          INSTALAR — DESKTOP (Windows)
          ------------------------------------------------------------
          IMPORTANTE: FECHE a versao antiga ANTES de instalar.
          1) Na BANDEJA (ao lado do relogio), clique direito no icone -> "Sair".
          2) Abra o Agenda-ID-Seven-Desktop-1.0.108-x64.exe (prefira o .exe).
          3) SmartScreen: "Mais informacoes" -> "Executar assim mesmo".
          4) No login deve aparecer: "Desktop 1.0.108 - Chips no Kanban".

          ------------------------------------------------------------
          INSTALAR — ANDROID
          ------------------------------------------------------------
          1) Baixe o .apk no celular. Toque para instalar.
          2) Permita "Instalar apps desconhecidos"; Play Protect -> "Instalar assim mesmo".
          3) No login/perfil deve mostrar 1.0.96-beta-board-toolbar-inside-kanban-fix.

          ------------------------------------------------------------
          O QUE CONFERIR
          ------------------------------------------------------------
          1) Tela "Quadros" (hub): SEM chips, apenas os cards dos quadros.
          2) Entrar em "Meu quadro"/"Cliente"/um setor: busca + chips ACIMA das colunas.
          3) Chip "Designers" com icone.
          4) PC e Android iguais nesse comportamento.
          EOF
          echo "== out =="; ls -lh out

      - name: Publicar PRE-RELEASE com os arquivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Agenda ID Seven — Chips no Kanban (1.0.108 / 1.0.96)"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: out/README-TESTE-REAL.txt
          files: |
            out/Agenda-ID-Seven-Desktop-1.0.108-x64.exe
            out/Agenda-ID-Seven-Desktop-1.0.108-x64.msi
            out/idseven-nativebeta-1.0.96-beta-board-toolbar-inside-kanban-fix.apk
            out/VERSAO-DESKTOP.txt
            out/VERSAO-DO-APK.txt
            out/SHA256SUMS.txt
            out/README-TESTE-REAL.txt
