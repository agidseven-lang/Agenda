# =====================================================================
# [infra] Publica uma PRE-RELEASE de teste reunindo os instaladores JÁ
# gerados (NÃO rebuilda, NÃO faz merge, NÃO toca em app). Baixa os
# artifacts das runs informadas, confere SHA-256 e publica a release.
# Dispara no push desta branch (e tambem manualmente, se promovida).
# =====================================================================
name: "[infra] Publish Test Release"

"on":
  push:
    branches: ["infra/test-release-publish"]
  workflow_dispatch:
    inputs:
      desktop_run:
        description: "Run id do build Desktop"
        required: true
        default: "27072605863"
      android_run:
        description: "Run id do build Android"
        required: true
        default: "27072606314"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DESKTOP_RUN: "27072605863"
      ANDROID_RUN: "27072606314"
      TAG: "test/board-toolbar-placement-1.0.106-1.0.94"
      EXE_SHA: "e0ceccf05d84cad47f1cc218d678b49018290317a9e43c55649d32f8344b410a"
      MSI_SHA: "a9dadcac374f4b469eb499f2668c644ea8314ae8d4e8247dbb8de6c1be2f8cf8"
      APK_SHA: "506dce784e69ceafa6e6bb81fac10f73c7e1c97550ba1b93ec5253bc201c8ccd"
    steps:
      - name: Resolver run ids (input tem prioridade)
        run: |
          echo "DRUN=${{ github.event.inputs.desktop_run || env.DESKTOP_RUN }}" >> "$GITHUB_ENV"
          echo "ARUN=${{ github.event.inputs.android_run || env.ANDROID_RUN }}" >> "$GITHUB_ENV"

      - name: Baixar bundle do Desktop (run existente, sem rebuild)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.DRUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl/desktop
          pattern: "agenda-id-seven-desktop-*-bundle"

      - name: Baixar bundle do Android (run existente, sem rebuild)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.ARUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl/android
          pattern: "idseven-nativebeta-*-bundle"

      - name: Selecionar arquivos + CONFERIR SHA-256
        run: |
          set -euo pipefail
          mkdir -p out
          echo "== Arquivos baixados =="; find dl -type f | sort
          while IFS= read -r z; do
            [ -n "$z" ] || continue
            echo "unzip: $z"
            unzip -o -q "$z" -d "$(dirname "$z")/_unz" || true
          done < <(find dl -name '*.zip')
          echo "== Apos extrair zips =="; find dl -type f | sort
          EXE=$(find dl -name 'Agenda-ID-Seven-Desktop-1.0.106*.exe' | head -1)
          MSI=$(find dl -name 'Agenda-ID-Seven-Desktop-1.0.106*.msi' | head -1)
          APK=$(find dl -name 'idseven-nativebeta-1.0.94*board-toolbar-placement-fix.apk' | head -1)
          VDESK=$(find dl -name 'VERSAO-DESKTOP.txt' | head -1 || true)
          VAPK=$(find dl -name 'VERSAO-DO-APK.txt' | head -1 || true)
          for f in "$EXE" "$MSI" "$APK"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo "::error::artefato faltando ($f)"; exit 1; fi
          done
          cp "$EXE" "out/Agenda-ID-Seven-Desktop-1.0.106-x64.exe"
          cp "$MSI" "out/Agenda-ID-Seven-Desktop-1.0.106-x64.msi"
          cp "$APK" "out/idseven-nativebeta-1.0.94-beta-board-toolbar-placement-fix.apk"
          [ -n "$VDESK" ] && cp "$VDESK" out/VERSAO-DESKTOP.txt || true
          [ -n "$VAPK" ] && cp "$VAPK" out/VERSAO-DO-APK.txt || true
          cd out
          GOT_EXE=$(sha256sum "Agenda-ID-Seven-Desktop-1.0.106-x64.exe" | awk '{print $1}')
          GOT_MSI=$(sha256sum "Agenda-ID-Seven-Desktop-1.0.106-x64.msi" | awk '{print $1}')
          GOT_APK=$(sha256sum "idseven-nativebeta-1.0.94-beta-board-toolbar-placement-fix.apk" | awk '{print $1}')
          echo "exe esperado=$EXE_SHA obtido=$GOT_EXE"
          echo "msi esperado=$MSI_SHA obtido=$GOT_MSI"
          echo "apk esperado=$APK_SHA obtido=$GOT_APK"
          [ "$GOT_EXE" = "$EXE_SHA" ] || { echo "::error::SHA exe diverge"; exit 1; }
          [ "$GOT_MSI" = "$MSI_SHA" ] || { echo "::error::SHA msi diverge"; exit 1; }
          [ "$GOT_APK" = "$APK_SHA" ] || { echo "::error::SHA apk diverge"; exit 1; }
          sha256sum * > SHA256SUMS.txt
          echo "== SHA-256 conferido (todos batem) =="; cat SHA256SUMS.txt

      - name: Gerar README-TESTE-REAL.txt
        run: |
          cat > out/README-TESTE-REAL.txt <<'EOF'
          ============================================================
          Agenda ID Seven — TESTE REAL (Board Toolbar Placement Fix)
          Pre-release de teste — NAO e producao.
          ============================================================

          VERSOES
          - Worker  : V64.18-real-flow-sync-fix (INALTERADO; ja ativo)
          - Desktop : 1.0.106-board-toolbar-placement-fix
          - Android : 1.0.94-beta-board-toolbar-placement-fix (versionCode 92)

          O QUE MUDOU (somente layout/posicao)
          - Os chips (Meu quadro / Cliente / Designers / Social Medias / Setores)
            SAIRAM do topo global. Agora ficam DENTRO da area do quadro, ao lado
            do campo "Buscar tarefa..." (no mobile, logo abaixo da busca).
          - Nenhuma logica de fluxo foi alterada.

          SHA-256 (confira apos baixar)
          - Agenda-ID-Seven-Desktop-1.0.106-x64.exe
            e0ceccf05d84cad47f1cc218d678b49018290317a9e43c55649d32f8344b410a
          - Agenda-ID-Seven-Desktop-1.0.106-x64.msi
            a9dadcac374f4b469eb499f2668c644ea8314ae8d4e8247dbb8de6c1be2f8cf8
          - idseven-nativebeta-1.0.94-beta-board-toolbar-placement-fix.apk
            506dce784e69ceafa6e6bb81fac10f73c7e1c97550ba1b93ec5253bc201c8ccd
          (o arquivo SHA256SUMS.txt traz todos os hashes)

          ------------------------------------------------------------
          INSTALAR — DESKTOP (Windows)
          ------------------------------------------------------------
          IMPORTANTE: FECHE a versao antiga ANTES de instalar.
          1) Na BANDEJA (ao lado do relogio), clique com o botao direito
             no icone do Agenda ID Seven -> "Sair". (o X so esconde)
          2) Abra o Agenda-ID-Seven-Desktop-1.0.106-x64.exe (prefira o .exe).
          3) Se o SmartScreen avisar: "Mais informacoes" -> "Executar assim mesmo".
          4) No login deve aparecer: "Desktop 1.0.106 - Toolbar dos quadros".

          ------------------------------------------------------------
          INSTALAR — ANDROID
          ------------------------------------------------------------
          1) Baixe o .apk no celular (ou transfira para ele).
          2) Toque no arquivo; se pedir, permita "Instalar apps desconhecidos".
          3) Play Protect pode avisar (beta) -> "Instalar assim mesmo".
          4) No login/perfil deve mostrar 1.0.94-beta-board-toolbar-placement-fix.

          ------------------------------------------------------------
          O QUE CONFERIR (posicao dos chips)
          ------------------------------------------------------------
          1) Tela "Quadros": NAO deve haver chips ACIMA do titulo "Quadros".
          2) Os chips aparecem JUNTO da busca, dentro da area do quadro.
          3) Meu quadro / Cliente / Designers / Social / Setores: busca + chips
             no mesmo bloco, alinhados; no celular, chips com scroll horizontal.
          4) Trocar de aba e voltar: os chips NAO somem e NAO duplicam.
          5) Criar tarefa / copiar mensagem: a toolbar continua no lugar.
          EOF
          echo "== README =="; sed -n '1,20p' out/README-TESTE-REAL.txt
          echo "== out =="; ls -lh out

      - name: Publicar PRE-RELEASE com os arquivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Agenda ID Seven — Board Toolbar Placement Fix (1.0.106 / 1.0.94)"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: out/README-TESTE-REAL.txt
          files: |
            out/Agenda-ID-Seven-Desktop-1.0.106-x64.exe
            out/Agenda-ID-Seven-Desktop-1.0.106-x64.msi
            out/idseven-nativebeta-1.0.94-beta-board-toolbar-placement-fix.apk
            out/VERSAO-DESKTOP.txt
            out/VERSAO-DO-APK.txt
            out/SHA256SUMS.txt
            out/README-TESTE-REAL.txt
