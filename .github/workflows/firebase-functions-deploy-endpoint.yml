# =====================================================================
# [manual] F3.3.20-B1.7-C — Deploy ENDPOINT-ONLY (parcial) de UM endpoint do trilho
# notifPrefs: issueNotifPrefsToken OU updateNotifPrefs (um por vez). SEPARADO do deploy
# total (firebase-functions-deploy.yml) e do DORMANT-1 (3 triggers). workflow_dispatch;
# dry_run=true por padrao. Guards: confirm_deploy == DEPLOY_ENDPOINT; allowlist FIXA
# {issueNotifPrefsToken, updateNotifPrefs}; rejeita total/triggers/vazio/lista/virgula/
# espaco/curinga/desconhecido; pin do blob f5901e2; prechecks f33R..f33V; checkout fixo
# app/main. NAO ativa flags; NAO toca produto; pos-deploy apenas por metadados. O segredo
# NOTIF_PREFS_SECRET ja possui versao real — nenhuma operacao de segredo ocorre aqui.
# =====================================================================
name: "[manual] Firebase Functions Deploy — ENDPOINT (parcial, 1 endpoint notifPrefs)"

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite DEPLOY_ENDPOINT para confirmar (qualquer outro valor aborta)"
        required: true
        default: ""
      dry_run:
        description: "true = apenas plano/list (NAO faz deploy); false = deploy real"
        required: true
        default: "true"
      function_name:
        description: "Endpoint alvo (allowlist fixa: issueNotifPrefsToken | updateNotifPrefs)"
        required: true
        default: "issueNotifPrefsToken"

permissions:
  contents: read

concurrency:
  group: ff-deploy-endpoint
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  PINNED_FUNCTIONS_BLOB: "781fdd335ab0bcbbdb0c1a8c9a3bfae369099db1"

jobs:
  deploy-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Guard confirm_deploy (== DEPLOY_ENDPOINT)
        env:
          CONFIRM: ${{ github.event.inputs.confirm_deploy }}
        run: |
          set -eu
          if [ "$CONFIRM" != "DEPLOY_ENDPOINT" ]; then
            echo "::error:: confirm_deploy != DEPLOY_ENDPOINT — abortando antes de tudo."
            exit 1
          fi
          echo "confirm_deploy OK."

      - name: Guard allowlist (1 endpoint; rejeita total/triggers/lista/vazio/curinga)
        env:
          FUNCTION_NAME: ${{ github.event.inputs.function_name }}
        run: |
          set -eu
          ALLOW="issueNotifPrefsToken updateNotifPrefs"
          FN="$FUNCTION_NAME"
          if [ -z "$FN" ]; then echo "::error:: function_name vazio"; exit 1; fi
          case "$FN" in
            *,*)   echo "::error:: lista/virgula proibida (1 endpoint por vez)"; exit 1 ;;
            *" "*) echo "::error:: espaco proibido"; exit 1 ;;
            *"*"*) echo "::error:: curinga proibido"; exit 1 ;;
            functions) echo "::error:: alvo total proibido"; exit 1 ;;
          esac
          MATCH=0
          for a in $ALLOW; do [ "$FN" = "$a" ] && MATCH=1; done
          if [ "$MATCH" != "1" ]; then echo "::error:: token fora da allowlist: $FN"; exit 1; fi
          TARGET="functions:$FN"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "FN=$FN" >> "$GITHUB_ENV"
          echo "Allowlist OK — alvo: $TARGET"

      - name: Checkout (ref FIXO app/main)
        uses: actions/checkout@v4
        with:
          ref: app/main
          fetch-depth: 0

      - name: Pin do blob functions/index.js (== f5901e2)
        run: |
          set -eu
          B="$(git rev-parse HEAD:functions/index.js)"
          if [ "$B" != "$PINNED_FUNCTIONS_BLOB" ]; then
            echo "::error:: functions/index.js ($B) != pin ($PINNED_FUNCTIONS_BLOB)"
            exit 1
          fi
          echo "Pin OK: $B"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pre-checks (syntax + harnesses f33R..f33V)
        run: |
          set -eu
          node --check functions/index.js
          for t in f33R-notif-prefs-log f33S-notif-prefs-endpoint f33T-notif-prefs-token-issuer f33U-notif-send-prefs-integration f33V-notif-hardening; do
            echo "==== $t ===="; node "scripts/worker-ops/$t.test.mjs"
          done
          echo "Pre-checks OK."

      - name: Auth gcloud (service account via secret -> arquivo temporario)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: service account ausente."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null

      - name: Estado ANTES (functions:list — leitura)
        run: |
          npm install -g firebase-tools >/dev/null 2>&1
          firebase functions:list --project "$GCP_PROJECT" | tee before.txt || true

      - name: functions/.env SEM flags (somente RESET_EMAIL_*)
        env:
          RESET_EMAIL_FROM: ${{ secrets.RESET_EMAIL_FROM }}
          RESET_EMAIL_FROM_NAME: ${{ secrets.RESET_EMAIL_FROM_NAME }}
          RESET_EMAIL_PROVIDER: ${{ secrets.RESET_EMAIL_PROVIDER }}
        run: |
          set -eu
          # O firebase analisa o codebase INTEIRO: as funcoes de password-reset declaram
          # defineString(RESET_EMAIL_*), exigidas em --non-interactive mesmo com --only de 1 endpoint
          # (mesma classe da falha B1.6-K). Grava SOMENTE RESET_EMAIL_* (defaults seguros).
          # NUNCA flags ENABLE_NOTIF_*; NUNCA o segredo do trilho; sem imprimir valores sensiveis.
          FROM="${RESET_EMAIL_FROM:-no-reply@agendaidseven.com.br}"
          {
            printf 'RESET_EMAIL_FROM=%s\n' "$FROM"
            printf 'RESET_EMAIL_FROM_NAME=%s\n' "${RESET_EMAIL_FROM_NAME:-ID Seven Agenda}"
            printf 'RESET_EMAIL_PROVIDER=%s\n' "${RESET_EMAIL_PROVIDER:-resend}"
          } > "functions/.env.${GCP_PROJECT}"
          # trava: NUNCA escrever flags no .env (aborta se aparecer)
          if grep -q 'ENABLE_NOTIF_' "functions/.env.${GCP_PROJECT}"; then
            echo "::error:: .env contem ENABLE_NOTIF_*"; exit 1
          fi
          echo ".env gravado sem flags."

      - name: Deploy ENDPOINT (somente se dry_run=false)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          # trava FINAL: TARGET nunca pode ser alvo total
          case "$TARGET" in
            functions|functions:) echo "::error:: alvo total bloqueado"; exit 1 ;;
          esac
          if [ "$DRY_RUN" = "false" ]; then
            echo "DEPLOY real — alvo: $TARGET"
            firebase deploy --only "$TARGET" --project "$GCP_PROJECT" --non-interactive --force
          else
            echo "DRY-RUN=true — nenhum deploy executado. Alvo planejado: $TARGET"
          fi

      - name: Validacao POS-deploy (metadados; somente se dry_run=false)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          set -eu
          # Apenas metadados/listagem; nunca le o valor do segredo.
          firebase functions:list --project "$GCP_PROJECT" | tee after.txt
          # alvo presente apos o deploy
          if ! grep -qE "(^|[^A-Za-z])${FN}([^A-Za-z]|$)" after.txt; then
            echo "::error:: alvo $FN ausente apos deploy"; exit 1
          fi
          # flags continuam OFF no alvo (nenhuma var ENABLE_NOTIF no env do alvo)
          EV="$(gcloud functions describe "$FN" --gen2 --region us-central1 --project "$GCP_PROJECT" --format='value(serviceConfig.environmentVariables)' 2>/dev/null || true)"
          if echo "$EV" | grep -q 'ENABLE_NOTIF'; then
            echo "::error:: variavel ENABLE_NOTIF presente em $FN (flag nao pode estar ativa)"; exit 1
          fi
          echo "POS-deploy OK: alvo $FN presente; flags OFF; deploy --only de 1 endpoint (sem publicar extras)."

      - name: Limpeza (service account + .env temporario, se houver)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" functions/.env.* before.txt after.txt 2>/dev/null || true
