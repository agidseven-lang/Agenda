# Workflow TEMPORÁRIO de CI manual na branch DEFAULT (main).
# Objetivo: gerar o APK 1.0.14-beta-notify-debug-fix a partir de feat/android-native-saas.
# Sem actions/setup-java e sem android-actions/setup-android (downloads do codeload falhando).
# Usa JDK 17 e Android SDK JÁ PRÉ-INSTALADOS no runner. REMOVER após validar.
# Não toca PWA, Worker, Firebase web, secrets nem código do app — só CI.
name: Build Android Nativo Beta Manual

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/android-native-saas (codigo 1.0.14)
        uses: actions/checkout@v4
        with:
          ref: feat/android-native-saas

      - name: Diagnostics (ambiente pre-instalado do runner)
        run: |
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          "$JAVA_HOME_17_X64/bin/java" -version || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin" 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | head -60 || true

      - name: Garantir SDK (licencas + platform 34 + build-tools 34)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Gerar debug keystore (assinatura de teste)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restaurar google-services.json (secret GOOGLE_SERVICES_JSON_BETA)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BETA }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BETA ausente."
            exit 1
          fi
          printf '%s' "$GS_JSON" > android-native-beta/app/google-services.json
          echo "google-services.json gravado ($(wc -c < android-native-beta/app/google-services.json) bytes)."

      - name: gradlew clean assembleRelease (JDK 17 + SDK pre-instalados)
        working-directory: android-native-beta
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: idseven-nativebeta-1.0.14-beta-notify-debug-fix-${{ github.sha }}
          path: android-native-beta/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
