# =====================================================================
# [push/manual] F3.5.4W — Desktop Build (1.0.214 — CARDS COMPACTOS · CENTRAL DE DETALHES · AVATARES · SOCIAL)
# ---------------------------------------------------------------------
# Base de código / rollback imediato: Desktop 1.0.213 (@e626d36 = tag v1.0.213, baseline FÍSICA aprovada).
# Rollback adicional: 1.0.211 (@fe303b8).
# QUATRO entregas inseparáveis, TODAS no renderer index.html:
#   D1 — cards COMPACTOS (resumo kbv2ContentSlot; nunca renderiza a lista completa de temas; altura controlada).
#   D2 — CENTRAL DE DETALHES grande (blocos numerados TEMA/ROTEIRO/VÍDEO/CARD NN; acordeões <details>;
#        Expandir/Recolher todos; Esc/foco/retorno; parágrafos preservados; esc() — sem innerHTML cru).
#   D3 — AVATARES: correção pelo CONTAINER (.f354-dstrip: altura/overflow/padding), sem encolher o avatar.
#   D4 — SOCIAL MEDIAS: quadro aparece automaticamente (auto-pick por ESTADO, sem .click()); colunas com 0 tarefas.
# Delta autorizado vs 1.0.213 em desktop/src: SOMENTE desktop/src/renderer/index.html. main.ts/auth-core.ts/
# preloads/renderers comuns/priorityEngine + stack de notificação/SLA/persistência: INTOCADOS (byte vs 1.0.213).
# `--publish never` (nada publicado aqui; a publicação ocorre no desktop-release-f354w.yml, mesmos bytes).
# =====================================================================
name: "[push/manual] F3.5.4W Desktop Build (1.0.214 — cards compactos, central de detalhes, avatares, social)"
"on":
  push:
    branches:
      - "desktop/f354w-compact-task-cards-details-1.0.214"
    paths-ignore:
      - ".github/workflows/desktop-release-f354w.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_211_SHA: "fe303b8ab9546ff00d0459b98e0e9eaab20dd8e2" # 1.0.211 (rollback adicional)
  BASE_213_SHA: "e626d36921e269e28b74494ff51afb9c77f8d94d" # 1.0.213 OFICIAL (base de código/rollback imediato = tag v1.0.213)
  BRANCH_POINT_SHA: "e626d36921e269e28b74494ff51afb9c77f8d94d" # ponto de fork da branch (= 1.0.213)
  TEST_BRANCH: "desktop/f354w-compact-task-cards-details-1.0.214"
  APP_DIR: "desktop"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Checkout (SHA do push; history completo)
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }

      - name: Gate REF + ANCESTRIA — branch correta e descendente de 1.0.213 e 1.0.211
        working-directory: desktop
        run: |
          set -e
          [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ] || { echo "::error:: ref $GITHUB_REF_NAME != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_213_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.213"; exit 1; }
          git merge-base --is-ancestor "$BASE_211_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.211"; exit 1; }
          echo "REF/ANCESTRIA OK"

      - name: Derivar versao — exige 1.0.214 exato (package + lock x2)
        working-directory: desktop
        run: |
          set -e
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));const l=JSON.parse(fs.readFileSync("package-lock.json","utf8"));if(p.version!=="1.0.214"){console.error("package.json version "+p.version+" != 1.0.214");process.exit(1);}if(l.version!=="1.0.214"||(l.packages&&l.packages[""]&&l.packages[""].version!=="1.0.214")){console.error("package-lock version != 1.0.214");process.exit(1);}console.log("versao 1.0.214 OK (3 campos)");'

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build
      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: npx tsc --noEmit -p tsconfig.json

      - name: Gate SINTAXE DOS RENDERERS — <script> inline de index/bgnotify/slareminder DEVEM parsear
        working-directory: desktop
        run: |
          set -e
          node -e '
            const fs=require("fs");
            function chk(file){ const s=fs.readFileSync(file,"utf8").replace(/\r\n/g,"\n");
              const re=/<script(\b[^>]*)>([\s\S]*?)<\/script>/gi; let m,n=0;
              while((m=re.exec(s))){ if(/\bsrc\s*=/.test(m[1]||"")) continue; n++;
                try{ new Function(m[2]); }catch(e){ console.error("::error:: SyntaxError "+file+" #"+n+": "+(e&&e.message||e)); process.exit(1);} }
              if(!n){ console.error("::error:: sem <script> inline "+file); process.exit(1);} }
            chk("src/renderer/index.html"); chk("src/renderer/bgnotify.html"); chk("src/renderer/slareminder.html");
            console.log("SINTAXE dos <script> inline OK.");'

      - name: Gate F3.5.4W — contrato das 4 entregas (53 asserts)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354w-compact-cards-details.test.mjs || { echo "::error:: f354w vermelho"; exit 1; }

      - name: Gate REGRESSAO 1.0.213 — persistência da sessão (40) + qty vídeos (72) + contrato de vídeos f3377a (79)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354vh1-session-persistence.test.mjs || { echo "::error:: f354vh1 (persistência) regrediu"; exit 1; }
          node scripts/f354v-custom-video-quantity.test.mjs || { echo "::error:: f354v (quantidade de vídeos) regrediu"; exit 1; }
          node scripts/f3377a-media-editing.test.mjs || { echo "::error:: f3377a (contrato de vídeos) regrediu"; exit 1; }

      - name: Gate AUTH/CONTA — auth-core hermético (16) + account-anchor (server-side, splash-first)
        working-directory: desktop
        run: |
          set -e
          node scripts/f3356-auth-core.test.mjs || { echo "::error:: auth-core hermético regrediu"; exit 1; }
          node scripts/f33L-account-anchor.test.mjs || { echo "::error:: account-anchor regrediu"; exit 1; }

      - name: Gate REGRESSAO — notificações/SLA/decisão/idle/lembrete/agrupamento/prioridades/renderer (verdes)
        working-directory: desktop
        run: |
          set -e
          for t in \
            f354u-h1-notification-hotfix f354u-premium-common-notifications f354r-priority-assistant \
            f354q-task-idle-detection f354o-common-notification-grouping f354n-watchdog f354n-startup \
            f354k-notification-all-window-states f354l-sla-central-persistent-reminders f354h-red-notification-boundary \
            f354i-cronograma-save-send-client f354-notifications-reliability f354f-task-edit-update-notification \
            f354f-sla-designer-live-timer f353-durable-notifications f353a-actor-photo f347-immediate-visual-delivery \
            f352-cards-notify f33A-notif-central f33F-bg-notify f33B-form-typing f33C-assignment-toast \
            f3377a-r4b-http-date-clock ; do
            node "scripts/$t.test.mjs" || { echo "::error:: regressao vermelha: $t"; exit 1; }
          done
          echo "REGRESSAO verde."

      - name: Gate ISOLAMENTO — delta vs 1.0.213 SÓ nos arquivos autorizados; src só o index.html
        working-directory: desktop
        run: |
          set -e
          # (a) delta vs o PONTO DE FORK (=1.0.213) = exatamente os arquivos desta fase
          git -C "$GITHUB_WORKSPACE" diff --name-only "$BRANCH_POINT_SHA" HEAD > /tmp/diff.txt
          echo "== arquivos alterados vs 1.0.213 =="; cat /tmp/diff.txt
          ALLOW='^(desktop/src/renderer/index\.html|desktop/package\.json|desktop/package-lock\.json|desktop/scripts/f354w-compact-cards-details\.test\.mjs|desktop/scripts/f354w-electron-proof\.mjs|desktop/scripts/f354w-electron-proof-main\.js|desktop/scripts/f354w-proof-preload\.js|desktop/scripts/f3377a-media-editing\.test\.mjs|desktop/scripts/f354i-cronograma-save-send-client\.test\.mjs|desktop/scripts/f354l-sla-central-persistent-reminders\.test\.mjs|desktop/scripts/f354vh1-session-persistence\.test\.mjs|docs/f354w-qa/.*|\.gitignore|\.github/workflows/desktop-build-f354w\.yml|\.github/workflows/desktop-release-f354w\.yml)$'
          if grep -vE "$ALLOW" /tmp/diff.txt | grep -q .; then echo "::error:: arquivo fora da allowlist F3.5.4W:"; grep -vE "$ALLOW" /tmp/diff.txt; exit 1; fi
          # (b) em desktop/src, o ÚNICO arquivo alterado vs 1.0.213 é o renderer index.html
          SRC=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_213_SHA" HEAD -- desktop/src | grep -v '^desktop/src/renderer/index\.html$' || true)
          [ -z "$SRC" ] || { echo "::error:: alteração em desktop/src além do index.html vs 1.0.213:"; echo "$SRC"; exit 1; }
          # (c) congelados byte-idênticos vs 1.0.213 (main/preload/renderers comuns/priorityEngine)
          git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_213_SHA" HEAD -- desktop/src/main desktop/src/preload desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/priorityEngine.js || { echo "::error:: arquivo congelado alterado vs 1.0.213"; exit 1; }
          echo "ISOLAMENTO OK."

      - name: Gate ANDROID/BACKEND intactos — diff nao toca android/functions/worker/Rules
        working-directory: desktop
        run: |
          set -e
          A=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_213_SHA" HEAD | grep -cE '^(android/|functions/|worker/|.*\.rules$|firestore\.rules)' || true)
          [ "$A" = "0" ] || { echo "::error:: diff toca android/backend ($A)"; exit 1; }
          echo "ANDROID/BACKEND intactos."

  build:
    needs: verify
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Forcar LF no checkout
        run: git config --global core.autocrlf false
      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }

      - name: Gate REF + ANCESTRIA (windows)
        working-directory: desktop
        run: |
          set -e
          [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ] || { echo "::error:: ref != branch"; exit 1; }
          git merge-base --is-ancestor "$BASE_213_SHA" HEAD || { echo "::error:: nao descende de 1.0.213"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: TypeScript build
        working-directory: desktop
        run: npm run build
      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: desktop
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate prova-de-versao (asar == 1.0.214) + renderers EMPACOTADOS == fonte (EOL-normalizado)
        working-directory: desktop
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.214" ] || { echo "::error:: asar version=$PKGV != 1.0.214"; exit 1; }
          cmp_norm() { EX="$1" SRC="$2" node -e 'const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");if(n(fs.readFileSync(process.env.EX,"utf8"))!==n(fs.readFileSync(process.env.SRC,"utf8"))){console.error(process.env.SRC+" EMPACOTADO != fonte");process.exit(1);}'; }
          cmp_norm "$EXDIR/src/renderer/index.html" "src/renderer/index.html"
          cmp_norm "$EXDIR/src/renderer/bgnotify.html" "src/renderer/bgnotify.html"
          cmp_norm "$EXDIR/src/renderer/slareminder.html" "src/renderer/slareminder.html"
          echo "GATE prova-de-versao 1.0.214 + renderers==fonte OK."

      - name: Gate F3.5.4W EMPACOTADO — 4 entregas no asar + contrato (53) + 1.0.213 preservada + stack congelada
        working-directory: desktop
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; RR="$EXDIR/src/renderer"; DM="$EXDIR/dist/main"; IDX="$RR/index.html"; MJS="$DM/main.js"
          # ── contrato completo das 4 entregas rodado contra o index.html EMPACOTADO ──
          SRC="$IDX" node scripts/f354w-compact-cards-details.test.mjs || { echo "::error:: contrato F3.5.4W vermelho no asar"; exit 1; }
          # ── D1 cards compactos: resumo presente; card NÃO emite nós de tema no DOM ──
          grep -qF 'function kbv2ContentSlot(t, cron, s, clientView, isCron){' "$IDX" || { echo "::error:: kbv2ContentSlot ausente no asar"; exit 1; }
          grep -qF 'h+=kbv2ContentSlot(t, cron, s, clientView, isCron);' "$IDX" || { echo "::error:: card não usa o resumo no asar"; exit 1; }
          grep -qF '.kbv2-card-summary{' "$IDX" || { echo "::error:: CSS do resumo ausente no asar"; exit 1; }
          node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8");if(/class="kbv2-theme"/.test(s)||/class="kbv2-themes-list"/.test(s)){console.error("::error:: card ainda emite nós de tema no DOM (asar)");process.exit(1)}' "$IDX"
          # ── D2 central de detalhes: sheet grande + acordeões + Esc/foco + edicao_cards labels ──
          grep -qF '.det-sheet{width:min(1240px,92vw);max-width:92vw;text-align:left;height:88vh;max-height:90vh' "$IDX" || { echo "::error:: .det-sheet não foi ampliada no asar"; exit 1; }
          for m in 'function detItemWord(t){' '<details class="det-acc"' 'data-detexpand="1"' 'data-detcollapse="1"' 'data-detmodal="1"' 'function detSetupModalFocus(){' 'CARD · LEGENDA' 'role="dialog" aria-modal="true"'; do
            grep -qF "$m" "$IDX" || { echo "::error:: marcador D2 '$m' ausente no asar"; exit 1; }
          done
          # ── D3 avatares: correção pelo container (não encolhe o avatar) ──
          grep -qF 'min-height:58px' "$IDX" || { echo "::error:: .f354-dstrip min-height ausente no asar"; exit 1; }
          grep -qF 'avatar(d.u,22)' "$IDX" || { echo "::error:: avatar dos chips foi alterado no asar"; exit 1; }
          # ── D4 social: auto-render por estado (sem .click()) + rótulo correto ──
          for m in "var SOCIAL_SEL_KEY='idseven.socialSel.v1';" 'function f354SocialAutoPick(){' 'function f354SocialStrip(activeId){' "state.socialBoard=f354SocialAutoPick();" "l:'Social Medias'"; do
            grep -qF "$m" "$IDX" || { echo "::error:: marcador D4 '$m' ausente no asar"; exit 1; }
          done
          node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8");const i=s.indexOf("function f354SocialAutoPick");if(i<0){process.exit(1)}if(/\.click\(\)/.test(s.slice(i,i+400))){console.error("::error:: auto-pick social usa .click() (asar)");process.exit(1)}' "$IDX"
          # ── 1.0.213 (persistência/máquina de estados de auth + quantidade de vídeos) PRESERVADA no asar ──
          for m in AUTH_INITIALIZING AUTH_RESTORING AUTHENTICATED AUTH_OFFLINE_CACHED authManualLogin 'id="authSplash"'; do
            grep -qF "$m" "$IDX" || { echo "::error:: 1.0.213 (auth '$m') ausente no asar"; exit 1; }
          done
          grep -q 'data-vqminus' "$IDX" && grep -q 'var VIDEO_QTY_MAX=500;' "$IDX" || { echo "::error:: quantidade personalizada de vídeos (1.0.212) ausente no asar"; exit 1; }
          # ── stack de notificação/SLA/persistência do main PRESERVADA no asar ──
          grep -q "function deliverNotification" "$MJS" && grep -q "showBgNotify" "$MJS" || { echo "::error:: HUB de entrega alterado no asar"; exit 1; }
          grep -q "createSlaReminderController" "$DM/slaReminder.js" && grep -q "onDecide" "$DM/slaReminder.js" || { echo "::error:: decisão SLA ausente no asar"; exit 1; }
          grep -qF 'error: "network"' "$DM/auth-core.js" || { echo "::error:: auth-core (offline≠logout) alterado no asar"; exit 1; }
          grep -qF 'requestSingleInstanceLock' "$MJS" || { echo "::error:: single-instance lock ausente no asar"; exit 1; }
          # ── CONGELADOS byte-idênticos vs 1.0.213 (fonte) ──
          git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_213_SHA" HEAD -- desktop/src/main desktop/src/preload desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/priorityEngine.js || { echo "::error:: congelado alterado vs 1.0.213"; exit 1; }
          SRC=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_213_SHA" HEAD -- desktop/src | grep -v '^desktop/src/renderer/index\.html$' || true)
          [ -z "$SRC" ] || { echo "::error:: src além do index.html vs 1.0.213: $SRC"; exit 1; }
          echo "GATE F3.5.4W EMPACOTADO: VERIFIED."

      - name: Empacotar bundle (EXE/MSI/latest.yml/blockmap/SBOM/SHA256SUMS/VERSAO-DESKTOP)
        working-directory: ${{ env.APP_DIR }}
        env: { APP_VERSION: "1.0.214" }
        run: |
          set -e
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.214-compact-cards-details (CANDIDATA — cards compactos, central de detalhes, avatares, social)"
            echo "channel     : latest (estrutura do updater; NADA publicado neste build)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "base-codigo : Desktop 1.0.213 (commit e626d36 = tag v1.0.213; baseline FÍSICA aprovada; rollback imediato)"
            echo "rollback2   : Desktop 1.0.211 OFICIAL (commit fe303b8)"
            echo "origem      : F3.5.4W — cards compactos (resumo, altura controlada) + Central de Detalhes grande (blocos numerados, acordeões, Esc/foco) + avatares (correção do container) + Social Medias (auto-render por estado). Só o renderer index.html muda vs 1.0.213. Notificações/SLA/Card Premium/Cronograma/updater/persistência(main)/auth/quantidade de vídeos/Android: INTOCADOS (byte vs 1.0.213)."
            echo "distribuicao: CANDIDATA — build gated; publicacao no Latest ocorre no workflow desktop-release-f354w.yml (mesmos bytes deste run)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload artifact — installer (EXE + MSI) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.214-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30
      - name: Upload artifact — updatemeta PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.214-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
