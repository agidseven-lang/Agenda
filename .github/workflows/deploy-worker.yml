# Deploy manual SEGURO do Worker `idseven-push` — publica SOMENTE o código
# canônico V64.59 com o SLA Engine DESLIGADO (nenhuma variável SLA é criada).
#
# Acionado SOMENTE manualmente (workflow_dispatch). Nunca em push.
# Secrets do GitHub usados (apenas NOMES; valores nunca aparecem aqui nem no log):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#
# Salvaguardas (F2.5):
#   1) checkout do código canônico (default: worker/v64-59-canonical) + assert V64.59;
#   2) assert wrangler.toml SEM nenhuma variável SLA (SLA OFF por construção);
#   3) BACKUP do script ativo de produção via API + sha256 (artefato p/ rollback byte-exato);
#   4) SNAPSHOT de variáveis (nomes+tipos) ANTES (e assert sem SLA_*);
#   5) `wrangler deploy --keep-vars` (preserva vars do painel; secrets nunca são tocados);
#   6) assert versão pós-deploy == V64.59;
#   7) SNAPSHOT de variáveis DEPOIS: assert NENHUMA sumiu e NENHUMA SLA_* foi criada;
#   8) 403 OBRIGATÓRIO nas 5 rotas /sla-* (falha se qualquer uma responder 200);
#   9) smoke das rotas existentes (/, /share, notify-designer dryRun — sem enviar push);
#  10) ROLLBACK automático e validado se qualquer checagem PÓS-deploy falhar.
#
# NÃO cria/rotaciona secrets. NÃO ativa SLA. NÃO escreve em Firestore. NÃO envia
# FCM/Web Push/WhatsApp. NÃO toca Firestore Rules/Functions/appConfig.
name: Deploy Worker (idseven-push)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit do código canônico a publicar"
        required: true
        default: "worker/v64-59-canonical"

permissions:
  contents: read

concurrency:
  group: deploy-worker-idseven-push
  cancel-in-progress: false

env:
  WORKER_NAME: idseven-push
  WORKER_URL: https://idseven-push.agidseven.workers.dev

jobs:
  deploy:
    name: deploy seguro V64.59 (SLA OFF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (código canônico)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pré-deploy — assert fonte V64.59 e wrangler.toml SEM vars SLA
        run: |
          set -euo pipefail
          echo "ref a publicar: ${{ github.event.inputs.ref }}"
          grep -qE 'version: *"V64\.59' cloudflare-worker.js \
            || { echo "ABORTAR: cloudflare-worker.js não é V64.59"; exit 1; }
          echo "OK: fonte V64.59 confirmada"
          if grep -qE 'SLA_ENGINE_ENABLED|SLA_WRITE|SLA_ACTIVATED_AT' wrangler.toml; then
            echo "ABORTAR: wrangler.toml contém variável SLA — esta fase é SLA OFF"; exit 1
          fi
          echo "OK: wrangler.toml sem nenhuma variável SLA"

      - name: Backup — script ATIVO de produção + versão atual (API Cloudflare)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p worker-ops-logs
          echo "== versão ANTES (GET /) =="
          curl -sS --max-time 25 "$WORKER_URL/" | tee worker-ops-logs/versao-antes.json; echo
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME"
          echo "== backup do script ativo =="
          curl -sS --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "$API" -o worker-ops-logs/backup-producao.js
          test -s worker-ops-logs/backup-producao.js || { echo "ABORTAR: backup vazio (token/conta?)"; exit 1; }
          sha256sum worker-ops-logs/backup-producao.js | tee worker-ops-logs/backup-producao.sha256

      - name: Snapshot de variáveis ANTES (nomes+tipos; valores nunca saem)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME/settings"
          curl -sS --max-time 25 -H "Authorization: Bearer $CF_TOKEN" "$API" -o worker-ops-logs/settings-antes.json
          node -e '
            const fs=require("fs");
            const s=JSON.parse(fs.readFileSync("worker-ops-logs/settings-antes.json","utf8"));
            const b=((s.result||{}).bindings||[]).map(x=>x.name+" ("+x.type+")").sort();
            fs.writeFileSync("worker-ops-logs/vars-antes.txt", b.join("\n")+"\n");
            console.log("bindings ANTES (nomes/tipos):\n"+(b.join("\n")||"(nenhum)"));
            const sla=b.filter(n=>/^SLA_/.test(n));
            if(sla.length){ console.error("ABORTAR: variável SLA já presente ANTES: "+sla.join(", ")); process.exit(1); }
            console.log("OK: nenhuma variável SLA antes do deploy");
          '

      - name: Deploy — wrangler deploy --keep-vars (preserva vars do painel + secrets)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars 2>&1 | tee worker-ops-logs/deploy.txt
          grep -qiE 'Deployed|Current Version|Uploaded' worker-ops-logs/deploy.txt \
            || { echo "ABORTAR: deploy sem confirmação no output do wrangler"; exit 1; }
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Pós-deploy — versão V64.59 + vars preservadas + sem var SLA nova
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 5
          echo "== versão DEPOIS (GET /) =="
          curl -sS --max-time 25 "$WORKER_URL/" | tee worker-ops-logs/versao-depois.json; echo
          grep -qE 'V64\.59' worker-ops-logs/versao-depois.json \
            || { echo "ABORTAR: versão pós-deploy não é V64.59"; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME/settings"
          curl -sS --max-time 25 -H "Authorization: Bearer $CF_TOKEN" "$API" -o worker-ops-logs/settings-depois.json
          node -e '
            const fs=require("fs");
            const after=JSON.parse(fs.readFileSync("worker-ops-logs/settings-depois.json","utf8"));
            const a=((after.result||{}).bindings||[]).map(x=>x.name).sort();
            fs.writeFileSync("worker-ops-logs/vars-depois.txt", a.join("\n")+"\n");
            const before=fs.readFileSync("worker-ops-logs/vars-antes.txt","utf8").trim().split("\n")
              .map(l=>l.replace(/ \(.*/,"")).filter(Boolean);
            console.log("bindings DEPOIS (nomes):\n"+(a.join("\n")||"(nenhum)"));
            const missing=before.filter(n=>!a.includes(n));
            const slaNew=a.filter(n=>/^SLA_/.test(n));
            if(missing.length){ console.error("ABORTAR: variável(is) SUMIRAM no deploy: "+missing.join(", ")); process.exit(1); }
            if(slaNew.length){ console.error("ABORTAR: variável SLA criada no deploy: "+slaNew.join(", ")); process.exit(1); }
            console.log("OK: todas as variáveis preservadas; nenhuma variável SLA criada");
          '

      - name: Pós-deploy — 403 OBRIGATÓRIO nas 5 rotas /sla-* (SLA off)
        run: |
          set -euo pipefail
          fail=0
          for r in sla-dryrun sla-reschedule-plan sla-discover sla-legacy-baseline sla-legacy-risk; do
            code=$(curl -s --max-time 25 -o /dev/null -w "%{http_code}" -X POST "$WORKER_URL/$r" \
              -H "Content-Type: application/json" -d '{}')
            echo "/$r -> $code"
            [ "$code" = "403" ] || { echo "FALHA: /$r retornou $code (esperado 403 — SLA NÃO deve estar ativo)"; fail=1; }
          done
          [ "$fail" = "0" ] || { echo "ABORTAR: rota /sla-* não-403 — SLA pode estar ativo"; exit 1; }
          echo "OK: 5/5 rotas /sla-* retornaram 403 (SLA desligado)"

      - name: Pós-deploy — smoke das rotas existentes (/, /share, notify-designer dryRun)
        run: |
          set -euo pipefail
          echo "== GET / =="; curl -sS --max-time 25 "$WORKER_URL/"; echo
          echo "== /share (rota pública existe; não pode 5xx) =="
          sc=$(curl -s --max-time 25 -o /dev/null -w "%{http_code}" "$WORKER_URL/share/cronograma/__smoke_ci__")
          echo "/share/cronograma/__smoke_ci__ -> $sc"
          [ "$sc" -lt 500 ] || { echo "ABORTAR: /share retornou 5xx"; exit 1; }
          echo "== notify-designer dryRun (NÃO envia push) =="
          curl -sS --max-time 25 -X POST "$WORKER_URL/notify-designer" \
            -H "Content-Type: application/json" -d '{"id":"__dryrun_ci__","dryRun":true}'; echo

      # F3.3.73I6C18B — medição READ-ONLY dos gates de latência (não altera nada;
      # token DUMMY; GET/HEAD × UAs × 3 iterações: 1ª fria/MISS, demais quentes/HIT).
      - name: Pós-deploy — TTFB /share (GET/HEAD × UA; X-Share-Cache MISS→HIT)
        run: |
          set -euo pipefail
          mkdir -p worker-ops-logs
          TOKEN="c18bpost0001"
          # Estabilização da PROPAGAÇÃO GRADUAL do deploy (run 73: medir cedo demais capturou
          # a versão ANTIGA em alguns colos → falso-negativo → rollback). Exige 5 HEADs
          # consecutivos text/html no domínio custom (máx. 120 s) antes de medir/assertar.
          echo "== aguardando propagação estabilizar (HEAD /share text/html x5 consecutivos) =="
          CONSEC=0; DEADLINE=$(( $(date +%s) + 120 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CT=$(curl -sSI --max-time 15 -A "propagation-check" "https://aprovar.agendaidseven.com.br/share/cronograma/$TOKEN" 2>/dev/null | grep -i '^content-type:' | tr -d '\r' | sed 's/^[^:]*: *//' || true)
            case "$CT" in text/html*) CONSEC=$((CONSEC+1));; *) CONSEC=0;; esac
            [ "$CONSEC" -ge 5 ] && break
            sleep 3
          done
          [ "$CONSEC" -ge 5 ] || { echo "ABORTAR: propagação não estabilizou em 120s (HEAD ainda fora do handler novo)"; exit 1; }
          echo "OK: propagação estável ($CONSEC HEADs text/html consecutivos)"
          TSV=worker-ops-logs/ttfb.tsv
          printf 'origin\tua\tmethod\titer\thttp\tcontent_type\tttfb_s\ttotal_s\tx_share_cache\tserver_timing\n' > "$TSV"
          for ORPAIR in "custom|https://aprovar.agendaidseven.com.br" "workers|$WORKER_URL"; do
            ORIGIN="${ORPAIR%%|*}"; BASE="${ORPAIR#*|}"
            for UA in "browser|Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "fb|facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "wa|WhatsApp/2.23.20.0"; do
              UAN="${UA%%|*}"; UAV="${UA#*|}"
              for M in GET HEAD; do
                for i in 1 2 3; do
                  HDR=worker-ops-logs/h.txt
                  args=(-sS --max-time 30 -D "$HDR" -o /dev/null -w "%{http_code}\t%{content_type}\t%{time_starttransfer}\t%{time_total}" -A "$UAV")
                  [ "$M" = "HEAD" ] && args+=(-I)
                  W=$(curl "${args[@]}" "$BASE/share/cronograma/$TOKEN" || printf '000\t\t0\t0')
                  XSC=$(grep -i '^x-share-cache:' "$HDR" 2>/dev/null | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//' || true)
                  ST=$(grep -i '^server-timing:' "$HDR" 2>/dev/null | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//' || true)
                  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$ORIGIN" "$UAN" "$M" "$i" "$W" "${XSC:--}" "${ST:--}" >> "$TSV"
                done
              done
            done
          done
          echo "===== TTFB matrix (token dummy $TOKEN) ====="
          column -t -s "$(printf '\t')" "$TSV"
          # Asserts do hotfix (com token DUMMY): HEAD text/html (nunca JSON) + handler novo
          # ativo (X-Share-Cache presente). HIT ao vivo NÃO é assertável com dummy: task
          # inexistente NUNCA é cacheada (regra no-poison) — prova de HIT: suíte hermética
          # B4-B7 + validação com link real do owner (miss→hit no 2º acesso).
          if grep -P '\tHEAD\t' "$TSV" | grep -q 'application/json'; then echo "ABORTAR: HEAD /share ainda responde JSON"; exit 1; fi
          MISSES=$(grep -cPE '\t(miss|bypass)\t' "$TSV" || true)
          [ "$MISSES" -ge 1 ] || { echo "ABORTAR: X-Share-Cache ausente (miss/bypass) — handler novo não está ativo"; exit 1; }
          echo "OK: HEAD=text/html em todas as iterações e handler C18B ativo (X-Share-Cache presente em $MISSES respostas)"

      # F3.3.73I6C18E — validação REAL-TOKEN pós-deploy (tokens SOMENTE via secrets;
      # redigidos/mascarados; URLs nunca impressas). Exige: tarefa RESOLVIDA
      # (X-Share-Task=resolved), og:title do TIPO certo, arte do TIPO certo no corpo,
      # MISS→HIT no GET#2 e artes por tipo distintas/íntegras. Falha => rollback (step seguinte).
      # F3.3.73I6C20 — L3: validação de CONTRATO em produção (read-only, token DUMMY;
      # secrets C18E mortos por rotação NÃO são requisito — a prova de resolved fica em
      # L1/L2 com fixtures no worker REAL e no owner-run final ÚNICO).
      - name: Pós-deploy — validação de CONTRATO C20 (read-only, dummy)
        run: |
          set -euo pipefail
          B="https://aprovar.agendaidseven.com.br"
          T="c20contract0001"
          fail=0
          hv() { grep -i "^$1:" "$2" 2>/dev/null | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//' || true; }
          # not_found EXPLÍCITO: 404 + headers do contrato + SEM card premium de tipo
          st=$(curl -sS --max-time 30 -D h1.txt -o b1.html -w '%{http_code}' "$B/share/cronograma/$T" || echo 000)
          task="$(hv x-share-task h1.txt)"; typ="$(hv x-share-type h1.txt)"; cc="$(hv cache-control h1.txt)"
          [ "$st" = "404" ] || { echo "FALHA: dummy status=$st (esperado 404)"; fail=1; }
          [ "$task" = "not_found" ] || { echo "FALHA: X-Share-Task=$task"; fail=1; }
          [ "$typ" = "none" ] || { echo "FALHA: X-Share-Type=$typ"; fail=1; }
          case "$cc" in *no-store*) : ;; *) echo "FALHA: Cache-Control=$cc (esperado no-store)"; fail=1;; esac
          if grep -q 'content="Aprovar cronograma"' b1.html || grep -q 'content="Aprovar roteiro"' b1.html; then
            echo "FALHA: not_found ainda serve card de tipo"; fail=1; fi
          grep -q "Link inválido ou expirado" b1.html || { echo "FALHA: página explícita ausente"; fail=1; }
          # HEAD consistente
          hst=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -I "$B/share/cronograma/$T" || echo 000)
          hct=$(curl -sSI --max-time 30 "$B/share/cronograma/$T" | grep -i '^content-type:' | tr -d '\r' | sed 's/^[^:]*: *//' || true)
          [ "$hst" = "404" ] || { echo "FALHA: HEAD dummy=$hst"; fail=1; }
          case "$hct" in text/html*) : ;; *) echo "FALHA: HEAD CT=$hct"; fail=1;; esac
          # imagens por tipo (cron intacta byte-exata; roteiro com logo; alias v64-59)
          s1=$(curl -sS --max-time 30 "$B/og/wa-card-v64-39.jpg" | sha256sum | cut -d' ' -f1)
          s2=$(curl -sS --max-time 30 "$B/og/wa-card-roteiro-v64-60.jpg" | sha256sum | cut -d' ' -f1)
          s2a=$(curl -sS --max-time 30 "$B/og/wa-card-roteiro-v64-59.jpg" | sha256sum | cut -d' ' -f1)
          echo "cron: $s1"; echo "rot : $s2"
          [ "$s1" = "c038636db3cf294b1edf34820c5fc68cca1ae13cd28c94a203d0590c44843eea" ] || { echo "FALHA: arte do Cronograma divergente"; fail=1; }
          [ "$s2" = "f64f6f3e36020b05ae2491a544fb45937e7798d3e48eeae5865aa04549389cf3" ] || { echo "FALHA: arte do Roteiro divergente"; fail=1; }
          [ "$s2a" = "$s2" ] || { echo "FALHA: alias v64-59 difere"; fail=1; }
          [ "$s1" != "$s2" ] || { echo "FALHA: artes iguais"; fail=1; }
          rm -f b1.html h1.txt
          [ "$fail" = 0 ] || { echo "ABORTAR: contrato C20 reprovado — rollback a seguir"; exit 1; }
          echo "OK: contrato C20 validado em produção (dummy; zero tokens reais)"

      - name: Rollback AUTOMÁTICO se a validação pós-deploy falhou (validado)
        if: ${{ failure() && steps.deploy.outputs.deployed == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "Falha PÓS-deploy detectada — revertendo ao deployment anterior do Cloudflare"
          npx --yes wrangler@4 rollback --name "$WORKER_NAME" -y 2>&1 | tee worker-ops-logs/rollback.txt \
            || npx --yes wrangler@4 rollback -y 2>&1 | tee -a worker-ops-logs/rollback.txt || true
          sleep 5
          echo "== versão após rollback (deve voltar à anterior) =="
          curl -sS --max-time 25 "$WORKER_URL/" | tee worker-ops-logs/versao-rollback.json; echo
          echo "Alternativa byte-exata: redeploy de worker-ops-logs/backup-producao.js (artefato)."

      - name: Upload evidências (backup, snapshots, versões, deploy/rollback logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-worker-evidence
          path: worker-ops-logs/
          retention-days: 30
