# Deploy manual do Worker `idseven-push` no Cloudflare.
# - Roda SOMENTE quando acionado manualmente (workflow_dispatch). Nunca em push.
# - Usa o wrangler.toml do repositorio (name, vars plaintext, cron * * * * *).
# - Credenciais vem dos SECRETS do GitHub (nunca escritas neste arquivo).
# - `wrangler deploy` publica o script + vars + cron. NAO altera os secrets do
#   Worker (FCM_CLIENT_EMAIL, FCM_PRIVATE_KEY, IMAGEKIT_PRIVATE_KEY permanecem).
name: Deploy Worker (idseven-push)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID p/ dryRun /notify-designer (opcional)"
        required: false
        type: string
      client_share_token:
        description: "shareToken real de uma task p/ validar a rota pública /cliente/cronograma/<token> (opcional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Verificacao pos-deploy (rede aberta no runner). dryRun NAO envia push.
      # Aceita TASK_ID opcional via input p/ comprovar destinatario/tokens com doc real.
      - name: Verificar deploy + dryRun /notify-designer (sem enviar push)
        run: |
          B="https://idseven-push.agidseven.workers.dev"
          echo "== HEALTH (espera version V64.13-agency-operational-phase-fix) =="
          curl -sS "$B/" ; echo
          echo "== dryRun id de teste (NAO envia; espera 'tarefa nao encontrada') =="
          curl -sS -X POST "$B/notify-designer" -H "Content-Type: application/json" -d '{"id":"__dryrun_ci__","dryRun":true}' ; echo
          TID="${{ github.event.inputs.task_id }}"
          if [ -n "$TID" ]; then
            echo "== dryRun com TASK_ID real (NAO envia; mostra designer/tokens/payload) =="
            curl -sS -X POST "$B/notify-designer" -H "Content-Type: application/json" -d "{\"id\":\"$TID\",\"dryRun\":true}" ; echo
          else
            echo "(sem task_id informado — pulei a prova com doc real; informe task_id no dispatch p/ comprovar destinatario/tokens)"
          fi

      # V64.6: prova de que a rota publica do CLIENTE retorna HTML (NAO JSON / NAO tela branca).
      # Falha o job se a rota voltar JSON ou se o status != 200.
      - name: Validar rota publica /cliente/cronograma/:token (HTML, sem regredir healthcheck)
        run: |
          set -euo pipefail
          B="https://idseven-push.agidseven.workers.dev"

          echo "== A) Healthcheck DEVE continuar JSON =="
          ct_root=$(curl -sS -o /dev/null -w '%{content_type}' "$B/")
          echo "Content-Type root = $ct_root"
          case "$ct_root" in
            application/json*) echo "OK: healthcheck preservado" ;;
            *) echo "FAIL: healthcheck deveria ser application/json" >&2 ; exit 1 ;;
          esac

          echo "== B) Token invalido DEVE retornar HTML amigavel (NAO JSON) =="
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' "$B/cliente/cronograma/__invalido_ci__")
          ct=$(curl -sS -o /dev/null -w '%{content_type}' "$B/cliente/cronograma/__invalido_ci__")
          echo "HTTP=$code  Content-Type=$ct"
          if ! echo "$ct" | grep -qi 'text/html'; then
            echo "FAIL: token invalido NAO retornou text/html (atual: $ct)" >&2 ; head -c 400 "$tmp" >&2 ; echo >&2 ; exit 1
          fi
          if head -c 200 "$tmp" | grep -qi '"ok":true,"service":"idseven-push"'; then
            echo "FAIL: token invalido retornou JSON do healthcheck (regressao do fallback)" >&2 ; exit 1
          fi
          if ! head -c 200 "$tmp" | grep -qi '<!doctype html'; then
            echo "FAIL: corpo nao comeca com <!doctype html>" >&2 ; head -c 400 "$tmp" >&2 ; echo >&2 ; exit 1
          fi
          echo "OK: rota publica retorna HTML para token invalido (sem tela branca / sem JSON cru)"

          CTOKEN="${{ github.event.inputs.client_share_token }}"
          if [ -n "$CTOKEN" ]; then
            echo "== C) Token real DEVE retornar HTML com dados do cronograma =="
            tmp2=$(mktemp)
            code2=$(curl -sS -o "$tmp2" -w '%{http_code}' "$B/cliente/cronograma/$CTOKEN")
            ct2=$(curl -sS -o /dev/null -w '%{content_type}' "$B/cliente/cronograma/$CTOKEN")
            echo "HTTP=$code2  Content-Type=$ct2  bytes=$(wc -c < $tmp2)"
            echo "---- primeiros 500 bytes do corpo (diagnostico) ----"
            head -c 500 "$tmp2" ; echo ; echo "----------------------------------------------------"
            [ "$code2" = "200" ] || { echo "FAIL: esperava 200 com token real" >&2 ; exit 1 ; }
            echo "$ct2" | grep -qi 'text/html' || { echo "FAIL: token real NAO retornou text/html" >&2 ; exit 1 ; }
            grep -q 'Visão do Cliente'       "$tmp2" || { echo "FAIL: HTML nao contem 'Visao do Cliente'" >&2 ; exit 1 ; }
            grep -q 'Aprovar cronograma'     "$tmp2" || { echo "FAIL: HTML nao contem 'Aprovar cronograma'" >&2 ; exit 1 ; }
            grep -q 'Pedir revisão'          "$tmp2" || { echo "FAIL: HTML nao contem 'Pedir revisao'" >&2 ; exit 1 ; }
            grep -q "data-act=\"approveItem\"" "$tmp2" || { echo "FAIL: HTML nao contem acao por item (approveItem)" >&2 ; exit 1 ; }
            grep -q "data-act=\"editLegenda\"" "$tmp2" || { echo "FAIL: HTML nao contem edicao individual (editLegenda)" >&2 ; exit 1 ; }
            echo "OK: rota publica renderizou a nova Visao do Cliente premium (com acoes por item)"
          else
            echo "(sem client_share_token informado — pulei a prova com token real; informe no dispatch p/ validar dados de uma task real)"
          fi

      # V64.20: prova REAL (rede aberta no runner) de que o banner premium do link
      # responde image/png 1200x630, no dominio CUSTOM e no fallback workers.dev,
      # SEM regredir o healthcheck JSON. Falha o job se qualquer assercao quebrar.
      - name: Validar banner premium /og/aprovar.png (image/png 1200x630, custom + fallback)
        run: |
          set -euo pipefail
          assert_png () {
            local URL="$1" ; local LABEL="$2" ; local f
            f=$(mktemp)
            echo "== $LABEL :: $URL =="
            local ct code
            code=$(curl -sS --max-time 25 -o "$f" -w '%{http_code}' "$URL")
            ct=$(curl -sS --max-time 25 -o /dev/null -w '%{content_type}' "$URL")
            local sz; sz=$(wc -c < "$f")
            echo "HTTP=$code  Content-Type=$ct  bytes=$sz"
            [ "$code" = "200" ] || { echo "FAIL[$LABEL]: status != 200" >&2 ; exit 1 ; }
            echo "$ct" | grep -qi 'image/png' || { echo "FAIL[$LABEL]: Content-Type nao e image/png" >&2 ; exit 1 ; }
            # assinatura PNG + dimensoes 1200x630 lidas do IHDR
            node -e '
              const b=require("fs").readFileSync(process.argv[1]);
              const sig=[0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a].every((x,i)=>b[i]===x);
              const w=b.readUInt32BE(16), h=b.readUInt32BE(20);
              if(!sig){console.error("FAIL: assinatura PNG invalida");process.exit(1);}
              if(w!==1200||h!==630){console.error("FAIL: dimensoes "+w+"x"+h+" != 1200x630");process.exit(1);}
              console.log("OK: PNG valido "+w+"x"+h+" ("+b.length+" bytes)");
            ' "$f"
          }
          assert_png "https://aprovar.agendaidseven.com.br/og/aprovar.png" "DOMINIO CUSTOM"
          assert_png "https://idseven-push.agidseven.workers.dev/og/aprovar.png" "FALLBACK workers.dev"

          echo "== Healthcheck DEVE continuar JSON nos dois dominios =="
          for B in "https://aprovar.agendaidseven.com.br" "https://idseven-push.agidseven.workers.dev"; do
            ct=$(curl -sS --max-time 25 -o /dev/null -w '%{content_type}' "$B/")
            echo "$B/ -> $ct"
            echo "$ct" | grep -qi 'application/json' || { echo "FAIL: healthcheck regrediu em $B" >&2 ; exit 1 ; }
          done
          echo "OK: banner premium servido image/png 1200x630 no custom e no fallback; healthcheck preservado."

      # V64.24 — CANARIO OG ISOLADO: HTML minimo p/ TODOS os UAs + imagem JPEG.
      - name: Validar canario V64.24 (HTML minimo + JPEG, HEAD+GET)
        run: |
          set -euo pipefail
          B="https://aprovar.agendaidseven.com.br"

          echo "== Canario HTML /wa-card-test-v64-24 (GET, qualquer UA) =="
          h=$(mktemp)
          code=$(curl -sS --max-time 25 -o "$h" -w '%{http_code}' "$B/wa-card-test-v64-24")
          ct=$(curl -sS --max-time 25 -o /dev/null -w '%{content_type}' "$B/wa-card-test-v64-24")
          echo "HTTP=$code  Content-Type=$ct  bytes=$(wc -c < "$h")"
          [ "$code" = "200" ] || { echo "FAIL: canario != 200" >&2; exit 1; }
          echo "$ct" | grep -qi 'text/html' || { echo "FAIL: canario nao e text/html" >&2; exit 1; }
          # OG nos primeiros 1KB
          head -c 1024 "$h" | grep -qi 'og:image" content="https://aprovar.agendaidseven.com.br/og/wa-card-v64-24.jpg"' || { echo "FAIL: og:image JPG ausente no topo" >&2; head -c 400 "$h"; exit 1; }
          grep -qi 'og:image:type" content="image/jpeg"' "$h" || { echo "FAIL: og:image:type image/jpeg ausente" >&2; exit 1; }
          grep -qi '?' <(grep -o 'wa-card-v64-24.jpg[^"]*' "$h" | head -1) && { echo "FAIL: querystring na imagem" >&2; exit 1; } || true
          echo "OK: canario HTML minimo com OG/JPEG no topo."

          echo "== Canario HEAD /wa-card-test-v64-24 =="
          curl -sS --max-time 25 -I "$B/wa-card-test-v64-24" | grep -iE 'HTTP/|content-type' || { echo "FAIL: HEAD html" >&2; exit 1; }

          echo "== Imagem JPEG /og/wa-card-v64-24.jpg (GET) =="
          j=$(mktemp)
          jcode=$(curl -sS --max-time 25 -o "$j" -w '%{http_code}' "$B/og/wa-card-v64-24.jpg")
          jct=$(curl -sS --max-time 25 -o /dev/null -w '%{content_type}' "$B/og/wa-card-v64-24.jpg")
          echo "HTTP=$jcode  Content-Type=$jct  bytes=$(wc -c < "$j")"
          [ "$jcode" = "200" ] || { echo "FAIL: jpg != 200" >&2; exit 1; }
          echo "$jct" | grep -qi 'image/jpeg' || { echo "FAIL: nao e image/jpeg" >&2; exit 1; }
          node -e '
            const b=require("fs").readFileSync(process.argv[1]);
            const soi=b[0]===0xff&&b[1]===0xd8, eoi=b[b.length-2]===0xff&&b[b.length-1]===0xd9;
            if(!soi||!eoi){console.error("FAIL: JPEG invalido (SOI/EOI)");process.exit(1);}
            console.log("OK: JPEG valido ("+b.length+" bytes)");
          ' "$j"

          echo "== Imagem HEAD /og/wa-card-v64-24.jpg =="
          curl -sS --max-time 25 -I "$B/og/wa-card-v64-24.jpg" | grep -iE 'HTTP/|content-type|content-length|cache-control' || { echo "FAIL: HEAD jpg" >&2; exit 1; }
          echo "OK: canario V64.24 validado (HTML minimo + JPEG image/jpeg, HEAD+GET)."

          echo "== V64.25 — canarios novos + /preview + /wa-diag =="
          for P in "/wa-card-test-v64-25-a" "/wa-card-test-v64-25-b" "/preview"; do
            c=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$B$P")
            ctp=$(curl -sS --max-time 25 -o /dev/null -w '%{content_type}' "$B$P")
            echo "$P -> HTTP=$c $ctp"
            [ "$c" = "200" ] || { echo "FAIL: $P != 200" >&2; exit 1; }
            echo "$ctp" | grep -qi 'text/html' || { echo "FAIL: $P nao e text/html" >&2; exit 1; }
          done
          for J in "/og/wa-card-v64-25-a.jpg" "/og/wa-card-v64-25-b.jpg" "/preview.jpg"; do
            c=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$B$J")
            ctj=$(curl -sS --max-time 25 -o /dev/null -w '%{content_type}' "$B$J")
            echo "$J -> HTTP=$c $ctj"
            [ "$c" = "200" ] || { echo "FAIL: $J != 200" >&2; exit 1; }
            echo "$ctj" | grep -qi 'image/jpeg' || { echo "FAIL: $J nao e image/jpeg" >&2; exit 1; }
          done
          echo "== /wa-diag responde JSON (instrumentacao ativa) =="
          dct=$(curl -sS --max-time 25 -o /tmp/diag.json -w '%{content_type}' "$B/wa-diag")
          echo "Content-Type=$dct ; corpo:"; head -c 300 /tmp/diag.json; echo
          echo "$dct" | grep -qi 'application/json' || { echo "FAIL: /wa-diag nao e JSON" >&2; exit 1; }
          echo "OK: V64.25 canarios+preview+wa-diag validados."
