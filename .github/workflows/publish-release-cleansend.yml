# Publica RELEASE do hotfix de envio limpo (Desktop 1.0.117 + Android 1.0.106).
name: Publicar release clean-send (1.0.117 + 1.0.106)

on:
  push:
    branches: [ "infra/publish-release-cleansend" ]

permissions:
  contents: write

env:
  DESKTOP_RUN: "27099787820"
  ANDROID_RUN: "27099640709"
  DESKTOP_ARTIFACT: "agenda-id-seven-desktop-1.0.117-whatsapp-clean-send-hotfix-installer"
  ANDROID_ARTIFACT: "idseven-nativebeta-1.0.106-beta-whatsapp-clean-send-hotfix"
  TAG: "test/whatsapp-clean-send-1.0.117-1.0.106"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar instalador Desktop (cross-run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DESKTOP_ARTIFACT }}
          path: dl/desktop
          run-id: ${{ env.DESKTOP_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar APK Android (cross-run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANDROID_ARTIFACT }}
          path: dl/android
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Localizar binarios + SHA-256 (prova)
        run: |
          set -euo pipefail
          echo "== baixado =="; find dl -type f | sort
          EXE=$(ls dl/desktop/*.exe 2>/dev/null | head -1 || true)
          MSI=$(ls dl/desktop/*.msi 2>/dev/null | head -1 || true)
          APK=$(ls dl/android/*.apk 2>/dev/null | head -1 || true)
          [ -n "$EXE" ] || { echo "::error:: .exe ausente"; exit 1; }
          [ -n "$APK" ] || { echo "::error:: .apk ausente"; exit 1; }
          EXE_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          MSI_SHA=$([ -n "$MSI" ] && sha256sum "$MSI" | cut -d' ' -f1 || echo "n/a")
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          { echo "EXE  $(basename "$EXE")"; echo "     $EXE_SHA";
            echo "MSI  $([ -n "$MSI" ] && basename "$MSI" || echo n/a)"; echo "     $MSI_SHA";
            echo "APK  $(basename "$APK")"; echo "     $APK_SHA"; } | tee SHA256SUMS.txt
          { echo "EXE_NAME=$(basename "$EXE")"; echo "MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo n/a)";
            echo "APK_NAME=$(basename "$APK")"; echo "EXE_SHA=$EXE_SHA"; echo "MSI_SHA=$MSI_SHA"; echo "APK_SHA=$APK_SHA"; } >> "$GITHUB_ENV"

      - name: Publicar Release (link unico)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "HOTFIX — envio WhatsApp LIMPO (Desktop 1.0.117 + Android 1.0.106)"
          prerelease: true
          body: |
            **HOTFIX: nunca mais enviar `web.whatsapp.com/send?text=` ao cliente**

            - Desktop: **1.0.117-whatsapp-clean-send-hotfix** (run ${{ env.DESKTOP_RUN }}) — botão "Salvar imagem e abrir WhatsApp": salva a imagem, abre a pasta, **copia só a mensagem limpa** e abre **somente** `whatsapp://` (ou `https://web.whatsapp.com/`) — **sem** `send?text=`. Removidos os builders de URL técnica.
            - Android: **1.0.106-beta-whatsapp-clean-send-hotfix** (versionCode 104 · run ${{ env.ANDROID_RUN }}) — paridade (envio é do Desktop).
            - Worker / card / OG: **INALTERADOS**.

            Clipboard (exato):
            ```
            Olá, [cliente]. 👋

            Seu *cronograma quinzenal* já está disponível para avaliação.

            Toque no link abaixo para revisar e aprovar:

            https://aprovar.agendaidseven.com.br/cliente/cronograma/<TOKEN>

            *Equipe ID Seven*
            ```

            **SHA-256**
            ```
            EXE  ${{ env.EXE_NAME }}
                 ${{ env.EXE_SHA }}
            MSI  ${{ env.MSI_NAME }}
                 ${{ env.MSI_SHA }}
            APK  ${{ env.APK_NAME }}
                 ${{ env.APK_SHA }}
            ```
          files: |
            dl/desktop/*.exe
            dl/desktop/*.msi
            dl/android/*.apk
            SHA256SUMS.txt
