# =====================================================================
# [manual] F3.3.74F — CAPTURA AO VIVO DO CRAWLER (FASE 3 do mandato).
#
# Abre uma janela de observação (wrangler tail, READ-ONLY) no Worker de
# PRODUÇÃO `idseven-push` enquanto a equipe cola o link no WhatsApp
# Business QA. Responde com PROVA: o WhatsApp/Meta requisitou a URL?
# quando? GET ou HEAD? com que user-agent? que status recebeu? em quanto
# tempo? pediu a imagem depois?
#
# SANITIZAÇÃO OBRIGATÓRIA: tokens NUNCA aparecem — todo token no path é
# substituído por <tok:sha8> (hash não reversível, só para distinguir
# URLs). Console logs do worker passam pela mesma redação. Nenhum dado
# de cliente sai no log/artifact (o /share não contém dado de cliente;
# eventos do portal têm o corpo ignorado — só método/status/UA).
#
# READ-ONLY absoluto: tail de observação; nenhum deploy, nenhuma config,
# nenhum secret novo, nenhuma escrita em KV/Firestore.
# Extra (fecha thread da FASE 4): despeja o CONTEÚDO do robots.txt do
# domínio custom (público) e a contagem de metas OG da página not_found.
# =====================================================================
name: "[manual] F3.3.74F Crawler Capture (tail janela)"

"on":
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "Duração da janela de captura (minutos, 3..55)"
        required: false
        default: "12"
      note:
        description: "Etiqueta da tentativa (ex.: colagem-1.0.174-cron-grupoQA)"
        required: false
        default: "janela-sem-etiqueta"
      # F3.3.74H1: CHOICE fechado — runs #7/#8 falharam com resíduo de edição do
      # campo textual pré-preenchido ("ididseven-push-qa"/"iidseven-push-qa").
      service:
        description: "Worker a observar"
        required: true
        type: choice
        options:
          - idseven-push-qa
          - idseven-push
        default: idseven-push-qa

permissions:
  contents: read

concurrency:
  group: f3374f-crawler-capture
  cancel-in-progress: false

jobs:
  capture:
    name: tail sanitizado do idseven-push
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WIN_IN: ${{ github.event.inputs.window_minutes }}
      NOTE_IN: ${{ github.event.inputs.note }}
      SVC_IN: ${{ inputs.service }}
    steps:
      - name: Pré-checagens + robots.txt + not_found OG (público, sanitizado)
        run: |
          set -uo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
          mkdir -p out
          echo "===== robots.txt do domínio custom (conteúdo público; fecha thread FASE 4) ====="
          curl -sS --max-time 20 "https://aprovar.agendaidseven.com.br/robots.txt" | tee out/robots-custom.txt
          echo "— bytes: $(wc -c < out/robots-custom.txt)" 
          echo; echo "— linhas Disallow/User-agent:"; grep -cE '^(User-agent|Disallow|Allow)' out/robots-custom.txt || true
          grep -iE '^(User-agent|Disallow|Allow)' out/robots-custom.txt | head -30 || true
          echo; echo "===== página not_found (token dummy): metas robots/OG ====="
          DUMMY="f3374fcapture000000000000000000000000000000000001"
          curl -sS --max-time 30 -A "facebookexternalhit/1.1" -o out/nf.html "https://aprovar.agendaidseven.com.br/share/cronograma/$DUMMY" || true
          echo "metas og: $(grep -c 'property="og:' out/nf.html || true) | meta robots: $(grep -o '<meta name="robots"[^>]*>' out/nf.html | head -1)"
          rm -f out/nf.html

      - name: Janela de captura (wrangler tail sanitizado)
        run: |
          set -uo pipefail
          MIN="${WIN_IN:-12}"
          case "$MIN" in (*[!0-9]*) MIN=12;; esac
          [ "$MIN" -ge 3 ] 2>/dev/null || MIN=3
          [ "$MIN" -le 55 ] 2>/dev/null || MIN=55
          # 74H1: diagnóstico ANTES do guard (service não é segredo) + normalização
          # restrita a whitespace externo/CR-LF; guard continua fail-closed.
          python3 - <<'PY'
          import os
          s = os.environ.get("SVC_IN", "")
          print(f"service recebido repr={s!r} len={len(s)} hex={s.encode('utf-8').hex()}")
          PY
          SVC="$(python3 - <<'PY'
          import os
          print(os.environ.get("SVC_IN", "").strip(), end="")
          PY
          )"
          case "$SVC" in
            idseven-push|idseven-push-qa) : ;;
            *) echo "::error::service inválido após normalização"; exit 1 ;;
          esac
          echo "service validado: $SVC"
          # ============== F3.3.74H2 — FAIL-CLOSED POR SELF-PROBE ==============
          # A janela SÓ é declarada depois que um request de controle nosso
          # aparece DENTRO do stream capturado (banner do wrangler é mera dica,
          # nunca prova). QA (fail-open) espera 200; produção (fail-closed c20)
          # espera 404 determinístico para token sintético.
          if [ "$SVC" = "idseven-push-qa" ]; then
            PHOST="aprovar-qa.agendaidseven.com.br"; PEXPS="200"
          else
            # produção: 200 pós-74J (fail-open) ou 404 se rollback c20 — ambos
            # determinísticos; o gate exige que o MESMO status apareça no tail
            PHOST="aprovar.agendaidseven.com.br"; PEXPS="200 404"
          fi
          npx --yes wrangler@3 --version >/dev/null 2>&1 || true
          ( npx --yes wrangler@3 tail "$SVC" --format json > out/raw.jsonl 2> out/tail-err.txt ) &
          TAILPID=$!
          redact() { sed -E 's#/(share|cliente)/(cronograma|roteiro)/[A-Za-z0-9_-]{4,128}#/\1/\2/<tok>#g' "$1" 2>/dev/null | tail -5 || true; }
          cleanup() { kill "$TAILPID" 2>/dev/null || true; wait "$TAILPID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 3
          kill -0 "$TAILPID" 2>/dev/null || { echo "::error::processo tail morreu ao iniciar"; redact out/tail-err.txt; exit 1; }
          # dica de attach (NÃO é o gate): banner em até 90s; sem alegações
          HD=$(( $(date +%s) + 90 ))
          until grep -qiE 'connected|successfully created tail' out/raw.jsonl out/tail-err.txt 2>/dev/null; do
            [ "$(date +%s)" -lt "$HD" ] || break
            sleep 2
          done
          sleep 3
          # SELF-PROBE ÚNICO: token sintético 48-hex derivado do run (sem Firestore,
          # sem tarefa/cliente/token real); UA exclusivo e rastreável
          PROBE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PTOK=$(printf %s "F3374H2-${PROBE_ID}" | sha256sum | cut -c1-48)
          PUA="F3374H2-TailProbe/${PROBE_ID}"
          PST=$(curl -sS --max-time 25 -A "$PUA" -o /dev/null -w '%{http_code}' "https://$PHOST/share/cronograma/$PTOK" || echo err)
          echo "resposta da sonda HTTP $PST (aceitos: $PEXPS; token <tok:$(printf %s "$PTOK" | sha256sum | cut -c1-8)>; UA=$PUA)"
          case " $PEXPS " in *" $PST "*) : ;; *) echo "::error::self-probe não obteve status aceito ($PEXPS) na borda — abortando (sem janela)"; exit 1;; esac
          PEXP="$PST"
          # GATE: o evento da sonda tem de estar no STREAM (parser JSONDecoder;
          # wrangler emite pretty-printed) — até 90s
          export PTOK PUA PHOST PEXP
          FOUND=0
          GD=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "$GD" ]; do
            if python3 - <<'PY'
          import json, os, sys
          try:
              raw = open('out/raw.jsonl', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              sys.exit(1)
          dec = json.JSONDecoder(); i = 0
          tok = os.environ['PTOK']; ua = os.environ['PUA']
          # O runtime do tail REDIGE o segmento do token na URL (placeholder literal
          # "REDACTED" — sha8 b83c7778, comprovado no run #12). A identidade da sonda
          # vem da ROTA (prefixo) + UA exclusivo do run; aceita-se token exato OU
          # placeholder da plataforma.
          prefix = f"https://{os.environ['PHOST']}/share/cronograma/"
          exp = int(os.environ['PEXP'])
          while True:
              j = raw.find('{', i)
              if j < 0: break
              try:
                  obj, i = dec.raw_decode(raw, j)
              except Exception:
                  i = j + 1; continue
              if not isinstance(obj, dict): continue
              ev = obj.get('event') if isinstance(obj.get('event'), dict) else {}
              req = ev.get('request') if isinstance(ev.get('request'), dict) else {}
              hdrs = req.get('headers') if isinstance(req.get('headers'), dict) else {}
              rua = next((str(v) for k, v in hdrs.items() if k.lower() == 'user-agent'), '')
              resp = ev.get('response') if isinstance(ev.get('response'), dict) else {}
              url = str(req.get('url') or '')
              seg = url[len(prefix):] if url.startswith(prefix) else None
              if (seg in (tok, 'REDACTED') and rua == ua
                      and str(req.get('method')) == 'GET'
                      and resp.get('status') == exp and obj.get('outcome') == 'ok'):
                  sys.exit(0)
          sys.exit(1)
          PY
            then FOUND=1; break; fi
            sleep 3
          done
          if [ "$FOUND" != "1" ]; then
            echo "::error::tail não comprovou captura por self-probe — execução abortada"
            redact out/tail-err.txt
            exit 1
          fi
          echo "evento da sonda encontrado no Tail (host=$PHOST rota=/share/cronograma/<tok:$(printf %s "$PTOK" | sha256sum | cut -c1-8)> método=GET status=$PEXP outcome=ok UA=$PUA)"
          echo "TAIL_ATTACH_PROVADO"
          echo "SELF_PROBE_CAPTURED=1"
          echo "service validado: $SVC"
          echo "== JANELA ATIVA por ${MIN} minutos — serviço: $SVC — etiqueta: ${NOTE_IN:-} =="
          echo "== A equipe deve COLAR o link/mensagem no WhatsApp Business QA AGORA =="
          sleep $(( MIN * 60 ))
          cleanup
          trap - EXIT
          echo "janela encerrada de forma controlada"
          echo "linhas no raw: $(wc -l < out/raw.jsonl 2>/dev/null || echo 0) | linhas-evento (com outcome): $(grep -c '"outcome"' out/raw.jsonl 2>/dev/null || echo 0)"

      - name: Sanitizar + resumir captura
        # 74H2: SEMPRE roda (mesmo com o gate abortando) — o raw NUNCA pode
        # chegar ao artifact sem sanitização (este passo termina removendo-o).
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, re, hashlib, sys, datetime
          tokre = re.compile(r'/(share|cliente)/(cronograma|roteiro)/([A-Za-z0-9_-]{4,128})')
          def red(s):
              def rep(m):
                  h = hashlib.sha256(m.group(3).encode()).hexdigest()[:8]
                  return f'/{m.group(1)}/{m.group(2)}/<tok:{h}>'
              return tokre.sub(rep, s)
          rows = []
          try:
              raw = open('out/raw.jsonl', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              raw = ''
          # wrangler@3 --format json emite eventos PRETTY-PRINTED (multi-linha) misturados
          # a banner/ruído no stdout — decodificar como STREAM, não como JSONL.
          dec = json.JSONDecoder()
          events = []
          i = 0
          while True:
              j = raw.find('{', i)
              if j < 0: break
              try:
                  obj, k = dec.raw_decode(raw, j)
                  events.append(obj); i = k
              except Exception:
                  i = j + 1
          print(f'== objetos JSON no stream: {len(events)} ==')
          for ev in events:
              if not isinstance(ev, dict): continue
              evd = ev.get('event')
              if not isinstance(evd, dict): continue
              req = evd.get('request') or {}
              if not isinstance(req, dict): continue
              url = red(str(req.get('url') or ''))
              if '/share/' not in url and '/og/' not in url and '/cliente/' not in url:
                  continue
              hdrs = req.get('headers') or {}
              ua = ''
              for k, v in (hdrs.items() if isinstance(hdrs, dict) else []):
                  if k.lower() == 'user-agent': ua = str(v)[:90]
              cf = req.get('cf') if isinstance(req.get('cf'), dict) else {}
              asn = cf.get('asn'); country = cf.get('country')
              resp = evd.get('response') if isinstance(evd.get('response'), dict) else {}
              ts = ev.get('eventTimestamp')
              tss = datetime.datetime.utcfromtimestamp(ts/1000).isoformat() + 'Z' if isinstance(ts, (int, float)) else '?'
              logs = []
              for lg in (ev.get('logs') or []):
                  msg = ' '.join(str(m) for m in (lg.get('message') or []))
                  logs.append(red(msg)[:220])
              # 74H2: a sonda prova o observador, NUNCA conta como WhatsApp/crawler
              src = 'self_probe' if ua.startswith('F3374H2-TailProbe/') else 'external'
              rows.append({'ts': tss, 'source': src, 'method': req.get('method'), 'url': url,
                           'ua': ua, 'asn': asn, 'country': country,
                           'status': resp.get('status'), 'outcome': ev.get('outcome'), 'logs': logs})
          with open('out/capture-sanitized.jsonl', 'w', encoding='utf-8') as f:
              for r in rows: f.write(json.dumps(r, ensure_ascii=False) + '\n')
          ext = [r for r in rows if r['source'] == 'external']
          print(f'== eventos /share|/og|/cliente capturados: {len(rows)} (externos={len(ext)}; self_probe={len(rows)-len(ext)} — excluídos de qualquer contagem de WhatsApp/crawler) ==')
          for r in rows[:80]:
              print(f"  [{r['source']}] {r['ts']} {r['method']} {r['status'] or '-'} {r['outcome'] or ''} ASN{r['asn'] or '?'}/{r['country'] or '?'} {r['url'][:90]} UA={r['ua'][:60]}")
              for lg in r['logs'][:2]: print(f"      log: {lg}")
          if not ext:
              print('  (nenhum evento EXTERNO nas rotas de share/imagem/portal durante a janela)')
          PYEOF
          rm -f out/raw.jsonl

      - name: Upload artefato (somente sanitizado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3374f-crawler-capture-${{ github.run_number }}
          path: out/
          retention-days: 14
