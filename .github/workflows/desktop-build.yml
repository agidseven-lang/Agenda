# =====================================================================
# [manual] Agenda ID Seven Desktop — Windows installer build
# ---------------------------------------------------------------------
# Gera o instalador Windows (NSIS .exe + MSI) do app Desktop e empacota
# bundle ZIP com: instalador, VERSAO-DESKTOP.txt, RELATORIO-DESKTOP.txt,
# INSTRUCOES-INSTALACAO-DESKTOP.txt.
#
# NAO toca: APK Android, site agendaidseven.com.br, Cloudflare Worker
# de push, Firebase Functions, Resend, Secret Manager, Firestore Rules.
# Execucao SOMENTE manual (workflow_dispatch).
# =====================================================================
name: "[manual] Desktop Build (Windows)"

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit a buildar (default: desktop/local-1.0.77-cronograma-client-flow-phase1)"
        required: true
        default: "desktop/local-1.0.77-cronograma-client-flow-phase1"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
      # F3.3.70D3R10I — rotulo derivado do package.json (passo "Derivar versao"); nada hardcoded.
      DIST_BASENAME: ""
    steps:
      - name: Checkout (ref escolhido)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Derivar versao (package.json e a fonte unica)
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "DIST_BASENAME=Agenda-ID-Seven-Desktop-$APP_VERSION" >> "$GITHUB_ENV"
          echo "versao=$APP_VERSION"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: npm install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: TypeScript build (main + preload)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      # ===== F3.3.74C — HELPER NATIVO do Windows Share (compila ANTES do electron-builder,
      # que o empacota via extraResources native-share/publish). Condicional ao ref buildado
      # conter o helper (refs antigos 1.0.168–1.0.172 seguem buildando sem estes passos). =====
      - name: Compilar helper nativo Share (F3.3.74C)
        if: ${{ hashFiles('desktop/native-share/AgendaIdSevenNativeShare.cpp') != '' }}
        working-directory: desktop/native-share
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo ::error:: MSVC nao encontrado no runner & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          if not exist publish mkdir publish
          cl /nologo /std:c++20 /EHsc /permissive- /O2 /W3 /DUNICODE /D_UNICODE AgendaIdSevenNativeShare.cpp /Fe:publish\AgendaIdSeven.NativeShare.exe /link WindowsApp.lib user32.lib ole32.lib shell32.lib || exit /b 1
          dir publish

      - name: Gate F3.3.74C FASE 12 — QA Share Target (selftest RELÊ o DataPackage combinado)
        if: ${{ hashFiles('desktop/native-share/AgendaIdSevenNativeShare.cpp') != '' }}
        working-directory: desktop/native-share
        run: |
          # PROVA DE PACOTE (sem WhatsApp): o helper monta o DataPackage e o RELÊ via
          # GetView() — exatamente o DataPackageView que um Share Target recebe — e
          # registra os formatos presentes. O gate exige TODOS simultaneamente:
          # StorageItems (1 PNG) + Text (legenda) + WebLink + Title + Description.
          # HONESTIDADE: isto prova a COMPOSIÇÃO do pacote; o que o WhatsApp faz com
          # ele é prova FÍSICA (fase de ops) — este gate NÃO autoriza GO E2E.
          cat > gen-selftest-png.ps1 <<'PSEOF'
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1200, 630
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $rect = New-Object System.Drawing.Rectangle 0, 0, 1200, 630
          $c1 = [System.Drawing.Color]::FromArgb(255, 15, 23, 42)
          $c2 = [System.Drawing.Color]::FromArgb(255, 59, 130, 246)
          $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, $c1, $c2, 45.0)
          $g.FillRectangle($brush, $rect)
          $font = New-Object System.Drawing.Font('Segoe UI', 42, [System.Drawing.FontStyle]::Bold)
          $g.DrawString('QA SELFTEST 74C', $font, [System.Drawing.Brushes]::White, 40, 40)
          $g.Dispose()
          $out = Join-Path (Get-Location).Path 'selftest-card.png'
          $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Write-Host "png sintetico: $out ($((Get-Item $out).Length) bytes)"
          PSEOF
          powershell -NoProfile -ExecutionPolicy Bypass -File gen-selftest-png.ps1 || { echo "::error:: falha ao gerar PNG sintetico"; exit 1; }
          SIZE=$(wc -c < selftest-card.png)
          if [ "$SIZE" -lt 1024 ]; then echo "::error:: PNG sintetico < 1024 bytes ($SIZE) — abaixo do minimo do validador"; exit 1; fi
          PNGWIN=$(cygpath -w "$PWD/selftest-card.png")
          set +e
          ./publish/AgendaIdSeven.NativeShare.exe --selftest "$PNGWIN" > selftest-74c.log 2>&1
          RC=$?
          set -e
          echo "== eventos do selftest (sanitizados) =="; cat selftest-74c.log
          if [ $RC -ne 0 ]; then echo "::error:: selftest do helper falhou (exit=$RC)"; exit 1; fi
          grep -qF '"evt":"selftest_ok"' selftest-74c.log || { echo "::error:: selftest_ok AUSENTE"; exit 1; }
          for K in '"storageItems":true' '"text":true' '"webLink":true' '"titlePresent":true' '"descPresent":true' '"itemCount":1'; do
            grep -qF "$K" selftest-74c.log || { echo "::error:: formato AUSENTE no DataPackage: $K"; exit 1; }
          done
          echo "GATE 74C OK: o DataPackage contem SIMULTANEAMENTE StorageItems(1 PNG) + Text + WebLink + Title + Description."

      - name: electron-builder (NSIS + MSI)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado (F3.3.22/F3.3.70D3R10I)
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f "dist-installer/win-unpacked/resources/icon.png" ]; then
            echo "resources/icon.png OK (tray tera icone)"
          else
            echo "::error:: resources/icon.png AUSENTE no pacote — tray ficaria invisivel (nativeImage.createEmpty)."
            ls -la dist-installer/win-unpacked/resources/ 2>/dev/null || true
            exit 1
          fi

      - name: Gate prova-de-versao (sem versao stale/hardcoded no renderer empacotado)
        working-directory: ${{ env.APP_DIR }}
        run: |
          # F3.3.70D3R10U — NO-GO absoluto: 1.0.146-149 em qualquer lugar do renderer
          # empacotado, e qualquer rotulo literal "Desktop 1\.0\.<n>" / "Versao 1.0.<n>"
          # (a versao real deriva de app.getVersion em runtime; literal = regressao).
          # HONESTIDADE DO GATE: o renderer real vive DENTRO de app.asar — a versao
          # anterior deste gate grepava app*/src/renderer (que nao existe com asar) e
          # PASSAVA EM BRANCO. Agora extrai o asar e FALHA se o renderer nao for achado.
          set +e
          RDIR=""
          ASAR="dist-installer/win-unpacked/resources/app.asar"
          if [ -f "$ASAR" ]; then
            EXDIR="$RUNNER_TEMP/asar-extract"
            rm -rf "$EXDIR"; mkdir -p "$EXDIR"
            npx --yes @electron/asar extract "$ASAR" "$EXDIR"
            if [ $? -ne 0 ]; then echo "::error:: falha ao extrair app.asar para o gate"; exit 1; fi
            RDIR="$EXDIR/src/renderer"
          else
            for d in dist-installer/win-unpacked/resources/app*/src/renderer; do
              if [ -d "$d" ]; then RDIR="$d"; break; fi
            done
          fi
          if [ ! -d "$RDIR" ] || [ ! -f "$RDIR/index.html" ]; then
            echo "::error:: renderer empacotado NAO encontrado (asar/app) — gate nao pode passar em branco."
            ls -la dist-installer/win-unpacked/resources/ 2>/dev/null
            exit 1
          fi
          echo "renderer real localizado: $RDIR"
          PAT='1\.0\.14[6-9]|Desktop 1\.0\.[0-9]+|Vers..?o 1\.0\.[0-9]+'
          FOUND=$(grep -rlE "$PAT" "$RDIR" 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "::error:: rotulo de versao stale/hardcoded no renderer empacotado: $FOUND"
            grep -rnE "$PAT" $FOUND 2>/dev/null | head -8
            exit 1
          fi
          echo "renderer sem 1.0.146-149 e sem 'Desktop/Versao 1.0.<n>' literal — versao deriva de app.getVersion."
          # ===== F3.3.73I6C24D — GATE DE URL EMPACOTADO (somente builds QA; fail-closed) =====
          # O incidente 1.0.170-QA passou nos testes de FONTE mas falhou instalado: o renderer
          # EMPACOTADO trazia o validador legado (host de producao hardcoded + rejeicao workers.dev),
          # que reprovava o proprio host de QA -> "Link invalido". Este gate le o renderer REAL de
          # dentro do app.asar (mesmo $RDIR acima) e reprova o build QA se o legado voltar.
          if grep -rIlF "AMBIENTE QA" "$RDIR" >/dev/null 2>&1; then
            if grep -rqF "F3.3.74D — CONTRATO RESTAURADO" "$RDIR"; then
              # ===== F3.3.74E — GATE DO RUNTIME EMPACOTADO (contrato RESTAURADO da baseline
              # fisicamente aprovada 1.0.153; falha se o comportamento C18C reaparecer). =====
              echo "build QA RESTAURADO detectado — validando o contrato 74E EMPACOTADO"
              IDX="$RDIR/index.html"
              if grep -qF 'id="btnOpenWaMain" disabled' "$IDX"; then echo "::error:: (74E-1) botao NASCE disabled — regressao C18C EMPACOTADA"; exit 1; fi
              if grep -qF 'if(!prepReady){ flashToast' "$IDX"; then echo "::error:: (74E-2) gate prepReady no clique — regressao C18C EMPACOTADA"; exit 1; fi
              if grep -qF "\$('btnOpenWaMain'); if(b){ b.disabled=true; }" "$IDX"; then echo "::error:: (74E-3) prewarm desabilita o botao — nao e bonus"; exit 1; fi
              if grep -qF 'if(!_pw||!_pw.ok){ flashToast' "$IDX"; then echo "::error:: (74E-4) falha de prewarm aborta o envio (data-openwa)"; exit 1; fi
              grep -qF 'Acesse o link abaixo para revisar os temas, aprovar ou solicitar ajustes:' "$IDX" || { echo "::error:: (74E-5) mensagem aprovada AUSENTE"; exit 1; }
              grep -qF 'https://aprovar.agendaidseven.com.br' "$IDX" || { echo "::error:: (74E-6) dominio oficial AUSENTE"; exit 1; }
              grep -qF '/share/cronograma/' "$IDX" || { echo "::error:: (74E-7) rota oficial AUSENTE"; exit 1; }
              grep -qF "return CLIENT_LINK_BASE+'/share/cronograma/'+t;" "$IDX" || { echo "::error:: (74E-8) token fora do pathname (builder alterado)"; exit 1; }
              if grep -qF 'withWhatsAppPreviewBust(buildShareClientUrl' "$IDX" || grep -qF 'url=withWhatsAppPreviewBust(' "$IDX"; then echo "::error:: (74E-9) cache-bust EM USO no envio (contrato aprovado e SEM ?v=)"; exit 1; fi
              if grep -qF 'nativeShare' "$IDX"; then echo "::error:: (74E-10) native-share no caminho principal"; exit 1; fi
              if grep -qF 'buildNativeShareRequest' "$IDX"; then echo "::error:: (74E-11) Windows Share UI no caminho principal"; exit 1; fi
              if grep -qF 'buildPremiumCardImage' "$IDX" || grep -qF 'CARD_ART_B64_BY_TYPE' "$IDX"; then echo "::error:: (74E-12) Canvas/PNG nativo no caminho principal"; exit 1; fi
              case "$APP_VERSION" in *-QA) : ;; *) echo "::error:: (74E-13) versao sem sufixo -QA ($APP_VERSION) com banner QA"; exit 1 ;; esac
              grep -qF 'AMBIENTE QA — NÃO USAR COM CLIENTES' "$IDX" || { echo "::error:: (74E-14) banner QA AUSENTE"; exit 1; }
              echo "F3.3.74E: gate do CONTRATO RESTAURADO EMPACOTADO OK — 14/14 (sem C18C, sem 74B/74C, mensagem/dominio/rota/token intactos, sem cache-bust, banner presente, versao $APP_VERSION)."
            elif grep -rqF "function validateShareUrl" "$RDIR"; then
              echo "build QA (linha C24D) detectado — validando o gate de URL EMPACOTADO (C24D)"
              if grep -rnF '!/workers\.dev/.test' "$RDIR" 2>/dev/null | grep -q .; then
                echo "::error:: validador legado (rejeicao workers.dev) EMPACOTADO no build QA"; grep -rnF '!/workers\.dev/.test' "$RDIR" | head -3; exit 1; fi
              if grep -rF "indexOf('https://aprovar.agendaidseven.com.br/share/cronograma/')===0" "$RDIR" 2>/dev/null | grep -q .; then
                echo "::error:: host de producao HARDCODED no validador do build QA empacotado"; exit 1; fi
              grep -rqF "SHARE_ALLOWED_HOST = QA_BUILD ? 'idseven-push-qa.agidseven.workers.dev'" "$RDIR" || { echo "::error:: SHARE_ALLOWED_HOST nao aponta ao host QA no build QA empacotado"; exit 1; }
              grep -rqF "idseven-push-qa.agidseven.workers.dev" "$RDIR" || { echo "::error:: host QA AUSENTE no build QA empacotado"; exit 1; }
              grep -rqF "gere o roteiro novamente" "$RDIR" || { echo "::error:: texto por setor de Roteiro AUSENTE no build QA empacotado"; exit 1; }
              echo "F3.3.73I6C24D: gate de URL EMPACOTADO (build QA) OK — allowlist exata do host QA; legado ausente; textos por setor presentes."
            else
              echo "::error:: build QA sem regime de validacao conhecido (nem contrato RESTAURADO 74E, nem validateShareUrl C24D) — fail-closed."
              exit 1
            fi
          fi

      - name: Gate helper nativo EMPACOTADO (F3.3.74C)
        if: ${{ hashFiles('desktop/native-share/AgendaIdSevenNativeShare.cpp') != '' }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          # O instalador PRECISA carregar o helper (resources/native-share) — sem ele o
          # fluxo principal degrada para o modo alternativo. Fail-closed no build.
          EXE="dist-installer/win-unpacked/resources/native-share/AgendaIdSeven.NativeShare.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error:: helper nativo NAO empacotado ($EXE ausente) — extraResources falhou."
            ls -la dist-installer/win-unpacked/resources/ 2>/dev/null || true
            exit 1
          fi
          SIZE=$(wc -c < "$EXE")
          if [ "$SIZE" -lt 65536 ]; then echo "::error:: helper empacotado suspeito de truncado ($SIZE bytes)"; exit 1; fi
          echo "helper nativo empacotado OK ($SIZE bytes): resources/native-share/AgendaIdSeven.NativeShare.exe"

      - name: Empacotar bundle (instalador + relatorios)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/dist-pkg"
          mkdir -p "$OUT"
          # Copia instaladores (nome vem do electron-builder.yml artifactName)
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*.exe 2>/dev/null | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*.msi 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then echo "::error::instalador .exe nao gerado"; exit 1; fi
          cp "$EXE" "$OUT/"
          [ -n "$MSI" ] && cp "$MSI" "$OUT/"
          EXE_NAME=$(basename "$EXE")
          MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo "")
          EXE_SHA=$(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')
          MSI_SHA=$([ -n "$MSI" ] && sha256sum "$OUT/$MSI_NAME" | awk '{print $1}' || echo "")
          # VERSAO-DESKTOP.txt — prova do que esta dentro
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $EXE_SHA"
            if [ -n "$MSI_NAME" ]; then
              echo "instalador2 : $MSI_NAME"
              echo "SHA-256 msi : $MSI_SHA"
            fi
            echo "commit      : $GITHUB_SHA"
            echo "ref         : ${{ github.event.inputs.ref }}"
            echo "espelha APK : 1.0.64-beta-build-artifact-version-fix"
          } > "$OUT/VERSAO-DESKTOP.txt"
          # RELATORIO-DESKTOP.txt — checagens
          {
            echo "===== RELATORIO DESKTOP - Agenda ID Seven Desktop ====="
            echo "Gerado (UTC) : $(date -u)"
            echo "Ref / commit : ${{ github.event.inputs.ref }} @ $GITHUB_SHA"
            echo ""
            echo "----- Arquivos no instalador package -----"
            ls -lh "$OUT"
            echo ""
            echo "----- Conferencia de versao -----"
            cat "$OUT/VERSAO-DESKTOP.txt"
          } > "$OUT/RELATORIO-DESKTOP.txt"
          # INSTRUCOES-INSTALACAO-DESKTOP.txt (printf para nao quebrar a YAML)
          printf '%s\n' \
            "==== COMO INSTALAR - Agenda ID Seven Desktop (Windows) ====" \
            "" \
            "*** IMPORTANTE - ANTES DE INSTALAR (correcao 1.0.77) ***" \
            "- Se ja existe uma versao instalada, FECHE-A PELA BANDEJA:" \
            "  clique direito no icone na bandeja (perto do relogio) -> 'Sair'." \
            "- O app mora na bandeja; clicar no X apenas esconde, NAO encerra," \
            "  e a versao antiga travava os arquivos, impedindo a atualizacao" \
            "  (era a causa de continuar aparecendo 1.0.66)." \
            "- A partir do 1.0.77 o instalador ja ENCERRA a versao antiga" \
            "  automaticamente, mas fechar pela bandeja antes garante 100%." \
            "" \
            "1) Baixe o instalador (.exe ou .msi). PREFIRA o .exe." \
            "2) De dois cliques. Se o Windows SmartScreen avisar:" \
            "   - clique em 'Mais informacoes' -> 'Executar assim mesmo'." \
            "   - O app NAO esta assinado com certificado de empresa nesta fase" \
            "     (mesma situacao do APK x Play Protect - esperado em beta)." \
            "3) Marque 'Criar atalho na area de trabalho' se desejar." \
            "4) Apos instalar, abra o app pelo menu Iniciar ou icone." \
            "5) Faca login com a mesma conta do celular." \
            "" \
            "==== TRAY (BANDEJA) e NOTIFICACOES ====" \
            "- Fechar a janela (X) ENVIA o app para a bandeja (nao encerra)." \
            "- Para reabrir: duplo clique no icone na bandeja." \
            "- Para encerrar de verdade: clique direito no icone -> Sair." \
            "- As notificacoes funcionam enquanto o app estiver aberto, minimizado" \
            "  ou na bandeja. Se voce 'Sair', param ate reabrir." \
            "" \
            "==== INICIAR COM O WINDOWS ====" \
            "- Marque na bandeja: 'Iniciar com o Windows'." \
            "- O app sobe oculto na bandeja a cada login do Windows." \
            "- Garante notificacoes confiaveis sem precisar abrir manualmente." \
            "" \
            "==== O QUE NOTIFICA ====" \
            "- Nova tarefa atribuida a voce." \
            "- Novo compromisso criado para voce." \
            "- Lembrete: 1 hora antes do compromisso." \
            "- Clique na notificacao abre a tela certa do app." \
            "" \
            "==== SINCRONIZACAO COM O CELULAR ====" \
            "- Mesma base Firebase do APK. Criar/mover no Desktop reflete no celular" \
            "  em tempo real, e vice-versa." \
            "" \
            "==== LIMITACOES CONHECIDAS NESTA FASE ====" \
            "- Push com o app totalmente encerrado (igual FCM do Android) exige" \
            "  backend dedicado para Desktop - sera tratado em fase futura." \
            "- Lembrete pode chegar tambem no celular (cada dispositivo lembra)." \
            "- Sem certificado de codigo: SmartScreen avisa na primeira instalacao." \
            > "$OUT/INSTRUCOES-INSTALACAO-DESKTOP.txt"
          # ZIP de distribuicao
          (cd "$OUT" && powershell -Command "Compress-Archive -Path * -DestinationPath ../${DIST_BASENAME}.zip -Force")
          mv "$GITHUB_WORKSPACE/${DIST_BASENAME}.zip" "$OUT/${DIST_BASENAME}.zip" 2>/dev/null || true
          ls -lh "$OUT"
          echo "== VERSAO-DESKTOP =="; cat "$OUT/VERSAO-DESKTOP.txt"

      - name: Upload installer (artifact)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agenda-id-seven-desktop-${{ env.APP_VERSION }}-installer
          path: dist-pkg/Agenda-ID-Seven-Desktop-*.*
          if-no-files-found: error
          retention-days: 30

      - name: Upload bundle (ZIP com instaladores + relatorios)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agenda-id-seven-desktop-${{ env.APP_VERSION }}-bundle
          path: dist-pkg/
          if-no-files-found: error
          retention-days: 30
