# =====================================================================
# [manual/GATED] FINAL 1.0.247 — Desktop Release (INERTE até o GO do owner)
# ---------------------------------------------------------------------
# FINAL RELEASE PREPARATION — par de RELEASE da linhagem final (sucede o
# desktop-release-1.0.246-rc.yml da I5C.2/I5C.4). NUNCA EXECUTADO nesta fase.
# FAIL-CLOSED em camadas:
#   Gate 0: variável de repositório RC_RELEASE_GO == 'authorized-by-owner'
#           (INEXISTENTE até o owner criá-la em Settings > Variables).
#   Gate 1: frase de confirmação digitada manualmente no dispatch.
#   Gate 2: proveniência (FINAL SOURCE + renderer + versão pinados).
#   Gate 3: pins do RUN FINAL CANÔNICO (build run id + SHA-256 dos assets).
#           Enquanto qualquer pin estiver PENDING, falha SEMPRE.
#   Publicação: exige tag v1.0.247 INEXISTENTE (nunca sobrescrever) e
#           verifica sha256/sha512/size de TODOS os assets contra os pins
#           antes de criar tag + Release **Latest** (stable, NÃO prerelease —
#           o updater dos usuários usa channel latest + allowPrerelease=false).
# Nenhum "latest run", nenhum hash dinâmico: tudo aponta para o run pinado.
# =====================================================================
name: "[manual/GATED] FINAL 1.0.247 — Desktop Release (INERT)"

"on":
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID do desktop-build-1.0.247-final.yml VERDE (deve ser IGUAL ao pinado)"
        required: true
      confirm:
        description: "Digite EXATAMENTE: RELEASE-1.0.247-FINAL-AUTORIZADO"
        required: true

# contents:write e actions:read são exigidos pela etapa de publicação;
# permanecem inertes na prática: nenhum step roda além do Gate 0 sem a variável do owner.
permissions:
  contents: write
  actions: read

env:
  PRODUCT_SOURCE_SHA: "cd92ec1fb723146ead1bd3031898be77a577b135"
  EXPECTED_VERSION: "1.0.247"
  EXPECTED_RENDERER_SHA256: "bd5001b1ec249ecc56bc1a8b71a11be05d468dc990695c6f80ef80af00aef32f"
  EXPECTED_LOCKFILE_SHA256: "39a329a90c8010dc9ede6d95f36d754c1ae550bae33c5dc1d3bc2e29c9b9e059"
  BUNDLE_ARTIFACT_NAME: "agenda-id-seven-desktop-1.0.247-final-bundle"
  # ---- PINS DO RUN FINAL CANÔNICO (completados quando o build final rodar verde):
  EXPECTED_BUILD_RUN_ID: "PENDING-FINAL-BUILD-RUN"
  EXPECTED_EXE_SHA256: "PENDING-FINAL-BUILD-RUN"
  EXPECTED_MSI_SHA256: "PENDING-FINAL-BUILD-RUN"
  EXPECTED_BLOCKMAP_SHA256: "PENDING-FINAL-BUILD-RUN"
  EXPECTED_LATESTYML_SHA256: "PENDING-FINAL-BUILD-RUN"
  EXPECTED_SHA256SUMS_SHA256: "PENDING-FINAL-BUILD-RUN"
  EXPECTED_VERSAOTXT_SHA256: "PENDING-FINAL-BUILD-RUN"

jobs:
  gated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "GATE 0 — autorização do OWNER (variável de repositório; fail-closed)"
        run: |
          set -euo pipefail
          if [ "${{ vars.RC_RELEASE_GO }}" != "authorized-by-owner" ]; then
            echo "::error::RELEASE NÃO AUTORIZADO — a variável de repositório RC_RELEASE_GO não está definida como 'authorized-by-owner'. Este workflow permanece INERTE (nenhuma publicação sem GO explícito do owner)."
            exit 1
          fi

      - name: "GATE 1 — frase de confirmação manual"
        run: |
          set -euo pipefail
          [ "${{ github.event.inputs.confirm }}" = "RELEASE-1.0.247-FINAL-AUTORIZADO" ] || { echo "::error::frase de confirmação incorreta"; exit 1; }

      - name: Checkout (verificação de linhagem)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "GATE 2 — proveniência: FINAL SOURCE + renderer + lockfile + versão + marcador"
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SOURCE_SHA" || { echo "::error::FINAL SOURCE inexistente"; exit 1; }
          R=$(git show "$PRODUCT_SOURCE_SHA":desktop/src/renderer/index.html | sha256sum | awk '{print $1}')
          [ "$R" = "$EXPECTED_RENDERER_SHA256" ] || { echo "::error::renderer difere do congelado"; exit 1; }
          L=$(git show "$PRODUCT_SOURCE_SHA":desktop/package-lock.json | sha256sum | awk '{print $1}')
          [ "$L" = "$EXPECTED_LOCKFILE_SHA256" ] || { echo "::error::lockfile difere do pinado"; exit 1; }
          git show "$PRODUCT_SOURCE_SHA":desktop/package.json > /tmp/pkg.json
          node -e "const p=require('/tmp/pkg.json'); if(p.version!=='1.0.247')process.exit(1); if(!/1\.0\.247-i5c5-unattended-update-bridge/.test(p.description||''))process.exit(1); console.log('version+marker OK');"

      - name: "GATE 3 — pins do RUN FINAL CANÔNICO completos e input coerente (fail-closed)"
        run: |
          set -euo pipefail
          for v in "$EXPECTED_BUILD_RUN_ID" "$EXPECTED_EXE_SHA256" "$EXPECTED_MSI_SHA256" "$EXPECTED_BLOCKMAP_SHA256" "$EXPECTED_LATESTYML_SHA256" "$EXPECTED_SHA256SUMS_SHA256" "$EXPECTED_VERSAOTXT_SHA256"; do
            if [ "$v" = "PENDING-FINAL-BUILD-RUN" ]; then
              echo "::error::pins do run final canônico ainda PENDING — a publicação só é liberada quando o build final verde for pinado neste workflow."
              exit 1
            fi
          done
          [ "${{ github.event.inputs.build_run_id }}" = "$EXPECTED_BUILD_RUN_ID" ] || { echo "::error::build_run_id difere do RUN FINAL CANÔNICO pinado ($EXPECTED_BUILD_RUN_ID)"; exit 1; }

      - name: "PUBLICAÇÃO — bundle do run pinado → verificação total → tag v1.0.247 → Release Latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$EXPECTED_VERSION"
          # identidade nova obrigatória: a tag NÃO pode existir (v1.0.246 histórica jamais é reutilizada)
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG já existe — publicação abortada (nunca sobrescrever)"; exit 1
          fi
          RUN="$EXPECTED_BUILD_RUN_ID"
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq ".artifacts[] | select(.name==\"$BUNDLE_ARTIFACT_NAME\") | .id")
          [ -n "$AID" ] || { echo "::error::bundle $BUNDLE_ARTIFACT_NAME não encontrado no run $RUN (expirado? re-rode o build final e re-pine)"; exit 1; }
          mkdir -p bundle && cd bundle
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > bundle.zip
          unzip -q bundle.zip && rm bundle.zip
          EXE=$(find . -name "Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.exe" | head -1)
          MSI=$(find . -name "Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.msi" | head -1)
          BMAP=$(find . -name "Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.exe.blockmap" | head -1)
          LYML=$(find . -name "latest.yml" | head -1)
          SUMS=$(find . -name "SHA256SUMS" | head -1)
          VTXT=$(find . -name "VERSAO-DESKTOP.txt" | head -1)
          for f in "$EXE" "$MSI" "$BMAP" "$LYML" "$SUMS" "$VTXT"; do [ -n "$f" ] && [ -f "$f" ] || { echo "::error::asset ausente no bundle"; exit 1; }; done
          # verificação criptográfica TOTAL contra os pins do run final canônico
          [ "$(sha256sum "$EXE"  | awk '{print $1}')" = "$EXPECTED_EXE_SHA256" ]        || { echo "::error::exe difere do pinado"; exit 1; }
          [ "$(sha256sum "$MSI"  | awk '{print $1}')" = "$EXPECTED_MSI_SHA256" ]        || { echo "::error::msi difere do pinado"; exit 1; }
          [ "$(sha256sum "$BMAP" | awk '{print $1}')" = "$EXPECTED_BLOCKMAP_SHA256" ]   || { echo "::error::blockmap difere do pinado"; exit 1; }
          [ "$(sha256sum "$LYML" | awk '{print $1}')" = "$EXPECTED_LATESTYML_SHA256" ]  || { echo "::error::latest.yml difere do pinado"; exit 1; }
          [ "$(sha256sum "$SUMS" | awk '{print $1}')" = "$EXPECTED_SHA256SUMS_SHA256" ] || { echo "::error::SHA256SUMS difere do pinado"; exit 1; }
          [ "$(sha256sum "$VTXT" | awk '{print $1}')" = "$EXPECTED_VERSAOTXT_SHA256" ]  || { echo "::error::VERSAO-DESKTOP.txt difere do pinado"; exit 1; }
          # contrato do updater: latest.yml do MESMO build (versão + sha512 + size do exe)
          grep -q "^version: $EXPECTED_VERSION$" "$LYML" || { echo "::error::latest.yml versão"; exit 1; }
          SHA512=$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)
          grep -q "$SHA512" "$LYML" || { echo "::error::sha512 do exe não bate com latest.yml (mistura de builds!)"; exit 1; }
          SIZE=$(stat -c%s "$EXE")
          grep -q "size: $SIZE" "$LYML" || { echo "::error::size do exe não bate com latest.yml"; exit 1; }
          # SHA256SUMS do build confere com os bytes baixados
          (cd "$(dirname "$EXE")" && sha256sum -c SHA256SUMS) || { echo "::error::SHA256SUMS não confere com os bytes"; exit 1; }
          # tag no FINAL SOURCE exato + Release marcada Latest (stable; NÃO prerelease)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$PRODUCT_SOURCE_SHA"
          gh release create "$TAG" "$EXE" "$MSI" "$BMAP" "$LYML" "$SUMS" "$VTXT" \
            --title "Agenda ID Seven Desktop $EXPECTED_VERSION" \
            --notes "Release gated (GO do owner). Fonte: $PRODUCT_SOURCE_SHA · build run canônico: $RUN. Update in-app não assistido (ponte one-click 1.0.246→1.0.247; updates futuros silenciosos /S)." \
            --latest
          echo "RELEASE PUBLICADA: $TAG (Latest) com exe+blockmap+latest.yml+msi+SHA256SUMS+VERSAO-DESKTOP.txt do run $RUN" >> "$GITHUB_STEP_SUMMARY"
