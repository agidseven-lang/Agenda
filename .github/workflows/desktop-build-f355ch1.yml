# F3.5.5C-H1 — Desktop 1.0.221 (Hotfix P0: Restauração Automática de Sessão no Boot) — build GATED,
# --publish never. Publicação SÓ no desktop-release-f355ch1.yml (mesmos bytes). Base de código
# 1.0.220 @ 2d003ad (Latest publicada); baseline FÍSICA 1.0.218 @ 1a94515 (ROLLBACK IMEDIATO);
# adicional 1.0.216 @ e509f43. Delta: auth-core.ts (self() com AUTORIDADE DO SERVIDOR: sem gate
# local de validade, releitura do disco, wipe SÓ com 401-contrato confirmado 2x, dica local
# deslizante, persist atômico) + renderer index.html (tolerância no_bridge 40x300ms, "Tentar
# novamente" imediato, bloco-guarda offline do firebase) + versão + suítes/provas/docs/workflows
# da fase + re-pins herdados (precedente F3.5.5C). TODO o resto do main + preload + janelas +
# sons + priorityEngine + electron-builder.yml + worker + functions + android CONGELADOS byte a
# byte vs 1.0.220 — regra máxima do owner: ZERO regressão no aprovado.
name: "[push/manual] F3.5.5C-H1 — Desktop 1.0.221 (Hotfix Sessão no Boot) — Desktop Build"
"on":
  push:
    branches: ["desktop/f355c-h1-session-restore-boot-hotfix-1.0.221"]
    paths-ignore: [".github/workflows/desktop-release-f355ch1.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f355c-h1-session-restore-boot-hotfix-1.0.221"
  BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
  BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
  BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.220, 1.0.218 e 1.0.216)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          git merge-base --is-ancestor "$BASE_220_SHA" HEAD || { echo "::error::não descende da 1.0.220"; exit 1; }
          git merge-base --is-ancestor "$BASE_218_SHA" HEAD || { echo "::error::não descende da 1.0.218"; exit 1; }
          git merge-base --is-ancestor "$BASE_216_SHA" HEAD || { echo "::error::não descende da 1.0.216"; exit 1; }
      - name: "Gate VERSAO 1.0.221 (package + lock x2 + description do hotfix + base preservada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.221') process.exit(1); if(!/session-restore-boot-hotfix/.test(p.description||'')) process.exit(1); if(!/custom-script-quantity-rich-editor/.test(p.description||'')) process.exit(1);"
          [ "$(grep -c '"version": "1.0.221"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (index TODOS os blocos inline) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]);"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]);"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline (guarda + principal)');process.exit(1);}b.forEach(x=>new Function(x));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "Gate F3.5.5C-H1 — restauração de sessão 29 (autoridade do servidor + 401 duplo + releitura + ciclos 20x) [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
          node scripts/f355ch1-session-restore.test.mjs
      - name: "Gate F3.3.56 herdado — auth-core 16 (login/self/chpw contratos preservados) [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f3356-auth-core.test.mjs
      - name: "Gate F3.5.5C herdado — quantidade + editor rico 128"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
      - name: "Gate F3.5.5C herdado — validador RTE do PORTAL 97"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-rte-worker-validator.test.mjs
      - name: "Gate F3.5.5B herdado — Agenda Premium 84"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355b-agenda-premium.test.mjs
      - name: "Gate F3.5.5A-H1 herdado — observações internas 72"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355ah1-internal-notes.test.mjs
      - name: "Gate F3.5.5A herdado — planner 98 + orquestrador 38 + central 33 + integração 25 (dist)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355a-execution-planner.test.mjs
          node scripts/f355a-orchestrator.test.mjs
          node scripts/f355a-execution-central.test.mjs
          node scripts/f355a-integration.test.mjs
      - name: "Gate REGRESSÃO canônica — som 37 + detalhes 74 + cards 53 + sessão 40"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354wh1-details-status-notes.test.mjs
          node scripts/f354w-compact-cards-details.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate PROVAS REAIS Electron — F3.5.5C-H1 boot de sessão (10 cenas, renderer REAL, PNGs) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-electron-proof-main.js
      - name: "Gate CICLOS REPETITIVOS — 20 aberturas/fechamentos SEM flash de login — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 400 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-cycle-proof-main.js
      - name: "Gate SMOKE RTE herdado — 91 comportamentais no Chromium REAL"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 300 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-rte-behavior-main.js
      - name: "Gate PROVAS herdadas — F3.5.5C (32) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-proof-main.js
      - name: "Gate PARIDADE CRUZADA herdada — canônicos validados pelo Worker"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-canon-crossparity.mjs
      - name: "Gate PROVAS herdadas — F3.5.5B (20) + F3.5.5A-H1 (15) + F3.5.5A (25) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355b-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ah1-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355a-execution-proof-main.js
      - uses: actions/upload-artifact@v4
        with: { name: f355ch1-provas-qa, path: "docs/f355ch1-qa/**", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: f355ch1-provas-herdadas-qa, path: "docs/f355c-qa/**", if-no-files-found: error, retention-days: 30 }
      - name: "Gate ISOLAMENTO — delta vs 1.0.220 SÓ nos arquivos autorizados; congelados diff-vazio"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_220_SHA"..HEAD > /tmp/delta.txt; cat /tmp/delta.txt
          # allowlist F3.5.5C-H1: auth-core (a correção) + renderer index.html + versão + suítes/
          # provas/docs/workflows da fase + re-pins herdados de versão (precedente F3.5.5C:
          # f355b/f355ah1/f355a-integration/wh2/vh1/f355c + preloads de prova herdados com a
          # versão injetada) + trilha da PUBLICAÇÃO F3.5.5C herdada na linhagem (o branch parte do
          # tip publicado da 1.0.220: release yml pinado + relatório — nenhum insumo de build).
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f355ch1\.yml$|\.github/workflows/desktop-release-f355c\.yml$|docs/f355c/|desktop/src/main/auth-core\.ts$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f355ch1-|desktop/scripts/f355c-script-quantity-rich-editor\.test\.mjs$|desktop/scripts/f355c-proof-preload\.js$|desktop/scripts/f355b-agenda-premium\.test\.mjs$|desktop/scripts/f355b-proof-preload\.js$|desktop/scripts/f355ah1-internal-notes\.test\.mjs$|desktop/scripts/f355ah1-proof-preload\.js$|desktop/scripts/f355a-integration\.test\.mjs$|desktop/scripts/f354wh2-immediate-notification-sound\.test\.mjs$|desktop/scripts/f354vh1-session-persistence\.test\.mjs$|docs/f355ch1(-qa)?/)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist: $BAD"; exit 1; }
          # No MAIN, a ÚNICA mudança permitida é auth-core.ts (correção do self()/persist()):
          MAINDELTA=$(git diff --name-only "$BASE_220_SHA"..HEAD -- desktop/src/main)
          [ "$MAINDELTA" = "desktop/src/main/auth-core.ts" ] || { echo "::error::main alterado além do auth-core.ts: $MAINDELTA"; exit 1; }
          # CONGELADOS byte-idênticos vs 1.0.220: preload + janelas premium/central + sons +
          # priorityEngine + build config (electron-builder.yml: appId/productName/userData
          # intocados — proibição expressa do owner) + WORKER + worker-ops + Functions + Android.
          git diff --quiet "$BASE_220_SHA"..HEAD -- desktop/src/preload desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/sounds desktop/src/renderer/priorityEngine.js desktop/scripts/copy-renderer.js desktop/tsconfig.json desktop/electron-builder.yml cloudflare-worker.js scripts/worker-ops functions android-native android-native-beta || { echo "::error::módulo congelado alterado"; exit 1; }
      - name: "Gate MARCADORES F3.5.5C-H1 — autoridade do servidor + ponte tolerante + guarda offline (fonte)"
        run: |
          set -euo pipefail
          # auth-core: wipe SÓ com revogação confirmada; 401 opaco/não confirmado transitórios;
          # releitura no boot; persist atômico; catch de rede aprovado (pin vh1) preservado.
          grep -q 'server_unauthorized_confirmed' desktop/src/main/auth-core.ts
          grep -q 'http_401_opaque' desktop/src/main/auth-core.ts
          grep -q 'http_401_unconfirmed' desktop/src/main/auth-core.ts
          grep -q 'self.reload' desktop/src/main/auth-core.ts
          grep -q 'renameSync' desktop/src/main/auth-core.ts
          grep -q 'catch { return { ok: false, error: "network" }; }' desktop/src/main/auth-core.ts
          # renderer: tolerância da ponte (40x300ms), retry imediato, guarda offline do firebase.
          grep -q 'authRetryNow' desktop/src/renderer/index.html
          grep -q '__authWake' desktop/src/renderer/index.html
          grep -q '_nb<40' desktop/src/renderer/index.html
          grep -q 'Aguardando conexão…' desktop/src/renderer/index.html
          grep -q 'Sua sessão está preservada' desktop/src/renderer/index.html
          # herdados F3.5.5C intactos (quantidade + editor rico + Worker vivo):
          grep -q 'id="fScriptQty"' desktop/src/renderer/index.html
          grep -q 'function rteSanitize' desktop/src/renderer/index.html
          grep -q 'V64.60-f355c-rich-render' cloudflare-worker.js
          echo "MARCADORES F3.5.5C-H1: VERIFIED."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão + correção de sessão + herdados no app.asar (suítes contra o pacote)"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.221') process.exit(1);"
          # correção H1 presente nos BYTES do pacote (main compilado + renderer):
          grep -q 'server_unauthorized_confirmed' asar-x/dist/main/auth-core.js
          grep -q 'http_401_opaque' asar-x/dist/main/auth-core.js
          grep -q 'http_401_unconfirmed' asar-x/dist/main/auth-core.js
          grep -q 'renameSync' asar-x/dist/main/auth-core.js
          grep -q 'authRetryNow' asar-x/src/renderer/index.html
          grep -q '_nb<40' asar-x/src/renderer/index.html
          grep -q 'Aguardando conexão…' asar-x/src/renderer/index.html
          # herdados intactos no pacote:
          grep -q 'id="fScriptQty"' asar-x/src/renderer/index.html
          grep -q 'function rteSanitize' asar-x/src/renderer/index.html
          grep -q 'evc2-date' asar-x/src/renderer/index.html
          grep -q 'data-detnoteedit' asar-x/src/renderer/index.html
          grep -q "CHECK-IN DE EXECUÇÃO" asar-x/src/renderer/slareminder.html
          test -f asar-x/dist/main/executionOrchestrator.js
          test -f asar-x/src/renderer/sounds/execution-checkin.wav
          grep -q 'mode: "off"' asar-x/dist/main/main.js
          # SUÍTE DA FASE contra os BYTES EMPACOTADOS do auth-core (29 asserts, inclui ciclos 20x):
          AUTH_CORE_SRC=asar-x/dist/main/auth-core.js node scripts/f355ch1-session-restore.test.mjs
          # herdadas contra o pacote:
          SRC=asar-x/src/renderer/index.html WSRC=../cloudflare-worker.js node scripts/f355c-script-quantity-rich-editor.test.mjs
          SRC=asar-x/src/renderer/index.html node scripts/f355b-agenda-premium.test.mjs
          SRC=asar-x/src/renderer/index.html node scripts/f355ah1-internal-notes.test.mjs
          SRC=asar-x/src/renderer/index.html BG_SRC=asar-x/src/renderer/bgnotify.html MAIN_SRC=src/main/main.ts BGM_SRC=src/main/bgNotify.ts node scripts/f354wh2-immediate-notification-sound.test.mjs
          SRC=asar-x/src/renderer/index.html node scripts/f354wh1-details-status-notes.test.mjs
          echo "GATE F3.5.5C-H1 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.221"; echo "rotulo      : 1.0.221-f355ch1-session-restore-boot-hotfix (CANDIDATA — Hotfix de Sessão Automática no Boot)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.220 (commit 2d003ad)"; echo "rollback    : Desktop 1.0.218 (imediato, commit 1a94515); adicional 1.0.216 (e509f43)"; echo "origem      : F3.5.5C-H1 — HOTFIX P0 da restauração automática de sessão no boot do Windows. Servidor = única autoridade de expiração/revogação: sem wipe por janela local/relógio; wipe SOMENTE com 401-contrato confirmado em 2 leituras (1,2s); 401 opaco/não confirmado = transitório (splash + retry, nunca login); releitura do session.json no boot; dica local deslizante; persist atômico (tmp+rename). Renderer: tolerância à ponte do preload (40x300ms) antes de admitir no_bridge; link 'Tentar novamente' com retry imediato; bloco-guarda offline do firebase (Aguardando conexão…, reload 4s→60s + evento online). Offline NUNCA vira logout; logout explícito, troca de usuário e recuperação de senha preservados; appId/userData/partição INALTERADOS."; echo "distribuicao: CANDIDATA — publicação no Latest ocorre no workflow desktop-release-f355ch1.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.221-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.221-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
