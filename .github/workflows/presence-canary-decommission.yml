# =====================================================================
# [manual] F3.4.2A DECOMMISSION LOTE 2 — EXCLUIR o Worker idseven-presence-canary
# ---------------------------------------------------------------------
# Exclui SOMENTE o Worker canario isolado `idseven-presence-canary` (script +
# Durable Object PresenceHubCanary + binding PRESENCE_HUB + migrations/config
# exclusivos + rota workers.dev). `wrangler delete` remove o Worker inteiro e os
# dados do DO. Usa CLOUDFLARE_API_TOKEN/ACCOUNT_ID (COMPARTILHADOS — apenas usados,
# NUNCA removidos). NAO toca o Worker J6 (idseven-push) nem qualquer outro Worker,
# Cloud Run, Firestore ou Rules. Guard de nome garante o alvo exato. Execucao
# SOMENTE manual. Historico Git/tags/releases canarios PRESERVADOS (nao sao tocados).
# =====================================================================
name: "[manual] F3.4.2A DECOMMISSION — excluir Worker idseven-presence-canary"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite EXCLUIR-PRESENCE-CANARY para autorizar"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: "idseven-presence-canary"
      PINNED_SHA: "eed520e1a81da52bceb7a0962e637604e0e14020"
      URL: "https://idseven-presence-canary.agidseven.workers.dev"
    steps:
      - name: "Gate — confirmacao literal"
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "EXCLUIR-PRESENCE-CANARY" ]; then
            echo "::error::confirmacao invalida — nada foi excluido"; exit 1
          fi

      - name: "Gate — secrets Cloudflare presentes (COMPARTILHADOS; apenas usados, nunca removidos)"
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::falta CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "OK: secrets Cloudflare presentes (valores nao exibidos)"

      - name: "Checkout do commit canario pinado (fonte do wrangler.stage2.toml)"
        uses: actions/checkout@v5
        with:
          ref: eed520e1a81da52bceb7a0962e637604e0e14020

      - name: "Guard — alvo EXATO idseven-presence-canary (NUNCA idseven-push/J6)"
        working-directory: presence-service
        run: |
          set -e
          TOML=wrangler.stage2.toml
          grep -q 'name = "idseven-presence-canary"' "$TOML" || { echo "::error::config nao e do idseven-presence-canary"; exit 1; }
          grep -vE '^\s*#' "$TOML" | grep -q 'idseven-push' && { echo "::error::config referencia o Worker J6 — abortando"; exit 1; } || true
          echo "OK: alvo confirmado = $TARGET (J6 nao referenciado)"

      - name: "Setup Node + instalar wrangler"
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: "npm install (wrangler)"
        working-directory: presence-service
        run: npm install --no-audit --no-fund

      - name: "Pre-check — /health responde ANTES (worker vivo)"
        run: |
          H="$(curl -sS -m 20 "$URL/health" || true)"
          echo "antes: $H"
          echo "$H" | grep -q '"ok":true' && echo "worker esta vivo (sera excluido)" || echo "aviso: /health nao respondeu ok antes (segue exclusao mesmo assim)"

      - name: "EXCLUIR — wrangler delete por NOME (idempotente: worker + DO + dados)"
        working-directory: presence-service
        run: |
          set +e
          # Delete por NOME (evita enumeracao de KV do `-c`, que exige permissao que o token nao tem).
          # `wrangler delete` de um Worker remove o script + o namespace do DO (PresenceHubCanary) + dados.
          printf 'y\n' | npx wrangler delete --name "$TARGET" --force 2>&1 | tee del.log
          echo "---- avaliando resultado (idempotente) ----"
          if grep -qiE 'Successfully deleted|has been deleted|Deleted .*'"$TARGET" del.log; then
            echo "OK: worker $TARGET EXCLUIDO agora."
          elif grep -qiE 'does not exist|code: *10090' del.log; then
            echo "OK: worker $TARGET JA NAO EXISTE na conta (idempotente — objetivo alcancado)."
          else
            echo "::error::resultado inesperado do delete (ver del.log acima)"; exit 1
          fi

      - name: "Pos-verificacao — endpoint NAO responde mais (worker + rota removidos)"
        run: |
          set -e
          echo "== poll /health ate deixar de responder ok:true (propagacao Cloudflare) =="
          GONE=0
          for i in $(seq 1 15); do
            CODE="$(curl -sS -m 20 -o /tmp/h.out -w '%{http_code}' "$URL/health" || echo "000")"
            BODY="$(cat /tmp/h.out 2>/dev/null || true)"
            echo "tentativa $i: http=$CODE body=$BODY"
            if ! echo "$BODY" | grep -q '"ok":true'; then GONE=1; echo "endpoint nao responde mais ok:true (removido) na tentativa $i"; break; fi
            sleep 4
          done
          [ "$GONE" = "1" ] || { echo "::error::endpoint ainda responde ok:true apos exclusao (verificar)"; exit 1; }
          echo "===== GO: $TARGET EXCLUIDO — worker + DO + rota removidos; J6/Cloud Run/Firestore/Rules intactos; CLOUDFLARE_* preservados. ====="
          echo "PROXIMO PASSO (owner): remover manualmente o Actions secret PRESENCE_TICKET_SECRET (repo Settings > Secrets)."
