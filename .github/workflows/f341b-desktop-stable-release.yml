# =====================================================================
# [manual] F3.4.1B — Publicacao da RELEASE ESTAVEL Desktop 1.0.178 (PRODUCAO / Latest)
# ---------------------------------------------------------------------
# Publica a release ESTAVEL de PRODUCAO 1.0.178 (canal latest) do run
# 29756781120. Substitui a 1.0.177 como Latest. TUDO PINADO: run id, SHA do
# codigo estavel (alvo da tag), ids+digests dos artifacts, hashes SHA-256
# (EXE/MSI/latest.yml/blockmap), tag e titulo.
# O job:
#   1) exige confirmacao literal (input);
#   2) valida run 29756781120 = completed/success;
#   3) confirma o head do branch estavel == SHA pinado (alvo da tag);
#   4) aborta se a tag/release v1.0.178 ja existir;
#   5) baixa os 2 artifacts (installer + updatemeta), confere ids+digests e
#      os hashes byte a byte (divergiu => aborta SEM publicar);
#   6) cria a release prerelease=false, latest=true, tag no SHA estavel;
#   7) anexa 7 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS,
#      VERSAO-DESKTOP.txt, RELATORIO-DESKTOP.txt (app-update.yml NAO e asset);
#   8) pos-verifica flags/assets/target + confirma que a 1.0.178 VIROU Latest,
#      a 1.0.177-production segue PRESERVADA, e as canary.1/canary.2 seguem
#      preservadas como prereleases historicas;
#   9) smoke: re-baixa EXE + latest.yml da release e reconfere os hashes.
# NAO builda, NAO deploya, NAO toca Firebase/Worker/Rules/flags, NAO mexe em
# releases/tags antigas. Sem secrets alem do GITHUB_TOKEN padrao.
# Execucao SOMENTE manual (workflow_dispatch).
# =====================================================================
name: "[manual] F3.4.1B Desktop Stable Release — 1.0.178 (Latest)"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.178-STABLE para autorizar"
        required: true
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      RUN_ID: "29756781120"
      STABLE_SHA: "9444e7fab945956258a45cfcebb00bbd87e72447"
      DESK_BRANCH: "desktop/f341b-native-updater-stable"
      TAG: "v1.0.178"
      TITLE: "Agenda ID Seven Desktop 1.0.178 — Produção Estável"
      ART_INST: "agenda-id-seven-desktop-1.0.178-installer"
      ART_INST_DIGEST: "sha256:e24d96621f36494246aedda919a2bd29a932c5bfd010fea41bee820abb369325"
      ART_META: "agenda-id-seven-desktop-1.0.178-updatemeta"
      ART_META_DIGEST: "sha256:2f3c052c7a881dad8baac68bf12284bbed4e62ef501b9acf1dc5a35e2df70086"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.178-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.178-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.178-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "53702b4521199d6f8c19b631cd863235d61fe722804f682d1fbdd79b83d9df3f"
      EXP_MSI: "8f73de4545044fe6a0e635c111082a8275106c8ac27dfb6a6d28037c8456d3c8"
      EXP_LY: "c8f2d10d6de69b7d26d4860b60f1903c6a6cf9f21341581c08f430daa7d6d218"
      EXP_BM: "1cacd52010b62cd8253a06396962643fa75b80d23c7c1ebc988a471c1846ba58"
      PROD_PREV_TAG: "desktop/v1.0.177-production"
      CANARY1_TAG: "v1.0.178-canary.1"
      CANARY2_TAG: "v1.0.178-canary.2"
    steps:
      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PUBLICAR-DESKTOP-1.0.178-STABLE" ]; then
            echo "::error::confirmacao invalida — nada foi publicado"; exit 1
          fi
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run invalido para publicacao"; exit 1; }

      - name: "Gate 3 — head do branch estavel == SHA pinado (alvo da tag)"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          echo "head $DESK_BRANCH: $H (esperado $STABLE_SHA)"
          [ "$H" = "$STABLE_SHA" ] || { echo "::error::branch estavel moveu; alvo da tag divergiu"; exit 1; }

      - name: "Gate 4 — tag e release nao podem existir"
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "::error::tag $TAG ja existe"; exit 1; fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          echo "OK: tag e release livres"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          check() {
            local name="$1" digest="$2"
            local d
            d="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .digest')"
            echo "artifact $name: $d"
            [ "$d" = "$digest" ] || { echo "::error::digest do artifact $name divergente ($d != $digest)"; exit 1; }
            local exp
            exp="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .expired')"
            [ "$exp" = "false" ] || { echo "::error::artifact $name expirado"; exit 1; }
          }
          check "$ART_INST" "$ART_INST_DIGEST"
          check "$ART_META" "$ART_META_DIGEST"
          echo "OK: artifacts intactos"

      - name: "Baixar artifacts (installer + updatemeta)"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          ls -lh pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::asset ausente no artifact: $f"; exit 1; }
          done
          test -f pacote/app-update.yml && { echo "::error::app-update.yml NAO deve ser asset publico"; exit 1; } || true

      - name: "Gate 6 — hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          H_EXE="$(sha256sum "pacote/$EXE_NAME" | awk '{print $1}')"
          H_MSI="$(sha256sum "pacote/$MSI_NAME" | awk '{print $1}')"
          H_LY="$(sha256sum "pacote/$LY_NAME" | awk '{print $1}')"
          H_BM="$(sha256sum "pacote/$BM_NAME" | awk '{print $1}')"
          echo "exe=$H_EXE"; echo "msi=$H_MSI"; echo "latest.yml=$H_LY"; echo "blockmap=$H_BM"
          [ "$H_EXE" = "$EXP_EXE" ] || { echo "::error::hash EXE divergente"; exit 1; }
          [ "$H_MSI" = "$EXP_MSI" ] || { echo "::error::hash MSI divergente"; exit 1; }
          [ "$H_LY" = "$EXP_LY" ] || { echo "::error::hash latest.yml divergente"; exit 1; }
          [ "$H_BM" = "$EXP_BM" ] || { echo "::error::hash blockmap divergente"; exit 1; }
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.178" "pacote/$LY_NAME" || { echo "::error::latest.yml version incorreta"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml nao referencia o EXE (mesmo run)"; exit 1; }
          echo "OK: hashes conferem + latest.yml coerente (EXE do mesmo run)"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.178 — Produção Estável

          Primeira versao de PRODUCAO com o atualizador nativo (electron-updater + NSIS) no canal
          ESTAVEL (latest). Substitui a 1.0.177 como versao oficial (Latest). Instalar em maquinas
          autorizadas apos conferencia de hash.

          O QUE E
          - Atualizador nativo em producao: allowPrerelease=false, channel="latest", allowDowngrade=false,
            autoDownload=false, autoInstallOnAppQuit=false, forceDevUpdateConfig=false. Download so apos
            acao do usuario; instalacao so apos confirmacao + verificacao de trabalho nao salvo; nunca
            instala silencioso. Maquinas estaveis NUNCA veem prereleases/canario (canal isolado).
          - A partir desta versao, futuras atualizacoes estaveis sao detectadas, baixadas e instaladas
            pelo proprio app (comprovado no canario canary.1 -> canary.2 em maquina real).
          - Metadata do MESMO build: latest.yml + <exe>.blockmap; app-update.yml fica SO dentro do pacote
            (provider github publico agidseven-lang/Agenda, sem token no cliente).

          PRESERVACAO (congelado da 1.0.177)
          - Todas as funcoes de negocio byte-identicas a 1.0.177 (gate region-scoped + app.asar).
          - Rollback oficial: 1.0.177 (desktop/v1.0.177-production) PRESERVADA.
          - Prereleases historicas preservadas: v1.0.178-canary.1 e v1.0.178-canary.2.

          HASHES OFICIAIS (SHA-256)
          - EXE: 53702b4521199d6f8c19b631cd863235d61fe722804f682d1fbdd79b83d9df3f
          - MSI: 8f73de4545044fe6a0e635c111082a8275106c8ac27dfb6a6d28037c8456d3c8
          - latest.yml: c8f2d10d6de69b7d26d4860b60f1903c6a6cf9f21341581c08f430daa7d6d218
          - blockmap: 1cacd52010b62cd8253a06396962643fa75b80d23c7c1ebc988a471c1846ba58
          Confira com SHA256SUMS anexado (sha256sum -c SHA256SUMS) ou certutil -hashfile <arquivo> SHA256.

          INSTALACAO
          1. Feche o app atual pela bandeja (Sair).
          2. Baixe o EXE, confira o SHA-256.
          3. Rode o instalador (SmartScreen: Mais informacoes -> Executar assim mesmo; app sem assinatura).
          4. Abra e faca login. Confirme 1.0.178 em Sobre.

          RISCOS CONHECIDOS
          - Instalador nao assinado (SmartScreen/MOTW). Integridade por SHA-512 (latest.yml) + SHA-256 (release).
          - MSI e contingencia manual; o auto-update usa SOMENTE o EXE NSIS (canal latest).

          Procedencia: run 29756781120 (success); fonte desktop/f341b-native-updater-stable @ 9444e7f.
          NOTAS
          wc -l notas.md

      - name: "Publicar release ESTAVEL (prerelease=false, latest=true) — 7 assets"
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" \
            --latest=true \
            --title "$TITLE" \
            --notes-file notas.md \
            "pacote/$EXE_NAME" \
            "pacote/$MSI_NAME" \
            "pacote/$LY_NAME" \
            "pacote/$BM_NAME" \
            "pacote/SHA256SUMS" \
            "pacote/VERSAO-DESKTOP.txt" \
            "pacote/RELATORIO-DESKTOP.txt"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (flags/assets/target + 1.0.178 e Latest; 1.0.177 e canarios preservados)"
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" \
            --json tagName,targetCommitish,isPrerelease,isDraft,assets \
            --jq '{tag:.tagName,target:.targetCommitish,prerelease:.isPrerelease,draft:.isDraft,assets:[.assets[].name]}'
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS (esperado false|false)"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "7" ] || { echo "::error::esperado 7 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset ausente na release: $a"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TGT="$(gh release view "$TAG" -R "$REPO" --json targetCommitish --jq '.targetCommitish')"
          [ "$TGT" = "$STABLE_SHA" ] || { echo "::error::target incorreto: $TGT"; exit 1; }
          # A 1.0.178 PRECISA ser o Latest do repo agora (substitui a 1.0.177).
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          echo "Latest do repo: $LATEST_TAG"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          # 1.0.177 PRESERVADA (release ainda existe) e canarios preservados como prereleases.
          gh release view "$PROD_PREV_TAG" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$PROD_PREV_TAG" || { echo "::error::1.0.177-production sumiu"; exit 1; }
          C1="$(gh release view "$CANARY1_TAG" -R "$REPO" --json isPrerelease --jq '.isPrerelease')"
          C2="$(gh release view "$CANARY2_TAG" -R "$REPO" --json isPrerelease --jq '.isPrerelease')"
          { [ "$C1" = "true" ] && [ "$C2" = "true" ]; } || { echo "::error::canarios historicos alterados (prerelease != true)"; exit 1; }
          echo "===== GO: 1.0.178 ESTAVEL PUBLICADA e Latest; 1.0.177 + canarios preservados ====="

      - name: "Smoke — re-baixar EXE + latest.yml da release e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$LY_NAME" -D smoke
          S_EXE="$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')"
          S_LY="$(sha256sum "smoke/$LY_NAME" | awk '{print $1}')"
          [ "$S_EXE" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$S_LY" = "$EXP_LY" ] || { echo "::error::smoke latest.yml hash divergente"; exit 1; }
          echo "SMOKE OK: EXE e latest.yml publicados conferem byte a byte (mesmo run)."
