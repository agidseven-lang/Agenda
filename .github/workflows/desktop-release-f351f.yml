# =====================================================================
# [manual] F3.5.1F — Publicacao da RELEASE ESTAVEL Desktop 1.0.186 (ROLL-FORWARD da 1.0.184; Latest)
# ---------------------------------------------------------------------
# Publica a release ESTAVEL de PRODUCAO 1.0.186 (canal latest) = ROLL-FORWARD da 1.0.184 OFICIAL
# (@03c5893): codigo de produto BYTE-IDENTICO a 1.0.184, so a versao muda; deltas F4.2F/1.0.185 e
# ?v= AUSENTES. Usa EXCLUSIVAMENTE os BYTES ja produzidos no run de build F3.5.1F (gated, verde).
# Substitui a 1.0.185 como Latest (SEM downgrade: 1.0.186 > 1.0.185 no updater). NAO RECOMPILA: baixa
# os 2 artifacts do run e publica os MESMOS arquivos/bytes. TUDO PINADO (preenchido apos o build
# verde): run id, SHA do codigo, nomes+digests dos artifacts, 5 hashes SHA-256, tag e titulo.
# ESCRITAS (tag + release + assets + Latest) via TOKEN TEMPORARIO do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho) — NENHUM RELEASE_PAT, NENHUM GITHUB_TOKEN de escrita. Execucao SO
# manual, autorizada pelo literal PUBLICAR-DESKTOP-1.0.186-STABLE. NAO builda/deploya/toca Firebase/
# Worker/Rules/Android/portal/Cloud Run; NAO mexe em releases/tags antigas (1.0.185/1.0.184/1.0.183).
# =====================================================================
name: "[manual] F3.5.1F Desktop Stable Release — 1.0.186 (Latest, roll-forward of 1.0.184)"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.186-STABLE para autorizar"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM (preenchida apos o build F3.5.1F verde; placeholders bloqueiam a publicacao) ──
      RUN_ID: "30215262327"
      STABLE_SHA: "e87ef4b59c4edc6c6fd6249fd7f4ac07b6413048"
      DESK_BRANCH: "desktop/f351f-rollforward-1.0.186"
      TAG: "v1.0.186"
      TITLE: "Agenda ID Seven Desktop 1.0.186 — Produção Estável (roll-forward da 1.0.184)"
      ART_INST: "agenda-id-seven-desktop-1.0.186-installer"
      ART_INST_DIGEST: "sha256:43c6282cd281f5e1829c3f39b1cd40256b65248b19f637cbea8e40a80ede3752"
      ART_META: "agenda-id-seven-desktop-1.0.186-updatemeta"
      ART_META_DIGEST: "sha256:8ff81c82101198212bd27b38cc042b1fd6144495326ab5e06e2b1c5fcdc2c753"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.186-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.186-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.186-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      SBOM_NAME: "SBOM-cyclonedx.json"
      EXP_EXE: "44fd70eab3d5dc00defd83d3e694e2bca3da561dab311ad797bcd12f1933fd59"
      EXP_MSI: "babb6d00c1d0b8416544db8d2b6688b4d946c64c04d87b4d5a36e1681c9bea48"
      EXP_LY: "19c7c9877d4fa1abf1af6906ecc3061dd8de729fcca2de42939213f78ca315ae"
      EXP_BM: "fb7ffa85ffb2ebb4f2c9b770709593fca30490c61f2e5d68016f83fc7c3c3297"
      EXP_SBOM: "f92b1355aca2f10c85bc070d6af6377e619b87964f77aaa0234c95dee5cb7439"
      PROD_PREV_TAG: "v1.0.185"
      PROD_ROLLBACK_TAG: "v1.0.184"
      PROD_HIST_TAG: "v1.0.183"
    steps:
      - name: "Gate 0 — pinagem preenchida (bloqueia publicacao enquanto houver placeholder)"
        run: |
          set -euo pipefail
          for v in "$RUN_ID" "$ART_INST_DIGEST" "$ART_META_DIGEST" "$EXP_EXE" "$EXP_MSI" "$EXP_LY" "$EXP_BM" "$EXP_SBOM"; do
            case "$v" in __FILL_*__) echo "::error::pinagem incompleta ($v) — preencha run/digests/hashes apos o build verde. NADA publicado."; exit 1;; esac
          done
          echo "OK: pinagem completa"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "PUBLICAR-DESKTOP-1.0.186-STABLE" ] || { echo "::error::confirmacao invalida — nada publicado"; exit 1; }
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run de build completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }

      - name: "Gate 3 — STABLE_SHA e commit real e pertence a linhagem do roll-forward (alvo da tag)"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$STABLE_SHA" --jq '.sha' >/dev/null || { echo "::error::commit $STABLE_SHA nao existe"; exit 1; }
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::$STABLE_SHA fora da linhagem do roll-forward ($CMP)"; exit 1; }

      - name: "Gate 4 — release NAO existe; tag so pode preexistir apontando para STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" "$SBOM_NAME" SHA256SUMS; do
            test -f "pacote/$f" || { echo "::error::asset ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 6 — 5 hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["$SBOM_NAME"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.186" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.186"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml nao referencia o EXE"; exit 1; }
          grep -Eq '^channel +: latest$' pacote/VERSAO-DESKTOP.txt || { echo "::error::channel != latest"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.186/EXE) + channel=latest"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.186 — Produção Estável (roll-forward da 1.0.184)

          Sucessora da 1.0.185 como versão oficial (Latest), canal ESTÁVEL (latest). Atualização
          EXCLUSIVAMENTE pelo ATUALIZADOR INTERNO do app (Configurações → Atualizações → Verificar →
          Baixar → Instalar e reiniciar). Não é necessário baixar nada manualmente. NÃO é downgrade:
          1.0.186 é uma versão nova e superior à 1.0.185 no atualizador.

          O QUE MUDA vs 1.0.185
          - ROLL-FORWARD para o comportamento da 1.0.184 (última versão comprovadamente funcional pelo
            owner). O código de PRODUTO da 1.0.186 é BYTE-IDÊNTICO ao da 1.0.184 OFICIAL (@03c5893);
            a ÚNICA diferença de produto é o número de versão (1.0.184 → 1.0.186).
          - REMOVIDOS os deltas F4.2F introduzidos na 1.0.185: bridge de Firebase Auth silencioso
            (firebaseAuthBridge.js, firebase-auth-compat, signInWithCustomToken), IPC de Custom Token
            (auth-firebase-token/authFirebaseToken) e flags DESKTOP_FIREBASE_AUTH_ENABLED/REQUIRED.
            O endpoint issueFirebaseAuthToken no backend permanece publicado, porém INERTE para a
            Desktop (não é chamado). Nenhum cache-bust ?v= no link enviado.
          - Restaura o Card Premium do WhatsApp exatamente como na 1.0.184.

          PRESERVAÇÃO (zero regressão vs 1.0.184)
          - Fonte = 1.0.184 OFICIAL @03c5893 + SOMENTE o número de versão — provado no run de build pelo
            gate de EQUIVALÊNCIA (desktop/src, electron-builder.yml, tsconfig, assets byte-idênticos;
            F4.2F ausente no app.asar; ?v= ausente no link). Login/UI/telas, notificações amarela/vermelha,
            SLA, tray, X/bandeja, Agenda/Kanban/tarefas/eventos/chats/arquivos/WhatsApp/Card Premium,
            portal do cliente, atualizador e canal stable/latest = 1.0.184. Worker J6/Android/Functions/
            Rules/Cloud Run/portal INTOCADOS. Suítes de preservação verdes: SLA/fluxo/temporal Golden
            Masters · entrega visual imediata 46/0 · harness independente 18/0 · updater state-machine
            57/0 · notifier/delivery-channel/baseline-freeze.
          - Rollback: 1.0.185 PRESERVADA (re-marcar Latest); 1.0.184/1.0.183 preservadas.

          UPDATER (produção): allowPrerelease=false, channel="latest", allowDowngrade=false (no app.asar).
          Metadata do MESMO build: latest.yml + <exe>.blockmap; app-update.yml só dentro do pacote.

          Procedência: run de build F3.5.1F (success); fonte desktop/f351f-rollforward-1.0.186
          (base 1.0.184 OFICIAL 03c5893 + apenas a versão — provado por gate de equivalência). Mesmos
          bytes; sem recompilar. Confira o SHA-256 (SHA256SUMS anexado; sha256sum -c SHA256SUMS).
          NOTAS

      - name: "Criar tag pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release ESTAVEL (prerelease=false, latest=true) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$BM_NAME" "pacote/$LY_NAME" "pacote/$SBOM_NAME" "pacote/SHA256SUMS"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (Latest=1.0.186; 1.0.185/1.0.184/1.0.183 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.186 ESTAVEL PUBLICADA e Latest; 1.0.185/1.0.184/1.0.183 preservadas ====="

      - name: "Smoke — re-baixar EXE + latest.yml + SBOM e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$LY_NAME" -p "$SBOM_NAME" -D smoke
          [ "$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$LY_NAME" | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::smoke latest.yml hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$SBOM_NAME" | awk '{print $1}')" = "$EXP_SBOM" ] || { echo "::error::smoke SBOM hash divergente"; exit 1; }
          echo "SMOKE OK: EXE + latest.yml + SBOM publicados conferem byte a byte."
