# =====================================================================
# [manual] F3.4.2A Stage-2A — Publicacao da PRERELEASE canario Desktop 1.0.179-canary.2
# ---------------------------------------------------------------------
# Publica a prerelease CANARIO 1.0.179-canary.2 (Stage-2A: cliente WebSocket de
# presenca em tempo real ao Worker canario STAGE 2 — DO PresenceHubCanary + WebSocket
# Hibernation; recebe baseline/estado agregado; BROADCAST DESLIGADO — SEM notificacoes
# entrou/saiu) do run 29785750877. TUDO PINADO: run id, SHA do codigo canario
# (alvo da tag), ids+digests dos artifacts, hashes SHA-256 (EXE/MSI/canary.yml/blockmap),
# tag e titulo.
# O job:
#   1) exige confirmacao literal (input);
#   2) valida run 29785750877 = completed/success;
#   3) confirma o head do branch canario == SHA pinado (alvo da tag);
#   4) aborta se a tag/release v1.0.179-canary.2 ja existir;
#   5) baixa os 2 artifacts (installer + updatemeta), confere ids+digests e
#      os hashes byte a byte (divergiu => aborta SEM publicar);
#   6) cria a release prerelease=true, latest=false, tag no SHA canario;
#   7) anexa 7 assets: EXE, MSI, canary.yml, blockmap, SHA256SUMS,
#      VERSAO-DESKTOP.txt, RELATORIO-DESKTOP.txt (app-update.yml NAO e asset);
#   8) pos-verifica flags/assets/target + confirma que a 1.0.178 SEGUE Latest
#      (canario NUNCA vira latest) e as tags historicas intactas;
#   9) smoke: re-baixa EXE + canary.yml da release e reconfere os hashes.
# NAO builda, NAO deploya, NAO toca Firebase/Worker J6/Cloud Run/Rules/flags, NAO mexe
# na producao estavel 1.0.178 nem em releases/tags antigas. NAO liga broadcast de presenca.
# So GITHUB_TOKEN padrao. Execucao SOMENTE manual (workflow_dispatch).
# =====================================================================
name: "[manual] F3.4.2A Stage-2A Desktop Canary Release — 1.0.179-canary.2"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.179-CANARY.2 para autorizar"
        required: true
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      RUN_ID: "29785750877"
      CANARY_SHA: "13bf2929edca76d905915adef39e103b9dcfa3ff"
      DESK_BRANCH: "desktop/f342a-realtime-presence-websocket-canary"
      TAG: "v1.0.179-canary.2"
      TITLE: "Agenda ID Seven Desktop 1.0.179-canary.2 — Real-time Presence WebSocket (baseline; broadcast OFF) (CANARIO)"
      ART_INST: "agenda-id-seven-desktop-1.0.179-canary.2-installer"
      ART_INST_DIGEST: "sha256:809708804da0d8fef31055624fa66fcb0551b4fb2428b95d91c904ddf498bbfe"
      ART_META: "agenda-id-seven-desktop-1.0.179-canary.2-updatemeta"
      ART_META_DIGEST: "sha256:6fff15b1ee20343279c178754cf66bb182dcc8e12bd74d9265a3592325f73c5b"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.179-canary.2-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.179-canary.2-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.179-canary.2-x64.exe.blockmap"
      CY_NAME: "canary.yml"
      EXP_EXE: "21aba5f8b81f0f8262e9f38ae5b99c9c5bbef070164f6e1db6ca440c80c75726"
      EXP_MSI: "78566588f4930c2df053f9fdd39943249d302c440a8d3759c6a23fa73df6f916"
      EXP_CY: "903fcef54cb47c2976fb7a526233e020d27e26945131b897899addd02c33a07f"
      EXP_BM: "8178152b3021ef4a271eaafd9d9b7ea265646b63f9453ad57a244118cb89e43c"
      LATEST_TAG_EXP: "v1.0.178"
    steps:
      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PUBLICAR-DESKTOP-1.0.179-CANARY.2" ]; then
            echo "::error::confirmacao invalida — nada foi publicado"; exit 1
          fi
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run invalido para publicacao"; exit 1; }

      - name: "Gate 3 — head do branch canario == SHA pinado (alvo da tag)"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          echo "head $DESK_BRANCH: $H (esperado $CANARY_SHA)"
          [ "$H" = "$CANARY_SHA" ] || { echo "::error::branch canario moveu; alvo da tag divergiu"; exit 1; }

      - name: "Gate 4 — tag e release nao podem existir"
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "::error::tag $TAG ja existe"; exit 1; fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          echo "OK: tag e release livres"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          check() {
            local name="$1" digest="$2"
            local d
            d="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .digest')"
            echo "artifact $name: $d"
            [ "$d" = "$digest" ] || { echo "::error::digest do artifact $name divergente ($d != $digest)"; exit 1; }
            local exp
            exp="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .expired')"
            [ "$exp" = "false" ] || { echo "::error::artifact $name expirado"; exit 1; }
          }
          check "$ART_INST" "$ART_INST_DIGEST"
          check "$ART_META" "$ART_META_DIGEST"
          echo "OK: artifacts intactos"

      - name: "Baixar artifacts (installer + updatemeta)"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          ls -lh pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$CY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::asset ausente no artifact: $f"; exit 1; }
          done
          test -f pacote/app-update.yml && { echo "::error::app-update.yml NAO deve ser asset publico"; exit 1; } || true

      - name: "Gate 6 — hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          H_EXE="$(sha256sum "pacote/$EXE_NAME" | awk '{print $1}')"
          H_MSI="$(sha256sum "pacote/$MSI_NAME" | awk '{print $1}')"
          H_CY="$(sha256sum "pacote/$CY_NAME" | awk '{print $1}')"
          H_BM="$(sha256sum "pacote/$BM_NAME" | awk '{print $1}')"
          echo "exe=$H_EXE"; echo "msi=$H_MSI"; echo "canary.yml=$H_CY"; echo "blockmap=$H_BM"
          [ "$H_EXE" = "$EXP_EXE" ] || { echo "::error::hash EXE divergente"; exit 1; }
          [ "$H_MSI" = "$EXP_MSI" ] || { echo "::error::hash MSI divergente"; exit 1; }
          [ "$H_CY" = "$EXP_CY" ] || { echo "::error::hash canary.yml divergente"; exit 1; }
          [ "$H_BM" = "$EXP_BM" ] || { echo "::error::hash blockmap divergente"; exit 1; }
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.179-canary.2" "pacote/$CY_NAME" || { echo "::error::canary.yml version incorreta"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$CY_NAME" || { echo "::error::canary.yml nao referencia o EXE"; exit 1; }
          echo "OK: hashes conferem + canary.yml coerente"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.179-canary.2 — Real-time Presence WebSocket (baseline; broadcast OFF) (CANARIO)

          PRERELEASE de teste (canal `canary`). NAO e latest, NAO e para distribuicao geral.
          Instalar SOMENTE em maquina real autorizada (owner / 2o computador).

          O QUE MUDA vs 1.0.179-canary.1
          - Stage-2A — CLIENTE WEBSOCKET DE PRESENCA EM TEMPO REAL (processo main). No login (e ao
            retomar/desbloquear), o main: (1) le o token REAL da sessao (session.json, so no main);
            (2) faz POST /auth ao Worker canario isolado idseven-presence-canary levando SO { deviceId }
            (UUID aleatorio persistente; nunca hostname/MAC/IP/serial); (3) recebe um TICKET efemero;
            (4) abre WSS /ws?ticket=... (o ticket vai SO na URL); (5) mantem heartbeat 30s; (6) reconecta
            com backoff. A identidade vem do getUserSelf no servidor — o userId afirmado pelo cliente e
            IGNORADO. O token NUNCA vai ao renderer/log/clipboard/diagnostico.
          - BASELINE, SEM notificacoes — ao conectar, o cliente recebe o snapshot agregado (quantidade de
            usuarios on-line) e atualiza o estado local. BROADCAST DESLIGADO no Worker
            (PRESENCE_BROADCAST_ENABLED=false): NAO existe "[Nome] entrou" / "[Nome] saiu"; reconectar
            NAO gera tempestade de eventos.
          - UI CANARIO (so em builds prerelease) "Presenca em tempo real": mostra WebSocket conectado/
            desconectado, servico, heartbeat ativo, baseline recebido, quantidade total on-line, ultima
            conexao/mensagem e erro sanitizado + botao Conectar/Desconectar. NUNCA exibe token/ticket/
            deviceId completo/IP/hostname/URL com ticket.
          - Infra do Worker STAGE 2 (isolado, ja no ar): Durable Object PresenceHubCanary (SQLite +
            WebSocket Hibernation) com ctx.acceptWebSocket, serializeAttachment/deserializeAttachment,
            alarme unico no vencimento mais proximo (idempotente; SEM setInterval/setTimeout no DO),
            heartbeat 30s / TTL 90s. PRESENCE_WS_ENABLED=true, PRESENCE_BROADCAST_ENABLED=false.
          - Dependencia nova: `ws` (cliente WebSocket no Node/main). Escopo A (notificacao imediata de
            update pelo HUB, produtor unico) e a sonda /auth (presenceAuthProbe) da canary.1 seguem intactos.
          - Runtime do updater CANARIO: allowPrerelease=true, channel="canary", allowDowngrade=false,
            autoDownload=false, autoInstallOnAppQuit=false, forceDevUpdateConfig=false. Metadata do MESMO
            build: canary.yml + <exe>.blockmap; app-update.yml SO dentro do pacote (provider github publico,
            sem token no cliente). Canal ISOLADO: maquinas estaveis (channel latest) NUNCA veem este canario.

          NOTIFICACAO IMEDIATA DE UPDATE (cadeia canario)
          - Uma maquina ja rodando a 1.0.179-canary.1 deve detectar esta 1.0.179-canary.2 e mostrar a
            notificacao imediata "NOVA ATUALIZACAO DISPONIVEL" (produtor unico via HUB), pelo canal canary.

          PRESERVACAO (zero regressao, congelado da 1.0.177)
          - Todas as funcoes de negocio byte-identicas a 1.0.177 (gate region-scoped removendo UPDATER+
            PRESENCE, verificado tambem DENTRO do app.asar empacotado). auth-core/clock/notifier/tray
            intocados. Nenhum segredo (PRESENCE_TICKET_SECRET) empacotado; token so no main (sonda+cliente);
            preload/renderer sem token; body do /auth so { deviceId }; `ws` empacotado; WebSocketPair/
            PresenceHub/setInterval SO no Worker/DO (nunca no cliente).
          - 1.0.178 SEGUE Latest (producao estavel); rollback = reinstalar 1.0.178. Canario NUNCA vira latest.
          - Prereleases/tags historicas preservadas: v1.0.177-production, v1.0.178, v1.0.178-canary.1,
            v1.0.178-canary.2, v1.0.179-canary.1.

          HASHES OFICIAIS (SHA-256)
          - EXE: 21aba5f8b81f0f8262e9f38ae5b99c9c5bbef070164f6e1db6ca440c80c75726
          - MSI: 78566588f4930c2df053f9fdd39943249d302c440a8d3759c6a23fa73df6f916
          - canary.yml: 903fcef54cb47c2976fb7a526233e020d27e26945131b897899addd02c33a07f
          - blockmap: 8178152b3021ef4a271eaafd9d9b7ea265646b63f9453ad57a244118cb89e43c
          Confira com SHA256SUMS anexado (sha256sum -c SHA256SUMS) ou certutil -hashfile <arquivo> SHA256.

          PROVA FISICA (parte do owner) — contas REAIS, SEM usuarios ficticios
          1. Atualizacao automatica: na maquina com 1.0.179-canary.1, confirme a notificacao imediata
             "NOVA ATUALIZACAO DISPONIVEL" e atualize para 1.0.179-canary.2 (confirme em Sobre).
          2. Login com conta real; Config -> Presenca -> "Presenca em tempo real": confirme WebSocket
             CONECTADO, heartbeat ativo, baseline recebido e quantidade total on-line. (Prova o fluxo
             token real -> /auth -> ticket -> WSS /ws -> baseline, sem expor token/ticket.)
          3. Duas contas reais on-line ao mesmo tempo: a contagem agregada sobe, e NAO aparece nenhuma
             notificacao "entrou/saiu" (broadcast OFF).
          4. Ciclo de vida: fechar no X mantem a conexao (tray); logout/Sair encerram; suspender/retomar
             ou bloquear/desbloquear reconecta com backoff (sem tempestade).

          RISCOS CONHECIDOS
          - Instalador nao assinado (SmartScreen/MOTW). Integridade por SHA-512 (canary.yml) + SHA-256 (release).
          - MSI e contingencia manual; o auto-update usa SOMENTE o EXE NSIS (canal canary).
          - Presenca em tempo real esta em BASELINE (broadcast OFF): sem "entrou/saiu", sem status definitivo
            na tela Equipe, sem rollout estavel. A ativacao do broadcast e um estagio futuro autorizado
            (F3.4.2A-STAGE-2B-ENABLE-PRESENCE-BROADCAST).

          Procedencia: run 29785750877 (success); fonte desktop/f342a-realtime-presence-websocket-canary @ 13bf292.
          NOTAS
          wc -l notas.md

      - name: "Publicar prerelease (prerelease=true, latest=false) — 7 assets"
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$CANARY_SHA" \
            --prerelease \
            --latest=false \
            --title "$TITLE" \
            --notes-file notas.md \
            "pacote/$EXE_NAME" \
            "pacote/$MSI_NAME" \
            "pacote/$CY_NAME" \
            "pacote/$BM_NAME" \
            "pacote/SHA256SUMS" \
            "pacote/VERSAO-DESKTOP.txt" \
            "pacote/RELATORIO-DESKTOP.txt"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (flags/assets/target + 1.0.178 segue Latest)"
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" \
            --json tagName,targetCommitish,isPrerelease,isDraft,assets \
            --jq '{tag:.tagName,target:.targetCommitish,prerelease:.isPrerelease,draft:.isDraft,assets:[.assets[].name]}'
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "true|false" ] || { echo "::error::flags incorretas: $FLAGS (esperado true|false)"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "7" ] || { echo "::error::esperado 7 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$CY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset ausente na release: $a"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TGT="$(gh release view "$TAG" -R "$REPO" --json targetCommitish --jq '.targetCommitish')"
          [ "$TGT" = "$CANARY_SHA" ] || { echo "::error::target incorreto: $TGT"; exit 1; }
          # A 1.0.178 PRECISA continuar sendo o Latest do repo (canario NUNCA vira latest).
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          echo "Latest do repo: $LATEST_TAG"
          [ "$LATEST_TAG" = "$LATEST_TAG_EXP" ] || { echo "::error::Latest do repo mudou: $LATEST_TAG (esperado $LATEST_TAG_EXP)"; exit 1; }
          [ "$LATEST_TAG" != "$TAG" ] || { echo "::error::canario virou Latest!"; exit 1; }
          echo "===== GO: PRERELEASE CANARIO 1.0.179-canary.2 PUBLICADA; 1.0.178 segue Latest ====="

      - name: "Smoke — re-baixar EXE + canary.yml da release e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$CY_NAME" -D smoke
          S_EXE="$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')"
          S_CY="$(sha256sum "smoke/$CY_NAME" | awk '{print $1}')"
          [ "$S_EXE" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$S_CY" = "$EXP_CY" ] || { echo "::error::smoke canary.yml hash divergente"; exit 1; }
          echo "SMOKE OK: EXE e canary.yml publicados conferem byte a byte."
