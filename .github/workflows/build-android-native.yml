# Build do APK do app Android NATIVO (Kotlin) em /android-native.
# Fase 1: app mínimo (abre + tela de login). Sem Firebase ainda.
# Roda manual (workflow_dispatch) e em push na branch.
name: Build Android Nativo

on:
  workflow_dispatch:
  push:
    branches: [feat/android-native-kotlin]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar debug keystore (assinatura de teste)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restaurar google-services.json (do secret; usado a partir da Fase 2)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android-native/app/google-services.json
            echo "google-services.json restaurado ($(wc -c < android-native/app/google-services.json) bytes)."
          else
            echo "Secret ausente — ok na Fase 1 (Firebase ainda não usado)."
          fi

      - name: gradlew assembleRelease
        working-directory: android-native
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK (smoke da Fase 1)
        uses: actions/upload-artifact@v4
        with:
          name: app-android-native-smoke-apk
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
