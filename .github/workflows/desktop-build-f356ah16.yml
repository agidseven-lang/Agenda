# F3.5.6A-H16 — Desktop 1.0.242 (conclusao final com PRECEDENCIA + BLOQUEIO de writes pos-conclusao).
# Defeito 1.0.241 (Cronograma Teste 6): apos a aprovacao FINAL REAL do cliente, a tela Detalhes ainda
# mostrava estado de producao (badge/HERO "Designer entregou", status operacional "Aguardando legendas e
# posts", responsavel Social, botoes Legendas/Enviar ATIVOS, marco final sem carimbo real). Causa-raiz
# (CASE A, leitor puro): DUAS autoridades — isTaskCompleted (sem guarda de producao; usada por
# clientCol/finalOk => card/Cliente/timeline CORRETOS) vs isFullyComplete (guardas pendingProduction/
# pendingStory; usada por operationalCol/detailState => Detalhes STALE com conteudo residual).
# CORRECAO 1.0.242 (RENDERER-only, index.html): E1 operationalCol precedencia isTaskCompleted;
# E2 detailState 1a ramificacao isTaskCompleted -> concluido final (owner none; so clientview);
# E3 openProductionModal guard (ZERO write); E4 openSendClientModal guard ANTES de ensureReviewToken (ZERO
# write); E5 Fase do cliente DISPLAY-ONLY 'Concluida' (canonico 'final' intacto); E6 timeline marco final
# carimbado pela FONTE REAL (rodada FINAL decisionAt+recordedBy > clientFinalApprovedAt/By > evento EXATO >
# doneAt; sem substring/fabricar/updatedAt). isFullyComplete NAO alterado globalmente; guardas so agem
# quando isTaskCompleted(t)===true. MUDANCA de producao = SOMENTE desktop/src/renderer/index.html.
# build GATED, --publish never. Publicacao no Latest so no desktop-release-f356ah16.yml (mesmos bytes).
# Base tecnica 1.0.241 (50595ca). BASELINE FISICA 1.0.228. ROLLBACK IMEDIATO 1.0.228. slaRules.js
# byte-identico; Worker V64.61 INALTERADO.
name: "[push/manual] F3.5.6A-H16 — Desktop 1.0.242 (conclusao final precedencia + bloqueio writes) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah16-final-completed-precedence-1.0.242"]
    paths-ignore: [".github/workflows/desktop-release-f356ah16.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah16-final-completed-precedence-1.0.242"
  BASE_241_SHA: "50595ca1f6e1bcb92478d606d1932cfd90db658c"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.241 base técnica e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_241_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.242 (package + lock x2 + marcador H16 + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.242'){console.error('versão',p.version);process.exit(1);} for(const m of ['final-completed-precedence','nextaction-final-wait-text','timeline-step7-final-wait','timeline-honest-preenvio','final-state-premature-fix']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.242"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES H16 (E1..E6 presentes; legados ausentes) no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # E1 operationalCol precedência isTaskCompleted (comentário H16 presente; legado ÚNICO ausente)
          grep -qF "if(isTaskCompleted(t))return 'concluido';                             // F3.5.6A-H16: conclusão final tem PRECEDÊNCIA" "$S"
          if grep -qF "if(isFullyComplete(t))return 'concluido';                              // ÚNICO caminho para concluído" "$S"; then echo "::error::operationalCol legado (isFullyComplete) ainda presente"; exit 1; fi
          # E2 detailState estado final (novo texto presente; legado 'Cronograma encerrado' ausente)
          grep -qF "if(isTaskCompleted(t))return {key:'concluido',color:'#34D399',label:'Concluído final'," "$S"
          grep -qF "sub:'O cliente aprovou a versão final. Fluxo concluído.'," "$S"
          grep -qF "next:'Nenhuma pendência.'," "$S"
          if grep -qF "sub:'O cliente aprovou a versão final. Cronograma encerrado.'," "$S"; then echo "::error::detailState legado (Cronograma encerrado) ainda presente"; exit 1; fi
          # E3 openProductionModal guard
          grep -qF "if(isTaskCompleted(t)){flashToast('Esta tarefa já foi concluída e não pode ser reenviada.');return;} // F3.5.6A-H16: BLOQUEIO FUNCIONAL pós-conclusão — ZERO write" "$S"
          # E4 openSendClientModal guard ANTES de ensureReviewToken
          grep -qF "if(_tc&&isTaskCompleted(_tc)){flashToast('Esta tarefa já foi concluída e não pode ser reenviada.');return;} }" "$S"
          # E5 Fase do cliente DISPLAY-ONLY
          grep -qF "const phUi=isTaskCompleted(t)?{l:'Concluída',c:'#10B981'}:" "$S"
          # E6 carimbo do marco FINAL pela FONTE REAL (e ausência do fallback legado só-doneAt)
          grep -qF "carimbo do marco FINAL a partir da FONTE REAL" "$S"
          grep -qF "if(_crr&&_crr.decision==='approved'&&Number(_crr.decisionAt)>0){ _fat=Number(_crr.decisionAt);" "$S"
          grep -qF "else if(Number(t.clientFinalApprovedAt)>0){ _fat=Number(t.clientFinalApprovedAt);" "$S"
          if grep -qF "if(m.key==='concluido'&&!at&&finalOk) at=t.doneAt||null;" "$S"; then echo "::error::E6 fallback legado (só-doneAt) ainda presente"; exit 1; fi
          # E4 guard ANTES de ensureReviewToken (ordem no corpo da função)
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const a=s.indexOf('async function openSendClientModal');const g=s.indexOf('if(_tc&&isTaskCompleted(_tc)){flashToast',a);const e=s.indexOf('ensureReviewToken(',a);if(!(a>=0&&g>a&&e>g)){console.error('E4: guard nao precede ensureReviewToken( — g='+g+' e='+e);process.exit(1);}console.log('E4 ordem OK');"
          echo "MARCADORES H16 (E1..E6): VERIFIED."
      - name: "Gate isFullyComplete INALTERADO (guardas duras intactas; SEM marcador H16) + sem clamp geral"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const a=s.indexOf('function isFullyComplete(t){');const b=s.indexOf('}',s.indexOf('return !!(t.finalApprovalCompleted',a));const body=s.slice(a,b+1);if(!/if\(pendingProduction\(t\)\)return false;/.test(body)||!/if\(pendingStory\(t\)\)return false;/.test(body)){console.error('isFullyComplete: guardas duras ausentes');process.exit(1);}if(body.includes('F3.5.6A-H16')){console.error('isFullyComplete alterado por H16 — proibido');process.exit(1);}console.log('isFullyComplete INALTERADO');"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');if(/for\s*\([^)]*\)\s*\{[^}]*\bdone\s*=\s*true/.test(s)||/milestones\.forEach\([^)]*done\s*=\s*true/.test(s)){console.error('clamp geral detectado — proibido');process.exit(1);}console.log('sem clamp geral');"
          # clientApprovalPhaseOf canônico intacto (retorna 'final' por finalApprovalCompleted; SEM marcador H16 dentro da função)
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const a=s.indexOf('function clientApprovalPhaseOf(t)');const b=s.indexOf('}',s.indexOf('return',a));const body=s.slice(a,b+1);if(!/finalApprovalCompleted===true/.test(body)){console.error('clientApprovalPhaseOf: ramo final ausente');process.exit(1);}if(body.includes('F3.5.6A-H16')){console.error('clientApprovalPhaseOf mutado por H16 — proibido');process.exit(1);}console.log('clientApprovalPhaseOf canonico intacto');"
          echo "isFullyComplete/clientApprovalPhase canônicos: PRESERVED."
      - name: "Gate MARCADORES herdados H15/H14/H13 INALTERADOS no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -qF "case 'aguardando_final':    return 'Envio final confirmado. Próxima etapa: aguardar a aprovação final do cliente.';" "$S"
          grep -qF "key:'aguardando_legenda',label:'Aguardando legenda / posts',    done:!!(prodOk||resent)," "$S"
          grep -qF "if(m.key==='concluido'&&state==='current') dispLabel='Aguardando aprovação final';" "$S"
          grep -qF "return !!v && keys.indexOf(v)>=0;" "$S"
          grep -qF "else if(m.key==='enviado_final'){ const r=wfLatestRound(t,'captions');" "$S"
          grep -qF "const resent=flowSentToClientSignal(t)||finalOk;" "$S"
          grep -qF "if(wp==='captions_waiting_client')return true;" "$S"
          grep -q 'legacyCursor' dist/main/workflowNotifier.js
          echo "MARCADORES herdados H15/H14/H13: VERIFIED."
      - name: "Gate SUÍTES H16 (nova RED→GREEN) + H15 + H14 + H13 + H12 + H10 + H8 + PIN F3.5.6A + golden master F3.4.4 + H2 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356ah16-final-completed-precedence.test.mjs
          node scripts/f356ah15-nextaction-final-text.test.mjs
          node scripts/f356ah14-timeline-step7-final-wait.test.mjs
          node scripts/f356ah13-timeline-preenvio.test.mjs
          node scripts/f356ah12-final-state-premature.test.mjs
          node scripts/f356ah10-team-session-recovery.test.mjs
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.242 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.242 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.242 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.242 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.241 (50595ca); src/main INALTERADO; slaRules byte-idêntico; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_241_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.241 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah16\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f356ah16-final-completed-precedence\.test\.mjs$|desktop/scripts/(f354p-sla-decision-actions|f354vh1-session-persistence|f354wh2-immediate-notification-sound|f355a-integration|f355ah1-internal-notes|f355b-agenda-premium|f355c-script-quantity-rich-editor|f355d-cron-quantity-universal-paste|f355e-retire-modules-premium-notifications|f355eh2-reference-notification|f355eh3-global-notification-visibility|f355eh4-grouped-notification-handoff|f356a-workflow-orchestration|f356ah2-client-approvals|f356ah3-single-source-sent-state|f356ah8-durable-diagnostic|f356ah8-honest-timeline|f356ah10-team-session-recovery|f356ah12-final-state-premature|f356ah13-timeline-preenvio|f356ah14-timeline-step7-final-wait|f356ah15-nextaction-final-text)\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H16: $BAD"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_241_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H16 não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_241_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H16 altera SOMENTE o renderer index.html"; exit 1; }
          git diff --quiet "$BASE_241_SHA"..HEAD -- desktop/src/main/slaRules.js || { echo "::error::slaRules.js alterado (paridade golden master exige byte-idêntico)"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H16: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.241; slaRules INALTERADO; infra 1.0.228 congelada)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão 1.0.242 + marcadores H16 (E1..E6) + H15/H14/H13 preservados no app.asar"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.242') process.exit(1);"
          I=asar-x/src/renderer/index.html
          # H16 (E1..E6 presentes; legados ausentes)
          grep -qF "if(isTaskCompleted(t))return 'concluido';                             // F3.5.6A-H16: conclusão final tem PRECEDÊNCIA" "$I"
          grep -qF "if(isTaskCompleted(t))return {key:'concluido',color:'#34D399',label:'Concluído final'," "$I"
          grep -qF "next:'Nenhuma pendência.'," "$I"
          grep -qF "if(isTaskCompleted(t)){flashToast('Esta tarefa já foi concluída e não pode ser reenviada.');return;} // F3.5.6A-H16: BLOQUEIO FUNCIONAL pós-conclusão — ZERO write" "$I"
          grep -qF "if(_tc&&isTaskCompleted(_tc)){flashToast('Esta tarefa já foi concluída e não pode ser reenviada.');return;} }" "$I"
          grep -qF "const phUi=isTaskCompleted(t)?{l:'Concluída',c:'#10B981'}:" "$I"
          grep -qF "carimbo do marco FINAL a partir da FONTE REAL" "$I"
          if grep -qF "if(m.key==='concluido'&&!at&&finalOk) at=t.doneAt||null;" "$I"; then echo "::error::E6 fallback legado no app.asar"; exit 1; fi
          if grep -qF "sub:'O cliente aprovou a versão final. Cronograma encerrado.'," "$I"; then echo "::error::detailState legado no app.asar"; exit 1; fi
          # herdados H15/H14/H13
          grep -qF "case 'aguardando_final':    return 'Envio final confirmado. Próxima etapa: aguardar a aprovação final do cliente.';" "$I"
          grep -qF "key:'aguardando_legenda',label:'Aguardando legenda / posts',    done:!!(prodOk||resent)," "$I"
          grep -qF "if(m.key==='concluido'&&state==='current') dispLabel='Aguardando aprovação final';" "$I"
          grep -qF "const resent=flowSentToClientSignal(t)||finalOk;" "$I"
          grep -q 'function flowCanonicalSentSignal' asar-x/dist/main/slaRules.js
          grep -q 'legacyCursor' asar-x/dist/main/workflowNotifier.js
          F356AH16_SRC=asar-x/src/renderer/index.html F356AH16_PKG=asar-x/package.json node scripts/f356ah16-final-completed-precedence.test.mjs
          F356AH15_SRC=asar-x/src/renderer/index.html F356AH15_PKG=asar-x/package.json node scripts/f356ah15-nextaction-final-text.test.mjs
          F356AH14_SRC=asar-x/src/renderer/index.html F356AH14_PKG=asar-x/package.json node scripts/f356ah14-timeline-step7-final-wait.test.mjs
          F356AH12_SRC=asar-x/src/renderer/index.html F356AH12_PKG=asar-x/package.json node scripts/f356ah12-final-state-premature.test.mjs
          echo "GATE F3.5.6A-H16 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.242"; echo "rotulo      : 1.0.242-f356ah16-final-completed-precedence (conclusao final com precedencia + bloqueio de writes pos-conclusao — pelo updater interno)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.241 (50595ca). BASELINE FISICA 1.0.228 (3f0d0af1). ROLLBACK imediato 1.0.228."; echo "origem      : F3.5.6A-H16 — pos-conclusao inconsistente na tela Detalhes (badge/HERO/status op/botoes/OPERACAO stale apesar de finalApprovalCompleted). CORRECAO renderer-only (index.html): operationalCol/detailState com PRECEDENCIA isTaskCompleted; BLOQUEIO de writes pos-conclusao (openProductionModal/openSendClientModal); Fase do cliente DISPLAY-ONLY 'Concluida'; timeline marco final carimbado pela FONTE REAL. isFullyComplete NAO alterado; slaRules.js e Worker V64.61 INALTERADOS. MUDANCA: SOMENTE index.html."; echo "distribuicao: pelo updater interno; publicacao no Latest ocorre no workflow desktop-release-f356ah16.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
