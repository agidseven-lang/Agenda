# Teste REAL do backend de reset (port do GitLab test_password_reset_backend).
# PREPARADO — execucao SOMENTE manual. READ-ONLY: resolve URL real, faz curl,
# NAO faz deploy. Aprova HTTP=200 ok:true; delivered=true = sucesso;
# delivered=false = warning (nao bloqueia); 403/404/500 = falha.
name: "[manual] Password Reset Backend Test"

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "E-mail de teste (cadastrado em users/* para delivered=true). Vazio = secret/idseven@idseven.com.br"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: "agenda-id-seven"
    steps:
      - name: Auth gcloud
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: GOOGLE_APPLICATION_CREDENTIALS_JSON ausente."; exit 1; }
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null

      - name: Resolver URL real + curl + veredito
        env:
          PASSWORD_RESET_TEST_EMAIL: ${{ secrets.PASSWORD_RESET_TEST_EMAIL }}
        run: |
          set -e
          REQ=$(gcloud functions describe requestPasswordResetHttp --gen2 --region=us-central1 --project="$GCP_PROJECT" --format='value(serviceConfig.uri)' 2>/dev/null || true)
          if [ -z "$REQ" ]; then echo "::error:: requestPasswordResetHttp sem URI (nao publicada)."; exit 1; fi
          echo "URL real: $REQ"
          TEST_EMAIL="${{ github.event.inputs.test_email }}"
          [ -n "$TEST_EMAIL" ] || TEST_EMAIL="${PASSWORD_RESET_TEST_EMAIL:-idseven@idseven.com.br}"
          HTTP=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$REQ" -H "Content-Type: application/json" --data "{\"email\":\"$TEST_EMAIL\"}" || echo "000")
          echo "HTTP=$HTTP"; echo "corpo:"; cat /tmp/resp.json | sed 's/^/  /'; echo ""
          OK=$(jq -r '.ok // false' /tmp/resp.json 2>/dev/null || echo false)
          DELIVERED=$(jq -r '.delivered // empty' /tmp/resp.json 2>/dev/null || true)
          if [ "$HTTP" = "200" ] && [ "$OK" = "true" ]; then
            if [ "$DELIVERED" = "true" ]; then
              echo "OK — email-sent confirmado pelo response body (delivered=true)."
            elif [ "$DELIVERED" = "false" ]; then
              echo "::warning:: Backend acessivel (200 ok:true), mas delivered=false. Verifique remetente/dominio no Resend ou use e-mail cadastrado. NAO bloqueia."
            else
              echo "Backend acessivel (200 ok:true)."
            fi
            exit 0
          fi
          if [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
            echo "::error:: HTTP=$HTTP — falta allUsers run.invoker (ou org policy)."; exit 1
          fi
          echo "::error:: HTTP=$HTTP / ok=$OK — endpoint nao respondeu 200 ok:true (404 nao existe / 500 crash)."; exit 1

      - name: Limpeza SA
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" 2>/dev/null || true
