# =====================================================================
# [manual] F3.5.3 — Publicacao da RELEASE ESTAVEL Desktop 1.0.192 (Edicao de Cards · proporcao e alinhamento de quadro e card; Latest)
# ---------------------------------------------------------------------
# Publica a release ESTAVEL de PRODUCAO 1.0.192 (canal latest) = 1.0.191 + F3.5.3 (isolado ao setor
# edicao_cards): (1) coluna de ALTURA NATURAL (.kbv2-board--cards) com "Adicionar tarefa" logo apos o
# ultimo card; (2) Legenda/Observacoes no card (2 linhas, so quando preenchidos) via cardsFieldOf, Tema
# real; (3) movimentacao BIDIRECIONAL do designer atribuido (moveStatus sincroniza status nos 4 estados;
# designerMoveOpts com Concluido->Revisao). Revertendo as 6 edicoes, o index.html volta BYTE-A-BYTE a
# 1.0.191. cardsRules.js/slaRules.js/Card Premium/notificacoes T-30/T-10/datas inicio+termino/demais
# setores: BYTE-IDENTICOS a 1.0.191. Usa EXCLUSIVAMENTE os BYTES do run de build F3.5.3 (gated, verde).
# Substitui a 1.0.191 como Latest (SEM downgrade: 1.0.192 > 1.0.191 no updater). NAO RECOMPILA: baixa os
# 2 artifacts e publica os MESMOS bytes. TUDO PINADO (preenchido apos o build verde): run id, digests dos
# artifacts, 5 hashes SHA-256, tag e titulo. ESCRITAS (tag + release + assets + Latest) via TOKEN
# TEMPORARIO do GitHub App "Agenda ID Seven Release Bot" (expira sozinho) — NENHUM RELEASE_PAT, NENHUM
# GITHUB_TOKEN de escrita. Execucao SO manual, autorizada pelo literal PUBLICAR-DESKTOP-1.0.192-STABLE.
# NAO builda/deploya/toca Firebase/Worker/Rules/Android/portal/Cloud Run; NAO mexe em releases/tags
# antigas (1.0.191/1.0.189/1.0.187).
# =====================================================================
name: "[manual] F3.5.3 Desktop Stable Release — 1.0.192 (Latest, notificacoes duraveis + colagem na Legenda)"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.192-STABLE para autorizar"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM (preenchida apos o build F3.5.3 verde; placeholders bloqueiam a publicacao) ──
      RUN_ID: "30476742495"
      STABLE_SHA: "fdd684261f59f7d288c6d4197d7ecd0050ce0bb5"
      DESK_BRANCH: "desktop/f353-durable-realtime-notifications-paste-recovery"
      TAG: "v1.0.192"
      TITLE: "Agenda ID Seven Desktop 1.0.192 — Produção Estável (Notificações duráveis em tempo real + colagem na Legenda)"
      ART_INST: "agenda-id-seven-desktop-1.0.192-installer"
      ART_INST_DIGEST: "sha256:6aa1d7aba644a97f4b53b066d3621e45d6355595abe8923593011a6fb6754559"
      ART_META: "agenda-id-seven-desktop-1.0.192-updatemeta"
      ART_META_DIGEST: "sha256:598efc535d368e3144b09ec2b4559a51176c2d9b5943d0bff3f459de0fca8c74"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.192-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.192-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.192-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      SBOM_NAME: "SBOM-cyclonedx.json"
      EXP_EXE: "97ea45b8f2f046c169728397a05748719bd73abc0ebeed5846c2e79591abfdb4"
      EXP_MSI: "424c0f7818f69ad0ad649f02e2217a38936486d48c2641a79bed8a906435ab64"
      EXP_LY: "2ff1f4a20ce481f74f9b350a306d61eaad07fad823e2c082bb697eeed12b38ce"
      EXP_BM: "7d64e795086e2aaec36fcfa0b9347a2e8b181418bf430cb7f8ce5ba91c529f6f"
      EXP_SBOM: "7bde47f831e7c243665bd620b160e2b3e09948bb8a3368ec4c725516dd16ea46"
      PROD_PREV_TAG: "v1.0.191"
      PROD_ROLLBACK_TAG: "v1.0.191"
      PROD_HIST_TAG: "v1.0.190"
    steps:
      - name: "Gate 0 — pinagem preenchida (bloqueia publicacao enquanto houver placeholder)"
        run: |
          set -euo pipefail
          for v in "$RUN_ID" "$ART_INST_DIGEST" "$ART_META_DIGEST" "$EXP_EXE" "$EXP_MSI" "$EXP_LY" "$EXP_BM" "$EXP_SBOM"; do
            case "$v" in __FILL_*__) echo "::error::pinagem incompleta ($v) — preencha run/digests/hashes apos o build verde. NADA publicado."; exit 1;; esac
          done
          echo "OK: pinagem completa"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "PUBLICAR-DESKTOP-1.0.192-STABLE" ] || { echo "::error::confirmacao invalida — nada publicado"; exit 1; }
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run de build completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }

      - name: "Gate 3 — STABLE_SHA e commit real e pertence a linhagem do candidato (alvo da tag)"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$STABLE_SHA" --jq '.sha' >/dev/null || { echo "::error::commit $STABLE_SHA nao existe"; exit 1; }
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::$STABLE_SHA fora da linhagem do candidato ($CMP)"; exit 1; }

      - name: "Gate 4 — release NAO existe; tag so pode preexistir apontando para STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" "$SBOM_NAME" SHA256SUMS; do
            test -f "pacote/$f" || { echo "::error::asset ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 6 — 5 hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["$SBOM_NAME"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.192" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.192"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml nao referencia o EXE"; exit 1; }
          grep -Eq '^channel +: latest$' pacote/VERSAO-DESKTOP.txt || { echo "::error::channel != latest"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.192/EXE) + channel=latest"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.192 — Produção Estável (Notificações duráveis em tempo real + colagem na Legenda)

          Sucessora da 1.0.191 como versão oficial (Latest), canal ESTÁVEL (latest). Atualização
          EXCLUSIVAMENTE pelo ATUALIZADOR INTERNO do app (Configurações → Atualizações → Verificar →
          Baixar → Instalar e reiniciar). Não é necessário baixar nada manualmente. NÃO é downgrade:
          1.0.192 é uma versão nova e superior à 1.0.191 no atualizador.

          O QUE MUDA vs 1.0.191 (F3.5.3 — incidente real de notificações + colagem)
          - NOTIFICAÇÕES IMEDIATAS GERAIS para TODOS os usuários ativos (ator incluído): atribuição,
            reatribuição, movimentação (todas as transições), conclusão e reabertura aparecem no canto
            inferior direito com o app aberto, minimizado ou fechado no X/bandeja. Mensagens oficiais:
            "{ATOR} atribuiu/moveu/concluiu/reabriu ‘{TAREFA}’ …" com nomes reais; clique abre a tarefa.
          - RECUPERAÇÃO DURÁVEL: com o computador desligado, os eventos perdidos são recuperados no
            próximo login (backlog ordenado do mais antigo ao mais novo; retenção de 30 dias), sem
            duplicação — cursor por usuário, recibos por usuário+dispositivo+evento, deviceId persistente.
          - PROVA DE EXIBIÇÃO DO TOAST: com a janela aberta, o toast agora confirma o render (ACK);
            sem confirmação, a entrega cai no fallback (janela premium/nativa) — nada some em silêncio.
          - COLAGEM NA LEGENDA (Setores → Edição de Cards → Nova tarefa): Ctrl+V, Shift+Insert e menu
            de contexto (Colar/Copiar/Recortar) passam a funcionar de forma determinística; texto simples,
            parágrafos/acentos/emojis preservados; nunca executa HTML.

          PRESERVAÇÃO (zero regressão vs 1.0.191)
          - T-30 AMARELA / T-10 VERMELHA (Categoria B): SOMENTE o Designer atribuído — slaRules.js,
            cardsRules.js, slaScheduler.ts, bgNotify.ts, tray.ts, updaterService.ts, firebase.ts e
            reminder.ts BYTE-IDÊNTICOS à 1.0.191 (provado por gate no build).
          - Card Premium do WhatsApp, geração/persistência de links e tokens, Open Graph, Cronograma,
            Roteiro, aprovação, portal do cliente, Worker J6, Agenda, Kanban, layout de Edição de Cards,
            tray/X e atualizador interno: intocados (regiões fora do diff, provado por gate).
            Android/Firestore Rules/Functions/Cloud Run: INTOCADOS.
          - Rollback: 1.0.191 PRESERVADA (re-marcar Latest); 1.0.190/1.0.189 preservadas.

          UPDATER (produção): allowPrerelease=false, channel="latest", allowDowngrade=false (no app.asar).
          Metadata do MESMO build: latest.yml + <exe>.blockmap; app-update.yml só dentro do pacote.

          Procedência: run de build F3.5.3 (success); fonte desktop/f353-durable-realtime-notifications-paste-recovery
          @ commit pinado fdd6842 (1.0.191 OFICIAL + F3.5.3, provado pelos gates de byte-identidade).
          Mesmos bytes; sem recompilar. Confira o SHA-256 (SHA256SUMS anexado; sha256sum -c SHA256SUMS).
          NOTAS

      - name: "Criar tag pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release ESTAVEL (prerelease=false, latest=true) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$BM_NAME" "pacote/$LY_NAME" "pacote/$SBOM_NAME" "pacote/SHA256SUMS"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (Latest=1.0.192; 1.0.191/1.0.189/1.0.187 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.192 ESTAVEL PUBLICADA e Latest; 1.0.191/1.0.189/1.0.187 preservadas ====="

      - name: "Smoke — re-baixar EXE + latest.yml + SBOM e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$LY_NAME" -p "$SBOM_NAME" -D smoke
          [ "$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$LY_NAME" | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::smoke latest.yml hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$SBOM_NAME" | awk '{print $1}')" = "$EXP_SBOM" ] || { echo "::error::smoke SBOM hash divergente"; exit 1; }
          echo "SMOKE OK: EXE + latest.yml + SBOM publicados conferem byte a byte."
