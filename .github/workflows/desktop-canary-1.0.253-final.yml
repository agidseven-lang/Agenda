# =====================================================================
# [manual] I7.21.3 - PUBLIC UPDATER CANARY (Desktop 1.0.253 -> feed PUBLICO -> 1.0.253)
# ---------------------------------------------------------------------
# Espelha o precedente canonico imediato (desktop-canary-1.0.253-final.yml,
# ciclo publico do updater 251->252, run 33279331067 PASS) com o delta da
# linha 1.0.253 + SESSION B grafada VERBATIM do Session B provado do build
# canonico 33508229120 (desktop-build-1.0.253-final.yml corrigido, 18/18):
# HOJE ACTIONABILITY H1-H18 (urgent row -> Detail via click/Enter/Espaco com
# Tab REAL; KPI Tarefas -> Meu quadro com paridade por IDs em ADMIN e
# OPERACIONAL; KPI Hoje -> Agenda; KPI Equipe) + OPTION B SB/CN/NAV + freeze
# T/D/C/Hub + E1 evidence manifest (SCREENSHOT_NOT_LOGIN por captura) +
# SB_sidebarFits1366 cross-platform. O run falho 33507184306 (classe C
# harness) NAO e fonte de nada.
#
# CONSUMIDOR PURO DA PRODUCAO PUBLICA. Esta fase NAO:
#   - cria tag / cria release / altera Latest / altera latest.yml / publica asset
#   - executa desktop-release / gera novo build do produto / seta RC_RELEASE_GO
#   - reescreve app-update.yml / usa feed local ou mock / instala 1.0.253 direto
# Usa EXCLUSIVAMENTE os Releases publicos v1.0.253 e v1.0.253 ja existentes e o
# app-update.yml REAL embarcado no instalador publico 1.0.253.
#
# FAIL-CLOSED: aborta antes de instalar se qualquer pre-condicao publica
# estiver incorreta. PowerShell 5.1: strings/scripts criticos 100% ASCII.
# Execucao manual apenas.
# =====================================================================
name: "[manual] I7.21.3 - Public Updater Canary 1.0.253 -> 1.0.253"
"on":
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OWNER_REPO: "agidseven-lang/Agenda"
  PRODUCT_SOURCE_SHA: "5dac060ad612d4acbe24d389a00f23c51721c527"
  EXPECTED_VERSION: "1.0.253"
  BASELINE_VERSION: "1.0.252"
  LATEST_TAG: "v1.0.253"
  BASELINE_TAG: "v1.0.252"
  EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.253-x64.exe"
  BASELINE_EXE: "Agenda-ID-Seven-Desktop-1.0.252-x64.exe"
  APPROVED_EXE_SHA256: "1c04ca4d37e2d9d09ab11b1745d2f5cc9aed9fdc5d34a3c5faf9a7af6f103976"

jobs:
  public-updater-canary:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: "Git sem conversao CRLF"
        run: git config --global core.autocrlf false

      - name: "GATE — PRE-CONDICOES PUBLICAS (fail-closed, antes de instalar)"
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary"
          api() { curl -sSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_API_TOKEN" "$@"; }
          LT=$(api "https://api.github.com/repos/$OWNER_REPO/releases/latest" | jq -r .tag_name)
          [ "$LT" = "$LATEST_TAG" ] || { echo "::error::Latest publico=$LT != $LATEST_TAG"; exit 1; }
          TS=$(api "https://api.github.com/repos/$OWNER_REPO/commits/$LATEST_TAG" | jq -r .sha)
          [ "$TS" = "$PRODUCT_SOURCE_SHA" ] || { echo "::error::tag $LATEST_TAG sha=$TS != $PRODUCT_SOURCE_SHA"; exit 1; }
          for T in "$BASELINE_TAG" "$LATEST_TAG"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_API_TOKEN" "https://api.github.com/repos/$OWNER_REPO/releases/tags/$T")
            [ "$code" = "200" ] || { echo "::error::release $T ausente (http $code)"; exit 1; }
          done
          FEED_URL="https://github.com/$OWNER_REPO/releases/download/$LATEST_TAG/latest.yml"
          curl -sSL -o "$RUNNER_TEMP/canary/public-latest.yml" "$FEED_URL"
          grep -q "^version: $EXPECTED_VERSION$" "$RUNNER_TEMP/canary/public-latest.yml" || { echo "::error::latest.yml publico version != $EXPECTED_VERSION"; exit 1; }
          FY_SHA=$(sha256sum "$RUNNER_TEMP/canary/public-latest.yml" | awk '{print $1}')
          jq -n --arg url "$FEED_URL" --arg ver "$EXPECTED_VERSION" --arg sha "$FY_SHA" \
            --arg latest "$LT" --arg tagsha "$TS" \
            '{feedType:"PUBLIC GITHUB RELEASE (provider github, channel latest)", publicLatestYmlUrl:$url, latestYmlVersion:$ver, latestYmlSha256:$sha, repoLatestTag:$latest, tagCommitSha:$tagsha, localhost:false, mock:false}' \
            > "$RUNNER_TEMP/canary/canary253-public-feed-proof.json"
          {
            echo "== I7.21.3 PRECONDITIONS =="
            echo "PUBLIC LATEST TAG: $LT"
            echo "TAG $LATEST_TAG -> SHA: $TS (== $PRODUCT_SOURCE_SHA)"
            echo "RELEASE $BASELINE_TAG EXISTS: YES (rollback preservado)"
            echo "RELEASE $LATEST_TAG EXISTS: YES"
            echo "PUBLIC latest.yml VERSION: $EXPECTED_VERSION (sha256=$FY_SHA)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "AUDITORIA BYTE DO FEED PUBLICO 1.0.253 (latest.yml path/size/sha512 + sha256==build aprovado)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          curl -sSL -o public-253.exe "https://github.com/$OWNER_REPO/releases/download/$LATEST_TAG/$EXE_NAME"
          grep -q "url: $EXE_NAME" public-latest.yml || { echo "::error::latest.yml path != $EXE_NAME"; exit 1; }
          SIZE=$(stat -c%s public-253.exe)
          grep -q "size: $SIZE" public-latest.yml || { echo "::error::latest.yml size != $SIZE"; exit 1; }
          SHA512=$(openssl dgst -sha512 -binary public-253.exe | base64 -w0)
          grep -q "$SHA512" public-latest.yml || { echo "::error::latest.yml sha512 nao bate com o installer publico"; exit 1; }
          S256=$(sha256sum public-253.exe | awk '{print $1}')
          [ "$S256" = "$APPROVED_EXE_SHA256" ] || { echo "::error::sha256 do exe publico=$S256 != build aprovado $APPROVED_EXE_SHA256"; exit 1; }
          echo "PUBLIC FEED BYTE AUDIT OK (size=$SIZE sha256=$S256 sha512=match)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "BASELINE PUBLICA v1.0.252 — download + verificacao SHA256SUMS"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          BASE="https://github.com/$OWNER_REPO/releases/download/$BASELINE_TAG"
          curl -sSL -o baseline.exe "$BASE/$BASELINE_EXE"
          curl -sSL -o baseline-SHA256SUMS "$BASE/SHA256SUMS"
          EXP=$(grep "$BASELINE_EXE\$" baseline-SHA256SUMS | awk '{print $1}')
          GOT=$(sha256sum baseline.exe | awk '{print $1}')
          [ -n "$EXP" ] && [ "$EXP" = "$GOT" ] || { echo "::error::baseline 1.0.252 sha256 nao confere exp=$EXP got=$GOT"; exit 1; }
          echo "BASELINE PUBLIC ASSET: $BASELINE_EXE (sha256=$GOT)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "INSTALAR 1.0.252 (/S) + CONFIRMAR FEED PUBLICO REAL (app-update.yml embarcado)"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:RUNNER_TEMP\canary\baseline.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "baseline install exit $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 3
          $dir = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { Test-Path (Join-Path $_.FullName "Agenda ID Seven Desktop.exe") } | Select-Object -First 1
          if (-not $dir) { Write-Error "baseline 1.0.252 nao instalada"; exit 1 }
          "INSTALL_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "baseline 1.0.252 instalada: $($dir.FullName)"
          $au = Join-Path $dir.FullName "resources\app-update.yml"
          if (-not (Test-Path $au)) { Write-Error "app-update.yml ausente no pacote instalado"; exit 1 }
          Copy-Item $au "$env:RUNNER_TEMP\canary\installed-app-update.yml"
          $auTxt = Get-Content $au -Raw
          Write-Host "---- app-update.yml (instalado) ----"; Write-Host $auTxt
          if ($auTxt -notmatch "provider:\s*github")      { Write-Error "app-update.yml nao e provider github"; exit 1 }
          if ($auTxt -notmatch "owner:\s*agidseven-lang") { Write-Error "app-update.yml owner incorreto"; exit 1 }
          if ($auTxt -notmatch "repo:\s*Agenda")          { Write-Error "app-update.yml repo incorreto"; exit 1 }
          if ($auTxt -match "127\.0\.0\.1" -or $auTxt -match "localhost") { Write-Error "feed LOCAL detectado - proibido no canary publico"; exit 1 }
          "UPDATE FEED TYPE: PUBLIC GITHUB RELEASE (github/agidseven-lang/Agenda, channel latest; sem localhost)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: "Preparar harness (Playwright + @electron/asar; NENHUM code de produto)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright@1.47.2 @electron/asar --no-audit --no-fund

      - name: "SESSION A — 1.0.252 REAL: baseline funcional + check(feed publico) -> 1.0.253 -> download(sha512) -> install /S"
        timeout-minutes: 20
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          cat > canary-a.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const out = { g: {} }; const g = out.g;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const app = await _electron.launch({ executablePath: exe, args: [] });
          const pg = await app.firstWindow({ timeout: 45000 });
          const perr = []; pg.on('pageerror', e => perr.push(String(e).slice(0, 160)));
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          try { await app.evaluate(({ BrowserWindow }) => { const w = BrowserWindow.getAllWindows()[0]; if (w) w.setContentSize(1920, 1080); }); } catch (_) {}
          await pg.waitForTimeout(800);
          const before = await pg.evaluate(() => ({
            ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null,
            upd: !!(window.desktopAPI && window.desktopAPI.updater),
            innerW: window.innerWidth,
            isDesktop: (typeof isDesktop === 'function') ? isDesktop() : null,
            white: (document.body.innerText || '').trim().length < 2
          }));
          const st = () => pg.evaluate(() => window.desktopAPI.updater.getState());
          const st0 = before.upd ? await st() : null;
          out.before = { ...before, st: st0 };
          g.a1_baselineIs252 = before.ver === '1.0.252';
          g.a2_updaterApi = before.upd === true;
          g.a3_appLaunch = before.white === false;
          g.a4_installedVersion252 = !!st0 && st0.installedVersion === '1.0.252';
          g.a5_channelLatest = !!st0 && st0.channel === 'latest';
          g.a6_allowPrereleaseFalse = !!st0 && st0.allowPrerelease === false;
          g.a7_desktopViewport = before.innerW >= 1900 && before.isDesktop === true;
          // baseline funcional minima (origem real do upgrade): light UI + sidebar + board
          const base = await pg.evaluate(() => {
            try {
              state.user = { id: 'carlos', name: 'Carlos Eduardo', role: 'Social Media', admin: true };
              state.users = [state.user];
              document.body.classList.add('desktop', 'authed', 'light-ui');
              const asp = document.getElementById('authSplash'); if (asp) asp.style.display = 'none';
              const lg = document.getElementById('login'); if (lg) lg.classList.add('hidden');
              const ap = document.getElementById('app'); if (ap) ap.style.display = 'flex';
              state.tasks = [{ id: 'b1', title: 'Baseline 252', client: 'QA', sector: 'edicao_cards', by: 'carlos', assigneeId: 'carlos', status: 'afazer', dueDate: '2026-08-30' }];
              state.tab = 'tarefas'; state.personBoard = 'carlos'; render();
            } catch (e) { return { err: String(e) }; }
            return {
              lightUi: document.body.classList.contains('light-ui'),
              sidebar: document.querySelectorAll('.nav .sb-item').length >= 5,
              more: !!document.querySelector('.nav .sb-more>summary'),
              newTask: !!document.querySelector('.new-task-btn'),
              client: !!document.querySelector('.nav [data-flowclient]'),
              lanes: document.querySelectorAll('.kbv2-column').length,
              cards: document.querySelectorAll('.kbv2-card').length
            };
          });
          out.baseline = base;
          g.a8_baselineLightUi = base.lightUi === true;
          g.a9_baselineSidebar = base.sidebar === true && base.more === true && base.newTask === true && base.client === true;
          g.a10_baselineBoard = base.lanes === 4 && base.cards === 1;
          // CHECK contra o FEED PUBLICO real (app-update.yml embarcado = github provider)
          const poll = async (want, ms) => { const t0 = Date.now(); for (;;) { const s = await st(); if (want.includes(s.status)) return s; if (s.status === 'error') return s; if (Date.now() - t0 > ms) return s; await sleep(500); } };
          await pg.evaluate(() => { window.desktopAPI.updater.check(); });
          let s = await poll(['update_available', 'up_to_date', 'error'], 60000);
          out.checkResult = { status: s.status, availableVersion: s.availableVersion, error: s.error };
          g.b1_updateAvailable = s.status === 'update_available';
          g.b2_availableIs253 = s.availableVersion === '1.0.253';
          // PROVA autoDownload=false (comportamento real aprovado): sem download(), NAO progride
          await sleep(4000);
          const sIdle = await st();
          out.afterCheckIdle = { status: sIdle.status, downloaded: sIdle.downloaded };
          g.b3_noAutoDownloadBeforeAction = sIdle.status === 'update_available' && sIdle.downloaded === false;
          // DOWNLOAD explicito (lib valida sha512 do latest.yml PUBLICO contra o installer PUBLICO)
          await pg.evaluate(() => { window.desktopAPI.updater.download(); });
          { const t0 = Date.now(); for (;;) { const x = await st(); if (x.status === 'downloaded' || x.status === 'error') { s = x; break; } if (Date.now() - t0 > 240000) { s = x; break; } await sleep(500); } }
          out.downloadResult = { status: s.status, downloaded: s.downloaded, availableVersion: s.availableVersion, error: s.error };
          g.c1_downloadedSha512Valid = s.status === 'downloaded' && s.downloaded === true;
          // INSTALL silencioso /S (quitAndInstall(true,true)) - zero acao do usuario
          pg.evaluate(() => { window.desktopAPI.updater.installAndRestart(); }).catch(() => {});
          let closed = false;
          try { await Promise.race([new Promise(res => app.on('close', () => { closed = true; res(); })), sleep(30000)]); } catch (_) {}
          if (!closed) { try { const x = await st(); closed = (x.status === 'installing'); } catch (_) { closed = true; } }
          out.appClosedByUpdater = closed;
          g.d1_installTriggered = closed === true;
          g.p0_noPageErrorsA = perr.length === 0;
          out.pageErrors = perr;
          const fails = Object.entries(g).filter(([k, v]) => !v).map(([k]) => k);
          out.fails = fails;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/canary/canary253-sessionA-1.0.252.json', JSON.stringify(out, null, 1));
          console.log(JSON.stringify(out, null, 1));
          try { await Promise.race([app.close(), sleep(4000)]); } catch (_) {}
          if (fails.length) { console.error('FAILS A:', fails); }
          process.exit(fails.length ? 1 : 0);
          EOF
          node canary-a.mjs

      - name: "Confirmar UPGRADE instalado == 1.0.253 (asar) + sem instalador residual + REQUIRED_USER_INSTALL_ACTIONS=0"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $work = "$env:RUNNER_TEMP\canary"
          $asar = Join-Path $env:INSTALL_DIR "resources\app.asar"
          $deadline = (Get-Date).AddSeconds(240); $ok = $false; $ver = ""
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 4
            if (Test-Path $asar) {
              Push-Location $work
              try { $ver = (& node -e "const a=require('@electron/asar');process.stdout.write(JSON.parse(a.extractFile(process.argv[1],'package.json').toString('utf8')).version)" "$asar") } catch { $ver = "" }
              Pop-Location
              if ($ver -eq "1.0.253") { $ok = $true; break }
            }
          }
          if (-not $ok) { Write-Error "FAIL: asar instalado != 1.0.253 (got '$ver') - upgrade silencioso via feed publico nao concluiu"; exit 1 }
          Start-Sleep -Seconds 3
          $setup = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "*Setup*" -or $_.MainWindowTitle -like "*Instal*" }).Count
          if ($setup -ne 0) { Write-Error "FAIL: janela de instalador residual (update nao foi silencioso)"; exit 1 }
          Get-Process | Where-Object { $_.ProcessName -like "*Agenda*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          "INSTALL UPDATE RESULT: PASS (asar==1.0.253)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "REQUIRED_USER_INSTALL_ACTIONS: 0 (silencioso /S; sem wizard/UAC/residual)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: "SESSION B — 1.0.253 instalada: HOJE H1-H18 + OPTION B (SB/CN/NAV) + freeze T/D/C + Hub + E1 manifest + 1920/Win125/1366"
        timeout-minutes: 30
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canary"
          cat > canary-b.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const out = { g: {}, info: {} }; const g = out.g; const I = out.info;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const app = await _electron.launch({ executablePath: exe, args: [] });
          const pg = await app.firstWindow({ timeout: 45000 });
          const perr = []; pg.on('pageerror', e => perr.push(String(e).slice(0, 160)));
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          const a = await pg.evaluate(() => ({
            ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null,
            title: document.title,
            white: (document.body.innerText || '').trim().length < 2,
            loginPwd: !!document.querySelector('input[type="password"]')
          }));
          out.after = a;
          g.d1_versionIs253 = a.ver === '1.0.253' && a.title.includes('1.0.253');
          g.d2_noWhiteScreen = a.white === false;
          g.d0_loginSurface = a.loginPwd === true;
          try { await app.evaluate(({ BrowserWindow }) => { const w = BrowserWindow.getAllWindows()[0]; if (w) w.setContentSize(1920, 1080); }); } catch (_) {}
          await pg.waitForTimeout(800);
          // LICAO E1: suprimir reveals tardios de login durante a sessao de QA (registrado)
          await pg.evaluate(() => { window.__qaRevealSuppressed = []; window._revealLogin = function (r) { window.__qaRevealSuppressed.push(String(r || '')); }; });
          const D = n => { const d = new Date(Date.now() + n * 86400000); return d.toISOString().slice(0, 10); };
          await pg.evaluate(({ d0, d1, d2 }) => {
            state.user = { id: 'carlos', name: 'Carlos Eduardo', role: 'Social Media', admin: true };
            state.users = [state.user, { id: 'marina', name: 'Marina Klein', role: 'Designer' }, { id: 'helio', name: 'Helio Duarte', role: 'Designer' }, { id: 'bia', name: 'Bia Rocha', role: 'Social Media' }, { id: 'op1', name: 'Otavio Prado', role: 'Editor de video' }];
            document.body.classList.add('desktop', 'authed', 'light-ui');
            const asp = document.getElementById('authSplash'); if (asp) asp.style.display = 'none';
            const lg = document.getElementById('login'); if (lg) lg.classList.add('hidden');
            const ap = document.getElementById('app'); if (ap) ap.style.display = 'flex';
            state.tasks = [
              { id: 'k1', title: 'Post de Agenda Aberta - histeroscopias', client: 'Dra. Helita Freitas', sector: 'edicao_cards', by: 'carlos', assigneeId: 'carlos', status: 'afazer', dueDate: '2026-08-20', dueTime: '19:05', cardLegenda: 'Agenda aberta' },
              { id: 'k2', title: 'Edicao de videos - Agosto', client: 'Hospital Visao', sector: 'edicao_midia', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: d1, dueTime: '17:00', priority: true, videos: [{ tema: 'v1' }, { tema: 'v2' }, { tema: 'v3' }], checklist: [{ t: '1' }, { t: '2' }, { t: '3' }, { t: '4' }, { t: '5' }] },
              { id: 'k3', title: 'Reels de lancamento', client: 'Sunset Wear', sector: 'edicao_cards', by: 'marina', assigneeId: 'carlos', status: 'revisao', dueDate: d0, dueTime: '23:00' },
              { id: 'k4', title: 'Cronograma Setembro', client: 'Sunset Wear', sector: 'edicao_cards', by: 'carlos', assigneeId: null, status: 'concluido', dueDate: '2026-08-22' },
              { id: 'c1', title: 'Cronograma Setembro - Sunset Wear', client: 'Sunset Wear', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'afazer', dueDate: d2, dueTime: '10:00', cronContents: [{ tema: 'Tema 1' }, { tema: 'Tema 2' }, { tema: 'Tema 3' }] },
              { id: 'cB', title: 'Cronograma Outubro - Hospital Visao', client: 'Hospital Visao', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: d1, dueTime: '18:00', workflowPhase: 'captions_waiting_client', cronContents: [{ tema: 'Tema A' }, { tema: 'Tema B' }] },
              { id: 'cC', title: 'Cronograma Clinica Vida - ajustes', client: 'Clinica Vida', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: '2026-08-20', dueTime: '16:00', clientReview: { status: 'revisao', note: 'Trocar o tema 2.', at: Date.now() - 3600000, byName: 'Cliente' }, cronContents: [{ tema: 'Tema X' }] },
              { id: 'cD', title: 'Cronograma Agosto - Colegio Alfa', client: 'Colegio Alfa', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'concluido', dueDate: '2026-08-22', finalApprovalCompleted: true, clientReview: { status: 'aprovado', at: Date.now() - 7200000, byName: 'Cliente' }, cronContents: [{ tema: 'Tema 1' }] },
