# =====================================================================
# [manual] F3.3.20-B1.7-C — AUDITORIA READ-ONLY de Cloud Monitoring/Logging do emissor
# publico issueNotifPrefsToken (servico Cloud Run issuenotifprefstoken, us-central1).
# Autentica via Workload Identity Federation com a identidade dedicada de leitura
# monitoring-auditor (papeis monitoring.viewer + logging.viewer). SO descobre (read-only):
# canais, alert policies, descritores de metrica, metadados da function (gen2) + servico
# Cloud Run, e logs recentes filtrados ao proprio servico. workflow_dispatch only;
# mode == audit_only. NAO cria/edita/remove alertas, canais nem policies; NAO publica
# funcoes; NAO toca o segredo do trilho; NAO ativa flags; NAO concede/edita IAM; SEM
# chave estatica (somente WIF). rc real via ${PIPESTATUS[0]}; contagens so quando rc==0
# (linhas de erro nunca viram contagem real).
# =====================================================================
name: "[manual] F3.3.20-B1.7-C Monitoring AUDIT (read-only, WIF) issueNotifPrefsToken"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Digite audit_only para confirmar (qualquer outro valor aborta). NAO cria alertas."
        required: true
        default: "audit_only"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ff-monitoring-audit
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  REGION: "us-central1"
  FUNCTION_NAME: "issueNotifPrefsToken"
  RUN_SERVICE_NAME: "issuenotifprefstoken"

jobs:
  monitoring-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Guard mode (== audit_only; nao cria alertas)
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -eu
          if [ "$MODE" != "audit_only" ]; then
            echo "::error:: mode != audit_only — abortando antes de tudo (esta fase so audita)."
            exit 1
          fi
          echo "mode OK: audit_only (somente leitura; nenhum alerta/canal/policy sera criado)."

      - name: Auth GCP via WIF (identidade dedicada de leitura monitoring-auditor)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/391529908613/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "monitoring-auditor@agenda-id-seven.iam.gserviceaccount.com"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: AUDIT read-only (descoberta; rc real via PIPESTATUS; contagem so com rc==0)
        run: |
          set +e
          gcloud config set project "$GCP_PROJECT" >/dev/null 2>&1
          echo "Identidade ativa: $(gcloud config get-value account 2>/dev/null)"
          echo "PROJECT=$GCP_PROJECT REGION=$REGION FUNCTION_NAME=$FUNCTION_NAME RUN_SERVICE_NAME=$RUN_SERVICE_NAME"

          echo "========== FUNCTION (gen2) =========="
          gcloud functions describe "$FUNCTION_NAME" --gen2 --region "$REGION" --project "$GCP_PROJECT" \
            --format='value(name,state,environment,updateTime,serviceConfig.service)' 2>fn_err | tee fn_out
          FUNCTION_RC=${PIPESTATUS[0]}
          [ "$FUNCTION_RC" -ne 0 ] && echo "[function rc=$FUNCTION_RC] $(head -1 fn_err 2>/dev/null)"

          echo "========== CLOUD RUN SERVICE ($RUN_SERVICE_NAME) =========="
          gcloud run services describe "$RUN_SERVICE_NAME" --region "$REGION" --project "$GCP_PROJECT" \
            --format='value(metadata.name,status.url,status.latestReadyRevisionName)' 2>run_err | tee run_out
          RUN_RC=${PIPESTATUS[0]}
          [ "$RUN_RC" -ne 0 ] && echo "[run rc=$RUN_RC] $(head -1 run_err 2>/dev/null)"

          echo "========== NOTIFICATION CHANNELS (list; GA->beta->alpha) =========="
          CHANNELS_RC=1
          for track in "" "beta " "alpha "; do
            gcloud ${track}monitoring channels list --project "$GCP_PROJECT" --format='value(type)' 2>ch_err | tee ch_out
            CHANNELS_RC=${PIPESTATUS[0]}
            if [ "$CHANNELS_RC" -eq 0 ]; then echo "channels via: gcloud ${track}monitoring"; break; fi
          done
          if [ "$CHANNELS_RC" -eq 0 ]; then CHANNELS_COUNT=$(grep -c . ch_out 2>/dev/null || echo 0); else CHANNELS_COUNT=UNKNOWN; echo "[channels rc=$CHANNELS_RC] $(head -1 ch_err 2>/dev/null)"; fi

          echo "========== ALERT POLICIES (list) =========="
          gcloud monitoring policies list --project "$GCP_PROJECT" --format='value(displayName)' 2>pol_err | tee pol_out
          POLICIES_RC=${PIPESTATUS[0]}
          if [ "$POLICIES_RC" -eq 0 ]; then
            POLICIES_COUNT=$(grep -c . pol_out 2>/dev/null || echo 0)
            POLICIES_MATCHING_FN=$(grep -ciE 'issueNotifPrefsToken|issuenotifprefstoken' pol_out 2>/dev/null || echo 0)
          else
            POLICIES_COUNT=UNKNOWN; POLICIES_MATCHING_FN=UNKNOWN; echo "[policies rc=$POLICIES_RC] $(head -1 pol_err 2>/dev/null)"
          fi

          echo "========== METRIC DESCRIPTORS (run.googleapis.com; GA->beta->alpha) =========="
          METRICS_RC=1
          for track in "" "beta " "alpha "; do
            gcloud ${track}monitoring metric-descriptors list --project "$GCP_PROJECT" \
              --filter='metric.type:run.googleapis.com' --format='value(type)' 2>met_err | tee met_out
            METRICS_RC=${PIPESTATUS[0]}
            [ "$METRICS_RC" -eq 0 ] && break
          done
          if [ "$METRICS_RC" -eq 0 ]; then
            METRICS_LINES=$(grep -c . met_out 2>/dev/null || echo 0)
            echo "-- chaves p/ alertas --"; grep -E 'request_count|request_latencies|instance_count' met_out 2>/dev/null || true
          else
            METRICS_LINES=UNKNOWN
            echo "[metrics rc=$METRICS_RC] $(head -1 met_err 2>/dev/null)"
            echo "Referencia documental (metricas GA padrao do Cloud Run para alertas):"
            echo "  run.googleapis.com/request_count        (labels: response_code, response_code_class)"
            echo "  run.googleapis.com/request_latencies    (p95/p99)"
            echo "  run.googleapis.com/container/instance_count"
          fi

          echo "========== LOGS (filtrado ao servico; sem payload sensivel) =========="
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$RUN_SERVICE_NAME"'" AND resource.labels.location="'"$REGION"'"'
          gcloud logging read "$FILTER" --project "$GCP_PROJECT" --limit=30 --freshness=7d --order=desc \
            --format='value(httpRequest.requestMethod,httpRequest.status,severity)' 2>log_err | tee log_out
          LOGS_RC=${PIPESTATUS[0]}
          if [ "$LOGS_RC" -eq 0 ]; then
            REQ_LOG_LINES=$(grep -c . log_out 2>/dev/null || echo 0)
            S405=$(grep -cE '(^|[[:space:]])405([[:space:]]|$)' log_out 2>/dev/null || echo 0)
            S401=$(grep -cE '(^|[[:space:]])401([[:space:]]|$)' log_out 2>/dev/null || echo 0)
            S403=$(grep -cE '(^|[[:space:]])403([[:space:]]|$)' log_out 2>/dev/null || echo 0)
            S429=$(grep -cE '(^|[[:space:]])429([[:space:]]|$)' log_out 2>/dev/null || echo 0)
            S5XX=$(grep -cE '(^|[[:space:]])5[0-9][0-9]([[:space:]]|$)' log_out 2>/dev/null || echo 0)
            echo "STATUS_405=$S405 STATUS_401=$S401 STATUS_403=$S403 STATUS_429=$S429 STATUS_5XX=$S5XX"
          else
            REQ_LOG_LINES=UNKNOWN; S405=UNKNOWN; S401=UNKNOWN; S403=UNKNOWN; S429=UNKNOWN; S5XX=UNKNOWN
            echo "[logs rc=$LOGS_RC] $(head -1 log_err 2>/dev/null)"
          fi
          gcloud logging read "$FILTER AND severity>=WARNING" --project "$GCP_PROJECT" --limit=20 --freshness=7d --order=desc \
            --format='value(severity)' 2>warn_err | tee warn_out
          WARN_RC=${PIPESTATUS[0]}
          if [ "$WARN_RC" -eq 0 ]; then WARN_PLUS_COUNT=$(grep -c . warn_out 2>/dev/null || echo 0); else WARN_PLUS_COUNT=UNKNOWN; echo "[warn rc=$WARN_RC] $(head -1 warn_err 2>/dev/null)"; fi

          echo "RELATORIO_BEGIN"
          echo "SERVICE_ACCOUNT_USED=monitoring-auditor@agenda-id-seven.iam.gserviceaccount.com"
          echo "WIF_PROVIDER=projects/391529908613/locations/global/workloadIdentityPools/github/providers/github"
          echo "FUNCTION_NAME=$FUNCTION_NAME"
          echo "RUN_SERVICE_NAME=$RUN_SERVICE_NAME"
          echo "REGION=$REGION"
          echo "FUNCTION_RC=$FUNCTION_RC"
          echo "RUN_RC=$RUN_RC"
          echo "CHANNELS_RC=$CHANNELS_RC"
          echo "CHANNELS_COUNT=$CHANNELS_COUNT"
          echo "POLICIES_RC=$POLICIES_RC"
          echo "POLICIES_COUNT=$POLICIES_COUNT"
          echo "POLICIES_MATCHING_FN=$POLICIES_MATCHING_FN"
          echo "METRICS_RC=$METRICS_RC"
          echo "METRICS_LINES=$METRICS_LINES"
          echo "LOGS_RC=$LOGS_RC"
          echo "REQ_LOG_LINES=$REQ_LOG_LINES"
          echo "WARN_PLUS_COUNT=$WARN_PLUS_COUNT"
          echo "ALERTAS_CRIADOS=0"
          echo "CANAIS_CRIADOS=0"
          echo "POLICIES_ALTERADAS=0"
          echo "DEPLOY_EXECUTADO=0"
          echo "SEGREDO_ACESSADO=0"
          echo "RELATORIO_END"

      - name: Limpeza (arquivos temporarios de saida; credencial WIF e auto-removida)
        if: always()
        run: rm -f fn_out fn_err run_out run_err ch_out ch_err pol_out pol_err met_out met_err log_out log_err warn_out warn_err 2>/dev/null || true
