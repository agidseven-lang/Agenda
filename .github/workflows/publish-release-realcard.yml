# Publica RELEASE de teste (Desktop 1.0.115-whatsapp-real-card-send + Android 1.0.104).
# Push-triggered. Baixa artifacts cross-run, calcula SHA-256 e publica numa Release (link unico).
name: Publicar release teste (whatsapp-real-card 1.0.115 + 1.0.104)

on:
  push:
    branches: [ "infra/publish-release-realcard" ]

permissions:
  contents: write

env:
  DESKTOP_RUN: "27096319425"
  ANDROID_RUN: "27096326740"
  DESKTOP_ARTIFACT: "agenda-id-seven-desktop-1.0.115-whatsapp-real-card-send-installer"
  ANDROID_ARTIFACT: "idseven-nativebeta-1.0.104-beta-whatsapp-real-card-send"
  TAG: "test/whatsapp-real-card-send-1.0.115-1.0.104"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar instalador Desktop (cross-run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DESKTOP_ARTIFACT }}
          path: dl/desktop
          run-id: ${{ env.DESKTOP_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar APK Android (cross-run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANDROID_ARTIFACT }}
          path: dl/android
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Localizar binarios + SHA-256 (prova)
        run: |
          set -euo pipefail
          echo "== baixado =="; find dl -type f | sort
          EXE=$(ls dl/desktop/*.exe 2>/dev/null | head -1 || true)
          MSI=$(ls dl/desktop/*.msi 2>/dev/null | head -1 || true)
          APK=$(ls dl/android/*.apk 2>/dev/null | head -1 || true)
          [ -n "$EXE" ] || { echo "::error:: .exe ausente"; exit 1; }
          [ -n "$APK" ] || { echo "::error:: .apk ausente"; exit 1; }
          EXE_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          MSI_SHA=$([ -n "$MSI" ] && sha256sum "$MSI" | cut -d' ' -f1 || echo "n/a")
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          { echo "EXE  $(basename "$EXE")"; echo "     $EXE_SHA";
            echo "MSI  $([ -n "$MSI" ] && basename "$MSI" || echo n/a)"; echo "     $MSI_SHA";
            echo "APK  $(basename "$APK")"; echo "     $APK_SHA"; } | tee SHA256SUMS.txt
          { echo "EXE_NAME=$(basename "$EXE")"; echo "MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo n/a)";
            echo "APK_NAME=$(basename "$APK")"; echo "EXE_SHA=$EXE_SHA"; echo "MSI_SHA=$MSI_SHA"; echo "APK_SHA=$APK_SHA"; } >> "$GITHUB_ENV"

      - name: Publicar Release (link unico)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Teste — Envio REAL do card por imagem (Desktop 1.0.115 + Android 1.0.104)"
          prerelease: true
          body: |
            **Envio do card como IMAGEM REAL (anexar) + mensagem curta com link — preview automático = bônus**

            - Desktop: **1.0.115-whatsapp-real-card-send** (run ${{ env.DESKTOP_RUN }}) — modal com botão PRIMÁRIO **"Salvar imagem e abrir WhatsApp"** (salva o arquivo, abre a pasta, copia a mensagem e abre o WhatsApp) + Copiar mensagem / Copiar imagem / Abrir pasta / Testar link. Aviso forte: "Envie esta imagem no WhatsApp e cole a mensagem abaixo."
            - Android: **1.0.104-beta-whatsapp-real-card-send** (versionCode 102 · run ${{ env.ANDROID_RUN }}) — paridade (envio premium é do Desktop).
            - Worker: **V64.26-whatsapp-media-card** (inalterado) — imagem `https://aprovar.agendaidseven.com.br/og/wa-card-v64-26.jpg` (image/jpeg 1200×630).

            Card: botão visual **"Toque no link abaixo"**. Caption curta (sem duplicar periodicidade):
            "Seu *cronograma semanal/quinzenal/mensal* já está disponível para avaliação. Toque no link abaixo para revisar e aprovar:" + `https://aprovar.agendaidseven.com.br/cliente/cronograma/<TOKEN>`

            **SHA-256**
            ```
            EXE  ${{ env.EXE_NAME }}
                 ${{ env.EXE_SHA }}
            MSI  ${{ env.MSI_NAME }}
                 ${{ env.MSI_SHA }}
            APK  ${{ env.APK_NAME }}
                 ${{ env.APK_SHA }}
            ```
          files: |
            dl/desktop/*.exe
            dl/desktop/*.msi
            dl/android/*.apk
            SHA256SUMS.txt
