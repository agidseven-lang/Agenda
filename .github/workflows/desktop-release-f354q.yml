# =====================================================================
# F3.5.4Q — Publicacao da Desktop 1.0.207 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.207 (F3.5.4Q: DETECCAO AUTOMATICA DE TAREFA PARADA / CHECK-IN DE ATIVIDADE):
#   - detecta tarefas em "Em andamento" ha mais que o tempo APROVADO por setor (Edicao de Video 120min;
#     Cronograma/Cards/Roteiro/demais 90min; thresholdVersion deterministica) SEM atividade significativa
#     real, e pergunta ao responsavel um CHECK-IN neutro de atividade com 4 decisoes REAIS: SIM ESTOU
#     TRABALHANDO / ESTOU BLOQUEADO / PRECISO DE AJUDA / DEVOLVER PARA A FAZER (+ Abrir tarefa).
#   - a resposta e REAL, PERSISTIDA e AUDITAVEL: gravada por uma TRANSACAO Firestore (runTransaction) em
#     tasks/{id}.history[] com idempotencia por idleCheckKey. A PRIMEIRA resposta vence; uma 2a (neste ou
#     em outro dispositivo) recebe already_answered — sem 2a resposta, sem historico duplicado. Cobre
#     task_completed / activity_changed / not_authorized. Fila offline duravel sincroniza pela MESMA
#     transacao (pending_sync -> synced/superseded).
#   - DEVOLVER PARA A FAZER usa o helper canonico buildReturnToTodoPatch, o MESMO do moveStatus (menu
#     Mover) — paridade byte-a-byte provada por golden-master ANTES x DEPOIS (moveStatus 1.0.206 inline).
#   - relogio GLOBAL por tarefa (qualquer atividade real reinicia o ciclo); na duvida NAO emite. SEM
#     previsao de atraso / IA / score. "Preciso de ajuda"/"Estou bloqueado" reusam a notificacao
#     individual existente (help_requested/blocked via notifierA). Flag default ON.
# TODA a logica da 1.0.206 preservada (gates no build): decisao de SLA (F3.5.4P), lembrete central
# (F3.5.4L/M), agrupamento das comuns (F3.5.4O), notificacoes individuais, tempos T-30/T-10, destinatarios,
# Card Premium/Cronograma/Monitor SLA/sino, autocorrecao/inicializacao (F3.5.4N), updater e Android: INTOCADOS.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4Q 30705458647 (gated, verde nos 2 jobs; --publish
# never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests
# dos artifacts, 5 hashes SHA-256, tag v1.0.207 no head EXATO da branch. 6 assets: EXE, MSI, latest.yml,
# blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release Bot"
# (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# v1.0.206 (rollback), v1.0.205, v1.0.204 e v1.0.203 permanecem PRESERVADAS (releases/tags intocadas).
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.4Q Desktop Release — 1.0.207 no canal do updater (deteccao de tarefa parada / check-in; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354q-task-idle-detection-1.0.207"
    paths:
      - ".github/workflows/desktop-release-f354q.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4Q GO tecnico; run de build 30705458647 verde nos 2 jobs) ──
      RUN_ID: "30705458647"
      STABLE_SHA: "17c8ef507206cc92dab5b1fcc1da9d9df7194ed0"
      TEST_BRANCH: "desktop/f354q-task-idle-detection-1.0.207"
      BASE_206_SHA: "35262e5f20f318dda7fa1618e6fe1107210611e7"
      TAG: "v1.0.207"
      TITLE: "Agenda ID Seven Desktop 1.0.207 — Deteccao Automatica de Tarefa Parada"
      ART_INST: "agenda-id-seven-desktop-1.0.207-installer"
      ART_INST_DIGEST: "sha256:aafdaaeda3dcac214590dbfa1a9875f6d0e124ddac74d8fa3f4ba0bcafd4aa6e"
      ART_META: "agenda-id-seven-desktop-1.0.207-updatemeta"
      ART_META_DIGEST: "sha256:593bebd5e8014f090c8217bdc8a326f3aafe60d6ab1c04fb3bfbeb1975bac3de"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.207-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.207-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.207-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "ac4545136b282d767ca0da8d41bbe03e3374a80035be3b2cb4194a02f5069989"
      EXP_MSI: "ec62cb98afedf73ca595761029dee862da60fb8b70eb28a49718599dfe1e82c9"
      EXP_LY: "2c3c4db11462d1ec27c01af6354a66d95fec881c57574c6581e32c8194556c51"
      EXP_BM: "afb4a55eb6959f9ba009b28b5ac2f4fc9b2b3201aa04635935d21c7f7d45508f"
      EXP_SBOM: "c82a4096cf84ece18f2709db929273603a6b571ef8f5c3063cc5867256dafba4"
      PROD_PREV_TAG: "v1.0.206"
      PROD_ROLLBACK_TAG: "v1.0.205"
      PROD_HIST_TAG: "v1.0.204"
      PROD_HIST2_TAG: "v1.0.203"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4Q)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4Q completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354q\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_206_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.206 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.206 na linhagem"

      - name: "Gate 3 — release v1.0.207 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.207" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.207"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.207" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.207"; exit 1; }
          grep -q "1.0.207-task-idle-detection" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.207/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.207 — Deteccao Automatica de Tarefa Parada

          Atualizacao disponibilizada pelo ATUALIZADOR INTERNO do app (Configuracoes ->
          Atualizacoes -> Verificar atualizacoes -> Baixar -> Instalar e reiniciar).
          NENHUM download manual e necessario.

          O QUE MUDA vs 1.0.206 (F3.5.4Q — deteccao de tarefa parada / check-in de atividade)
          - Quando uma tarefa fica "Em andamento" por muito tempo SEM nenhuma atualizacao registrada, o app
            faz um CHECK-IN neutro (nao acusatorio) ao responsavel: "Esta tarefa ainda esta sendo executada?".
            O responsavel escolhe entre 4 acoes reais: "Sim, estou trabalhando", "Estou bloqueado",
            "Preciso de ajuda" e "Devolver para A Fazer" (alem de "Abrir tarefa").
          - Tempos aprovados por setor: Edicao de Video/Midia 120 minutos; Cronograma, Edicao de Cards,
            Roteiro e demais 90 minutos. O relogio e GLOBAL por tarefa: QUALQUER atividade real (de qualquer
            pessoa) reinicia a contagem — reduz "falso positivo". Na duvida, o app NAO pergunta.
          - Resposta REAL e registrada: a decisao e gravada de forma persistente e auditavel no historico da
            propria tarefa, por uma TRANSACAO — a PRIMEIRA resposta vale; se o mesmo check-in ja tiver sido
            respondido (por voce ou por outra pessoa, em outro dispositivo), aparece que ja foi respondido,
            sem registrar duas vezes. Se a tarefa ja saiu de "Em andamento", foi concluida ou teve atividade
            nova, o app avisa e nao registra um ciclo obsoleto.
          - "Devolver para A Fazer" usa exatamente a MESMA regra do menu "Mover" do app — sem inventar um
            caminho paralelo. "Preciso de ajuda" e "Estou bloqueado" avisam a pessoa certa (uma unica
            notificacao); "Sim, estou trabalhando" apenas registra.
          - Funciona offline: a resposta fica guardada e sincroniza sozinha depois, pela mesma transacao —
            sem duplicar. Em Configuracoes -> Notificacoes ha o botao para ligar/desligar a deteccao de
            tarefa parada (ligado por padrao). Desligando, nada e perguntado (exatamente como na 1.0.206).
          - SEM previsao de atraso, SEM IA, SEM pontuacao de produtividade: e apenas um lembrete de atividade.

          PRESERVACAO (provado por gates no build)
          - Decisao do responsavel no alerta de SLA (1.0.206), lembrete central (1.0.202/1.0.203),
            agrupamento das notificacoes comuns (1.0.205), notificacoes individuais, tempos de SLA
            (T-30/T-10), destinatarios, Card Premium, Cronograma, Roteiro, Monitor SLA, sino, inicializacao
            com o Windows e autocorrecao do canal (1.0.204), atualizador, login/logout e Android: INTOCADOS.
          - Rollback: 1.0.206, 1.0.205, 1.0.204 e 1.0.203 PRESERVADAS (releases e tags intactas).

          NOTA HONESTA DE SEGURANCA
          - A garantia de "uma unica resposta por check-in" (primeira transacao vence; a segunda recebe
            already_answered) e imposta pelo servidor (transacao Firestore), independente de autenticacao.
            Ja a autorizacao de conteudo (quem pode responder) e validada no cliente e no processo principal
            do Desktop; ela NAO e imposta por Regras do Firestore neste momento. Um cliente deliberadamente
            adulterado poderia burlar a autorizacao de conteudo, mas NAO a garantia de resposta unica.

          IMPORTANTE: esta versao ainda DEPENDE DE VALIDACAO FISICA do owner (provocar uma tarefa parada,
          responder com cada uma das 4 decisoes, confirmar que a resposta e gravada no historico, que uma
          2a resposta ao mesmo check-in recebe "ja respondido", que "Devolver para A Fazer" produz
          exatamente a mesma transicao do menu Mover, que ajuda/bloqueio geram uma unica notificacao para o
          destinatario certo, que responder offline sincroniza depois sem duplicar, e que desligar a flag
          desativa a deteccao). A publicacao apenas disponibiliza a atualizacao pelo mecanismo oficial.

          Procedencia: run de build F3.5.4Q 30705458647 (success; --publish never; gates de verificacao +
          Windows verdes, incluindo os 25 gates F3.5.4Q no app.asar, com prova de TRANSACAO real e paridade
          do helper de "Devolver para A Fazer") @ commit 17c8ef507206cc92dab5b1fcc1da9d9df7194ed0 (branch
          desktop/f354q-task-idle-detection-1.0.207 = tag v1.0.206 + commits da fase). Mesmos bytes; sem
          recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.207 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.207; 1.0.206 rollback + 1.0.205/1.0.204/1.0.203 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.207 no canal do updater (Latest); 1.0.206/1.0.205/1.0.204/1.0.203 preservadas ====="
