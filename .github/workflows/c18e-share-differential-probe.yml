# =====================================================================
# [manual] F3.3.73I6C18E — PROBE DIFERENCIAL /share com TOKENS REAIS.
#
# Compara, sob condições IDÊNTICAS: (1) token real de CRONOGRAMA (Card
# Premium funcional), (2) token real de ROTEIRO (Card Premium ausente) e
# (3) token dummy (baseline do fallback). Objetivo: demonstrar a PRIMEIRA
# divergência concreta entre as respostas — nunca concluir por eliminação.
#
# READ-ONLY: somente GET/HEAD públicos em aprovar.agendaidseven.com.br e
# workers.dev. SEM deploy, SEM wrangler, SEM Firestore, SEM WhatsApp API,
# SEM POST/PUT/PATCH/DELETE. Não altera nenhum produto.
#
# SEGURANÇA DOS TOKENS (regra da fase C18E):
#   - tokens reais SOMENTE via secrets C18E_CRONOGRAMA_TOKEN e
#     C18E_ROTEIRO_TOKEN (temporários; owner remove após a fase);
#   - NUNCA em inputs visíveis, logs, artifacts ou nomes de arquivo:
#     todo corpo/valor passa por redação (<cron-token-redacted> /
#     <rot-token-redacted>) ANTES de imprimir/salvar; o GitHub Actions
#     ainda mascara qualquer ocorrência literal de secret (defesa dupla);
#   - URLs completas nunca são impressas nem gravadas na matriz (a matriz
#     registra apenas o "tipo de página": share|portal|image);
#   - corpo do PORTAL (contém nome de cliente) NUNCA vai para artifact;
#     apenas metas OG extraídas com cliente substituído por
#     " — <cliente-redacted>". O corpo do /share não contém dado de
#     cliente (vocabulário fixo por tipo) e vai para o artifact SÓ depois
#     da redação de token.
# =====================================================================
name: "[manual] C18E Differential Share Probe"

"on":
  workflow_dispatch:
    inputs:
      dummy_token:
        description: "Token DUMMY p/ baseline do fallback (NUNCA um token real)"
        required: false
        default: "c18ebaseline01"

permissions:
  contents: read

concurrency:
  group: c18e-share-differential-probe
  cancel-in-progress: false

jobs:
  probe:
    name: probe diferencial (read-only; tokens redigidos)
    runs-on: ubuntu-latest
    env:
      CRON_TOKEN: ${{ secrets.C18E_CRONOGRAMA_TOKEN }}
      ROT_TOKEN: ${{ secrets.C18E_ROTEIRO_TOKEN }}
      DUMMY_IN: ${{ github.event.inputs.dummy_token }}
    steps:
      - name: Matriz diferencial sanitizada (GET/HEAD públicos)
        run: |
          set -euo pipefail
          CUSTOM="https://aprovar.agendaidseven.com.br"
          WORKERS="https://idseven-push.agidseven.workers.dev"
          IMG_PATH="/og/wa-card-v64-39.jpg"

          # ---- gate dos secrets (falha clara e sanitizada se ausentes)
          [ -n "${CRON_TOKEN:-}" ] || { echo "::error::secret C18E_CRONOGRAMA_TOKEN ausente — criar em Settings > Secrets and variables > Actions (temporário da fase C18E)."; exit 1; }
          [ -n "${ROT_TOKEN:-}" ]  || { echo "::error::secret C18E_ROTEIRO_TOKEN ausente — criar em Settings > Secrets and variables > Actions (temporário da fase C18E)."; exit 1; }
          # normalização TOLERANTE (nada é impresso): remove CR/LF/espaços; se vier a URL
          # ou o path inteiro (/share/cronograma/<token>), extrai o último segmento; corta
          # querystring/fragment e barra final. A validação de charset roda DEPOIS disso.
          norm_token() {
            local v="$1"
            v="${v//$'\r'/}"; v="${v//$'\n'/}"; v="${v//$'\t'/}"; v="${v// /}"
            v="${v%%\?*}"; v="${v%%#*}"; v="${v%/}"
            case "$v" in */*) v="${v##*/}";; esac
            printf '%s' "$v"
          }
          CRON_TOKEN="$(norm_token "$CRON_TOKEN")"
          ROT_TOKEN="$(norm_token "$ROT_TOKEN")"
          # máscara extra: se o secret foi salvo como URL, o token extraído (substring)
          # NÃO seria mascarado automaticamente pelo Actions — registrar explicitamente.
          echo "::add-mask::$CRON_TOKEN"
          echo "::add-mask::$ROT_TOKEN"
          case "$CRON_TOKEN" in (*[!A-Za-z0-9_-]*) echo "::error::C18E_CRONOGRAMA_TOKEN com caractere fora de [A-Za-z0-9_-]"; exit 1;; esac
          case "$ROT_TOKEN"  in (*[!A-Za-z0-9_-]*) echo "::error::C18E_ROTEIRO_TOKEN com caractere fora de [A-Za-z0-9_-]"; exit 1;; esac
          [ ${#CRON_TOKEN} -ge 4 ] && [ ${#CRON_TOKEN} -le 128 ] || { echo "::error::C18E_CRONOGRAMA_TOKEN com tamanho fora de 4..128"; exit 1; }
          [ ${#ROT_TOKEN}  -ge 4 ] && [ ${#ROT_TOKEN}  -le 128 ] || { echo "::error::C18E_ROTEIRO_TOKEN com tamanho fora de 4..128"; exit 1; }
          [ "$CRON_TOKEN" != "$ROT_TOKEN" ] || { echo "::error::os dois secrets têm o MESMO valor — devem ser tarefas distintas"; exit 1; }
          DUMMY="${DUMMY_IN:-c18ebaseline01}"
          case "$DUMMY" in (*[!A-Za-z0-9_-]*) echo "::error::dummy_token com caractere inválido"; exit 1;; esac
          [ "$DUMMY" != "$CRON_TOKEN" ] && [ "$DUMMY" != "$ROT_TOKEN" ] || { echo "::error::dummy_token NÃO pode ser um token real"; exit 1; }

          mkdir -p out/red
          TAB="$(printf '\t')"
          red() { sed -e "s|$CRON_TOKEN|<cron-token-redacted>|g" -e "s|$ROT_TOKEN|<rot-token-redacted>|g" -e "s|$DUMMY|<dummy-token>|g"; }

          TSV=out/matrix.tsv
          printf 'label\torigin\tpage\tua\tmethod\titer\tstatus\tcontent_type\tcontent_length\tlocation\tttfb_s\ttotal_s\tx_share_cache\tcache_control\tbody_bytes\tsha256_raw\tsha256_red\n' > "$TSV"

          ua_of() { case "$1" in
            browser) echo "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";;
            wa)      echo "WhatsApp/2.23.20.0";;
            fb)      echo "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)";;
          esac; }

          # req <label> <origin_name> <base> <page_kind> <path> <ua> <method> <iter>
          # Deixa o corpo REDIGIDO em out/b.red (chamador decide guardar/extrair).
          # Nunca imprime a URL. Sem -L: redirect é OBSERVADO (location yes/no), não seguido.
          req() {
            local label="$1" oname="$2" base="$3" pkind="$4" path="$5" ua="$6" m="$7" it="$8"
            local hdr=out/h.txt body=out/b.bin
            local args=(-sS --max-time 30 -D "$hdr" -o "$body" -w '%{http_code}\t%{content_type}\t%{time_starttransfer}\t%{time_total}' -A "$(ua_of "$ua")")
            [ "$m" = "HEAD" ] && args=("${args[@]}" -I)
            : > "$body"; : > "$hdr"
            local W; W=$(curl "${args[@]}" "$base$path" 2>/dev/null) || W="$(printf '000\t-\t0\t0')"
            local st ct ttfb tt
            st=$(printf '%s' "$W" | cut -f1); ct=$(printf '%s' "$W" | cut -f2)
            ttfb=$(printf '%s' "$W" | cut -f3); tt=$(printf '%s' "$W" | cut -f4)
            hv() { grep -i "^$1:" "$hdr" 2>/dev/null | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//' || true; }
            local cl xsc cc loc
            cl=$(hv content-length); xsc=$(hv x-share-cache); cc=$(hv cache-control)
            if [ -n "$(hv location)" ]; then loc=yes; else loc=no; fi
            local sz shar shad
            sz=$(wc -c < "$body" | tr -d ' ')
            shar=$(sha256sum "$body" | cut -d' ' -f1)
            red < "$body" > out/b.red
            shad=$(sha256sum out/b.red | cut -d' ' -f1)
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$oname" "$pkind" "$ua" "$m" "$it" "$st" "$ct" "${cl:--}" "$loc" "$ttfb" "$tt" "${xsc:--}" "${cc:--}" "$sz" "$shar" "$shad" >> "$TSV"
          }

          # extrai metas OG/Twitter de um corpo já token-redigido
          ogx() { grep -oE '<meta (property|name)="(og:[a-z:_]+|twitter:card|twitter:title|twitter:description|twitter:image)" content="[^"]*" ?/?>' "$1" || true; }
          # redação POSICIONAL de cliente: "Aprovar X — Fulano" -> "Aprovar X — <cliente-redacted>"
          redcli() { sed -E 's/ — [^"<]+/ — <cliente-redacted>/g'; }

          # ---- sequência idêntica por token (share custom: GET#1, GET#2, wa, fb, HEADs; workers; portal)
          share_seq() { # <label> <token>
            # NOTA: argumentos do builtin `local` são expandidos ANTES das atribuições —
            # $T em p/pp precisa vir em linha separada (set -u).
            local L="$1" T="$2"
            local p="/share/cronograma/$T" pp="/cliente/cronograma/$T"
            req "$L" custom "$CUSTOM" share "$p" browser GET 1; cp out/b.red "out/red/share_${L}_custom_browser_get1.html"
            req "$L" custom "$CUSTOM" share "$p" browser GET 2; cp out/b.red "out/red/share_${L}_custom_browser_get2.html"
            req "$L" custom "$CUSTOM" share "$p" wa GET 3
            req "$L" custom "$CUSTOM" share "$p" fb GET 4
            req "$L" custom "$CUSTOM" share "$p" browser HEAD 5
            req "$L" custom "$CUSTOM" share "$p" wa HEAD 6
            req "$L" workers "$WORKERS" share "$p" browser GET 1; cp out/b.red "out/red/share_${L}_workers_browser_get1.html"
            req "$L" workers "$WORKERS" share "$p" browser GET 2
            # portal: crawler (card com nome do cliente) — só metas REDIGIDAS são preservadas
            req "$L" custom "$CUSTOM" portal "$pp" fb GET 1
            ogx out/b.red | redcli > "out/red/portal_${L}_crawler_metas.txt"
            grep -oE '<title>[^<]*</title>' out/b.red | redcli >> "out/red/portal_${L}_crawler_metas.txt" || true
            rm -f out/b.red
            # portal: navegador (página completa) — apenas medidas na matriz; corpo descartado
            req "$L" custom "$CUSTOM" portal "$pp" browser GET 1
            rm -f out/b.red
          }

          share_seq cron "$CRON_TOKEN"
          share_seq rot  "$ROT_TOKEN"
          share_seq dummy "$DUMMY"

          # ---- imagem OG única atual (Gate 5) — global, sem token
          req img custom  "$CUSTOM"  image "$IMG_PATH" fb GET 1
          req img custom  "$CUSTOM"  image "$IMG_PATH" wa HEAD 1
          req img workers "$WORKERS" image "$IMG_PATH" fb GET 1

          echo "===== MATRIZ (sanitizada; sem URLs; page=share|portal|image) ====="
          column -t -s "$TAB" "$TSV" | red

          echo; echo "===== GATE 2 — OG do /share (browser GET#1, custom) ====="
          for L in cron rot dummy; do
            f="out/red/share_${L}_custom_browser_get1.html"
            echo "--- [$L] metas OG/Twitter:"; ogx "$f"
            echo "--- [$L] title/charset/canonical:"
            grep -oE '<title>[^<]*</title>' "$f" || echo "SEM <title>"
            printf 'charset utf-8 count: %s\n' "$(grep -c 'charset="utf-8"' "$f" || true)"
            printf 'canonical count: %s\n' "$(grep -c 'rel="canonical"' "$f" || true)"
            python3 - "$f" <<'PYEOF'
          import sys, re
          b = open(sys.argv[1], 'rb').read()
          h = b.find(b'</head>')
          ogs = [m.start() for m in re.finditer(rb'<meta property="og:', b)]
          print("head_end_offset:", h, "| metas og:", len(ogs), "| todas antes do </head>:", all(x < h for x in ogs))
          ctrl = sum(1 for c in b if c < 9 or c in (11, 12) or (13 < c < 32))
          print("control_chars:", ctrl)
          txt = b.decode('utf-8', 'replace')
          bad = [l for l in txt.splitlines() if l.startswith('<meta ') and not re.match(r'^<meta (property|name)="[^"]+" content="[^"]*"\s*/?>$', l)]
          print("meta_malformadas:", len(bad))
          for l in bad[:5]: print("  BAD:", l[:180])
          PYEOF
          done

          echo; echo "===== GATE 1/4 — primeira divergência: DIFF share cron × rot (token normalizado) ====="
          sed 's|<cron-token-redacted>|<token>|g' out/red/share_cron_custom_browser_get1.html > out/n_cron.html
          sed 's|<rot-token-redacted>|<token>|g'  out/red/share_rot_custom_browser_get1.html  > out/n_rot.html
          sed 's|<dummy-token>|<token>|g'         out/red/share_dummy_custom_browser_get1.html > out/n_dummy.html
          if diff -u out/n_cron.html out/n_rot.html > out/red/diff_share_cron_vs_rot.txt; then
            echo "IDÊNTICOS (nenhuma divergência além do token)"
          else
            cat out/red/diff_share_cron_vs_rot.txt
          fi
          echo "--- share dummy × cron (esperado IDÊNTICOS: fallback é byte-igual ao cronograma):"
          if diff -u out/n_dummy.html out/n_cron.html > out/red/diff_share_dummy_vs_cron.txt; then
            echo "IDÊNTICOS"
          else
            cat out/red/diff_share_dummy_vs_cron.txt
          fi
          echo "--- share rot: custom × workers.dev (origem+token normalizados; esperado IDÊNTICOS):"
          sed -e 's|idseven-push.agidseven.workers.dev|aprovar.agendaidseven.com.br|g' -e 's|<rot-token-redacted>|<token>|g' \
            out/red/share_rot_workers_browser_get1.html > out/n_rot_workers.html
          if diff -u out/n_rot.html out/n_rot_workers.html > /dev/null; then
            echo "IDÊNTICOS (custom == workers)"
          else
            echo "DIVERGEM:"; diff -u out/n_rot.html out/n_rot_workers.html | head -40
          fi

          echo; echo "===== GATE 3 — LOOKUP provado por comportamento (tipo servido + regra do cache) ====="
          echo "(X-Share-Cache=hit no GET#2 => tarefa ENCONTRADA e tipo resolvido — só 'resolved' aquece; dummy deve permanecer miss)"
          for L in cron rot dummy; do
            f="out/red/share_${L}_custom_browser_get1.html"
            tipo="cronograma"; grep -q "Aprovar roteiro" "$f" && tipo="roteiro"
            xsc1=$(awk -F"$TAB" -v l="$L" '$1==l && $2=="custom" && $3=="share" && $5=="GET" && $6=="1" {print $13}' "$TSV")
            xsc2=$(awk -F"$TAB" -v l="$L" '$1==l && $2=="custom" && $3=="share" && $5=="GET" && $6=="2" {print $13}' "$TSV")
            echo "[$L] tipo_servido=$tipo | GET#1 X-Share-Cache=${xsc1:--} | GET#2 X-Share-Cache=${xsc2:--}"
          done

          echo; echo "===== GATE 2b — Portal (crawler fb): OG por tipo, cliente redigido ====="
          for L in cron rot dummy; do
            echo "--- [$L]:"; cat "out/red/portal_${L}_crawler_metas.txt" 2>/dev/null || echo "(sem metas)"
          done

          echo; echo "===== GATE 4b — GET × HEAD consistência (share, custom) ====="
          awk -F"$TAB" '$3=="share" && $2=="custom" {print $1, $4, $5, "iter="$6, "status="$7, "ct="$8, "xsc="$13}' "$TSV"

          echo; echo "===== GATE 5 — imagem OG única atual (mesma p/ os dois tipos) ====="
          awk -F"$TAB" '$1=="img" {print $2, $4, $5, "status="$7, "ct="$8, "content_length="$9, "body_bytes="$15, "sha256="$16}' "$TSV"
          echo "(comparar sha256 acima com o hash da arte embutida no código 3f497cf, informado no relatório da fase)"

          # ---- limpeza: nada com token/cliente sai daqui
          rm -f out/b.bin out/b.red out/h.txt out/n_cron.html out/n_rot.html out/n_dummy.html out/n_rot_workers.html
          echo; echo "OK: probe concluído; matriz e extratos redigidos em out/ (artifact)."

      - name: Upload artefato (somente arquivos redigidos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c18e-differential-probe
          path: out/
          retention-days: 14
