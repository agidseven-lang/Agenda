      - name: "Gate F3.5.5E-H3 — VISIBILIDADE GLOBAL (56: reassert topmost/bounds a cada apresentação + handoff do toast no blur + roteamento por foco congelado + coleta IPC + visual 1.0.226 byte-congelado + comportamento do dist em sandbox) [dist]"
