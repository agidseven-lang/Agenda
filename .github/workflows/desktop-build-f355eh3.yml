# F3.5.5E-H3 — Desktop 1.0.227 (P0: VISIBILIDADE GLOBAL das Notificações Imediatas)
# build GATED, --publish never. Publicação SÓ no desktop-release-f355eh3.yml (mesmos bytes).
# Base de código 1.0.226 @ 267f8c8 (FISICAMENTE APROVADA — BASELINE OFICIAL). ROLLBACK IMEDIATO
# 1.0.226; adicional 1.0.224; físico de segurança 1.0.223. A notificação precisa ficar visível
# SOBRE qualquer janela comum do Windows enquanto o Agenda estiver ativo em background, SEM
# roubar o foco. Causa-raiz (auditoria provada): (1) topmost/bounds da janela premium eram
# definidos SÓ na criação — após hide() (fila vazia) ou mudança de display/DPI, um novo
# showInactive() podia reaparecer ABAIXO de janelas comuns e mal posicionado; (2) o morph de
# GRUPO não reafirmava o z-order; (3) toasts in-app ATIVOS ficavam invisíveis atrás de outro
# programa no Alt+Tab (sem handoff no blur). Correção cirúrgica: REASSERT completo a cada
# apresentação (ensureWin→position(altura viva)→setAlwaysOnTop screen-saver→showInactive→
# moveTop) + reafirmação no update de grupo visível + reposição em display-changed + HANDOFF
# do toast no blur (registro TTL + coleta IPC notif-collect-request/reply + re-exibição na
# premium com sound:false — mover, nunca duplicar). Roteamento por FOCO REAL (F3.5.4K),
# sessão bloqueada→nativa, som/dedupe/fila/caps/agrupamento/recibos/sino/deep-link/SLA
# CONGELADOS. VISUAL 1.0.226 (referência do owner) BYTE-CONGELADO: bgnotify.html diff-vazio;
# index.html só ganha __ntfKey/__ntfPayload + coleta (ajuste técnico não-visual).
