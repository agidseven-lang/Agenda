# =====================================================================
# F3.5.6A — Publicacao da Desktop 1.0.229 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.229 (F3.5.6A — FLUXO INTELIGENTE DE PRODUCAO E APROVACAO: orquestracao
# operacional em tempo real ANTES do sistema de notificacoes aprovado. EVENTO OPERACIONAL
# (ledger duravel tasks.workflowEvents, chaves idempotentes; Worker V64.61 grava decisao/
# envio/visualizacao do cliente; app grava acoes da equipe) -> MOTOR DE ORQUESTRACAO
# (workflowEvents.js: fases persistidas + PHASE RUNS por responsabilidade com prazo
# configuravel + APPROVAL ROUNDS THEMES/CAPTIONS com sentAt SERVER-SIDE e visualizacao
# anti-crawler) -> MOTOR DE DECISAO (politica INFORMATIVA/ACAO NECESSARIA/PRIORITARIA;
# rajada do designer coalescida; PROXIMA ACAO nas mensagens) -> INGRESSO deliverNotification
# EXISTENTE -> NOTIFICACAO 1.0.228 INTACTA (bgNotify/agrupamento/handoff/som/dedupe
# byte-identicos por gate). SLA por responsabilidade: espera externa pausa alertas SO da
# tarefa em espera; Kanban AGUARDANDO CLIENTE; COPIAR != ENVIADO; registro de aprovacao/
# ajuste do WhatsApp converge na decisao canonica; follow-up e RECOMENDACAO.
# BASE: 1.0.228 (F3.5.5E-H4) — BASELINE FISICA OFICIAL (FISICAMENTE APROVADA).
# ROLLBACK IMEDIATO: v1.0.228. Adicional: v1.0.226. Fisico de seguranca: v1.0.223.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.6A 31260516822 (gated, verde
# nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os
# MESMOS bytes. TUDO PINADO: run id, digests dos artifacts, 5 hashes SHA-256, tag
# v1.0.229 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner (ciclo completo
# temas -> cliente -> designers -> legendas -> cliente -> concluida; espera externa pausando
# alertas internos; registro WhatsApp; central do cliente) vem depois. A 1.0.228 permanece
# baseline oficial ate GO fisico.
# =====================================================================
name: "F3.5.6A Desktop Release — 1.0.229 no canal do updater (Fluxo Inteligente de Produção e Aprovação; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356a-realtime-workflow-client-approval-1.0.229"
    paths:
      - ".github/workflows/desktop-release-f356a.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A; run de build 31260516822 verde nos 2 jobs) ──
      RUN_ID: "31260516822"
      STABLE_SHA: "a322dc8d81acdb44bde9ea31ad686279a2adea0d"
      TEST_BRANCH: "desktop/f356a-realtime-workflow-client-approval-1.0.229"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      BASE_226_SHA: "267f8c8593e6724ad6460ed8bbb42201ade09d0b"
      BASE_225_SHA: "24b76b51faf4d2778f025df79d6047563f089b48"
      BASE_224_SHA: "0fcad3e56d39320b8853807861417a0a5eca1e78"
      BASE_223_SHA: "217ed0622993acced1a20b72ba677e9d17ed2f03"
      BASE_222_SHA: "1eac3672ab07a56bfd5d692e9ecb24688ac2ee83"
      BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
      BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
      BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
      BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
      TAG: "v1.0.229"
      TITLE: "Agenda ID Seven Desktop 1.0.229 — Fluxo Inteligente de Produção e Aprovação"
      ART_INST: "agenda-id-seven-desktop-1.0.229-installer"
      ART_INST_DIGEST: "sha256:f7b464ffe5fd86dee670bf76f65ea2df11208147968913704eab198e03b70d28"
      ART_META: "agenda-id-seven-desktop-1.0.229-updatemeta"
      ART_META_DIGEST: "sha256:8ec332c5b9ff05eb59335436e2dac2084686c0fa265c2e8e8b563a5fe94e6c6e"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.229-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.229-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.229-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "f0bdcc53bc2b3146604f8c3772030b5020cdaf34449d76d9fa96f929b90e0ee3"
      EXP_MSI: "b2d9eb56ce57728c5ea6f7e3d1bc13de1af54841c7b29262963229bba869692b"
      EXP_LY: "7fd5220d62546933317268ee39bc2f7ca2c7254ed638d943fd845295498bb3dd"
      EXP_BM: "770b672d41a0e7b2f810d0effaa6951856da10d365bee71d35a20358e429446d"
      EXP_SBOM: "eb34699796e5836792fe067bc90a9a4e976f6f72bf1a87b0ebab81fd77f29d3e"
      PREV_LATEST_TAG: "v1.0.228"
      PRES_227_TAG: "v1.0.227"
      PRES_226_TAG: "v1.0.226"
      PRES_224_TAG: "v1.0.224"
      PRES_223_TAG: "v1.0.223"
      PROD_ROLLBACK_TAG: "v1.0.218"
      PROD_ROLLBACK2_TAG: "v1.0.216"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356a\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP28="$(gh api "repos/$REPO/compare/$BASE_228_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP28" = "ahead" ] || [ "$CMP28" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da base 1.0.228 ($CMP28)"; exit 1; }
          CMP26="$(gh api "repos/$REPO/compare/$BASE_226_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP26" = "ahead" ] || [ "$CMP26" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline fisica 1.0.226 ($CMP26)"; exit 1; }
          CMP25="$(gh api "repos/$REPO/compare/$BASE_225_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP25" = "ahead" ] || [ "$CMP25" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da base 1.0.225 ($CMP25)"; exit 1; }
          CMP24="$(gh api "repos/$REPO/compare/$BASE_224_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP24" = "ahead" ] || [ "$CMP24" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline fisica 1.0.224 ($CMP24)"; exit 1; }
          CMP23="$(gh api "repos/$REPO/compare/$BASE_223_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP23" = "ahead" ] || [ "$CMP23" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.223 ($CMP23)"; exit 1; }
          CMP22="$(gh api "repos/$REPO/compare/$BASE_222_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP22" = "ahead" ] || [ "$CMP22" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.222 ($CMP22)"; exit 1; }
          CMP21="$(gh api "repos/$REPO/compare/$BASE_221_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP21" = "ahead" ] || [ "$CMP21" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.221 ($CMP21)"; exit 1; }
          CMP20="$(gh api "repos/$REPO/compare/$BASE_220_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP20" = "ahead" ] || [ "$CMP20" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.220 ($CMP20)"; exit 1; }
          CMP0="$(gh api "repos/$REPO/compare/$BASE_218_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP0" = "ahead" ] || [ "$CMP0" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline fisica segura 1.0.218 ($CMP0)"; exit 1; }
          CMP1="$(gh api "repos/$REPO/compare/$BASE_216_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP1" = "ahead" ] || [ "$CMP1" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.216 ($CMP1)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.228/1.0.226/1.0.225/1.0.224/1.0.223/1.0.222/1.0.221/1.0.220/1.0.218/1.0.216 na linhagem"

      - name: "Gate 3 — release v1.0.229 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.229" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.229"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.229" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.229"; exit 1; }
          grep -q "1.0.229-f356a-realtime-workflow-client-approval" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.229/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.229 — Fluxo Inteligente de Produção e Aprovação

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          CONTEXTO: o app passa a ORQUESTRAR o fluxo real de produção — do envio dos
          temas ao cliente até a conclusão pelas legendas aprovadas — sabendo sempre
          QUEM ESTÁ COM A BOLA (equipe interna ou cliente) e notificando QUEM precisa
          NO MOMENTO em que precisa, pela MESMA infraestrutura de notificações da
          1.0.228 (que permanece byte-idêntica, garantida por gate).

          O QUE MUDA vs 1.0.228 (F3.5.6A):
          - CICLO CANÔNICO com fases persistidas (preparação de temas -> aguardando
            cliente -> ajustes -> atribuição -> produção dos designers -> legendas ->
            aguardando cliente -> concluída), com histórico de rodadas de aprovação
            SEPARADO para TEMAS e LEGENDAS (rodada antiga nunca é sobrescrita);
          - SLA POR RESPONSABILIDADE: quando a bola está com o CLIENTE, os alertas
            internos daquela tarefa PAUSAM (o tempo do cliente não vira atraso da
            equipe); o card mostra "Aguardando cliente · Temas/Legendas · visualizado
            ou não · há quanto tempo"; as demais tarefas internas seguem alertando;
          - COPIAR NÃO É ENVIADO: só o botão "CONFIRMAR ENVIO AO CLIENTE" registra o
            envio (carimbo do SERVIDOR); a visualização do portal é detectada de forma
            humana (anti-robô) e a decisão do cliente continua canônica no portal;
          - APROVAÇÃO/AJUSTE RECEBIDOS PELO WHATSAPP: a equipe registra no app, com
            auditoria (quem registrou, quando, fonte whatsapp_group), convergindo na
            MESMA decisão canônica do portal — inclusive o texto do ajuste pedido;
          - FOLLOW-UP INTELIGENTE como RECOMENDAÇÃO (enviado e não visualizado /
            visualizado sem resposta / espera longa) com "Copiar lembrete" — NUNCA
            envio automático ao cliente;
          - CENTRAL DO CLIENTE ganha "APROVAÇÕES PENDENTES" (não visualizadas /
            visualizadas sem resposta / ajustes solicitados / aprovadas há pouco);
          - Minhas Prioridades ganha a seção "AGUARDANDO CLIENTE" (sem culpa interna);
          - notificações do fluxo com PRÓXIMA AÇÃO no texto; conclusões de cards do
            designer coalescidas ("X concluiu 4 de 12") antes do ingresso;
          - atribuição aos designers SÓ após temas aprovados; aprovar temas NÃO
            conclui a tarefa; SÓ a aprovação das LEGENDAS conclui.

          O QUE NÃO MUDA (CONGELADO por gate):
          - TODA a infraestrutura de notificações 1.0.228 FISICAMENTE APROVADA —
            bgNotify.ts, agrupamento (F3.5.4O), bgnotify.html, handoff transacional,
            topmost, roteamento por foco, som, dedupe, recibos, caps — byte-idêntica;
          - lembretes centrais de SLA, Acompanhamento, sessão, tray, autostart,
            updater, Cronograma/editor/colagem, Card Premium do WhatsApp, auth;
          - tarefas ANTIGAS continuam funcionando (campos legados preservados
            byte-compatíveis; nada de coleção nova; histórico intacto).

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows.
          Teste decisivo (mandato): A) criar Cronograma -> preparar temas -> COPIAR
          (não marca enviado) -> CONFIRMAR ENVIO (marca, com carimbo do servidor) ->
          card vira "Aguardando cliente" e alertas internos da tarefa pausam; B)
          aprovar temas no portal -> volta para a equipe SEM concluir; atribuir
          designers; C) concluir cards -> rajada coalescida; produção concluída ->
          fase de legendas; D) reenviar -> aprovar LEGENDAS -> tarefa concluída; E)
          registrar aprovação recebida pelo WhatsApp -> mesma decisão canônica com
          auditoria; F) notificações idênticas às da 1.0.228 (visual/som/agrupamento).
          A publicação não é aprovação física. Em caso de problema: ROLLBACK IMEDIATO
          v1.0.228 (baseline física); adicional v1.0.226; físico de segurança
          v1.0.223; todas as versões anteriores permanecem publicadas.

          Procedência: run de build F3.5.6A 31260516822 (success; --publish never;
          verify + Windows verdes: suíte da fase 123 asserts — identidade, congelados
          byte-idênticos vs 1.0.228, motor puro, produtor com recibos/retry/rajada,
          espera externa com paridade main×renderer, prioridades, pins do renderer,
          Worker V64.61 em sandbox com replay idempotente e compat byte-a-byte dos
          campos legados vs baseline — rodada TAMBÉM contra o app.asar; 22 provas
          Electron REAIS do fluxo (fases, prioridades, confirmar envio server-side,
          registro WhatsApp, checklist do designer, ciclo completo até concluída);
          bateria herdada completa 32 suítes + harnesses herdados eh4/eh3/eh2/e/d/
          ch2/ch1/rte/retirada/b/ah1/a verdes; isolamento: delta SÓ nos arquivos
          autorizados vs 1.0.228 + infraestrutura de notificações DIFF-VAZIA;
          Worker V64.61-f356a-workflow deployado e com identidade confirmada em
          produção ANTES desta publicação)
          @ commit a322dc8d81acdb44bde9ea31ad686279a2adea0d
          (branch desktop/f356a-realtime-workflow-client-approval-1.0.229).
          Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.229 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.229; 1.0.228/1.0.227/1.0.226/1.0.224/1.0.223 preservadas; rollbacks 1.0.218/1.0.216 preservados)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_227_TAG" "$PRES_226_TAG" "$PRES_224_TAG" "$PRES_223_TAG" "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.229 no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228 (baseline fisica); adicional 1.0.226; fisico de seguranca 1.0.223; 1.0.227/1.0.224 preservadas; extras 1.0.218/1.0.216 ====="
