# =====================================================================
# [manual] F3.3.61-U4 — Firebase Hosting PREVIEW CHANNEL — Users fallback cutoff.
# Publica o bundle consolidado U1+U2+U3 (app/main@9ae664e) SOMENTE num CANAL PREVIEW
# efemero (nunca o canal live/producao), para validar owner-run que:
#   U1: users_write_endpoints DEFAULT ON e os 11 fallbacks diretos em /users foram
#       removidos (fluxos endpoint-only via updateUserSelf/touchUserLastSeen/
#       adminSetUserStatus/adminSetUserAdmin/changePassword/deleteMyAccount);
#   U2: fcm_token_server DEFAULT ON e os fallbacks FCM OFF em /users foram removidos
#       (register/remove/reset FCM endpoint-only; sem update({fcmTokens:[]...}),
#       sem arrayRemove(fcmTokenSaved), sem runTransaction legado);
#   U3: cleanupDeadTokens removido, sem arrayRemove.apply(null, deadTokens), ZERO
#       write direto em /users no client, e sendPush server-side (sendPushServerClient)
#       como caminho unico (push-send client legado removido);
#   Role hardening PRESERVADO: setRole read-only e self-save sem role/admin/status.
#
# FAIL-CLOSED e DORMENTE: dry_run=true por padrao (nao publica nada). Mesmo com
# dry_run=false, so executa `firebase hosting:channel:deploy` (canal preview) com
# config hosting-only dedicada; NUNCA `firebase deploy` / `--only hosting` (live) /
# functions / firestore / rules. NAO fecha /users create/update. NAO toca Card
# Premium / cloudflare-worker.js / Worker / Desktop / Android.
#
# Checkout PINADO em app/main@9ae664e; pacote = allowlist FIXA de 6 estaticos com
# hashes pinados (so index.html mudou vs S6D: ae63b99d -> 35eb24c1; os outros 5 sao
# byte-identicos). Rollback: expira sozinho (--expires 2d) ou
# `firebase hosting:channel:delete users-fallback-cutoff --project agenda-id-seven`.
# =====================================================================
name: "[manual] Firebase Hosting PREVIEW — Users fallback cutoff (app/main@9ae664e)"

on:
  workflow_dispatch:
    inputs:
      preview_channel:
        description: "Nome do canal preview (deve ser exatamente users-fallback-cutoff; nunca live/prod/main)"
        required: true
        default: "users-fallback-cutoff"
      confirm_preview_only:
        description: "Digite PUBLISH_USERS_FALLBACK_CUTOFF_PREVIEW para confirmar canal preview"
        required: true
        default: ""
      dry_run:
        description: "true = valida sem publicar (padrao); false = publica SOMENTE no canal preview"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: fb-hosting-preview-users-fallback-cutoff
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  PINNED_APPMAIN_COMMIT: "9ae664e0428fc5f265f462719536194c0084b7f5"
  PINNED_INDEX_SHA256: "35eb24c1085a86b603b224640aacfe076bde214019e7fb22fd2494887b4f459c"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Guards de input (fail-closed; canal preview exato)
        env:
          CH: ${{ github.event.inputs.preview_channel }}
          CONF: ${{ github.event.inputs.confirm_preview_only }}
          DR: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          if [ "$CONF" != "PUBLISH_USERS_FALLBACK_CUTOFF_PREVIEW" ]; then echo "::error:: confirm_preview_only != PUBLISH_USERS_FALLBACK_CUTOFF_PREVIEW"; exit 1; fi
          case "$DR" in true|false) : ;; *) echo "::error:: dry_run deve ser true|false (recebido: $DR)"; exit 1 ;; esac
          if [ "$CH" != "users-fallback-cutoff" ]; then echo "::error:: preview_channel deve ser exatamente 'users-fallback-cutoff' (recebido: $CH)"; exit 1; fi
          case "$CH" in
            live|*live*|*prod*|*production*|*main*|*appmain*) echo "::error:: preview_channel proibido (parece producao/live): $CH"; exit 1 ;;
          esac
          echo "Guards de input OK (dry_run=$DR; canal=$CH)."

      - name: Checkout (PIN app/main@9ae664e)
        uses: actions/checkout@v4
        with:
          ref: 9ae664e0428fc5f265f462719536194c0084b7f5
          fetch-depth: 0

      - name: Confirmar HEAD == PINNED_COMMIT + flags U default ON
        run: |
          set -eu
          H="$(git rev-parse HEAD)"
          [ "$H" = "$PINNED_APPMAIN_COMMIT" ] || { echo "::error:: HEAD ($H) != PINNED_APPMAIN_COMMIT ($PINNED_APPMAIN_COMMIT)"; exit 1; }
          # U1: users_write_endpoints DEFAULT ON (!== "off" + catch=>true); NAO pode ser default-OFF (==="on")
          grep -Fq 'function usersWriteEndpointsEnabled(){ try{ return lsGet("users_write_endpoints")!=="off"; }catch(_){ return true; } }' index.html || { echo "::error:: users_write_endpoints nao esta default ON"; exit 1; }
          if grep -Fq 'lsGet("users_write_endpoints")==="on"' index.html; then echo "::error:: users_write_endpoints ainda usa idioma default-OFF (===on)"; exit 1; fi
          # U2: fcm_token_server DEFAULT ON
          grep -Fq 'function fcmTokenServerEnabled(){ try{ return lsGet("fcm_token_server")!=="off"; }catch(_){ return true; } }' index.html || { echo "::error:: fcm_token_server nao esta default ON"; exit 1; }
          # U3: users_read_hardening DEFAULT ON
          grep -Fq 'function usersReadHardeningEnabled(){ try{ return lsGet("users_read_hardening")!=="off"; }catch(_){ return true; } }' index.html || { echo "::error:: users_read_hardening nao esta default ON"; exit 1; }
          echo "Pin OK ($H); users_write/fcm_token_server/users_read_hardening default ON."

      - name: Gate U1 (users_write endpoint-only; 11 fallbacks ausentes)
        run: |
          set -eu
          # nenhum ramo de escrita consulta a flag (endpoint-only; OFF nao reativa write direto)
          if grep -Fq 'if(usersWriteEndpointsEnabled()){' index.html; then echo "::error:: U1: ainda existe if(usersWriteEndpointsEnabled()){ (fallback nao removido)"; exit 1; fi
          OCC="$(grep -oE 'usersWriteEndpointsEnabled' index.html | wc -l | tr -d ' ')"
          [ "$OCC" -eq 1 ] || { echo "::error:: U1: usersWriteEndpointsEnabled aparece $OCC vez(es) (esperado 1: so a definicao)"; exit 1; }
          # os 11 payloads diretos da familia users_write devem estar AUSENTES
          for PAT in \
            'update({pass:np,salt:salt})' \
            'update({ lastSeen: Date.now() })' \
            'update({status:"ativo"})' \
            'update({admin:mk})' \
            'update({color:hex})' \
            'update({ reminderMinutes: v })' \
            'update({photo:photoUrl})' \
            'update({photo:""})' \
            'doc(me.id).update(updates)' \
            'update({pass:newHash, salt:newSalt})' \
            'status:"excluido"'; do
            if grep -Fq "$PAT" index.html; then echo "::error:: U1: fallback users_write ainda presente: $PAT"; exit 1; fi
          done
          # clients endpoint-only presentes
          for FN in updateUserSelfClient touchUserLastSeenClient adminSetUserStatusClient adminSetUserAdminClient changePasswordClient deleteMyAccountClient; do
            grep -Eq "async function ${FN}\(" index.html || { echo "::error:: U1: client ausente: $FN"; exit 1; }
          done
          echo "Gate U1 OK (endpoint-only; 11 fallbacks ausentes; 6 clients presentes)."

      - name: Gate U2 (FCM endpoint-only; fallbacks FCM OFF ausentes)
        run: |
          set -eu
          for FN in registerFcmTokenClient removeFcmTokenClient resetMyFcmTokensClient; do
            grep -Eq "async function ${FN}\(" index.html || { echo "::error:: U2: helper FCM ausente: $FN"; exit 1; }
          done
          if grep -Fq 'update({ fcmTokens: [], fcmTokenMeta: {} })' index.html; then echo "::error:: U2: fallback force-rereg presente"; exit 1; fi
          if grep -Fq 'arrayRemove(fcmTokenSaved)' index.html; then echo "::error:: U2: fallback teardown arrayRemove presente"; exit 1; fi
          if grep -Eq 'runTransaction\(' index.html; then echo "::error:: U2: runTransaction legado presente"; exit 1; fi
          # rota do endpoint reset + force-rereg endpoint-only
          grep -Fq 'const rr2 = await resetMyFcmTokensClient();' index.html || { echo "::error:: U2: force-rereg nao chama resetMyFcmTokensClient"; exit 1; }
          echo "Gate U2 OK (register/remove/reset presentes; force-rereg/teardown/tx ausentes)."

      - name: Gate U3 (push-send server-side unico; ZERO write /users no client)
        run: |
          set -eu
          if grep -Fq 'async function cleanupDeadTokens' index.html; then echo "::error:: U3: cleanupDeadTokens ainda definido"; exit 1; fi
          if grep -Fq 'arrayRemove.apply(null, deadTokens)' index.html; then echo "::error:: U3: arrayRemove.apply(null, deadTokens) presente"; exit 1; fi
          # ZERO write direto single-line em /users no client (comentarios nao casam este regex de codigo)
          if grep -Eq 'collection\("users"\)\.doc\([^)]*\)\.(update|set|delete)\(' index.html; then echo "::error:: U3: write direto single-line em /users detectado no client"; exit 1; fi
          grep -Fq 'async function sendPushServerClient(' index.html || { echo "::error:: U3: sendPushServerClient ausente"; exit 1; }
          grep -Fq 'await sendPushServerClient(_spIds' index.html || { echo "::error:: U3: sendPushToUsers nao delega ao endpoint sendPushServerClient"; exit 1; }
          echo "Gate U3 OK (cleanupDeadTokens/arrayRemove.apply ausentes; zero write /users; sendPush server-side unico)."

      - name: Gate Role hardening (setRole read-only; self-save sem role/admin/status)
        run: |
          set -eu
          grep -Eq 'field\("setRole",[^)]*,[[:space:]]*true\)' index.html || { echo "::error:: setRole nao esta read-only (field(...,true) ausente)"; exit 1; }
          grep -Fq 'function field(id, label, value, type, placeholder, readonly)' index.html || { echo "::error:: helper field() sem parametro readonly"; exit 1; }
          grep -Fq 'var updates = {name:name, phone:phone, email:email};' index.html || { echo "::error:: self-save nao usa payload allowlisted name/phone/email"; exit 1; }
          grep -Fq 'delete updates.role; delete updates.admin; delete updates.status;' index.html || { echo "::error:: defesa delete role/admin/status ausente"; exit 1; }
          if grep -Fq 'updates = {name:name, role:role' index.html; then echo "::error:: self-save ainda inclui role no updates"; exit 1; fi
          if grep -Fq '_selfPatch.role' index.html; then echo "::error:: caminho self-save ainda envia role em _selfPatch"; exit 1; fi
          echo "Role hardening OK (setRole read-only; self-save allowlisted; sem role/admin/status)."

      - name: Montar .staging-public (allowlist FIXA de 6) + hashes pinados
        run: |
          set -eu
          rm -rf .staging-public && mkdir -p .staging-public
          for f in index.html manifest.json sw.js firebase-messaging-sw.js icon-192.png icon-512.png; do
            [ -f "$f" ] || { echo "::error:: arquivo ausente: $f"; exit 1; }
            cp "$f" ".staging-public/$f"
          done
          N="$(find .staging-public -type f | wc -l)"
          [ "$N" -eq 6 ] || { echo "::error:: .staging-public tem $N arquivos (esperado 6)"; exit 1; }
          if ls .staging-public | grep -qE 'functions|scripts|\.github|firebase\.json|\.firebaserc|package|node_modules|\.env|\.md$|wrangler|cloudflare|desktop|android'; then
            echo "::error:: arquivo interno detectado em .staging-public"; exit 1
          fi
          A="$(sha256sum index.html | awk '{print $1}')"
          B="$(sha256sum .staging-public/index.html | awk '{print $1}')"
          [ "$A" = "$B" ] || { echo "::error:: index.html do pacote ($B) != do checkout ($A)"; exit 1; }
          [ "$A" = "$PINNED_INDEX_SHA256" ] || { echo "::error:: index.html ($A) != PINNED_INDEX_SHA256 ($PINNED_INDEX_SHA256)"; exit 1; }
          # PIN dos 6 hashes oficiais (app/main@9ae664e); aborta se qualquer um divergir.
          # Vs S6D so index.html mudou (ae63b99d -> 35eb24c1); os outros 5 sao byte-identicos.
          pin(){ H="$(sha256sum ".staging-public/$1" | awk '{print $1}')"; [ "$H" = "$2" ] || { echo "::error:: hash divergente em $1 ($H != $2)"; exit 1; }; }
          pin index.html               35eb24c1085a86b603b224640aacfe076bde214019e7fb22fd2494887b4f459c
          pin manifest.json            5143364eb9640fb55dc308d3ce15326452ea8b27058d2ec2898c92a9f5bd0820
          pin sw.js                    a042671afa3e9891ca6ee96449763fd4877d142fb7ea98076936916795aab003
          pin firebase-messaging-sw.js 64bb254d4dd8204a421cc4744f0f49c05c729435e0e1b26452646794229210aa
          pin icon-192.png             15dd146c151bf406d590a1f07a1950a7c82d7ceb6277a5b9ed5c0b8257fe6ba5
          pin icon-512.png             a29c86455b1ba2a6727309edb48c70a88909db772a01811a09a960c1fb3854bc
          echo ".staging-public OK (6 arquivos; index.html == checkout == PINNED; hashes pinados 6/6; sha256=$A)."

      - name: Config hosting-only dedicada (sem functions/firestore/rules/predeploy)
        run: |
          set -eu
          cat > .firebase-preview.json <<'JSON'
          {
            "hosting": {
              "public": ".staging-public",
              "ignore": ["firebase.json", ".firebase-preview.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "appAssociation": "NONE",
              "cleanUrls": false,
              "trailingSlash": false
            }
          }
          JSON
          node -e "const d=require('./.firebase-preview.json'); if(d.functions) throw 'functions'; if(d.firestore) throw 'firestore'; if(d.rules) throw 'rules'; if(d.hosting.predeploy) throw 'predeploy'; if(d.hosting.public!=='.staging-public') throw 'public'; console.log('config preview hosting-only OK')"

      - name: Montar e validar comando (channel:deploy; fail-closed; sem producao)
        env:
          CH: ${{ github.event.inputs.preview_channel }}
        run: |
          set -eu
          CMD="firebase hosting:channel:deploy $CH --project $GCP_PROJECT --config .firebase-preview.json --expires 2d --non-interactive"
          echo "comando planejado: $CMD"
          case "$CMD" in
            "firebase hosting:channel:deploy "*) : ;;
            *) echo "::error:: comando nao e hosting:channel:deploy"; exit 1 ;;
          esac
          for BAD in 'firebase deploy' 'deploy --only hosting' '--only functions' '--only firestore' '--only hosting' 'hosting:live' 'channels/live' ':live' 'firestore' 'functions' 'rules' 'cloudflare-worker' 'desktop/' 'android/'; do
            case "$CMD" in *"$BAD"*) echo "::error:: comando contem termo proibido: $BAD"; exit 1 ;; esac
          done
          printf 'PREVIEW_CMD<<EOF\n%s\nEOF\n' "$CMD" >> "$GITHUB_ENV"
          echo "Comando validado (channel:deploy; canal preview; sem prod/functions/firestore/rules)."

      - name: Publicar SOMENTE canal preview (apenas se dry_run=false)
        env:
          DR: ${{ github.event.inputs.dry_run }}
          CH: ${{ github.event.inputs.preview_channel }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          if [ "$DR" != "false" ]; then
            echo "DRY-RUN=$DR — nada publicado. Comando planejado: $PREVIEW_CMD"
            exit 0
          fi
          [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ] || { echo "::error:: service account ausente (secret)"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "::error:: credencial da service account ausente/vazia"; exit 1; }
          npm install -g firebase-tools >/dev/null 2>&1
          case "$PREVIEW_CMD" in
            "firebase hosting:channel:deploy "*) : ;;
            *) echo "::error:: comando final nao e channel:deploy — abortando"; exit 1 ;;
          esac
          echo "Executando canal preview: $PREVIEW_CMD"
          set +e
          eval "$PREVIEW_CMD" > "$RUNNER_TEMP/preview.log" 2>&1
          rc=$?
          set -e
          SAN="$GITHUB_WORKSPACE/preview-failure-log.txt"
          sed -E \
            -e 's#ya29\.[A-Za-z0-9._-]+#***TOKEN_REDACTED***#g' \
            -e 's#ey[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#***JWT_REDACTED***#g' \
            -e 's#(access_token|id_token|refresh_token|private_key_id|private_key|client_email|client_id|api_key|apikey|authorization|bearer)([":= ]+)[^,}" ]+#\1\2***REDACTED***#gI' \
            -e 's#-----BEGIN[A-Z ]*PRIVATE KEY-----#***PRIVATE_KEY_REDACTED***#g' \
            "$RUNNER_TEMP/preview.log" > "$SAN" 2>/dev/null || echo "(sanitizacao indisponivel; log bruto omitido por seguranca)" > "$SAN"
          if [ "$rc" = "0" ]; then
            grep -iE 'Channel URL|channel:|expire|version' "$SAN" || true
            echo "Canal preview publicado (efemero; --expires 2d). Rollback: firebase hosting:channel:delete $CH --project $GCP_PROJECT"
          else
            echo "::group::firebase hosting:channel:deploy — saida SANITIZADA (rc=$rc)"
            cat "$SAN" || true
            echo "::endgroup::"
            echo "::error:: hosting:channel:deploy falhou (rc=$rc) — ver log sanitizado (artifact preview-failure-log)."
            exit "$rc"
          fi

      - name: Upload log de falha (sanitizado; somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-failure-log
          path: preview-failure-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Limpeza (service account + logs temporarios)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" "$RUNNER_TEMP/preview.log" "$GITHUB_WORKSPACE/preview-failure-log.txt" 2>/dev/null || true
