# =====================================================================
# F3.5.4L — Publicacao da Desktop 1.0.202 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.202 (F3.5.4L: LEMBRETES CENTRAIS PERSISTENTES DE SLA AMARELO E VERMELHO — transforma
# EXCLUSIVAMENTE os alertas AMARELO/VERMELHO do Monitor SLA em lembretes CENTRAIS, persistentes e
# sonoros, numa JANELA PROPRIA do processo principal (!= janela premium do canto), central no monitor
# ativo, always-on-top (screen-saver) e showInactive (sem roubar foco), SEM auto-close/X/ESC/Alt+F4:
# fecha SO no botao OK, com recibo duravel gravado ANTES de fechar; fila+prioridade (vermelho mais
# antigo primeiro) + promocao amarelo->vermelho na mesma janela; som LOCAL empacotado (data URI);
# tela BLOQUEADA -> Notificacao NATIVA persistente (sem overlay sobre o lock) e reexibicao apos o
# desbloqueio quando ainda nao reconhecido; persistencia entre reload/minimizar/X/offline/suspend/
# resume/reinicio; 16 eventos sla.reminder.* sanitizados. As notificacoes COMUNS (movimentacao/
# atribuicao/task_updated/etc.) da 1.0.201 seguem INTACTAS no canto inferior direito) no canal
# consumido pelo electron-updater da producao (provider github -> release Latest nao-prerelease com
# latest.yml): a 1.0.201/1.0.200 instaladas passam a DETECTAR a 1.0.202 em Configuracoes ->
# Atualizacoes -> Verificar -> Baixar -> Instalar e reiniciar. NENHUM download manual pelo owner.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4L 30629896956 (gated, verde; --publish never):
# NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests dos
# artifacts, 5 hashes SHA-256, tag v1.0.202 no head EXATO da branch. 6 assets conforme a
# autorizacao F3.5.4L: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main e INTOCAVEL nesta fase): dispara no push DESTE arquivo
# (pipeline automatico autorizado pela F3.5.4L apos gates verdes) + workflow_dispatch p/ reexecucao.
# v1.0.201, v1.0.200, v1.0.199 e v1.0.198 permanecem PRESERVADAS (releases/tags intocadas).
# NAO builda, NAO altera codigo, NAO toca Firebase/Worker/Rules/Functions/Android.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois,
# exclusivamente pelo atualizador interno.
# =====================================================================
name: "F3.5.4L Desktop Release — 1.0.202 no canal do updater (lembretes centrais persistentes de SLA; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354l-sla-central-reminders-1.0.202"
    paths:
      - ".github/workflows/desktop-release-f354l.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4L GO tecnico; run de build (pinado abaixo) verde nos 2 jobs) ──
      RUN_ID: "30629896956"
      STABLE_SHA: "90a518b43b23fcb434a45f6f136dfdaccdad455d"
      TEST_BRANCH: "desktop/f354l-sla-central-reminders-1.0.202"
      BASE_201_SHA: "047261b7587951e0496d5f4eff0cda5998269161"
      TAG: "v1.0.202"
      TITLE: "Agenda ID Seven Desktop 1.0.202 — Lembretes Centrais de SLA"
      ART_INST: "agenda-id-seven-desktop-1.0.202-test-installer"
      ART_INST_DIGEST: "sha256:5560a01333de5619353962aaa604426f21460832d0d909f69b4bd4059daf86e1"
      ART_META: "agenda-id-seven-desktop-1.0.202-test-updatemeta"
      ART_META_DIGEST: "sha256:ed8bb51156d996d0f2be7a9878c4cbaf28a9e766f91a5750cdd864b8baa6d357"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.202-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.202-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.202-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "69da83450fda564cf139b27b7f65823d938cbd92bdfdbff53ac74d6c81c6f934"
      EXP_MSI: "863630e4d97239eba2d0554f015b718f26b949b0e31610eeaabc42b86424fbc4"
      EXP_LY: "31742b4e809fe2650386ddbb857e03405d18dc9c799c44916457cc769e5135d2"
      EXP_BM: "50390828d26acce5d3f5558153a149863e75fe377a8df9a6c923ee41bfc5c884"
      EXP_SBOM: "e9a78c14836010d2d134fc0c1efc08749167def1b97506becf26d72e7aad5eac"
      PROD_PREV_TAG: "v1.0.201"
      PROD_ROLLBACK_TAG: "v1.0.200"
      PROD_HIST_TAG: "v1.0.199"
      PROD_HIST2_TAG: "v1.0.198"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4L)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4L completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          # os commits entre o candidato buildado e o tip devem tocar APENAS este workflow de
          # release (o PRODUTO publicado e exatamente o dos bytes do run em STABLE_SHA)
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354l\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_201_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.201 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.201 na linhagem"

      - name: "Gate 3 — release v1.0.202 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.202" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.202"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.202" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.202"; exit 1; }
          grep -q "1.0.202-sla-central-persistent-reminders" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.202/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.202 — Lembretes Centrais de SLA

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações →
          Atualizações → Verificar atualizações → Baixar → Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.201 (F3.5.4L — lembretes centrais persistentes de SLA amarelo e vermelho)
          - Os alertas AMARELO e VERMELHO do Monitor SLA passam a ser apresentados como LEMBRETES
            CENTRAIS, persistentes e sonoros — não mais apenas como aviso no canto. Cada lembrete abre
            uma JANELA PRÓPRIA do aplicativo (independente da janela premium das notificações comuns),
            centralizada no monitor ativo, sempre acima das demais janelas (inclusive de outros
            programas), SEM roubar o foco do que você está fazendo.
          - Conteúdo do cartão: foto (avatar) e nome do responsável, título por nível (ATENÇÃO no
            amarelo, URGENTE no vermelho), a mensagem do alerta, o nome da tarefa, o tempo restante real
            do evento e um botão OK grande. Identidade visual por nível (âmbar x vermelho) e SOM próprio
            por nível, tocado uma única vez ao abrir (e novamente ao ser promovido de amarelo para
            vermelho).
          - PERSISTENTE e de reconhecimento OBRIGATÓRIO: a janela NÃO fecha sozinha, não tem X, não
            fecha por ESC nem por clique fora, e o Alt+F4 fica bloqueado até o reconhecimento. Ela fecha
            SOMENTE quando você clica em OK — e o recibo do reconhecimento é gravado localmente ANTES de
            fechar. Reconhecer não altera o status/conclusão/prazo da tarefa e não remove o alerta dos
            outros destinatários (cada usuário reconhece o seu).
          - FILA e PRIORIDADE: um lembrete central por vez. Se houver vários, a ordem é vermelho mais
            antigo → demais vermelhos → amarelo mais antigo → demais amarelos, com contador "N alertas
            pendentes"; o próximo aparece após o OK, sem empilhar janelas.
          - PROMOÇÃO amarelo → vermelho: se o lembrete amarelo de uma tarefa ainda estiver aberto quando
            chegar o vermelho da MESMA tarefa, a própria janela é promovida no lugar (som e
            reconhecimento vermelhos). Reconhecer o amarelo não elimina o vermelho futuro (são dois
            marcos distintos).
          - TELA BLOQUEADA: notificação NATIVA persistente do Windows (sem sobreposição de janela sobre o
            lock); o evento é preservado e, ao desbloquear, o lembrete central é reexibido se ainda não
            tiver sido reconhecido — sem duplicar.
          - PERSISTÊNCIA: um alerta não reconhecido sobrevive a recarregar, minimizar, fechar no X, ficar
            offline e reconectar, suspender/retomar, bloquear/desbloquear e reiniciar o app (enquanto o
            evento continuar válido), reaproveitando a infraestrutura de recibos já existente.
          - Som LOCAL empacotado no app (sem download em tempo de execução, sem voz humana), respeitando o
            volume do Windows.

          PRESERVAÇÃO (provado por gates no build)
          - NOTIFICAÇÕES COMUNS INTACTAS: movimentação de card, atribuição, reatribuição, conclusão,
            reabertura, task_updated e mensagens comuns continuam EXATAMENTE como na 1.0.201 — no canto
            inferior direito, sem virar modal central. Somente os alertas AMARELO/VERMELHO do Monitor SLA
            foram transformados.
          - TEMPOS CONGELADOS: início do alerta amarelo/vermelho, T-30, T-10, cálculo de startAt/dueAt,
            regras de disparo, destinatários, deduplicação e recibos persistentes — inalterados. Nada foi
            recalculado, antecipado, atrasado ou teve limite alterado.
          - REGRA DE DESTINATÁRIOS INTOCADA (byte-idêntica à 1.0.201): quem recebe, eventos de
            movimentação/conclusão/reabertura/reatribuição, ator/foto/nome, status anterior/novo, dedupKey
            e recibos persistentes (núcleo durável notifEvents/notifier/notifierA/notifStore/slaSeenUser/
            toastAck/slaScheduler/slaRules/cardsRules byte-idêntico).
          - Monitor SLA superior e sino + painel do sino (F3.5.4G), Card Premium / fluxo-cliente, colagem
            na Legenda, Cronograma (save/send F3.5.4I), edição de tarefa/prazo, tray, atualizador (channel
            latest), login/logout, agenda, roster, portal — INTOCADOS. index.html é byte-idêntico à
            1.0.201; em desktop/src/main apenas main.ts muda (classificação no HUB + inicialização do
            lembrete central), com os novos módulos slaReminder*/slareminder.html/preload/sons isolados.
          - Worker/Cloudflare/Firebase/Rules/Functions/banco: INTOCADOS. Android permanece PAUSADO.
          - Rollback: 1.0.201, 1.0.200, 1.0.199 e 1.0.198 PRESERVADAS (releases e tags intactas).

          LIMITAÇÃO REAL (documentada honestamente)
          - Com o usuário tendo clicado em "Sair" ou encerrado o processo do Agenda, NÃO existe entrega
            de notificação/lembrete em tempo real sem um Windows Service/Background Agent — que NÃO foi
            implementado nesta fase (fora de escopo). Nos demais estados suportados (focado, desfocado,
            atrás de outro programa, minimizado, tray, tela bloqueada via nativa) o lembrete central é
            apresentado.

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner (provocar um alerta amarelo
          e um vermelho do Monitor SLA e confirmar o lembrete central persistente, com foto e nome do
          responsável, som por nível, reconhecimento obrigatório pelo OK, promoção amarelo→vermelho,
          comportamento no lock-screen e ausência de regressão das notificações comuns). A publicação
          apenas disponibiliza a atualização pelo mecanismo oficial.

          Procedência: run de build F3.5.4L 30629896956 (success; --publish never; gates de verificação
          + Windows verdes, incluindo os 20 gates F3.5.4L no app.asar) @ commit
          90a518b43b23fcb434a45f6f136dfdaccdad455d (branch desktop/f354l-sla-central-reminders-1.0.202 =
          tag v1.0.201 + commits da fase). Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.202 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.202; 1.0.201 prev + 1.0.200/1.0.199/1.0.198 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.202 no canal do updater (Latest); 1.0.201/1.0.200/1.0.199/1.0.198 preservadas ====="

      - name: "Smoke do FEED DO UPDATER — exatamente o que o electron-updater consome (sem instalar)"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          # feed publico identico ao consultado pelo app (provider github, canal latest)
          curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" -o smoke/latest.yml
          [ "$(sha256sum smoke/latest.yml | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::feed latest.yml hash divergente"; exit 1; }
          grep -q "version: 1.0.202" smoke/latest.yml || { echo "::error::feed sem version 1.0.202"; exit 1; }
          grep -qE "^path: $EXE_NAME" smoke/latest.yml || { echo "::error::feed sem path do EXE"; exit 1; }
          curl -fsSL -o smoke/"$EXE_NAME" "https://github.com/$REPO/releases/latest/download/$EXE_NAME"
          [ "$(sha256sum smoke/$EXE_NAME | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::EXE do canal divergente"; exit 1; }
          curl -fsSL -o smoke/"$BM_NAME" "https://github.com/$REPO/releases/latest/download/$BM_NAME"
          [ "$(sha256sum smoke/$BM_NAME | awk '{print $1}')" = "$EXP_BM" ] || { echo "::error::blockmap do canal divergente"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' smoke/latest.yml | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "smoke/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do feed != EXE do feed"; exit 1; }
          echo "SMOKE DO UPDATER OK: 1.0.201/1.0.200 vao detectar/baixar a 1.0.202 (versao+path+sha512+blockmap integros). Nenhuma instalacao executada no CI."
