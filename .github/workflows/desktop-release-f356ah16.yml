# =====================================================================
# F3.5.6A-H16 — Publicacao da Desktop 1.0.242 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# A 1.0.241 (H15) esta correta em fluxo/timeline/cards/HERO/proxima-acao. Restava um defeito de
# LEITOR na tela Detalhes apos a aprovacao FINAL REAL do cliente (Cronograma Teste 6): badge/HERO
# "Designer entregou", status operacional "Aguardando legendas e posts", responsavel Social, botoes
# Legendas/Enviar ATIVOS, marco final sem carimbo real. Causa: DUAS autoridades de conclusao —
# isTaskCompleted (card/Cliente/timeline CORRETOS) vs isFullyComplete (Detalhes STALE com
# pendingProduction residual). CORRECAO renderer-only (index.html): operationalCol/detailState com
# PRECEDENCIA isTaskCompleted; BLOQUEIO de writes pos-conclusao (openProductionModal/
# openSendClientModal com ZERO write); Fase do cliente DISPLAY-ONLY 'Concluida'; marco final
# carimbado pela FONTE REAL. isFullyComplete NAO alterado; slaRules.js byte-identico; Worker V64.61
# INALTERADO. Distribuida EXCLUSIVAMENTE pelo updater. USA os BYTES do run de build F3.5.6A-H16
# 31426287326 (gated, verde nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e
# publica os MESMOS bytes. TUDO PINADO: run id, digests, 5 hashes SHA-256, tag v1.0.242 no head EXATO.
# ESCRITAS so via GitHub App "Agenda ID Seven Release Bot". baseline fisica 1.0.228; ROLLBACK IMEDIATO 1.0.228.
# =====================================================================
name: "F3.5.6A-H16 Desktop Release — 1.0.242 no canal do updater (conclusao final precedencia + bloqueio writes; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356ah16-final-completed-precedence-1.0.242"
    paths:
      - ".github/workflows/desktop-release-f356ah16.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A-H16; preenchida apos o run de build verde) ──
      RUN_ID: "31426287326"
      STABLE_SHA: "1e18d4c7bab034563fa4cf3cb958fc3c2149bb45"
      TEST_BRANCH: "desktop/f356ah16-final-completed-precedence-1.0.242"
      BASE_241_SHA: "50595ca1f6e1bcb92478d606d1932cfd90db658c"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      TAG: "v1.0.242"
      TITLE: "Agenda ID Seven Desktop 1.0.242 — conclusao final (Detalhes) + bloqueio de reenvio (pelo updater)"
      ART_INST: "agenda-id-seven-desktop-1.0.242-installer"
      ART_INST_DIGEST: "sha256:658dc424b475ee8455935a42df7ff2997ed166805ff705eaf266c4bb65139252"
      ART_META: "agenda-id-seven-desktop-1.0.242-updatemeta"
      ART_META_DIGEST: "sha256:dcc0697042c94327a139e50497cbb6b5d55b39b3671d8dc5400e606e858c5347"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.242-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.242-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.242-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "038bae373191b5ee6608b32d3edac24708f48cf2a6e131f5790bc8a44499eeae"
      EXP_MSI: "4fff16312e8a223668b0e9425dda3a6b30d136f362f7594c2cf180840c50cd97"
      EXP_LY: "a1d215dbc292044711e455d3a034cce1b0bf19a8e24dcf719e27e627f7b8c837"
      EXP_BM: "865f44a609480562036a704c7c84add8618ba1d85d66df2bd1bd918ac04b5370"
      EXP_SBOM: "641cc3e2fe535e15716a0f59f887941d8ef1fd331718138d5fbc5509b5f1c74c"
      PREV_LATEST_TAG: "v1.0.241"
      PRES_240_TAG: "v1.0.240"
      PRES_239_TAG: "v1.0.239"
      PRES_238_TAG: "v1.0.238"
      PRES_237_TAG: "v1.0.237"
      PRES_236_TAG: "v1.0.236"
      PRES_234_TAG: "v1.0.234"
      PRES_232_TAG: "v1.0.232"
      PRES_230_TAG: "v1.0.230"
      PRES_228_TAG: "v1.0.228"
      PROD_ROLLBACK_TAG: "v1.0.223"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A-H16)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A-H16 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356ah16\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_241_SHA" "$BASE_228_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.241/1.0.228 na linhagem"

      - name: "Gate 3 — release v1.0.242 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.242" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.242"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.242" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.242"; exit 1; }
          grep -q "1.0.242-f356ah16-final-completed-precedence" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.242/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.242 — conclusão correta na tela Detalhes + bloqueio de reenvio após a conclusão (pelo atualizador interno)

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).

          Continuação da 1.0.241. Depois que o cliente APROVA a versão final, a tela Detalhes ainda
          mostrava a tarefa como se estivesse em produção ("Designer entregou", "Aguardando legendas
          e posts", responsável Social) e mantinha os botões de Legendas/Enviar ativos — enquanto o
          card, a tela do Cliente e a linha do tempo já mostravam "Concluído". A 1.0.242 alinha a
          tela Detalhes à conclusão real e impede qualquer reenvio depois de concluída.

          O QUE MUDA vs 1.0.241 (SÓ o renderer index.html):
          - Após a aprovação final, a tela Detalhes passa a mostrar "Concluído final": status
            operacional "Concluído final", responsável "Sem pendências", próxima ação "Nenhuma
            pendência", Fase do cliente "Concluída". Os botões "Legendas e artes" e "Enviar ao
            cliente" deixam de aparecer.
          - Blindagem: mesmo por atalho, abrir "Legendas e artes" ou "Enviar ao cliente" numa tarefa
            já concluída não faz nada além de avisar "Esta tarefa já foi concluída e não pode ser
            reenviada." — ZERO gravação, nenhuma nova rodada/mensagem.
          - A linha do tempo mostra o marco final com o horário e o autor REAIS da aprovação do
            cliente (sem inventar data).

          O QUE NÃO MUDA (preservado; garantido por gate):
          - a conclusão continua exigindo a aprovação FINAL real do cliente; tarefas ainda em
            produção/aguardando seguem com os botões e o fluxo normais (nada é bloqueado antes da hora);
          - card, tela do Cliente, linha do tempo (H14), "Próxima ação" da caixa OPERAÇÃO (H15),
            workflowPhase, Designer, Central, SLA e a infra de notificações 1.0.228 seguem intactos;
            slaRules.js byte-idêntico; Worker V64.61 INALTERADO.
          Delta de produção vs 1.0.241: SOMENTE desktop/src/renderer/index.html.

          COMO VALIDAR (reutilize o Cronograma Teste 6, já concluído):
          Detalhes -> badge/HERO "Concluído final"; status operacional "Concluído final"; responsável
          "Sem pendências"; próxima ação "Nenhuma pendência"; Fase do cliente "Concluída"; os botões
          "Legendas e artes"/"Enviar ao cliente" NÃO aparecem; a linha do tempo mostra o marco final
          com o horário/autor reais da aprovação. Em caso de problema: ROLLBACK IMEDIATO v1.0.228.

          Procedencia: run de build F3.5.6A-H16 31426287326 (success; --publish never; verify + Windows
          verdes: marcadores H16 E1..E6 (presentes; legados ausentes) + isFullyComplete/
          clientApprovalPhase intactos + H15/H14/H13 preservados; nova suite
          f356ah16-final-completed-precedence (RED 23-fail na base 1.0.241 -> GREEN 41/0 na 1.0.242,
          incluindo os testes 11/12 de BLOQUEIO com ZERO write); golden master F3.4.4; isolamento:
          delta de producao vs 1.0.241 SO em index.html; slaRules.js e infra 1.0.228 byte-identicos)
          @ commit 1e18d4c7bab034563fa4cf3cb958fc3c2149bb45
          (branch desktop/f356ah16-final-completed-precedence-1.0.242). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.242 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.242; 1.0.241/240/239/238/237/236/234/232/230/228 preservadas; rollback 1.0.223 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_240_TAG" "$PRES_239_TAG" "$PRES_238_TAG" "$PRES_237_TAG" "$PRES_236_TAG" "$PRES_234_TAG" "$PRES_232_TAG" "$PRES_230_TAG" "$PRES_228_TAG" "$PROD_ROLLBACK_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.242 (conclusao final precedencia + bloqueio writes) no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228; 1.0.241/240/239/238/237/236/234/232/230/228 preservadas ====="
