# =====================================================================
# F3.5.5A — Publicacao da Desktop 1.0.217 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.217 (F3.5.5A — Acompanhamento Inteligente de Execucao: check-ins
# laranja adaptativos para tarefas de Designer, com claim/resposta SERVER-SIDE
# transacionais, autoridade unica por tarefa e feature flag OFF por padrao —
# comportamento identico a 1.0.216 ate o owner ativar manualmente).
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.5A 30937370051 (gated, verde nos 2 jobs;
# --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO:
# run id, digests dos artifacts, 5 hashes SHA-256, tag v1.0.217 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# Rollback imediato: v1.0.216 (baseline FISICAMENTE aprovada). Rollback adicional: v1.0.213.
# As versoes anteriores permanecem PRESERVADAS. A publicacao NAO significa aprovacao fisica —
# o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.5A Desktop Release — 1.0.217 no canal do updater (acompanhamento inteligente de execucao; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f355a-adaptive-execution-checkins-1.0.217"
    paths:
      - ".github/workflows/desktop-release-f355a.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.5A; run de build 30937370051 verde nos 2 jobs) ──
      RUN_ID: "30937370051"
      STABLE_SHA: "95eae380007fbc298bdd448c0fd8e104dcbf5e3b"
      TEST_BRANCH: "desktop/f355a-adaptive-execution-checkins-1.0.217"
      BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
      BASE_213_SHA: "e626d36921e269e28b74494ff51afb9c77f8d94d"
      TAG: "v1.0.217"
      TITLE: "Agenda ID Seven Desktop 1.0.217 — Acompanhamento Inteligente de Execução"
      ART_INST: "agenda-id-seven-desktop-1.0.217-installer"
      ART_INST_DIGEST: "sha256:cf6b060ee48ddec8086715c4a279849bc6db806591b7241f5e93a0ed8a28bd10"
      ART_META: "agenda-id-seven-desktop-1.0.217-updatemeta"
      ART_META_DIGEST: "sha256:fb3a45b672ce332ef2f1beb0ac2be147cecc4c43a1f6fb16589ac6aa95d38458"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.217-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.217-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.217-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "4d07b5fe1a489176aa551f7432fc962582d1fffe2e501d0ef297163fb656bc8a"
      EXP_MSI: "d0b603c40ac14727f5531679cfd0aabacda9c15be990b2dea9df0aa269489782"
      EXP_LY: "f93180f439b5573ecc7ac3aa79988a78cdaa78b7930fcab6b5348a1efb59c99c"
      EXP_BM: "1effe59bb34e4e1c3c41ca2804563d057a23b02346619cf69af1c44cf51d2183"
      EXP_SBOM: "42c5a47eb1353aea500581d95c2f07818d9a1a359cbfdf3d5f235bf462aa80dd"
      PROD_ROLLBACK_TAG: "v1.0.216"
      PROD_ROLLBACK2_TAG: "v1.0.213"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.5A)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.5A completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f355a\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP1="$(gh api "repos/$REPO/compare/$BASE_216_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP1" = "ahead" ] || [ "$CMP1" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline 1.0.216 ($CMP1)"; exit 1; }
          CMP2="$(gh api "repos/$REPO/compare/$BASE_213_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.213 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.216/1.0.213 na linhagem"

      - name: "Gate 3 — release v1.0.217 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.217" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.217"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.217" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.217"; exit 1; }
          grep -q "1.0.217-adaptive-execution-checkins" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.217/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.217 — Acompanhamento Inteligente de Execução

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.216 (F3.5.5A — Acompanhamento Inteligente de Execução)

          NOVO RECURSO (DESLIGADO POR PADRÃO) — check-ins de execução adaptativos para
          tarefas de Designer: um alerta central LARANJA ("CHECK-IN DE EXECUÇÃO",
          "Você está executando esta tarefa neste momento?") na MESMA janela central
          aprovada dos alertas amarelo/vermelho, com som próprio discreto, em marcos
          proporcionais da janela de execução (matriz determinística por duração; nunca
          dentro da zona de proteção do SLA). Respostas: SIM (observação e progresso
          opcionais) ou NÃO (Ainda não iniciei / Estou bloqueado / Aguardando material
          ou retorno / Concluí minha parte / Outro), com "Responder em 10 minutos" uma
          vez por checkpoint. Tudo registrado na Central de Detalhes, seção
          "ACOMPANHAMENTO DA EXECUÇÃO" (NUNCA visível ao cliente), e a Social Media é
          avisada em tempo real pela notificação comum premium quando há observação,
          bloqueio, espera, parte concluída ou check-in sem resposta.

          IMPORTANTE — APÓS ATUALIZAR, NADA MUDA SOZINHO: o recurso vem DESLIGADO (OFF)
          e o comportamento do app permanece IDÊNTICO ao da 1.0.216 até o owner ativar
          manualmente em Configurações -> Acompanhamento de execução (primeiro SOMBRA,
          depois ATIVO restrito ao Designer de teste; nunca global de imediato).
          O modo ATIVO exige a jornada de trabalho configurada ("Conclua a configuração
          da jornada antes de ativar os check-ins.").

          COMO FOI CONSTRUÍDO (garantias)
          - Claim e resposta de cada checkpoint são TRANSACIONAIS NO SERVIDOR (relógio
            do servidor; relógio local irrelevante): com vários computadores logados no
            mesmo Designer, SÓ UM exibe o check-in; a resposta em um invalida os demais;
            histórico único e imutável por checkpoint.
          - AUTORIDADE ÚNICA por tarefa: em nenhum cenário o Designer recebe dois
            check-ins pela mesma tarefa (o mecanismo legado é suprimido por tarefa
            quando o adaptativo assume; OFF mantém o legado exatamente como na 1.0.216).
          - Zona de proteção do SLA calculada dos limiares REAIS por setor + margem:
            check-in laranja NUNCA atrasa nem concorre com alerta amarelo/vermelho;
            alerta crítico interrompe o laranja preservando o texto já digitado.
          - PRIVACIDADE ESTRITA: o recurso usa SOMENTE sinais operacionais do próprio
            Agenda (tarefas, prazos, respostas). NÃO monitora teclado, mouse, programas,
            janelas, tela ou arquivos. Observabilidade sanitizada (sem título/cliente/
            conteúdo/UID/e-mail/token).
          - Backend: 2 novas Cloud Functions transacionais (claim/resposta) publicadas e
            validadas em produção ANTES desta versão; mudança 100% aditiva e
            retrocompatível — versões antigas do app não são afetadas.

          PRESERVAÇÃO (provado pelos gates do build e provas Electron reais)
          - TODAS as entregas aprovadas da 1.0.216: som das notificações imediatas,
            card compacto, Central de Detalhes, Copiar tema/legenda, observações
            internas, fluxo Social/Designer, portal do cliente, avatares, quadro
            Social — INTOCADAS.
          - Alertas amarelos/vermelhos, check-in de inatividade legado, fila central,
            agrupamento, deduplicação, recibos, sino, deep-link, Minhas Prioridades,
            Monitor SLA, watchdog, tray, atualizador, autenticação/persistência de
            sessão, Firebase e Android: INTOCADOS (módulos congelados byte a byte vs
            1.0.216; suítes de regressão 37+74+53+40 verdes contra o app EMPACOTADO;
            25 provas reais Electron do novo fluxo).
          - Rollback imediato: 1.0.216 (baseline fisicamente aprovada). Adicional: 1.0.213.

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows
          (atualizar pelo updater, conferir que NADA mudou com o recurso OFF, depois
          ativar SOMBRA e por fim ATIVO no Designer de teste, validando o check-in
          laranja real). A publicação não é aprovação física.

          Procedência: run de build F3.5.5A 30937370051 (success; --publish never;
          verify + Windows verdes, incluindo Gate EMPACOTADO no app.asar — strings
          literais do check-in, planner e orquestrador no pacote, som próprio presente,
          suítes 37+74 contra o renderer EMPACOTADO, módulos congelados) @ commit
          95eae380007fbc298bdd448c0fd8e104dcbf5e3b (branch
          desktop/f355a-adaptive-execution-checkins-1.0.217). Mesmos bytes; sem
          recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.217 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.217; 1.0.216 rollback imediato + 1.0.213 rollback adicional preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.217 no canal do updater (Latest); 1.0.216 rollback imediato; 1.0.213 rollback adicional preservadas ====="
