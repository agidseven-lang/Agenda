# =====================================================================
# [manual] RC Light UI — SILENT AUTO-UPDATE ACCEPTANCE (I5C.4; NADA é publicado)
# ---------------------------------------------------------------------
# I5C.4 — prova do update IN-APP 100% NÃO ASSISTIDO:
#   baseline 1.0.246 (release pública REAL; instalação automatizada = setup de QA)
#   → feed QA LOCAL (127.0.0.1; fail-closed; produção intocada)
#   → updater INTERNO (desktopAPI.updater.* / electron-updater 6.8.9)
#   → negativos (feed fora; corrompido ⇒ sha512 barra) → retry → downloaded
#   → quitAndInstall(true,true) ⇒ NSIS /S SEM WIZARD (fix b4ea7890)
#   → MONITOR de janelas/processos durante TODA a transição:
#       Setup windows = 0 · UAC(consent.exe) = 0 · SmartScreen = 0 ·
#       installer spawnado SÓ pelo updater (CommandLine contém "--updated /S")
#   → ZERO teclas sintéticas / automação de UI / cliques (gate EXTERNAL_INSTALL_INTERACTION=0)
#   → app relança sozinho (--force-run) → 1.0.247 → userData preservado
#   → Light OFF → ON/kill → same-version up_to_date → downgrade barrado.
# PRODUCT SOURCE CANDIDATO: b4ea7890 = dcc019ca + fix(updater) unattended
# (renderer byte-idêntico ao congelado bd5001b1 — fix só toca o MAIN).
# BUMP 1.0.247 EFÊMERO: só no workspace do runner (nunca comitado/publicado).
# Sem tag, sem release, sem deploy, sem publish. Execução manual apenas.
# =====================================================================
name: "[manual] RC Light UI — Silent Auto-Update Acceptance (QA)"

"on":
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PRODUCT_SOURCE_SHA: "b4ea78902f62b9000f5a5fea7b9b15a0a5304b0c"
  EXPECTED_RENDERER_SHA256: "bd5001b1ec249ecc56bc1a8b71a11be05d468dc990695c6f80ef80af00aef32f"
  QA_EPHEMERAL_VERSION: "1.0.247"
  BASELINE_TAG: "v1.0.246"
  FEED_PORT: "8879"

jobs:
  silent-autoupdate:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: "Git sem conversão CRLF"
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "PIN do PRODUCT SOURCE CANDIDATO (b4ea7890 = dcc019ca + fix updater) + provenance"
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SOURCE_SHA"
          [ "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA" ] || { echo "::error::pin falhou"; exit 1; }
          # renderer congelado NÃO muda com o fix (só MAIN): prova por bytes do objeto git
          R=$(git show "$PRODUCT_SOURCE_SHA":desktop/src/renderer/index.html | sha256sum | awk '{print $1}')
          [ "$R" = "$EXPECTED_RENDERER_SHA256" ] || { echo "::error::renderer difere do congelado (fix deveria tocar só o MAIN)"; exit 1; }
          # o ÚNICO diff de produto vs dcc019ca é o updaterService.ts
          D=$(git diff --name-only dcc019ca7acf714de0629ff11c247ad9a877626f "$PRODUCT_SOURCE_SHA" -- desktop | tr '\n' ' ')
          echo "diff de produto vs dcc019ca: $D"
          [ "$D" = "desktop/src/main/updaterService.ts " ] || { echo "::error::candidato altera mais que o updaterService"; exit 1; }

      - name: "BASELINE DE PRODUÇÃO — baixar release pública v1.0.246 + verificar SHA256SUMS"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"; cd "$RUNNER_TEMP/baseline"
          BASE="https://github.com/agidseven-lang/Agenda/releases/download/$BASELINE_TAG"
          curl -sSL -o baseline.exe "$BASE/Agenda-ID-Seven-Desktop-1.0.246-x64.exe"
          curl -sSL -o SHA256SUMS "$BASE/SHA256SUMS"
          EXP=$(grep "Agenda-ID-Seven-Desktop-1.0.246-x64.exe$" SHA256SUMS | awk '{print $1}')
          GOT=$(sha256sum baseline.exe | awk '{print $1}')
          echo "esperado(release): $EXP"; echo "obtido: $GOT"
          [ "$EXP" = "$GOT" ] || { echo "::error::baseline exe não confere com SHA256SUMS da release"; exit 1; }
          echo "BASELINE OK: release pública v1.0.246 íntegra"

      - name: "Instalar baseline (setup automatizado de QA — o UPDATE em si nunca é manual)"
        shell: powershell
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\baseline\baseline.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "baseline install exit $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 3
          $dir = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { Test-Path (Join-Path $_.FullName "Agenda ID Seven Desktop.exe") } | Select-Object -First 1
          if (-not $dir) { Write-Error "baseline não instalada"; exit 1 }
          "INSTALL_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "baseline instalada em: $($dir.FullName)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "RC QA 1.0.247 EFÊMERO — bump SÓ no workspace + build NSIS + GATE ASAR (fix presente)"
        working-directory: desktop
        run: |
          set -euo pipefail
          echo "::notice::QA-ONLY EPHEMERAL BUMP -> $QA_EPHEMERAL_VERSION (workspace do runner; source do repo INTOCADO)"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.QA_EPHEMERAL_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          node -e "const fs=require('fs');let s=fs.readFileSync('package-lock.json','utf8');s=s.replace(/\"version\": \"1\.0\.246\"/g,'\"version\": \"'+process.env.QA_EPHEMERAL_VERSION+'\"');fs.writeFileSync('package-lock.json',s);"
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis --publish never
          grep -E "^version:" dist-installer/latest.yml
          # ---- GATE ASAR QA: versão + renderer==fonte(candidato) + RC-D02=0 + flags + FIX SILENT
          EX="$RUNNER_TEMP/asarx"; rm -rf "$EX"; mkdir -p "$EX"
          npx --yes @electron/asar extract dist-installer/win-unpacked/resources/app.asar "$EX"
          PKGV=$(PKG="$EX/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.PKG,"utf8")).version)')
          [ "$PKGV" = "$QA_EPHEMERAL_VERSION" ] || { echo "::error::asar version=$PKGV"; exit 1; }
          git show "$PRODUCT_SOURCE_SHA":desktop/src/renderer/index.html > "$RUNNER_TEMP/src-index.html"
          A="$EX/src/renderer/index.html" B="$RUNNER_TEMP/src-index.html" node -e '
            const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");
            if(n(fs.readFileSync(process.env.A,"utf8"))!==n(fs.readFileSync(process.env.B,"utf8"))){console.error("renderer empacotado != fonte do candidato");process.exit(1);}
            console.log("renderer empacotado == fonte do candidato (byte-identico)");'
          C=$(grep -c 'data-mode\|Esqueci minha senha' "$EX/src/renderer/index.html" || true)
          [ "$C" = "0" ] || { echo "::error::recovery presente no asar (RC-D02)"; exit 1; }
          US="$EX/dist/main/updaterService.js"
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*false' "$US"
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"latest"' "$US"
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US"
          grep -Fq 'quitAndInstall(true, true)' "$US" || { echo "::error::fix silencioso AUSENTE no pacote"; exit 1; }
          if grep -Fq 'quitAndInstall(false' "$US"; then echo "::error::chamada assistida ainda presente"; exit 1; fi
          echo "GATE asar QA OK (versao $PKGV, renderer==fonte, RC-D02=0, flags, quitAndInstall(true,true))"

      - name: "FEED QA LOCAL fail-closed (127.0.0.1:8879 — produção não enxerga)"
        shell: powershell
        run: |
          $feed = "$env:RUNNER_TEMP\feed"
          New-Item -ItemType Directory -Force -Path $feed | Out-Null
          Copy-Item "desktop\dist-installer\latest.yml" $feed
          Copy-Item "desktop\dist-installer\Agenda-ID-Seven-Desktop-1.0.247-x64.exe" $feed
          Copy-Item "desktop\dist-installer\Agenda-ID-Seven-Desktop-1.0.247-x64.exe.blockmap" $feed
          "FEED_DIR=$feed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Start-Process python -ArgumentList "-m","http.server",$env:FEED_PORT,"--bind","127.0.0.1","--directory",$feed -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..15) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:FEED_PORT/latest.yml" -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          if (-not $ok) { Write-Error "feed local nao respondeu em 30s"; exit 1 }
          Write-Host "feed QA OK (HTTP 200)"

      - name: "Apontar a INSTÂNCIA QA para o feed (app-update.yml da instância; produção intocada)"
        shell: powershell
        run: |
          $au = Join-Path $env:INSTALL_DIR "resources\app-update.yml"
          Copy-Item $au "$au.bak"
          @"
          provider: generic
          url: http://127.0.0.1:$env:FEED_PORT
          channel: latest
          updaterCacheDirName: agenda-id-seven-desktop-updater
          "@ | Out-File -FilePath $au -Encoding utf8
          Get-Content $au

      - name: "MONITOR de interação — armar ANTES da transição (janelas Setup/UAC/SmartScreen + process tree)"
        shell: powershell
        run: |
          $mon = @'
          $stop = "$env:RUNNER_TEMP\monitor.stop"
          $out  = "$env:RUNNER_TEMP\monitor.jsonl"
          $deadline = (Get-Date).AddSeconds(900)
          while (((Get-Date) -lt $deadline) -and (-not (Test-Path $stop))) {
            $t = (Get-Date).ToString("HH:mm:ss.fff")
            $setup = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "*Setup*" } | ForEach-Object { $_.MainWindowTitle })
            $sc    = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -match "SmartScreen|protected your PC" } | ForEach-Object { $_.MainWindowTitle })
            $uac   = @(Get-Process -Name consent -ErrorAction SilentlyContinue).Count
            $inst  = @(Get-CimInstance Win32_Process -Filter "CommandLine LIKE '%--updated%'" -ErrorAction SilentlyContinue | ForEach-Object { @{ pid = $_.ProcessId; ppid = $_.ParentProcessId; name = $_.Name; cmd = $_.CommandLine } })
            $rec = @{ t = $t; setup = $setup; sc = $sc; uac = $uac; inst = $inst } | ConvertTo-Json -Compress -Depth 6
            Add-Content -Path $out -Value $rec
            Start-Sleep -Milliseconds 700
          }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\monitor.ps1" -Value $mon -Encoding utf8
          Remove-Item "$env:RUNNER_TEMP\monitor.stop" -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP\monitor.jsonl" -ErrorAction SilentlyContinue
          Start-Process powershell -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File","$env:RUNNER_TEMP\monitor.ps1" -WindowStyle Hidden
          Start-Sleep -Seconds 2
          if (-not (Test-Path "$env:RUNNER_TEMP\monitor.jsonl")) { Write-Error "monitor não iniciou"; exit 1 }
          Write-Host "monitor armado (amostragem ~700ms; Setup/SmartScreen/consent.exe/process --updated)"

      - name: "SESSÃO A IN-APP — negativos + check/download/downloaded + quitAndInstall SILENCIOSO"
        timeout-minutes: 15
        working-directory: desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm i --no-save playwright@1.47.2 --no-audit --no-fund
          cat > au-test.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs'; import path from 'path';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const FEED = process.env.FEED_DIR;
          const out = { g: {}, log: [] }; const g = out.g;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const launch = () => _electron.launch({ executablePath: exe, args: [] });

          // ---------- SESSÃO A: baseline + semear userData + negativos + fluxo até o install silencioso
          let app = await launch();
          let pg = await app.firstWindow({ timeout: 45000 });
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          const before = await pg.evaluate(() => ({
            ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null,
            upd: !!(window.desktopAPI && window.desktopAPI.updater)
          }));
          out.before = before;
          g.a1_baselineVersion = before.ver === '1.0.246';
          g.a2_updaterApi = before.upd === true;
          // semear userData p/ prova de preservação (aparência legacy + histórico)
          await pg.evaluate(() => {
            localStorage.setItem('idseven.desktop.appearance', JSON.stringify({ theme: 'dark', font: 'std', hc: false }));
            localStorage.setItem('idseven.notif.history.v1', JSON.stringify([{ eventId: 'seed1', dedupKey: 'seed1', eventType: 'flow_update', taskId: 'x', taskTitle: 'Seed', clientName: 'QA', title: 'Seed', severity: 'info', createdAt: 1, deep: 'detail/x', read: true }]));
          });
          const st = () => pg.evaluate(() => window.desktopAPI.updater.getState());
          const check = () => pg.evaluate(() => { window.desktopAPI.updater.check(); });
          const poll = async (want, ms) => { const t0 = Date.now(); for (;;) { const s = await st(); if (want.includes(s.status)) return s; if (Date.now() - t0 > ms) return s; await sleep(500); } };

          // NEG 1 — feed indisponível: check → erro honesto; app segue vivo
          fs.renameSync(path.join(FEED, 'latest.yml'), path.join(FEED, 'latest.hold'));
          await check(); let s = await poll(['error', 'up_to_date', 'update_available'], 20000);
          out.neg1 = s.status;
          g.n1_feedDownHonest = s.status === 'error';
          g.n1_appAlive = await pg.evaluate(() => !!document.body);
          fs.renameSync(path.join(FEED, 'latest.hold'), path.join(FEED, 'latest.yml'));

          // CHECK real — update disponível 1.0.247
          await check(); s = await poll(['update_available'], 30000);
          out.avail = { status: s.status, version: s.availableVersion, size: s.sizeBytes };
          g.b1_updateAvailable = s.status === 'update_available' && s.availableVersion === '1.0.247';

          // NEG 2 — artefato CORROMPIDO: sha512 barra e nada instala
          const exeName = 'Agenda-ID-Seven-Desktop-1.0.247-x64.exe';
          fs.copyFileSync(path.join(FEED, exeName), path.join(FEED, exeName + '.good'));
          fs.writeFileSync(path.join(FEED, exeName), Buffer.from('CORRUPT-QA-ARTIFACT'));
          await pg.evaluate(() => { window.desktopAPI.updater.download(); });   // fire-and-forget (padrão da UI real)
          s = await poll(['error', 'downloaded'], 90000);
          out.neg2 = { status: s.status, err: s.error };
          g.n2_corruptRejected = s.status === 'error';
          fs.copyFileSync(path.join(FEED, exeName + '.good'), path.join(FEED, exeName));

          // RETRY íntegro → downloaded
          await check(); s = await poll(['update_available'], 30000);
          g.b2_retryAvailable = s.status === 'update_available';
          await pg.evaluate(() => { window.desktopAPI.updater.download(); });
          let sawProgress = false;
          { const t0 = Date.now(); for (;;) { const x = await st(); if (x.status === 'downloading' && x.progress && x.progress.percent > 0) sawProgress = true; if (x.status === 'downloaded') { s = x; break; } if (x.status === 'error') { s = x; break; } if (Date.now() - t0 > 120000) { s = x; break; } await sleep(400); } }
          out.dl = { status: s.status, progressSeen: sawProgress };
          g.b3_downloaded = s.status === 'downloaded';
          g.b4_progressOrInstant = sawProgress === true || s.status === 'downloaded';

          // INSTALL — ÚNICO iniciador: o updater (quitAndInstall(true,true) ⇒ NSIS /S sem wizard).
          // NENHUMA interação externa acontece daqui em diante (monitor do runner prova).
          pg.evaluate(() => { window.desktopAPI.updater.installAndRestart(); }).catch(() => {});
          let closed = false;
          try { await Promise.race([new Promise(res => app.on('close', () => { closed = true; res(); })), sleep(30000)]); } catch (_) {}
          if (!closed) { try { const x = await st(); out.installState = x.status; closed = (x.status === 'installing'); } catch (_) { closed = true; } }
          out.appClosedByUpdater = closed;
          g.c1_installTriggered = closed === true;
          const failsA = Object.entries(g).filter(([k, v]) => !v).map(([k]) => k);
          out.fails = failsA;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/au-sessionA.json', JSON.stringify(out));   // ANTES de qualquer close
          console.log(JSON.stringify(out, null, 1));
          try { await Promise.race([app.close(), sleep(4000)]); } catch (_) {}
          if (failsA.length) { console.error('FAILS A:', failsA); }
          process.exit(failsA.length ? 1 : 0);
          EOF
          node au-test.mjs

      - name: "TRANSIÇÃO SILENCIOSA — aguardar instalação SEM tocar em nada + gates do monitor"
        timeout-minutes: 8
        shell: powershell
        run: |
          $qaAsar = "desktop\dist-installer\win-unpacked\resources\app.asar"
          $target = (Get-FileHash $qaAsar -Algorithm SHA256).Hash
          Write-Host "hash esperado (asar 1.0.247 QA): $target"
          $deadline = (Get-Date).AddSeconds(240)
          $done = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            # ZERO interação: este loop APENAS LÊ o hash do asar instalado.
            $asar = Join-Path $env:INSTALL_DIR "resources\app.asar"
            if (Test-Path $asar) {
              try { $h = (Get-FileHash $asar -Algorithm SHA256 -ErrorAction Stop).Hash; if ($h -eq $target) { $done = $true; break } } catch { }
            }
          }
          $ev = @{ silentInstalled = $done }
          if (-not $done) {
            Write-Host "janelas visíveis (diagnóstico):"
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host ("  [{0}] {1}" -f $_.ProcessName, $_.MainWindowTitle) }
          } else {
            Write-Host "UPDATE SILENCIOSO INSTALADO: asar instalado == asar 1.0.247 (hash exato), zero input"
          }
          # --force-run: o updater relança o app sozinho — registrar o relaunch
          $relaunch = $false
          foreach ($i in 1..15) {
            Start-Sleep -Seconds 2
            if (Get-Process -Name "Agenda ID Seven Desktop" -ErrorAction SilentlyContinue) { $relaunch = $true; break }
          }
          $ev.forceRunRelaunch = $relaunch
          # parar o monitor e agregar as amostras da transição inteira
          New-Item -ItemType File -Path "$env:RUNNER_TEMP\monitor.stop" -Force | Out-Null
          Start-Sleep -Seconds 2
          $lines = Get-Content "$env:RUNNER_TEMP\monitor.jsonl" -ErrorAction SilentlyContinue
          $setupSamples = 0; $scSamples = 0; $uacSamples = 0; $instCmds = @{}
          foreach ($ln in $lines) {
            try { $r = $ln | ConvertFrom-Json } catch { continue }
            if ($r.setup -and $r.setup.Count -gt 0) { $setupSamples++ }
            if ($r.sc -and $r.sc.Count -gt 0) { $scSamples++ }
            if ($r.uac -gt 0) { $uacSamples++ }
            foreach ($p in @($r.inst)) { if ($p -and $p.cmd) { $instCmds[[string]$p.cmd] = @{ pid = $p.pid; ppid = $p.ppid; name = $p.name } } }
          }
          $ev.samples = @($lines).Count
          $ev.setupWindowSamples = $setupSamples
          $ev.smartscreenSamples = $scSamples
          $ev.uacSamples = $uacSamples
          $ev.installerProcesses = @($instCmds.GetEnumerator() | ForEach-Object { @{ cmd = $_.Key; pid = $_.Value.pid; ppid = $_.Value.ppid; name = $_.Value.name } })
          $updaterSpawn = $false
          foreach ($k in $instCmds.Keys) { if (($k -like "*--updated*") -and ($k -like "*/S*") -and ($k -like "*1.0.247*")) { $updaterSpawn = $true } }
          $ev.installerCmdHasSilentUpdated = $updaterSpawn
          $ev | ConvertTo-Json -Depth 6 | Out-File -FilePath "$env:RUNNER_TEMP\silent-transition.json" -Encoding utf8
          Write-Host ("monitor: {0} amostras · setupWins={1} · smartscreen={2} · uac={3} · installers={4}" -f $ev.samples, $setupSamples, $scSamples, $uacSamples, $ev.installerProcesses.Count)
          foreach ($p in $ev.installerProcesses) { Write-Host ("  installer: pid={0} ppid={1} cmd={2}" -f $p.pid, $p.ppid, $p.cmd) }
          # GATES fail-closed
          if (-not $done) { Write-Error "instalação silenciosa não concluiu no tempo"; exit 1 }
          if ($setupSamples -ne 0) { Write-Error "FAIL: janela de Setup visível durante a transição ($setupSamples amostras) — update NÃO é unattended"; exit 1 }
          if ($uacSamples -ne 0) { Write-Error "FAIL: prompt UAC (consent.exe) durante a transição"; exit 1 }
          if ($scSamples -ne 0) { Write-Error "FAIL: SmartScreen durante a transição"; exit 1 }
          if (-not $updaterSpawn) { Write-Error "FAIL: processo do installer com '--updated /S' não observado (evidência de spawn pelo updater ausente)"; exit 1 }
          if (-not $relaunch) { Write-Error "FAIL: app não relançou sozinho (--force-run)"; exit 1 }
          Write-Host "TRANSIÇÃO SILENCIOSA OK: instalado + relançado sem NENHUMA janela/prompt/input"
          # encerra instâncias p/ a sessão B controlada (cleanup pós-prova; não é interação de instalação)
          Get-Process | Where-Object { $_.ProcessName -like "*Agenda*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: "EXTERNAL_INSTALL_INTERACTION = 0 — gate mecânico (self-grep do harness)"
        run: |
          set -euo pipefail
          WF=".github/workflows/desktop-test-1.0.246-silent-autoupdate.yml"
          # padrões com classes de caracteres para não casarem consigo mesmos
          V1=$(grep -cE "SendK[e]ys|AppActiv[a]te|UIAutomat[i]on|WScript\.Sh[e]ll" "$WF" || true)
          V2=$(grep -cE "msiex[e]c" "$WF" || true)
          V3=$(grep -cE "Start-Proc[e]ss.*1\.0\.247.*\.exe" "$WF" || true)
          echo "teclas-sinteticas/ativacao-de-janela/automacao-de-UI: $V1 · msi-exec: $V2 · exec direto do installer 1.0.247: $V3"
          [ "$V1" = "0" ] && [ "$V2" = "0" ] && [ "$V3" = "0" ] || { echo "::error::harness contém interação/execução externa do installer"; exit 1; }
          echo "EXTERNAL_INSTALL_INTERACTION=0 (harness não envia input nem executa o installer; monitor confirma em runtime)" >> "$GITHUB_STEP_SUMMARY"

      - name: "SESSÃO B — versão nova + login + userData + Light OFF→ON→kill + same-version + downgrade"
        timeout-minutes: 15
        working-directory: desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cat > au-after.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs'; import path from 'path';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const FEED = process.env.FEED_DIR;
          const out = { g: {} }; const g = out.g;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const app = await _electron.launch({ executablePath: exe, args: [] });
          const pg = await app.firstWindow({ timeout: 45000 });
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          const a = await pg.evaluate(() => ({
            ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null,
            title: document.title,
            appear: localStorage.getItem('idseven.desktop.appearance'),
            notif: localStorage.getItem('idseven.notif.history.v1'),
            lui: document.body.classList.contains('light-ui'),
            loginPwd: !!document.querySelector('input[type="password"]'),
            recovery: (document.body.innerHTML.match(/Esqueci minha senha/g) || []).length
          }));
          out.after = a;
          g.d0_loginSurface = a.loginPwd === true;                   // F12: superfície de login real presente
          g.d0_rcd02StillZero = a.recovery === 0;                    // RC-D02 permanece 0 pós-update
          g.d1_versionAfter = a.ver === '1.0.247' && a.title.includes('1.0.247');
          const ap = JSON.parse(a.appear || '{}');
          g.d2_userDataKept = ap.theme === 'dark' && (a.notif || '').includes('seed1');
          g.d3_luiStillOff = !a.lui && ap.luiPreview !== true;       // update NÃO liga o preview
          // ON pelo mecanismo real + kill (janela como desktop real ≥1024 CSS — guard provado no run 6 da I5C.3)
          await app.evaluate(({ BrowserWindow }) => { BrowserWindow.getAllWindows()[0].setContentSize(1280, 800); });
          await sleep(400);
          out.vw = await pg.evaluate(() => window.innerWidth);
          await pg.evaluate(() => { appearSet({ luiPreview: true }); });
          await sleep(300);
          g.d4_onWorks = await pg.evaluate(() => document.body.classList.contains('light-ui') && document.body.classList.contains('desktop'));
          await pg.evaluate(() => { appearSet({ luiPreview: false }); });
          await sleep(300);
          g.d5_killWorks = await pg.evaluate(() => !document.body.classList.contains('light-ui'));
          // SAME-VERSION — feed 1.0.247 × app 1.0.247 ⇒ up_to_date
          const st = () => pg.evaluate(() => window.desktopAPI.updater.getState());
          const poll = async (want, ms) => { const t0 = Date.now(); for (;;) { const s = await st(); if (want.includes(s.status)) return s; if (Date.now() - t0 > ms) return s; await sleep(500); } };
          await pg.evaluate(() => { window.desktopAPI.updater.check(); });
          let s = await poll(['up_to_date', 'update_available', 'error'], 30000);
          out.same = s.status;
          g.e1_noSameVersionLoop = s.status === 'up_to_date';
          // DOWNGRADE — latest.yml 1.0.246 ⇒ allowDowngrade=false ⇒ up_to_date
          const ly = path.join(FEED, 'latest.yml');
          fs.writeFileSync(ly, fs.readFileSync(ly, 'utf8').replace(/1\.0\.247/g, '1.0.246'));
          await pg.evaluate(() => { window.desktopAPI.updater.check(); });
          s = await poll(['up_to_date', 'update_available', 'error'], 30000);
          out.down = s.status;
          g.e2_noDowngrade = s.status !== 'update_available';
          await pg.screenshot({ path: process.env.RUNNER_TEMP + '/AU-SILENT-AFTER-1.0.247.png' });
          const fails = Object.entries(g).filter(([k, v]) => !v).map(([k]) => k);
          out.fails = fails;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/au-sessionB.json', JSON.stringify(out));
          console.log(JSON.stringify(out, null, 1));
          try { await Promise.race([app.close(), sleep(4000)]); } catch (_) {}
          if (fails.length) { console.error('FAILS B:', fails); }
          process.exit(fails.length ? 1 : 0);
          EOF
          node au-after.mjs
          echo "SILENT AUTO-UPDATE ACCEPTANCE: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidências (JSON + monitor + screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-autoupdate-evidence
          path: |
            ${{ runner.temp }}/au-sessionA.json
            ${{ runner.temp }}/silent-transition.json
            ${{ runner.temp }}/monitor.jsonl
            ${{ runner.temp }}/au-sessionB.json
            ${{ runner.temp }}/AU-SILENT-AFTER-1.0.247.png
          if-no-files-found: warn
          retention-days: 7
