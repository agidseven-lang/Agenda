# =====================================================================
# [manual] F3.3.61-P — Firebase Hosting PREVIEW CHANNEL — users-write cutover.
# Publica app/main@eb9ba11 (cutover Web users-write, flag users_write_endpoints
# DEFAULT OFF) SOMENTE num CANAL PREVIEW efemero (nunca o canal live/producao),
# para validar o cutover com backend real (8 Functions users-write ja publicadas)
# sem afetar a populacao geral. O canario forca users_write_endpoints=on APENAS no
# preview via localStorage (origem/URL propria do canal preview -> nao afeta prod).
#
# FAIL-CLOSED e DORMENTE: dry_run=true por padrao (nao publica nada). Mesmo com
# dry_run=false, so executa `firebase hosting:channel:deploy` (canal preview) com
# config hosting-only dedicada; NUNCA `firebase deploy` / `--only hosting` (live) /
# functions / firestore / rules. NAO toca Card Premium / cloudflare-worker.js /
# Worker / Desktop / Android.
#
# Checkout PINADO em app/main@eb9ba11; pacote = allowlist FIXA de 6 estaticos com
# hashes pinados. Rollback: expira sozinho (--expires 1d) ou
# `firebase hosting:channel:delete <canal> --project agenda-id-seven`.
# =====================================================================
name: "[manual] Firebase Hosting PREVIEW — users-write cutover (app/main@eb9ba11)"

on:
  workflow_dispatch:
    inputs:
      preview_channel:
        description: "Nome do canal preview (nunca live/prod/main)"
        required: true
        default: "users-write-cutover"
      confirm_preview_only:
        description: "Digite DEPLOY_PREVIEW_ONLY para confirmar canal preview"
        required: true
        default: ""
      dry_run:
        description: "true = valida sem publicar (padrao); false = publica SOMENTE no canal preview"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: fb-hosting-preview-users-write-cutover
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  PINNED_COMMIT: "eb9ba1112d226d2caa344a3af3317f4f4f04d36e"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Guards de input (fail-closed; canal preview)
        env:
          CH: ${{ github.event.inputs.preview_channel }}
          CONF: ${{ github.event.inputs.confirm_preview_only }}
          DR: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          if [ "$CONF" != "DEPLOY_PREVIEW_ONLY" ]; then echo "::error:: confirm_preview_only != DEPLOY_PREVIEW_ONLY"; exit 1; fi
          case "$DR" in true|false) : ;; *) echo "::error:: dry_run deve ser true|false (recebido: $DR)"; exit 1 ;; esac
          if [ -z "$CH" ]; then echo "::error:: preview_channel vazio"; exit 1; fi
          case "$CH" in
            live|*live*|*prod*|*production*|*main*|*appmain*) echo "::error:: preview_channel proibido (parece producao/live): $CH"; exit 1 ;;
          esac
          echo "Guards de input OK (dry_run=$DR; canal=$CH)."

      - name: Checkout (PIN app/main@eb9ba11)
        uses: actions/checkout@v4
        with:
          ref: eb9ba1112d226d2caa344a3af3317f4f4f04d36e
          fetch-depth: 0

      - name: Confirmar HEAD == PINNED_COMMIT + flag users_write_endpoints default OFF
        run: |
          set -eu
          H="$(git rev-parse HEAD)"
          [ "$H" = "$PINNED_COMMIT" ] || { echo "::error:: HEAD ($H) != PINNED_COMMIT ($PINNED_COMMIT)"; exit 1; }
          grep -q 'lsGet("users_write_endpoints")==="on"' index.html || { echo "::error:: flag users_write_endpoints ausente/alterada"; exit 1; }
          # a flag NAO pode usar o idioma default-ON (!== "off") — deve ser default OFF
          if grep -qE 'usersWriteEndpointsEnabled\(\)\{[^}]*!==[[:space:]]*"off"' index.html; then echo "::error:: flag nao esta default OFF"; exit 1; fi
          echo "Pin OK ($H); flag users_write_endpoints presente e default OFF."

      - name: Montar .staging-public (allowlist FIXA de 6) + hashes pinados
        run: |
          set -eu
          rm -rf .staging-public && mkdir -p .staging-public
          for f in index.html manifest.json sw.js firebase-messaging-sw.js icon-192.png icon-512.png; do
            [ -f "$f" ] || { echo "::error:: arquivo ausente: $f"; exit 1; }
            cp "$f" ".staging-public/$f"
          done
          N="$(find .staging-public -type f | wc -l)"
          [ "$N" -eq 6 ] || { echo "::error:: .staging-public tem $N arquivos (esperado 6)"; exit 1; }
          if ls .staging-public | grep -qE 'functions|scripts|\.github|firebase\.json|\.firebaserc|package|node_modules|\.env|\.md$|wrangler|cloudflare|desktop'; then
            echo "::error:: arquivo interno detectado em .staging-public"; exit 1
          fi
          A="$(sha256sum index.html | awk '{print $1}')"
          B="$(sha256sum .staging-public/index.html | awk '{print $1}')"
          [ "$A" = "$B" ] || { echo "::error:: index.html do pacote ($B) != do checkout ($A)"; exit 1; }
          # PIN dos hashes oficiais (app/main@eb9ba11); aborta se qualquer um divergir.
          pin(){ H="$(sha256sum ".staging-public/$1" | awk '{print $1}')"; [ "$H" = "$2" ] || { echo "::error:: hash divergente em $1 ($H != $2)"; exit 1; }; }
          pin index.html               3e2aaf7d15cf1fb9201d813c938fb1e40659347888b72b481bcc6bf7e7cdbe81
          pin manifest.json            5143364eb9640fb55dc308d3ce15326452ea8b27058d2ec2898c92a9f5bd0820
          pin sw.js                    a042671afa3e9891ca6ee96449763fd4877d142fb7ea98076936916795aab003
          pin firebase-messaging-sw.js 64bb254d4dd8204a421cc4744f0f49c05c729435e0e1b26452646794229210aa
          pin icon-192.png             15dd146c151bf406d590a1f07a1950a7c82d7ceb6277a5b9ed5c0b8257fe6ba5
          pin icon-512.png             a29c86455b1ba2a6727309edb48c70a88909db772a01811a09a960c1fb3854bc
          echo ".staging-public OK (6 arquivos; index.html == checkout; hashes pinados 6/6; sha256=$A)."

      - name: Config hosting-only dedicada (sem functions/firestore/rules/predeploy)
        run: |
          set -eu
          cat > .firebase-preview.json <<'JSON'
          {
            "hosting": {
              "public": ".staging-public",
              "ignore": ["firebase.json", ".firebase-preview.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "appAssociation": "NONE",
              "cleanUrls": false,
              "trailingSlash": false
            }
          }
          JSON
          node -e "const d=require('./.firebase-preview.json'); if(d.functions) throw 'functions'; if(d.firestore) throw 'firestore'; if(d.rules) throw 'rules'; if(d.hosting.predeploy) throw 'predeploy'; if(d.hosting.public!=='.staging-public') throw 'public'; console.log('config preview hosting-only OK')"

      - name: Montar e validar comando (channel:deploy; fail-closed; sem producao)
        env:
          CH: ${{ github.event.inputs.preview_channel }}
        run: |
          set -eu
          CMD="firebase hosting:channel:deploy $CH --project $GCP_PROJECT --config .firebase-preview.json --expires 1d --non-interactive"
          echo "comando planejado: $CMD"
          case "$CMD" in
            "firebase hosting:channel:deploy "*) : ;;
            *) echo "::error:: comando nao e hosting:channel:deploy"; exit 1 ;;
          esac
          for BAD in 'firebase deploy' 'deploy --only hosting' '--only functions' '--only firestore' 'hosting:live' 'channels/live' ':live' 'firestore' 'functions' 'cloudflare-worker' 'desktop/'; do
            case "$CMD" in *"$BAD"*) echo "::error:: comando contem termo proibido: $BAD"; exit 1 ;; esac
          done
          printf 'PREVIEW_CMD<<EOF\n%s\nEOF\n' "$CMD" >> "$GITHUB_ENV"
          echo "Comando validado (channel:deploy; canal preview; sem prod/functions/firestore)."

      - name: Publicar SOMENTE canal preview (apenas se dry_run=false)
        env:
          DR: ${{ github.event.inputs.dry_run }}
          CH: ${{ github.event.inputs.preview_channel }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          if [ "$DR" != "false" ]; then
            echo "DRY-RUN=$DR — nada publicado. Comando planejado: $PREVIEW_CMD"
            exit 0
          fi
          [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ] || { echo "::error:: service account ausente (secret)"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "::error:: credencial da service account ausente/vazia"; exit 1; }
          npm install -g firebase-tools >/dev/null 2>&1
          case "$PREVIEW_CMD" in
            "firebase hosting:channel:deploy "*) : ;;
            *) echo "::error:: comando final nao e channel:deploy — abortando"; exit 1 ;;
          esac
          echo "Executando canal preview: $PREVIEW_CMD"
          set +e
          eval "$PREVIEW_CMD" > "$RUNNER_TEMP/preview.log" 2>&1
          rc=$?
          set -e
          SAN="$GITHUB_WORKSPACE/preview-failure-log.txt"
          sed -E \
            -e 's#ya29\.[A-Za-z0-9._-]+#***TOKEN_REDACTED***#g' \
            -e 's#ey[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#***JWT_REDACTED***#g' \
            -e 's#(access_token|id_token|refresh_token|private_key_id|private_key|client_email|client_id|api_key|apikey|authorization|bearer)([":= ]+)[^,}" ]+#\1\2***REDACTED***#gI' \
            -e 's#-----BEGIN[A-Z ]*PRIVATE KEY-----#***PRIVATE_KEY_REDACTED***#g' \
            "$RUNNER_TEMP/preview.log" > "$SAN" 2>/dev/null || echo "(sanitizacao indisponivel; log bruto omitido por seguranca)" > "$SAN"
          if [ "$rc" = "0" ]; then
            grep -iE 'Channel URL|channel:|expire|version' "$SAN" || true
            echo "Canal preview publicado (efemero; --expires 1d). Rollback: firebase hosting:channel:delete $CH --project $GCP_PROJECT"
          else
            echo "::group::firebase hosting:channel:deploy — saida SANITIZADA (rc=$rc)"
            cat "$SAN" || true
            echo "::endgroup::"
            echo "::error:: hosting:channel:deploy falhou (rc=$rc) — ver log sanitizado (artifact preview-failure-log)."
            exit "$rc"
          fi

      - name: Upload log de falha (sanitizado; somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-failure-log
          path: preview-failure-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Limpeza (service account + logs temporarios)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" "$RUNNER_TEMP/preview.log" "$GITHUB_WORKSPACE/preview-failure-log.txt" 2>/dev/null || true
