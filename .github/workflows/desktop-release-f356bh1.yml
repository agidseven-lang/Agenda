# =====================================================================
# F3.5.6B-H1 — Publicacao da Desktop 1.0.245 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Falha fisica "A3" (F3.5.6B): ao atribuir uma tarefa a um Designer, ele recebia DUAS notificacoes —
# a CANONICA e superior "Tarefa atribuida" (Categoria A legada, task_assigned) E uma SEGUNDA "Nova
# atribuicao" (workflow, WF_POLICY[DESIGNER_ASSIGNED]). Correcao 1.0.245 (1 arquivo de producao:
# desktop/src/main/workflowEvents.js): REMOVER DESIGNER_ASSIGNED de WF_POLICY -> zero toast por essa
# via (wfRecipientOk=false, buildWorkflowPayload=null; consumidor filtra antes do ingresso). PRESERVADO:
# "Tarefa atribuida" (task_assigned) intacta; ledger ev_dassign_/DESIGNER_ASSIGNED segue gravado
# (observabilidade); demais eventos do workflow notificam; renderer/notifEvents.js/workflowNotifier.ts/
# deliverNotification/slaRules.js/Worker V64.61/infra 1.0.228 INALTERADOS. Suite f356bh1 RED (base=2
# entregas) -> GREEN (candidato=1); o gate do app.asar RODOU a suite contra os BYTES EMPACOTADOS.
# USA os BYTES do run de build F3.5.6B-H1 31449877696 (gated, verde nos 2 jobs; --publish never): NAO
# RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests, 5 hashes
# SHA-256, tag v1.0.245 no head EXATO. ESCRITAS so via GitHub App "Agenda ID Seven Release Bot".
# BASELINE FISICA OFICIAL 1.0.244; ROLLBACK IMEDIATO 1.0.228.
# =====================================================================
name: "F3.5.6B-H1 Desktop Release — 1.0.245 no canal do updater (dedupe atribuicao Designer; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356bh1-designer-assigned-dedupe-1.0.245"
    paths:
      - ".github/workflows/desktop-release-f356bh1.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6B-H1; do run de build verde 31449877696) ──
      RUN_ID: "31449877696"
      STABLE_SHA: "743dfa26804a8d576a5f83f3cee53bbdae73fa79"
      TEST_BRANCH: "desktop/f356bh1-designer-assigned-dedupe-1.0.245"
      BASE_244_SHA: "28a081ca44dc5445a40fd28b7be3fe6e55b96ca4"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      TAG: "v1.0.245"
      TITLE: "Agenda ID Seven Desktop 1.0.245 — sem notificacao duplicada de atribuicao ao Designer (pelo updater)"
      ART_INST: "agenda-id-seven-desktop-1.0.245-installer"
      ART_INST_DIGEST: "sha256:3302b2d61a37279e2e200b94dc1ea42b901015c9860ece2b37c51d2605626be6"
      ART_META: "agenda-id-seven-desktop-1.0.245-updatemeta"
      ART_META_DIGEST: "sha256:7b41ed149cca518b0209dc20f27ebdfd07f1ad9878cee66ade1e098c913df68a"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.245-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.245-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.245-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "d558d4aff66f256c7a9187e226cacea347b1078ff078e5295c961afd75387692"
      EXP_MSI: "15ee76fc6b4d81aab338b412fc368dbc12897ca478fbf1a3ce067fc94b720d42"
      EXP_LY: "f96eeae2d1d0b0a6c76a999c4389a154228c2d24f5c9e5072ce03b12a6ee9472"
      EXP_BM: "d4dd68c9ed3042215944eef32373785993145961f0c774006a7d3892d8b03a96"
      EXP_SBOM: "b0acc28cf9355967c200885f12f1fb3fba2747494818f5d3cfff965c295a2e66"
      PREV_LATEST_TAG: "v1.0.244"
      PRES_243_TAG: "v1.0.243"
      PRES_242_TAG: "v1.0.242"
      PRES_241_TAG: "v1.0.241"
      PRES_240_TAG: "v1.0.240"
      PRES_238_TAG: "v1.0.238"
      PRES_236_TAG: "v1.0.236"
      PRES_232_TAG: "v1.0.232"
      PRES_230_TAG: "v1.0.230"
      PRES_228_TAG: "v1.0.228"
      PROD_ROLLBACK_TAG: "v1.0.228"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6B-H1)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6B-H1 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356bh1\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_244_SHA" "$BASE_228_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.244/1.0.228 na linhagem"

      - name: "Gate 3 — release v1.0.245 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.245" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.245"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.245" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.245"; exit 1; }
          grep -q "1.0.245-f356bh1-designer-assigned-dedupe" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.245/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.245 — sem notificacao duplicada de atribuicao ao Designer (pelo atualizador interno)

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).

          Continuação da 1.0.244. Correção pontual e de baixo risco: SÓ a política de notificação.

          O QUE MUDA vs 1.0.244 (SÓ desktop/src/main/workflowEvents.js):
          - Ao ATRIBUIR uma tarefa a um Designer, ele recebia DUAS notificações: a correta e completa
            "Tarefa atribuída" (a canônica) e uma segunda, mais simples, "Nova atribuição" (duplicada).
          - Agora chega APENAS UMA: a "Tarefa atribuída" (a canônica, preservada intacta). A segunda via
            (do fluxo de workflow) foi desligada — removida a entrada DESIGNER_ASSIGNED da tabela de
            política de notificação. Nenhum outro evento é afetado.

          O QUE NÃO MUDA (preservado; garantido por gate):
          - a notificação canônica "Tarefa atribuída" (conteúdo, destinatário = o Designer, ação
            "Abrir →", visual e som) segue idêntica;
          - o registro interno da atribuição (usado para a linha do tempo/auditoria) continua sendo
            gravado normalmente — só a notificação duplicada saiu;
          - todas as demais notificações do fluxo (aprovações, ajustes, visualizações, produção,
            "temas/legendas prontos") seguem funcionando;
          - janela premium, agrupamento, topmost, som, SLA, a tela do cliente, o Worker e a base de
            notificações 1.0.228 seguem INALTERADOS; slaRules.js byte-idêntico.
          Delta de produção vs 1.0.244: SOMENTE desktop/src/main/workflowEvents.js.

          COMO VALIDAR:
          Atribua uma tarefa a um Designer (com o Designer logado em outra máquina). O Designer deve
          receber EXATAMENTE UMA notificação — "Tarefa atribuída" — e nenhuma "Nova atribuição".
          Em caso de problema: ROLLBACK IMEDIATO v1.0.228.

          Procedencia: run de build F3.5.6B-H1 31449877696 (success; --publish never; verify + Windows
          verdes). Destaque: o gate do app.asar RODOU a suite f356bh1 contra os BYTES EMPACOTADOS —
          provando 1 unica entrega ao Designer nos bytes reais. Nova suite f356bh1-designer-assigned-dedupe
          (RED base=2 entregas -> GREEN candidato=1); regressao simetrica base x candidata = so a politica
          DESIGNER_ASSIGNED muda; isolamento: delta de producao SO em workflowEvents.js.
          @ commit 743dfa26804a8d576a5f83f3cee53bbdae73fa79
          (branch desktop/f356bh1-designer-assigned-dedupe-1.0.245). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.245 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.245; 1.0.244..1.0.228 preservadas; rollback 1.0.228 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_243_TAG" "$PRES_242_TAG" "$PRES_241_TAG" "$PRES_240_TAG" "$PRES_238_TAG" "$PRES_236_TAG" "$PRES_232_TAG" "$PRES_230_TAG" "$PRES_228_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.245 (dedupe atribuicao Designer) no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228; 1.0.244..1.0.228 preservadas ====="
