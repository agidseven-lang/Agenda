# =====================================================================
# [manual] F4.2F — Publicacao da RELEASE ESTAVEL Desktop 1.0.185 (PRODUCAO / Latest)
# ---------------------------------------------------------------------
# Publica a release ESTAVEL de PRODUCAO 1.0.185 (canal latest) usando EXCLUSIVAMENTE os BYTES ja
# produzidos no run de build F4.2F (gated, todos os steps verdes). Fonte = 1.0.184 OFICIAL @03c5893
# + SOMENTE o delta AUTORIZADO F4.2F (Firebase Auth SILENCIOSO aditivo; login/UI/SLA/notif/updater
# intocados). Substitui a 1.0.184 como Latest. NAO RECOMPILA: baixa os 2 artifacts do run e publica
# os MESMOS arquivos/bytes. TUDO PINADO (preenchido apos o build verde): run id, SHA do codigo,
# nomes+digests dos artifacts, 5 hashes SHA-256 (EXE/MSI/latest.yml/blockmap/SBOM), tag e titulo.
# ESCRITAS (tag + release + assets + Latest) via TOKEN TEMPORARIO do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho, revogado no post-step) — NENHUM RELEASE_PAT, NENHUM GITHUB_TOKEN de
# escrita. Leituras/gates via GITHUB_TOKEN read-only. Execucao SO manual (workflow_dispatch),
# autorizada pelo literal PUBLICAR-DESKTOP-1.0.185-STABLE. NAO builda/deploya/toca Firebase/Worker/
# Rules/Android/portal/Cloud Run; NAO mexe em releases/tags antigas.
# =====================================================================
name: "[manual] F4.2F Desktop Stable Release — 1.0.185 (Latest)"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.185-STABLE para autorizar"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM (preenchida apos o build F4.2F verde; ate la os placeholders bloqueiam a publicacao) ──
      RUN_ID: "30209087680"
      STABLE_SHA: "c49edc0df0888e08f39e053f23d2f22fa73c71cc"
      DESK_BRANCH: "desktop/f42f-silent-firebase-auth-prod-bridge"
      TAG: "v1.0.185"
      TITLE: "Agenda ID Seven Desktop 1.0.185 — Produção Estável (Firebase Auth silencioso)"
      ART_INST: "agenda-id-seven-desktop-1.0.185-installer"
      ART_INST_DIGEST: "sha256:9cc01b47d7f9161f0fb5eda32d3b3a9592b46353135f835a4d44ee387faf4e49"
      ART_META: "agenda-id-seven-desktop-1.0.185-updatemeta"
      ART_META_DIGEST: "sha256:6e85ac45ac2c0823bf5362596187d5e51a0bd25f31b4a8cd6a2fe2ffa3291717"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.185-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.185-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.185-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      SBOM_NAME: "SBOM-cyclonedx.json"
      EXP_EXE: "527c773e6bb4b1e1a3e3fa863b4cd06942260bc2def4f148c16f1ff6e1f0d8df"
      EXP_MSI: "2926394cecdc97344648757212cf0e0681bf2ee873beb9926c18c4272c5392d0"
      EXP_LY: "493b0f9c5d27efe14163660eed9ce9db157b7f970186d31a63dfdb63ae27dbec"
      EXP_BM: "e7c82f9206a2d1d1cbe24c090b20a68d4a82f19d4373caeab02acb45872c4c74"
      EXP_SBOM: "f017bd41e138eae802751a172f9a7518bc4bb9ec78a5d594df9cf683b9f90378"
      PROD_PREV_TAG: "v1.0.184"
      PROD_ROLLBACK_TAG: "v1.0.183"
      PROD_HIST_TAG: "v1.0.182"
    steps:
      - name: "Gate 0 — pinagem preenchida (bloqueia publicacao enquanto houver placeholder)"
        run: |
          set -euo pipefail
          for v in "$RUN_ID" "$STABLE_SHA" "$ART_INST_DIGEST" "$ART_META_DIGEST" "$EXP_EXE" "$EXP_MSI" "$EXP_LY" "$EXP_BM" "$EXP_SBOM"; do
            case "$v" in __FILL_*__) echo "::error::pinagem incompleta ($v) — preencha run/sha/digests/hashes apos o build verde. NADA publicado."; exit 1;; esac
          done
          echo "OK: pinagem completa"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "PUBLICAR-DESKTOP-1.0.185-STABLE" ] || { echo "::error::confirmacao invalida — nada publicado"; exit 1; }
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run de build completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }

      - name: "Gate 3 — STABLE_SHA e commit real e pertence a linhagem F4.2F (alvo da tag)"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$STABLE_SHA" --jq '.sha' >/dev/null || { echo "::error::commit $STABLE_SHA nao existe"; exit 1; }
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::$STABLE_SHA fora da linhagem F4.2F ($CMP)"; exit 1; }

      - name: "Gate 4 — release NAO existe; tag so pode preexistir apontando para STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" "$SBOM_NAME" SHA256SUMS; do
            test -f "pacote/$f" || { echo "::error::asset ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 6 — 5 hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["$SBOM_NAME"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.185" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.185"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml nao referencia o EXE"; exit 1; }
          grep -Eq '^channel +: latest$' pacote/VERSAO-DESKTOP.txt || { echo "::error::channel != latest"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.185/EXE) + channel=latest"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.185 — Produção Estável

          Sucessora da 1.0.184 como versão oficial (Latest), canal ESTÁVEL (latest). Atualização
          EXCLUSIVAMENTE pelo ATUALIZADOR INTERNO do app (Configurações → Atualizações → Verificar →
          Baixar → Instalar e reiniciar). Não é necessário baixar nada manualmente.

          O QUE MUDA vs 1.0.184
          - F4.2F — FIREBASE AUTHENTICATION SILENCIOSO (aditivo). Após o login server-side atual, o app
            cunha um Custom Token efêmero (issueFirebaseAuthToken, Bearer da sessão, no processo main) e
            autentica o MESMO Firebase do renderer (signInWithCustomToken), confirmando uid == sessão —
            sem qualquer mudança visual, de login ou de fluxo. Flags: ENABLED=true, REQUIRED=false.
          - Fail-open: perda de internet/timeout/endpoint indisponível NÃO bloqueiam a Desktop (a
            autenticação atual segue como autoridade do login; backoff, sem loop). Fail-closed apenas em
            segurança: uid Firebase divergente do da sessão / usuário desativado / sessão inválida
            (signOut + volta ao login; nunca mostra dados de outro usuário).
          - O Custom Token vive só em memória: nunca persistido/logado/localStorage/arquivo/DevTools.
          - Firestore Rules INALTERADAS; nenhum fluxo depende ainda de request.auth.

          PRESERVAÇÃO (zero regressão)
          - Fonte = 1.0.184 OFICIAL @03c5893 + SOMENTE o delta ADITIVO F4.2F — provado no run de build
            (region-invariance F4.2F). Login/UI/telas, notificações amarela/vermelha, SLA, tray, X/bandeja,
            Agenda/Kanban/tarefas/eventos/chats/arquivos/WhatsApp/Card Premium, portal do cliente,
            atualizador e canal stable/latest INTOCADOS. Worker J6/Android/Functions/Rules/Cloud Run
            byte-idênticos. Suítes verdes: bridge F4.2F 30/30 · SLA/fluxo/temporal Golden Masters ·
            entrega visual imediata 46/0 · harness independente 18/0 · updater state-machine 57/0 ·
            notifier/delivery-channel · auth-core hermético.
          - Rollback: 1.0.184 PRESERVADA (reinstalar / re-marcar Latest); 1.0.183/1.0.182 preservadas.

          UPDATER (produção): allowPrerelease=false, channel="latest", allowDowngrade=false (no app.asar).
          Metadata do MESMO build: latest.yml + <exe>.blockmap; app-update.yml só dentro do pacote.

          Procedência: run de build F4.2F (success); fonte desktop/f42f-silent-firebase-auth-prod-bridge
          (base 1.0.184 OFICIAL 03c5893 + delta aditivo F4.2F — provado por gate). Mesmos bytes; sem recompilar.
          Confira o SHA-256 (SHA256SUMS anexado; sha256sum -c SHA256SUMS).
          NOTAS

      - name: "Criar tag pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release ESTAVEL (prerelease=false, latest=true) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$BM_NAME" "pacote/$LY_NAME" "pacote/$SBOM_NAME" "pacote/SHA256SUMS"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (Latest=1.0.185; 1.0.184/1.0.183/1.0.182 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.185 ESTAVEL PUBLICADA e Latest; 1.0.184/1.0.183/1.0.182 preservadas ====="

      - name: "Smoke — re-baixar EXE + latest.yml + SBOM e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$LY_NAME" -p "$SBOM_NAME" -D smoke
          [ "$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$LY_NAME" | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::smoke latest.yml hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$SBOM_NAME" | awk '{print $1}')" = "$EXP_SBOM" ] || { echo "::error::smoke SBOM hash divergente"; exit 1; }
          echo "SMOKE OK: EXE + latest.yml + SBOM publicados conferem byte a byte."
