# =====================================================================
# [manual] F3.3.17-R3 — VALIDAÇÃO READ-ONLY do acabamento visual do bloco de conta
# (.sb-user) na sidebar Desktop. Playwright/Chromium headless sobre o renderer REAL,
# com NOME LONGO, medindo Hoje/Quadros/Kanban/Perfil em 1366x768/1350x689/1920x1080:
# prova .sb-user premium (altura, nome/cargo legíveis e não esmagados, acima do card de
# versão sem sobrepor, Perfil clicável) e overlays operacionais só no Kanban (F3.3.15).
# SOMENTE validação: NÃO faz build/deploy/release, NÃO altera produto/Worker/Android/notif.
# =====================================================================
name: "[manual] F3.3.17-R3 sb-user Visual Validation (read-only)"

on:
  workflow_dispatch:
  push:
    branches: [desktop/local-detail-hierarchy-v2]
    paths:
      - '.github/workflows/f3317-r3-validation.yml'
      - 'desktop/scripts/visual-qa-r3.mjs'

permissions:
  contents: read

concurrency:
  group: f3317-r3-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar Playwright (chromium)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.47.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: QA visual .sb-user (Hoje/Quadros/Kanban/Perfil × 1366/1350/1920)
        run: node desktop/scripts/visual-qa-r3.mjs
      - name: Upload evidências (screenshots + relatório)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3317-r3-validation
          path: desktop/qa-out-r3/
          if-no-files-found: error
          retention-days: 14
