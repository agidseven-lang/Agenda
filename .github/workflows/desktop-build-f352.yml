# =====================================================================
# [manual] F3.5.2 — Desktop Build (ESTAVEL 1.0.187 = 1.0.186 + Edicao de Cards; PRIVADO, sem publicar)
# ---------------------------------------------------------------------
# Build OFICIAL do candidato ESTAVEL 1.0.187 (feature "Edicao de Cards"), sobre a base 1.0.186 OFICIAL
# (@e87ef4b). Deltas F3.5.2: rename visual "Edicao de midia"->"Edicao de videos" (key edicao_midia
# PRESERVADA); 5o setor edicao_cards (aditivo); wizard + criacao em LOTE atomica; produtor de
# notificacao ISOLADO T-30/T-10 (cardsRules.js) entregue EXCLUSIVAMENTE pelo canal oficial
# deliverNotification. Card Premium/cliente/Worker/SLA dos demais setores: BYTE-IDENTICOS a 1.0.186.
# Produz EXE + MSI + latest.yml + blockmap + SHA256SUMS + SBOM; artifacts PRIVADOS. `--publish never`:
# o CI NUNCA publica; NAO cria release/tag/Latest. Esta e a PROPRIA build final da 1.0.187: apos os
# gates verdes, os MESMOS bytes/hashes serao publicados SEM rebuild (release gated, literal
# PUBLICAR-DESKTOP-1.0.187-STABLE). Gates fail-closed (todos verdes obrigatorio):
#   - F3.5.2 cards: notify + source-invariance (Card Premium byte-identico vs 1.0.186) + recipient +
#     channel-substitution (amarela->vermelha, 3 janelas, canal oficial) + packaging (app.asar);
#   - f351f-rollforward-equivalence PRESERVADO (presente + byte-identico a 1.0.186; NAO rodado como gate);
#   - golden masters SLA/fluxo/temporal + contrato movimentacao + entrega visual + updater/notifier/baseline;
#   - prova-de-versao (package.json empacotado == 1.0.187) + renderer EMPACOTADO == fonte + F4.2F AUSENTE;
#   - cardsRules.js EMPACOTADO no app.asar (SHA-256 == fonte; 1 copia; cardsEmissionsFor exportada);
#   - flags do updater no app.asar (allowPrerelease=false -> channel=latest -> allowDowngrade=false);
#   - identidade Windows (AppUserModelId/appId/close-to-tray); Authenticode (NotSigned em paridade);
#   - metadata (latest.yml 1.0.187 + blockmap + app-update.yml sem segredo) + SBOM + hashes SHA-256.
# NAO publica; NAO toca Worker/Firebase/Firestore/Rules/Functions/Android/portal. Execucao SO manual.
# =====================================================================
name: "[manual] F3.5.2 Desktop Build (stable 1.0.187 — Edicao de Cards)"

"on":
  # SOMENTE manual. Commit PINADO no proprio arquivo (checkout do SHA exato do candidato b84639d).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
      CAND_SHA: "b84639da0af95203db0b8c6b9d0335f74d56cadf" # candidato 1.0.187 (F3.5.2; pin imutavel)
      BASE_186_SHA: "e87ef4b59c4edc6c6fd6249fd7f4ac07b6413048" # Desktop 1.0.186 OFICIAL (tag v1.0.186)
    steps:
      - name: Forcar LF no checkout (Windows core.autocrlf=true quebraria harness LF-based)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          echo "git global: core.autocrlf=$(git config --global --get core.autocrlf) core.eol=$(git config --global --get core.eol)"

      - name: Checkout (SHA EXATO do candidato PINADO; history completo p/ baseline 1.0.186)
        uses: actions/checkout@v4
        with:
          ref: "b84639da0af95203db0b8c6b9d0335f74d56cadf"
          fetch-depth: 0

      - name: Gate LINE ENDINGS LF (aborta se arquivo-chave estiver CRLF no worktree)
        run: |
          set -e
          FILES="desktop/src/renderer/index.html \
                 desktop/src/main/main.ts \
                 desktop/src/main/firebase.ts \
                 desktop/src/main/bgNotify.ts \
                 desktop/src/main/slaScheduler.ts \
                 desktop/src/main/cardsRules.js"
          git ls-files --eol -- $FILES | tee "$RUNNER_TEMP/eol.txt"
          if grep -Eq 'w/(crlf|mixed)' "$RUNNER_TEMP/eol.txt"; then echo "::error:: CRLF/mixed em arquivo-chave"; exit 1; fi
          N=$(git ls-files --eol -- $FILES | wc -l | tr -d ' ')
          [ "$N" -ge 6 ] || { echo "::error:: esperados >=6 arquivos em ls-files --eol, vi $N"; exit 1; }
          echo "LINE ENDINGS: LF CONFIRMED"

      - name: Derivar versao (package.json e a fonte unica) — exige 1.0.187 exato, sem sufixo
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "versao=$APP_VERSION"
          [ "$APP_VERSION" = "1.0.187" ] || { echo "::error:: versao != 1.0.187 (ESTAVEL exige a versao exata, sem beta/canary/RC/QA)"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido ($APP_VERSION)"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci (instalacao limpa e reproduzivel)
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + updaterService + renderer + cardsRules)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Lint (tsc --noEmit — verificacao de tipos estrita)
        working-directory: ${{ env.APP_DIR }}
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      # ---------- GATES F3.5.2 (Edicao de Cards) ----------
      - name: Gate F3.5.2 CARDS (notify + source-invariance/Card-Premium + recipient + substituicao + packaging)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          for t in f352-cards-notify f352-cards-source-invariance f352-cards-recipient f352-cards-channel-substitution; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate F3.5.2 $t vermelho"; exit 1; }
          done
          echo "== f352-cards-packaging (app.asar) =="
          node scripts/f352-cards-packaging.mjs || { echo "::error:: gate de empacotamento cardsRules vermelho"; exit 1; }

      - name: Gate f351f PRESERVADO (presente + byte-identico a 1.0.186; NAO rodado como gate da feature)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          test -f scripts/f351f-rollforward-equivalence.test.mjs || { echo "::error:: f351f AUSENTE (deve permanecer preservado)"; exit 1; }
          D=$(git diff "$BASE_186_SHA" -- scripts/f351f-rollforward-equivalence.test.mjs || true)
          [ -z "$D" ] || { echo "::error:: f351f ALTERADO vs 1.0.186 (deve ser byte-identico)"; exit 1; }
          echo "f351f PRESERVADO byte-identico (nao executado como gate da feature)."

      # ---------- GATES DE PRESERVACAO (comportamento 1.0.186 inalterado) ----------
      - name: Gate PRESERVACAO — SLA/fluxo/temporal/entrega-visual/updater/notifier (Windows-safe)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          for t in f343-sla-golden-master f344-flow-golden-master f345-sla-timestamp-golden-master \
                   f344-repeated-move-contract f343-delivery-channel f343-preservation \
                   f341a-updater-state-machine f347-immediate-visual-delivery f347-independent-behavior \
                   f33E-main-notifier f33D-background-notif f33F-bg-notify f33C-assignment-toast \
                   f343-assignment-transition f343-main-scheduler f343-operational-block \
                   f3377a-r3-single-producer-clock f3377a-r4b-http-date-clock f3311-baseline-freeze; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate de preservacao $t vermelho"; exit 1; }
          done

      - name: electron-builder (NSIS + MSI + metadata do MESMO build; --publish never)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f "dist-installer/win-unpacked/resources/icon.png" || { echo "::error:: resources/icon.png AUSENTE no pacote"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.187) + renderer EMPACOTADO == fonte + F4.2F AUSENTE
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"
          test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"
          npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.187" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.187"; exit 1; }
          EX="$EXDIR/src/renderer/index.html"; SRC="src/renderer/index.html"
          test -f "$EX" || { echo "::error:: index.html ausente no asar"; exit 1; }
          EX="$EX" SRC="$SRC" node -e '
            const fs=require("fs"); const nrm=s=>String(s).replace(/\r\n/g,"\n");
            if(nrm(fs.readFileSync(process.env.EX,"utf8"))!==nrm(fs.readFileSync(process.env.SRC,"utf8"))){console.error("index.html EMPACOTADO != fonte checked-out");process.exit(1);}'
          echo "  index.html EMPACOTADO == fonte (byte-identico)"
          # F4.2F AUSENTE no pacote (base 1.0.186 e roll-forward da 1.0.184 — sem bridge de Firebase Auth)
          test ! -f "$EXDIR/src/renderer/firebaseAuthBridge.js" || { echo "::error:: firebaseAuthBridge.js presente no asar (F4.2F)"; exit 1; }
          for k in 'firebase-auth-compat' 'signInWithCustomToken' 'startFirebaseAuthBridge' 'DESKTOP_FIREBASE_AUTH'; do
            if grep -q "$k" "$EXDIR/src/renderer/index.html"; then echo "::error:: '$k' presente no renderer empacotado (F4.2F)"; exit 1; fi
          done
          echo "GATE prova-de-versao 1.0.187 + renderer==fonte + F4.2F AUSENTE OK."

      - name: Gate cardsRules EMPACOTADO no app.asar (SHA-256 == fonte; 1 copia; cardsEmissionsFor exportada)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          test -f "$EXDIR/dist/main/cardsRules.js" || { echo "::error:: dist/main/cardsRules.js AUSENTE no app.asar"; exit 1; }
          SRC_SHA=$(sha256sum src/main/cardsRules.js | awk '{print $1}')
          ASAR_SHA=$(sha256sum "$EXDIR/dist/main/cardsRules.js" | awk '{print $1}')
          echo "cardsRules.js SHA-256 fonte=$SRC_SHA asar=$ASAR_SHA"
          [ "$SRC_SHA" = "$ASAR_SHA" ] || { echo "::error:: cardsRules.js empacotado != fonte"; exit 1; }
          N=$(find "$EXDIR" -name cardsRules.js | wc -l | tr -d ' ')
          [ "$N" = "1" ] || { echo "::error:: esperado 1 cardsRules.js no asar, vi $N"; exit 1; }
          node -e 'const c=require(process.env.RUNNER_TEMP+"/asarx/dist/main/cardsRules.js"); if(typeof c.cardsEmissionsFor!=="function"){console.error("cardsEmissionsFor nao exportada");process.exit(1);}'
          # slaScheduler empacotado faz require RIGIDO de ./cardsRules (sem no-op silencioso)
          grep -q 'require("./cardsRules")' "$EXDIR/dist/main/slaScheduler.js" || { echo "::error:: slaScheduler empacotado NAO require ./cardsRules"; exit 1; }
          echo "CARDS RULES PACKAGING: VERIFIED (app.asar real)"

      - name: Gate FLAGS do updater no app.asar (allowPrerelease=false -> channel=latest -> allowDowngrade=false)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          US="$RUNNER_TEMP/asarx/dist/main/updaterService.js"
          test -f "$US" || { echo "::error:: updaterService.js ausente no app.asar"; exit 1; }
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowPrerelease != false"; exit 1; }
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"latest"' "$US" || { echo "::error:: channel != latest"; exit 1; }
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowDowngrade != false"; exit 1; }
          if grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"canary"' "$US"; then echo "::error:: channel=canary no build ESTAVEL"; exit 1; fi
          echo "GATE flags do updater no app.asar OK (stable/latest)."

      - name: Gate identidade Windows (AppUserModelId + appId + close-to-tray)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          MAINJS="$RUNNER_TEMP/asarx/dist/main/main.js"
          grep -q 'br.com.idseven.agenda.desktop' "$MAINJS" || { echo "::error:: AppUserModelId ausente"; exit 1; }
          grep -q 'setAppUserModelId' "$MAINJS" || { echo "::error:: setAppUserModelId ausente"; exit 1; }
          grep -q 'preventDefault' "$MAINJS" || { echo "::error:: close-to-tray ausente"; exit 1; }
          grep -q 'appId: br.com.idseven.agenda.desktop' electron-builder.yml || { echo "::error:: appId divergente"; exit 1; }
          echo "GATE identidade Windows OK."

      - name: Inspecao de ASSINATURA Authenticode (paridade 1.0.186 — registra o estado)
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $exe = (Get-ChildItem dist-installer -Filter 'Agenda-ID-Seven-Desktop-*-x64.exe' | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          "EXE: $exe"; "AuthenticodeStatus: $($sig.Status)"
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'NotSigned') { Write-Error "Status de assinatura inesperado: $($sig.Status)"; exit 1 }
          "PARIDADE 1.0.186: mesmo processo (sem cert -> NotSigned)."

      - name: Gate metadata de update (latest.yml 1.0.187 + blockmap + app-update.yml sem segredo)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          LY="dist-installer/latest.yml"
          test -f "$LY" || { echo "::error:: latest.yml NAO gerado (channel != latest?)"; ls -la dist-installer || true; exit 1; }
          if [ -f "dist-installer/canary.yml" ]; then echo "::error:: canary.yml gerado — canal ambiguo"; exit 1; fi
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap 2>/dev/null | head -1)
          test -n "$BM" || { echo "::error:: <exe>.blockmap NAO gerado"; exit 1; }
          AU="dist-installer/win-unpacked/resources/app-update.yml"
          test -f "$AU" || { echo "::error:: app-update.yml NAO empacotado"; exit 1; }
          EXE_PATH=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); EXE_NAME=$(basename "$EXE_PATH")
          grep -q "version: $APP_VERSION" "$LY" || { echo "::error:: latest.yml version != $APP_VERSION"; exit 1; }
          grep -qE "^path: $EXE_NAME" "$LY" || { echo "::error:: latest.yml path != $EXE_NAME"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "$LY" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "$EXE_PATH" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error:: sha512 do latest.yml != EXE"; exit 1; }
          grep -q "provider: github" "$AU" && grep -q "owner: agidseven-lang" "$AU" && grep -q "repo: Agenda" "$AU" || { echo "::error:: app-update.yml provider/owner/repo divergente"; exit 1; }
          if grep -qiE '(token|secret|password|pat)[[:space:]]*[:=][[:space:]]*[^[:space:]]' "$AU"; then echo "::error:: app-update.yml com possivel segredo"; exit 1; fi
          echo "GATE metadata OK: latest.yml 1.0.187 + app-update.yml github SEM segredo; canary.yml AUSENTE."

      - name: SBOM (CycloneDX via npm sbom) + fallback npm ls
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null
          if [ ! -s "$RUNNER_TEMP/sbom-cyclonedx.json" ]; then
            npm ls --all --json > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/sbom-cyclonedx.json"
          fi
          wc -c "$RUNNER_TEMP/sbom-cyclonedx.json"

      - name: Empacotar bundle (instalador + metadata + SBOM + hashes)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"
          cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"
          cp "$RUNNER_TEMP/sbom-cyclonedx.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "channel     : latest"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA"
            echo "candidato   : $CAND_SHA (F3.5.2 Edicao de Cards)"
            echo "baseline    : Desktop 1.0.186 OFICIAL @ $BASE_186_SHA (Card Premium byte-identico)"
            echo "origem      : F3.5.2 — rename Edicao de videos + 5o setor edicao_cards (aditivo, lote atomico) + notificacao ISOLADA T-30/T-10; Card Premium/cliente/Worker/SLA byte-identicos"
            echo "assinatura  : mesmo processo da 1.0.186 (sem code-signing -> NotSigned)"
            echo "distribuicao: PRIVADA (candidato estavel; publicacao SO via release gated apos literal PUBLICAR-DESKTOP-1.0.187-STABLE)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload installer (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.187-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload metadata + SBOM + hashes (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.187-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
