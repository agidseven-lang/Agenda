# F3.5.6A-H10 — Desktop 1.0.237 (recuperação CONTEXTUAL da team session + retomada automática).
# 1.0.236 = GO físico PARCIAL: diagnóstico durável capturou stage=no_session/requestStarted=false/
# hasSession=false/hasJwt=false. O team JWT (TTL 12h) só era emitido por senha; boot/authSelf/startApp
# NUNCA mintam o team JWT, então a confirmação caía em ensureTeamSession sem sessão e resolvia pelo
# caminho de cancelamento (tsCancel) — a intenção física do usuário NÃO é provável retrospectivamente.
# CORREÇÃO renderer-only: ensureTeamSession abre uma camada de autenticação CONTEXTUAL e NÃO-destrutiva
# (#tsAuthRoot .ts-auth-back empilhado em document.body; NUNCA reutiliza #modalRoot), preservando o modal
# "Enviar no grupo do cliente"; senha correta -> novo team JWT -> a MESMA confirmClientSend RETOMA 1x
# (sem novo clique) só após PROVAR teamJwtValid()=true -> POST. Cancelar/Esc/backdrop -> 0 POST, tarefa
# intacta. Senha errada -> permanece, 0 POST. Idempotência: 1 ação -> 1 renovação -> <=1 POST.
# MUDANÇA de produção = SOMENTE desktop/src/renderer/index.html. build GATED, --publish never.
# Publicação no Latest só no desktop-release-f356ah10.yml (mesmos bytes).
# Base técnica 1.0.236 (b7cf531). BASELINE FÍSICA 1.0.228. ROLLBACK IMEDIATO 1.0.228. Worker V64.61 INALTERADO.
name: "[push/manual] F3.5.6A-H10 — Desktop 1.0.237 (recuperação contextual da team session) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah10-team-session-recovery-1.0.237"]
    paths-ignore: [".github/workflows/desktop-release-f356ah10.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah10-team-session-recovery-1.0.237"
  BASE_236_SHA: "b7cf531afdf77ba9f94a7bcca495c3fe5254686a"
  BASE_235_SHA: "d20db3710e7368ffdc5307a5e98d509e4930890b"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.236 base técnica, 1.0.235 e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_236_SHA" "$BASE_235_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.237 (package + lock x2 + marcador H10 + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.237'){console.error('versão',p.version);process.exit(1);} for(const m of ['team-session-recovery','durable-diag-honest-timeline','confirm-send-diagnostics','confirm-send-button','single-source-real-path','single-source-sent-state']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.237"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES H10 (camada contextual não-destrutiva + retomada + idempotência + mensagens) no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # camada de autenticação CONTEXTUAL, empilhada, container próprio em document.body
          grep -qE '\.ts-auth-back\{[^}]*z-index:90' "$S"
          grep -qF "root.id='tsAuthRoot'; root.className='ts-auth-back';" "$S"
          grep -qF "document.body.appendChild(root);" "$S"
          # retomada automática só após PROVAR teamJwtValid()=true
          grep -qF "if(ok&&teamJwtValid()){ finish(true); return; }" "$S"
          # idempotência: guardas busy + settled
          grep -qF "var settled=false, busy=false;" "$S"
          grep -qF "if(busy||settled)return;" "$S"
          # wfTeamAction SILENCIOSO no no_session (o chamador dá a mensagem contextual)
          grep -qF "if(!(await ensureTeamSession())){ if(_diag)__csDiagSet({stage:'no_session'}); return {ok:false,error:'no_session'}; }" "$S"
          # mensagens contextuais dos chamadores
          grep -qF "flashToast('Envio não confirmado. A autenticação foi cancelada.',7000);" "$S"
          grep -qF "flashToast('Registro não efetuado — autenticação cancelada.');" "$S"
          # ensureTeamSession NÃO usa #modalRoot destrutivamente; senha NUNCA persistida
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function ensureTeamSession(');const j=s.indexOf('\nasync function doRegister(',i);const body=s.slice(i,j>0?j:s.length);if(/getElementById\('modalRoot'\)\.innerHTML=/.test(body)){console.error('ensureTeamSession destrói #modalRoot');process.exit(1);}if(/document\.body\.appendChild\(root\)/.test(body)===false){console.error('overlay não vai para document.body');process.exit(1);}if(/setItem\([^)]*pw|sessionStorage|clipboard/i.test(body)){console.error('senha pode ser persistida/vazada');process.exit(1);}console.log('ensureTeamSession não-destrutivo + senha não persistida OK');"
          # boot NÃO recria team JWT sem credencial: setItem('wp_team_jwt' aparece SÓ em acquireTeamSession
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const n=(s.match(/setItem\('wp_team_jwt'/g)||[]).length;if(n!==1){console.error('setItem wp_team_jwt esperado 1x, achei',n);process.exit(1);}console.log('setItem wp_team_jwt = 1 (só em acquireTeamSession) OK');"
          echo "MARCADORES H10: VERIFIED."
      - name: "Gate MARCADORES herdados H8 (A: diagnóstico durável + B: timeline honesta) preservados"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          for fn in __csDiagHashKey __csDiagSanitize __csDiagStoreRead __csDiagStoreWrite __csDiagPrune __csDiagPersist __csDiagLoad __csDiagFormat; do
            grep -q "function $fn" "$S" || { echo "::error::helper H8 ausente: $fn"; exit 1; }
          done
          grep -qF "__csDiagPersist(ctx&&ctx.id)" "$S"
          grep -qF "if(__csDiagLoad(ctx&&ctx.id)){" "$S"
          grep -qF "var txt=__csDiagFormat(d)" "$S"
          grep -qF "CONFIRM_CLIENT_SEND" "$S"
          grep -qF "24*60*60*1000" "$S"
          grep -qF 'id="btnCopyConfirmDiag" style="display:none"' "$S"
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function taskTimeline(');const j=s.indexOf('\nfunction ',i+10);const body=s.slice(i,j>0?j:s.length);const m=body.match(/const sent=[^\n]*/)[0];if(/clientReviewToken|shareToken|clientSentBy/.test(m)){console.error('taskTimeline sent AINDA usa token:',m);process.exit(1);}console.log('timeline honesta OK:',m);"
          echo "MARCADORES H8 preservados: VERIFIED."
      - name: "Gate MARCADORES herdados H6B/H5/H4/H3 preservados"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -q 'function __csDiagInit' "$S"
          grep -q 'function __csDiagSet' "$S"
          grep -q 'Copiar diagnóstico da confirmação' "$S"
          for k in "stage:'request_started'" "stage:'http_error'" "stage:'http_401'" "stage:'network_error'" "stage:'success'" "httpStatus" "workerCode" "hasSession" "hasJwt" "hasTask" "hasToken" "appVersion:"; do
            grep -qF "$k" "$S" || { echo "::error::marcador diagnóstico ausente: $k"; exit 1; }
          done
          grep -q 'id="btnConfirmSend" title=' "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');if(/id=\"btnConfirmSend\" disabled/.test(s)){console.error('botão nasce disabled');process.exit(1);}"
          grep -q 'Envio confirmado ao cliente' "$S"
          grep -q 'Não foi possível confirmar o envio ao cliente' "$S"
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$S"
          grep -q "THEMES_READY:'themes_ready'" "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function flowCanonicalSentSignal(');const j=s.indexOf('}',s.indexOf('return ',i));if(!/if\(wp\)return false;/.test(s.slice(i,j+1))){console.error('renderer flowCanonicalSentSignal SEM guard');process.exit(1);}"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/main/slaRules.js','utf8');const i=s.indexOf('function flowCanonicalSentSignal(');const j=s.indexOf('}',s.indexOf('return ',i));if(!/if\(wp\)return false;/.test(s.slice(i,j+1))){console.error('slaRules flowCanonicalSentSignal SEM guard');process.exit(1);}"
          grep -q "id: (tid ? (tid + ':') : '') + String(k), lk: String(k)" src/main/workflowEvents.js
          grep -q 'legacyCursor' dist/main/workflowNotifier.js
          echo "MARCADORES herdados H6B/H5/H4/H3: VERIFIED."
      - name: "Gate SUÍTES H10 (nova) + H8 + PIN F3.5.6A + linhagem H4/H3 + golden master F3.4.4 + H2 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356ah10-team-session-recovery.test.mjs
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL no botão (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.237 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.237 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.237 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.237 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.236 (b7cf531); src/main INALTERADO; slaRules byte-idêntico; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_236_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.236 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah10\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f356ah10-team-session-recovery\.test\.mjs$|desktop/scripts/f356ah5-red-main\.js$|desktop/scripts/(f354p-sla-decision-actions|f354vh1-session-persistence|f354wh2-immediate-notification-sound|f355a-integration|f355ah1-internal-notes|f355b-agenda-premium|f355c-script-quantity-rich-editor|f355d-cron-quantity-universal-paste|f355e-retire-modules-premium-notifications|f355eh2-reference-notification|f355eh3-global-notification-visibility|f355eh4-grouped-notification-handoff|f356a-workflow-orchestration|f356ah2-client-approvals|f356ah3-single-source-sent-state|f356ah8-durable-diagnostic|f356ah8-honest-timeline)\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H10: $BAD"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_236_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H10 não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_236_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H10 altera SOMENTE o renderer index.html"; exit 1; }
          git diff --quiet "$BASE_236_SHA"..HEAD -- desktop/src/main/slaRules.js || { echo "::error::slaRules.js alterado (paridade golden master exige byte-idêntico)"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H10: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.236; slaRules INALTERADO; infra 1.0.228 congelada)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão 1.0.237 + marcadores H10 + H8 (A+B) + H6B/H5/H4/H3 no app.asar"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.237') process.exit(1);"
          I=asar-x/src/renderer/index.html
          # H10
          grep -qE '\.ts-auth-back\{[^}]*z-index:90' "$I"
          grep -qF "root.id='tsAuthRoot'; root.className='ts-auth-back';" "$I"
          grep -qF "document.body.appendChild(root);" "$I"
          grep -qF "if(ok&&teamJwtValid()){ finish(true); return; }" "$I"
          grep -qF "if(busy||settled)return;" "$I"
          grep -qF "if(!(await ensureTeamSession())){ if(_diag)__csDiagSet({stage:'no_session'}); return {ok:false,error:'no_session'}; }" "$I"
          grep -qF "flashToast('Envio não confirmado. A autenticação foi cancelada.',7000);" "$I"
          grep -qF "flashToast('Registro não efetuado — autenticação cancelada.');" "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');const i=s.indexOf('function ensureTeamSession(');const j=s.indexOf('\nasync function doRegister(',i);const b=s.slice(i,j>0?j:s.length);if(/getElementById\('modalRoot'\)\.innerHTML=/.test(b)){console.error('pacote: ensureTeamSession destrói #modalRoot');process.exit(1);}if(/setItem\([^)]*pw|sessionStorage/i.test(b)){console.error('pacote: senha persistida');process.exit(1);}"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');const n=(s.match(/setItem\('wp_team_jwt'/g)||[]).length;if(n!==1){console.error('pacote: setItem wp_team_jwt !=1:',n);process.exit(1);}"
          # H8
          grep -q 'function __csDiagPersist' "$I"; grep -q 'function __csDiagLoad' "$I"; grep -q 'function __csDiagFormat' "$I"
          grep -qF "if(__csDiagLoad(ctx&&ctx.id)){" "$I"; grep -qF "CONFIRM_CLIENT_SEND" "$I"; grep -qF 'id="btnCopyConfirmDiag" style="display:none"' "$I"
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');const i=s.indexOf('function taskTimeline(');const j=s.indexOf('\nfunction ',i+10);const m=s.slice(i,j>0?j:s.length).match(/const sent=[^\n]*/)[0];if(/clientReviewToken|shareToken|clientSentBy/.test(m)){console.error('pacote: timeline ainda usa token');process.exit(1);}"
          # herdados
          grep -q 'id="btnConfirmSend" title=' "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');if(/id=\"btnConfirmSend\" disabled/.test(s)){console.error('pacote: botão nasce disabled');process.exit(1);}"
          grep -q 'Não foi possível confirmar o envio ao cliente' "$I"
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$I"
          grep -q "THEMES_READY:'themes_ready'" "$I"
          grep -q 'function flowCanonicalSentSignal' asar-x/dist/main/slaRules.js
          grep -q 'legacyCursor' asar-x/dist/main/workflowNotifier.js
          F356AH10_SRC=asar-x/src/renderer/index.html F356AH10_PKG=asar-x/package.json node scripts/f356ah10-team-session-recovery.test.mjs
          F356AH8_SRC=asar-x/src/renderer/index.html F356AH8_PKG=asar-x/package.json node scripts/f356ah8-durable-diagnostic.test.mjs
          F356AH8_SRC=asar-x/src/renderer/index.html F356AH8_SLARULES=asar-x/dist/main/slaRules.js F356AH8_PKG=asar-x/package.json node scripts/f356ah8-honest-timeline.test.mjs
          echo "GATE F3.5.6A-H10 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
