# =====================================================================
# [manual] F3.3.73I6C24A — ETAPA 1: secrets do Worker QA (analise + provisao)
# ---------------------------------------------------------------------
# 1) ANALISA (sanitizado) a unica credencial GCP disponivel ao pipeline
#    (GOOGLE_APPLICATION_CREDENTIALS_JSON): consegue LER Firestore? pode
#    criar service accounts dedicadas? — decisao objetiva, nunca suposta.
# 2) Se a leitura de Firestore funcionar: configura no SERVICO QA
#    (idseven-push-qa) os secrets FCM_CLIENT_EMAIL/FCM_PRIVATE_KEY/
#    FCM_PROJECT_ID (analise explicita: mesma credencial ja confiada ao
#    pipeline; uso READ no endpoint; NENHUM secret de producao do worker
#    e lido/copiado — o servico de producao nao e tocado) e um
#    TEAM_SESSION_SECRET NOVO exclusivo de QA (CSPRNG).
# 3) VALIDA ao vivo: POST /share-snapshot com a chave QA + taskId
#    inexistente => 404 task_not_found (prova a cadeia auth+Firestore
#    completa sem precisar de tarefa fisica); /team/session com
#    credencial invalida => 401 generico; seeds READY continuam servindo.
# Valores NUNCA impressos; nada e gravado em artifact; producao intacta.
# =====================================================================
name: "[manual] Worker QA C24A — secrets QA (analise + provisao + validacao)"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite SECRETS-QA-C24A para autorizar"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: worker-qa-secrets-c24a
  cancel-in-progress: false

env:
  QA_URL: https://idseven-push-qa.agidseven.workers.dev
  PROD_URL: https://idseven-push.agidseven.workers.dev
  NS_TITLE: SHARE_SNAPSHOTS_QA
  T_CRON: qacronsynthetic0000000000000000000000000001
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  secrets-qa:
    runs-on: ubuntu-latest
    steps:
      - name: "Gate — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "SECRETS-QA-C24A" ] || { echo "::error::confirmacao invalida"; exit 1; }

      - name: Checkout (worker C23)
        uses: actions/checkout@v4
        with:
          ref: worker/f3373i6c23-share-snapshot

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "A1 — analisar credencial GCP (sanitizado; nada e impresso alem de veredictos)"
        env:
          GCP_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          [ -n "$GCP_JSON" ] || { echo "::error::GOOGLE_APPLICATION_CREDENTIALS_JSON ausente no repositorio"; exit 1; }
          printf '%s' "$GCP_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          PROJ=$(jq -r '.project_id' "$RUNNER_TEMP/gcp-sa.json")
          echo "project_id: $PROJ"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null 2>&1
          TOK=$(gcloud auth print-access-token 2>/dev/null)
          [ -n "$TOK" ] || { echo "::error::falha ao obter access token da SA"; exit 1; }
          # Firestore READ? (doc inexistente: 404 = permissao OK; 403 = sem permissao)
          FS=$(curl -sS -o "$RUNNER_TEMP/fs.json" -w '%{http_code}' -H "Authorization: Bearer $TOK" \
            "https://firestore.googleapis.com/v1/projects/$PROJ/databases/(default)/documents/tasks/qa-c24a-doc-inexistente")
          echo "firestore GET doc inexistente => HTTP $FS"
          if [ "$FS" = "404" ]; then echo "FS_READ=true" >> "$GITHUB_ENV"; echo "VEREDICTO: SA TEM leitura de Firestore";
          else echo "FS_READ=false" >> "$GITHUB_ENV"; echo "VEREDICTO: SA NAO tem leitura de Firestore ($(jq -c '.error.status' "$RUNNER_TEMP/fs.json" 2>/dev/null || echo '?'))"; fi
          # pode criar SA dedicada? (list = proxy de permissao IAM; nada e criado)
          IAM=$(curl -sS -o "$RUNNER_TEMP/iam.json" -w '%{http_code}' -H "Authorization: Bearer $TOK" \
            "https://iam.googleapis.com/v1/projects/$PROJ/serviceAccounts?pageSize=1")
          echo "iam list serviceAccounts => HTTP $IAM (403 = sem gestao de SAs; criacao dedicada indisponivel ao pipeline)"

      - name: "A2 — configurar secrets do SERVICO QA (somente se leitura OK)"
        env:
          GCP_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ "$FS_READ" != "true" ]; then
            echo "::error::SA sem leitura de Firestore — secrets QA NAO configurados (bloqueio: criar SA dedicada de leitura = equipe operacional/IAM)"
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          NSID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | jq -r --arg t "$NS_TITLE" '(.result // [])[] | select(.title==$t) | .id' | head -1)
          [ -n "$NSID" ] || { echo "::error::namespace QA nao encontrado"; exit 1; }
          sed "s/__QA_NAMESPACE_ID__/$NSID/" wrangler.qa.toml > wrangler.qa.final.toml
          printf '%s' "$GCP_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          jq -r '.client_email' "$RUNNER_TEMP/gcp-sa.json" | tr -d '\n' | npx --yes wrangler@4 secret put FCM_CLIENT_EMAIL --config wrangler.qa.final.toml >/dev/null
          jq -r '.private_key'  "$RUNNER_TEMP/gcp-sa.json" | npx --yes wrangler@4 secret put FCM_PRIVATE_KEY  --config wrangler.qa.final.toml >/dev/null
          jq -r '.project_id'   "$RUNNER_TEMP/gcp-sa.json" | tr -d '\n' | npx --yes wrangler@4 secret put FCM_PROJECT_ID   --config wrangler.qa.final.toml >/dev/null
          node -e 'process.stdout.write(require("crypto").randomBytes(48).toString("base64url"))' | npx --yes wrangler@4 secret put TEAM_SESSION_SECRET --config wrangler.qa.final.toml >/dev/null
          node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64url"))' > "$RUNNER_TEMP/qa_key"
          npx --yes wrangler@4 secret put TEAM_API_KEY --config wrangler.qa.final.toml < "$RUNNER_TEMP/qa_key" >/dev/null
          echo "OK: secrets QA configurados SOMENTE no idseven-push-qa (valores nunca exibidos)"

      - name: "A3 — validar endpoint fim-a-fim (sem tarefa fisica; propagacao tolerada)"
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 120 ))
          while :; do
            C=$(curl -sS --max-time 30 -X POST -H "Content-Type: application/json" -H "X-Team-Key: $(cat "$RUNNER_TEMP/qa_key")" \
              -d '{"taskId":"qa-c24a-task-inexistente","expectedType":"cronograma"}' -o "$RUNNER_TEMP/e.json" -w '%{http_code}' "$QA_URL/share-snapshot")
            if [ "$C" = "404" ]; then break; fi
            if { [ "$C" = "401" ] || [ "$C" = "502" ]; } && [ "$(date +%s)" -lt "$DEADLINE" ]; then sleep 4; continue; fi
            echo "::error::esperava 404 task_not_found (cadeia auth+OAuth+Firestore completa); veio $C"; cat "$RUNNER_TEMP/e.json" | jq -c '{ok,error}' || true; exit 1
          done
          jq -c '{ok,error}' "$RUNNER_TEMP/e.json"
          grep -q 'task_not_found' "$RUNNER_TEMP/e.json" || { echo "::error::404 sem task_not_found"; exit 1; }
          echo "OK: POST /share-snapshot autenticou, obteve OAuth Google e consultou Firestore REAL (404 explicito p/ taskId inexistente)"
          TS=$(curl -sS --max-time 30 -X POST -H "Content-Type: application/json" -d '{"uid":"qa-nao-existe","password":"x"}' -o "$RUNNER_TEMP/ts.json" -w '%{http_code}' "$QA_URL/team/session")
          [ "$TS" = "401" ] || { echo "::error::/team/session deveria 401 generico (veio $TS)"; jq -c '{ok,error}' "$RUNNER_TEMP/ts.json" || true; exit 1; }
          grep -q 'credenciais inválidas' "$RUNNER_TEMP/ts.json" || { echo "::error::401 sem mensagem generica"; exit 1; }
          echo "OK: /team/session QA configurado (401 generico p/ credencial invalida; nenhuma credencial real usada)"
          H=$(curl -sSI --max-time 30 -A "WhatsApp/2.23.20.0" "$QA_URL/share/cronograma/$T_CRON" | tr -d '\r')
          echo "$H" | grep -qi '^x-share-task: resolved' && echo "$H" | grep -qi '^x-share-snapshot: ready' || { echo "::error::seed READY regrediu"; exit 1; }
          echo "OK: READY dos seeds preservado apos os novos secrets"

      - name: "Gate FINAL — PRODUCAO INTOCADA"
        run: |
          set -euo pipefail
          V=$(curl -sS --max-time 25 "$PROD_URL/" | jq -r '.version')
          echo "producao: $V"
          [ "$V" = "V64.59-c20-golden-contract" ] || { echo "::error::PRODUCAO MUDOU ($V)"; exit 1; }
          echo "OK: producao intacta"
