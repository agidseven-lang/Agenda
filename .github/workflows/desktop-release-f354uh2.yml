# =====================================================================
# F3.5.4U-H2 — Publicacao da Desktop 1.0.211 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.211 (F3.5.4U-H2: PROCESSAMENTO ATÔMICO do alerta central — corrige a SOBREPOSIÇÃO reprovada
# na validacao fisica da 1.0.210: ao clicar numa acao, o card antigo com botoes ficava visivel ATRAS do
# "Registrando…"). Causa PROVADA: UMA janela / UM #card / UM documento — artefato de backing-store do
# Windows/DWM disparado por win.setBounds na janela transparente VISIVEL durante o clique. Correcao: no
# processamento o renderer CONGELA a altura do #foot e NAO pede resize; o main CONGELA os bounds (center()
# early-return); a fila MORFA (hide coalescido). ZERO mudanca em controller/entrega/decisao/idle/agrupamento/
# T-30/T-10/Card Premium/updater/backend/Android (byte-identicos a 1.0.210, provado pelos gates do build).
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4U-H2 30750115358 (gated, verde nos 2 jobs; --publish
# never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests dos
# artifacts, 5 hashes SHA-256, tag v1.0.211 no head EXATO da branch. 6 assets: EXE, MSI, latest.yml,
# blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release Bot"
# (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# Baseline aprovada/rollback imediato: v1.0.208. v1.0.210 e v1.0.209 permanecem PRESERVADAS no historico
# (releases/tags intocadas), mas NAO classificadas como baseline fisicamente aprovada. v1.0.207 preservada.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.4U-H2 Desktop Release — 1.0.211 no canal do updater (processamento atomico dos alertas; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354u-h2-atomic-central-alert-processing-1.0.211"
    paths:
      - ".github/workflows/desktop-release-f354uh2.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4U-H2; run de build 30750115358 verde nos 2 jobs) ──
      RUN_ID: "30750115358"
      STABLE_SHA: "fe303b8ab9546ff00d0459b98e0e9eaab20dd8e2"
      TEST_BRANCH: "desktop/f354u-h2-atomic-central-alert-processing-1.0.211"
      BASE_210_SHA: "a3655cdbb2e974978b9a5e182e62a291a8ed5211"
      BASE_208_SHA: "db8cdca1d92cd42f3ec98aced39e6a418c4d478e"
      TAG: "v1.0.211"
      TITLE: "Agenda ID Seven Desktop 1.0.211 — Hotfix do Processamento dos Alertas"
      ART_INST: "agenda-id-seven-desktop-1.0.211-installer"
      ART_INST_DIGEST: "sha256:db34731f0db32ce3f7dfbd4fcc50de7129ca17002c251ca8cec2b8ab5fa6e5d6"
      ART_META: "agenda-id-seven-desktop-1.0.211-updatemeta"
      ART_META_DIGEST: "sha256:315bfd997a0bcb33901cc9fa1a0230bf1fbac78ba1dc2f62641b487af3fc79bf"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.211-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.211-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.211-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "3de924d6299fcc30706dc6d841f464daaf493219e63cc1eabafdeec9a9cd592a"
      EXP_MSI: "9712d4d13ed5861871179ac9296ef4bc57fefc81feb112ee4ad90aa7ad57736a"
      EXP_LY: "ff34bf33bd709abfa1878d6a679f083059ab4ff518e0fa36565bfd1755c911f0"
      EXP_BM: "9e5797c6e22559c668fabf367878695c55ceb679f1b0e90745cca6fcf2f1f78b"
      EXP_SBOM: "bd2b91f0391ed53106b39eb464bd6e3747a7a471b7be9d09a25c1b6c5c641dbc"
      PROD_PREV_TAG: "v1.0.210"
      PROD_ROLLBACK_TAG: "v1.0.208"
      PROD_HIST_TAG: "v1.0.209"
      PROD_HIST2_TAG: "v1.0.207"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4U-H2)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4U-H2 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          # commits pos-candidato so podem tocar o PROPRIO workflow de release (nao-insumo de build).
          if grep -vE '^\.github/workflows/desktop-release-f354uh2\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          # PROTECAO REFORCADA: garante que NENHUM insumo de build mudou apos STABLE_SHA (bytes publicados == build).
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_210_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.210 ($CMP2)"; exit 1; }
          CMP3="$(gh api "repos/$REPO/compare/$BASE_208_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP3" = "ahead" ] || [ "$CMP3" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.208 ($CMP3)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.210 e 1.0.208 na linhagem"

      - name: "Gate 3 — release v1.0.211 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.211" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.211"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.211" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.211"; exit 1; }
          grep -q "1.0.211-atomic-central-alert-processing" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.211/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.211 — Hotfix do Processamento dos Alertas

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.210 (F3.5.4U-H2 — processamento ATÔMICO do alerta central)
          Corrige o defeito observado na validação física da 1.0.210: ao clicar em uma ação do alerta central
          (Apenas reconhecer / Iniciar agora / Estou finalizando / Estou bloqueado / Preciso de ajuda), por
          alguns instantes o cartão anterior (com os botões, incluindo "Estou bloqueado") ficava visível ATRÁS
          do cartão compacto "Registrando…".

          - Agora o processamento é ATÔMICO: ao clicar, o MESMO cartão apenas troca a área dos botões pelo
            "Registrando…" (o cabeçalho, a tarefa e o prazo permanecem). O cartão não redimensiona nem se move
            durante o processamento, então não há mais nenhum cartão antigo aparecendo atrás — em nenhum quadro.
          - Ao reconhecer um alerta com outro na fila, a MESMA janela transita direto para o próximo (sem piscar
            o cartão anterior). Ao esvaziar a fila, a janela se fecha normalmente.
          - Vale para as 5 ações e também para o check-in de tarefa parada; em 100%, 125% e 150% de escala.

          CAUSA (comprovada) e por que a 1.0.210 não bastou
          - Não eram duas janelas nem dois cartões: é UMA janela e UM cartão. A sobreposição era um artefato do
            compositor do Windows (backing-store) provocado por um redimensionamento/recentralização da janela
            transparente no instante do clique. A correção anterior (janela única + sombra) não tocava nesse
            redimensionamento; esta versão o elimina durante o processamento.

          PRESERVAÇÃO (provado pelos gates do app.asar no build)
          - Fila, dedup, decisões de SLA, transações, destinatários, T-30/T-10/vencimento, alertas vermelhos,
            check-in, notificações comuns e agrupamento, som único, deep-link, sino, histórico, Minhas
            Prioridades, Monitor de SLA, formulários, Cronograma, Roteiro, Card Premium, atualizador, backend,
            Firebase Rules/Functions/Worker e Android: INTOCADOS. O controlador do lembrete central, o main, o
            notifEvents e as demais telas permanecem byte-idênticos à 1.0.210.
          - Rollback/baseline aprovada: 1.0.208. As versões 1.0.210 e 1.0.209 permanecem PRESERVADAS no
            histórico (releases e tags intactas), mas NÃO são baseline fisicamente aprovada. 1.0.207 preservada.

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows (clicar em cada uma das
          5 ações do alerta central e confirmar que, em nenhum quadro, o cartão antigo/os botões aparecem atrás
          do "Registrando…"; e que a fila avança sem piscar o cartão anterior). A publicação apenas disponibiliza
          a atualização pelo mecanismo oficial; não constitui aprovação física.

          Procedência: run de build F3.5.4U-H2 30750115358 (success; --publish never; jobs de verificação +
          Windows verdes, incluindo o Gate F3.5.4U-H2 EMPACOTADO no app.asar — center() congelado no
          processamento, sem resizeSelf no clique, hide coalescido, observabilidade central_alert.action_received
          sanitizada, e controller/main/notifEvents/renderers comuns congelados vs 1.0.210) @ commit
          fe303b8ab9546ff00d0459b98e0e9eaab20dd8e2 (branch desktop/f354u-h2-atomic-central-alert-processing-1.0.211).
          Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.211 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.211; 1.0.210/1.0.209 preservadas no historico + 1.0.208 rollback + 1.0.207 preservada)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.211 no canal do updater (Latest); 1.0.210/1.0.209 preservadas no historico; 1.0.208 rollback; 1.0.207 preservada ====="
