# =====================================================================
# [manual] F3.4.1A — Publicacao da PRERELEASE canario Desktop 1.0.178-canary.1
# ---------------------------------------------------------------------
# Publica a prerelease CANARIO (native updater bootstrap) do run 29747660008.
# TUDO PINADO: run id, SHA do codigo canario (alvo da tag), ids+digests dos
# artifacts, hashes SHA-256 (EXE/MSI/canary.yml/blockmap), tag e titulo.
# O job:
#   1) exige confirmacao literal (input);
#   2) valida run 29747660008 = completed/success;
#   3) confirma o head do branch canario == SHA pinado (alvo da tag);
#   4) aborta se a tag/release v1.0.178-canary.1 ja existir;
#   5) baixa os 2 artifacts (installer + updatemeta), confere ids+digests e
#      os hashes byte a byte (divergiu => aborta SEM publicar);
#   6) cria a release prerelease=true, latest=false, tag no SHA canario;
#   7) anexa 7 assets: EXE, MSI, canary.yml, blockmap, SHA256SUMS,
#      VERSAO-DESKTOP.txt, RELATORIO-DESKTOP.txt (app-update.yml NAO e asset);
#   8) pos-verifica flags/assets/target + confirma que a 1.0.177-production
#      SEGUE Latest (canario NUNCA vira latest) e as tags historicas intactas;
#   9) smoke: re-baixa EXE + canary.yml da release e reconfere os hashes.
# NAO builda, NAO deploya, NAO toca Firebase/Worker/Rules/flags, NAO mexe em
# releases/tags antigas. Sem secrets alem do GITHUB_TOKEN padrao.
# Execucao SOMENTE manual (workflow_dispatch).
# =====================================================================
name: "[manual] F3.4.1A Desktop Canary Release — 1.0.178-canary.1"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.178-CANARY.1 para autorizar"
        required: true
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      RUN_ID: "29747660008"
      CANARY_SHA: "f99bff34f31051e247aa193c788838bcde52d4b0"
      DESK_BRANCH: "desktop/f341a-native-auto-updater-canary"
      TAG: "v1.0.178-canary.1"
      TITLE: "Agenda ID Seven Desktop 1.0.178-canary.1 — Native Updater Bootstrap (CANARIO)"
      ART_INST: "agenda-id-seven-desktop-1.0.178-canary.1-installer"
      ART_INST_DIGEST: "sha256:16cf785ce3ec7c2289290773b6da32f0847f2470f51310de1bc61996dd3679b0"
      ART_META: "agenda-id-seven-desktop-1.0.178-canary.1-updatemeta"
      ART_META_DIGEST: "sha256:d44009ee0da375c1584632037a592fb1db05b15d12e63d2225c76100226d6a1c"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.178-canary.1-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.178-canary.1-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.178-canary.1-x64.exe.blockmap"
      CY_NAME: "canary.yml"
      EXP_EXE: "b47bf15c0f40ade43d054e24560d31bc498baf69e93c6221cc424e3866b78ab8"
      EXP_MSI: "3d978f883c1700c6ec6250c0650d914ab7be030f586954dea73569fe38e933c0"
      EXP_CY: "00299e6b9d7696f433b8a3862aaf8edcd1fda6096258bafc3c8bcaa1b333d3c4"
      EXP_BM: "18f973d0e09b9abd6b771a62d3f5a0ff97588ee1664387e307406eb9e7399a38"
      PROD_TAG: "desktop/v1.0.177-production"
    steps:
      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PUBLICAR-DESKTOP-1.0.178-CANARY.1" ]; then
            echo "::error::confirmacao invalida — nada foi publicado"; exit 1
          fi
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run 29747660008 completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run invalido para publicacao"; exit 1; }

      - name: "Gate 3 — head do branch canario == SHA pinado (alvo da tag)"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          echo "head $DESK_BRANCH: $H (esperado $CANARY_SHA)"
          [ "$H" = "$CANARY_SHA" ] || { echo "::error::branch canario moveu; alvo da tag divergiu"; exit 1; }

      - name: "Gate 4 — tag e release nao podem existir"
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "::error::tag $TAG ja existe"; exit 1; fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          echo "OK: tag e release livres"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          check() {
            local name="$1" digest="$2"
            local d
            d="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .digest')"
            echo "artifact $name: $d"
            [ "$d" = "$digest" ] || { echo "::error::digest do artifact $name divergente ($d != $digest)"; exit 1; }
            local exp
            exp="$(echo "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .expired')"
            [ "$exp" = "false" ] || { echo "::error::artifact $name expirado"; exit 1; }
          }
          check "$ART_INST" "$ART_INST_DIGEST"
          check "$ART_META" "$ART_META_DIGEST"
          echo "OK: artifacts intactos"

      - name: "Baixar artifacts (installer + updatemeta)"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          ls -lh pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$CY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::asset ausente no artifact: $f"; exit 1; }
          done
          test -f pacote/app-update.yml && { echo "::error::app-update.yml NAO deve ser asset publico"; exit 1; } || true

      - name: "Gate 6 — hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          H_EXE="$(sha256sum "pacote/$EXE_NAME" | awk '{print $1}')"
          H_MSI="$(sha256sum "pacote/$MSI_NAME" | awk '{print $1}')"
          H_CY="$(sha256sum "pacote/$CY_NAME" | awk '{print $1}')"
          H_BM="$(sha256sum "pacote/$BM_NAME" | awk '{print $1}')"
          echo "exe=$H_EXE"; echo "msi=$H_MSI"; echo "canary.yml=$H_CY"; echo "blockmap=$H_BM"
          [ "$H_EXE" = "$EXP_EXE" ] || { echo "::error::hash EXE divergente"; exit 1; }
          [ "$H_MSI" = "$EXP_MSI" ] || { echo "::error::hash MSI divergente"; exit 1; }
          [ "$H_CY" = "$EXP_CY" ] || { echo "::error::hash canary.yml divergente"; exit 1; }
          [ "$H_BM" = "$EXP_BM" ] || { echo "::error::hash blockmap divergente"; exit 1; }
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.178-canary.1" "pacote/$CY_NAME" || { echo "::error::canary.yml version incorreta"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$CY_NAME" || { echo "::error::canary.yml nao referencia o EXE"; exit 1; }
          echo "OK: hashes conferem + canary.yml coerente"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.178-canary.1 — Native Updater Bootstrap (CANARIO)

          PRERELEASE de teste (canal `canary`). NAO e latest, NAO e para distribuicao geral.
          Instalar SOMENTE em maquina real autorizada (owner / 2o computador), pelo EXE NSIS.

          O QUE E
          - Primeira candidata do atualizador nativo (electron-updater + NSIS) sobre a producao 1.0.177.
          - Runtime: allowPrerelease=true, channel="canary", allowDowngrade=false, autoDownload=false,
            autoInstallOnAppQuit=false, forceDevUpdateConfig=false. Download so apos acao do usuario;
            instalacao so apos confirmacao + verificacao de trabalho nao salvo; nunca instala silencioso.
          - Metadata do MESMO build: canary.yml + <exe>.blockmap; app-update.yml fica SO dentro do pacote
            (provider github publico agidseven-lang/Agenda, sem token no cliente).
          - Canal ISOLADO: maquinas estaveis (channel latest) nunca veem este canario.

          PRESERVACAO (congelado da 1.0.177)
          - Todas as funcoes de negocio byte-identicas a 1.0.177 (gate region-scoped + app.asar).
          - 1.0.177-production segue Latest; rollback = reinstalar 1.0.177.

          HASHES OFICIAIS (SHA-256)
          - EXE: b47bf15c0f40ade43d054e24560d31bc498baf69e93c6221cc424e3866b78ab8
          - MSI: 3d978f883c1700c6ec6250c0650d914ab7be030f586954dea73569fe38e933c0
          - canary.yml: 00299e6b9d7696f433b8a3862aaf8edcd1fda6096258bafc3c8bcaa1b333d3c4
          - blockmap: 18f973d0e09b9abd6b771a62d3f5a0ff97588ee1664387e307406eb9e7399a38
          Confira com SHA256SUMS anexado (sha256sum -c SHA256SUMS) ou certutil -hashfile <arquivo> SHA256.

          INSTALACAO (bootstrap manual — 1.0.177 nao possui atualizador)
          1. Feche o app atual pela bandeja (Sair).
          2. Baixe o EXE, confira o SHA-256.
          3. Rode o instalador (SmartScreen: Mais informacoes -> Executar assim mesmo; app sem assinatura).
          4. Abra e faca login com a conta real.

          RISCOS CONHECIDOS
          - Instalador nao assinado (SmartScreen/MOTW). Integridade por SHA-512 (canary.yml) + SHA-256 (release).
          - MSI e contingencia manual; o auto-update usa SOMENTE o EXE NSIS (canal canary).

          Procedencia: run 29747660008 (success); fonte desktop/f341a-native-auto-updater-canary @ f99bff3.
          NOTAS
          wc -l notas.md

      - name: "Publicar prerelease (prerelease=true, latest=false) — 7 assets"
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$CANARY_SHA" \
            --prerelease \
            --latest=false \
            --title "$TITLE" \
            --notes-file notas.md \
            "pacote/$EXE_NAME" \
            "pacote/$MSI_NAME" \
            "pacote/$CY_NAME" \
            "pacote/$BM_NAME" \
            "pacote/SHA256SUMS" \
            "pacote/VERSAO-DESKTOP.txt" \
            "pacote/RELATORIO-DESKTOP.txt"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (flags/assets/target + 1.0.177 segue Latest)"
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" \
            --json tagName,targetCommitish,isPrerelease,isLatest,isDraft,assets \
            --jq '{tag:.tagName,target:.targetCommitish,prerelease:.isPrerelease,latest:.isLatest,draft:.isDraft,assets:[.assets[].name]}'
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft,isLatest --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)+"|"+(.isLatest|tostring)')"
          [ "$FLAGS" = "true|false|false" ] || { echo "::error::flags incorretas: $FLAGS (esperado true|false|false)"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "7" ] || { echo "::error::esperado 7 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$CY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt RELATORIO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset ausente na release: $a"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TGT="$(gh release view "$TAG" -R "$REPO" --json targetCommitish --jq '.targetCommitish')"
          [ "$TGT" = "$CANARY_SHA" ] || { echo "::error::target incorreto: $TGT"; exit 1; }
          # A 1.0.177-production PRECISA continuar Latest (canario nunca vira latest)
          PL="$(gh release view "$PROD_TAG" -R "$REPO" --json isLatest,isPrerelease --jq '(.isLatest|tostring)+"|"+(.isPrerelease|tostring)')"
          echo "1.0.177-production: isLatest|isPrerelease = $PL"
          [ "$PL" = "true|false" ] || { echo "::error::1.0.177-production deixou de ser Latest!"; exit 1; }
          echo "===== GO: PRERELEASE CANARIO PUBLICADA; 1.0.177 segue Latest ====="

      - name: "Smoke — re-baixar EXE + canary.yml da release e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$CY_NAME" -D smoke
          S_EXE="$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')"
          S_CY="$(sha256sum "smoke/$CY_NAME" | awk '{print $1}')"
          [ "$S_EXE" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$S_CY" = "$EXP_CY" ] || { echo "::error::smoke canary.yml hash divergente"; exit 1; }
          echo "SMOKE OK: EXE e canary.yml publicados conferem byte a byte."
