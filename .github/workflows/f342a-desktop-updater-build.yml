# =====================================================================
# [manual] F3.4.2A Stage-1B — Desktop Updater+Presence Build (canário 1.0.179-canary.1)
# ---------------------------------------------------------------------
# Builda o Desktop CANÁRIO com: (A) notificação imediata de update pelo HUB
# (produtor único) e (D) sonda mínima de /auth (presenceAuthProbe). GERA, do
# MESMO build, canary.yml + <exe>.blockmap + app-update.yml. `--publish never`
# (o CI NUNCA publica; o release gated é o único publicador). Gates fail-closed:
#   - testes: updater state machine (canário + onNotify), presence probe
#     (segurança), invariância region-scoped (fonte vs produção 1.0.177 @2963927,
#     removendo UPDATER:* E PRESENCE:*)
#   - tray-icon; metadata canary.yml coerente + SEM segredo; renderer EMPACOTADO
#     byte-idêntico à 1.0.177 fora das regiões UPDATER/PRESENCE; flags canário no
#     app.asar; presenceAuthProbe empacotado; NENHUM segredo (PRESENCE_TICKET_SECRET)
#     no pacote; token/Bearer só no main (ausente em preload/renderer empacotados).
# NÃO publica release; NÃO toca Worker/Cloud Run/Firebase/Firestore/Rules/Cloudflare
# nem a produção estável 1.0.178. Execução SOMENTE manual (workflow_dispatch).
# =====================================================================
name: "[manual] F3.4.2A Stage-1B Desktop Build (canary 1.0.179-canary.1)"

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit a buildar"
        required: true
        default: "desktop/f342a-update-notification-presence-auth-probe"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
      BASE_SHA: "2963927232e02caa3a80dcdc58b94f19d61d11f3" # produção 1.0.177 (F3.3.77B)
    steps:
      - name: Checkout (ref escolhido; history completo p/ baseline)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Derivar versao (package.json e a fonte unica)
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "DIST_BASENAME=Agenda-ID-Seven-Desktop-$APP_VERSION" >> "$GITHUB_ENV"
          echo "versao=$APP_VERSION"
          case "$APP_VERSION" in *-canary.*) echo "OK: versao canário ($APP_VERSION)";; *) echo "::error:: versao NAO é canário (esperado *-canary.*). PARAR."; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: npm install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: TypeScript build (main + preload + updaterService + presenceAuthProbe)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Testes do updater (máquina de estados canário + onNotify; sem identidades)
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/f341a-updater-state-machine.test.mjs

      - name: "Testes da sonda de presença (segurança — token/deviceId/Bearer/sanitizado/401/timeout/busy)"
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/f342a-presence-probe.test.mjs

      - name: Gate invariância region-scoped (fonte vs produção 1.0.177; strip UPDATER+PRESENCE)
        working-directory: ${{ env.APP_DIR }}
        env:
          QA_BASELINE_SHA: ${{ env.BASE_SHA }}
        run: node scripts/f342a-region-invariance.test.mjs

      - name: electron-builder (NSIS + MSI + metadata do MESMO build)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f "dist-installer/win-unpacked/resources/icon.png" ]; then
            echo "resources/icon.png OK (tray tera icone)"
          else
            echo "::error:: resources/icon.png AUSENTE no pacote"; exit 1
          fi

      - name: Gate metadata de update (CANAL CANARY — canary.yml + blockmap + app-update.yml do MESMO build)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          CY="dist-installer/canary.yml"
          if [ ! -f "$CY" ]; then
            echo "::error:: canary.yml NAO gerado (channel do publish != canary?). PARAR E REPORTAR."
            ls -la dist-installer || true; exit 1
          fi
          if [ -f "dist-installer/latest.yml" ]; then echo "::error:: latest.yml TAMBEM gerado — canal ambiguo. PARAR."; exit 1; fi
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap 2>/dev/null | head -1)
          test -n "$BM" || { echo "::error:: <exe>.blockmap NAO gerado"; exit 1; }
          AU="dist-installer/win-unpacked/resources/app-update.yml"
          test -f "$AU" || { echo "::error:: app-update.yml NAO empacotado"; exit 1; }
          echo "===== canary.yml ====="; cat "$CY"
          echo "===== app-update.yml ====="; cat "$AU"
          EXE_PATH=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          EXE_NAME=$(basename "$EXE_PATH")
          grep -q "version: $APP_VERSION" "$CY" || { echo "::error:: canary.yml version != $APP_VERSION"; exit 1; }
          grep -qE "^path: $EXE_NAME" "$CY" || { echo "::error:: canary.yml path nao aponta para $EXE_NAME"; exit 1; }
          grep -qF "url: $EXE_NAME" "$CY" || { echo "::error:: canary.yml files[].url != $EXE_NAME"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "$CY" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "$EXE_PATH" | openssl base64 -A)
          { [ -n "$META_SHA512" ] && [ "$META_SHA512" = "$CALC_SHA512" ]; } || { echo "::error:: sha512 do canary.yml != sha512 do EXE"; echo "meta=$META_SHA512"; echo "calc=$CALC_SHA512"; exit 1; }
          META_SIZE=$(grep -E 'size:' "$CY" | head -1 | grep -oE '[0-9]+' | head -1)
          CALC_SIZE=$(wc -c < "$EXE_PATH" | tr -d ' ')
          [ "$META_SIZE" = "$CALC_SIZE" ] || { echo "::error:: size do canary.yml ($META_SIZE) != size do EXE ($CALC_SIZE)"; exit 1; }
          [ "$(basename "$BM")" = "${EXE_NAME}.blockmap" ] || { echo "::error:: blockmap nao corresponde ao EXE"; exit 1; }
          grep -q "provider: github" "$AU" || { echo "::error:: app-update.yml provider != github"; exit 1; }
          grep -q "owner: agidseven-lang" "$AU" || { echo "::error:: app-update.yml owner errado"; exit 1; }
          grep -q "repo: Agenda" "$AU" || { echo "::error:: app-update.yml repo errado"; exit 1; }
          if grep -qiE '(token|secret|password|gh_token|pat)[[:space:]]*[:=][[:space:]]*[^[:space:]]' "$AU"; then echo "::error:: app-update.yml contem possivel segredo"; exit 1; fi
          echo "GATE metadata CANARY OK: canary.yml confere; app-update.yml github SEM segredo; latest.yml AUSENTE."

      - name: Gate prova-de-versao + renderer EMPACOTADO byte-identico a 1.0.177 (strip UPDATER+PRESENCE)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"
          test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"
          npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          EXIDX="$EXDIR/src/renderer/index.html"
          test -f "$EXIDX" || { echo "::error:: renderer nao encontrado no asar"; exit 1; }
          PAT='1\.0\.14[6-9]|Desktop 1\.0\.[0-9]+|Vers..?o 1\.0\.[0-9]+'
          if grep -rlE "$PAT" "$EXDIR/src/renderer" 2>/dev/null | grep -q .; then echo "::error:: versao hardcoded/stale no renderer empacotado"; grep -rnE "$PAT" "$EXIDX" | head; exit 1; fi
          test -f "$EXDIR/dist/main/updaterService.js" || { echo "::error:: updaterService.js ausente no asar"; exit 1; }
          test -f "$EXDIR/dist/main/presenceAuthProbe.js" || { echo "::error:: presenceAuthProbe.js ausente no asar"; exit 1; }
          grep -q "createUpdaterService" "$EXDIR/dist/main/main.js" || { echo "::error:: wiring do updater ausente no main.js empacotado"; exit 1; }
          grep -q "createPresenceProbe" "$EXDIR/dist/main/main.js" || { echo "::error:: wiring da presença ausente no main.js empacotado"; exit 1; }
          BASEIDX="$RUNNER_TEMP/base-index.html"
          git show ${BASE_SHA}:desktop/src/renderer/index.html > "$BASEIDX"
          EXIDX="$EXIDX" BASEIDX="$BASEIDX" node -e '
            const fs=require("fs");
            const nrm=s=>String(s).replace(/\r\n/g,"\n");
            const cur=nrm(fs.readFileSync(process.env.EXIDX,"utf8"));
            const base=nrm(fs.readFileSync(process.env.BASEIDX,"utf8"));
            const strip=s=>{const o=[];let sk=false;for(const l of s.split("\n")){if(!sk&&/(UPDATER|PRESENCE):BEGIN/.test(l)){sk=true;continue;}if(sk){if(/(UPDATER|PRESENCE):END/.test(l))sk=false;continue;}o.push(l);}return o.join("\n");};
            if(strip(cur)!==base){console.error("renderer empacotado (sem UPDATER+PRESENCE) != producao 1.0.177");process.exit(1);}
            console.log("renderer EMPACOTADO: negocio byte-identico a 1.0.177 (so regioes UPDATER/PRESENCE diferem).");
          '
          echo "GATE prova-de-versao + app.asar OK."

      - name: Gate FLAGS do updater no app.asar (allowPrerelease -> channel=canary -> allowDowngrade + 6 flags)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          US="$RUNNER_TEMP/asarx/dist/main/updaterService.js"
          test -f "$US" || { echo "::error:: updaterService.js ausente no app.asar extraido"; exit 1; }
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*true' "$US" || { echo "::error:: allowPrerelease != true no app.asar"; exit 1; }
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"canary"' "$US" || { echo "::error:: channel != canary no app.asar"; exit 1; }
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowDowngrade != false no app.asar"; exit 1; }
          grep -Eq 'autoUpdater\.autoDownload[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: autoDownload != false no app.asar"; exit 1; }
          grep -Eq 'autoUpdater\.autoInstallOnAppQuit[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: autoInstallOnAppQuit != false no app.asar"; exit 1; }
          grep -Eq 'autoUpdater\.forceDevUpdateConfig[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: forceDevUpdateConfig != false no app.asar"; exit 1; }
          LP=$(grep -nE 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*true' "$US" | head -1 | cut -d: -f1)
          LC=$(grep -nE 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"canary"' "$US" | head -1 | cut -d: -f1)
          LD=$(grep -nE 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" | head -1 | cut -d: -f1)
          { [ -n "$LP" ] && [ -n "$LC" ] && [ -n "$LD" ] && [ "$LP" -lt "$LC" ] && [ "$LC" -lt "$LD" ]; } || { echo "::error:: ordem incorreta: exige allowPrerelease($LP) < channel($LC) < allowDowngrade($LD)"; exit 1; }
          echo "GATE flags no app.asar OK: allowPrerelease=true ($LP) -> channel=canary ($LC) -> allowDowngrade=false ($LD)."

      - name: Gate SEGURANCA da presença no app.asar (token só no main; SEM segredo; body só deviceId)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          PP="$EXDIR/dist/main/presenceAuthProbe.js"
          PL="$EXDIR/dist/preload/preload.js"
          IDX="$EXDIR/src/renderer/index.html"
          # (1) NENHUM segredo de servidor empacotado (PRESENCE_TICKET_SECRET nunca no cliente)
          if grep -rnI 'PRESENCE_TICKET_SECRET' "$EXDIR" 2>/dev/null | grep -q .; then
            echo "::error:: PRESENCE_TICKET_SECRET encontrado no pacote — segredo NUNCA pode ir ao cliente."; grep -rnI 'PRESENCE_TICKET_SECRET' "$EXDIR" | head; exit 1; fi
          # (2) o Bearer da SESSAO vive SÓ no main (presenceAuthProbe.js) — o preload nunca toca token/Bearer
          grep -q 'Bearer' "$PP" || { echo "::error:: presenceAuthProbe.js nao usa Bearer (esperado no main)"; exit 1; }
          if grep -q 'Bearer' "$PL"; then echo "::error:: preload EMPACOTADO contem 'Bearer' — token nunca deve tocar o preload"; exit 1; fi
          # (3) preload expõe só a sonda sanitizada (IPC), nunca o token
          grep -q 'presence-auth-probe' "$PL" || { echo "::error:: preload nao expoe a sonda presence-auth-probe"; exit 1; }
          # (4) o corpo enviado ao /auth é SÓ { deviceId } (sem userId/token) — prova no bundle do main
          grep -q 'JSON.stringify({ deviceId })' "$PP" || { echo "::error:: body do /auth nao é exatamente { deviceId } no bundle"; exit 1; }
          # (5) WS/heartbeat-loop/DO NAO existem no CODIGO do cliente (Escopo D mínimo). Checa o CODIGO
          # (comentarios removidos): o JSDoc do arquivo cita "WebSocket/heartbeat/Durable Object" ao
          # documentar o que NAO faz. Heartbeat = laco periodico (setInterval); o unico setTimeout da
          # sonda é o ABORT do timeout da requisicao (legitimo, nao é heartbeat).
          PP="$PP" node -e '
            const fs=require("fs");
            const code=fs.readFileSync(process.env.PP,"utf8").replace(/\/\*[\s\S]*?\*\//g,"").replace(/(^|[^:])\/\/[^\n]*/g,"$1");
            if(/new WebSocket|WebSocketPair|\/ws\?|PresenceHub|setInterval/i.test(code)){console.error("CODIGO da sonda contem WS/heartbeat-loop/DO (proibido no stage-1B)");process.exit(1);}
            console.log("CODIGO da sonda: sem new WebSocket/WebSocketPair/ws-route/PresenceHub/setInterval");
          '
          # (6) as REGIOES PRESENCE do renderer empacotado NAO referenciam token/Bearer/authorization/session.json.
          # (o renderer tem 'Bearer' PRE-EXISTENTE do teamSessionJwt/portais — 1.0.177; a presença nunca toca token.)
          IDX="$IDX" node -e '
            const fs=require("fs");
            const html=fs.readFileSync(process.env.IDX,"utf8");
            const regions=[];let cur=null;
            for(const l of html.split(/\r?\n/)){
              if(/PRESENCE:BEGIN/.test(l)){cur=[];continue;}
              if(cur&&/PRESENCE:END/.test(l)){regions.push(cur.join("\n"));cur=null;continue;}
              if(cur)cur.push(l);
            }
            if(!regions.length){console.error("nenhuma regiao PRESENCE no renderer empacotado");process.exit(1);}
            // Remove comentarios (bloco + linha, preservando URLs https://) — os comentarios da UI citam
            // "token/ticket" de proposito ao documentar o que NAO e exibido; o teste e sobre o CODIGO.
            const strip=s=>String(s).replace(/\/\*[\s\S]*?\*\//g,"").replace(/(^|[^:])\/\/[^\n]*/g,"$1");
            const blob=strip(regions.join("\n"));
            if(/Bearer|authorization|session\.json|\btoken\b/i.test(blob)){console.error("CODIGO da regiao PRESENCE do renderer referencia token/Bearer/authorization — proibido");process.exit(1);}
            console.log("regioes PRESENCE do renderer ("+regions.length+"): CODIGO sem Bearer/token/authorization/session.json");
          '
          echo "GATE seguranca presença OK: sem segredo no pacote; Bearer da sessao só no main; preload sem token; regioes PRESENCE do renderer sem token; body só {deviceId}; sem WS/heartbeat."

      - name: Empacotar bundle (instalador + metadata + relatorios + hashes)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"
          cp dist-installer/canary.yml "$OUT/"
          cp "$BM" "$OUT/"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo "")
          BM_NAME=$(basename "$BM")
          EXE_SHA=$(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')
          MSI_SHA=$([ -n "$MSI" ] && sha256sum "$OUT/$MSI_NAME" | awk '{print $1}' || echo "")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} canary.yml "$BM_NAME" > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "channel     : canary"
            echo "allowPrerelease : true"
            echo "allowDowngrade  : false"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $EXE_SHA"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $MSI_SHA"
            echo "metadata    : canary.yml + $BM_NAME (MESMO build); app-update.yml SOMENTE dentro do pacote"
            echo "escopoA     : notificacao imediata de update pelo HUB (produtor unico)"
            echo "escopoD     : sonda /auth (presenceAuthProbe) — SEM WS/heartbeat/DO/presenca"
            echo "commit      : $GITHUB_SHA"
            echo "ref         : ${{ github.event.inputs.ref }}"
            echo "baseline    : produção 1.0.177 @ $BASE_SHA (invariância region-scoped verificada)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          {
            echo "===== RELATORIO DESKTOP (F3.4.2A Stage-1B canário) ====="
            echo "Gerado (UTC) : $(date -u)"
            echo "Ref / commit : ${{ github.event.inputs.ref }} @ $GITHUB_SHA"
            echo ""
            echo "----- Arquivos no package -----"; ls -lh "$OUT"
            echo ""; echo "----- VERSAO-DESKTOP -----"; cat "$OUT/VERSAO-DESKTOP.txt"
            echo ""; echo "----- canary.yml -----"; cat "$OUT/canary.yml"
            echo ""; echo "----- app-update.yml (dentro do pacote) -----"; cat dist-installer/win-unpacked/resources/app-update.yml
          } > "$OUT/RELATORIO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload installer (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-${{ env.APP_VERSION }}-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload update-metadata (canary.yml + blockmap + hashes + relatorios)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-${{ env.APP_VERSION }}-updatemeta
          path: |
            dist-pkg/canary.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/VERSAO-DESKTOP.txt
            dist-pkg/RELATORIO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload bundle (tudo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-${{ env.APP_VERSION }}-bundle
          path: dist-pkg/
          if-no-files-found: error
          retention-days: 30
