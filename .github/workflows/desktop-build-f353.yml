# =====================================================================
# [manual] F3.5.3 — Desktop Build (ESTAVEL 1.0.192 = 1.0.191 + notificacoes duraveis + colagem na Legenda)
# ---------------------------------------------------------------------
# Build OFICIAL do candidato ESTAVEL 1.0.192, sobre a base 1.0.191 OFICIAL (@9aaff137). Delta F3.5.3:
#   Categoria A DURAVEL (task_assigned/reassigned/moved/completed/reopened p/ TODOS os usuarios ativos,
#   ator incluido) derivada do doc (history[]/designerAssignment) em notifEvents.js; produtor notifierA.ts
#   no MAIN (backlog do 1o snapshot + tempo real no MESMO stream); cursor/recibos/deviceId persistentes
#   (notifStore.ts); ACK de render do toast (toastAck.ts, aditivo — roteamento/dedup 1.0.191 preservados);
#   colagem explicita na Legenda (paste + Ctrl+V/Shift+Insert via clipboard Electron + menu de contexto,
#   escopada a state.form). notifier.ts: u1/u1b/u3 REMOVIDOS por contrato; event_new preservado.
# Categoria B (T-30/T-10) BYTE-IDENTICA a 1.0.191: slaRules/cardsRules/slaScheduler/bgNotify/tray/
# updaterService/firebase/reminder 0 bytes. Card Premium/layout kbv2: fora do diff (gate).
#
# DOIS JOBS (mesmo SHA pinado fdd6842):
#   job "verify" (ubuntu): tsc + lint + f353 (37/37 + 15/15) + suites funcionais f352/A + preservacao
#     aplicavel + byte-identidade Categoria B + Card Premium fora do diff + suites superadas PRESERVADAS
#     byte-identicas (classificadas; NAO rodadas como gate; NAO apagadas/reancoradas) + isolamento.
#   job "build" (windows, needs verify): electron-builder (--publish never) + provas do app.asar:
#     versao 1.0.192, renderer==fonte, F4.2F ausente, notifEvents/notifierA/notifStore/toastAck
#     EMPACOTADOS, IPCs novos presentes, produtores antigos AUSENTES do notifier, cardsRules SHA==fonte,
#     flags do updater, identidade Windows, Authenticode, latest.yml 1.0.192 + blockmap, SBOM, hashes.
# `--publish never`: o CI NUNCA publica; NAO cria release/tag/Latest. Execucao SO manual.
# =====================================================================
name: "[manual] F3.5.3 Desktop Build (stable 1.0.192 — notificacoes duraveis + colagem na Legenda)"

"on":
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CAND_SHA: "fdd684261f59f7d288c6d4197d7ecd0050ce0bb5" # candidato 1.0.192 (F3.5.3; pin imutavel)
  BASE_191_SHA: "9aaff137a78c154945dbcf2af02a30cc39164058" # Desktop 1.0.191 OFICIAL (tag v1.0.191; base do delta)

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (SHA EXATO do candidato PINADO; history completo p/ baselines)
        uses: actions/checkout@v4
        with:
          ref: "fdd684261f59f7d288c6d4197d7ecd0050ce0bb5"
          fetch-depth: 0

      - name: Derivar versao — exige 1.0.192 exato, sem sufixo
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "versao=$APP_VERSION"
          [ "$APP_VERSION" = "1.0.192" ] || { echo "::error:: versao != 1.0.192"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido ($APP_VERSION)"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      - name: Gate F3.5.3 — notificacoes duraveis 37/37 + colagem 15/15
        working-directory: desktop
        run: |
          set -e
          node scripts/f353-durable-notifications.test.mjs || { echo "::error:: f353 duraveis vermelho"; exit 1; }
          node scripts/f353-paste-recovery.test.mjs || { echo "::error:: f353 colagem vermelho"; exit 1; }

      - name: Gate F3.5.2/A funcionais (notify + source-invariance/Card-Premium + recipient + substituicao + intervalo + packaging)
        working-directory: desktop
        run: |
          set -e
          for t in f352-cards-notify f352-cards-source-invariance f352-cards-recipient f352-cards-channel-substitution f352a-cards-interval; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate F3.5.2/A $t vermelho"; exit 1; }
          done
          echo "== f352-cards-packaging =="
          node scripts/f352-cards-packaging.mjs || { echo "::error:: gate de empacotamento cardsRules vermelho"; exit 1; }

      - name: Gate PRESERVACAO aplicavel (golden masters + canal/dedup/SLA/opblock/updater/bg/central/clock/baseline)
        working-directory: desktop
        run: |
          set -e
          for t in f343-sla-golden-master f344-flow-golden-master f345-sla-timestamp-golden-master \
                   f343-delivery-channel f343-preservation f341a-updater-state-machine \
                   f347-immediate-visual-delivery f347-independent-behavior f33F-bg-notify \
                   f343-main-scheduler f343-operational-block f33A-notif-central \
                   f3377a-r4b-http-date-clock f3311-baseline-freeze; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate de preservacao $t vermelho"; exit 1; }
          done
          echo "PRESERVACAO APLICAVEL: TODOS VERDES."

      - name: Gate CATEGORIA B — byte-identidade a 1.0.191 (T-30/T-10 intocadas)
        run: |
          set -e
          for f in desktop/src/main/slaRules.js desktop/src/main/cardsRules.js desktop/src/main/slaScheduler.ts \
                   desktop/src/main/bgNotify.ts desktop/src/main/tray.ts desktop/src/main/updaterService.ts \
                   desktop/src/main/firebase.ts desktop/src/main/reminder.ts; do
            D=$(git diff "$BASE_191_SHA" HEAD -- "$f" || true)
            [ -z "$D" ] || { echo "::error:: $f ALTERADO vs 1.0.191 (Categoria B deve ser byte-identica)"; exit 1; }
          done
          echo "CATEGORIA B: 8 arquivos byte-identicos a 1.0.191."

      - name: Gate CARD PREMIUM + LAYOUT — regioes fora do diff do renderer
        run: |
          set -e
          N=$(git diff "$BASE_191_SHA" HEAD -- desktop/src/renderer/index.html | grep -cE 'ensureReviewToken|ensureStableClientReviewToken|buildShareClientUrl|buildClientMessage|canSendToClient|openSendClientModal|clientReviewToken|og:image|/share/|kbv2-|isClientSector' || true)
          [ "$N" = "0" ] || { echo "::error:: diff do index.html toca Card Premium/layout kbv2 ($N linhas)"; exit 1; }
          echo "CARD PREMIUM + LAYOUT kbv2: fora do diff (0 mencoes nas hunks)."

      - name: Gate SUITES SUPERADAS — preservadas byte-identicas (classificadas; nao rodadas como gate)
        run: |
          set -e
          for f in f333-notif f3377a-r3-single-producer-clock f33C-assignment-toast f33D-background-notif \
                   f33E-main-notifier f33K-notif-actor f33N-assign-baseline-fix f343-assignment-transition \
                   f343-preexisting-registry f344-repeated-move-contract f352d-cards-board-card-proportion; do
            P="desktop/scripts/$f.test.mjs"
            test -f "$P" || { echo "::error:: suite superada $f AUSENTE (proibido apagar)"; exit 1; }
            D=$(git diff "$BASE_191_SHA" HEAD -- "$P" || true)
            [ -z "$D" ] || { echo "::error:: suite superada $f ALTERADA (proibido reancorar)"; exit 1; }
          done
          echo "11 suites superadas pelo contrato F3.5.3: PRESERVADAS byte-identicas (substituicoes nos f353)."

      - name: Gate ISOLAMENTO — diff so em desktop/ + docs/F3.5.3 (Android/Worker/Rules/Functions intactos)
        run: |
          set -e
          git diff --name-only "$BASE_191_SHA" HEAD | grep -vE '^(desktop/|docs/F3\.5\.3-)' | tee /tmp/outside.txt || true
          [ ! -s /tmp/outside.txt ] || { echo "::error:: mudanca FORA de desktop/+docs/F3.5.3"; exit 1; }
          echo "OK: nenhum arquivo fora de desktop/ + docs/F3.5.3 mudou vs 1.0.191."

  build:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
    steps:
      - name: Forcar LF no checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (SHA EXATO do candidato PINADO)
        uses: actions/checkout@v4
        with:
          ref: "fdd684261f59f7d288c6d4197d7ecd0050ce0bb5"
          fetch-depth: 0

      - name: Gate LINE ENDINGS LF
        run: |
          set -e
          FILES="desktop/src/renderer/index.html desktop/src/main/main.ts desktop/src/main/firebase.ts desktop/src/main/bgNotify.ts desktop/src/main/slaScheduler.ts desktop/src/main/cardsRules.js desktop/src/main/notifierA.ts desktop/src/main/notifStore.ts desktop/src/main/toastAck.ts desktop/src/main/notifEvents.js"
          git ls-files --eol -- $FILES | tee "$RUNNER_TEMP/eol.txt"
          if grep -Eq 'w/(crlf|mixed)' "$RUNNER_TEMP/eol.txt"; then echo "::error:: CRLF/mixed em arquivo-chave"; exit 1; fi
          N=$(git ls-files --eol -- $FILES | wc -l | tr -d ' '); [ "$N" -ge 10 ] || { echo "::error:: esperados >=10, vi $N"; exit 1; }
          echo "LINE ENDINGS: LF CONFIRMED"

      - name: Derivar versao — exige 1.0.192 exato
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          [ "$APP_VERSION" = "1.0.192" ] || { echo "::error:: versao != 1.0.192"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f "dist-installer/win-unpacked/resources/icon.png" || { echo "::error:: resources/icon.png AUSENTE"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.192) + renderer EMPACOTADO == fonte + F4.2F AUSENTE
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.192" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.192"; exit 1; }
          EX="$EXDIR/src/renderer/index.html"; SRC="src/renderer/index.html"; test -f "$EX" || { echo "::error:: index.html ausente no asar"; exit 1; }
          EX="$EX" SRC="$SRC" node -e 'const fs=require("fs");const nrm=s=>String(s).replace(/\r\n/g,"\n");if(nrm(fs.readFileSync(process.env.EX,"utf8"))!==nrm(fs.readFileSync(process.env.SRC,"utf8"))){console.error("index.html EMPACOTADO != fonte");process.exit(1);}'
          echo "  index.html EMPACOTADO == fonte"
          test ! -f "$EXDIR/src/renderer/firebaseAuthBridge.js" || { echo "::error:: firebaseAuthBridge.js presente (F4.2F)"; exit 1; }
          for k in 'firebase-auth-compat' 'signInWithCustomToken' 'startFirebaseAuthBridge' 'DESKTOP_FIREBASE_AUTH'; do
            if grep -q "$k" "$EX"; then echo "::error:: '$k' presente no renderer (F4.2F)"; exit 1; fi
          done
          echo "GATE prova-de-versao 1.0.192 + renderer==fonte + F4.2F AUSENTE OK."

      - name: Gate F3.5.3 EMPACOTADO (notifEvents/notifierA/notifStore/toastAck + IPCs + produtores antigos AUSENTES + colagem)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          for f in notifEvents.js notifierA.js notifStore.js toastAck.js; do
            test -f "$EXDIR/dist/main/$f" || { echo "::error:: dist/main/$f AUSENTE no app.asar"; exit 1; }
          done
          SRC_SHA=$(sha256sum src/main/notifEvents.js | awk '{print $1}' | tr -d '\\')
          ASAR_SHA=$(sha256sum "$EXDIR/dist/main/notifEvents.js" | awk '{print $1}' | tr -d '\\')
          [ "$SRC_SHA" = "$ASAR_SHA" ] || { echo "::error:: notifEvents.js empacotado != fonte"; exit 1; }
          MAINJS="$EXDIR/dist/main/main.js"
          grep -q 'notif-toast-ack' "$MAINJS" || { echo "::error:: IPC notif-toast-ack ausente"; exit 1; }
          grep -q 'clipboard-read-text' "$MAINJS" || { echo "::error:: IPC clipboard-read-text ausente"; exit 1; }
          grep -q 'startNotifierA' "$MAINJS" || { echo "::error:: notifierA nao ligado no main"; exit 1; }
          NJS="$EXDIR/dist/main/notifier.js"
          if grep -q '"tasks"' "$NJS"; then echo "::error:: notifier.js ainda escuta tasks (produtores antigos u1/u1b/u3)"; exit 1; fi
          grep -q '"events"' "$NJS" || { echo "::error:: event_new (Agenda) sumiu do notifier"; exit 1; }
          PRE="$EXDIR/dist/preload/preload.js"
          grep -q 'notifToastAck' "$PRE" || { echo "::error:: preload sem notifToastAck"; exit 1; }
          grep -q 'clipboardReadText' "$PRE" || { echo "::error:: preload sem clipboardReadText"; exit 1; }
          EXH="$EXDIR/src/renderer/index.html"
          grep -q 'f353WirePasteRecovery' "$EXH" || { echo "::error:: pipeline de colagem ausente no renderer"; exit 1; }
          grep -q 'notifToastAck' "$EXH" || { echo "::error:: ACK do toast ausente no renderer"; exit 1; }
          node -e 'const n=require(process.env.RUNNER_TEMP+"/asarx/dist/main/notifEvents.js"); for(const k of ["deriveTaskEvents","buildCategoryAPayload"]) if(typeof n[k]!=="function"){console.error(k+" nao exportada");process.exit(1);}'
          echo "GATE F3.5.3 EMPACOTADO: VERIFIED"

      - name: Gate cardsRules EMPACOTADO (SHA-256 == fonte; 1 copia; cardsEmissionsFor exportada)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          test -f "$EXDIR/dist/main/cardsRules.js" || { echo "::error:: dist/main/cardsRules.js AUSENTE no app.asar"; exit 1; }
          SRC_SHA=$(sha256sum src/main/cardsRules.js | awk '{print $1}' | tr -d '\\')
          ASAR_SHA=$(sha256sum "$EXDIR/dist/main/cardsRules.js" | awk '{print $1}' | tr -d '\\')
          echo "cardsRules.js SHA fonte=$SRC_SHA asar=$ASAR_SHA"
          [ "$SRC_SHA" = "$ASAR_SHA" ] || { echo "::error:: cardsRules.js empacotado != fonte"; exit 1; }
          N=$(find "$EXDIR" -name cardsRules.js | wc -l | tr -d ' '); [ "$N" = "1" ] || { echo "::error:: esperado 1 cardsRules.js, vi $N"; exit 1; }
          node -e 'const c=require(process.env.RUNNER_TEMP+"/asarx/dist/main/cardsRules.js"); if(typeof c.cardsEmissionsFor!=="function"){console.error("cardsEmissionsFor nao exportada");process.exit(1);}'
          grep -q 'require("./cardsRules")' "$EXDIR/dist/main/slaScheduler.js" || { echo "::error:: slaScheduler NAO require ./cardsRules"; exit 1; }
          echo "CARDS RULES PACKAGING: VERIFIED"

      - name: Gate FLAGS do updater no app.asar
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          US="$RUNNER_TEMP/asarx/dist/main/updaterService.js"; test -f "$US" || { echo "::error:: updaterService.js ausente"; exit 1; }
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowPrerelease != false"; exit 1; }
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"latest"' "$US" || { echo "::error:: channel != latest"; exit 1; }
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowDowngrade != false"; exit 1; }
          if grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"canary"' "$US"; then echo "::error:: channel=canary no build ESTAVEL"; exit 1; fi
          echo "GATE flags do updater OK (stable/latest)."

      - name: Gate identidade Windows (AppUserModelId + appId + close-to-tray)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          MAINJS="$RUNNER_TEMP/asarx/dist/main/main.js"
          grep -q 'br.com.idseven.agenda.desktop' "$MAINJS" || { echo "::error:: AppUserModelId ausente"; exit 1; }
          grep -q 'setAppUserModelId' "$MAINJS" || { echo "::error:: setAppUserModelId ausente"; exit 1; }
          grep -q 'preventDefault' "$MAINJS" || { echo "::error:: close-to-tray ausente"; exit 1; }
          grep -q 'appId: br.com.idseven.agenda.desktop' electron-builder.yml || { echo "::error:: appId divergente"; exit 1; }
          echo "GATE identidade Windows OK."

      - name: Inspecao de ASSINATURA Authenticode (paridade 1.0.191)
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $exe = (Get-ChildItem dist-installer -Filter 'Agenda-ID-Seven-Desktop-*-x64.exe' | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          "EXE: $exe"; "AuthenticodeStatus: $($sig.Status)"
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'NotSigned') { Write-Error "Status inesperado: $($sig.Status)"; exit 1 }
          "PARIDADE 1.0.191: mesmo processo (sem cert -> NotSigned)."

      - name: Gate metadata de update (latest.yml 1.0.192 + blockmap + app-update.yml sem segredo)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          LY="dist-installer/latest.yml"; test -f "$LY" || { echo "::error:: latest.yml NAO gerado"; ls -la dist-installer || true; exit 1; }
          if [ -f "dist-installer/canary.yml" ]; then echo "::error:: canary.yml gerado"; exit 1; fi
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap 2>/dev/null | head -1); test -n "$BM" || { echo "::error:: blockmap NAO gerado"; exit 1; }
          AU="dist-installer/win-unpacked/resources/app-update.yml"; test -f "$AU" || { echo "::error:: app-update.yml NAO empacotado"; exit 1; }
          EXE_PATH=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); EXE_NAME=$(basename "$EXE_PATH")
          grep -q "version: $APP_VERSION" "$LY" || { echo "::error:: latest.yml version != $APP_VERSION"; exit 1; }
          grep -qE "^path: $EXE_NAME" "$LY" || { echo "::error:: latest.yml path != $EXE_NAME"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "$LY" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "$EXE_PATH" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error:: sha512 do latest.yml != EXE"; exit 1; }
          grep -q "provider: github" "$AU" && grep -q "owner: agidseven-lang" "$AU" && grep -q "repo: Agenda" "$AU" || { echo "::error:: app-update.yml provider/owner/repo divergente"; exit 1; }
          if grep -qiE '(token|secret|password|pat)[[:space:]]*[:=][[:space:]]*[^[:space:]]' "$AU"; then echo "::error:: app-update.yml com possivel segredo"; exit 1; fi
          echo "GATE metadata OK: latest.yml 1.0.192 + app-update.yml github SEM segredo."

      - name: SBOM (CycloneDX via npm sbom) + fallback
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null
          if [ ! -s "$RUNNER_TEMP/sbom-cyclonedx.json" ]; then npm ls --all --json > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/sbom-cyclonedx.json"; fi
          wc -c "$RUNNER_TEMP/sbom-cyclonedx.json"

      - name: Empacotar bundle (instalador + metadata + SBOM + hashes)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"
          cp "$RUNNER_TEMP/sbom-cyclonedx.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "channel     : latest"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA"
            echo "candidato   : $CAND_SHA (F3.5.3 — notificacoes duraveis Categoria A p/ todos + backlog/cursor/recibos + ACK do toast + colagem na Legenda)"
            echo "baseline    : Desktop 1.0.191 OFICIAL (commit 9aaff137; Categoria B/Card Premium/layout byte-identicos)"
            echo "origem      : F3.5.3 — evento canonico duravel derivado do doc; notifierA no main (backlog+tempo real); notifStore (deviceId/cursor/recibos); toastAck; colagem explicita escopada ao formulario"
            echo "assinatura  : mesmo processo da 1.0.191 (sem code-signing -> NotSigned)"
            echo "distribuicao: PRIVADA (publicacao SO via release gated apos literal PUBLICAR-DESKTOP-1.0.192-STABLE)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload installer (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.192-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

