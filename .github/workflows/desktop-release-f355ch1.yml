# =====================================================================
# F3.5.5C-H1 — Publicacao da Desktop 1.0.221 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.221 (F3.5.5C-H1 — HOTFIX P0 da restauracao automatica de sessao no
# boot do Windows: servidor = unica autoridade de expiracao/revogacao; wipe SOMENTE
# com 401-contrato confirmado 2x; releitura do session.json; persist atomico;
# tolerancia a ponte do preload; "Tentar novamente" imediato; bloco-guarda offline).
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.5C-H1 31064655084 (gated, verde
# nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os
# MESMOS bytes. TUDO PINADO: run id, digests dos artifacts, 5 hashes SHA-256, tag
# v1.0.221 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# Rollback imediato: v1.0.218 (baseline FISICAMENTE aprovada). Rollback adicional: v1.0.216.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.5C-H1 Desktop Release — 1.0.221 no canal do updater (Hotfix de Sessao Automatica; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f355c-h1-session-restore-boot-hotfix-1.0.221"
    paths:
      - ".github/workflows/desktop-release-f355ch1.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.5C-H1; run de build 31064655084 verde nos 2 jobs) ──
      RUN_ID: "31064655084"
      STABLE_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
      TEST_BRANCH: "desktop/f355c-h1-session-restore-boot-hotfix-1.0.221"
      BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
      BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
      BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
      TAG: "v1.0.221"
      TITLE: "Agenda ID Seven Desktop 1.0.221 — Hotfix de Sessão Automática"
      ART_INST: "agenda-id-seven-desktop-1.0.221-installer"
      ART_INST_DIGEST: "sha256:cef726982a3eab1af69464615470adb6c54811d63c8d9579570e3395fb0b7a69"
      ART_META: "agenda-id-seven-desktop-1.0.221-updatemeta"
      ART_META_DIGEST: "sha256:0673b1dcceb71da8d34812324661f4525d9fe09737a7a199d2186dd2ec0d8c68"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.221-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.221-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.221-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "18563563edbe784fa5f318c114a8ed9a149bbc4f342bc403d6617d297a7c5509"
      EXP_MSI: "9c9f53f7dfb98d880f577f886323da81f90cf689f12afd54071ffaee5802c809"
      EXP_LY: "31953863592d86f3b033044e73a4ee5f12ed82ab698a2e70781698da0c3d0846"
      EXP_BM: "cb90f505f4a1a6230bfe007b48f6dd2e3608293f3df25343f7daae7827bfd659"
      EXP_SBOM: "7e52dc70dd276ab050dd9fcff400f80c210d709d7a4f14e2f7c3bc7a220fe8fa"
      PREV_LATEST_TAG: "v1.0.220"
      PROD_ROLLBACK_TAG: "v1.0.218"
      PROD_ROLLBACK2_TAG: "v1.0.216"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.5C-H1)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.5C-H1 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f355ch1\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP20="$(gh api "repos/$REPO/compare/$BASE_220_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP20" = "ahead" ] || [ "$CMP20" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da base 1.0.220 ($CMP20)"; exit 1; }
          CMP0="$(gh api "repos/$REPO/compare/$BASE_218_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP0" = "ahead" ] || [ "$CMP0" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline 1.0.218 ($CMP0)"; exit 1; }
          CMP1="$(gh api "repos/$REPO/compare/$BASE_216_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP1" = "ahead" ] || [ "$CMP1" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.216 ($CMP1)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.220/1.0.218/1.0.216 na linhagem"

      - name: "Gate 3 — release v1.0.221 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.221" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.221"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.221" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.221"; exit 1; }
          grep -q "1.0.221-f355ch1-session-restore-boot-hotfix" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.221/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.221 — Hotfix de Sessão Automática

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.220 (F3.5.5C-H1 — HOTFIX P0)

          PROBLEMA CORRIGIDO: ao reiniciar o Windows, o app podia abrir direto na
          TELA DE LOGIN mesmo sem nenhum logout voluntário — a sessão local era
          apagada por decisões erradas do próprio app (expiração calculada
          localmente, 401 transitório de rede, leitura única do arquivo de sessão,
          corrida do autostart). A auditoria provou que os defeitos eram LATENTES
          (idênticos em 1.0.218/219/220) — não uma regressão recente.

          A PARTIR DESTA VERSÃO, O SERVIDOR É A ÚNICA AUTORIDADE sobre a sessão:
          - o app NUNCA apaga a sessão por conta própria (relógio adiantado no
            boot, janela local vencida ou falha de leitura não derrubam mais);
          - a sessão SÓ é encerrada quando o SERVIDOR confirma a revogação em
            DUAS respostas consecutivas (1,2s de intervalo) — 401 transitório de
            borda/proxy NUNCA desloga;
          - o arquivo de sessão é relido no boot (segunda chance) e gravado de
            forma ATÔMICA (à prova de queda de energia);
          - sem internet no boot: o app espera na tela "Restaurando sessão…" e
            reconecta sozinho (3s→60s), com "Tentar novamente" IMEDIATO e
            "Entrar manualmente" como opções — ficar offline NUNCA vira logout;
          - autostart do Windows: o app agora tolera até ~12s de atraso interno
            antes de admitir falha (nada de login relâmpago na corrida do boot);
          - boot totalmente offline (sem cache): nova tela "Aguardando conexão…"
            com reconexão automática — a sessão fica preservada.

          O QUE NÃO MUDA (segurança e fluxos preservados):
          - SAIR (logout explícito) continua encerrando a sessão de verdade;
          - sessão REVOGADA/EXPIRADA pelo servidor continua exigindo login;
          - troca de usuário e recuperação de senha seguem exatamente iguais;
          - NENHUMA senha é gravada; identidade do app, pasta de perfil e
            armazenamento INALTERADOS (appId/userData/partição intocados);
          - TODAS as entregas aprovadas até a 1.0.220 (Roteiros Personalizados,
            Editor Rico, Agenda Premium, Observações Internas, Acompanhamento de
            Execução, alertas/notificações/sons, Central de Detalhes, portal do
            cliente etc.) preservadas — congelados byte-idênticos fora de
            auth-core/renderer; todas as suítes herdadas verdes.

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows
          (reiniciar o Windows com o app em autostart e conferir a restauração
          automática; testar sem rede no boot; conferir logout explícito; ciclos
          de abrir/fechar). A publicação não é aprovação física. Em caso de
          problema: rollback imediato v1.0.218; adicional v1.0.216; a 1.0.220
          permanece publicada.

          Procedência: run de build F3.5.5C-H1 31064655084 (success; --publish
          never; verify + Windows verdes: suíte da restauração 29 — incluindo 20
          ciclos abrir/fechar — rodada TAMBÉM contra os bytes do app.asar; 10
          provas Electron reais do boot de sessão + prova de ciclos; auth-core 16;
          todas as suítes herdadas 128+97+84+72+f355a+37+74+53+40; smoke RTE 91;
          provas herdadas 32+20+15+25; paridade cruzada Desktop↔Worker) @ commit
          98caad68e83230c2ada88ce1b35e709a0d62ab8c (branch
          desktop/f355c-h1-session-restore-boot-hotfix-1.0.221). Mesmos bytes; sem
          recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.221 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.221; 1.0.220 preservada; rollbacks 1.0.218/1.0.216 preservados)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.221 no canal do updater (Latest); 1.0.220 preservada; 1.0.218 rollback imediato; 1.0.216 rollback adicional ====="
