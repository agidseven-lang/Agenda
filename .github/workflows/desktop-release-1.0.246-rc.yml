# =====================================================================
# [manual/GATED] RC 1.0.246 LIGHT UI — Desktop Release (INERTE nesta fase)
# ---------------------------------------------------------------------
# I5C.2 — par de RELEASE da linhagem RC (padrão dos 25 pares históricos).
# ESTE WORKFLOW NÃO FOI EXECUTADO NA I5C.2 E NÃO PODE PUBLICAR SOZINHO:
#   Gate 0 (fail-closed): exige a variável de repositório RC_RELEASE_GO com o
#     valor literal 'authorized-by-owner' — ela NÃO existe até o owner criá-la
#     em Settings > Variables. Sem ela, o job FALHA no primeiro step, sempre.
#   Gate 1: frase de confirmação digitada manualmente no dispatch.
#   Gate 2: build_run_id do workflow de BUILD verde é obrigatório e os hashes
#     do RC-MANIFEST devem bater com os esperados (pinados abaixo).
#   Gate 3: PRODUCT SOURCE pinado = dcc019ca; tag futura (v1.0.246-rc) deve
#     apontar para ESTE head exato quando um release FUTURO for autorizado.
# NÃO usa push/tag trigger. NÃO usa "latest build". Nenhuma origem ambígua.
# I5C.4 (RC-U03 PREPARED): a etapa de publicação existe ABAIXO com a mecânica
# completa (bundle do build pinado → verificação criptográfica → tag → Release
# Latest com latest.yml + exe + blockmap + MSI + SHA256SUMS + VERSAO-DESKTOP.txt),
# mas permanece INALCANÇÁVEL sem o GO do owner: Gate 0 (variável inexistente)
# + Gate 1 (frase) + Gate 2 (proveniência) + Gate 3 (pins de hash em PENDING
# até o mandato de RELEASE FINAL preenchê-los) + tag v<versão> não pode existir.
# NUNCA executado nesta fase. Nenhuma publicação sem mandato explícito.
# =====================================================================
name: "[manual/GATED] RC 1.0.246 Light UI — Desktop Release (INERT)"

"on":
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID do desktop-build-1.0.246-rc.yml VERDE que produziu os artefatos"
        required: true
      confirm:
        description: "Digite EXATAMENTE: RELEASE-1.0.246-RC-AUTORIZADO"
        required: true

# contents:write e actions:read são exigidos pela etapa de publicação PREPARADA;
# permanecem inertes na prática: nenhum step roda além do Gate 0 sem a variável do owner.
permissions:
  contents: write
  actions: read

env:
  PRODUCT_SOURCE_SHA: "dcc019ca7acf714de0629ff11c247ad9a877626f"
  EXPECTED_VERSION: "1.0.246"
  EXPECTED_RENDERER_SHA256: "bd5001b1ec249ecc56bc1a8b71a11be05d468dc990695c6f80ef80af00aef32f"
  # ---- PINS DE PUBLICAÇÃO (RC-U03): preenchidos SOMENTE pelo mandato de RELEASE FINAL.
  # Enquanto "PENDING…", o Gate 3 falha SEMPRE (fail-closed). O mandato final define:
  # a versão/tag da linha publicada (ex.: 1.0.247 + candidato com fix do updater) e os
  # SHA-256 do RC-MANIFEST do run de build canônico dessa linha.
  EXPECTED_EXE_SHA256: "PENDING-RELEASE-FINAL-MANDATE"
  EXPECTED_MSI_SHA256: "PENDING-RELEASE-FINAL-MANDATE"
  BUNDLE_ARTIFACT_NAME: "agenda-id-seven-desktop-1.0.246-RC-bundle"

jobs:
  gated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "GATE 0 — autorização do OWNER (variável de repositório; fail-closed)"
        run: |
          set -euo pipefail
          if [ "${{ vars.RC_RELEASE_GO }}" != "authorized-by-owner" ]; then
            echo "::error::RELEASE NÃO AUTORIZADO — a variável de repositório RC_RELEASE_GO não está definida como 'authorized-by-owner'. Este workflow permanece INERTE por decisão da I5C.2 (nenhuma publicação sem GO explícito do owner)."
            exit 1
          fi

      - name: "GATE 1 — frase de confirmação manual"
        run: |
          set -euo pipefail
          [ "${{ github.event.inputs.confirm }}" = "RELEASE-1.0.246-RC-AUTORIZADO" ] || { echo "::error::frase de confirmação incorreta"; exit 1; }

      - name: Checkout (verificação de linhagem)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "GATE 2 — proveniência: PRODUCT SOURCE na linhagem + renderer congelado"
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SOURCE_SHA" || { echo "::error::PRODUCT_SOURCE_SHA inexistente"; exit 1; }
          R=$(git show "$PRODUCT_SOURCE_SHA":desktop/src/renderer/index.html | sha256sum | awk '{print $1}')
          [ "$R" = "$EXPECTED_RENDERER_SHA256" ] || { echo "::error::renderer do PRODUCT SOURCE difere do congelado"; exit 1; }
          V=$(git show "$PRODUCT_SOURCE_SHA":desktop/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          [ "$V" = "$EXPECTED_VERSION" ] || { echo "::error::versão do PRODUCT SOURCE != $EXPECTED_VERSION"; exit 1; }
          echo "build_run_id informado: ${{ github.event.inputs.build_run_id }} (os artefatos/hashes desse run são os ÚNICOS publicáveis)"

      - name: "GATE 3 — pins de publicação preenchidos pelo mandato de RELEASE FINAL (fail-closed)"
        run: |
          set -euo pipefail
          if [ "$EXPECTED_EXE_SHA256" = "PENDING-RELEASE-FINAL-MANDATE" ] || [ "$EXPECTED_MSI_SHA256" = "PENDING-RELEASE-FINAL-MANDATE" ]; then
            echo "::error::RC-U03: os SHA-256 esperados dos artefatos NÃO foram pinados — a publicação só é liberada quando o mandato de RELEASE FINAL do owner fixar a versão, o candidato e os hashes do run de build canônico."
            exit 1
          fi

      - name: "PUBLICAÇÃO (RC-U03 PREPARADA) — bundle pinado → verificação → tag → Release Latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$EXPECTED_VERSION"
          # a tag NÃO pode existir (nunca sobrescrever release/tag)
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG já existe — publicação abortada (nunca sobrescrever)"; exit 1
          fi
          # baixar o bundle EXATO do run de build pinado (nunca 'latest build')
          RUN="${{ github.event.inputs.build_run_id }}"
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq ".artifacts[] | select(.name==\"$BUNDLE_ARTIFACT_NAME\") | .id")
          [ -n "$AID" ] || { echo "::error::artifact $BUNDLE_ARTIFACT_NAME não encontrado no run $RUN (expirado? rode o build canônico de novo)"; exit 1; }
          mkdir -p bundle && cd bundle
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > bundle.zip
          unzip -q bundle.zip && rm bundle.zip
          EXE=$(find . -name "Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.exe" | head -1)
          MSI=$(find . -name "Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.msi" | head -1)
          BMAP=$(find . -name "Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.exe.blockmap" | head -1)
          LYML=$(find . -name "latest.yml" | head -1)
          for f in "$EXE" "$MSI" "$BMAP" "$LYML"; do [ -n "$f" ] && [ -f "$f" ] || { echo "::error::asset ausente no bundle"; exit 1; }; done
          # verificação criptográfica contra os pins do mandato
          [ "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXPECTED_EXE_SHA256" ] || { echo "::error::exe difere do pinado"; exit 1; }
          [ "$(sha256sum "$MSI" | awk '{print $1}')" = "$EXPECTED_MSI_SHA256" ] || { echo "::error::msi difere do pinado"; exit 1; }
          # contrato do updater: latest.yml do MESMO build (versão + sha512 do exe batem)
          grep -q "^version: $EXPECTED_VERSION$" "$LYML" || { echo "::error::latest.yml versão != $EXPECTED_VERSION"; exit 1; }
          SHA512=$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)
          grep -q "$SHA512" "$LYML" || { echo "::error::sha512 do exe não bate com latest.yml (assets de builds diferentes!)"; exit 1; }
          # padrão da casa: SHA256SUMS + VERSAO-DESKTOP.txt gerados sobre os bytes verificados
          sha256sum "$(basename "$EXE")" "$(basename "$MSI")" "$(basename "$BMAP")" "$(basename "$LYML")" > SHA256SUMS 2>/dev/null || \
            (cd "$(dirname "$EXE")" && sha256sum "$(basename "$EXE")" "$(basename "$MSI")" "$(basename "$BMAP")" "$(basename "$LYML")" > "$OLDPWD/SHA256SUMS")
          echo "$EXPECTED_VERSION" > VERSAO-DESKTOP.txt
          # tag no PRODUCT SOURCE exato + Release marcada Latest (feed real do updater)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$PRODUCT_SOURCE_SHA"
          gh release create "$TAG" "$EXE" "$MSI" "$BMAP" "$LYML" SHA256SUMS VERSAO-DESKTOP.txt \
            --title "Agenda ID Seven Desktop $EXPECTED_VERSION" \
            --notes "Release gated (mandato do owner). Fonte: $PRODUCT_SOURCE_SHA · build run: $RUN." \
            --latest
          echo "RELEASE PUBLICADA: $TAG (Latest) com latest.yml+exe+blockmap+msi+SHA256SUMS+VERSAO-DESKTOP.txt do run $RUN" >> "$GITHUB_STEP_SUMMARY"
