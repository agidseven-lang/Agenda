# =====================================================================
# F3.5.4O — Publicacao da Desktop 1.0.205 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.205 (F3.5.4O: AGRUPAMENTO INTELIGENTE das notificacoes COMUNS):
#   - a 1a notificacao comum de <destinatario+tarefa> aparece em TEMPO REAL (nao espera 5s); as
#     subsequentes, dentro de uma janela FIXA de 5s, ATUALIZAM a MESMA superficie (contador + ate 5
#     itens + "+N outras atualizacoes") — sem 2a janela, sem repetir o som, sem roubar foco. O sino
#     mantem CADA evento individualmente. Controlador PURO no MAIN (apos o dedup individual e a captura
#     no sino; antes da superficie comum). ALLOWLIST/DENYLIST; taskId e a autoridade; flag default ON.
# TODA a logica da 1.0.204 preservada (gates no build): notificacoes individuais, tempos T-30/T-10,
# destinatarios, Card Premium/Cronograma/Monitor SLA/sino, lembrete central de SLA, autocorrecao/
# inicializacao (F3.5.4N), updater e Android: INTOCADOS.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4O 30669449371 (gated, verde nos 2 jobs; --publish
# never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests
# dos artifacts, 5 hashes SHA-256, tag v1.0.205 no head EXATO da branch. 6 assets: EXE, MSI, latest.yml,
# blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release Bot"
# (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# v1.0.204 (rollback), v1.0.203, v1.0.202 e v1.0.201 permanecem PRESERVADAS (releases/tags intocadas).
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.4O Desktop Release — 1.0.205 no canal do updater (agrupamento das notificacoes comuns; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354o-common-notification-grouping-1.0.205"
    paths:
      - ".github/workflows/desktop-release-f354o.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4O GO tecnico; run de build 30669449371 verde nos 2 jobs) ──
      RUN_ID: "30669449371"
      STABLE_SHA: "31881d3978ed998638f8cd0a7ed347d7cb89e939"
      TEST_BRANCH: "desktop/f354o-common-notification-grouping-1.0.205"
      BASE_204_SHA: "151cf6545d15fcfd8c4ed56b017fcc925957bbfd"
      TAG: "v1.0.205"
      TITLE: "Agenda ID Seven Desktop 1.0.205 — Agrupamento Inteligente das Notificacoes Comuns"
      ART_INST: "agenda-id-seven-desktop-1.0.205-installer"
      ART_INST_DIGEST: "sha256:f1ef49280e4ff99e0a1838902b4b6dd21ea4e8ead084bf5e42a2ae4485744c1e"
      ART_META: "agenda-id-seven-desktop-1.0.205-updatemeta"
      ART_META_DIGEST: "sha256:e9c8fa7cf3055debabca5f88ffaf45ce36bc0a9e4c2c308d6fc4da11b813feb4"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.205-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.205-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.205-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "e650928ccb4856ddf8c2be78868c786c40995540fd8f13eff571af174348039e"
      EXP_MSI: "c6da1f38ab2bf1b160ff1c74142c7eb237f3ce648a192feb633395c384168237"
      EXP_LY: "3bc78658d230419e38cd14dd19558f326e6661ec3295351fb5067ed9754fcb9c"
      EXP_BM: "8267ea999e9aec6e94444b3650b7f305801b5426aab3360d9c8b8c02550d00ba"
      EXP_SBOM: "dc4c11821e0b448db78bc5e3e8053089d822bd930781e30219c1e15e1bcbedd5"
      PROD_PREV_TAG: "v1.0.204"
      PROD_ROLLBACK_TAG: "v1.0.203"
      PROD_HIST_TAG: "v1.0.202"
      PROD_HIST2_TAG: "v1.0.201"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4O)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4O completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354o\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_204_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.204 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.204 na linhagem"

      - name: "Gate 3 — release v1.0.205 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.205" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.205"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.205" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.205"; exit 1; }
          grep -q "1.0.205-common-notification-grouping" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.205/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.205 — Agrupamento Inteligente das Notificacoes Comuns

          Atualizacao disponibilizada pelo ATUALIZADOR INTERNO do app (Configuracoes ->
          Atualizacoes -> Verificar atualizacoes -> Baixar -> Instalar e reiniciar).
          NENHUM download manual e necessario.

          O QUE MUDA vs 1.0.204 (F3.5.4O — agrupamento das notificacoes COMUNS)
          - Menos ruido: quando chegam VARIAS notificacoes comuns sobre a MESMA tarefa para o MESMO
            destinatario em sequencia (ex.: um card passando por varias colunas), a PRIMEIRA aparece em
            TEMPO REAL (nao espera nada) e as seguintes, dentro de uma janela curta de 5 segundos,
            ATUALIZAM a MESMA notificacao — que passa a mostrar "N atualizacoes em [tarefa]" com ate 5
            itens recentes e "+N outras atualizacoes".
          - Sem incomodo: a atualizacao acontece na MESMA janela/toast — sem abrir uma segunda janela,
            sem repetir o som e sem roubar o foco do que voce esta fazendo. Ao clicar, abre a tarefa.
          - Sino intacto: a Central de Notificacoes (sino) continua guardando CADA evento individualmente
            — o agrupamento e apenas visual, na hora; nada e perdido.
          - Voce no controle: em Configuracoes -> Notificacoes ha o botao "Agrupar atualizacoes comuns da
            mesma tarefa" (ligado por padrao). Desligando, o app volta a exibir cada notificacao separada,
            exatamente como na 1.0.204.

          O QUE NUNCA E AGRUPADO (seguranca)
          - Alertas de SLA amarelo/vermelho, bloqueio operacional, qualquer alerta critico e eventos
            desconhecidos NUNCA sao agrupados — continuam individuais e imediatos. Tarefas, clientes e
            destinatarios diferentes nunca se misturam (a chave usa a identidade da tarefa, nunca o titulo).

          PRESERVACAO (provado por gates no build)
          - Notificacoes individuais, tempos de SLA (T-30/T-10), destinatarios, Card Premium, Cronograma,
            Roteiro, Monitor SLA, sino, lembrete central de SLA, inicializacao com o Windows e autocorrecao
            do canal (1.0.204), atualizador, login/logout e Android: INTOCADOS.
          - Rollback: 1.0.204, 1.0.203, 1.0.202 e 1.0.201 PRESERVADAS (releases e tags intactas).

          IMPORTANTE: esta versao ainda DEPENDE DE VALIDACAO FISICA do owner (provocar uma rajada de
          notificacoes comuns da mesma tarefa e confirmar que a 1a aparece na hora, que as seguintes
          atualizam a MESMA janela com contador, que nao ha 2a janela/som/roubo de foco, que o sino
          guarda cada evento, e que alertas amarelo/vermelho continuam individuais e imediatos). A
          publicacao apenas disponibiliza a atualizacao pelo mecanismo oficial.

          Procedencia: run de build F3.5.4O 30669449371 (success; --publish never; gates de verificacao +
          Windows verdes, incluindo os 20 gates F3.5.4O no app.asar) @ commit
          31881d3978ed998638f8cd0a7ed347d7cb89e939 (branch desktop/f354o-common-notification-grouping-1.0.205
          = tag v1.0.204 + commits da fase). Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.205 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.205; 1.0.204 rollback + 1.0.203/1.0.202/1.0.201 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.205 no canal do updater (Latest); 1.0.204/1.0.203/1.0.202/1.0.201 preservadas ====="
