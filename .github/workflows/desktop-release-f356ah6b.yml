# =====================================================================
# F3.5.6A-H6B — Publicacao da Desktop 1.0.235 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# 1.0.235 = VERSAO DE DIAGNOSTICO OPERACIONAL (NAO e a correcao definitiva). A 1.0.234 responde ao
# botao "Confirmar envio ao cliente" mas a confirmacao falha SERVER-SIDE. A 1.0.235 instrumenta o
# renderer com diagnostico SANITIZADO (stage/httpStatus/workerCode/hasSession/hasJwt/hasTask/hasToken/
# appVersion), vinculado DINAMICAMENTE ao taskId; botao "Copiar diagnostico da confirmacao" aparece so
# apos uma tentativa. NUNCA registra token/JWT/conteudo. Comportamento do envio IDENTICO a 1.0.234
# (aditivo; MUDANCA de producao = SOMENTE index.html). Distribuida EXCLUSIVAMENTE pelo updater interno.
# USA os BYTES do run de build F3.5.6A-H6B 31318136927 (gated, verde nos 2 jobs; --publish never): NAO
# RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests, 5 hashes
# SHA-256, tag v1.0.235 no head EXATO. 6 assets. ESCRITAS so via GitHub App "Agenda ID Seven Release Bot".
# NAO e a correcao definitiva da confirmacao — apos o diagnostico do owner, o STOP vale. Worker V64.61
# INALTERADO. baseline fisica 1.0.228; ROLLBACK IMEDIATO 1.0.228.
# =====================================================================
name: "F3.5.6A-H6B Desktop Release — 1.0.235 no canal do updater (diagnostico da confirmacao; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356ah6b-confirm-send-diagnostics-1.0.235"
    paths:
      - ".github/workflows/desktop-release-f356ah6b.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A-H6B; run de build 31318136927 verde nos 2 jobs) ──
      RUN_ID: "31318136927"
      STABLE_SHA: "d20db3710e7368ffdc5307a5e98d509e4930890b"
      TEST_BRANCH: "desktop/f356ah6b-confirm-send-diagnostics-1.0.235"
      BASE_234_SHA: "3285a45ff40c4bcfb1b28c53819455d515af912a"
      BASE_233_SHA: "b176e41c8be801f7d5d63fc8d2a9b9be42c643f3"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      TAG: "v1.0.235"
      TITLE: "Agenda ID Seven Desktop 1.0.235 — diagnostico da confirmacao de envio (pelo updater)"
      ART_INST: "agenda-id-seven-desktop-1.0.235-installer"
      ART_INST_DIGEST: "sha256:bdfe530a8b1b4e5aab2ffd4b54b67498223d1fa9d87f4f4046d4f4f89248e7fa"
      ART_META: "agenda-id-seven-desktop-1.0.235-updatemeta"
      ART_META_DIGEST: "sha256:196d543840e5f0649b640a4dc707c5f9ae15581881731082618710f9385edbae"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.235-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.235-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.235-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "95fdfa29ac9e3d5d726d97f634c70ee613e80f0af26d01520a5a41e9c2df16d3"
      EXP_MSI: "b3b3e3bb3d31a3e5b3f30644973372d655835376be490c2ae3218280502ed79d"
      EXP_LY: "b954ec674344b43e656f2faed625944470f903c3a2321c262c96628ecfade1a1"
      EXP_BM: "030ed85dbf5c048c9d2f59f7b7f66fbfa38dfdef94430d861dea4817fd090774"
      EXP_SBOM: "772bde6449c894f70af15dd4010ef133b932df0c0d84487fd2373d409af22593"
      PREV_LATEST_TAG: "v1.0.234"
      PRES_233_TAG: "v1.0.233"
      PRES_232_TAG: "v1.0.232"
      PRES_231_TAG: "v1.0.231"
      PRES_230_TAG: "v1.0.230"
      PRES_228_TAG: "v1.0.228"
      PROD_ROLLBACK_TAG: "v1.0.223"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A-H6B)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A-H6B completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356ah6b\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_234_SHA" "$BASE_233_SHA" "$BASE_228_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.234/1.0.233/1.0.228 na linhagem"

      - name: "Gate 3 — release v1.0.235 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.235" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.235"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.235" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.235"; exit 1; }
          grep -q "1.0.235-f356ah6b-confirm-send-diagnostics" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.235/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.235 — diagnóstico da confirmação de envio (pelo atualizador interno)

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).

          IMPORTANTE: esta é uma VERSÃO DE DIAGNÓSTICO OPERACIONAL — NÃO é a correção definitiva da
          confirmação de envio. A 1.0.234 já responde ao botão "Confirmar envio ao cliente" (a correção
          H5 do botão funcionou), mas a confirmação está falhando no lado do servidor. A 1.0.235 apenas
          INSTRUMENTA o app para capturar, de forma SANITIZADA, o estágio exato dessa falha, para que a
          correção definitiva seja feita com prova real (sem chute).

          O QUE MUDA vs 1.0.234 (aditivo; correção cirúrgica em 1 arquivo de produção — só o renderer):
          - captura sanitizada por estágio da tentativa de confirmação: stage, requestStarted,
            responseReceived, httpStatus, workerCode, hasSession, hasJwt, hasTask, hasToken, appVersion —
            vinculada dinamicamente à tarefa que está sendo confirmada;
          - botão "Copiar diagnóstico da confirmação" no modal "Enviar no grupo do cliente", que aparece
            SÓ depois de uma tentativa de confirmar;
          - NUNCA registra token, JWT, clientReviewToken, shareToken, Authorization, senha, conteúdo da
            tarefa, temas, legendas, telefone ou qualquer dado sensível.

          O QUE NÃO MUDA (preservado; garantido por gate):
          - o comportamento do envio é IDÊNTICO à 1.0.234: GERAR LINK ≠ ENVIO; em falha a tarefa
            permanece "Temas prontos — confirmar envio ao cliente" (Responsável: Social Media), sem
            criar sentAt/externalWait, sem transferir ao cliente, sem entrar na Central;
          - "enviado" canônico continua EXCLUSIVO do Worker; o Worker V64.61 está INALTERADO (nenhum deploy);
          - a correção H5 (botão), a H4 (link ≠ envio), a Central (1.0.231), o workflow (1.0.230/1.0.229)
            e TODA a infraestrutura de notificações 1.0.228 — byte-idênticas;
          - a paridade renderer×main (golden master F3.4.4) — slaRules.js sem qualquer alteração.
          Delta de produção vs 1.0.234: SOMENTE desktop/src/renderer/index.html.

          COMO AJUDAR NO DIAGNÓSTICO: crie um Cronograma de teste (1 tema) -> Enviar ao cliente ->
          Confirmar envio ao cliente (uma vez) -> clique em "Copiar diagnóstico da confirmação" -> envie
          o texto copiado à equipe ID Seven. Em caso de problema: ROLLBACK IMEDIATO v1.0.228 (baseline
          física); todas as versões anteriores permanecem publicadas.

          Procedência: run de build F3.5.6A-H6B 31318136927 (success; --publish never; verify + Windows
          verdes: marcadores diagnósticos + sanitização; H5/H4/H3 preservados; RED empacotado que CLICA
          o botão REAL GREEN em 1.0.235; golden master F3.4.4 9/9; suíte f356a 128/128; bateria herdada
          re-pinada 1.0.234->1.0.235; isolamento: delta de produção vs 1.0.234 SÓ em index.html;
          slaRules.js e infra de notificações 1.0.228 byte-idênticos) @ commit
          d20db3710e7368ffdc5307a5e98d509e4930890b
          (branch desktop/f356ah6b-confirm-send-diagnostics-1.0.235). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.235 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.235; 1.0.234/1.0.233/1.0.232/1.0.231/1.0.230/1.0.228 preservadas; rollback 1.0.223 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_233_TAG" "$PRES_232_TAG" "$PRES_231_TAG" "$PRES_230_TAG" "$PRES_228_TAG" "$PROD_ROLLBACK_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.235 (diagnostico) no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228; 1.0.234/1.0.233/1.0.232/1.0.231/1.0.230/1.0.228 preservadas ====="
