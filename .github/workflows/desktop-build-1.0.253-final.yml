# =====================================================================
# [manual] FINAL 1.0.253 — Desktop Build Canonico + Installed-App QA (NADA e publicado)
# ---------------------------------------------------------------------
# Espelha o mecanismo canonico auditado (desktop-build-1.0.253-final.yml,
# run aprovado 33277541544): build UNICO da 1.0.253 a partir do FINAL SOURCE
# 5dac060a (candidato Hoje Actionability Option B aprovado e3b0c364 + bump),
# com hard gates de proveniencia, GATE ASAR, contrato do latest.yml,
# SHA256SUMS + VERSAO-DESKTOP.txt + manifest, e - NO MESMO RUN - a
# INSTALLED-APP QA REAL:
#   SESSAO A - 1.0.253 PUBLICA -> 1.0.253 (assets deste build): update
#     SILENCIOSO /S, REQUIRED_USER_INSTALL_ACTIONS=0, app relanca 1.0.253.
#   SESSAO B - 1.0.253 instalada: HOJE ACTIONABILITY H1-H18 (urgent row ->
#     Detail via click/Enter/Espaco, KPI Tarefas -> Meu quadro com paridade
#     por IDs em ADMIN e OPERACIONAL, KPI Hoje -> Agenda, KPI Equipe) +
#     REGRESSAO OPTION B (SB1-SB16 + CN1-CN10 + reachability + selected
#     unico) + freeze premium (T/D/C/Hub) + responsivo 1920/1536/1366 +
#     screenshots RC253-*.
#   LICAO E1 (I7.17.2B) = HARD GATE: TODA captura valida ANTES
#     loginPresent=false + expectedSurface==actualSurface e grava
#     rc253-evidence-manifest.json; mismatch = FAIL-CLOSED.
# Diff de produto vs v1.0.252 (b7656aee) = renderer (Hoje Actionability) +
# bump + QA tooling versionado - NADA de main/updater/builder.
# Sem tag, sem release, sem publish, sem Latest, sem RC_RELEASE_GO. Manual.
# =====================================================================
name: "[manual] FINAL 1.0.253 — Desktop Build + Installed-App QA"

"on":
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PRODUCT_SOURCE_SHA: "5dac060ad612d4acbe24d389a00f23c51721c527"
  V252_TAG_SHA: "b7656aee27d67b65ab06c2432ef31a677dec7c47"   # v1.0.252 (producao publica; base do candidato Hoje Actionability)
  EXPECTED_VERSION: "1.0.253"
  EXPECTED_RENDERER_SHA256: "c01bd845245bf09a833edcee41bf9e390106a2e72c16d08b1664738289e209ad"
  EXPECTED_LOCKFILE_SHA256: "047711f1968a7c9f32a7a854bcb437e5f10d168613b47eb7b030107c46c40ced"
  BASELINE_TAG: "v1.0.252"
  FEED_PORT: "8879"

jobs:
  final-build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: "Git sem conversao CRLF"
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "PIN do FINAL SOURCE (5dac060a) + PROVENANCE hard gates"
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SOURCE_SHA"
          [ "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA" ] || { echo "::error::pin do FINAL SOURCE falhou"; exit 1; }
          R=$(git show "$PRODUCT_SOURCE_SHA":desktop/src/renderer/index.html | sha256sum | awk '{print $1}')
          [ "$R" = "$EXPECTED_RENDERER_SHA256" ] || { echo "::error::renderer difere do congelado ($R)"; exit 1; }
          L=$(git show "$PRODUCT_SOURCE_SHA":desktop/package-lock.json | sha256sum | awk '{print $1}')
          [ "$L" = "$EXPECTED_LOCKFILE_SHA256" ] || { echo "::error::lockfile difere do pinado ($L)"; exit 1; }
          node -e "const p=require('./desktop/package.json'); if(p.version!=='$EXPECTED_VERSION'){console.error('version '+p.version);process.exit(1);} console.log('version OK '+p.version);"
          # DIFF DE PRODUTO vs v1.0.252 (b7656aee) = renderer (Hoje Actionability) + bump + QA
          # tooling. NADA de backend/updater/electron-builder/main. Prova a tese do candidato.
          D=$(git diff --name-only "$V252_TAG_SHA" "$PRODUCT_SOURCE_SHA" -- desktop | sort | tr '\n' ' ')
          echo "diff desktop vs v1.0.252: $D"
          [ "$D" = "desktop/package.json desktop/scripts/visual-qa-i7202-hoje-actionability.mjs desktop/src/renderer/index.html " ] || { echo "::error::diff de produto inesperado vs v1.0.252"; exit 1; }
          U=$(git diff --name-only "$V252_TAG_SHA" "$PRODUCT_SOURCE_SHA" -- desktop/src/main desktop/electron-builder.yml | tr '\n' ' ')
          [ -z "$U" ] || { echo "::error::main/updater/electron-builder alterados vs v1.0.252: $U"; exit 1; }
          echo "PROVENANCE OK: source=$PRODUCT_SOURCE_SHA renderer=$R lockfile=$L version=$EXPECTED_VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "BUILD FINAL UNICO — npm ci + build + NSIS x64 + MSI x64 + GATE ASAR + IMMUTABILITY"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
          EX="$RUNNER_TEMP/asarx"; rm -rf "$EX"; mkdir -p "$EX"
          npx --yes @electron/asar extract dist-installer/win-unpacked/resources/app.asar "$EX"
          PKG="$EX/package.json" node -e "const p=JSON.parse(require('fs').readFileSync(process.env.PKG,'utf8')); if(p.version!=='$EXPECTED_VERSION')process.exit(1); console.log('asar version OK '+p.version);"
          git show "$PRODUCT_SOURCE_SHA":desktop/src/renderer/index.html > "$RUNNER_TEMP/src-index.html"
          A="$EX/src/renderer/index.html" B="$RUNNER_TEMP/src-index.html" node -e '
            const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");
            if(n(fs.readFileSync(process.env.A,"utf8"))!==n(fs.readFileSync(process.env.B,"utf8"))){console.error("renderer empacotado != fonte");process.exit(1);}
            console.log("renderer empacotado == fonte (byte-identico)");'
          US="$EX/dist/main/updaterService.js"
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error::allowPrerelease!=false no asar"; exit 1; }
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"latest"' "$US" || { echo "::error::channel!=latest no asar"; exit 1; }
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error::allowDowngrade!=false no asar"; exit 1; }
          grep -Fq 'quitAndInstall(true, true)' "$US" || { echo "::error::fix do updater ausente no asar"; exit 1; }
          if grep -Fq 'quitAndInstall(false' "$US"; then echo "::error::chamada assistida no asar"; exit 1; fi
          ST=$(git status --porcelain -- desktop/src desktop/package.json desktop/package-lock.json desktop/electron-builder.yml)
          [ -z "$ST" ] || { echo "::error::build alterou source: $ST"; exit 1; }
          echo "GATE ASAR + IMMUTABILITY OK"

      - name: "ASSETS + SHA256SUMS + VERSAO-DESKTOP.txt + MANIFEST + CONTRATO latest.yml (mesmo build)"
        working-directory: desktop/dist-installer
        run: |
          set -euo pipefail
          EXE="Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.exe"
          MSI="Agenda-ID-Seven-Desktop-$EXPECTED_VERSION-x64.msi"
          BMAP="$EXE.blockmap"
          for f in "$EXE" "$MSI" "$BMAP" latest.yml; do [ -f "$f" ] || { echo "::error::asset ausente: $f"; exit 1; }; done
          sha256sum "$EXE" "$MSI" "$BMAP" latest.yml > SHA256SUMS
          echo "$EXPECTED_VERSION" > VERSAO-DESKTOP.txt
          grep -q "^version: $EXPECTED_VERSION$" latest.yml || { echo "::error::latest.yml version"; exit 1; }
          grep -q "url: $EXE" latest.yml || { echo "::error::latest.yml nao referencia o exe deste build"; exit 1; }
          SHA512=$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)
          grep -q "$SHA512" latest.yml || { echo "::error::sha512 do exe nao bate com latest.yml"; exit 1; }
          SIZE=$(stat -c%s "$EXE")
          grep -q "size: $SIZE" latest.yml || { echo "::error::size do exe nao bate com latest.yml"; exit 1; }
          echo "CONTRATO latest.yml OK (version/url/sha512/size == NSIS deste run)"
          {
            echo "== FINAL 1.0.253 ARTIFACT MANIFEST =="
            echo "PRODUCT_SOURCE_SHA: $PRODUCT_SOURCE_SHA"
            echo "VERSION: $EXPECTED_VERSION"
            for f in "$EXE" "$MSI" "$BMAP" latest.yml SHA256SUMS VERSAO-DESKTOP.txt; do
              H=$(sha256sum "$f" | awk '{print $1}'); B=$(stat -c%s "$f")
              echo "asset: $f | bytes: $B | sha256: $H | arch: x64 | signing: unsigned-by-design | source: $PRODUCT_SOURCE_SHA"
            done
          } | tee "$RUNNER_TEMP/FINAL-253-MANIFEST.txt"
          cat "$RUNNER_TEMP/FINAL-253-MANIFEST.txt" >> "$GITHUB_STEP_SUMMARY"
          { printf '{"source":"%s","version":"%s","assets":[' "$PRODUCT_SOURCE_SHA" "$EXPECTED_VERSION"
            first=1
            for f in "$EXE" "$MSI" "$BMAP" latest.yml SHA256SUMS VERSAO-DESKTOP.txt; do
              H=$(sha256sum "$f" | awk '{print $1}'); B=$(stat -c%s "$f")
              [ $first -eq 1 ] || printf ','; first=0
              printf '{"name":"%s","bytes":%s,"sha256":"%s"}' "$f" "$B" "$H"
            done
            printf ']}'
          } > "$RUNNER_TEMP/rc253-manifest.json"

      - name: "BASELINE PUBLICA v1.0.252 — download + verificacao SHA256SUMS"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"; cd "$RUNNER_TEMP/baseline"
          BASE="https://github.com/agidseven-lang/Agenda/releases/download/$BASELINE_TAG"
          curl -sSL -o baseline.exe "$BASE/Agenda-ID-Seven-Desktop-1.0.252-x64.exe"
          curl -sSL -o SHA256SUMS "$BASE/SHA256SUMS"
          EXP=$(grep "Agenda-ID-Seven-Desktop-1.0.252-x64.exe$" SHA256SUMS | awk '{print $1}')
          GOT=$(sha256sum baseline.exe | awk '{print $1}')
          [ "$EXP" = "$GOT" ] || { echo "::error::baseline 1.0.252 nao confere"; exit 1; }
          echo "BASELINE 1.0.252 OK ($GOT)"

      - name: "Instalar baseline 1.0.252 (/S) — setup de QA"
        shell: powershell
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\baseline\baseline.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "baseline install exit $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 3
          $dir = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { Test-Path (Join-Path $_.FullName "Agenda ID Seven Desktop.exe") } | Select-Object -First 1
          if (-not $dir) { Write-Error "baseline nao instalada"; exit 1 }
          "INSTALL_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "baseline 1.0.252 instalada em: $($dir.FullName)"

      - name: "FEED local com os ASSETS 1.0.253 (127.0.0.1:8879; producao intocada)"
        shell: powershell
        run: |
          $feed = "$env:RUNNER_TEMP\feed"
          New-Item -ItemType Directory -Force -Path $feed | Out-Null
          Copy-Item "desktop\dist-installer\latest.yml" $feed
          Copy-Item "desktop\dist-installer\Agenda-ID-Seven-Desktop-1.0.253-x64.exe" $feed
          Copy-Item "desktop\dist-installer\Agenda-ID-Seven-Desktop-1.0.253-x64.exe.blockmap" $feed
          Start-Process python -ArgumentList "-m","http.server",$env:FEED_PORT,"--bind","127.0.0.1","--directory",$feed -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..15) { Start-Sleep -Seconds 2; try { $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:FEED_PORT/latest.yml" -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { } }
          if (-not $ok) { Write-Error "feed local nao respondeu em 30s"; exit 1 }
          $au = Join-Path $env:INSTALL_DIR "resources\app-update.yml"
          Copy-Item $au "$au.bak"
          @"
          provider: generic
          url: http://127.0.0.1:$env:FEED_PORT
          channel: latest
          updaterCacheDirName: agenda-id-seven-desktop-updater
          "@ | Out-File -FilePath $au -Encoding utf8
          Write-Host "feed 1.0.253 OK; instancia baseline 1.0.252 apontada ao feed local"

      - name: "SESSAO A — UPDATE 1.0.252 -> 1.0.253 (silencioso /S; REQUIRED_USER_INSTALL_ACTIONS=0)"
        timeout-minutes: 15
        working-directory: desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm i --no-save playwright@1.47.2 --no-audit --no-fund
          cat > au-a.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const out = { g: {} }; const g = out.g;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const app = await _electron.launch({ executablePath: exe, args: [] });
          const pg = await app.firstWindow({ timeout: 45000 });
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          const before = await pg.evaluate(() => ({ ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null, upd: !!(window.desktopAPI && window.desktopAPI.updater) }));
          out.before = before;
          g.a1_baselineIs252 = before.ver === '1.0.252';
          g.a2_updaterApi = before.upd === true;
          const st = () => pg.evaluate(() => window.desktopAPI.updater.getState());
          const poll = async (want, ms) => { const t0 = Date.now(); for (;;) { const s = await st(); if (want.includes(s.status)) return s; if (Date.now() - t0 > ms) return s; await sleep(500); } };
          await pg.evaluate(() => { window.desktopAPI.updater.check(); });
          let s = await poll(['update_available'], 30000);
          out.avail = { status: s.status, version: s.availableVersion };
          g.b1_253Available = s.status === 'update_available' && s.availableVersion === '1.0.253';
          await pg.evaluate(() => { window.desktopAPI.updater.download(); });
          { const t0 = Date.now(); for (;;) { const x = await st(); if (x.status === 'downloaded' || x.status === 'error') { s = x; break; } if (Date.now() - t0 > 120000) { s = x; break; } await sleep(400); } }
          out.dl = s.status;
          g.b2_downloadedSha512Valid = s.status === 'downloaded';
          pg.evaluate(() => { window.desktopAPI.updater.installAndRestart(); }).catch(() => {});
          let closed = false;
          try { await Promise.race([new Promise(res => app.on('close', () => { closed = true; res(); })), sleep(30000)]); } catch (_) {}
          if (!closed) { try { const x = await st(); closed = (x.status === 'installing'); } catch (_) { closed = true; } }
          out.appClosedByUpdater = closed;
          g.c1_installTriggered = closed === true;
          const fails = Object.entries(g).filter(([k, v]) => !v).map(([k]) => k);
          out.fails = fails;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/rc253-sessionA.json', JSON.stringify(out));
          console.log(JSON.stringify(out, null, 1));
          try { await Promise.race([app.close(), sleep(4000)]); } catch (_) {}
          if (fails.length) { console.error('FAILS A:', fails); }
          process.exit(fails.length ? 1 : 0);
          EOF
          node au-a.mjs

      - name: "Confirmar upgrade instalado == 1.0.253 (asar) + sem janela de instalador residual"
        shell: powershell
        run: |
          $target = (Get-FileHash "desktop\dist-installer\win-unpacked\resources\app.asar" -Algorithm SHA256).Hash
          $deadline = (Get-Date).AddSeconds(180); $done = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $asar = Join-Path $env:INSTALL_DIR "resources\app.asar"
            if (Test-Path $asar) { try { if ((Get-FileHash $asar -Algorithm SHA256).Hash -eq $target) { $done = $true; break } } catch { } }
          }
          if (-not $done) { Write-Error "FAIL: asar instalado != 1.0.253 (upgrade silencioso nao concluiu)"; exit 1 }
          Start-Sleep -Seconds 3
          $setup = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "*Setup*" -or $_.MainWindowTitle -like "*Instal*" }).Count
          if ($setup -ne 0) { Write-Error "FAIL: janela de instalador residual"; exit 1 }
          Get-Process | Where-Object { $_.ProcessName -like "*Agenda*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "UPGRADE 252->253 SILENCIOSO OK (asar==1.0.253; sem setup residual)"

      - name: "SESSAO B — 1.0.253 instalada: HOJE H1-H18 + OPTION B (SB/CN/NAV) + freeze T/D/C + Hub + E1 manifest + evidencias"
        timeout-minutes: 25
        working-directory: desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cat > au-b.mjs <<'EOF'
          import { _electron } from 'playwright';
          import fs from 'fs';
          const exe = process.env.INSTALL_DIR + '\\Agenda ID Seven Desktop.exe';
          const out = { g: {}, info: {} }; const g = out.g; const I = out.info;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const app = await _electron.launch({ executablePath: exe, args: [] });
          const pg = await app.firstWindow({ timeout: 45000 });
          const perr = []; pg.on('pageerror', e => perr.push(String(e).slice(0, 160)));
          await pg.waitForLoadState('load'); await pg.waitForTimeout(4000);
          const a = await pg.evaluate(() => ({
            ver: (typeof APP_VER !== 'undefined' && APP_VER.desktop) || null,
            title: document.title,
            white: (document.body.innerText || '').trim().length < 2,
            loginPwd: !!document.querySelector('input[type="password"]')
          }));
          out.after = a;
          g.d1_versionIs253 = a.ver === '1.0.253' && a.title.includes('1.0.253');
          g.d2_noWhiteScreen = a.white === false;
          g.d0_loginSurface = a.loginPwd === true;
          try { await app.evaluate(({ BrowserWindow }) => { const w = BrowserWindow.getAllWindows()[0]; if (w) w.setContentSize(1920, 1080); }); } catch (_) {}
          await pg.waitForTimeout(800);
          // LICAO E1: suprimir reveals tardios de login durante a sessao de QA (registrado)
          await pg.evaluate(() => { window.__qaRevealSuppressed = []; window._revealLogin = function (r) { window.__qaRevealSuppressed.push(String(r || '')); }; });
          const D = n => { const d = new Date(Date.now() + n * 86400000); return d.toISOString().slice(0, 10); };
          await pg.evaluate(({ d0, d1, d2 }) => {
            state.user = { id: 'carlos', name: 'Carlos Eduardo', role: 'Social Media', admin: true };
            state.users = [state.user, { id: 'marina', name: 'Marina Klein', role: 'Designer' }, { id: 'helio', name: 'Helio Duarte', role: 'Designer' }, { id: 'bia', name: 'Bia Rocha', role: 'Social Media' }, { id: 'op1', name: 'Otavio Prado', role: 'Editor de video' }];
            document.body.classList.add('desktop', 'authed', 'light-ui');
            const asp = document.getElementById('authSplash'); if (asp) asp.style.display = 'none';
            const lg = document.getElementById('login'); if (lg) lg.classList.add('hidden');
            const ap = document.getElementById('app'); if (ap) ap.style.display = 'flex';
            state.tasks = [
              { id: 'k1', title: 'Post de Agenda Aberta - histeroscopias', client: 'Dra. Helita Freitas', sector: 'edicao_cards', by: 'carlos', assigneeId: 'carlos', status: 'afazer', dueDate: '2026-08-20', dueTime: '19:05', cardLegenda: 'Agenda aberta' },
              { id: 'k2', title: 'Edicao de videos - Agosto', client: 'Hospital Visao', sector: 'edicao_midia', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: d1, dueTime: '17:00', priority: true, videos: [{ tema: 'v1' }, { tema: 'v2' }, { tema: 'v3' }], checklist: [{ t: '1' }, { t: '2' }, { t: '3' }, { t: '4' }, { t: '5' }] },
              { id: 'k3', title: 'Reels de lancamento', client: 'Sunset Wear', sector: 'edicao_cards', by: 'marina', assigneeId: 'carlos', status: 'revisao', dueDate: d0, dueTime: '23:00' },
              { id: 'k4', title: 'Cronograma Setembro', client: 'Sunset Wear', sector: 'edicao_cards', by: 'carlos', assigneeId: null, status: 'concluido', dueDate: '2026-08-22' },
              { id: 'c1', title: 'Cronograma Setembro - Sunset Wear', client: 'Sunset Wear', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'afazer', dueDate: d2, dueTime: '10:00', cronContents: [{ tema: 'Tema 1' }, { tema: 'Tema 2' }, { tema: 'Tema 3' }] },
              { id: 'cB', title: 'Cronograma Outubro - Hospital Visao', client: 'Hospital Visao', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: d1, dueTime: '18:00', workflowPhase: 'captions_waiting_client', cronContents: [{ tema: 'Tema A' }, { tema: 'Tema B' }] },
              { id: 'cC', title: 'Cronograma Clinica Vida - ajustes', client: 'Clinica Vida', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: '2026-08-20', dueTime: '16:00', clientReview: { status: 'revisao', note: 'Trocar o tema 2.', at: Date.now() - 3600000, byName: 'Cliente' }, cronContents: [{ tema: 'Tema X' }] },
              { id: 'cD', title: 'Cronograma Agosto - Colegio Alfa', client: 'Colegio Alfa', sector: 'cronograma', by: 'carlos', assigneeId: 'carlos', status: 'concluido', dueDate: '2026-08-22', finalApprovalCompleted: true, clientReview: { status: 'aprovado', at: Date.now() - 7200000, byName: 'Cliente' }, cronContents: [{ tema: 'Tema 1' }] },
              { id: 't5', title: 'Video institucional - cortes finais', client: 'Colegio Alfa', sector: 'edicao_midia', by: 'carlos', assigneeId: 'marina', status: 'andamento', dueDate: d2, dueTime: '12:00', designerAssignment: { designerId: 'marina', designerName: 'Marina Klein', status: 'in_progress', assignedAt: Date.now() - 7200000 }, videos: [{ tema: 'Manifesto' }] },
              { id: 'k5', title: 'Pacote completo de artes do lancamento da colecao primavera - stories, feed, capa e destaques', client: 'Sunset Wear', sector: 'edicao_cards', by: 'carlos', assigneeId: 'carlos', status: 'andamento', dueDate: d1, dueTime: '17:00' },
              { id: 'k6', title: 'Cronograma Setembro - rodada 2', client: 'Sunset Wear', sector: 'cronograma', by: 'marina', assigneeId: 'carlos', status: 'andamento', priority: true, dueDate: '2026-08-20', dueTime: '12:00', cronContents: [{ tema: 'Tema 1', legenda: 'Legenda 1' }, { tema: 'Tema 2' }], clientReview: { status: 'revisao', note: 'Ajustar o tema 2.', at: Date.now() - 3600000, byName: 'Cliente' }, designerAssignment: { designerId: 'marina', designerName: 'Marina Klein', status: 'in_progress', assignedAt: Date.now() - 7200000 } },
              { id: 'o1', title: 'Cortes rapidos - stories', client: 'Clinica Vida', sector: 'edicao_cards', by: 'op1', assigneeId: 'op1', status: 'afazer', dueDate: d1, dueTime: '09:30' },
              { id: 'o2', title: 'Ajuste de thumbnail - outubro', client: 'Colegio Alfa', sector: 'edicao_midia', by: 'carlos', assigneeId: 'op1', status: 'andamento', dueDate: d2, dueTime: '14:00' }
