# Build do APK do app SaaS NATIVO BETA (Kotlin + Jetpack Compose) em /android-native-beta.
# App em PARALELO ao PWA e ao app aprovado — package br.com.idseven.agenda.nativebeta.
# Fase 0: app limpo (abre + tela smoke + proteção contra crash). Firebase entra na Fase 1.
name: Build Android Nativo Beta (SaaS)

on:
  workflow_dispatch:
  push:
    branches: [feat/android-native-saas]
    paths:
      - 'android-native-beta/**'
      - '.github/workflows/build-android-native-beta.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar debug keystore (assinatura de teste)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restaurar google-services.json (secret GOOGLE_SERVICES_JSON_BETA — texto puro)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BETA }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BETA ausente — necessário pelo plugin google-services (Firebase) a partir da Fase 1."
            exit 1
          fi
          printf '%s' "$GS_JSON" > android-native-beta/app/google-services.json
          echo "google-services.json gravado ($(wc -c < android-native-beta/app/google-services.json) bytes)."

      - name: gradlew clean assembleRelease
        working-directory: android-native-beta
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload APK release (nome único por versão + commit)
        uses: actions/upload-artifact@v4
        with:
          name: idseven-nativebeta-1.0.1-beta-polish-${{ github.sha }}
          path: android-native-beta/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
