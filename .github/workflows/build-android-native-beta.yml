# Build do APK do app SaaS NATIVO BETA (Kotlin + Jetpack Compose) em /android-native-beta.
# App em PARALELO ao PWA e ao app aprovado — package br.com.idseven.agenda.nativebeta.
# Fase 0: app limpo (abre + tela smoke + proteção contra crash). Firebase entra na Fase 1.
name: Build Android Nativo Beta (SaaS)

on:
  workflow_dispatch:
  push:
    branches: [feat/android-native-saas]
    paths:
      - 'android-native-beta/**'
      - '.github/workflows/build-android-native-beta.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar debug keystore (assinatura de teste)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: (Opcional) Restaurar google-services.json — usado a partir da Fase 1 (Firebase)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android-native-beta/app/google-services.json
            echo "google-services.json restaurado ($(wc -c < android-native-beta/app/google-services.json) bytes)."
          else
            echo "Secret GOOGLE_SERVICES_JSON_BASE64 ausente — OK na Fase 0 (app ainda não usa Firebase)."
          fi

      - name: gradlew clean assembleRelease
        working-directory: android-native-beta
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload APK release (nome único por versão + commit)
        uses: actions/upload-artifact@v4
        with:
          name: idseven-nativebeta-0.1.0-fase0-${{ github.sha }}
          path: android-native-beta/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
