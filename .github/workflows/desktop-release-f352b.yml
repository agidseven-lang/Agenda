# =====================================================================
# [manual] F3.5.2B — Publicacao da RELEASE ESTAVEL Desktop 1.0.189 (Edicao de Cards · Kanban compacto; Latest)
# ---------------------------------------------------------------------
# Publica a release ESTAVEL de PRODUCAO 1.0.189 (canal latest) = 1.0.188 + layout COMPACTO do card de
# "Edicao de Cards" no Kanban (correcao EXCLUSIVAMENTE VISUAL, isolada ao setor): o card usa ALTURA
# NATURAL do conteudo (deixa de esticar/preencher a coluna quando e o unico), eliminando o vao vazio.
# Revertendo as 2 edicoes, o index.html volta BYTE-A-BYTE a 1.0.188. cardsRules.js/slaRules.js/Card
# Premium/notificacoes T-30/T-10/datas inicio+termino/demais setores: BYTE-IDENTICOS a 1.0.188. Usa
# EXCLUSIVAMENTE os BYTES do run de build F3.5.2B (gated, verde). Substitui a 1.0.188 como Latest (SEM
# downgrade: 1.0.189 > 1.0.188 no updater). NAO RECOMPILA: baixa os 2 artifacts e publica os MESMOS bytes.
# TUDO PINADO (preenchido apos o build verde): run id, digests dos artifacts, 5 hashes SHA-256, tag e
# titulo. ESCRITAS (tag + release + assets + Latest) via TOKEN TEMPORARIO do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho) — NENHUM RELEASE_PAT, NENHUM GITHUB_TOKEN de escrita. Execucao SO manual,
# autorizada pelo literal PUBLICAR-DESKTOP-1.0.189-STABLE. NAO builda/deploya/toca Firebase/Worker/Rules/
# Android/portal/Cloud Run; NAO mexe em releases/tags antigas (1.0.188/1.0.187/1.0.186).
# =====================================================================
name: "[manual] F3.5.2B Desktop Stable Release — 1.0.189 (Latest, Edicao de Cards · Kanban compacto)"

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLICAR-DESKTOP-1.0.189-STABLE para autorizar"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM (preenchida apos o build F3.5.2B verde; placeholders bloqueiam a publicacao) ──
      RUN_ID: "30291176137"
      STABLE_SHA: "92cfb018c46beb92f7ee43f1e954661b92a41bac"
      DESK_BRANCH: "desktop/f352b-cards-kanban-compact-layout"
      TAG: "v1.0.189"
      TITLE: "Agenda ID Seven Desktop 1.0.189 — Produção Estável (Edição de Cards · Kanban compacto)"
      ART_INST: "agenda-id-seven-desktop-1.0.189-installer"
      ART_INST_DIGEST: "sha256:d19fd83b6789a9e6d84dc930b1f8509f929aa67bb05b67a3d3e7788665e78c5f"
      ART_META: "agenda-id-seven-desktop-1.0.189-updatemeta"
      ART_META_DIGEST: "sha256:9b4c36cd0d9ed207542e0a00ead5c5aea4e4e499e6c0e837bed7afb6311e8841"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.189-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.189-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.189-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      SBOM_NAME: "SBOM-cyclonedx.json"
      EXP_EXE: "cdbc91c9c52a52bbe632f6222fac5b95f161ff4c276685f8a86791092f44e834"
      EXP_MSI: "1da5569f84d8247cf565dda44ad596a89da06a461ae8c9b9ce0026b3b452e861"
      EXP_LY: "c48a215c41ccb980e96f274facbacf4bcefc6a871e70b2c2aa420b252d2064da"
      EXP_BM: "c71a80e64cfb444542b65ef309f2eb996df119eeb3712aced710ad2ca2efa5cc"
      EXP_SBOM: "a9bcbf08c61509775f7e8b757d3c67f20a2b68d961e91fb4a93f0df8530d0ab8"
      PROD_PREV_TAG: "v1.0.188"
      PROD_ROLLBACK_TAG: "v1.0.188"
      PROD_HIST_TAG: "v1.0.187"
    steps:
      - name: "Gate 0 — pinagem preenchida (bloqueia publicacao enquanto houver placeholder)"
        run: |
          set -euo pipefail
          for v in "$RUN_ID" "$ART_INST_DIGEST" "$ART_META_DIGEST" "$EXP_EXE" "$EXP_MSI" "$EXP_LY" "$EXP_BM" "$EXP_SBOM"; do
            case "$v" in __FILL_*__) echo "::error::pinagem incompleta ($v) — preencha run/digests/hashes apos o build verde. NADA publicado."; exit 1;; esac
          done
          echo "OK: pinagem completa"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — confirmacao literal"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "PUBLICAR-DESKTOP-1.0.189-STABLE" ] || { echo "::error::confirmacao invalida — nada publicado"; exit 1; }
          echo "OK: confirmacao literal valida"

      - name: "Gate 2 — run de build completed/success"
        run: |
          set -euo pipefail
          ST="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "|" + .conclusion')"
          echo "run $RUN_ID: $ST"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }

      - name: "Gate 3 — STABLE_SHA e commit real e pertence a linhagem do candidato (alvo da tag)"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$STABLE_SHA" --jq '.sha' >/dev/null || { echo "::error::commit $STABLE_SHA nao existe"; exit 1; }
          H="$(gh api "repos/$REPO/git/ref/heads/$DESK_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::$STABLE_SHA fora da linhagem do candidato ($CMP)"; exit 1; }

      - name: "Gate 4 — release NAO existe; tag so pode preexistir apontando para STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 5 — artifacts: ids+digests conferem"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" "$SBOM_NAME" SHA256SUMS; do
            test -f "pacote/$f" || { echo "::error::asset ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 6 — 5 hashes SHA-256 conferem (aborta se divergir)"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["$SBOM_NAME"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.189" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.189"; exit 1; }
          grep -qF "$EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml nao referencia o EXE"; exit 1; }
          grep -Eq '^channel +: latest$' pacote/VERSAO-DESKTOP.txt || { echo "::error::channel != latest"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.189/EXE) + channel=latest"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.189 — Produção Estável (Edição de Cards · Kanban compacto)

          Sucessora da 1.0.188 como versão oficial (Latest), canal ESTÁVEL (latest). Atualização
          EXCLUSIVAMENTE pelo ATUALIZADOR INTERNO do app (Configurações → Atualizações → Verificar →
          Baixar → Instalar e reiniciar). Não é necessário baixar nada manualmente. NÃO é downgrade:
          1.0.189 é uma versão nova e superior à 1.0.188 no atualizador.

          O QUE MUDA vs 1.0.188 (F3.5.2B — correção VISUAL do card de Edição de Cards no Kanban)
          - No quadro (Kanban), o card do setor "Edição de Cards" passa a ter ALTURA AUTOMÁTICA, acompanhando
            apenas o conteúdo realmente exibido. Elimina-se o grande espaço vazio / a altura excessiva que
            apareciam quando o card era o único da coluna.
          - NENHUMA informação foi removida ou reordenada: status, prazo, responsável, remetente, cliente, tema,
            identificação "Edição de Cards", progresso, etapa atual, próxima ação, data/hora e os botões
            Detalhes/Mover/Menu continuam iguais. Botões logo após as informações; sem rolagem interna no card;
            largura da coluna inalterada.
          - Correção ISOLADA ao setor edicao_cards (classe .kbv2-card--cards, aplicada só quando
            sector==="edicao_cards"). Edição de vídeos, Cronograma, Roteiro e Programação de posts ficam
            VISUAL e FUNCIONALMENTE IDÊNTICOS à 1.0.188.

          PRESERVAÇÃO (zero regressão vs 1.0.188) — SOMENTE VISUAL
          - Revertendo as 2 edições do index.html (o marcador no card + o override CSS), o arquivo volta
            BYTE-A-BYTE à 1.0.188. Nada de dados, fluxo, campos, prazos, status ou funcionamento muda.
          - Card Premium do WhatsApp, geração/persistência de links e tokens, Cronograma, Roteiro, aprovação,
            portal do cliente, Worker J6, SLA, Agenda, Kanban dos outros setores, movimentação, drag-and-drop,
            detalhes, edição, tray/X, atualizador interno: BYTE-IDÊNTICOS à 1.0.188. Notificações de Edição de
            Cards (AMARELA T-30 / VERMELHA T-10, destinatário, dedup, clique/abertura) e as datas de início e
            término das tarefas: PRESERVADAS. Android/Firestore Rules/Functions/Cloud Run: INTOCADOS.
          - Rollback: 1.0.188 PRESERVADA (re-marcar Latest); 1.0.187/1.0.186 preservadas.

          UPDATER (produção): allowPrerelease=false, channel="latest", allowDowngrade=false (no app.asar).
          Metadata do MESMO build: latest.yml + <exe>.blockmap; app-update.yml só dentro do pacote.

          Procedência: run de build F3.5.2B (success); fonte desktop/f352b-cards-kanban-compact-layout @ commit
          pinado (1.0.188 OFICIAL + F3.5.2B, provado pelos gates de byte-identidade e pela prova-mestra de
          reversão). Mesmos bytes; sem recompilar. Confira o SHA-256 (SHA256SUMS anexado; sha256sum -c SHA256SUMS).
          NOTAS

      - name: "Criar tag pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release ESTAVEL (prerelease=false, latest=true) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$BM_NAME" "pacote/$LY_NAME" "pacote/$SBOM_NAME" "pacote/SHA256SUMS"
          echo "publicado: $TAG"

      - name: "Pos-verificacao (Latest=1.0.189; 1.0.188/1.0.187/1.0.186 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.189 ESTAVEL PUBLICADA e Latest; 1.0.188/1.0.187/1.0.186 preservadas ====="

      - name: "Smoke — re-baixar EXE + latest.yml + SBOM e reconferir hashes"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          gh release download "$TAG" -R "$REPO" -p "$EXE_NAME" -p "$LY_NAME" -p "$SBOM_NAME" -D smoke
          [ "$(sha256sum "smoke/$EXE_NAME" | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::smoke EXE hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$LY_NAME" | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::smoke latest.yml hash divergente"; exit 1; }
          [ "$(sha256sum "smoke/$SBOM_NAME" | awk '{print $1}')" = "$EXP_SBOM" ] || { echo "::error::smoke SBOM hash divergente"; exit 1; }
          echo "SMOKE OK: EXE + latest.yml + SBOM publicados conferem byte a byte."
