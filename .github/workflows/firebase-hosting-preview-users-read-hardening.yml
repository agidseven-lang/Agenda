# =====================================================================
# [manual] Firebase Hosting PREVIEW CHANNEL — users-read-hardening (patch W1 do cutover).
# F3.3.57-W3b-a2: REAPONTADO do patch antigo/superado (PR #120, app/f3328@3e3b07b, flags
# default OFF) para o patch W1 vigente: branch web-hardening-w1-prep @ bda7ec9 (3 flags
# default ON + auto-cadastro bloqueado; W2 73/73; W3 pacote validado). Publica essa branch
# SOMENTE num CANAL PREVIEW efemero (nunca o canal live/producao), para validar o cutover
# com backend real sem afetar a populacao geral.
#
# FAIL-CLOSED e DORMENTE: dry_run=true por padrao (nao publica nada). Mesmo com
# dry_run=false, so executa `firebase hosting:channel:deploy` (canal preview) com config
# hosting-only dedicada; NUNCA `firebase deploy` / `--only hosting` (live) / functions /
# firestore / rules. NAO toca Card Premium / cloudflare-worker.js / Worker /send / Desktop.
#
# ESTA FASE (F3.3.57-W3b-a2) APENAS REAPONTA O WORKFLOW — NAO DEVE SER EXECUTADO AQUI.
# A execucao real (dry_run=false) e uma fase propria, gated, idealmente conduzida/observada
# pelo owner (que controla a service account de producao). Rollback: expira sozinho (--expires)
# ou `firebase hosting:channel:delete <preview_channel> --project agenda-id-seven`.
# =====================================================================
name: "[manual] Firebase Hosting PREVIEW (users-read-hardening W1 · web-hardening-w1-prep)"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch do patch W1 do cutover (fixa)"
        required: true
        default: "web-hardening-w1-prep"
      expected_head:
        description: "HEAD esperado da branch (curto ou completo)"
        required: true
        default: "bda7ec9"
      preview_channel:
        description: "Nome do canal preview (nunca live/prod/main)"
        required: true
        default: "web-hardening-w3"
      confirm_preview_only:
        description: "Digite DEPLOY_PREVIEW_ONLY para confirmar canal preview"
        required: true
        default: ""
      dry_run:
        description: "true = valida sem publicar (padrao); false = publica SOMENTE no canal preview"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: fb-hosting-preview-users-read-hardening
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  ALLOWED_BRANCH: "web-hardening-w1-prep"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Guards de input (fail-closed; canal preview; branch fixa)
        env:
          CB: ${{ github.event.inputs.target_branch }}
          CH: ${{ github.event.inputs.preview_channel }}
          CONF: ${{ github.event.inputs.confirm_preview_only }}
          DR: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          if [ "$CONF" != "DEPLOY_PREVIEW_ONLY" ]; then echo "::error:: confirm_preview_only != DEPLOY_PREVIEW_ONLY"; exit 1; fi
          case "$DR" in true|false) : ;; *) echo "::error:: dry_run deve ser true|false (recebido: $DR)"; exit 1 ;; esac
          if [ "$CB" = "main" ]; then echo "::error:: target_branch=main proibido"; exit 1; fi
          if [ "$CB" = "app/main" ]; then echo "::error:: target_branch=app/main proibido"; exit 1; fi
          if [ "$CB" != "$ALLOWED_BRANCH" ]; then echo "::error:: target_branch != $ALLOWED_BRANCH"; exit 1; fi
          if [ -z "$CH" ]; then echo "::error:: preview_channel vazio"; exit 1; fi
          case "$CH" in
            live|*live*|*prod*|*production*|*main*|*appmain*) echo "::error:: preview_channel proibido (parece producao/live): $CH"; exit 1 ;;
          esac
          echo "Guards de input OK (dry_run=$DR; branch=$CB; canal=$CH)."

      - name: Checkout (target_branch fixa)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Confirmar HEAD == expected_head e diff SO index.html vs app/main
        env:
          HD: ${{ github.event.inputs.expected_head }}
        run: |
          set -eu
          H="$(git rev-parse HEAD)"
          case "$H" in
            "$HD"*) : ;;
            *) echo "::error:: HEAD ($H) != expected_head ($HD)"; exit 1 ;;
          esac
          git fetch origin app/main --depth=1 >/dev/null 2>&1 || true
          DIFF="$(git diff --name-only origin/app/main...HEAD 2>/dev/null || git diff --name-only FETCH_HEAD...HEAD)"
          echo "diff vs app/main:"; printf '%s\n' "$DIFF"
          if [ "$DIFF" != "index.html" ]; then echo "::error:: diff vs app/main deve ser SOMENTE index.html (obtido: $DIFF)"; exit 1; fi
          if printf '%s\n' "$DIFF" | grep -Eq 'cloudflare-worker\.js|desktop/|firestore\.rules|firestore\.indexes|(^|/)functions/|/share|/og/|wa-card'; then
            echo "::error:: arquivo proibido (Card/Desktop/Worker/Rules/functions) no diff"; exit 1
          fi
          echo "HEAD e diff OK (somente index.html; nada de Card/Desktop/Worker/Rules)."

      - name: Montar .staging-public (allowlist FIXA de 6, da branch) + self-check
        run: |
          set -eu
          rm -rf .staging-public && mkdir -p .staging-public
          for f in index.html manifest.json sw.js firebase-messaging-sw.js icon-192.png icon-512.png; do
            [ -f "$f" ] || { echo "::error:: arquivo ausente: $f"; exit 1; }
            cp "$f" ".staging-public/$f"
          done
          N="$(find .staging-public -type f | wc -l)"
          [ "$N" -eq 6 ] || { echo "::error:: .staging-public tem $N arquivos (esperado 6)"; exit 1; }
          if ls .staging-public | grep -qE 'functions|scripts|\.github|firebase\.json|\.firebaserc|package|node_modules|\.env|\.md$|wrangler|cloudflare|desktop'; then
            echo "::error:: arquivo interno detectado em .staging-public"; exit 1
          fi
          test -f .staging-public/index.html || { echo "::error:: .staging-public/index.html ausente"; exit 1; }
          test -f .staging-public/sw.js || { echo "::error:: .staging-public/sw.js ausente"; exit 1; }
          test -f .staging-public/firebase-messaging-sw.js || { echo "::error:: .staging-public/firebase-messaging-sw.js ausente"; exit 1; }
          A="$(sha256sum index.html | awk '{print $1}')"
          B="$(sha256sum .staging-public/index.html | awk '{print $1}')"
          [ "$A" = "$B" ] || { echo "::error:: index.html do pacote ($B) != da branch alvo ($A)"; exit 1; }
          # F3.3.57-W3b-a2: PIN dos hashes oficiais W3 (aborta se qualquer um divergir).
          pin(){ H="$(sha256sum ".staging-public/$1" | awk '{print $1}')"; [ "$H" = "$2" ] || { echo "::error:: hash W3 divergente em $1 ($H != $2)"; exit 1; }; }
          pin index.html               29ac9a9ad97b250db3c6646411129d40151512cc76b282615e32fab1f63931e3
          pin manifest.json            5143364eb9640fb55dc308d3ce15326452ea8b27058d2ec2898c92a9f5bd0820
          pin sw.js                    a042671afa3e9891ca6ee96449763fd4877d142fb7ea98076936916795aab003
          pin firebase-messaging-sw.js 64bb254d4dd8204a421cc4744f0f49c05c729435e0e1b26452646794229210aa
          pin icon-192.png             15dd146c151bf406d590a1f07a1950a7c82d7ceb6277a5b9ed5c0b8257fe6ba5
          pin icon-512.png             a29c86455b1ba2a6727309edb48c70a88909db772a01811a09a960c1fb3854bc
          echo ".staging-public OK (6 arquivos; index.html == branch; hashes W3 pinados 6/6; sha256=$A)."

      - name: Config hosting-only dedicada (sem functions/firestore/rules/predeploy)
        run: |
          set -eu
          cat > .firebase-preview.json <<'JSON'
          {
            "hosting": {
              "public": ".staging-public",
              "ignore": ["firebase.json", ".firebase-preview.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "appAssociation": "NONE",
              "cleanUrls": false,
              "trailingSlash": false
            }
          }
          JSON
          node -e "const d=require('./.firebase-preview.json'); if(d.functions) throw 'functions'; if(d.firestore) throw 'firestore'; if(d.rules) throw 'rules'; if(d.hosting.predeploy) throw 'predeploy'; if(d.hosting.public!=='.staging-public') throw 'public'; console.log('config preview hosting-only OK')"

      - name: Montar e validar comando (channel:deploy; fail-closed; sem producao)
        env:
          CH: ${{ github.event.inputs.preview_channel }}
        run: |
          set -eu
          CMD="firebase hosting:channel:deploy $CH --project $GCP_PROJECT --config .firebase-preview.json --expires 1d --non-interactive"
          echo "comando planejado: $CMD"
          case "$CMD" in
            "firebase hosting:channel:deploy "*) : ;;
            *) echo "::error:: comando nao e hosting:channel:deploy"; exit 1 ;;
          esac
          for BAD in 'firebase deploy' 'deploy --only hosting' '--only functions' '--only firestore' 'hosting:live' 'channels/live' ':live' 'firestore' 'functions' 'cloudflare-worker' 'desktop/'; do
            case "$CMD" in *"$BAD"*) echo "::error:: comando contem termo proibido: $BAD"; exit 1 ;; esac
          done
          printf 'PREVIEW_CMD<<EOF\n%s\nEOF\n' "$CMD" >> "$GITHUB_ENV"
          echo "Comando validado (channel:deploy; canal preview; sem prod/functions/firestore)."

      - name: Publicar SOMENTE canal preview (apenas se dry_run=false)
        env:
          DR: ${{ github.event.inputs.dry_run }}
          # F3.3.33-A2G: define CH neste step (mesmo padrao dos steps de guards/comando).
          # Sem isto, o echo do branch de sucesso (rollback) usava $CH indefinido e, sob
          # set -u, abortava o step APOS um deploy bem-sucedido (bug pos-deploy cosmetico).
          CH: ${{ github.event.inputs.preview_channel }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          if [ "$DR" != "false" ]; then
            echo "DRY-RUN=$DR — nada publicado. Comando planejado: $PREVIEW_CMD"
            exit 0
          fi
          [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ] || { echo "::error:: service account ausente (secret)"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          # F3.3.33-A2C: exporta a credencial no SHELL ATUAL. O $GITHUB_ENV acima so
          # disponibiliza a variavel para steps SEGUINTES; sem este export, o firebase
          # roda no mesmo step SEM ADC e falha ("Failed to authenticate"). Nao imprime
          # caminho/JSON/client_email/private_key.
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "::error:: credencial da service account ausente/vazia"; exit 1; }
          npm install -g firebase-tools >/dev/null 2>&1
          # Guard final: recusa se por qualquer motivo o comando nao for channel:deploy.
          case "$PREVIEW_CMD" in
            "firebase hosting:channel:deploy "*) : ;;
            *) echo "::error:: comando final nao e channel:deploy — abortando"; exit 1 ;;
          esac
          echo "Executando canal preview: $PREVIEW_CMD"
          set +e
          eval "$PREVIEW_CMD" > "$RUNNER_TEMP/preview.log" 2>&1
          rc=$?
          set -e
          # F3.3.33-A1C observabilidade: expoe a saida do firebase de forma SANITIZADA
          # (mascara tokens/JWT/credenciais/chaves) no log do job e em artifact (em falha).
          # Fail-closed: se a sanitizacao falhar, o log bruto e OMITIDO (nunca exposto).
          SAN="$GITHUB_WORKSPACE/preview-failure-log.txt"
          sed -E \
            -e 's#ya29\.[A-Za-z0-9._-]+#***TOKEN_REDACTED***#g' \
            -e 's#ey[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#***JWT_REDACTED***#g' \
            -e 's#(access_token|id_token|refresh_token|private_key_id|private_key|client_email|client_id|api_key|apikey|authorization|bearer)([":= ]+)[^,}" ]+#\1\2***REDACTED***#gI' \
            -e 's#-----BEGIN[A-Z ]*PRIVATE KEY-----#***PRIVATE_KEY_REDACTED***#g' \
            "$RUNNER_TEMP/preview.log" > "$SAN" 2>/dev/null || echo "(sanitizacao indisponivel; log bruto omitido por seguranca)" > "$SAN"
          if [ "$rc" = "0" ]; then
            grep -iE 'Channel URL|channel:|expire|version' "$SAN" || true
            echo "Canal preview publicado (efemero; --expires 1d). Rollback: firebase hosting:channel:delete $CH --project $GCP_PROJECT"
          else
            echo "::group::firebase hosting:channel:deploy — saida SANITIZADA (rc=$rc)"
            cat "$SAN" || true
            echo "::endgroup::"
            {
              echo "# Preview channel deploy — FALHA (sanitizado)"
              echo ""
              echo "- rc: $rc"
              echo "- canal: $CH (nao criado)"
              echo "- producao/live: intocada (channel:deploy nunca toca o canal live)"
              echo ""
              echo "## Saida sanitizada do firebase"
              cat "$SAN" 2>/dev/null || echo "(sem log)"
            } > "$GITHUB_WORKSPACE/workflow-summary.md" 2>/dev/null || true
            echo "::error:: hosting:channel:deploy falhou (rc=$rc) — ver log sanitizado (job log + artifact preview-failure-log)."
            exit "$rc"
          fi

      - name: Upload log de falha (sanitizado; somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-failure-log
          path: |
            preview-failure-log.txt
            workflow-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Limpeza (service account + logs temporarios)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" "$RUNNER_TEMP/preview.log" "$GITHUB_WORKSPACE/preview-failure-log.txt" "$GITHUB_WORKSPACE/workflow-summary.md" 2>/dev/null || true
