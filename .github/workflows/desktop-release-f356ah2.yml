# =====================================================================
# F3.5.6A-H2 — Publicacao da Desktop 1.0.231 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.231 (F3.5.6A-H2 — P0 UX da tela Cliente: a Central de "Aprovacoes
# pendentes" deixa de ficar permanentemente EXPANDIDA acima do Kanban — vira BARRA
# COMPACTA recolhida por padrao + DRAWER lateral direito sob demanda que NAO empurra o
# Kanban). FUNCIONALIDADE 100% preservada (rastreamento/categorias/contagens/tempo/
# cliente/responsavel/proxima acao/lembrete/abrir/tempo real); apenas UX/UI.
# NATUREZA: mudanca de RENDERER PURA — desktop/src/renderer/index.html e o UNICO arquivo
# de producao alterado vs 1.0.230; backend/Worker/motor F3.5.6A/correcao H1 byte-identicos
# a 1.0.230; infraestrutura de notificacoes 1.0.228 byte-identica (REGRA MAXIMA).
# BASE: 1.0.230 (F3.5.6A-H1) @ e89867de. BASELINE FISICA OFICIAL: 1.0.228 (FISICAMENTE APROVADA).
# ROLLBACK IMEDIATO: v1.0.228. Adicional: v1.0.226. Fisico de seguranca: v1.0.223.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.6A-H2 31274955906 (gated, verde
# nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os
# MESMOS bytes. TUDO PINADO: run id, digests dos artifacts, 5 hashes SHA-256, tag
# v1.0.231 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# A publicacao NAO significa aprovacao fisica — o owner repetira o teste da tela Cliente
# (barra compacta por padrao; drawer sob demanda que nao empurra o Kanban; tempo real).
# A 1.0.228 permanece baseline fisica oficial ate GO fisico.
# =====================================================================
name: "F3.5.6A-H2 Desktop Release — 1.0.231 no canal do updater (Central de aprovações compacta + drawer; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356ah2-client-approvals-compact-drawer-1.0.231"
    paths:
      - ".github/workflows/desktop-release-f356ah2.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A-H2; run de build 31274955906 verde nos 2 jobs) ──
      RUN_ID: "31274955906"
      STABLE_SHA: "61da03d6e2aa10e3f3276d53ea8ac34667c3ea5c"
      TEST_BRANCH: "desktop/f356ah2-client-approvals-compact-drawer-1.0.231"
      BASE_230_SHA: "e89867de5120fe88e2f639effd59d24c3181f427"
      BASE_229_SHA: "a322dc8d81acdb44bde9ea31ad686279a2adea0d"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      BASE_226_SHA: "267f8c8593e6724ad6460ed8bbb42201ade09d0b"
      BASE_225_SHA: "24b76b51faf4d2778f025df79d6047563f089b48"
      BASE_224_SHA: "0fcad3e56d39320b8853807861417a0a5eca1e78"
      BASE_223_SHA: "217ed0622993acced1a20b72ba677e9d17ed2f03"
      BASE_222_SHA: "1eac3672ab07a56bfd5d692e9ecb24688ac2ee83"
      BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
      BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
      TAG: "v1.0.231"
      TITLE: "Agenda ID Seven Desktop 1.0.231 — Central de aprovações compacta + drawer (tela Cliente)"
      ART_INST: "agenda-id-seven-desktop-1.0.231-installer"
      ART_INST_DIGEST: "sha256:be87416e5b486f47cb3473507898dabf12346ced1a260c7679726e3befa49718"
      ART_META: "agenda-id-seven-desktop-1.0.231-updatemeta"
      ART_META_DIGEST: "sha256:e083a96d169007b4421dca60ed26c6a966a89953cbe9830a9ea840c0cd52d152"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.231-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.231-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.231-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "4701b76fde918e47d1de94f859d9d18dd46227011d9cbb7eebb99adb2131f10e"
      EXP_MSI: "9bd4908f6d5cb1c7aab9be7d429dec4478b9d84d0b97c09c8c774bf1f613868d"
      EXP_LY: "c91fdcfe0f1420af283f2ccb4d7c24938cfedb57c955c6ae96aa525a0c8685d1"
      EXP_BM: "adfad17ed46b3ef18c2e9033e534590deb82c51f0b90339df09589605100367a"
      EXP_SBOM: "8cf89b599d9e434724c06678cbff3cdf1f61fc236c6588823a172db0ebbc01b3"
      PREV_LATEST_TAG: "v1.0.230"
      PRES_229_TAG: "v1.0.229"
      PRES_228_TAG: "v1.0.228"
      PRES_227_TAG: "v1.0.227"
      PRES_226_TAG: "v1.0.226"
      PROD_ROLLBACK_TAG: "v1.0.223"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A-H2)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A-H2 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356ah2\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_230_SHA" "$BASE_229_SHA" "$BASE_228_SHA" "$BASE_226_SHA" "$BASE_225_SHA" "$BASE_224_SHA" "$BASE_223_SHA" "$BASE_222_SHA" "$BASE_221_SHA" "$BASE_220_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.230..1.0.220 na linhagem"

      - name: "Gate 3 — release v1.0.231 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.231" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.231"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.231" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.231"; exit 1; }
          grep -q "1.0.231-f356ah2-client-approvals-compact-drawer" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.231/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.231 — Central de aprovações compacta + drawer (tela Cliente)

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          CONTEXTO (P0 UX): na tela Tarefas -> Cliente, a seção "Aprovações pendentes"
          aparecia permanentemente e TOTALMENTE EXPANDIDA acima do Kanban (lista completa
          de itens sempre aberta) — poluição visual, Kanban empurrado para baixo, perda de
          hierarquia e aparência de relatório. A funcionalidade é importante; a FORMA de
          apresentação estava reprovada.

          O QUE MUDA vs 1.0.230 (exclusivamente UX/UI):
          - a Central vira uma BARRA COMPACTA, recolhida por padrão: título + total +
            resumo por categoria (não visualizadas / visualizadas sem resposta / ajustes) +
            um aviso discreto de urgência quando há espera > 24h + botão "Ver aprovações";
          - a lista detalhada abre SOB DEMANDA num DRAWER lateral direito que NÃO empurra o
            Kanban (sobreposição): filtros (Todas / Não visualizadas / Visualizadas /
            Ajustes / Aprovadas), cards hierárquicos (cliente / tipo / título / status /
            responsável / próxima ação), "Copiar lembrete" + "Abrir", scroll interno, e
            fecha por X, Esc ou clique fora;
          - contagens e lista atualizam em TEMPO REAL; ao (re)entrar na tela a Central volta
            recolhida (estado efêmero, nunca persistido);
          - o Kanban Cliente volta a ser a superfície principal.

          O QUE NÃO MUDA (preservado; garantido por gate):
          - TODA a funcionalidade da Central: rastreamento, categorias, contagens, tempo
            aguardando, cliente, responsável, próxima ação, lembrete, abrir, tempo real;
          - o motor do fluxo F3.5.6A e a correção F3.5.6A-H1 (notificação de aprovação do
            cliente) — byte-idênticos à 1.0.230;
          - TODA a infraestrutura de notificações 1.0.228 FISICAMENTE APROVADA — bgNotify,
            agrupamento, bgnotify.html, handoff, topmost, som, dedupe — byte-idêntica;
          - Worker V64.61 em produção INALTERADO (nenhum deploy nesta fase).
          Mudança de RENDERER PURA: desktop/src/renderer/index.html é o ÚNICO arquivo de
          produção alterado vs 1.0.230.

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows.
          Teste decisivo: abrir Tarefas -> Cliente e confirmar que a Central aparece
          RECOLHIDA (barra baixa) por padrão, com o Kanban como foco; clicar "Ver
          aprovações" abre o drawer à direita SEM empurrar o Kanban; filtros, "Copiar
          lembrete" e "Abrir" funcionam; ao aprovar/visualizar no portal, contagens e lista
          atualizam em tempo real; fechar por X/Esc/clique fora; reentrar deixa recolhido.
          A publicação não é aprovação física. Em caso de problema: ROLLBACK IMEDIATO
          v1.0.228 (baseline física); adicional v1.0.226; físico de segurança v1.0.223;
          todas as versões anteriores permanecem publicadas.

          Procedência: run de build F3.5.6A-H2 31274955906 (success; --publish never;
          verify + Windows verdes: suíte da fase f356ah2 58 asserts — rodada TAMBÉM contra
          o app.asar; 27 provas reais no Electron empacotado dos 22 itens do mandato (barra
          recolhida por padrão; drawer não empurra o Kanban; 5 filtros; categorias; tempo
          real na barra e no drawer; Lembrete/Abrir; cliente longo; 20/100 pendências;
          scroll interno; 125%/150%; regressão; congelados no pacote); prova de superfície
          F3.5.6A-H1 herdada (a notificação de aprovação do cliente SOBREVIVE à mudança de
          renderer); handoff transacional de grupos herdado; bateria herdada completa;
          isolamento: delta vs 1.0.230 SÓ no renderer index.html + backend/Worker/motor/H1
          byte-idênticos à 1.0.230 + infraestrutura de notificações 1.0.228 byte-idêntica)
          @ commit 61da03d6e2aa10e3f3276d53ea8ac34667c3ea5c
          (branch desktop/f356ah2-client-approvals-compact-drawer-1.0.231).
          Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.231 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.231; 1.0.230/1.0.229/1.0.228/1.0.227/1.0.226 preservadas; rollback 1.0.223 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_229_TAG" "$PRES_228_TAG" "$PRES_227_TAG" "$PRES_226_TAG" "$PROD_ROLLBACK_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.231 no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228 (baseline fisica); adicional 1.0.226; fisico de seguranca 1.0.223; 1.0.230/1.0.229/1.0.227/1.0.226 preservadas ====="
