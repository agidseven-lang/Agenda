# =====================================================================
# [push/manual] F3.5.4C — Desktop Build de TESTE (candidata 1.0.196 — card SaaS Premium)
# ---------------------------------------------------------------------
# Build da CANDIDATA DE TESTE 1.0.196 (rotulo: 1.0.196-card-saas-premium-test) sobre a base
# 1.0.196 OFICIAL (@f5a38a35, tag v1.0.196). Delta F3.5.4B (reprovacao fisica do card na 1.0.196):
#   - campo "por" exibe SO o PRIMEIRO NOME (helper kbv2FirstName; tooltip preserva nome completo);
#   - TODOS os temas no card (1->1, 4->4, 8->8, 12->12); "+N temas · ver em Detalhes" EXTINTO;
#   - cap CSS nth-child(n+3) REMOVIDO; SEM scroll interno nos temas/notas; card de ALTURA NATURAL
#     (max-height:none por cascata; literais CARD-FIT preservados como registro historico);
#   - TEMAS ampliado (13px, badge 20px, cabecalho com contagem) + hierarquia SaaS Premium
#     (bloco <style id="f354b-card-styles">); mesmos handlers data-* e mesmo kbv2Card nos 5 quadros.
# GATES ANTIGOS SUBSTITUIDOS (nao apagados silenciosamente): o gate do asar que EXIGIA a previa
# "+N temas" (grep kbv2-themes-more) foi INVERTIDO para exigir a AUSENCIA; suite f354-kanban-unified
# reancorada (40/40) com substituicao funcional explicita de S3/S4/S5 (contrato reprovado).
# Congelados byte-identicos a 1.0.196: main.ts, slaSeenUser.ts, TODA a Categoria B, nucleo duravel
# (notifier/notifierA/notifEvents/notifStore/toastAck/actorProfile/preloads/bgnotify), Card Premium
# e colagem fora do diff do renderer. Worker/Rules/Functions/Android intocados (gate de isolamento).
#
# Roda no PROPRIO ref (on: push desta branch de teste + workflow_dispatch): NENHUM commit em main.
# `--publish never`: NUNCA publica; NAO cria release/tag/stable/latest. Artefatos = artifacts
# PRIVADOS do run, exclusivamente para TESTE FISICO do owner. Producao 1.0.196 permanece intocada.
# =====================================================================
name: "[push/manual] F3.5.4F Desktop Build (candidata 1.0.197 — SLA por designer + edicao de tarefa)"
"on":
  push:
    branches:
      - "desktop/f354f-sla-timer-task-update-1.0.197"
    paths-ignore:
      - ".github/workflows/desktop-release-f354f.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_196_SHA: "e3a1a5b227fd7b4e57b822b1b30c38e0b0b56371" # Desktop 1.0.196 OFICIAL (tag v1.0.196; base do delta F3.5.4E)
  TEST_BRANCH: "desktop/f354f-sla-timer-task-update-1.0.197"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (SHA do push nesta branch de teste; history completo p/ baselines)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA — branch de teste correta e descendente da 1.0.196 pinada
        run: |
          set -e
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error:: ref '${{ github.ref_name }}' != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_196_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.196 ($BASE_196_SHA)"; exit 1; }
          echo "ref=$TEST_BRANCH head=$(git rev-parse HEAD) base=$BASE_196_SHA OK"

      - name: Derivar versao — exige 1.0.197 exato, sem sufixo (candidata de teste; NAO producao)
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "versao=$APP_VERSION"
          [ "$APP_VERSION" = "1.0.197" ] || { echo "::error:: versao != 1.0.197"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido ($APP_VERSION)"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      - name: Gate F3.5.3 — notificacoes duraveis 37/37 + colagem 15/15
        working-directory: desktop
        run: |
          set -e
          node scripts/f353-durable-notifications.test.mjs || { echo "::error:: f353 duraveis vermelho"; exit 1; }
          node scripts/f353-paste-recovery.test.mjs || { echo "::error:: f353 colagem vermelho"; exit 1; }

      - name: Gate F3.5.3A — foto do ator 25/25 (resolvedor canonico + payload + notifierA ponta-a-ponta)
        working-directory: desktop
        run: |
          set -e
          node scripts/f353a-actor-photo.test.mjs || { echo "::error:: f353a foto do ator vermelho"; exit 1; }

      - name: Gate F3.5.4/B/E/F — Kanban 40/40 + Designers 16/16 + notificacoes 36/36 + SHELL 27/27 + SLA AO VIVO 26/26 + EDICAO/task_updated 32/32
        working-directory: desktop
        run: |
          set -e
          node scripts/f354-kanban-unified.test.mjs || { echo "::error:: f354 kanban unificado (contrato F3.5.4B) vermelho"; exit 1; }
          node scripts/f354-designer-autoload.test.mjs || { echo "::error:: f354 designers autoload vermelho"; exit 1; }
          node scripts/f354-notifications-reliability.test.mjs || { echo "::error:: f354 notificacoes vermelho"; exit 1; }
          node scripts/f354e-card-template-unification.test.mjs || { echo "::error:: f354e UNIFICACAO do card vermelho"; exit 1; }
          node scripts/f354f-sla-designer-live-timer.test.mjs || { echo "::error:: f354f CRONOMETRO AO VIVO vermelho"; exit 1; }
          node scripts/f354f-task-edit-update-notification.test.mjs || { echo "::error:: f354f EDICAO/task_updated vermelho"; exit 1; }

      - name: Gate F3.5.2/A funcionais (notify + source-invariance/Card-Premium + recipient + substituicao + intervalo + packaging)
        working-directory: desktop
        run: |
          set -e
          for t in f352-cards-notify f352-cards-source-invariance f352-cards-recipient f352-cards-channel-substitution f352a-cards-interval; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate F3.5.2/A $t vermelho"; exit 1; }
          done
          echo "== f352-cards-packaging =="
          node scripts/f352-cards-packaging.mjs || { echo "::error:: gate de empacotamento cardsRules vermelho"; exit 1; }

      - name: Gate PRESERVACAO aplicavel (golden masters + canal/dedup/SLA/opblock/updater/bg/central/clock/baseline)
        working-directory: desktop
        run: |
          set -e
          for t in f343-sla-golden-master f344-flow-golden-master f345-sla-timestamp-golden-master \
                   f343-delivery-channel f343-preservation f341a-updater-state-machine \
                   f347-immediate-visual-delivery f347-independent-behavior f33F-bg-notify \
                   f343-main-scheduler f343-operational-block f33A-notif-central \
                   f3377a-r4b-http-date-clock f3311-baseline-freeze; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate de preservacao $t vermelho"; exit 1; }
          done
          echo "PRESERVACAO APLICAVEL: TODOS VERDES."

      - name: Gate CATEGORIA B — byte-identidade a 1.0.196 (T-30/T-10 intocadas)
        run: |
          set -e
          for f in desktop/src/main/slaRules.js desktop/src/main/cardsRules.js desktop/src/main/slaScheduler.ts \
                   desktop/src/main/bgNotify.ts desktop/src/main/tray.ts desktop/src/main/updaterService.ts \
                   desktop/src/main/firebase.ts desktop/src/main/reminder.ts; do
            D=$(git diff "$BASE_196_SHA" HEAD -- "$f" || true)
            [ -z "$D" ] || { echo "::error:: $f ALTERADO vs 1.0.196 (Categoria B deve ser byte-identica)"; exit 1; }
          done
          echo "CATEGORIA B: 8 arquivos byte-identicos a 1.0.196."

      - name: Gate SUPERFICIES CONGELADAS — main/pipeline de notificacao/preloads/bg byte-identicos a 1.0.196
        run: |
          set -e
          # F3.5.4F — notifierA.ts e notifEvents.js SAEM do congelamento byte-a-byte (a fase os altera
          # de forma AUTORIZADA p/ o task_updated) e ganham o gate proprio "DIFF CONTROLADO" logo abaixo
          # (substituicao cirurgica — nenhum gate apagado). Os 9 demais continuam byte-identicos.
          for f in desktop/src/main/main.ts desktop/src/main/slaSeenUser.ts desktop/src/renderer/bgnotify.html \
                   desktop/src/preload/preload.ts desktop/src/preload/bgnotify-preload.ts \
                   desktop/src/main/notifier.ts desktop/src/main/toastAck.ts desktop/src/main/notifStore.ts \
                   desktop/src/main/actorProfile.js; do
            D=$(git diff "$BASE_196_SHA" HEAD -- "$f" || true)
            [ -z "$D" ] || { echo "::error:: $f ALTERADO vs 1.0.196 (F3.5.4E e SO renderer/isDesktop)"; exit 1; }
          done
          echo "SUPERFICIES CONGELADAS: 9 arquivos byte-identicos a 1.0.196 (main, slaSeenUser, bg-window, preloads, notifier, ACK, store, actorProfile)."

      - name: Gate F3.5.4F — DIFF CONTROLADO de notifEvents/notifierA (substitui o byte-a-byte SO p/ estes 2)
        run: |
          set -e
          # notifierA.ts: diff PURAMENTE ADITIVO (zero linhas removidas) e contendo o filtro pessoal
          D=$(git diff -U0 "$BASE_196_SHA" HEAD -- desktop/src/main/notifierA.ts)
          REM=$(echo "$D" | grep -E '^-' | grep -vE '^---' || true)
          [ -z "$REM" ] || { echo "::error:: notifierA.ts com REMOCOES (contrato: aditivo puro)"; echo "$REM"; exit 1; }
          echo "$D" | grep -qF 'assigned_designer' || { echo "::error:: filtro de destinatario task_updated ausente no diff"; exit 1; }
          # notifEvents.js: remocoes EXATAMENTE as 3 linhas substituidas (payload ctx/notificationType + exports)
          git diff -U0 "$BASE_196_SHA" HEAD -- desktop/src/main/notifEvents.js | grep -E '^-' | grep -vE '^---' | sort > /tmp/ne-rem.txt
          {
            printf '%s\n' "-    eventType: ev.type, notificationType: 'all_active_users',"
            printf '%s\n' "-    context: ev.fromStatus ? (columnLabel(ev.fromStatus) + ' → ' + columnLabel(ev.toStatus)) : 'Tarefas',"
            printf '%s\n' "-  evTitle: evTitle, evBody: evBody, evSeverity: evSeverity,"
          } | sort > /tmp/ne-rem-exp.txt
          diff /tmp/ne-rem.txt /tmp/ne-rem-exp.txt || { echo "::error:: remocoes INESPERADAS em notifEvents.js"; exit 1; }
          # identidades dos eventos EXISTENTES intactas (nenhum eventId legado alterado)
          grep -qF "eventId: type + ':' + taskId + ':' + from + '>' + to + ':' + at + ':' + byId" desktop/src/main/notifEvents.js || { echo "::error:: identidade task_moved alterada"; exit 1; }
          grep -qF "eventId: 'task_assigned:' + taskId + ':' + str(da.designerId) + ':' + aAt" desktop/src/main/notifEvents.js || { echo "::error:: identidade task_assigned alterada"; exit 1; }
          echo "DIFF CONTROLADO OK: notifierA aditivo puro; notifEvents com as 3 substituicoes conhecidas; eventos legados intactos."

      - name: Gate COLAGEM — f353WirePasteRecovery fora do diff do renderer (-U0 = so linhas +/- reais)
        run: |
          set -e
          N=$(git diff -U0 "$BASE_196_SHA" HEAD -- desktop/src/renderer/index.html | grep -c "f353WirePasteRecovery" || true)
          [ "$N" = "0" ] || { echo "::error:: diff do index.html toca a colagem ($N linhas)"; exit 1; }
          echo "COLAGEM NA LEGENDA: fora do diff (0 mencoes nas linhas alteradas)."

      - name: Gate CARD PREMIUM — funcoes/regioes fora do diff do renderer (-U0 = so linhas +/- reais)
        run: |
          set -e
          # -U0: o helper kbv2FirstName foi inserido ADJACENTE ao inicio de kbv2Card, cujas 2 primeiras
          # linhas (INALTERADAS) citam isClientSector — com contexto default elas apareceriam na hunk
          # sem serem mudanca. O gate conta APENAS linhas realmente adicionadas/removidas.
          N=$(git diff -U0 "$BASE_196_SHA" HEAD -- desktop/src/renderer/index.html | grep -cE 'ensureReviewToken|ensureStableClientReviewToken|buildShareClientUrl|buildClientMessage|canSendToClient|openSendClientModal|clientReviewToken|og:image|/share/|isClientSector' || true)
          [ "$N" = "0" ] || { echo "::error:: diff do index.html toca Card Premium ($N linhas)"; exit 1; }
          echo "CARD PREMIUM: fora do diff (0 mencoes nas linhas alteradas)."

      - name: Gate SUITES SUPERADAS — preservadas byte-identicas (classificadas; nao rodadas como gate)
        run: |
          set -e
          for f in f333-notif f3377a-r3-single-producer-clock f33C-assignment-toast f33D-background-notif \
                   f33E-main-notifier f33K-notif-actor f33N-assign-baseline-fix f343-assignment-transition \
                   f343-preexisting-registry f344-repeated-move-contract f352d-cards-board-card-proportion; do
            P="desktop/scripts/$f.test.mjs"
            test -f "$P" || { echo "::error:: suite superada $f AUSENTE (proibido apagar)"; exit 1; }
            D=$(git diff "$BASE_196_SHA" HEAD -- "$P" || true)
            [ -z "$D" ] || { echo "::error:: suite superada $f ALTERADA (proibido reancorar)"; exit 1; }
          done
          echo "11 suites superadas: PRESERVADAS byte-identicas."

      - name: Gate NOVO CONTRATO DO CARD na FONTE (primeiro nome + todos os temas + sem ocultacao + cascata)
        run: |
          set -e
          H="desktop/src/renderer/index.html"
          # negativos (contrato antigo REPROVADO extinto)
          N=$(grep -c 'kbv2-themes-more' "$H" || true); [ "$N" = "0" ] || { echo "::error:: kbv2-themes-more ainda presente ($N)"; exit 1; }
          if grep -q 'nth-child(n+3)' "$H"; then echo "::error:: seletor de ocultacao nth-child(n+3) presente"; exit 1; fi
          if grep -E '\.kbv2-theme(-t)?\{[^}]*(line-clamp|text-overflow)' "$H" >/dev/null; then echo "::error:: clamp/ellipsis nos temas"; exit 1; fi
          # positivos (novo contrato)
          grep -q 'function kbv2FirstName' "$H" || { echo "::error:: helper kbv2FirstName ausente"; exit 1; }
          grep -qF "por <b>'+esc(kbv2FirstName(reqName))+'</b>" "$H" || { echo "::error:: campo 'por' nao usa kbv2FirstName"; exit 1; }
          grep -qF "title=\"'+esc('Enviado por '+reqName" "$H" || { echo "::error:: tooltip da origem sem o nome COMPLETO"; exit 1; }
          grep -q 'kbv2-themes-count' "$H" || { echo "::error:: contagem no cabecalho Temas ausente"; exit 1; }
          grep -q 'id="f354b-card-styles"' "$H" || { echo "::error:: bloco f354b-card-styles ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-column-body>.kbv2-card{ max-height:none; }' "$H" || { echo "::error:: altura natural (max-height:none) ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-card-themes>.kbv2-themes-list{ overflow-y:visible; min-height:auto; }' "$H" || { echo "::error:: override anti-scroll dos temas ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-card>.kbv2-card-notes{ overflow-y:visible; min-height:auto; }' "$H" || { echo "::error:: override anti-scroll das notas ausente"; exit 1; }
          # cascata: bloco f354b vem DEPOIS dos literais historicos CARD-FIT (pinados por suites antigas)
          H="$H" node -e 's=require("fs").readFileSync(process.env.H,"utf8");const a=s.indexOf("overflow-y:auto; overscroll-behavior:contain"),b=s.indexOf("id=\"f354b-card-styles\"");if(!(a>0&&b>a)){console.error("bloco f354b NAO vem depois do CARD-FIT");process.exit(1);}'
          # mesmos handlers e mesmo componente nos 5 quadros
          for a in 'data-detail=' 'data-move=' 'data-cardmenu=' 'data-resend=' 'data-del='; do
            grep -qF "$a" "$H" || { echo "::error:: handler $a ausente"; exit 1; }
          done
          C=$(grep -o 'kbv2BoardHtml(' "$H" | wc -l | tr -d ' '); [ "$C" -ge 6 ] || { echo "::error:: kbv2BoardHtml esperado em >=5 quadros + definicao, vi $C"; exit 1; }
          grep -q 'KanbanTaskCardUnified' "$H" || { echo "::error:: identidade KanbanTaskCardUnified ausente"; exit 1; }
          echo "NOVO CONTRATO DO CARD (fonte): VERIFIED"

      - name: Gate ISOLAMENTO — diff vs 1.0.197 SO nos arquivos autorizados F3.5.4F
        run: |
          set -e
          git diff --name-only "$BASE_196_SHA" HEAD | grep -vE '^(desktop/src/renderer/index\.html$|desktop/src/main/notifEvents\.js$|desktop/src/main/notifierA\.ts$|desktop/scripts/f354f-sla-designer-live-timer\.test\.mjs$|desktop/scripts/f354f-task-edit-update-notification\.test\.mjs$|desktop/scripts/f354f-visual-proof\.mjs$|desktop/scripts/f354-kanban-unified\.test\.mjs$|desktop/scripts/f354e-card-template-unification\.test\.mjs$|desktop/package\.json$|desktop/package-lock\.json$|docs/F3\.5\.4F-|docs/f354f-visual/|\.github/workflows/desktop-build-f354f\.yml$|\.github/workflows/desktop-release-f354f\.yml$)' | tee /tmp/outside.txt || true
          [ ! -s /tmp/outside.txt ] || { echo "::error:: mudanca FORA do escopo F3.5.4F (Android/Worker/Rules/Functions/main intocaveis)"; exit 1; }
          echo "OK: diff vs 1.0.196 contem SOMENTE os arquivos autorizados."

      - name: PROVAS VISUAIS — re-executar na candidata (Chromium headless; ANTES 1.0.196 × DEPOIS; gates estruturais)
        working-directory: desktop
        run: |
          set -e
          sudo mkdir -p /opt/pw-browsers && sudo chown "$USER" /opt/pw-browsers
          npm i --no-save playwright@1.56.1 --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium
          node scripts/f354f-visual-proof.mjs
          git diff --quiet -- package.json package-lock.json || { echo "::error:: instalacao do playwright alterou package.json/lock"; exit 1; }
          ls ../docs/f354f-visual/*.png | wc -l

      - name: Upload provas visuais (artifact PRIVADO)
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.197-test-visualproofs
          path: |
            docs/f354f-visual/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
    steps:
      - name: Forcar LF no checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA (windows)
        run: |
          set -e
          git merge-base --is-ancestor "$BASE_196_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.196"; exit 1; }

      - name: Gate LINE ENDINGS LF
        run: |
          set -e
          FILES="desktop/src/renderer/index.html desktop/src/main/main.ts desktop/src/main/firebase.ts desktop/src/main/bgNotify.ts desktop/src/main/slaScheduler.ts desktop/src/main/cardsRules.js desktop/src/main/notifierA.ts desktop/src/main/notifStore.ts desktop/src/main/toastAck.ts desktop/src/main/notifEvents.js desktop/src/main/actorProfile.js desktop/src/main/slaSeenUser.ts"
          git ls-files --eol -- $FILES | tee "$RUNNER_TEMP/eol.txt"
          if grep -Eq 'w/(crlf|mixed)' "$RUNNER_TEMP/eol.txt"; then echo "::error:: CRLF/mixed em arquivo-chave"; exit 1; fi
          N=$(git ls-files --eol -- $FILES | wc -l | tr -d ' '); [ "$N" -ge 12 ] || { echo "::error:: esperados >=12, vi $N"; exit 1; }
          echo "LINE ENDINGS: LF CONFIRMED"

      - name: Derivar versao — exige 1.0.197 exato
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          [ "$APP_VERSION" = "1.0.197" ] || { echo "::error:: versao != 1.0.197"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f "dist-installer/win-unpacked/resources/icon.png" || { echo "::error:: resources/icon.png AUSENTE"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.197) + renderer EMPACOTADO == fonte + F4.2F AUSENTE
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.197" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.197"; exit 1; }
          EX="$EXDIR/src/renderer/index.html"; SRC="src/renderer/index.html"; test -f "$EX" || { echo "::error:: index.html ausente no asar"; exit 1; }
          EX="$EX" SRC="$SRC" node -e 'const fs=require("fs");const nrm=s=>String(s).replace(/\r\n/g,"\n");if(nrm(fs.readFileSync(process.env.EX,"utf8"))!==nrm(fs.readFileSync(process.env.SRC,"utf8"))){console.error("index.html EMPACOTADO != fonte");process.exit(1);}'
          echo "  index.html EMPACOTADO == fonte"
          test ! -f "$EXDIR/src/renderer/firebaseAuthBridge.js" || { echo "::error:: firebaseAuthBridge.js presente (F4.2F)"; exit 1; }
          for k in 'firebase-auth-compat' 'signInWithCustomToken' 'startFirebaseAuthBridge' 'DESKTOP_FIREBASE_AUTH'; do
            if grep -q "$k" "$EX"; then echo "::error:: '$k' presente no renderer (F4.2F)"; exit 1; fi
          done
          echo "GATE prova-de-versao 1.0.197 + renderer==fonte + F4.2F AUSENTE OK."

      - name: Gate F3.5.3/A + F3.5.4 EMPACOTADOS (nucleo duravel + actorProfile + slaSeenUser + autoload + retry + IPCs + colagem)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          for f in notifEvents.js notifierA.js notifStore.js toastAck.js actorProfile.js slaSeenUser.js; do
