      - name: Gate F3.5.4F EMPACOTADO — cronometro AO VIVO + edicao + task_updated no app.asar (20 gates)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXH="$RUNNER_TEMP/asarx/src/renderer/index.html"
          DM="$RUNNER_TEMP/asarx/dist/main"
          # 1 — scheduler CENTRALIZADO (ticker global unico com gate ampliado p/ as bandas)
          grep -qF 'function f354fSlaLiveUpdate(){' "$EXH" || { echo "::error:: updater central ausente"; exit 1; }
          grep -qF 'if(slaMonHasActive()||f354fLiveEls().length) slaTick();' "$EXH" || { echo "::error:: gate do ticker ausente"; exit 1; }
          # 2 — NENHUM setInterval por card (kbv2Card sem timers) + UM unico interval de 1s no arquivo
          EXH="$EXH" node -e 's=require("fs").readFileSync(process.env.EXH,"utf8");const i=s.indexOf("function kbv2Card(");let d=0,j=s.indexOf("{",i);for(let k=j;k<s.length;k++){const c=s[k];if(c==="{")d++;else if(c==="}"){d--;if(!d){const b=s.slice(i,k+1);if(/setInterval|setTimeout/.test(b)){console.error("timer DENTRO de kbv2Card");process.exit(1);}break;}}}'
          N=$(grep -o 'setInterval(function(){[^"]*},1000)' "$EXH" | wc -l); [ "$N" = "1" ] || { echo "::error:: intervals de 1s != 1 ($N)"; exit 1; }
          # 3/4 — T-30 e T-10 PRESERVADAS (cardsRules + panel-core)
          grep -qF 'var CARDS_WARN_MS = 30 * 60000' "$DM/cardsRules.js" || { echo "::error:: T-30 dos cards alterada"; exit 1; }
          grep -qF 'var CARDS_RED_MS  = 10 * 60000' "$DM/cardsRules.js" || { echo "::error:: T-10 dos cards alterada"; exit 1; }
          grep -qF 'var SLA_PANEL_WARN_MS=30*60000' "$EXH" || { echo "::error:: janela amarela do panel-core alterada"; exit 1; }
          grep -qF 'var SLA_PANEL_GRACE_MS=10*60000' "$EXH" || { echo "::error:: tolerancia vermelha do panel-core alterada"; exit 1; }
          # 5/6 — avatar REAL + nome do Designer na banda
          grep -qF 'avatar(_resp2,22)' "$EXH" || { echo "::error:: avatar da banda ausente"; exit 1; }
          grep -q 'kbv2-sla-live-n' "$EXH" || { echo "::error:: nome do designer na banda ausente"; exit 1; }
          # 7 — associacao por UID (nunca nome)
          grep -q 'data-resp-id' "$EXH" || { echo "::error:: uid do designer ausente na banda"; exit 1; }
          grep -qF 'const _rid=designerOf(t)||' "$EXH" || { echo "::error:: designerOf ausente na banda"; exit 1; }
          # 8 — isolamento por aba (filtro real por uid)
          grep -qF 'isDesignerFlow(t)&&designerOf(t)===id' "$EXH" || { echo "::error:: filtro por uid da aba ausente"; exit 1; }
          # 9 — reatribuicao (roteador re-resolve designerId||assigneeId a cada avaliacao)
          grep -qF "task.designerAssignment.designerId)||task.assigneeId" "$DM/slaRules.js" || { echo "::error:: roteador por designerId ausente"; exit 1; }
          # 10/11 — conclusao cancela / reabertura reavalia (guarda delivered na banda)
          grep -qF 'if(slaPanelDelivered(t)) return null;' "$EXH" || { echo "::error:: guarda delivered da banda ausente"; exit 1; }
          # 12 — edicao disponivel (menu + detalhe, gate canSeeAll)
          grep -q 'data-cardedit' "$EXH" || { echo "::error:: acao Editar tarefa ausente"; exit 1; }
          grep -qF 'function openCardsEdit(taskId){' "$EXH" || { echo "::error:: openCardsEdit ausente"; exit 1; }
          # 13 — prazo editavel + revisao de dedup
          grep -qF 'async function saveCardsEdit(){' "$EXH" || { echo "::error:: saveCardsEdit ausente"; exit 1; }
          grep -qF 'patch.cardDeadlineRev=(Number(t.cardDeadlineRev)||1)+1;' "$EXH" || { echo "::error:: bump de cardDeadlineRev ausente"; exit 1; }
          # 14 — historico ADITIVO (arrayUnion kind:edited com prazo anterior/novo e destinatario)
          grep -qF "history:firebase.firestore.FieldValue.arrayUnion({ kind:'edited'" "$EXH" || { echo "::error:: historico aditivo da edicao ausente"; exit 1; }
          grep -qF 'prevDueDate:prev.dueDate' "$EXH" || { echo "::error:: prazo anterior nao registrado"; exit 1; }
          # 15/16 — task_updated + dedupKey deterministica + destinatario pessoal
          grep -qF "eventId: 'task_updated:' + taskId" "$DM/notifEvents.js" || { echo "::error:: task_updated ausente do pacote"; exit 1; }
          grep -qF "recipientMode: 'assigned_designer'" "$DM/notifEvents.js" || { echo "::error:: recipientMode ausente"; exit 1; }
          grep -qF 'assigned_designer' "$DM/notifierA.js" || { echo "::error:: filtro pessoal no notifierA ausente"; exit 1; }
          grep -qF "return 'Tarefa atualizada'" "$DM/notifEvents.js" || { echo "::error:: titulo oficial ausente"; exit 1; }
          grep -qF "atualizou o prazo: " "$DM/notifEvents.js" || { echo "::error:: corpo de prazo anterior->novo ausente"; exit 1; }
          # 17/18 — foreground toast + background premium (canais aprovados)
          grep -qF 'notif-toast' "$DM/main.js" || { echo "::error:: canal toast ausente"; exit 1; }
          grep -qF 'showBgNotify' "$DM/main.js" || { echo "::error:: canal bg-window ausente"; exit 1; }
          # 19 — tray preservado (X esconde; produtor no main)
          grep -qF 'window.close' "$DM/main.js" || { echo "::error:: contrato close->tray ausente"; exit 1; }
          grep -qF 'ensureTray' "$DM/main.js" || { echo "::error:: ensureTray ausente"; exit 1; }
          # 20 — card APROVADO preservado (cascata f354b < f354e < f354f; literais congelados)
          EXH="$EXH" node -e 's=require("fs").readFileSync(process.env.EXH,"utf8");const a=s.indexOf("id=\"f354b-card-styles\""),b=s.indexOf("id=\"f354e-card-styles\""),c=s.indexOf("id=\"f354f-sla-live-styles\"");if(!(a>0&&b>a&&c>b)){console.error("cascata f354f invalida");process.exit(1);}'
          grep -qF 'PROD1.6' "$EXH" || { echo "::error:: literal PROD1.6 sumiu"; exit 1; }
          grep -qF 'CARD-FIT-NOTEBOOK' "$EXH" || { echo "::error:: literal CARD-FIT-NOTEBOOK sumiu"; exit 1; }
          grep -qF 'kbv2-sla-live[hidden]' "$EXH" || { echo "::error:: regra hidden da banda ausente (composicao aprovada)"; exit 1; }
          echo "GATE F3.5.4F EMPACOTADO (20 gates): VERIFIED"

