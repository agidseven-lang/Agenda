# F3.5.6A-H8 — Desktop 1.0.236 (correção cirúrgica dos 2 defeitos físicos da 1.0.235).
# (A) DIAGNÓSTICO DURÁVEL: o diagnóstico da confirmação passa a ser persistido SANITIZADO (10 campos)
#     por hash NÃO-reversível do taskId (TTL 24h); o botão "Copiar diagnóstico da confirmação" é
#     re-revelado na ABERTURA do modal quando há diagnóstico daquela tarefa (não depende de nova
#     tentativa nem sobrevive só no DOM); a cópia usa o formato CONFIRM_CLIENT_SEND (só os 10 campos).
# (B) TIMELINE HONESTA: taskTimeline marca "Enviado ao cliente" via flowCanonicalSentSignal||(clientCol!=='afazer'),
#     removendo clientReviewToken/shareToken/clientSentBy — GERAR LINK ≠ ENVIAR (paridade card/detalhe/Central).
# NÃO é a correção da falha server-side. MUDANÇA de produção = SOMENTE desktop/src/renderer/index.html.
# build GATED, --publish never. Publicação no Latest só no desktop-release-f356ah8.yml (mesmos bytes).
# Base técnica 1.0.235 (d20db37). BASELINE FÍSICA 1.0.228. ROLLBACK IMEDIATO 1.0.228. Worker V64.61 INALTERADO.
name: "[push/manual] F3.5.6A-H8 — Desktop 1.0.236 (diagnóstico durável + timeline honesta) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah8-durable-diag-honest-timeline-1.0.236"]
    paths-ignore: [".github/workflows/desktop-release-f356ah8.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah8-durable-diag-honest-timeline-1.0.236"
  BASE_235_SHA: "d20db3710e7368ffdc5307a5e98d509e4930890b"
  BASE_234_SHA: "3285a45ff40c4bcfb1b28c53819455d515af912a"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.235 base técnica e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_235_SHA" "$BASE_234_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.236 (package + lock x2 + marcador H8 + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.236'){console.error('versão',p.version);process.exit(1);} for(const m of ['durable-diag-honest-timeline','confirm-send-diagnostics','confirm-send-button','single-source-real-path','single-source-sent-state']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.236"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES H8 (A: diagnóstico durável + B: timeline honesta) no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # (A) helpers de persistência durável
          for fn in __csDiagHashKey __csDiagSanitize __csDiagStoreRead __csDiagStoreWrite __csDiagPrune __csDiagPersist __csDiagLoad __csDiagFormat; do
            grep -q "function $fn" "$S" || { echo "::error::helper H8 ausente: $fn"; exit 1; }
          done
          grep -qF "__csDiagPersist(ctx&&ctx.id)" "$S"                 # handler persiste após a tentativa
          grep -qF "if(__csDiagLoad(ctx&&ctx.id)){" "$S"               # re-revela na ABERTURA do modal
          grep -qF "var txt=__csDiagFormat(d)" "$S"                    # cópia usa o formato canônico
          grep -qF "CONFIRM_CLIENT_SEND" "$S"                          # cabeçalho da cópia
          grep -qF "24*60*60*1000" "$S"                               # TTL 24h
          grep -qF 'id="btnCopyConfirmDiag" style="display:none"' "$S" # botão nasce oculto (só aparece com diagnóstico)
          # (B) timeline honesta: sent canônico, sem token
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function taskTimeline(');const j=s.indexOf('\nfunction ',i+10);const body=s.slice(i,j>0?j:s.length);const m=body.match(/const sent=[^\n]*/)[0];if(/clientReviewToken|shareToken|clientSentBy/.test(m)){console.error('taskTimeline sent AINDA usa token:',m);process.exit(1);}console.log('timeline honesta OK:',m);"
          # SANITIZAÇÃO da persistência: campos permitidos = os 10; NUNCA persiste token/JWT/link/conteúdo
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('var __CS_DIAG_FIELDS=');const line=s.slice(i,s.indexOf(';',i));const allowed=['stage','requestStarted','responseReceived','httpStatus','workerCode','hasSession','hasJwt','hasTask','hasToken','appVersion'];for(const a of allowed){if(!line.includes(\"'\"+a+\"'\")){console.error('campo permitido ausente:',a);process.exit(1);}}if(/clientReviewToken|shareToken|Authorization|senha|telefone|legenda/.test(line)){console.error('campo sensível na lista');process.exit(1);}console.log('lista sanitizada OK');"
          echo "MARCADORES H8: VERIFIED."
      - name: "Gate MARCADORES herdados H6B (instrumento sanitizado) + H5 (botão) preservados"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -q 'function __csDiagInit' "$S"
          grep -q 'function __csDiagSet' "$S"
          grep -q 'Copiar diagnóstico da confirmação' "$S"
          for k in "stage:'request_started'" "stage:'http_error'" "stage:'http_401'" "stage:'network_error'" "stage:'success'" "httpStatus" "workerCode" "hasSession" "hasJwt" "hasTask" "hasToken" "appVersion:"; do
            grep -qF "$k" "$S" || { echo "::error::marcador diagnóstico ausente: $k"; exit 1; }
          done
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function __csDiagInit(');const j=s.indexOf('}catch(_){}}',i);const body=s.slice(i,j);if(/(:\s*(jwt|token)\b)|clientReviewToken|shareToken|Authorization|wp_team_jwt/.test(body)){console.error('diag pode vazar dado sensível');process.exit(1);}console.log('diag sanitizado OK');"
          grep -q 'id="btnConfirmSend" title=' "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');if(/id=\"btnConfirmSend\" disabled/.test(s)){console.error('botão nasce disabled');process.exit(1);}"
          grep -q 'Envio confirmado ao cliente' "$S"
          grep -q 'Não foi possível confirmar o envio ao cliente' "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('async function wfConfirmClientSend(');const j=s.indexOf('async function ',i+10);const body=s.slice(i,j>0?j:s.length);if(!/return r;/.test(body)){console.error('wfConfirmClientSend não retorna');process.exit(1);}"
          grep -q 'function wfArmConfirmSend' "$S"
          echo "MARCADORES H6B+H5: VERIFIED."
      - name: "Gate MARCADORES herdados H4 (writer/reader) + H3 (THEMES_READY) + H2/H1 intactos"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function flowCanonicalSentSignal(');const j=s.indexOf('}',s.indexOf('return ',i));if(!/if\(wp\)return false;/.test(s.slice(i,j+1))){console.error('renderer flowCanonicalSentSignal SEM guard');process.exit(1);}"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/main/slaRules.js','utf8');const i=s.indexOf('function flowCanonicalSentSignal(');const j=s.indexOf('}',s.indexOf('return ',i));if(!/if\(wp\)return false;/.test(s.slice(i,j+1))){console.error('slaRules flowCanonicalSentSignal SEM guard');process.exit(1);}"
          grep -q "THEMES_READY:'themes_ready'" "$S"
          grep -q 'Temas prontos — confirmar envio ao cliente' "$S"
          grep -q "id: (tid ? (tid + ':') : '') + String(k), lk: String(k)" src/main/workflowEvents.js
          grep -q 'legacyCursor' dist/main/workflowNotifier.js
          echo "MARCADORES herdados H4+H3+H2+H1: VERIFIED."
      - name: "Gate SUÍTES H8 (novas) + PIN F3.5.6A + linhagem H4/H3 + golden master F3.4.4 + H2 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL no botão (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.236 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.236 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.236 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.236 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.235 (d20db37); src/main INALTERADO; slaRules byte-idêntico; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_235_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.235 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah8\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f356ah8-(durable-diagnostic|honest-timeline)\.test\.mjs$|desktop/scripts/f356ah5-red-main\.js$|desktop/scripts/(f354p-sla-decision-actions|f354vh1-session-persistence|f354wh2-immediate-notification-sound|f355a-integration|f355ah1-internal-notes|f355b-agenda-premium|f355c-script-quantity-rich-editor|f355d-cron-quantity-universal-paste|f355e-retire-modules-premium-notifications|f355eh2-reference-notification|f355eh3-global-notification-visibility|f355eh4-grouped-notification-handoff|f356a-workflow-orchestration|f356ah2-client-approvals|f356ah3-single-source-sent-state)\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H8: $BAD"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_235_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H8 não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_235_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H8 altera SOMENTE o renderer index.html"; exit 1; }
          git diff --quiet "$BASE_235_SHA"..HEAD -- desktop/src/main/slaRules.js || { echo "::error::slaRules.js alterado (paridade golden master exige byte-idêntico)"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H8: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.235; slaRules INALTERADO; infra 1.0.228 congelada)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão 1.0.236 + marcadores H8 (A+B) + H6B/H5/H4/H3 preservados no app.asar"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.236') process.exit(1);"
          I=asar-x/src/renderer/index.html
          # (A) diagnóstico durável
          grep -q 'function __csDiagPersist' "$I"
          grep -q 'function __csDiagLoad' "$I"
          grep -q 'function __csDiagFormat' "$I"
          grep -qF "if(__csDiagLoad(ctx&&ctx.id)){" "$I"
          grep -qF "CONFIRM_CLIENT_SEND" "$I"
          grep -qF 'id="btnCopyConfirmDiag" style="display:none"' "$I"
          # (B) timeline honesta
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');const i=s.indexOf('function taskTimeline(');const j=s.indexOf('\nfunction ',i+10);const m=s.slice(i,j>0?j:s.length).match(/const sent=[^\n]*/)[0];if(/clientReviewToken|shareToken|clientSentBy/.test(m)){console.error('pacote: timeline ainda usa token');process.exit(1);}"
          # herdados
          grep -q 'id="btnConfirmSend" title=' "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');if(/id=\"btnConfirmSend\" disabled/.test(s)){console.error('pacote: botão nasce disabled');process.exit(1);}"
          grep -q 'Não foi possível confirmar o envio ao cliente' "$I"
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$I"
          grep -q "THEMES_READY:'themes_ready'" "$I"
          grep -q 'function flowCanonicalSentSignal' asar-x/dist/main/slaRules.js
          grep -q 'legacyCursor' asar-x/dist/main/workflowNotifier.js
          F356AH8_SRC=asar-x/src/renderer/index.html F356AH8_PKG=asar-x/package.json node scripts/f356ah8-durable-diagnostic.test.mjs
          F356AH8_SRC=asar-x/src/renderer/index.html F356AH8_SLARULES=asar-x/dist/main/slaRules.js F356AH8_PKG=asar-x/package.json node scripts/f356ah8-honest-timeline.test.mjs
          echo "GATE F3.5.6A-H8 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.236"; echo "rotulo      : 1.0.236-f356ah8-durable-diag-honest-timeline (diagnostico duravel + timeline honesta — pelo updater interno)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.235 (d20db37). BASELINE FISICA 1.0.228 (3f0d0af1). ROLLBACK imediato 1.0.228."; echo "origem      : F3.5.6A-H8 — 1.0.235 reprovada por 2 defeitos: (A) diagnostico nao persistia (botao sumia ao reabrir/reiniciar); (B) timeline marcava 'Enviado ao cliente' so por existir o LINK. Correcao renderer-only: (A) diagnostico DURAVEL sanitizado por hash do taskId, TTL 24h, botao re-revelado na abertura, copia CONFIRM_CLIENT_SEND (10 campos); (B) taskTimeline usa flowCanonicalSentSignal||(clientCol!=='afazer'). NAO e a correcao server-side. MUDANCA: SOMENTE index.html. slaRules.js e Worker V64.61 INALTERADOS."; echo "distribuicao: pelo updater interno; publicacao no Latest ocorre no workflow desktop-release-f356ah8.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.236-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.236-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
