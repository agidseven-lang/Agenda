# =====================================================================
# [push/manual] F3.5.4U-H1 — Desktop Build (hotfix físico 1.0.210 — NOTIFICAÇÕES)
# ---------------------------------------------------------------------
# Base de código: Desktop 1.0.209 (@2ba47f2). Baseline aprovada/rollback: Desktop 1.0.208 (@db8cdca).
# Corrige DOIS defeitos da validação física da 1.0.209 (apresentação-only + ciclo de vida da janela):
#   Defeito 1 — notificação comum premium: cabeçalho em GRID de COLUNAS RESERVADAS (eyebrow 1fr | horário |
#     fechar). Ícone de nível vira glifo PEQUENO no eyebrow (esev). Fim da sobreposição horário×ícone×X.
#   Defeito 2 — lembrete central de SLA: UMA única janela REUTILIZADA (close()=hide, nunca destrói+recria →
#     fim da "2ª janela/card atrás"); sombra ENXUTA contida no #wrap (fim do retângulo preto no Windows);
#     dedup LÓGICO (task+dest+nível+marco); observabilidade central_alert.* SANITIZADA (12 nomes).
# Arquivos autorizados (delta vs 1.0.209): src/main/slaReminder.ts, src/main/slaReminderWindow.ts,
#   src/renderer/{bgnotify,index,slareminder}.html, package(-lock).json, scripts f354u/f354u-h1/provas,
#   docs/f354uh1-qa/, workflows f354u-h1. TODO O RESTO byte-idêntico à 1.0.209. `--publish never`.
# =====================================================================
name: "[push/manual] F3.5.4U-H1 Desktop Build (hotfix 1.0.210 — notificações)"
"on":
  push:
    branches:
      - "desktop/f354u-h1-notification-physical-hotfix-1.0.210"
    paths-ignore:
      - ".github/workflows/desktop-release-f354uh1.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_208_SHA: "db8cdca1d92cd42f3ec98aced39e6a418c4d478e" # 1.0.208 OFICIAL (baseline aprovada/rollback)
  BASE_209_SHA: "2ba47f2031718947816baa7ba77e1e1ac3b63ec5" # 1.0.209 (base de código do hotfix)
  TEST_BRANCH: "desktop/f354u-h1-notification-physical-hotfix-1.0.210"
  APP_DIR: "desktop"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Checkout (SHA do push; history completo)
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }

      - name: Gate REF + ANCESTRIA — branch correta e descendente da 1.0.209
        working-directory: desktop
        run: |
          set -e
          [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ] || { echo "::error:: ref $GITHUB_REF_NAME != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_209_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.209"; exit 1; }
          git merge-base --is-ancestor "$BASE_208_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.208"; exit 1; }
          echo "REF/ANCESTRIA OK"

      - name: Derivar versao — exige 1.0.210 exato (package + lock x2)
        working-directory: desktop
        run: |
          set -e
          PV="$P" node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));const l=JSON.parse(fs.readFileSync("package-lock.json","utf8"));if(p.version!=="1.0.210"){console.error("package.json version "+p.version+" != 1.0.210");process.exit(1);}if(l.version!=="1.0.210"||(l.packages&&l.packages[""]&&l.packages[""].version!=="1.0.210")){console.error("package-lock version != 1.0.210");process.exit(1);}console.log("versao 1.0.210 OK (3 campos)");'

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: npx tsc --noEmit -p tsconfig.json

      - name: Gate SINTAXE DOS RENDERERS — <script> inline de index/bgnotify/slareminder DEVEM parsear
        working-directory: desktop
        run: |
          set -e
          node -e '
            const fs=require("fs");
            function chk(file){ const s=fs.readFileSync(file,"utf8").replace(/\r\n/g,"\n");
              const re=/<script(\b[^>]*)>([\s\S]*?)<\/script>/gi; let m,n=0;
              while((m=re.exec(s))){ if(/\bsrc\s*=/.test(m[1]||"")) continue; n++;
                try{ new Function(m[2]); }catch(e){ console.error("::error:: SyntaxError "+file+" #"+n+": "+(e&&e.message||e)); process.exit(1);} }
              if(!n){ console.error("::error:: sem <script> inline "+file); process.exit(1);} }
            chk("src/renderer/index.html"); chk("src/renderer/bgnotify.html"); chk("src/renderer/slareminder.html");
            console.log("SINTAXE dos <script> inline OK.");'

      - name: Gate F3.5.4U-H1 — hotfix (defeito 1 cabeçalho + defeito 2 janela única/dedup/observabilidade)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354u-h1-notification-hotfix.test.mjs || { echo "::error:: f354u-h1 vermelho"; exit 1; }

      - name: Gate F3.5.4U — premium/flag/chips/paridade + cabeçalho H1 (108 asserts)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354u-premium-common-notifications.test.mjs || { echo "::error:: f354u vermelho"; exit 1; }

      - name: Gate REGRESSAO — entrega/SLA/decisão/idle/Categoria A/lembrete/agrupamento/updater/renderer (delta ZERO vs 1.0.208)
        working-directory: desktop
        run: |
          set -e
          for t in \
            f354r-priority-assistant f354q-task-idle-detection f354o-common-notification-grouping \
            f354n-watchdog f354n-startup f354k-notification-all-window-states f354l-sla-central-persistent-reminders \
            f354h-red-notification-boundary f354i-cronograma-save-send-client f354-notifications-reliability \
            f354f-task-edit-update-notification f354f-sla-designer-live-timer f353-durable-notifications f353a-actor-photo \
            f343-delivery-channel f343-operational-block f343-main-scheduler f343-sla-golden-master f344-flow-golden-master \
            f345-sla-timestamp-golden-master f343-preservation f347-immediate-visual-delivery f347-independent-behavior \
            f352-cards-notify f352-cards-channel-substitution f3377a-r4b-http-date-clock f33A-notif-central f33F-bg-notify \
            f33B-form-typing f33C-assignment-toast f33L-account-anchor ; do
            node "scripts/$t.test.mjs" || { echo "::error:: regressao vermelha: $t"; exit 1; }
          done
          echo "REGRESSAO (31 suites) verde."

      - name: Gate DECISÃO-SLA preservada — f354p verde EXCETO o auto-ID de versão (X18 1.0.206→1.0.210)
        working-directory: desktop
        run: |
          set -e
          OUT="$(node scripts/f354p-sla-decision-actions.test.mjs 2>&1 || true)"
          echo "$OUT" | tail -3
          FAILN="$(echo "$OUT" | grep -oE '[0-9]+ falharam' | grep -oE '^[0-9]+' || echo 99)"
          [ "$FAILN" = "1" ] || { echo "::error:: f354p deveria ter só 1 obsoleto (X18 versão); tem $FAILN"; exit 1; }
          echo "$OUT" | grep -q "X18" || { echo "::error:: a única falha do f354p NÃO é o X18 de versão"; exit 1; }
          echo "f354p: só o X18 (auto-ID de versão) obsoleto, esperado."

      - name: Gate ISOLAMENTO — diff vs 1.0.209 SÓ nos arquivos autorizados do hotfix
        working-directory: desktop
        run: |
          set -e
          git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_209_SHA" HEAD > /tmp/diff.txt
          echo "== arquivos alterados vs 1.0.209 =="; cat /tmp/diff.txt
          ALLOW='^(desktop/src/main/slaReminder\.ts|desktop/src/main/slaReminderWindow\.ts|desktop/src/renderer/bgnotify\.html|desktop/src/renderer/index\.html|desktop/src/renderer/slareminder\.html|desktop/package\.json|desktop/package-lock\.json|desktop/scripts/f354u-premium-common-notifications\.test\.mjs|desktop/scripts/f354u-h1-notification-hotfix\.test\.mjs|desktop/scripts/f354u-electron-proof-main\.js|desktop/scripts/f354u-electron-proof\.mjs|desktop/scripts/f354uh1-central-proof-main\.js|docs/f354uh1-qa/.*|\.github/workflows/desktop-release-f354u\.yml|\.github/workflows/desktop-build-f354uh1\.yml|\.github/workflows/desktop-release-f354uh1\.yml)$'
          if grep -vE "$ALLOW" /tmp/diff.txt | grep -q .; then echo "::error:: arquivo fora da allowlist do hotfix:"; grep -vE "$ALLOW" /tmp/diff.txt; exit 1; fi
          # NENHUM produtor/entrega/main.ts/notifEvents/preload alterado (congelados vs 1.0.209)
          if grep -qE '^desktop/src/main/(main\.ts|notifEvents\.js|notifierA\.js|notifier\.js|slaScheduler\.js|notificationGrouping\.ts|cardsRules\.js|slaRules\.js|slaReminderStore\.ts|taskIdle\.js|updaterService\.ts)$' /tmp/diff.txt; then echo "::error:: produtor/entrega/congelado alterado vs 1.0.209"; exit 1; fi
          if grep -qE '^desktop/src/preload/' /tmp/diff.txt; then echo "::error:: preload alterado vs 1.0.209"; exit 1; fi
          echo "ISOLAMENTO OK."

      - name: Gate ANDROID/BACKEND intactos — diff nao toca android/functions/worker/Rules
        working-directory: desktop
        run: |
          set -e
          A=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_208_SHA" HEAD | grep -cE '^(android/|functions/|worker/|.*\.rules$|firestore\.rules)' || true)
          [ "$A" = "0" ] || { echo "::error:: diff toca android/backend ($A)"; exit 1; }
          echo "ANDROID/BACKEND intactos."

  build:
    needs: verify
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Forcar LF no checkout
        run: git config --global core.autocrlf false
      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }

      - name: Gate REF + ANCESTRIA (windows)
        working-directory: desktop
        run: |
          set -e
          [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ] || { echo "::error:: ref != branch"; exit 1; }
          git merge-base --is-ancestor "$BASE_209_SHA" HEAD || { echo "::error:: nao descende de 1.0.209"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: TypeScript build
        working-directory: desktop
        run: npm run build
      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: desktop
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate prova-de-versao (asar == 1.0.210) + renderers EMPACOTADOS == fonte (EOL-normalizado)
        working-directory: desktop
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.210" ] || { echo "::error:: asar version=$PKGV != 1.0.210"; exit 1; }
          cmp_norm() { EX="$1" SRC="$2" node -e 'const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");if(n(fs.readFileSync(process.env.EX,"utf8"))!==n(fs.readFileSync(process.env.SRC,"utf8"))){console.error(process.env.SRC+" EMPACOTADO != fonte");process.exit(1);}'; }
          cmp_norm "$EXDIR/src/renderer/index.html" "src/renderer/index.html"
          cmp_norm "$EXDIR/src/renderer/bgnotify.html" "src/renderer/bgnotify.html"
          cmp_norm "$EXDIR/src/renderer/slareminder.html" "src/renderer/slareminder.html"
          echo "GATE prova-de-versao 1.0.210 + renderers==fonte OK."

      - name: Gate F3.5.4U-H1 EMPACOTADO — defeito 1 (cabeçalho) + defeito 2 (janela única/sombra/dedup/observabilidade)
        working-directory: desktop
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; DM="$EXDIR/dist/main"; RR="$EXDIR/src/renderer"; MJS="$DM/main.js"
          # ── DEFEITO 1 — cabeçalho reservado nas 2 superfícies (empacotado) ──
          for f in "$RR/bgnotify.html" "$RR/index.html"; do
            grep -q "ntfp-hd{display:grid;grid-template-columns:1fr auto auto" "$f" || { echo "::error:: cabeçalho GRID ausente no asar: $f"; exit 1; }
            grep -q "ntfp-eyebrow .esev{" "$f" || { echo "::error:: glifo esev ausente no asar: $f"; exit 1; }
            grep -q 'ntf-card.ntfp .ntfp-hd .ntf-x{position:static' "$f" || { echo "::error:: X em coluna reservada ausente no asar: $f"; exit 1; }
            if grep -q '<span class="ntfp-sev"' "$f"; then echo "::error:: ntfp-sev grande sobreposto ainda presente no asar: $f"; exit 1; fi
          done
          # construtores premium IDÊNTICOS (paridade)
          RR="$RR" node -e 'const fs=require("fs");const ex=s=>{const a=s.indexOf("var PREMIUM_TYPES=");const e=s.indexOf("function premiumGroupInner(view){",a);const c=s.indexOf("\n  }",e);return a>=0&&c>=0?s.slice(a,c+4):"";};const n=x=>x.replace(/\s+/g," ").trim();const a=ex(fs.readFileSync(process.env.RR+"/bgnotify.html","utf8")),b=ex(fs.readFileSync(process.env.RR+"/index.html","utf8"));if(!a||!b||n(a)!==n(b)){console.error("::error:: construtores premium divergem no asar");process.exit(1);}'
          # ── DEFEITO 2 — lembrete central: sombra contida + janela única + dedup + observabilidade ──
          grep -q "padding:46px 30px 40px" "$RR/slareminder.html" || { echo "::error:: #wrap sem padding ampliado (sombra) no asar"; exit 1; }
          grep -q "box-shadow:0 10px 26px -10px rgba(2,6,23,.30)" "$RR/slareminder.html" || { echo "::error:: sombra enxuta ausente no asar"; exit 1; }
          if grep -q "0 30px 80px -18px rgba(2,6,23,.62)" "$RR/slareminder.html"; then echo "::error:: sombra escura de 80px (retângulo preto) ainda no asar"; exit 1; fi
          grep -q "REUTILIZAR a janela" "$DM/slaReminderWindow.js" && grep -q "win.hide()" "$DM/slaReminderWindow.js" || { echo "::error:: janela central não reutilizada (hide) no asar"; exit 1; }
          grep -q "function logicalOf" "$DM/slaReminder.js" || { echo "::error:: dedup lógico ausente no asar"; exit 1; }
          for e in enqueued duplicate_dropped activated window_created window_reused render_ack action_received recognized closed destroyed next_promoted queue_empty; do
            grep -q "central_alert.$e" "$DM/slaReminder.js" "$DM/slaReminderWindow.js" || { echo "::error:: central_alert.$e ausente no asar"; exit 1; }
          done
          # observabilidade central_alert.* SANITIZADA (compilado)
          A="$DM/slaReminder.js" B="$DM/slaReminderWindow.js" node -e 'const fs=require("fs");const src=fs.readFileSync(process.env.A,"utf8")+"\n"+fs.readFileSync(process.env.B,"utf8");const calls=src.match(/"central_alert\.[a-z_]+",\s*[^;]*?\)/g)||[];const bad=/\b(actorName|taskTitle|clientName|body|context|title|deep|photo|avatar|email|token)\b/;if(calls.length<6){console.error("::error:: poucas chamadas central_alert.* no asar");process.exit(1);}for(const c of calls){if(bad.test(c)){console.error("::error:: campo proibido em central_alert.* no asar: "+c.slice(0,100));process.exit(1);}}'
          # ── 1.0.208/1.0.209 PRESERVADOS: produtores/entrega/decisão/idle/agrupamento/lembrete intactos ──
          grep -q "function deliverNotification" "$MJS" && grep -q "showBgNotify" "$MJS" && grep -q "updateBgGroup" "$MJS" || { echo "::error:: HUB de entrega alterado"; exit 1; }
          grep -q "createSlaReminderController" "$DM/slaReminder.js" && grep -q "onDecide" "$DM/slaReminder.js" && grep -q "classifyReminderLevel" "$DM/slaReminder.js" || { echo "::error:: decisão SLA (1.0.206) ausente"; exit 1; }
          grep -q "createNotificationGrouping" "$DM/notificationGrouping.js" || { echo "::error:: agrupamento (1.0.205) ausente"; exit 1; }
          grep -qF "premiumCommonNotificationsEnabled" "$MJS" || { echo "::error:: flag premium (1.0.209) ausente"; exit 1; }
          grep -qF 'var CARDS_WARN_MS = 30 * 60000' "$DM/cardsRules.js" && grep -qF 'var CARDS_RED_MS  = 10 * 60000' "$DM/cardsRules.js" || { echo "::error:: tempos T-30/T-10 alterados"; exit 1; }
          # notifEvents/preload congelados vs 1.0.209 (byte-idênticos)
          git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_209_SHA" HEAD -- desktop/src/main/notifEvents.js desktop/src/main/main.ts desktop/src/preload/ || { echo "::error:: main.ts/notifEvents/preload alterados vs 1.0.209"; exit 1; }
          echo "GATE F3.5.4U-H1 EMPACOTADO: VERIFIED."

      - name: Empacotar bundle (EXE/MSI/latest.yml/blockmap/SBOM/SHA256SUMS/VERSAO-DESKTOP)
        working-directory: ${{ env.APP_DIR }}
        env: { APP_VERSION: "1.0.210" }
        run: |
          set -e
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.210-notification-physical-hotfix (CANDIDATA — hotfix físico das notificações)"
            echo "channel     : latest (estrutura do updater; NADA publicado neste build)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "baseline    : Desktop 1.0.208 OFICIAL (commit db8cdca; aprovada fisicamente; rollback)"
            echo "base-codigo : Desktop 1.0.209 (commit 2ba47f2)"
            echo "origem      : F3.5.4U-H1 — hotfix físico: (1) cabeçalho da notificação comum premium em colunas reservadas (horário nunca sob o ícone/X); (2) lembrete central de SLA com UMA janela reutilizada (sem 2ª janela/card atrás), sombra contida (sem retângulo preto), dedup lógico e observabilidade central_alert.* sanitizada. Entrega/dedup/recibos/destinatarios/SLA/decisão/idle/agrupamento/Card Premium/Cronograma/updater/Android: INTOCADOS."
            echo "distribuicao: CANDIDATA — build gated; publicacao no Latest ocorre no workflow desktop-release-f354uh1.yml (mesmos bytes deste run)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload artifact — installer (EXE + MSI) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.210-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30
      - name: Upload artifact — updatemeta PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.210-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
