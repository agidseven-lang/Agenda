# =====================================================================
# [push/manual] F3.5.4U — Desktop Build (candidata 1.0.209 — NOTIFICAÇÕES COMUNS PREMIUM)
# ---------------------------------------------------------------------
# Base 1.0.208 OFICIAL (@db8cdca, tag v1.0.208, testada fisicamente). Delta F3.5.4U (produção, 100% real):
#   - REFORMULAÇÃO VISUAL (apresentação-only) das notificações COMUNS nas 2 superfícies (janela premium
#     bgnotify.html + toast in-app index.html): nova hierarquia TIPO(eyebrow) → ATOR → TÍTULO dominante →
#     MOVIMENTO(chips de status) → COMPLEMENTARES; título maior; ator uma única vez (sem repetir no corpo);
#     avatar maior com iniciais fallback; largura responsiva ~500 (440–560, nunca fora da workArea).
#   - Feature flag LOCAL premiumCommonNotificationsEnabled (default ON; Configurações → Notificações);
#     OFF ⇒ layout equivalente à 1.0.208. Opt-in por carimbo _premiumCommon no payload (main → superfícies).
#   - Campos ESTRUTURADOS ADITIVOS no payload Categoria A (notifEvents.buildCategoryAPayload): fromStatus/
#     toStatus/sector (dado já existente no evento; body/context PRESERVADOS p/ sino/histórico/fallback).
#   - Observabilidade SANITIZADA (8 nomes exatos notification.premium.*; só boolean/contagem/comprimento/
#     eventType/deliverySurface/scaleFactor/appVersion/timestamp — NUNCA nome/título/cliente/UID/token/foto).
#   - ZERO mudança em roteamento/entrega/dedup/recibos/destinatários/agrupamento(lógica)/1º-imediato/janela-5s/
#     som-único/deep-link/sino/fallback-nativo/foco/tray/produtores/SLA/check-in/Card Premium/Cronograma/updater.
# Arquivos autorizados: src/main/main.ts, src/main/bgNotify.ts, src/main/notifEvents.js, src/preload/preload.ts,
#   src/renderer/index.html, src/renderer/bgnotify.html, package(-lock).json, teste f354u (NOVO), workflows f354u.
#   TODO O RESTO byte-idêntico à 1.0.208. `--publish never`, NADA publicado.
# =====================================================================
name: "[push/manual] F3.5.4U Desktop Build (candidata 1.0.209 — notificações comuns premium)"
"on":
  push:
    branches:
      - "desktop/f354u-premium-common-notifications-1.0.209"
    paths-ignore:
      - ".github/workflows/desktop-release-f354u.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_207_SHA: "17c8ef507206cc92dab5b1fcc1da9d9df7194ed0" # Desktop 1.0.207 OFICIAL (referência histórica)
  BASE_208_SHA: "db8cdca1d92cd42f3ec98aced39e6a418c4d478e" # Desktop 1.0.208 OFICIAL (tag v1.0.208; BASE do delta F3.5.4U)
  TEST_BRANCH: "desktop/f354u-premium-common-notifications-1.0.209"
  APP_DIR: "desktop"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (SHA do push; history completo p/ baselines)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA — branch correta e descendente da 1.0.208 pinada
        run: |
          set -e
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error:: ref != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_208_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.208 ($BASE_208_SHA)"; exit 1; }
          echo "ref=$TEST_BRANCH head=$(git rev-parse HEAD) base=$BASE_208_SHA OK"

      - name: Derivar versao — exige 1.0.209 exato, sem sufixo (package + lock x2)
        run: |
          set -e
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          [ "$APP_VERSION" = "1.0.209" ] || { echo "::error:: versao != 1.0.209 ($APP_VERSION)"; exit 1; }
          LOCKV=$(node -p "require('./desktop/package-lock.json').version")
          [ "$LOCKV" = "1.0.209" ] || { echo "::error:: package-lock version != 1.0.209 ($LOCKV)"; exit 1; }
          LOCKV2=$(node -p "require('./desktop/package-lock.json').packages[''].version")
          [ "$LOCKV2" = "1.0.209" ] || { echo "::error:: package-lock packages[''] version != 1.0.209 ($LOCKV2)"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: npx tsc --noEmit -p tsconfig.json

      - name: Gate SINTAXE DOS RENDERERS — os <script> inline de index.html E bgnotify.html DEVEM parsear (erro aqui aborta o app)
        working-directory: desktop
        run: |
          set -e
          node -e '
            const fs=require("fs");
            function chk(file,minLen){ const s=fs.readFileSync(file,"utf8").replace(/\r\n/g,"\n");
              const re=/<script(\b[^>]*)>([\s\S]*?)<\/script>/gi; let m,n=0;
              while((m=re.exec(s))){ if(/\bsrc\s*=/.test(m[1]||"")) continue; n++; const b=m[2];
                try{ new Function(b); }catch(e){ console.error("::error:: SyntaxError em "+file+" script#"+n+": "+(e&&e.message||e)); process.exit(1);} }
              if(!n){ console.error("::error:: nenhum <script> inline em "+file); process.exit(1);} }
            chk("src/renderer/index.html",50000); chk("src/renderer/bgnotify.html",1000);
            console.log("SINTAXE dos <script> inline (index + bgnotify) OK.");
          '

      - name: Gate F3.5.4U — premium/flag/chips/paridade/observabilidade/isolamento + payload aditivo (107 asserts)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354u-premium-common-notifications.test.mjs || { echo "::error:: f354u vermelho"; exit 1; }

      - name: Gate REGRESSAO — HUB/entrega/SLA/decisão/idle/Categoria A/reminder/agrupamento/clock/updater/watchdog/startup/renderer/Cronograma (delta ZERO comportamental vs 1.0.208)
        working-directory: desktop
        run: |
          set -e
          for t in \
            f354r-priority-assistant \
            f354q-task-idle-detection \
            f354o-common-notification-grouping \
            f354n-watchdog \
            f354n-startup \
            f354k-notification-all-window-states \
            f354l-sla-central-persistent-reminders \
            f354h-red-notification-boundary \
            f354i-cronograma-save-send-client \
            f354-notifications-reliability \
            f354f-task-edit-update-notification \
            f354f-sla-designer-live-timer \
            f353-durable-notifications \
            f353a-actor-photo \
            f343-delivery-channel \
            f343-operational-block \
            f343-main-scheduler \
            f343-sla-golden-master \
            f344-flow-golden-master \
            f345-sla-timestamp-golden-master \
            f343-preservation \
            f347-immediate-visual-delivery \
            f347-independent-behavior \
            f352-cards-notify \
            f352-cards-channel-substitution \
            f3377a-r4b-http-date-clock \
            f33A-notif-central \
            f33F-bg-notify \
            f33B-form-typing \
            f33C-assignment-toast \
            f33L-account-anchor \
            f341a-updater-state-machine; do
            node "scripts/$t.test.mjs" || { echo "::error:: regressao vermelha em $t"; exit 1; }
          done
          echo "REGRESSAO OK (delta comportamental zero vs 1.0.208; renderers carregam)."

      - name: Gate DECISÃO-SLA preservada — f354p verde EXCETO o auto-ID de versão (X18 1.0.206→1.0.209)
        working-directory: desktop
        run: |
          set -e
          set +e; OUT=$(node scripts/f354p-sla-decision-actions.test.mjs 2>&1); CODE=$?; set -e
          echo "$OUT" | tail -3
          FAILS=$(echo "$OUT" | grep -cE '^[[:space:]]*✗' || true)
          X18ONLY=$(echo "$OUT" | grep -E '^[[:space:]]*✗' | grep -cvE 'X18 vers' || true)
          [ "$FAILS" = "1" ] && [ "$X18ONLY" = "0" ] || { echo "::error:: f354p regrediu além do auto-ID de versão (falhas=$FAILS, nao-X18=$X18ONLY)"; echo "$OUT" | grep -E '^[[:space:]]*✗'; exit 1; }
          echo "DECISÃO-SLA 1.0.208 preservada (só o auto-ID de versão de f354p ficou obsoleto — esperado)."

      - name: Gate CONGELADOS — produtores/entrega/agrupamento(lógica)/SLA/idle/tray/updater/sons/slareminder byte-idênticos à 1.0.208
        run: |
          set -e
          # DELTA AUTORIZADO F3.5.4U (fora deste gate): src/main/main.ts, src/main/bgNotify.ts, src/main/notifEvents.js,
          # src/preload/preload.ts, src/renderer/index.html, src/renderer/bgnotify.html, package(-lock).json, teste f354u, workflows f354u.
          FROZEN="desktop/src/main/slaScheduler.ts desktop/src/main/slaRules.js desktop/src/main/cardsRules.js desktop/src/main/slaReminder.ts desktop/src/main/slaReminderWindow.ts desktop/src/main/slaReminderStore.ts desktop/src/main/taskIdle.ts desktop/src/main/taskIdleScheduler.ts desktop/src/main/taskIdleStore.ts desktop/src/main/notifier.ts desktop/src/main/notifierA.ts desktop/src/main/notifStore.ts desktop/src/main/notificationGrouping.ts desktop/src/main/slaSeenUser.ts desktop/src/main/toastAck.ts desktop/src/main/reminder.ts desktop/src/main/tray.ts desktop/src/main/autostart.ts desktop/src/main/updaterService.ts desktop/src/main/clockSync.ts desktop/src/main/actorProfile.js desktop/src/main/auth.ts desktop/src/main/auth-core.ts desktop/src/main/prewarm.ts desktop/src/main/diag.ts desktop/src/main/firebase.ts desktop/src/main/listenerWatchdog.ts desktop/src/main/startupPrefs.ts desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/renderer/slareminder.html desktop/src/renderer/priorityEngine.js desktop/src/renderer/sounds/sla-warning.wav desktop/src/renderer/sounds/sla-critical.wav desktop/electron-builder.yml desktop/scripts/copy-renderer.js desktop/tsconfig.json"
          for f in $FROZEN; do
            if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_208_SHA" HEAD -- "$f"; then
              echo "::error:: arquivo CONGELADO alterado vs 1.0.208: $f"; git -C "$GITHUB_WORKSPACE" diff --stat "$BASE_208_SHA" HEAD -- "$f"; exit 1; fi
          done
          echo "CONGELADOS byte-identicos a 1.0.208 OK ($(echo $FROZEN | wc -w) arquivos)."

      - name: Gate DIFF CONTROLADO — delta F3.5.4U é APRESENTAÇÃO + flag + payload aditivo (contrato 1.0.208 preservado)
        working-directory: desktop
        run: |
          set -e
          I=src/renderer/index.html; B=src/renderer/bgnotify.html; M=src/main/main.ts; NE=src/main/notifEvents.js; BG=src/main/bgNotify.ts; PR=src/preload/preload.ts
          # 1 — construtores premium presentes e IDÊNTICOS (paridade) nas 2 superfícies
          node -e '
            const fs=require("fs");
            const ex=s=>{const a=s.indexOf("var PREMIUM_TYPES=");const e=s.indexOf("function premiumGroupInner(view){",a);const c=s.indexOf("\n  }",e);return a>=0&&c>=0?s.slice(a,c+4):"";};
            const n=x=>x.replace(/\s+/g," ").trim();
            const a=ex(fs.readFileSync("src/renderer/bgnotify.html","utf8")), b=ex(fs.readFileSync("src/renderer/index.html","utf8"));
            if(!a||!b){console.error("::error:: construtores premium ausentes");process.exit(1);}
            if(n(a)!==n(b)){console.error("::error:: construtores premium DIVERGEM (paridade quebrada)");process.exit(1);}
            console.log("paridade dos construtores premium OK.");'
          # 2 — flag opt-in ===true (SEM _premiumCommon ⇒ layout clássico) nas 2 superfícies
          grep -q "p._premiumCommon===true" "$I" && grep -q "p._premiumCommon===true" "$B" || { echo "::error:: gate opt-in ===true ausente"; exit 1; }
          # 3 — hierarquia premium (eyebrow/ator/título/chips/complementares) + chips por estado
          grep -q "ntfp-eyebrow" "$B" && grep -q "ntfp-task" "$B" && grep -q "ntfp-chip" "$B" && grep -q "cs-andamento" "$B" || { echo "::error:: hierarquia/chips premium ausentes (bgnotify)"; exit 1; }
          grep -q "ntfp-task" "$I" && grep -q "cs-concluido" "$I" || { echo "::error:: hierarquia/chips premium ausentes (toast)"; exit 1; }
          # 4 — flag no main + IPC + carimbo com typeof-guard + notifEvents aditivo (from/to/sector) + preload
          grep -q "premiumCommonNotificationsEnabled" "$M" && grep -q 'ipcMain.handle("premium-get"' "$M" && grep -q 'ipcMain.handle("premium-set"' "$M" || { echo "::error:: flag/IPC premium ausentes no main"; exit 1; }
          grep -qF 'typeof premiumCommonEnabled !== "undefined"' "$M" || { echo "::error:: carimbo _premiumCommon sem typeof-guard"; exit 1; }
          grep -qE 'fromStatus: ev.fromStatus' "$NE" && grep -qE 'toStatus: ev.toStatus' "$NE" && grep -qE 'sector: ev.sector' "$NE" || { echo "::error:: payload aditivo from/to/sector ausente"; exit 1; }
          grep -qF 'evBody(ev, ator, designer)' "$NE" && grep -qF 'context: ctx' "$NE" || { echo "::error:: body/context do payload PRESERVADOS removidos"; exit 1; }
          grep -q 'premiumGet' "$PR" && grep -q 'premiumSet' "$PR" || { echo "::error:: pontes premiumGet/Set ausentes no preload"; exit 1; }
          # 5 — observabilidade: os 8 NOMES EXATOS presentes; NENHUM substituto notif.premium.*
          for e in rendered group_updated layout_fallback avatar_fallback text_truncated opened closed feature_disabled; do
            grep -q "notification.premium.$e" "$M" "$BG" || { echo "::error:: evento notification.premium.$e ausente"; exit 1; }
          done
          if grep -qE 'notif\.premium\.(rendered|opened|closed|group_updated)' "$M" "$BG"; then echo "::error:: usou notif.premium.* como substituto dos 8 nomes"; exit 1; fi
          # 6 — observabilidade SANITIZADA: payloads premium.* SEM campos proibidos
          node -e '
            const fs=require("fs"); const src=fs.readFileSync("src/main/main.ts","utf8")+"\n"+fs.readFileSync("src/main/bgNotify.ts","utf8");
            const calls=src.match(/"notification\.premium\.[a-z_]+",\s*\{[^}]*\}/g)||[];
            const bad=/\b(actorName|taskTitle|clientName|responsibleName|actorAvatar|responsibleAvatar|targetUserId|token|email|photo|body|context)\b/;
            if(calls.length<6){console.error("::error:: poucos eventos premium instrumentados");process.exit(1);}
            for(const c of calls){ if(bad.test(c)){ console.error("::error:: payload premium com campo PROIBIDO: "+c.slice(0,120)); process.exit(1);} }
            console.log("observabilidade premium SANITIZADA OK ("+calls.length+" chamadas).");'
          # 7 — SEGURANÇA: CSP da janela premium inalterada + sem script externo + sem áudio novo
          grep -qF "script-src 'unsafe-inline'" "$B" || { echo "::error:: CSP da janela premium alterada"; exit 1; }
          if grep -qE '<script[[:space:]]+src=' "$B"; then echo "::error:: janela premium ganhou <script src> externo"; exit 1; fi
          if grep -qE '<audio|\.play\(\)' "$B"; then echo "::error:: janela premium ganhou audio (premium é silenciosa)"; exit 1; fi
          # 8 — largura responsiva na janela premium (bgNotify.ts) sem quebrar o contrato canto-inferior-direito
          grep -q "computeWidth" "$BG" && grep -q "wa.width - WIDTH" "$BG" && grep -q "focusable: false" "$BG" && grep -q "showInactive()" "$BG" || { echo "::error:: largura responsiva/contrato de foco da janela premium quebrados"; exit 1; }
          # 9 — HUB/entrega/dedup/sino/agrupamento(wiring) preservados no main
          grep -q "function deliverNotification" "$M" && grep -q "notif-toast" "$M" && grep -q "showBgNotify" "$M" && grep -q "_notifSeen" "$M" && grep -q "notif-history" "$M" && grep -q "notificationGrouping" "$M" || { echo "::error:: HUB/dedup/sino/agrupamento removidos do main"; exit 1; }
          echo "DIFF CONTROLADO F3.5.4U OK (apresentação + flag + payload aditivo; contrato 1.0.208 preservado)."

      - name: Gate ISOLAMENTO — diff vs 1.0.208 SÓ nos arquivos autorizados F3.5.4U
        run: |
          set -e
          git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_208_SHA" HEAD | tee /tmp/f354u-diff.txt
          if grep -vE '^(desktop/src/main/main\.ts$|desktop/src/main/bgNotify\.ts$|desktop/src/main/notifEvents\.js$|desktop/src/preload/preload\.ts$|desktop/src/renderer/index\.html$|desktop/src/renderer/bgnotify\.html$|desktop/scripts/f354u-premium-common-notifications\.test\.mjs$|desktop/package\.json$|desktop/package-lock\.json$|docs/f354u-qa/|\.github/workflows/desktop-build-f354u\.yml$|\.github/workflows/desktop-release-f354u\.yml$)' /tmp/f354u-diff.txt | grep -q .; then
            echo "::error:: diff vs 1.0.208 toca arquivo NAO autorizado"; grep -vE '^(desktop/src/main/main\.ts$|desktop/src/main/bgNotify\.ts$|desktop/src/main/notifEvents\.js$|desktop/src/preload/preload\.ts$|desktop/src/renderer/index\.html$|desktop/src/renderer/bgnotify\.html$|desktop/scripts/f354u-premium-common-notifications\.test\.mjs$|desktop/package\.json$|desktop/package-lock\.json$|docs/f354u-qa/|\.github/workflows/desktop-build-f354u\.yml$|\.github/workflows/desktop-release-f354u\.yml$)' /tmp/f354u-diff.txt || true; exit 1; fi
          echo "ISOLAMENTO OK — diff confinado aos arquivos autorizados F3.5.4U."

      - name: Gate ANDROID/BACKEND intactos — diff nao toca android/ nem functions/ nem worker/ nem Rules
        run: |
          set -e
          BAD=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_208_SHA" HEAD | grep -cE '^(android/|android-native/|functions/|worker/|worker-deploy/|presence-service/|firestore\.rules|cloudflare-worker\.js)' || true)
          [ "$BAD" = "0" ] || { echo "::error:: diff toca backend/android ($BAD)"; git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_208_SHA" HEAD | grep -E '^(android/|android-native/|functions/|worker/|worker-deploy/|presence-service/|firestore\.rules|cloudflare-worker\.js)' || true; exit 1; }
          echo "ANDROID/BACKEND intactos OK."

  build:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: desktop
    steps:
      - name: Forcar LF no checkout
        run: git config --global core.autocrlf false

      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA (windows)
        run: |
          set -e
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error:: ref != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_208_SHA" HEAD || { echo "::error:: HEAD nao descende da 1.0.208"; exit 1; }

      - name: Gate LINE ENDINGS LF (fontes do delta)
        run: |
          set -e
          for f in desktop/src/renderer/index.html desktop/src/renderer/bgnotify.html desktop/src/main/main.ts desktop/src/main/bgNotify.ts desktop/src/main/notifEvents.js desktop/src/preload/preload.ts; do
            if grep -lU $'\r' "$f" >/dev/null 2>&1; then echo "::error:: CRLF em $f"; exit 1; fi
          done
          echo "LF OK."

      - name: Derivar versao — exige 1.0.209 exato
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          [ "$APP_VERSION" = "1.0.209" ] || { echo "::error:: versao != 1.0.209 ($APP_VERSION)"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        working-directory: desktop
        run: npm run build

      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: desktop
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: desktop
        run: |
          set -e
          test -f dist-installer/win-unpacked/resources/icon.png || { echo "::error:: tray icon.png ausente em resources"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.209) + renderers EMPACOTADOS == fonte (EOL-normalizado)
        working-directory: desktop
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.209" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.209"; exit 1; }
          cmp_norm() { EX="$1" SRC="$2" node -e 'const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");if(n(fs.readFileSync(process.env.EX,"utf8"))!==n(fs.readFileSync(process.env.SRC,"utf8"))){console.error(process.env.SRC+" EMPACOTADO != fonte");process.exit(1);}'; }
          cmp_norm "$EXDIR/src/renderer/index.html" "src/renderer/index.html"
          cmp_norm "$EXDIR/src/renderer/bgnotify.html" "src/renderer/bgnotify.html"
          cmp_norm "$EXDIR/src/renderer/slareminder.html" "src/renderer/slareminder.html"
          echo "GATE prova-de-versao 1.0.209 + renderers==fonte OK."

      - name: Gate F3.5.4U EMPACOTADO — premium/flag/chips/paridade/observabilidade + 1.0.208 preservado (25 gates)
        working-directory: desktop
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; DM="$EXDIR/dist/main"; DP="$EXDIR/dist/preload"; RR="$EXDIR/src/renderer"; MJS="$DM/main.js"
          cmp_norm() { EX="$1" SRC="$2" node -e 'const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");if(n(fs.readFileSync(process.env.EX,"utf8"))!==n(fs.readFileSync(process.env.SRC,"utf8"))){console.error(process.env.SRC+" EMPACOTADO != fonte");process.exit(1);}'; }
          # ===== NOTIFICAÇÕES COMUNS PREMIUM (F3.5.4U) — apresentação-only nas 2 superfícies =====
          # 1 — construtores premium empacotados + IDÊNTICOS (paridade janela × toast)
          RR="$RR" node -e '
            const fs=require("fs");
            const ex=s=>{const a=s.indexOf("var PREMIUM_TYPES=");const e=s.indexOf("function premiumGroupInner(view){",a);const c=s.indexOf("\n  }",e);return a>=0&&c>=0?s.slice(a,c+4):"";};
            const n=x=>x.replace(/\s+/g," ").trim();
            const a=ex(fs.readFileSync(process.env.RR+"/bgnotify.html","utf8")), b=ex(fs.readFileSync(process.env.RR+"/index.html","utf8"));
            if(!a||!b||n(a)!==n(b)){console.error("::error:: construtores premium ausentes/divergentes no asar");process.exit(1);}'
          # 2 — hierarquia premium empacotada (eyebrow/ator/título/chips por estado)
          grep -q "ntfp-eyebrow" "$RR/bgnotify.html" && grep -q "ntfp-task" "$RR/bgnotify.html" && grep -q "ntfp-chip" "$RR/bgnotify.html" && grep -q "cs-andamento" "$RR/bgnotify.html" || { echo "::error:: hierarquia/chips ausentes no asar (bgnotify)"; exit 1; }
          grep -q "ntfp-task" "$RR/index.html" && grep -q "cs-concluido" "$RR/index.html" || { echo "::error:: hierarquia/chips ausentes no asar (index)"; exit 1; }
          # 3 — flag opt-in ===true empacotada (SEM _premiumCommon ⇒ clássico) nas 2 superfícies
          grep -q "p._premiumCommon===true" "$RR/bgnotify.html" && grep -q "p._premiumCommon===true" "$RR/index.html" || { echo "::error:: opt-in ===true ausente no asar"; exit 1; }
          # 4 — CRUX SINTAXE: os <script> inline EMPACOTADOS (index + bgnotify) parseiam
          RR="$RR" node -e 'const fs=require("fs");function chk(f){const s=fs.readFileSync(f,"utf8").replace(/\r\n/g,"\n");const re=/<script(\b[^>]*)>([\s\S]*?)<\/script>/gi;let m,n=0;while((m=re.exec(s))){if(/\bsrc\s*=/.test(m[1]||""))continue;n++;try{new Function(m[2]);}catch(e){console.error("::error:: SyntaxError EMPACOTADO "+f+": "+(e&&e.message||e));process.exit(1);}}if(!n){console.error("::error:: sem <script> inline "+f);process.exit(1);}}chk(process.env.RR+"/index.html");chk(process.env.RR+"/bgnotify.html");'
          # 5 — SEGURANÇA: CSP da janela premium empacotada intacta + sem script externo + sem áudio
          grep -qF "script-src 'unsafe-inline'" "$RR/bgnotify.html" || { echo "::error:: CSP premium alterada no asar"; exit 1; }
          if grep -qE '<script[[:space:]]+src=' "$RR/bgnotify.html"; then echo "::error:: script externo no asar (bgnotify)"; exit 1; fi
          if grep -qE '<audio|\.play\(\)' "$RR/bgnotify.html"; then echo "::error:: audio no asar (bgnotify)"; exit 1; fi
          # 6 — main.js empacotado: flag + IPC + carimbo + observabilidade (8 nomes) sem substituto
          grep -q "premiumCommonNotificationsEnabled" "$MJS" && grep -q '"premium-get"' "$MJS" && grep -q '"premium-set"' "$MJS" && grep -q "_premiumCommon" "$MJS" || { echo "::error:: flag/IPC/carimbo premium ausentes no main empacotado"; exit 1; }
          for e in rendered group_updated layout_fallback avatar_fallback text_truncated opened closed feature_disabled; do grep -q "notification.premium.$e" "$MJS" "$DM/bgNotify.js" || { echo "::error:: evento notification.premium.$e ausente no asar"; exit 1; }; done
          if grep -qE 'notif\.premium\.(rendered|opened|closed|group_updated)' "$MJS" "$DM/bgNotify.js"; then echo "::error:: substituto notif.premium.* no asar"; exit 1; fi
          # 7 — observabilidade empacotada SANITIZADA (sem campos proibidos nas chamadas premium.*)
          MJS="$MJS" DMB="$DM/bgNotify.js" node -e 'const fs=require("fs");const src=fs.readFileSync(process.env.MJS,"utf8")+"\n"+fs.readFileSync(process.env.DMB,"utf8");const calls=src.match(/"notification\.premium\.[a-z_]+",\s*\{[^}]*\}/g)||[];const bad=/\b(actorName|taskTitle|clientName|responsibleName|actorAvatar|responsibleAvatar|targetUserId|token|email|photo|body|context)\b/;if(calls.length<6){console.error("::error:: poucos eventos premium no asar");process.exit(1);}for(const c of calls){if(bad.test(c)){console.error("::error:: campo proibido no asar: "+c.slice(0,100));process.exit(1);}}'
          # 8 — largura responsiva + contrato de foco na janela premium empacotada
          grep -q "computeWidth" "$DM/bgNotify.js" && grep -q "focusable: false" "$DM/bgNotify.js" && grep -q "showInactive" "$DM/bgNotify.js" && grep -q "alwaysOnTop" "$DM/bgNotify.js" || { echo "::error:: largura/foco da janela premium quebrados no asar"; exit 1; }
          # 9 — notifEvents empacotado: payload aditivo from/to/sector + body/context PRESERVADOS
          grep -qE 'fromStatus: ev.fromStatus' "$DM/notifEvents.js" && grep -qE 'toStatus: ev.toStatus' "$DM/notifEvents.js" && grep -qE 'sector: ev.sector' "$DM/notifEvents.js" || { echo "::error:: payload aditivo ausente no asar"; exit 1; }
          grep -qF "recipientMode: 'all_active_users'" "$DM/notifEvents.js" && grep -qF "recipientMode: 'assigned_designer'" "$DM/notifEvents.js" || { echo "::error:: Categoria A/destinatários alterados no asar"; exit 1; }
          # ===== COMPORTAMENTO 1.0.208 PRESERVADO (byte-idêntico à fonte congelada) =====
          # 10 — agrupamento (F3.5.4O) CONGELADO (lógica intacta; .ts congelado via gate FROZEN por git)
          grep -q "createNotificationGrouping" "$DM/notificationGrouping.js" && grep -q "common_group:" "$DM/notificationGrouping.js" || { echo "::error:: agrupamento F3.5.4O ausente"; exit 1; }
          # 11 — HUB de entrega + sino/dedup individual intactos no main
          grep -q "function deliverNotification" "$MJS" && grep -q "notif-toast" "$MJS" && grep -q "showBgNotify" "$MJS" && grep -q "notif-history" "$MJS" && grep -q "_notifSeen" "$MJS" || { echo "::error:: HUB/sino/dedup removido"; exit 1; }
          grep -q "notif-group-update" "$MJS" && grep -q "updateBgGroup" "$MJS" || { echo "::error:: atualização de grupo removida do main"; exit 1; }
          # 12 — TEMPOS CONGELADOS: cardsRules T-30/T-10 + slaRules == fonte
          cmp_norm "$DM/cardsRules.js" "src/main/cardsRules.js"; cmp_norm "$DM/slaRules.js" "src/main/slaRules.js"
          grep -qF 'var CARDS_WARN_MS = 30 * 60000' "$DM/cardsRules.js" || { echo "::error:: T-30 alterada"; exit 1; }
          grep -qF 'var CARDS_RED_MS  = 10 * 60000' "$DM/cardsRules.js" || { echo "::error:: T-10 alterada"; exit 1; }
          # 13 — produtores SLA/Categoria A/event_new empacotados (congelados)
          grep -q "startSlaScheduler" "$DM/slaScheduler.js" && grep -q "startNotifierA" "$DM/notifierA.js" && grep -q "event_new" "$DM/notifier.js" || { echo "::error:: produtores SLA/notif nao empacotados"; exit 1; }
          # 14 — DECISÃO SLA (F3.5.4P) + check-in idle (F3.5.4Q) congelados e empacotados
          grep -q "onDecide" "$DM/slaReminder.js" && grep -q "markDecisionPending" "$DM/slaReminderStore.js" || { echo "::error:: decisão SLA 1.0.208 ausente"; exit 1; }
          grep -q "IDLE_MS_BY_SECTOR" "$DM/taskIdle.js" && grep -q "startTaskIdleScheduler" "$DM/taskIdleScheduler.js" || { echo "::error:: detecção idle 1.0.208 ausente"; exit 1; }
          # 15 — lembrete central (F3.5.4L/M) + som local intactos
          grep -q "createSlaReminderController" "$DM/slaReminder.js" && grep -q "classifyReminderLevel" "$DM/slaReminder.js" || { echo "::error:: lembrete central ausente"; exit 1; }
          test -f "$RR/sounds/sla-warning.wav" && head -c 4 "$RR/sounds/sla-warning.wav" | grep -q 'RIFF' || { echo "::error:: som local do lembrete ausente/invalido"; exit 1; }
          # 16 — Assistente de Prioridades (F3.5.4R) CONGELADO e empacotado == fonte
          cmp_norm "$RR/priorityEngine.js" "src/renderer/priorityEngine.js"
          grep -q "buildUserPriorityList" "$RR/priorityEngine.js" || { echo "::error:: priorityEngine ausente no asar"; exit 1; }
          # 17 — Cronograma/Card Premium no renderer preservados
          grep -q "function cronSanitizeDeep(" "$RR/index.html" && grep -q "function buildClientMessage(" "$RR/index.html" && grep -q "async function saveTask(" "$RR/index.html" || { echo "::error:: Cronograma/Card 1.0.208 ausentes no asar"; exit 1; }
          # 18 — preload empacotado: pontes 1.0.208 + premiumGet/Set
          grep -q "taskIdleGet" "$DP/preload.js" && grep -q "slaDecisionGet" "$DP/preload.js" && grep -q "groupingGet" "$DP/preload.js" && grep -q "premiumGet" "$DP/preload.js" && grep -q "premiumSet" "$DP/preload.js" || { echo "::error:: preload.js: pontes 1.0.208/premium ausentes"; exit 1; }
          # 19 — flags 1.0.208 + f354u-notify preservadas/presentes no main
          grep -q "taskIdleDetectionEnabled" "$MJS" && grep -q "f354q-notify.json" "$MJS" && grep -q "f354o-notify.json" "$MJS" && grep -q "f354u-notify.json" "$MJS" || { echo "::error:: flags de notificação ausentes no main empacotado"; exit 1; }
          # 20 — toggle Configurações + diagnóstico do estilo premium no renderer empacotado
          grep -q "data-cfgpremium" "$RR/index.html" && grep -q "data-cfggrouping" "$RR/index.html" && grep -q "data-cfgtaskidle" "$RR/index.html" || { echo "::error:: toggles Configurações ausentes no asar"; exit 1; }
          # 21 — tray + updater channel latest
          grep -q "ensureTray" "$MJS" && grep -qE 'channel[[:space:]]*=[[:space:]]*"latest"' "$DM/updaterService.js" || { echo "::error:: tray/updater channel latest ausente"; exit 1; }
          # 22 — bgnotify-preload (bgAPI) CONGELADO empacotado == fonte compilada + API intacta
          cmp_norm "$DP/bgnotify-preload.js" "dist/preload/bgnotify-preload.js"
          grep -q "onCard" "$DP/bgnotify-preload.js" && grep -q "onGroupUpdate" "$DP/bgnotify-preload.js" && grep -q "rendered" "$DP/bgnotify-preload.js" || { echo "::error:: bgAPI (bgnotify-preload) alterado"; exit 1; }
          # 23 — diag-log reescreve opened/closed com NOME EXATO no main empacotado
          grep -q 'notification.premium.opened' "$MJS" && grep -q 'notification.premium.closed' "$MJS" || { echo "::error:: interação opened/closed ausente no main empacotado"; exit 1; }
          # 24 — nenhum <audio>/.play() novo no index.html empacotado por causa do premium (som único preservado)
          grep -q "notifSound" "$RR/index.html" || { echo "::error:: som do toast (notifSound) removido"; exit 1; }
          # 25 — Android NAO tocado
          A2=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_208_SHA" HEAD | grep -c '^android' || true); [ "$A2" = "0" ] || { echo "::error:: diff toca android ($A2)"; exit 1; }
          echo "GATE F3.5.4U EMPACOTADO: VERIFIED (25 gates; premium apresentação + flag + paridade + observabilidade sanitizada; 1.0.208 preservado)"

      - name: Empacotar bundle (EXE/MSI/latest.yml/blockmap/SBOM/SHA256SUMS/VERSAO-DESKTOP) + SHA256SUMS
        working-directory: ${{ env.APP_DIR }}
        env:
          APP_VERSION: "1.0.209"
        run: |
          set -e
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom-cyclonedx.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom-cyclonedx.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"
          cp "$RUNNER_TEMP/sbom-cyclonedx.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.209-premium-common-notifications (CANDIDATA — notificações comuns premium)"
            echo "channel     : latest (estrutura do updater; NADA publicado neste build)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "baseline    : Desktop 1.0.208 OFICIAL (commit db8cdca; tag v1.0.208 preservada; testada fisicamente)"
            echo "origem      : F3.5.4U — NOTIFICAÇÕES COMUNS PREMIUM (reformulação de APRESENTAÇÃO das notificações comuns nas 2 superfícies: hierarquia TIPO(eyebrow)/ATOR/TÍTULO dominante/MOVIMENTO(chips)/COMPLEMENTARES; ator uma vez sem repetir no corpo; avatar maior; largura responsiva ~500 440-560; flag LOCAL premiumCommonNotificationsEnabled default ON, OFF=layout 1.0.208; payload aditivo fromStatus/toStatus/sector; body/context preservados; observabilidade sanitizada 8 eventos. Entrega/dedup/recibos/destinatarios/agrupamento(logica)/1o-imediato/janela-5s/som-unico/deep-link/sino/fallback-nativo/foco/tray/produtores/SLA/check-in/Card Premium/Cronograma/updater/Android: INTOCADOS)"
            echo "assinatura  : mesmo processo da 1.0.208 (sem code-signing -> NotSigned)"
            echo "distribuicao: CANDIDATA — build gated; publicacao no Latest ocorre no workflow desktop-release-f354u.yml (mesmos bytes deste run)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload artifact — installer (EXE + MSI) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.209-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact — updatemeta (latest.yml + blockmap + SHA256SUMS + SBOM + VERSAO) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.209-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
