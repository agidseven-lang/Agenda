          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          timeout -k 15 700 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355d-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5C-H2 — 9 cenas (janela slareminder REAL) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 500 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch2-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5C-H1 — boot de sessão (10 cenas) + ciclos 20x — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-electron-proof-main.js
          timeout -k 15 400 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-cycle-proof-main.js
      - name: "Gate SMOKE RTE herdado — 91 comportamentais no Chromium REAL"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 300 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-rte-behavior-main.js
      - name: "Gate PROVAS herdadas — F3.5.5C (32) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-proof-main.js
      - name: "Gate PARIDADE CRUZADA herdada — canônicos validados pelo Worker"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-canon-crossparity.mjs
      - name: "Gate PROVAS herdadas — F3.5.5B (20) + F3.5.5A-H1 (15) + F3.5.5A (25) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355b-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ah1-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355a-execution-proof-main.js
      - uses: actions/upload-artifact@v4
        with: { name: f355d-provas-qa, path: "docs/f355d-qa/**", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: f355d-provas-herdadas-qa, path: "docs/f355ch2-qa/**\ndocs/f355ch1-qa/**\ndocs/f355c-qa/**", if-no-files-found: error, retention-days: 30 }
      - name: "Gate ISOLAMENTO — delta vs 1.0.222 SÓ nos arquivos autorizados; congelados diff-vazio"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_222_SHA"..HEAD > /tmp/delta.txt; cat /tmp/delta.txt
          # allowlist F3.5.5D: index.html (stepper cronograma + colagem universal) + main.ts (wiring
          # menu nativo + IPC) + NOVO editContextMenu.ts + preload.ts (clipboardReadHTML) + versão +
          # suítes/provas/docs/workflows da fase + re-pins herdados de versão (precedente F3.5.5C/H1/H2).
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f355d\.yml$|desktop/src/renderer/index\.html$|desktop/src/main/main\.ts$|desktop/src/main/editContextMenu\.ts$|desktop/src/preload/preload\.ts$|desktop/package(-lock)?\.json$|desktop/scripts/f355d-|desktop/scripts/f355ch2-stale-alert\.test\.mjs$|desktop/scripts/f355ch2-electron-proof-main\.js$|desktop/scripts/f355ch1-electron-proof-main\.js$|desktop/scripts/f355ch1-proof-preload\.js$|desktop/scripts/f354l-sla-central-persistent-reminders\.test\.mjs$|desktop/scripts/f354p-sla-decision-actions\.test\.mjs$|desktop/scripts/f355c-script-quantity-rich-editor\.test\.mjs$|desktop/scripts/f355c-proof-preload\.js$|desktop/scripts/f355b-agenda-premium\.test\.mjs$|desktop/scripts/f355b-proof-preload\.js$|desktop/scripts/f355ah1-internal-notes\.test\.mjs$|desktop/scripts/f355ah1-proof-preload\.js$|desktop/scripts/f355a-integration\.test\.mjs$|desktop/scripts/f354wh2-immediate-notification-sound\.test\.mjs$|desktop/scripts/f354vh1-session-persistence\.test\.mjs$|docs/f355d(-qa)?/)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist: $BAD"; exit 1; }
          # No MAIN, as ÚNICAS mudanças permitidas são o NOVO editContextMenu.ts + o wiring no main.ts:
          MAINDELTA=$(git diff --name-only "$BASE_222_SHA"..HEAD -- desktop/src/main | sort | tr '\n' ' ')
          [ "$MAINDELTA" = "desktop/src/main/editContextMenu.ts desktop/src/main/main.ts " ] || { echo "::error::main alterado além do esperado: $MAINDELTA"; exit 1; }
          # CONGELADOS byte-idênticos vs 1.0.222: slaReminder (H2!) + auth-core (H1!) + store/janela/
          # regras/scheduler do SLA + motores idle/orquestrador + preloads das superfícies + renderers
          # auxiliares + sons + priorityEngine + build config + WORKER + worker-ops + Functions + Android.
          git diff --quiet "$BASE_222_SHA"..HEAD -- desktop/src/main/slaReminder.ts desktop/src/main/auth-core.ts desktop/src/main/slaReminderStore.ts desktop/src/main/slaReminderWindow.ts desktop/src/main/slaRules.js desktop/src/main/slaScheduler.ts desktop/src/main/taskIdle.ts desktop/src/main/taskIdleScheduler.ts desktop/src/main/taskIdleStore.ts desktop/src/main/executionOrchestrator.ts desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/sounds desktop/src/renderer/priorityEngine.js desktop/scripts/copy-renderer.js desktop/tsconfig.json desktop/electron-builder.yml cloudflare-worker.js scripts/worker-ops functions android-native android-native-beta || { echo "::error::módulo congelado alterado"; exit 1; }
      - name: "Gate MARCADORES F3.5.5D — quantidade do cronograma + colagem universal + menu nativo (fonte)"
        run: |
          set -euo pipefail
          grep -q 'function cronQtyCommit' desktop/src/renderer/index.html
          grep -q 'function synthCronSub' desktop/src/renderer/index.html
          grep -q 'Quantidade de temas' desktop/src/renderer/index.html
          grep -q 'data-cqplus' desktop/src/renderer/index.html
          grep -q 'id="fCronQty"' desktop/src/renderer/index.html
          grep -q 'function f355dWireUniversalPaste' desktop/src/renderer/index.html
          grep -q 'function _rtePasteApply' desktop/src/renderer/index.html
          grep -q 'clipboardReadHTML' desktop/src/renderer/index.html
          grep -q 'if(el.readOnly||el.disabled) return false;' desktop/src/renderer/index.html
          grep -q 'attachEditContextMenu' desktop/src/main/main.ts
          grep -q 'clipboard-read-html' desktop/src/main/main.ts
          grep -q 'buildEditMenuTemplate' desktop/src/main/editContextMenu.ts
          grep -q 'label: "Colar"' desktop/src/main/editContextMenu.ts
          grep -q 'clipboardReadHTML' desktop/src/preload/preload.ts
          # H2 preservado (fonte):
          grep -q 'taskGate' desktop/src/main/slaReminder.ts
          grep -q 'Esta tarefa já foi encerrada.' desktop/src/main/slaReminder.ts
          grep -q 'slaTaskMapReady' desktop/src/main/main.ts
          # H1 preservado (fonte):
          grep -q 'server_unauthorized_confirmed' desktop/src/main/auth-core.ts
          grep -q 'authRetryNow' desktop/src/renderer/index.html
          # Herdados do Roteiro/Vídeos intactos:
          grep -q 'id="fScriptQty"' desktop/src/renderer/index.html
          grep -q 'id="fVideoQty"' desktop/src/renderer/index.html
          echo "MARCADORES F3.5.5D: VERIFIED."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão + cronograma-qty + colagem universal + herdados no app.asar (suítes contra o pacote)"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
