# re-pins herdados. slaReminder (H2!), auth-core (H1!), store/janela/regras do SLA, motores,
# bgnotify/slareminder.html, sons, priorityEngine, worker, functions e android CONGELADOS byte a
# byte vs 1.0.222 — regra máxima do owner: ZERO regressão no aprovado.
name: "[push/manual] F3.5.5D — Desktop 1.0.223 (Cronogramas Personalizados + Colagem Universal) — Desktop Build"
"on":
  push:
    branches: ["desktop/f355d-custom-cronograma-quantity-universal-paste-1.0.223"]
    paths-ignore: [".github/workflows/desktop-release-f355d.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f355d-custom-cronograma-quantity-universal-paste-1.0.223"
  BASE_222_SHA: "1eac3672ab07a56bfd5d692e9ecb24688ac2ee83"
  BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
  BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
  BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
  BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.222, 1.0.221, 1.0.220, 1.0.218 e 1.0.216)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          git merge-base --is-ancestor "$BASE_222_SHA" HEAD || { echo "::error::não descende da 1.0.222"; exit 1; }
          git merge-base --is-ancestor "$BASE_221_SHA" HEAD || { echo "::error::não descende da 1.0.221"; exit 1; }
          git merge-base --is-ancestor "$BASE_220_SHA" HEAD || { echo "::error::não descende da 1.0.220"; exit 1; }
          git merge-base --is-ancestor "$BASE_218_SHA" HEAD || { echo "::error::não descende da 1.0.218"; exit 1; }
          git merge-base --is-ancestor "$BASE_216_SHA" HEAD || { echo "::error::não descende da 1.0.216"; exit 1; }
      - name: "Gate VERSAO 1.0.223 (package + lock x2 + description da fase + bases preservadas)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.223') process.exit(1); if(!/custom-cronograma-quantity-universal-paste/.test(p.description||'')) process.exit(1); if(!/stale-alert-terminal-task-hotfix/.test(p.description||'')) process.exit(1); if(!/session-restore-boot-hotfix/.test(p.description||'')) process.exit(1); if(!/custom-script-quantity-rich-editor/.test(p.description||'')) process.exit(1);"
          [ "$(grep -c '"version": "1.0.223"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (index TODOS os blocos inline) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]);"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]);"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline (guarda + principal)');process.exit(1);}b.forEach(x=>new Function(x));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "Gate F3.5.5D — cronograma qty + colagem universal + menu nativo 88 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
      - name: "Gate F3.5.3 herdado — colagem base 15 (choke-point com guard readOnly) + duráveis 37"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f353-paste-recovery.test.mjs
          node scripts/f353-durable-notifications.test.mjs
      - name: "Gate F3.5.5C-H2 herdado — alertas residuais 53 (3 barreiras + limpeza + ciclos) [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
