# F3.5.5D — Desktop 1.0.223 (Cronogramas Personalizados e Colagem Universal)
# build GATED, --publish never. Publicação SÓ no desktop-release-f355d.yml (mesmos bytes).
# Base de código 1.0.222 @ 1eac3672 (Latest publicada); rollback técnico 1.0.222; baseline FÍSICA
# 1.0.218 @ 1a94515; adicional 1.0.216 @ e509f43. Delta: index.html (stepper 'Quantidade de temas'
# no Cronograma — espelho do padrão aprovado do Roteiro — + pipeline UNIVERSAL de colagem +
# passthrough do menu DOM f353 + guard readOnly/disabled no choke-point) + main.ts (wiring do menu
# de contexto NATIVO + IPC clipboard-read-html) + NOVO editContextMenu.ts (roles PT-BR, DI,
