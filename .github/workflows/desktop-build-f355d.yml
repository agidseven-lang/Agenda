          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.223"; echo "rotulo      : 1.0.223-f355d-custom-cronograma-quantity-universal-paste (CANDIDATA — Cronogramas Personalizados e Colagem Universal)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.222 (commit 1eac3672)"; echo "rollback    : técnico 1.0.222 (1eac3672); físico 1.0.218 (1a94515); adicional 1.0.216 (e509f43)"; echo "origem      : F3.5.5D — Cronogramas Personalizados e Colagem Universal. (1) O Briefing do Cronograma troca os chips fixos de Periodicidade (Semanal/Quinzenal/Mensal) pelo seletor QUANTIDADE DE TEMAS [-][N][+] (inteiro >=1; digitar/apagar/selecionar/substituir/colar/setas/Tab; mensagem literal de validação; vazio NÃO avança; aumentar preserva itens; reduzir com conteúdo exige confirmação Cancelar/Remover; teto técnico 500 com aviso claro) — espelho fiel do padrão aprovado do Roteiro; tarefas antigas abrem/editam/salvam com a contagem REAL e os campos legados preservados, SEM migração; portal intocado (fallback 'Cronograma'). (2) COLAGEM UNIVERSAL na causa-raiz: pipeline determinístico no document (captura) para TODOS os campos editáveis (Ctrl+V/Shift+Insert via clipboard do Electron com preventDefault antes — nunca cola em dobro; campos simples SEMPRE texto puro; RTE mantém COLAR→SANITIZAR→NORMALIZAR→INSERIR→PROJEÇÃO também no fallback IPC text/html; campos numéricos validam sem correção silenciosa; readOnly/disabled intocáveis no choke-point único) + MENU DE CONTEXTO NATIVO (roles Desfazer/Refazer/Recortar/Copiar/Colar/Selecionar tudo, só em params.isEditable, habilitação pelos editFlags reais). CSP/sanitização/contextIsolation INALTERADOS; nenhum conteúdo de clipboard em logs. Sessão automática (1.0.221) e alertas residuais (1.0.222) INTACTOS; Roteiro/Vídeos/Cards/Copywriting/updater/Worker/Functions/Rules/Android INTOCADOS."; echo "distribuicao: CANDIDATA — publicação no Latest ocorre no workflow desktop-release-f355d.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
