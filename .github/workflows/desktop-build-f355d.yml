          # F3.5.5D nos BYTES do pacote (renderer + menu nativo compilado + wiring + IPC):
          grep -q 'id="fCronQty"' asar-x/src/renderer/index.html
          grep -q 'Quantidade de temas' asar-x/src/renderer/index.html
