# Deploy das Firestore Rules (port do GitLab
# deploy_password_reset_firestore_rules_autonomous).
# PREPARADO — execucao SOMENTE manual. Exige confirm_deploy=DEPLOY.
# Baixa as rules de PRODUCAO (fonte da verdade), faz BACKUP (artifact),
# injeta o bloco de reset via script idempotente, e publica. Nunca sobrescreve
# sem backup. NAO roda em push.
name: "[manual] Firestore Rules Deploy"

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite DEPLOY para confirmar (qualquer outro valor aborta)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: "agenda-id-seven"
    steps:
      - name: Guard confirm_deploy
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "::error:: confirm_deploy != DEPLOY — abortando antes de qualquer deploy de rules."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mirror/gitlab-1.0.46

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auth gcloud
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: GOOGLE_APPLICATION_CREDENTIALS_JSON ausente."; exit 1; }
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null
          gcloud services enable firebaserules.googleapis.com --project "$GCP_PROJECT" >/dev/null 2>&1 || true

      - name: Baixar rules de PROD + backup
        run: |
          set -e
          TOKEN="$(gcloud auth print-access-token)"
          REL=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/projects/${GCP_PROJECT}/releases/cloud.firestore")
          RULESET=$(echo "$REL" | jq -r '.rulesetName')
          [ -n "$RULESET" ] && [ "$RULESET" != "null" ] || { echo "::error:: rulesetName nao encontrado."; exit 1; }
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/${RULESET}" | jq -r '.source.files[0].content' > firestore.rules.from-prod
          cp firestore.rules.from-prod "firestore.rules.backup-pre-${GITHUB_SHA}"
          echo "Backup: firestore.rules.backup-pre-${GITHUB_SHA} ($(wc -l < firestore.rules.from-prod) linhas)"

      - name: Patch idempotente (injeta blocos de reset)
        run: |
          set -e
          node scripts/patch-firestore-password-reset-rules.mjs firestore.rules.from-prod firestore.rules.generated
          echo "===== diff ====="; diff -u firestore.rules.from-prod firestore.rules.generated || true
          [ -s firestore.rules.generated ] || { echo "::error:: generated vazio."; exit 1; }

      - name: Deploy rules
        run: |
          set -e
          printf '%s\n' '{"firestore":{"rules":"firestore.rules.generated"}}' > firebase.ci.json
          npm install -g firebase-tools >/dev/null 2>&1
          firebase deploy --only firestore:rules --project "$GCP_PROJECT" --config firebase.ci.json --non-interactive
          curl -fsSL -H "Authorization: Bearer $(gcloud auth print-access-token)" "https://firebaserules.googleapis.com/v1/projects/${GCP_PROJECT}/releases/cloud.firestore" | jq '{rulesetName, updateTime}'

      - name: Upload backup (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-backup-${{ github.sha }}
          path: |
            firestore.rules.from-prod
            firestore.rules.generated
            firestore.rules.backup-pre-*
          if-no-files-found: warn
          retention-days: 90

      - name: Limpeza SA
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" 2>/dev/null || true
