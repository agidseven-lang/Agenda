# =====================================================================
# F3.5.5D — Publicacao da Desktop 1.0.223 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.223 (F3.5.5D — Cronogramas Personalizados e Colagem Universal:
# o Briefing do Cronograma troca Semanal/Quinzenal/Mensal pelo seletor QUANTIDADE
# DE TEMAS [-][N][+] com validacao e confirmacao de reducao, compat legado total;
# colagem UNIVERSAL determinística em todos os campos editaveis + menu de contexto
# NATIVO com Colar; sanitizacao/CSP/contextIsolation intocados).
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.5D 31114763013 (gated, verde
# nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os
# MESMOS bytes. TUDO PINADO: run id, digests dos artifacts, 5 hashes SHA-256, tag
# v1.0.223 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# Rollback tecnico: v1.0.222. Rollback fisico imediato: v1.0.218 (baseline FISICAMENTE aprovada).
# Rollback adicional: v1.0.216.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.5D Desktop Release — 1.0.223 no canal do updater (Cronogramas Personalizados + Colagem Universal; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f355d-custom-cronograma-quantity-universal-paste-1.0.223"
    paths:
      - ".github/workflows/desktop-release-f355d.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.5D; run de build 31114763013 verde nos 2 jobs) ──
      RUN_ID: "31114763013"
      STABLE_SHA: "4469faae29042de8bd6d0eae21e89e86a7dac0c7"
      TEST_BRANCH: "desktop/f355d-custom-cronograma-quantity-universal-paste-1.0.223"
      BASE_222_SHA: "1eac3672ab07a56bfd5d692e9ecb24688ac2ee83"
      BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
      BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
      BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
      BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
      TAG: "v1.0.223"
      TITLE: "Agenda ID Seven Desktop 1.0.223 — Cronogramas Personalizados e Colagem Universal"
      ART_INST: "agenda-id-seven-desktop-1.0.223-installer"
      ART_INST_DIGEST: "sha256:02bc92bdc070b29d13ad15da64d3bfacf39368562562d9cd51171dbae8e2dfb6"
      ART_META: "agenda-id-seven-desktop-1.0.223-updatemeta"
      ART_META_DIGEST: "sha256:c76b52b9a2033681c688fa79ae5f68b27f1d4a492f62f512dc349a448ce23dc7"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.223-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.223-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.223-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "f1e481eb036c191fe377efc0626e1a5155f2a3964a43e4761be068601b1a9793"
      EXP_MSI: "46ad86f1ac883da944640ff83093a70c28dbf29cbc6199493557235b219d13eb"
      EXP_LY: "e7233289d6795eb458190e9baa7eee3b7e362a93e92050807b77bec1548be12a"
      EXP_BM: "cc18b31864adc468a5789ddbdeca8a9b67c71752687a2f9176379ca4ee5bb587"
      EXP_SBOM: "767dc0fd4a77599be87d9ff9e48c0f567cd2e03682a7a0b9cbbb7b68b1d85924"
      PREV_LATEST_TAG: "v1.0.222"
      PRES_221_TAG: "v1.0.221"
      PRES_220_TAG: "v1.0.220"
      PROD_ROLLBACK_TAG: "v1.0.218"
      PROD_ROLLBACK2_TAG: "v1.0.216"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.5D)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.5D completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f355d\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP22="$(gh api "repos/$REPO/compare/$BASE_222_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP22" = "ahead" ] || [ "$CMP22" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da base 1.0.222 ($CMP22)"; exit 1; }
          CMP21="$(gh api "repos/$REPO/compare/$BASE_221_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP21" = "ahead" ] || [ "$CMP21" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.221 ($CMP21)"; exit 1; }
          CMP20="$(gh api "repos/$REPO/compare/$BASE_220_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP20" = "ahead" ] || [ "$CMP20" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.220 ($CMP20)"; exit 1; }
          CMP0="$(gh api "repos/$REPO/compare/$BASE_218_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP0" = "ahead" ] || [ "$CMP0" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline 1.0.218 ($CMP0)"; exit 1; }
          CMP1="$(gh api "repos/$REPO/compare/$BASE_216_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP1" = "ahead" ] || [ "$CMP1" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.216 ($CMP1)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.222/1.0.221/1.0.220/1.0.218/1.0.216 na linhagem"

      - name: "Gate 3 — release v1.0.223 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.223" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.223"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.223" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.223"; exit 1; }
          grep -q "1.0.223-f355d-custom-cronograma-quantity-universal-paste" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.223/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.223 — Cronogramas Personalizados e Colagem Universal

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.222 (F3.5.5D)

          1) QUANTIDADE PERSONALIZADA DE TEMAS NO CRONOGRAMA
          O Briefing do Cronograma não oferece mais as opções fixas de Periodicidade
          (Semanal/Quinzenal/Mensal). No lugar, o seletor QUANTIDADE DE TEMAS
          [−] [ N ] [+] — o mesmo componente já aprovado no Roteiro:
          - qualquer inteiro ≥ 1 (digitar, apagar, selecionar, substituir, colar,
            setas do teclado e Tab funcionam);
          - zero/negativo/decimal/letras mostram a mensagem clara "Informe uma
            quantidade inteira igual ou superior a 1." — nunca correção silenciosa;
          - campo vazio NÃO deixa avançar a etapa;
          - AUMENTAR preserva integralmente os conteúdos já preenchidos (novos
            blocos nascem vazios; nada é reordenado nem apagado);
          - DIMINUIR com conteúdo preenchido além do corte exige CONFIRMAÇÃO
            ("Cancelar" mantém tudo; "Remover e reduzir" corta SÓ os excedentes);
          - teto TÉCNICO alto (500, limite do documento) com aviso claro ao exceder.
          CRONOGRAMAS ANTIGOS (semanal/quinzenal/mensal) continuam abrindo,
          exibindo, editando, salvando, aparecendo na Revisão/Central de Detalhes/
          portal e funcionando com aprovação e "Aprovar tudo" — a contagem passa a
          ser a REAL do conteúdo, os campos legados são preservados e NENHUMA
          migração/reescrita acontece ao abrir. O portal do cliente é INTOCADO.

          2) COLAGEM UNIVERSAL + MENU DE CONTEXTO
          Todo campo realmente editável do app agora aceita colagem:
          - Ctrl+V e Shift+Insert funcionam de forma DETERMINÍSTICA (clipboard do
            Electron via IPC — não dependem mais do atalho nativo) em títulos,
            informações, descrições, briefings, temas, legendas, observações,
            campos do Cronograma, Roteiro, Programação de Posts/Cards, Edição de
            Vídeos, Agenda, modais e accordions;
          - botão direito em campo editável abre o MENU NATIVO profissional:
            Desfazer / Refazer / Recortar / Copiar / Colar / Selecionar tudo
            (ações indisponíveis aparecem desabilitadas; nada aparece sobre
            botões, cards ou campos somente leitura);
          - campos simples recebem SEMPRE texto puro (HTML nunca entra; acentos,
            emojis e quebras de linha preservados; colar substitui a seleção e
            mantém o cursor no lugar certo);
          - o EDITOR RICO de Tema/Legenda mantém o pipeline COLAR → SANITIZAR →
            NORMALIZAR → INSERIR → PROJEÇÃO também no novo caminho determinístico:
            Word/Google Docs colam limpos (negrito/itálico/listas/recuo ficam;
            mso-*/classes/fontes caem) e conteúdo malicioso (script/iframe/
            onerror/javascript:) continua NEUTRALIZADO — o sanitizador NÃO foi
            enfraquecido;
          - campos numéricos de quantidade aceitam colar números com validação
            visível (letras/decimais/negativos acusam a mensagem — nunca viram
            outro valor em silêncio);
          - campos readOnly/desabilitados são INTOCÁVEIS (nem atalho, nem menu).
          Segurança preservada: CSP inalterada, contextIsolation inalterado,
          nenhum conteúdo de clipboard vai a logs/telemetria.

          O QUE NÃO MUDA (segurança e fluxos preservados):
          - restauração automática de sessão da 1.0.221 INTACTA;
          - correção de alertas residuais da 1.0.222 INTACTA (slaReminder
            congelado byte a byte);
          - alertas vermelhos/amarelos/laranja, Monitor SLA, Acompanhamento
            Inteligente, check-ins, notificações e sons preservados;
          - Roteiro (quantidade personalizada), Edição de Vídeos, Programação de
            Posts/Cards, Copywriting, Agenda Premium, editor rico, copiar Tema/
            Legenda, observações internas, Central de Detalhes, criação/edição/
            revisão/movimentação, permissões, portal do cliente, Aprovar tudo,
            aprovação individual e edição do cliente preservados;
          - autostart, tray, single instance e updater INALTERADOS;
          - Worker, Functions, Firebase Rules e Android INTOCADOS.

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows
          (criar Cronograma com quantidade livre; aumentar/diminuir com confirmação;
          colar de navegador/WhatsApp/Word/Google Docs em vários formulários;
          botão direito → Colar; conferir um cronograma antigo). A publicação não
          é aprovação física. Em caso de problema: rollback técnico v1.0.222;
          rollback físico imediato v1.0.218; adicional v1.0.216; a 1.0.222, a
          1.0.221 e a 1.0.220 permanecem publicadas.

          Procedência: run de build F3.5.5D 31114763013 (success; --publish never;
          verify + Windows verdes: suíte da fase 88 — quantidade 36 + colagem 40 +
          menu nativo hermético — rodada TAMBÉM contra os bytes do app.asar; 27
          provas Electron REAIS com app empacotado, clipboard real e right-click
          real; todas as suítes herdadas 53+56+126+94+16+128+97+84+72+f355a+
          37+74+53+40+15+37; smoke RTE 91; provas herdadas 9+10+ciclos+32+20+15+25;
          paridade cruzada Desktop↔Worker) @ commit
          4469faae29042de8bd6d0eae21e89e86a7dac0c7 (branch
          desktop/f355d-custom-cronograma-quantity-universal-paste-1.0.223).
          Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.223 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.223; 1.0.222/1.0.221/1.0.220 preservadas; rollbacks 1.0.218/1.0.216 preservados)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_221_TAG" "$PRES_220_TAG" "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.223 no canal do updater (Latest); 1.0.222 rollback tecnico; 1.0.221/1.0.220 preservadas; 1.0.218 rollback fisico; 1.0.216 rollback adicional ====="
