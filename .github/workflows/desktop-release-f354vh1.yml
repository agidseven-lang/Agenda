# =====================================================================
# F3.5.4V-H1 — Publicacao da Desktop 1.0.213 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.213 (F3.5.4V-H1 — PERSISTENCIA/RESTAURACAO da sessao no autostart do Windows:
# corrige "abriu deslogado" ao ligar o PC). Boot com SPLASH neutro + maquina de estados AUTH_*;
# login so em NEGATIVA REAL (no_session/expired) ou escape manual; erro de rede MANTEM o splash
# (offline != logout); observabilidade auth.startup.* sanitizada. Delta vs 1.0.212: SO o renderer
# desktop/src/renderer/index.html. USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4V-H1
# 30816585436 (gated, verde nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e
# publica os MESMOS bytes. TUDO PINADO: run id, digests dos artifacts, 5 hashes SHA-256, tag
# v1.0.213 no head EXATO da branch. 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS,
# VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# Rollback imediato: v1.0.211 (baseline fisicamente aprovada). Rollback adicional: v1.0.208. Base de
# codigo: v1.0.212. v1.0.210/v1.0.209 permanecem PRESERVADAS no historico. A publicacao NAO significa
# aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.4V-H1 Desktop Release — 1.0.213 no canal do updater (persistencia da sessao; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354v-h1-session-persistence-startup-1.0.213"
    paths:
      - ".github/workflows/desktop-release-f354vh1.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4V-H1; run de build 30816585436 verde nos 2 jobs) ──
      RUN_ID: "30816585436"
      STABLE_SHA: "e626d36921e269e28b74494ff51afb9c77f8d94d"
      TEST_BRANCH: "desktop/f354v-h1-session-persistence-startup-1.0.213"
      BASE_212_SHA: "3145a1db5579f7b5977112cefbde796a0e27bd34"
      BASE_211_SHA: "fe303b8ab9546ff00d0459b98e0e9eaab20dd8e2"
      BASE_208_SHA: "db8cdca1d92cd42f3ec98aced39e6a418c4d478e"
      TAG: "v1.0.213"
      TITLE: "Agenda ID Seven Desktop 1.0.213 — Persistência de Sessão no Windows"
      ART_INST: "agenda-id-seven-desktop-1.0.213-installer"
      ART_INST_DIGEST: "sha256:ba5e26ea3907e5426129fca55fd9389437854e54cc17a0eb44ec66a588a045d1"
      ART_META: "agenda-id-seven-desktop-1.0.213-updatemeta"
      ART_META_DIGEST: "sha256:42d1c76c2d4918d9f1d6b66c61b8a3e6824f3c802bce3090e84a4e9b8047ede9"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.213-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.213-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.213-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "d0c4b4bf1b8d3d18174ca6a38ec46e40a9d73ae1b44ac73629b932cb691f44ab"
      EXP_MSI: "2530d677ec4450e075ccd30606a16f5551c6b9fbf7c69368276c4dfee5929d12"
      EXP_LY: "c730a764e4b4887a8a655f6354a89134b177c7fa15e1117598cecc9b4258ae38"
      EXP_BM: "943fbf406e70faa7397b4d54cd47e4815607d62999134bac96c55e0abe77e249"
      EXP_SBOM: "7bca65a271af5966afe44115607dd8ce8162b30accd7ca8645cd7e9051215209"
      PROD_PREV_TAG: "v1.0.212"
      PROD_ROLLBACK_TAG: "v1.0.211"
      PROD_ROLLBACK2_TAG: "v1.0.208"
      PROD_HIST_TAG: "v1.0.210"
      PROD_HIST2_TAG: "v1.0.209"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4V-H1)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4V-H1 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354vh1\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_212_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.212 ($CMP2)"; exit 1; }
          CMP3="$(gh api "repos/$REPO/compare/$BASE_211_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP3" = "ahead" ] || [ "$CMP3" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.211 ($CMP3)"; exit 1; }
          CMP4="$(gh api "repos/$REPO/compare/$BASE_208_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP4" = "ahead" ] || [ "$CMP4" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.208 ($CMP4)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.212/1.0.211/1.0.208 na linhagem"

      - name: "Gate 3 — release v1.0.213 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.213" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.213"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.213" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.213"; exit 1; }
          grep -q "1.0.213-session-persistence-startup" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.213/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.213 — Persistência de Sessão no Windows

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.212 (F3.5.4V-H1 — persistência/restauração da sessão no autostart)
          Corrige o defeito em que o app, ao abrir automaticamente junto com o Windows (autostart),
          às vezes aparecia DESLOGADO mesmo havendo uma sessão válida — obrigando a refazer o login.

          - No arranque, em vez de já pintar a tela de login, o app mostra um SPLASH neutro
            ("Restaurando sessão…") enquanto confirma a sessão com o servidor.
          - A tela de login só aparece quando há uma NEGATIVA REAL (sessão inexistente ou expirada/
            revogada) — ou se você escolher "Entrar manualmente".
          - Falta de internet no arranque NÃO desloga: o app mantém o splash e tenta reconectar
            automaticamente (com espera crescente). Depois de algumas tentativas, oferece um atalho
            "Entrar manualmente" — sem apagar a sessão guardada.
          - Logout explícito e sessões expiradas/revogadas continuam levando ao login normalmente.

          PRESERVAÇÃO (provado pelos gates do app.asar no build)
          - Único arquivo alterado vs 1.0.212: o renderer do formulário (index.html). Processo
            principal, núcleo de autenticação (token só no main; sessão em disco 0600; instância
            única; mesmo userData), persistência, notificações comuns premium e horário, alertas
            amarelo/vermelho, fila central, check-in, decisões, T-30/T-10, prazos, deduplicação,
            destinatários, recibos, sino, Minhas Prioridades, Monitor de SLA, watchdog, tray,
            atualizador, Card Premium, Cronograma, a QUANTIDADE PERSONALIZADA de vídeos (1.0.212),
            backend, Firebase Rules/Functions/Worker e Android: INTOCADOS (byte-idênticos à 1.0.212).
          - Segurança: nenhuma senha/token gravado em texto puro/localStorage/JSON/logs; sem login
            automático com credenciais; revogação respeitada; observabilidade auth.startup.*
            sanitizada (sem e-mail/nome/UID cru/token).
          - Rollback imediato: 1.0.211 (baseline fisicamente aprovada). Base de código: 1.0.212.
            Rollback adicional: 1.0.208. As versões 1.0.210 e 1.0.209 permanecem preservadas no histórico.

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows (configurar o
          início automático com o Windows, reiniciar o PC — inclusive com Fast Startup e em vários
          reinícios — e confirmar que o app abre já logado, sem piscar a tela de login; testar também
          logout explícito, sessão expirada e arranque sem internet). A publicação apenas
          disponibiliza a atualização pelo mecanismo oficial; não constitui aprovação física.

          Procedência: run de build F3.5.4V-H1 30816585436 (success; --publish never; jobs de
          verificação + Windows verdes, incluindo o Gate F3.5.4V-H1 EMPACOTADO no app.asar — splash +
          máquina de estados AUTH_*, boot sem renderLogin incondicional, auth-core offline!=logout,
          instância única, 1.0.212 preservada e stack de notificação/SLA congelada byte vs 1.0.212)
          @ commit e626d36921e269e28b74494ff51afb9c77f8d94d (branch desktop/f354v-h1-session-persistence-startup-1.0.213).
          Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.213 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.213; 1.0.212 base + 1.0.211 rollback + 1.0.210/209 preservadas + 1.0.208 rollback adicional)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.213 no canal do updater (Latest); 1.0.212 base; 1.0.211 rollback imediato; 1.0.210/1.0.209 preservadas; 1.0.208 rollback adicional ====="
