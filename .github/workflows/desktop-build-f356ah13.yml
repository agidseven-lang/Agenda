# F3.5.6A-H13 — Desktop 1.0.239 (TIMELINE honesta/exact-match + PRE-ENVIO da 2a rodada + label wp-first).
# 1.0.238 corrigiu o ESTADO de aprovacao final (3 leitores guardados por flowSentToClientSignal). Mas apos
# "Salvar e reenviar ao cliente" SEM confirmar (fase captions_preparation) restavam 4 defeitos de HONESTIDADE:
#  (A) marcos PENDENTES exibiam data/autor (11:35/ator) — _tlEventAt casava por SUBSTRING
#      ('enviado_cliente' ⊂ 'reenviado_cliente'; 'final' ⊂ 'final_review'/label "versao FINAL") e taskTimeline
#      anexava at/by independente de done; (B) "Enviado ao cliente" (THEMES) passava a mostrar 11:35 (evento
#      mais recente) em vez do 1o envio (08:38); (C) "Fluxo do cliente" virava "Em producao"
#      (espelho clientFlowStatus='producao'); (D) WRITER: "Salvar e reenviar" gravava history 'reenviado_cliente'
#      ANTES da confirmacao (afirmacao de ENVIO falsa).
# CORRECAO 1.0.239 (RENDERER-only, index.html): (1) _tlEventAt casa por type/kind/channel EXATO (allowlist;
#  sem substring/label/to); (2) taskTimeline SO carimba marco done + usa approvalRounds sentAt canonico
#  (ar_themes_r* × ar_captions_r* separados); (3) clientFlowDisplayLabel/clientFacingStatusView workflowPhase-first
#  (captions_preparation -> "Aguardando envio final"); (4) saveProduction(resend) NAO grava 'reenviado_cliente'
#  (Grupo A/PREPARACAO preservado: cronStatus/clientApprovalPhase/finalApprovalRequired p/ a previa da 2a rodada);
#  (5) btnConfirmSend grava 'reenviado_cliente' 1× SO no sucesso e SO na rodada final (Grupo B/AFIRMACAO DE ENVIO).
# MUDANCA de producao = SOMENTE desktop/src/renderer/index.html. build GATED, --publish never. Publicacao no
# Latest so no desktop-release-f356ah13.yml (mesmos bytes). Base tecnica 1.0.238 (063b6c0). BASELINE FISICA 1.0.228.
# ROLLBACK IMEDIATO 1.0.228. slaRules.js byte-identico; Worker V64.61 INALTERADO.
name: "[push/manual] F3.5.6A-H13 — Desktop 1.0.239 (timeline honesta + pre-envio) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah13-timeline-preenvio-1.0.239"]
    paths-ignore: [".github/workflows/desktop-release-f356ah13.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah13-timeline-preenvio-1.0.239"
  BASE_238_SHA: "063b6c0f93c5814a256d8a608fc358733b40d616"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.238 base técnica e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_238_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.239 (package + lock x2 + marcador H13 + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.239'){console.error('versão',p.version);process.exit(1);} for(const m of ['timeline-honest-preenvio','final-state-premature-fix','team-session-recovery']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.239"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES H13 (timeline exact-match + carimbo canônico + label wp-first + writers) no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # (Correção 3) _tlEventAt casa por igualdade EXATA (allowlist), não por substring
          grep -qF "return !!v && keys.indexOf(v)>=0;" "$S"
          if grep -qE "keys\.some\(function\(k\)\{return[^\n]*indexOf\(k\)" "$S"; then echo "::error::_tlEventAt ainda casa por substring"; exit 1; fi
          # (Correção 2+4) taskTimeline usa approvalRounds sentAt canônico separado (THEMES × FINAL)
          grep -qF "if(m.key==='enviado_cliente'){ const r=wfLatestRound(t,'themes');" "$S"
          grep -qF "else if(m.key==='enviado_final'){ const r=wfLatestRound(t,'captions');" "$S"
          # (Correção 5) label do fluxo do cliente priorizando workflowPhase (captions_preparation)
          grep -qF "if(wp==='captions_preparation') return {key:'aguardando_envio_final',label:'Aguardando envio final'" "$S"
          grep -qF "if(_wp==='captions_preparation')return {key:'legendas',label:'A equipe está finalizando as artes'" "$S"
          # (Correção 6) btnConfirmSend grava o evento de envio final (rodada final)
          grep -qF "type:'reenviado_cliente',label:'Reenviado ao cliente (versão FINAL)'" "$S"
          # (Correção 1) saveProduction NÃO grava mais o WRITE 'reenviado_cliente' (comentário explicativo é OK)
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function saveProduction(');let d=0,e=-1;for(let k=s.indexOf('{',i);k<s.length;k++){const c=s[k];if(c==='{')d++;else if(c==='}'){d--;if(!d){e=k+1;break;}}}const b=s.slice(i,e);if(/arrayUnion\(\{[^}]*reenviado_cliente/.test(b)||/history\s*[:=][^\n]*reenviado_cliente/.test(b)){console.error('saveProduction ainda GRAVA reenviado_cliente antes da confirmação');process.exit(1);}if(!b.includes('ready_for_final_client_review')||!b.includes('finalApprovalRequired')){console.error('Grupo A (preparação) da 2ª rodada foi removido por engano');process.exit(1);}console.log('H13 saveProduction OK: sem WRITE prematuro; Grupo A preservado');"
          echo "MARCADORES H13: VERIFIED."
      - name: "Gate MARCADORES herdados H12 (3 leitores guardados) + H10 (team session) + H8 (diag durável + timeline honesta 1º envio)"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # H12 (done-gating do marco final + helper + clientFacing + clientCol/writer intocados + portão canônico)
          grep -qF "const resent=flowSentToClientSignal(t)||finalOk;" "$S"
          grep -qF "function clientFlowDisplayLabel(t)" "$S"
          grep -qF "if(CLIENT_COLS.some(c=>c.key===v)){" "$S"
          grep -qF "newStatus==='entregue'||newStatus==='concluido')patch.clientFlowStatus='reenviado';" "$S"
          grep -qF "if(wp==='captions_waiting_client')return true;" "$S"
          # H8 durável + timeline honesta do 1º envio
          grep -qF "__csDiagPersist(ctx&&ctx.id)" "$S"
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$S"
          # H10 team session
          grep -qF "root.id='tsAuthRoot'; root.className='ts-auth-back';" "$S"
          grep -qF "if(ok&&teamJwtValid()){ finish(true); return; }" "$S"
          # H5/H3
          grep -q 'id="btnConfirmSend" title=' "$S"
          grep -q 'legacyCursor' dist/main/workflowNotifier.js
          echo "MARCADORES herdados H12/H10/H8/H5/H3: VERIFIED."
      - name: "Gate SUÍTES H13 (nova) + H12 + H10 + H8 + PIN F3.5.6A + linhagem + golden master F3.4.4 + H2 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356ah13-timeline-preenvio.test.mjs
          node scripts/f356ah12-final-state-premature.test.mjs
          node scripts/f356ah10-team-session-recovery.test.mjs
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.239 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.239 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.239 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.239 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.238 (063b6c0); src/main INALTERADO; slaRules byte-idêntico; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_238_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.238 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah13\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f356ah13-timeline-preenvio\.test\.mjs$|desktop/scripts/(f354p-sla-decision-actions|f354vh1-session-persistence|f354wh2-immediate-notification-sound|f355a-integration|f355ah1-internal-notes|f355b-agenda-premium|f355c-script-quantity-rich-editor|f355d-cron-quantity-universal-paste|f355e-retire-modules-premium-notifications|f355eh2-reference-notification|f355eh3-global-notification-visibility|f355eh4-grouped-notification-handoff|f356a-workflow-orchestration|f356ah2-client-approvals|f356ah3-single-source-sent-state|f356ah8-durable-diagnostic|f356ah8-honest-timeline|f356ah10-team-session-recovery|f356ah12-final-state-premature)\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H13: $BAD"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_238_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H13 não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_238_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H13 altera SOMENTE o renderer index.html"; exit 1; }
          git diff --quiet "$BASE_238_SHA"..HEAD -- desktop/src/main/slaRules.js || { echo "::error::slaRules.js alterado (paridade golden master exige byte-idêntico)"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H13: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.238; slaRules INALTERADO; infra 1.0.228 congelada)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão 1.0.239 + marcadores H13 + H12/H10/H8 preservados no app.asar"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.239') process.exit(1);"
          I=asar-x/src/renderer/index.html
          # H13
          grep -qF "return !!v && keys.indexOf(v)>=0;" "$I"
          grep -qF "if(m.key==='enviado_cliente'){ const r=wfLatestRound(t,'themes');" "$I"
          grep -qF "else if(m.key==='enviado_final'){ const r=wfLatestRound(t,'captions');" "$I"
          grep -qF "if(wp==='captions_preparation') return {key:'aguardando_envio_final',label:'Aguardando envio final'" "$I"
          grep -qF "if(_wp==='captions_preparation')return {key:'legendas',label:'A equipe está finalizando as artes'" "$I"
          grep -qF "type:'reenviado_cliente',label:'Reenviado ao cliente (versão FINAL)'" "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');const i=s.indexOf('function saveProduction(');let d=0,e=-1;for(let k=s.indexOf('{',i);k<s.length;k++){const c=s[k];if(c==='{')d++;else if(c==='}'){d--;if(!d){e=k+1;break;}}}const b=s.slice(i,e);if(/arrayUnion\(\{[^}]*reenviado_cliente/.test(b)){console.error('pacote: saveProduction grava reenviado_cliente');process.exit(1);}console.log('pacote saveProduction OK');"
          # herdados
          grep -qF "const resent=flowSentToClientSignal(t)||finalOk;" "$I"
          grep -qF "function clientFlowDisplayLabel(t)" "$I"
          grep -qF "const sent=flowCanonicalSentSignal(t)||(cf!=='afazer');" "$I"
          grep -qF "__csDiagPersist(ctx&&ctx.id)" "$I"
          grep -qF "root.id='tsAuthRoot'; root.className='ts-auth-back';" "$I"
          grep -q 'function flowCanonicalSentSignal' asar-x/dist/main/slaRules.js
          grep -q 'legacyCursor' asar-x/dist/main/workflowNotifier.js
          F356AH13_SRC=asar-x/src/renderer/index.html F356AH13_PKG=asar-x/package.json node scripts/f356ah13-timeline-preenvio.test.mjs
          F356AH12_SRC=asar-x/src/renderer/index.html F356AH12_PKG=asar-x/package.json node scripts/f356ah12-final-state-premature.test.mjs
          F356AH10_SRC=asar-x/src/renderer/index.html F356AH10_PKG=asar-x/package.json node scripts/f356ah10-team-session-recovery.test.mjs
          echo "GATE F3.5.6A-H13 EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.239"; echo "rotulo      : 1.0.239-f356ah13-timeline-honest-preenvio (timeline honesta + pre-envio da 2a rodada — pelo updater interno)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.238 (063b6c0). BASELINE FISICA 1.0.228 (3f0d0af1). ROLLBACK imediato 1.0.228."; echo "origem      : F3.5.6A-H13 — apos 'Salvar e reenviar' SEM confirmar (captions_preparation): timeline honesta (marco pendente sem carimbo; exact-match sem substring; THEMES 08:38 preservado), 'Fluxo do cliente'='Aguardando envio final' (wp-first) e WRITER 'reenviado_cliente' so na confirmacao real. MUDANCA: SOMENTE index.html. slaRules.js e Worker V64.61 INALTERADOS."; echo "distribuicao: pelo updater interno; publicacao no Latest ocorre no workflow desktop-release-f356ah13.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.239-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.239-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
