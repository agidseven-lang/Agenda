# SLA, taskIdle/Store, orquestrador, preloads, slareminder.html, sons, priorityEngine,
# editContextMenu (F3.5.5D!), worker, functions e android CONGELADOS byte a byte vs 1.0.223 —
# regra máxima do owner: ZERO regressão no aprovado.
name: "[push/manual] F3.5.5E — Desktop 1.0.224 (Estrutura Operacional + Notificações Premium) — Desktop Build"
"on":
  push:
    branches: ["desktop/f355e-retire-legacy-modules-premium-notifications-1.0.224"]
    paths-ignore: [".github/workflows/desktop-release-f355e.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
