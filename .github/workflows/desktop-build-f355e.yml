# F3.5.5E — Desktop 1.0.224 (Estrutura Operacional e Notificações Premium)
# build GATED, --publish never. Publicação SÓ no desktop-release-f355e.yml (mesmos bytes).
# Base de código 1.0.223 @ 217ed062 (Latest publicada e FISICAMENTE aprovada); rollback imediato
# 1.0.223; adicional 1.0.222; físico seguro 1.0.218. Delta: RETIRADA DEFINITIVA de Copywriting/
# Roteiro/Programação de Posts por IDENTIFICADORES CANÔNICOS (flag descontinuado padrão 71C7 +
# retiredCutoffFilter na ingestão espelhando o pwaCutoffFilter aprovado + gates nos produtores
# main notifEvents/deliver/taskGate/check-in/Acompanhamento + deep-link seguro; NADA apagado) +
