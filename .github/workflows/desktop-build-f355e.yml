          git diff --name-only "$BASE_223_SHA"..HEAD > /tmp/delta.txt; cat /tmp/delta.txt
          # allowlist F3.5.5E: renderers das 2 superfícies (retirada + card premium) + produtor canônico
          # notifEvents.js + main.ts (taskGate retirado→terminal + cinto no deliver + tipo NotifPayload) +
