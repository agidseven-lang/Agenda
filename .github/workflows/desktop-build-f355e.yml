          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f355e\.yml$|desktop/src/renderer/index\.html$|desktop/src/renderer/bgnotify\.html$|desktop/src/main/main\.ts$|desktop/src/main/notifEvents\.js$|desktop/src/main/taskIdleScheduler\.ts$|desktop/src/main/executionTracking\.js$|desktop/package(-lock)?\.json$|desktop/scripts/f355e-|desktop/scripts/f355d-cron-quantity-universal-paste\.test\.mjs$|desktop/scripts/f354l-sla-central-persistent-reminders\.test\.mjs$|desktop/scripts/f354p-sla-decision-actions\.test\.mjs$|desktop/scripts/f354u-premium-common-notifications\.test\.mjs$|desktop/scripts/f354u-h1-notification-hotfix\.test\.mjs$|desktop/scripts/f354vh1-session-persistence\.test\.mjs$|desktop/scripts/f354wh2-immediate-notification-sound\.test\.mjs$|desktop/scripts/f355a-integration\.test\.mjs$|desktop/scripts/f355ah1-internal-notes\.test\.mjs$|desktop/scripts/f355b-agenda-premium\.test\.mjs$|desktop/scripts/f355c-script-quantity-rich-editor\.test\.mjs$|docs/f355e(-qa)?/)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist: $BAD"; exit 1; }
