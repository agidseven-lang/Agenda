# F3.5.6A-H6B — Desktop 1.0.235 (VERSÃO DE DIAGNÓSTICO OPERACIONAL, distribuída pelo updater interno).
# A 1.0.234 (rodando fisicamente) responde ao botão "Confirmar envio ao cliente" (H5 OK) mas devolve
# "Não foi possível confirmar o envio ao cliente" — falha SERVER-SIDE (wfConfirmClientSend→wfTeamAction→
# fetch→Worker V64.61). A 1.0.235 NÃO é a correção definitiva: instrumenta o renderer com diagnóstico
# SANITIZADO (stage/requestStarted/responseReceived/httpStatus/workerCode/hasSession/hasJwt/hasTask/
# hasToken/appVersion), vinculado DINAMICAMENTE ao taskId da tentativa, + botão "Copiar diagnóstico da
# confirmação" (aparece só após uma tentativa). NUNCA registra token/JWT/conteúdo. Comportamento do envio
# IDÊNTICO à 1.0.234 (puramente aditivo). MUDANÇA de produção = SOMENTE desktop/src/renderer/index.html.
# build GATED, --publish never. Publicação no Latest só no desktop-release-f356ah6b.yml (mesmos bytes).
# Base técnica 1.0.234 (3285a45). BASELINE FÍSICA 1.0.228. ROLLBACK IMEDIATO 1.0.228.
name: "[push/manual] F3.5.6A-H6B — Desktop 1.0.235 (diagnóstico da confirmação pelo updater) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah6b-confirm-send-diagnostics-1.0.235"]
    paths-ignore: [".github/workflows/desktop-release-f356ah6b.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah6b-confirm-send-diagnostics-1.0.235"
  BASE_234_SHA: "3285a45ff40c4bcfb1b28c53819455d515af912a"
  BASE_233_SHA: "b176e41c8be801f7d5d63fc8d2a9b9be42c643f3"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.234 base técnica e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_234_SHA" "$BASE_233_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.235 (package + lock x2 + marcador confirm-send-diagnostics + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.235'){console.error('versão',p.version);process.exit(1);} for(const m of ['confirm-send-diagnostics','DIAGNOSTICO','confirm-send-button','single-source-real-path','single-source-sent-state']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.235"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES DIAGNÓSTICOS H6B (instrumento sanitizado + botão condicional no renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -q 'function __csDiagInit' "$S"
          grep -q 'function __csDiagSet' "$S"
          grep -q 'id="btnCopyConfirmDiag" style="display:none"' "$S"
          grep -q 'Copiar diagnóstico da confirmação' "$S"
          grep -qF "_cd.style.display=''" "$S"
          for k in "stage:'request_started'" "stage:'http_error'" "stage:'http_401'" "stage:'network_error'" "stage:'success'" "httpStatus" "workerCode" "hasSession" "hasJwt" "hasTask" "hasToken" "appVersion:"; do
            grep -qF "$k" "$S" || { echo "::error::marcador diagnóstico ausente: $k"; exit 1; }
          done
          # SANITIZAÇÃO: o objeto do diag NÃO deve serializar token/JWT/conteúdo.
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function __csDiagInit(');const j=s.indexOf('}catch(_){}}',i);const body=s.slice(i,j);if(/(:\s*(jwt|token)\b)|clientReviewToken|shareToken|Authorization|wp_team_jwt/.test(body)){console.error('diag pode vazar dado sensível');process.exit(1);}console.log('diag sanitizado OK');"
          echo "MARCADORES DIAGNÓSTICOS H6B: VERIFIED."
      - name: "Gate MARCADORES H5 — botão Confirmar NASCE habilitado + handler ramifica + wfConfirmClientSend retorna (comportamento preservado)"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -q 'id="btnConfirmSend" title=' "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');if(/id=\"btnConfirmSend\" disabled/.test(s)){console.error('botão nasce disabled');process.exit(1);}"
          grep -q 'Envio confirmado ao cliente' "$S"
          grep -q 'Não foi possível confirmar o envio ao cliente' "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('async function wfConfirmClientSend(');const j=s.indexOf('async function ',i+10);const body=s.slice(i,j>0?j:s.length);if(!/return r;/.test(body)){console.error('wfConfirmClientSend não retorna');process.exit(1);}"
          grep -q 'function wfArmConfirmSend' "$S"
          echo "MARCADORES H5: VERIFIED."
      - name: "Gate MARCADORES herdados H4 (writer/reader) + H3 (THEMES_READY) + H2/H1 intactos"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$S"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('function flowCanonicalSentSignal(');const j=s.indexOf('}',s.indexOf('return ',i));if(!/if\(wp\)return false;/.test(s.slice(i,j+1))){console.error('renderer flowCanonicalSentSignal SEM guard');process.exit(1);}"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/main/slaRules.js','utf8');const i=s.indexOf('function flowCanonicalSentSignal(');const j=s.indexOf('}',s.indexOf('return ',i));if(!/if\(wp\)return false;/.test(s.slice(i,j+1))){console.error('slaRules flowCanonicalSentSignal SEM guard');process.exit(1);}"
          grep -q "THEMES_READY:'themes_ready'" "$S"
          grep -q 'Temas prontos — confirmar envio ao cliente' "$S"
          grep -q 'wfApprovalsBarHtml(list)+boardToolbar()' "$S"
          grep -q "getElementById('wfapRoot')" "$S"
          grep -q "id: (tid ? (tid + ':') : '') + String(k), lk: String(k)" src/main/workflowEvents.js
          grep -q 'legacyCursor' dist/main/workflowNotifier.js
          echo "MARCADORES herdados H4+H3+H2+H1: VERIFIED."
      - name: "Gate SUÍTE PIN F3.5.6A (renderer) + linhagem H4/H3 + golden master F3.4.4 + H2 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL no botão (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.235 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.235 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.235 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.235 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.234 (3285a45); src/main INALTERADO; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_234_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.234 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah6b\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f356ah5-red-main\.js$|desktop/scripts/(f354p-sla-decision-actions|f354vh1-session-persistence|f354wh2-immediate-notification-sound|f355a-integration|f355ah1-internal-notes|f355b-agenda-premium|f355c-script-quantity-rich-editor|f355d-cron-quantity-universal-paste|f355e-retire-modules-premium-notifications|f355eh2-reference-notification|f355eh3-global-notification-visibility|f355eh4-grouped-notification-handoff|f356a-workflow-orchestration|f356ah2-client-approvals|f356ah3-single-source-sent-state)\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H6B: $BAD"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_234_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H6B não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_234_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H6B altera SOMENTE o renderer index.html"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H6B: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.234; slaRules INALTERADO)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão 1.0.235 + marcadores diagnósticos + H5/H4/H3 preservados no app.asar"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.235') process.exit(1);"
          I=asar-x/src/renderer/index.html
          grep -q 'function __csDiagInit' "$I"
          grep -q 'id="btnCopyConfirmDiag" style="display:none"' "$I"
          grep -q 'Copiar diagnóstico da confirmação' "$I"
          grep -q 'id="btnConfirmSend" title=' "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');if(/id=\"btnConfirmSend\" disabled/.test(s)){console.error('pacote: botão nasce disabled');process.exit(1);}"
          grep -q 'Envio confirmado ao cliente' "$I"
          grep -q 'Não foi possível confirmar o envio ao cliente' "$I"
          node -e "const fs=require('fs');const s=fs.readFileSync('asar-x/src/renderer/index.html','utf8');const i=s.indexOf('async function wfConfirmClientSend(');const j=s.indexOf('async function ',i+10);if(!/return r;/.test(s.slice(i,j>0?j:s.length))){console.error('pacote: wfConfirmClientSend não retorna');process.exit(1);}"
          grep -q "data.clientFlowStatus='afazer';data.clientWorkflowStage='afazer';" "$I"
          grep -q "THEMES_READY:'themes_ready'" "$I"
          grep -q 'function flowCanonicalSentSignal' asar-x/dist/main/slaRules.js
          grep -q "id: (tid ? (tid + ':') : '') + String(k), lk: String(k)" asar-x/dist/main/workflowEvents.js
          grep -q 'legacyCursor' asar-x/dist/main/workflowNotifier.js
          F356AH4_SRC=asar-x/src/renderer/index.html F356AH4_SLARULES=asar-x/dist/main/slaRules.js node scripts/f356ah4-single-source-real-path.test.mjs
          F356AH3_SRC=asar-x/src/renderer/index.html F356AH3_SLARULES=asar-x/dist/main/slaRules.js F356AH3_PKG=asar-x/package.json node scripts/f356ah3-single-source-sent-state.test.mjs
          echo "GATE F3.5.6A-H6B EMPACOTADO: VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.235"; echo "rotulo      : 1.0.235-f356ah6b-confirm-send-diagnostics (VERSAO DE DIAGNOSTICO OPERACIONAL — pelo updater interno)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.234 (3285a45). BASELINE FISICA 1.0.228 (3f0d0af1). ROLLBACK imediato 1.0.228."; echo "origem      : F3.5.6A-H6B — 1.0.234 responde ao botao mas a confirmacao falha SERVER-SIDE. 1.0.235 instrumenta o renderer com diagnostico SANITIZADO (stage/httpStatus/workerCode/hasSession/hasJwt/hasTask/hasToken/appVersion) vinculado DINAMICAMENTE ao taskId; botao 'Copiar diagnostico da confirmacao' aparece so apos uma tentativa. NUNCA registra token/JWT/conteudo. NAO e a correcao definitiva. Comportamento do envio IDENTICO a 1.0.234 (aditivo). MUDANCA: SOMENTE index.html. slaRules.js e Worker V64.61 INALTERADOS."; echo "distribuicao: pelo updater interno; publicacao no Latest ocorre no workflow desktop-release-f356ah6b.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.235-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.235-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
