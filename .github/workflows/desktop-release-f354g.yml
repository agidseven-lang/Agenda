# =====================================================================
# F3.5.4G — Publicacao da Desktop 1.0.198 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.198 (F3.5.4G: banda SLA REMOVIDA de dentro do card [reprovada pelo owner];
# SLA AO VIVO reposicionado no MONITOR SUPERIOR com avatar 30px + nome + cronometro e contexto
# por aba do Designer; SINO do topo direito RESTAURADO [gate do tick por dados + painel com
# assinatura estrutural + guarda rect-zero]) no canal consumido pelo electron-updater da
# producao (provider github -> release Latest nao-prerelease com latest.yml): a 1.0.197/1.0.196
# instaladas passam a DETECTAR a 1.0.198 em Configuracoes -> Atualizacoes -> Verificar ->
# Baixar -> Instalar e reiniciar. NENHUM download manual pelo owner.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4G 30559767557 (gated, verde; --publish never):
# NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests dos
# artifacts, 5 hashes SHA-256, tag v1.0.198 no head EXATO da branch. 6 assets conforme a
# autorizacao F3.5.4G: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main e INTOCAVEL nesta fase): dispara no push DESTE arquivo
# (pipeline automatico autorizado pela F3.5.4G apos gates verdes) + workflow_dispatch p/ reexecucao.
# v1.0.197, v1.0.196, v1.0.195 e v1.0.194 permanecem PRESERVADAS (releases/tags intocadas).
# NAO builda, NAO altera codigo, NAO toca Firebase/Worker/Rules/Functions/Android.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois,
# exclusivamente pelo atualizador interno.
# =====================================================================
name: "F3.5.4G Desktop Release — 1.0.198 no canal do updater (SLA no monitor superior + sino; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354g-sla-top-monitor-bell-fix-1.0.198"
    paths:
      - ".github/workflows/desktop-release-f354g.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4G GO tecnico; run de build 30559767557 verde nos 2 jobs) ──
      RUN_ID: "30559767557"
      STABLE_SHA: "009f2c6ef2064dbdd18f5a2995669128df13a9ce"
      TEST_BRANCH: "desktop/f354g-sla-top-monitor-bell-fix-1.0.198"
      BASE_197_SHA: "14e9fb952b64e56d56528e63c6ac54499ab4b71d"
      TAG: "v1.0.198"
      TITLE: "Agenda ID Seven Desktop 1.0.198 — SLA no Monitor Superior e Correção do Sino"
      ART_INST: "agenda-id-seven-desktop-1.0.198-test-installer"
      ART_INST_DIGEST: "sha256:5c3c10a317a2d394a08a87b4f282ab284b7592b37ddb5d9677975c6bf0f51bb8"
      ART_META: "agenda-id-seven-desktop-1.0.198-test-updatemeta"
      ART_META_DIGEST: "sha256:4527859aa719f81ef015e6b8ae4d4a1855b4980f360bab4b14f6b9da4eee593b"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.198-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.198-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.198-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "c18f792c2b6b2a199958a9a58746f0ca52616ba12e7f2246505d68467876b8cb"
      EXP_MSI: "222a10e5aaa84dfdf85e3f4f52bd860a94b7d85f4b83a2b3937988e0e4fc1a39"
      EXP_LY: "b37c3867cc941c4ceae88ad5749c765682e4e671ee7925541e58ff3479587841"
      EXP_BM: "a554843d05c77cae53f37e7f6dd9b794132d3c330ec60a3988e3269abe9ac317"
      EXP_SBOM: "4384262d513818985d900498e6d0b447bf23dfb9953125f0974131378fe6a7fd"
      PROD_PREV_TAG: "v1.0.197"
      PROD_ROLLBACK_TAG: "v1.0.196"
      PROD_HIST_TAG: "v1.0.195"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4G)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4G completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          # os commits entre o candidato buildado e o tip devem tocar APENAS este workflow de
          # release (o PRODUTO publicado e exatamente o dos bytes do run em STABLE_SHA)
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354g\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_197_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.197 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.197 na linhagem"

      - name: "Gate 3 — release v1.0.198 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.198" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.198"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.198" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.198"; exit 1; }
          grep -q "1.0.198-sla-top-monitor-bell-fix" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.198/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.198 — SLA no Monitor Superior e Correção do Sino

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações →
          Atualizações → Verificar atualizações → Baixar → Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.197 (F3.5.4G — determinações do owner)
          - SLA SAIU DE DENTRO DO CARD: a banda com foto/contador que a 1.0.197 colocou no card
            foi REMOVIDA por completo (bloco amarelo, bloco vermelho, avatar e contador). O card
            volta visualmente LIMPO como o aprovado na 1.0.196 (comprovado por comparação byte a
            byte do HTML do card na mesma tarefa).
          - MONITOR SUPERIOR é o novo ponto oficial do SLA vivo ("MONITOR SLA · AO VIVO"):
            • Estado "Tudo em dia" preservado (sem contador, sem ruído, sem piscar);
            • Com cobrança ativa: FOTO MAIOR do Designer (30px — maior que a tentativa anterior),
              NOME legível (tooltip) e CRONÔMETRO em tempo real ("Faltam 28m 14s" /
              "04m 51s em atraso"), em amarelo ou vermelho elegantes; "+N" quando há mais
              cobranças no contexto; dropdown lista as cobranças com foto e "Abrir tarefa".
            • CONTEXTO POR DESIGNER: na aba de um Designer (Tarefas → Designers), o monitor
              mostra SÓ a cobrança daquele Designer; aba sem cobrança volta a "Tudo em dia";
              fora de uma aba específica, mostra a cobrança mais urgente visível ao usuário.
              Reatribuição migra, conclusão remove, reabertura reavalia, prazo editado recalcula.
          - SINO RESTAURADO (canto superior direito): causa-raiz da 1.0.197 corrigida — o painel
            aberto era reconstruído a cada segundo (cliques "morriam" no meio) e o realinhamento
            contínuo podia empurrar o sino para fora da tela. Agora o sino abre, lista, fecha,
            badge conta certo e o clique na notificação abre a tarefa — mesmo com cronômetro
            ativo ao lado (painel estável por assinatura; alinhamento idempotente com guarda).

          PRESERVAÇÃO (provado por gates no build)
          - Edição de tarefa/prazo e task_updated da 1.0.197: INTOCADOS (notifEvents/notifierA
            byte-idênticos; suíte 32/32 verde). Card unificado, Card Premium do Cronograma/
            Roteiro, colagem na Legenda, aprovação, links públicos, portal, notificações
            (imediatas e T-30/T-10), máquina de estados, tray/fechar no X, atualizador,
            login/logout, roster e agenda — INTOCADOS (main.ts e Categoria B byte-idênticos).
          - Worker/Cloudflare/Firebase/Rules/Functions/banco: INTOCADOS. Android permanece PAUSADO.
          - Rollback: 1.0.197, 1.0.196 e 1.0.195 PRESERVADAS (releases e tags intactas).

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner (card limpo, SLA no
          monitor superior com foto/nome/cronômetro, contexto por aba e sino funcionando). A
          publicação apenas disponibiliza a atualização pelo mecanismo oficial.

          Procedência: run de build F3.5.4G 30559767557 (success; --publish never; 20 gates
          F3.5.4G + gates herdados verdes na fonte e no app.asar) @ commit
          009f2c6ef2064dbdd18f5a2995669128df13a9ce (branch desktop/f354g-sla-top-monitor-bell-fix-1.0.198
          = tag v1.0.197 + commits da fase). Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.198 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.198; 1.0.197/1.0.196 rollback + 1.0.195 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.198 no canal do updater (Latest); 1.0.197/1.0.196 preservadas ====="

      - name: "Smoke do FEED DO UPDATER — exatamente o que o electron-updater consome (sem instalar)"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          # feed publico identico ao consultado pelo app (provider github, canal latest)
          curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" -o smoke/latest.yml
          [ "$(sha256sum smoke/latest.yml | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::feed latest.yml hash divergente"; exit 1; }
          grep -q "version: 1.0.198" smoke/latest.yml || { echo "::error::feed sem version 1.0.198"; exit 1; }
          grep -qE "^path: $EXE_NAME" smoke/latest.yml || { echo "::error::feed sem path do EXE"; exit 1; }
          curl -fsSL -o smoke/"$EXE_NAME" "https://github.com/$REPO/releases/latest/download/$EXE_NAME"
          [ "$(sha256sum smoke/$EXE_NAME | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::EXE do canal divergente"; exit 1; }
          curl -fsSL -o smoke/"$BM_NAME" "https://github.com/$REPO/releases/latest/download/$BM_NAME"
          [ "$(sha256sum smoke/$BM_NAME | awk '{print $1}')" = "$EXP_BM" ] || { echo "::error::blockmap do canal divergente"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' smoke/latest.yml | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "smoke/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do feed != EXE do feed"; exit 1; }
          echo "SMOKE DO UPDATER OK: 1.0.197/1.0.196 vao detectar/baixar a 1.0.198 (versao+path+sha512+blockmap integros). Nenhuma instalacao executada no CI."
