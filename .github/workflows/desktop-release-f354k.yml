# =====================================================================
# F3.5.4K — Publicacao da Desktop 1.0.201 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.201 (F3.5.4K: ENTREGA IMEDIATA DE NOTIFICACAO DE MOVIMENTACAO EM QUALQUER ESTADO DA
# JANELA — que na 1.0.200 NAO aparecia quando OUTRO programa estava em 1º plano. Causa-raiz provada:
# windowActive() usava isVisible()&&!isMinimized(); no Windows isVisible()=true p/ janela ATRAS de
# outro app (occluida) => o HUB roteava o TOAST in-app invisivel e o ACK do renderer cancelava o
# fallback premium. Correcao por FOCO: FOCADO=>toast in-app; desfocado/occluido/minimizado/tray=>
# JANELA PREMIUM always-on-top (showInactive, sem roubar foco); sessao BLOQUEADA=>Notification nativa
# (sem overlay sobre o lock); suspend/resume/unlock=>reconcile 1x; fila de deep-link; multimonitor;
# painel Config->Notificacoes) no canal consumido pelo electron-updater da producao (provider github
# -> release Latest nao-prerelease com latest.yml): a 1.0.200/1.0.199 instaladas passam a DETECTAR a
# 1.0.201 em Configuracoes -> Atualizacoes -> Verificar -> Baixar -> Instalar e reiniciar. NENHUM
# download manual pelo owner.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4K 30593192720 (gated, verde; --publish never):
# NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests dos
# artifacts, 5 hashes SHA-256, tag v1.0.201 no head EXATO da branch. 6 assets conforme a
# autorizacao F3.5.4K: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven
# Release Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main e INTOCAVEL nesta fase): dispara no push DESTE arquivo
# (pipeline automatico autorizado pela F3.5.4K apos gates verdes) + workflow_dispatch p/ reexecucao.
# v1.0.200, v1.0.199 e v1.0.198 permanecem PRESERVADAS (releases/tags intocadas).
# NAO builda, NAO altera codigo, NAO toca Firebase/Worker/Rules/Functions/Android.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois,
# exclusivamente pelo atualizador interno.
# =====================================================================
name: "F3.5.4K Desktop Release — 1.0.201 no canal do updater (notificacao em qualquer estado da janela; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354k-notification-all-states-1.0.201"
    paths:
      - ".github/workflows/desktop-release-f354k.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4K GO tecnico; run de build (pinado abaixo) verde nos 2 jobs) ──
      RUN_ID: "30593192720"
      STABLE_SHA: "047261b7587951e0496d5f4eff0cda5998269161"
      TEST_BRANCH: "desktop/f354k-notification-all-states-1.0.201"
      BASE_200_SHA: "e601eaa3f529ff4ab57ab97d22da6ca855ae5bca"
      TAG: "v1.0.201"
      TITLE: "Agenda ID Seven Desktop 1.0.201 — Notificações em Qualquer Estado da Janela"
      ART_INST: "agenda-id-seven-desktop-1.0.201-test-installer"
      ART_INST_DIGEST: "sha256:228aecfb61bac1448d235277e82fcac563572785608a23372801d9c356bd555b"
      ART_META: "agenda-id-seven-desktop-1.0.201-test-updatemeta"
      ART_META_DIGEST: "sha256:0ffe91241723bbddb810ec48cad274094eb3dab5e246f7791d4d22a835f3bdd9"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.201-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.201-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.201-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "7dd1d65f7a0fff7157c8152ca4965cd2a047bccb7e77e4f36835470db27984f2"
      EXP_MSI: "58d2e7689a15a592b4eb39f4db0f0b181435fafbfe340e12df46d32c45e326be"
      EXP_LY: "cbdd1bcbf0d47f290a39274b1635040bd475362019f4ecbfb8ec72cd8f3b8f33"
      EXP_BM: "e224f10e10bb39d495658f945a6084ef1e0a114bace7fa35ecfca9b098988ea2"
      EXP_SBOM: "4eb1e68a427d1718c60242543342737914d39e6de00869e5ace1a4c21a3c2fc8"
      PROD_PREV_TAG: "v1.0.200"
      PROD_ROLLBACK_TAG: "v1.0.199"
      PROD_HIST_TAG: "v1.0.198"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4K)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4K completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          # os commits entre o candidato buildado e o tip devem tocar APENAS este workflow de
          # release (o PRODUTO publicado e exatamente o dos bytes do run em STABLE_SHA)
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354k\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_200_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.200 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.200 na linhagem"

      - name: "Gate 3 — release v1.0.201 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.201" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.201"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.201" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.201"; exit 1; }
          grep -q "1.0.201-notification-all-window-states" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.201/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.201 — Notificações em Qualquer Estado da Janela

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações →
          Atualizações → Verificar atualizações → Baixar → Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.200 (F3.5.4K — entrega imediata da notificação de movimentação em qualquer
          estado da janela)
          - SINTOMA (produção): quando um Designer movia um card, a notificação imediata (canto inferior
            direito) NÃO aparecia para o destinatário se ele estivesse com OUTRO programa em primeiro
            plano / com o Agenda atrás de outra janela. O evento era detectado, mas a notificação não
            era vista.
          - CAUSA-RAIZ (provada): a função windowActive() decidia o canal de entrega por VISIBILIDADE
            (isVisible() && !isMinimized()). No Windows, isVisible() retorna true também para a janela
            que está apenas ATRÁS de outro aplicativo (occluída). Com isso, o HUB de entrega (main
            process) enviava o TOAST interno para o renderer oculto atrás da outra aplicação, e o ACK
            do renderer impedia o disparo da janela premium (fallback). Resultado: nada aparecia.
          - CORREÇÃO (cirúrgica, main process como autoridade da entrega):
            • Roteamento por FOCO REAL: windowActive() passa a usar isFocused(). Toast interno somente
              quando o Agenda está REALMENTE focado.
            • Agenda visível mas atrás de outro programa, minimizado, ou fechado no X e ativo no tray =>
              JANELA PREMIUM always-on-top (showInactive), acima do outro programa, SEM roubar o foco.
            • Gate secundário do renderer corrigido: a compensação in-app passa a exigir foco real
              (document.hasFocus()), evitando toast interno invisível e sem criar entrega duplicada
              entre renderer e main.
            • Tela BLOQUEADA (lock-screen): notificação NATIVA do Windows; nenhuma BrowserWindow sobre a
              tela de bloqueio; evento preservado na Central; sem duplicação após desbloquear.
            • suspend/resume e unlock: recuperação ÚNICA ao retomar, respeitando a deduplicação
              (recibos persistentes) — sem repetir eventos antigos.
            • Fila de deep-link: se o renderer ainda não estiver pronto, o clique é enfileirado e
              executado após renderer-ready, abrindo a tarefa correta, sem perder o clique nem criar
              segunda instância.
            • Multimonitor: a janela premium é posicionada no monitor ativo (display mais próximo do
              cursor), com fallback para o primário — nunca fora da tela.
            • Painel de diagnóstico em Configurações → Notificações (apenas informações técnicas
              sanitizadas: listener ativo, suporte a nativa, sessão bloqueada/desbloqueada, estado da
              janela, janela premium pronta, última entrega/canal/falha, versão) — sem token, senha,
              conteúdo privado, dados completos da tarefa, uid integral ou credenciais.

          PRESERVAÇÃO (provado por gates no build)
          - REGRA DE DESTINATÁRIOS INTOCADA: quem recebe, eventos de movimentação/conclusão/reabertura/
            reatribuição, ator/foto/nome, status anterior/novo, dedupKey e recibos persistentes —
            byte-idênticos à 1.0.200 (núcleo durável notifEvents/notifier/notifierA/notifStore/toastAck
            byte-idêntico).
          - Card Premium / fluxo-cliente, colagem na Legenda, Cronograma (save/send F3.5.4I), T-30/T-10,
            task_updated, sino + painel do sino + monitor SLA (F3.5.4G), tray, atualizador (channel
            latest), login/logout, agenda, roster, portal — INTOCADOS. index.html muda apenas nas
            regiões de notificação; main muda apenas em main.ts e bgNotify.ts (diff controlado:
            multimonitor + bgStatus).
          - Worker/Cloudflare/Firebase/Rules/Functions/banco: INTOCADOS. Android permanece PAUSADO.
          - Rollback: 1.0.200, 1.0.199 e 1.0.198 PRESERVADAS (releases e tags intactas).

          LIMITAÇÃO REAL (documentada honestamente)
          - Com o usuário tendo clicado em "Sair" ou encerrado o processo do Agenda, NÃO existe entrega
            de notificação em tempo real sem um Windows Service/Background Agent — que NÃO foi
            implementado nesta fase (fora de escopo). Nos demais estados suportados (focado, desfocado,
            atrás de outro programa, minimizado, tray, tela bloqueada via nativa) a entrega é imediata.

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner (mover um card e confirmar
          que a notificação aparece com outro programa em primeiro plano, sem roubar foco, e que o
          clique traz o Agenda e abre a tarefa correta). A publicação apenas disponibiliza a
          atualização pelo mecanismo oficial.

          Procedência: run de build F3.5.4K 30593192720 (success; --publish never; gates de verificação
          + Windows verdes, incluindo os 20 gates F3.5.4K no app.asar) @ commit
          047261b7587951e0496d5f4eff0cda5998269161 (branch desktop/f354k-notification-all-states-1.0.201 = tag v1.0.200 + commits
          da fase). Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.201 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.201; 1.0.200 prev + 1.0.199/1.0.198 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.201 no canal do updater (Latest); 1.0.200/1.0.199/1.0.198 preservadas ====="

      - name: "Smoke do FEED DO UPDATER — exatamente o que o electron-updater consome (sem instalar)"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          # feed publico identico ao consultado pelo app (provider github, canal latest)
          curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" -o smoke/latest.yml
          [ "$(sha256sum smoke/latest.yml | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::feed latest.yml hash divergente"; exit 1; }
          grep -q "version: 1.0.201" smoke/latest.yml || { echo "::error::feed sem version 1.0.201"; exit 1; }
          grep -qE "^path: $EXE_NAME" smoke/latest.yml || { echo "::error::feed sem path do EXE"; exit 1; }
          curl -fsSL -o smoke/"$EXE_NAME" "https://github.com/$REPO/releases/latest/download/$EXE_NAME"
          [ "$(sha256sum smoke/$EXE_NAME | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::EXE do canal divergente"; exit 1; }
          curl -fsSL -o smoke/"$BM_NAME" "https://github.com/$REPO/releases/latest/download/$BM_NAME"
          [ "$(sha256sum smoke/$BM_NAME | awk '{print $1}')" = "$EXP_BM" ] || { echo "::error::blockmap do canal divergente"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' smoke/latest.yml | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "smoke/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do feed != EXE do feed"; exit 1; }
          echo "SMOKE DO UPDATER OK: 1.0.200/1.0.199 vao detectar/baixar a 1.0.201 (versao+path+sha512+blockmap integros). Nenhuma instalacao executada no CI."
