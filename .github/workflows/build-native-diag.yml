# Build de DIAGNÓSTICO por isolamento. Gera APKs mínimos para achar o módulo que crasha.
# Variante atual: minimal (RN puro, sem Firebase/Notifee/navegação/services).
name: Build APK Diagnostico

on:
  workflow_dispatch:
  push:
    branches: [feat/native-android]
    paths:
      - 'native/diag/**'
      - '.github/workflows/build-native-diag.yml'

permissions:
  contents: read

jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar debug keystore (assinatura de teste)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restaurar google-services.json (exigido pelo plugin no build.gradle)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 ausente."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > native/android/app/google-services.json

      - name: Aplicar variante MINIMAL (package.json/index.js/App.tsx reduzidos)
        run: |
          cp native/diag/minimal/package.json native/package.json
          cp native/diag/minimal/index.js native/index.js
          cp native/diag/minimal/App.tsx native/App.tsx
          rm -f native/package-lock.json
          echo "package.json minimal aplicado:"; cat native/package.json

      - name: npm install
        working-directory: native
        run: npm install --legacy-peer-deps

      - name: gradlew assembleRelease (minimal)
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload app-minimal.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-minimal-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
