# [manual] F3.3.73I6C3A — deploy PINADO de onEventDeleted (exclusão definitiva:
# fan-out "excluiu definitivamente" no hard delete de events). Fonte:
# app/f3373i6c3a-event-permanent-delete @ a73ee97 (SHA verificado). Alvo FIXO
# --only functions:onEventDeleted (NOVO). NUNCA hosting/rules/firestore/alvo total.
# TRIGGER (onDocumentDeleted): pós-deploy NÃO faz canário HTTP nem Firestore write —
# valida presença em functions:list + ausência de colateral. Validação funcional
# (delete -> push a todos) fica no owner-run 73I6C4. Rollback: deletar a função
# (firebase functions:delete onEventDeleted) — o restante segue do 73I6C1.
name: "[manual] F3.3.73I6C3A — deploy onEventDeleted (1 function; dry-run/apply)"
"on":
  workflow_dispatch:
    inputs:
      confirm: { description: "Digite DEPLOY-ONEVENTDELETED-73I6C3A (apply) ou DRYRUN (dry-run)", required: true, default: "DRYRUN" }
  push:
    branches: [claude/bold-hopper-4boo17]
permissions: { contents: read }
concurrency: { group: f3373i6c3a-deploy, cancel-in-progress: false }
env:
  GCP_PROJECT: "agenda-id-seven"
  SRC_REF: "app/f3373i6c3a-event-permanent-delete"
  SRC_SHA: "a73ee97"
  DEPLOY_TARGET: "functions:onEventDeleted"
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '73I6C3A-DRYRUN-DELETE') ||
      contains(github.event.head_commit.message, 'DEPLOY-ONEVENTDELETED-73I6C3A')
    runs-on: ubuntu-latest
    steps:
      - name: Gate — modo (literal via dispatch OU head-commit)
        env: { CONFIRM: "${{ github.event.inputs.confirm }}", HEADMSG: "${{ github.event.head_commit.message }}" }
        run: |
          set -eu
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$CONFIRM" in DEPLOY-ONEVENTDELETED-73I6C3A) MODE=false;; DRYRUN) MODE=true;; *) echo "::error::confirm invalido"; exit 1;; esac
          else
            case "$HEADMSG" in *DEPLOY-ONEVENTDELETED-73I6C3A*) MODE=false;; *73I6C3A-DRYRUN-DELETE*) MODE=true;; *) echo "push sem literal 73I6C3A — no-op"; exit 1;; esac
          fi
          echo "DRY_RUN=$MODE" >> "$GITHUB_ENV"; echo "modo DRY_RUN=$MODE"
      - name: Checkout fonte pinada
        uses: actions/checkout@v5
        with: { ref: "app/f3373i6c3a-event-permanent-delete", fetch-depth: 1 }
      - name: Guard SHA + pre-checks (harness 23/23 + C1 53/53 + 73I5 16/16)
        run: |
          set -eu
          HEADSHA=$(git rev-parse --short=7 HEAD); [ "$HEADSHA" = "$SRC_SHA" ] || { echo "::error::SHA divergente: $HEADSHA (esperado $SRC_SHA)"; exit 1; }
          node --check functions/index.js
          node scripts/worker-ops/f3373i6c3a-event-permanent-delete.test.mjs
          node scripts/worker-ops/f3373i6c1-event-lifecycle-fanout.test.mjs
          node scripts/worker-ops/f3373i5-event-src-allowlist.test.mjs
          grep -qE 'exports\.onEventDeleted = onDocumentDeleted\("events/\{eventId\}"' functions/index.js || { echo "::error::onEventDeleted ausente"; exit 1; }
          grep -qE 'exports\.onEventCreated = onDocumentCreated\("events/\{eventId\}"' functions/index.js || { echo "::error::onEventCreated alterado/ausente"; exit 1; }
          grep -qE 'exports\.onEventUpdated = onDocumentUpdated\("events/\{eventId\}"' functions/index.js || { echo "::error::onEventUpdated ausente"; exit 1; }
          grep -qE 'if \(msg.src !== "nativebeta"\) return;' functions/index.js || { echo "::error::gate do chat alterado"; exit 1; }
          case "$DEPLOY_TARGET" in functions|functions:) echo "::error::alvo total bloqueado"; exit 1;; esac
          case "$DEPLOY_TARGET" in *hosting*|*firestore*|*rules*) echo "::error::alvo proibido"; exit 1;; esac
          echo "pre-checks OK"
      - name: Auth gcloud (SA via secret; nunca impresso)
        env: { GOOGLE_APPLICATION_CREDENTIALS_JSON: "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" }
        run: |
          set -eu
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error::SA ausente"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null
          npm install -g firebase-tools >/dev/null 2>&1
      - name: Estado ANTES (functions:list)
        run: firebase functions:list --project "$GCP_PROJECT" | tee before.txt || true
      - name: functions/.env (defaults RESET_EMAIL_*; sem segredo — paridade 72C/73I5/73I6C1)
        run: |
          set -eu
          { printf 'RESET_EMAIL_FROM=%s\n' "no-reply@agendaidseven.com.br"; printf 'RESET_EMAIL_FROM_NAME=%s\n' "ID Seven Agenda"; printf 'RESET_EMAIL_PROVIDER=%s\n' "resend"; } > "functions/.env.${GCP_PROJECT}"
      - name: Deploy (SOMENTE apply; alvo fixo 1 function NOVA)
        run: |
          set -eu
          ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          if [ "$DRY_RUN" = "false" ]; then
            firebase deploy --only "$DEPLOY_TARGET" --project "$GCP_PROJECT" --non-interactive --force
          else
            echo "DRY-RUN — nenhum deploy. Alvo planejado: $DEPLOY_TARGET"
          fi
      - name: Pos-deploy (somente apply; TRIGGER — sem canário HTTP, sem Firestore write)
        run: |
          set -eu
          [ "$DRY_RUN" = "false" ] || { echo "dry-run: sem pos-deploy"; exit 0; }
          firebase functions:list --project "$GCP_PROJECT" | tee after.txt
          grep -qi "onEventDeleted" after.txt || { echo "::error::onEventDeleted ausente pos-deploy"; exit 1; }
          for FN in onEventCreated onEventUpdated onTaskCreated onChatMessageCreated loginUser getUserSelf registerFcmToken; do
            grep -qi "$FN" after.txt || { echo "::error::colateral: $FN sumiu pos-deploy"; exit 1; }
          done
          echo "== PERMDELETE-73I6C3A =="
          echo "deploy_target : $DEPLOY_TARGET"
          echo "src           : $SRC_REF @ $SRC_SHA"
          echo "onEventDeleted: NOVO, presente; onEventCreated/onEventUpdated + siblings intactos"
          echo "validacao funcional (delete -> push a todos) => owner-run 73I6C4"
          echo "== FIM PERMDELETE-73I6C3A =="
          echo "===== GO: DEPLOY onEventDeleted (exclusao definitiva) OK ====="
      - name: Limpeza credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" || true
