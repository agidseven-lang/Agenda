# =====================================================================
# [push/manual] F3.5.4K — Desktop Build de TESTE (candidata 1.0.201 — notificacao imediata em QUALQUER estado da janela)
# ---------------------------------------------------------------------
# Base 1.0.200 OFICIAL (@e601eaa, tag v1.0.200). Delta CIRURGICO F3.5.4K: a notificacao imediata de
# movimentacao NAO aparecia quando OUTRO programa estava em 1º plano. Causa-raiz provada: windowActive()
# usava isVisible()&&!isMinimized(); no Windows isVisible()=true p/ janela ATRAS de outro app (occluida)
# => o HUB roteava o TOAST in-app (invisivel) e o ACK do renderer cancelava o fallback premium.
# Correcao (roteamento por FOCO): FOCADO=>toast in-app; desfocado/occluido/minimizado/tray=>JANELA
# PREMIUM always-on-top (showInactive, sem roubar foco); nativa=fallback; sessao BLOQUEADA=>nativa
# (sem overlay sobre o lock). suspend/resume/unlock=>reconcile 1x (recibos dedup). Fila de deep-link,
# multimonitor (display do cursor), 13 eventos notify.* sanitizados, painel Config->Notificacoes.
# Diff autorizado: desktop/src/main/main.ts + bgNotify.ts + preload.ts + renderer/index.html (regioes
# de notificacao) + scripts f354k + suites amendadas ao contrato por foco + docs/f354k-qa. O nucleo
# durável (notifEvents/notifier/notifierA/notifStore/toastAck/slaRules/cardsRules/slaScheduler/reminder/
# firebase/tray/updaterService), Card Premium/fluxo-cliente, T-30/T-10, task_updated e Android: INTOCADOS.
# Roda no PROPRIO ref (push desta branch + workflow_dispatch): NENHUM commit em main. `--publish never`:
# NUNCA publica; sem release/tag/stable/latest. Artefatos = artifacts PRIVADOS p/ teste fisico do owner.
# =====================================================================
name: "[push/manual] F3.5.4K Desktop Build (candidata 1.0.201 — notificacao em qualquer estado da janela)"
"on":
  push:
    branches:
      - "desktop/f354k-notification-all-states-1.0.201"
    paths-ignore:
      - ".github/workflows/desktop-release-f354k.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_199_SHA: "891150fb88e2c7c0d5e5885b4f71ec3e206912c2" # Desktop 1.0.199 OFICIAL (referencia historica)
  BASE_200_SHA: "e601eaa3f529ff4ab57ab97d22da6ca855ae5bca" # Desktop 1.0.200 OFICIAL (tag v1.0.200; BASE do delta F3.5.4K)
  TEST_BRANCH: "desktop/f354k-notification-all-states-1.0.201"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (SHA do push; history completo p/ baselines)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA — branch de teste correta e descendente da 1.0.200 pinada
        run: |
          set -e
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error:: ref '${{ github.ref_name }}' != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_200_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.200 ($BASE_200_SHA)"; exit 1; }
          echo "ref=$TEST_BRANCH head=$(git rev-parse HEAD) base=$BASE_200_SHA OK"

      - name: Derivar versao — exige 1.0.201 exato, sem sufixo
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "versao=$APP_VERSION"
          [ "$APP_VERSION" = "1.0.201" ] || { echo "::error:: versao != 1.0.201"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido ($APP_VERSION)"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      - name: Instalar Playwright/Chromium (suites DOM + provas visuais)
        working-directory: desktop
        run: |
          set -e
          sudo mkdir -p /opt/pw-browsers && sudo chown "$USER" /opt/pw-browsers
          npm i --no-save playwright@1.56.1 --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium

      - name: Gate F3.5.4K — notification-all-window-states (46 cenarios + diferencial RED->GREEN + observabilidade + congelados)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354k-notification-all-window-states.test.mjs || { echo "::error:: f354k notification-all-window-states vermelho"; exit 1; }

      - name: Gate REGRESSAO — canal por foco (suites amendadas ao contrato F3.5.4K) + preservacao aplicavel
        working-directory: desktop
        env:
          CHROME_BIN: /opt/pw-browsers
        run: |
          set -e
          # resolve o Chromium do CI p/ as suites DOM (f33C usa CHROME_BIN)
          CB=$(ls -d /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || true); [ -n "$CB" ] && export CHROME_BIN="$CB"
          for t in f334-flow-audit f335-contract f33A-notif-central f33C-assignment-toast f33F-bg-notify \
                   f343-delivery-channel f343-main-scheduler f343-operational-block \
                   f347-immediate-visual-delivery f347-independent-behavior \
                   f343-sla-golden-master f344-flow-golden-master f345-sla-timestamp-golden-master \
                   f343-preservation f341a-updater-state-machine f3377a-r4b-http-date-clock f3311-baseline-freeze; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate de canal/preservacao $t vermelho"; exit 1; }
          done
          echo "REGRESSAO/PRESERVACAO (contrato por foco): TODOS VERDES."

      - name: Gate CONGELADOS — SLA/Cronograma/cards/notificacoes duraveis intactos vs 1.0.200
        working-directory: desktop
        env:
          CHROME_BIN: /opt/pw-browsers
        run: |
          set -e
          CB=$(ls -d /opt/pw-browsers/chromium-*/chrome-linux/chrome 2>/dev/null | head -1 || true); [ -n "$CB" ] && export CHROME_BIN="$CB"
          node scripts/f354i-cronograma-save-send-client.test.mjs || { echo "::error:: f354i cronograma (congelado) vermelho"; exit 1; }
          node scripts/f354i-repro.mjs || { echo "::error:: f354i repro (congelado) vermelho"; exit 1; }
          node scripts/f354h-red-notification-boundary.test.mjs || { echo "::error:: f354h boundary (congelado) vermelho"; exit 1; }
          node scripts/f354h-repro.mjs || { echo "::error:: f354h repro (congelado) vermelho"; exit 1; }
          node scripts/f354g-sla-top-monitor.test.mjs || { echo "::error:: f354g monitor (congelado) vermelho"; exit 1; }
          node scripts/f354g-bell-notification-panel.test.mjs || { echo "::error:: f354g sino (congelado) vermelho"; exit 1; }
          node scripts/f354f-sla-designer-live-timer.test.mjs || { echo "::error:: f354f SLA timer (congelado) vermelho"; exit 1; }
          node scripts/f354f-task-edit-update-notification.test.mjs || { echo "::error:: f354f task_updated (congelado) vermelho"; exit 1; }
          node scripts/f354-notifications-reliability.test.mjs || { echo "::error:: f354 notificacoes (C3e emendada bgNotify) vermelho"; exit 1; }
          node scripts/f353a-actor-photo.test.mjs || { echo "::error:: f353a foto do ator (V4 emendada bgNotify) vermelho"; exit 1; }
          node scripts/f353-durable-notifications.test.mjs || { echo "::error:: f353 duraveis (congelado) vermelho"; exit 1; }
          for t in f352-cards-notify f352-cards-source-invariance f352-cards-recipient f352-cards-channel-substitution f352a-cards-interval; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate F3.5.2/A $t vermelho"; exit 1; }
          done
          node scripts/f352-cards-packaging.mjs || { echo "::error:: empacotamento cardsRules vermelho"; exit 1; }
          echo "CONGELADOS: TODOS VERDES."

      - name: Gate MAIN DIFF-CONTROLADO — F3.5.4K toca SO main.ts + bgNotify.ts; resto de desktop/src/main byte-identico a 1.0.200
        run: |
          set -e
          # nucleo durável de SLA/notif/scheduler/regras: byte-identico a 1.0.200.
          for f in slaScheduler.ts slaRules.js cardsRules.js notifEvents.js notifier.ts notifierA.ts notifStore.ts \
                   toastAck.ts reminder.ts firebase.ts tray.ts updaterService.ts actorProfile.js clockSync.ts \
                   auth.ts auth-core.ts autostart.ts prewarm.ts diag.ts slaSeenUser.ts; do
            D=$(git diff "$BASE_200_SHA" HEAD -- "desktop/src/main/$f" || true)
            [ -z "$D" ] || { echo "::error:: desktop/src/main/$f ALTERADO vs 1.0.200 (congelado)"; printf '%s\n' "$D" | head -20; exit 1; }
          done
          # main.ts: diff CONTROLADO — usa isFocused (nao isVisible) no windowActive; helpers/lock/deep-link presentes.
          MT=$(git show "$BASE_200_SHA:desktop/src/main/main.ts")
          echo "$MT" | grep -qE 'w\.isVisible\(\) && !w\.isMinimized\(\)' || echo "  (info) baseline windowActive por visibilidade confirmado"
          grep -qE 'return !!\(w && !w\.isDestroyed\(\) && w\.isFocused\(\)\);' desktop/src/main/main.ts || { echo "::error:: windowActive() nao passou a usar isFocused"; exit 1; }
          echo "MAIN DIFF-CONTROLADO: nucleo durável intacto; main.ts por FOCO."

      - name: Gate INDEX.HTML — diff vs 1.0.200 confinado as regioes F3.5.4K; layout/Card Premium/SLA/sino/cronograma congelados
        run: |
          set -e
          H="desktop/src/renderer/index.html"
          DIFF=$(git diff -U0 "$BASE_200_SHA" HEAD -- "$H" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
          # (a) nenhum token de superficie congelada nas linhas alteradas
          if printf '%s\n' "$DIFF" | grep -qE 'kbv2-sla-live|sla-monitor|f354gMon|slaib|kbv2-card|kbv2-theme|buildClientMessage|buildShareClientUrl|ensureStableClientReviewToken|openSendClientModal|clientReviewToken|og:image|/share/|[?]v=|cronSanitizeDeep|cronValidateSend|shouldFireRedNotification|kbv2SlaLiveData'; then
            echo "::error:: index.html diff toca superficie CONGELADA"; printf '%s\n' "$DIFF" | grep -nE 'kbv2-sla-live|sla-monitor|buildClientMessage|cronValidateSend|[?]v='; exit 1; fi
          # (b) ancoras F3.5.4K presentes no diff
          for anc in 'document.hasFocus()' 'notifDiagCardHtml' 'data-cfgnotifdiag'; do
            printf '%s\n' "$DIFF" | grep -qF "$anc" || { echo "::error:: ancora F3.5.4K ausente do diff do index.html: $anc"; exit 1; }
          done
          echo "INDEX.HTML: diff confinado as regioes F3.5.4K; superficies congeladas intactas."

      - name: Gate CARD PREMIUM / FLUXO-CLIENTE — 6 funcoes byte-identicas a 1.0.200
        run: |
          set -e
          git show "$BASE_200_SHA:desktop/src/renderer/index.html" > /tmp/base200.html
          CUR="desktop/src/renderer/index.html" BASE="/tmp/base200.html" node -e '
            const fs=require("fs"); const cur=fs.readFileSync(process.env.CUR,"utf8"), base=fs.readFileSync(process.env.BASE,"utf8");
            const res=[/function buildClientMessage\([^]*?\n\}/,/function buildShareClientUrl\([^]*?\n\}/,/function ensureStableClientReviewToken\([^]*?\n\}/,/function openSendClientModal\([^]*?\n\}/,/function canSendToClient\([^]*?\n\}/,/function isClientSector\(k\)\{return[^}]*\}/];
            const names=["buildClientMessage","buildShareClientUrl","ensureStableClientReviewToken","openSendClientModal","canSendToClient","isClientSector"];
            for(let i=0;i<res.length;i++){ const a=(cur.match(res[i])||[])[0], b=(base.match(res[i])||[])[0]; if(!a||!b||a!==b){ console.error("::error:: funcao do fluxo-cliente ALTERADA vs 1.0.200: "+names[i]); process.exit(1);} }
            console.log("CARD PREMIUM/FLUXO-CLIENTE: 6 funcoes byte-identicas a 1.0.200.");'

      - name: Gate BGNOTIFY DIFF-CONTROLADO — overlay preservado; so multimonitor + bgStatus
        run: |
          set -e
          BGD=$(git diff "$BASE_200_SHA" HEAD -- desktop/src/main/bgNotify.ts || true)
          echo "$BGD" | grep -qE '^\+.*getDisplayNearestPoint' || { echo "::error:: bgNotify sem multimonitor (getDisplayNearestPoint)"; exit 1; }
          echo "$BGD" | grep -qE '^\+.*bgStatus' || { echo "::error:: bgNotify sem export bgStatus"; exit 1; }
          if echo "$BGD" | grep -E '^-' | grep -qE 'showInactive|alwaysOnTop|focusable|skipTaskbar|setVisibleOnAllWorkspaces'; then
            echo "::error:: bgNotify REMOVEU propriedade do overlay (showInactive/alwaysOnTop/focusable/...)"; exit 1; fi
          echo "BGNOTIFY DIFF-CONTROLADO: overlay intacto; multimonitor + bgStatus aditivos."

      - name: Gate ISOLAMENTO — diff vs 1.0.200 SO nos arquivos autorizados F3.5.4K
        run: |
          set -e
          git diff --name-only "$BASE_200_SHA" HEAD | grep -vE '^(desktop/src/main/main\.ts$|desktop/src/main/bgNotify\.ts$|desktop/src/preload/preload\.ts$|desktop/src/renderer/index\.html$|desktop/scripts/f354k-notification-all-window-states\.test\.mjs$|desktop/scripts/f354k-qa-evidence\.mjs$|desktop/scripts/fixtures/f343/deliver-harness\.mjs$|desktop/scripts/f3311-baseline-freeze\.test\.mjs$|desktop/scripts/f334-flow-audit\.test\.mjs$|desktop/scripts/f335-contract\.test\.mjs$|desktop/scripts/f33A-notif-central\.test\.mjs$|desktop/scripts/f33C-assignment-toast\.test\.mjs$|desktop/scripts/f33F-bg-notify\.test\.mjs$|desktop/scripts/f343-delivery-channel\.test\.mjs$|desktop/scripts/f343-operational-block\.test\.mjs$|desktop/scripts/f347-immediate-visual-delivery\.test\.mjs$|desktop/scripts/f347-independent-behavior\.test\.mjs$|desktop/scripts/f353a-actor-photo\.test\.mjs$|desktop/scripts/f354-notifications-reliability\.test\.mjs$|desktop/scripts/f354i-cronograma-save-send-client\.test\.mjs$|desktop/package\.json$|desktop/package-lock\.json$|docs/F3\.5\.4K-|docs/f354k-qa/|\.github/workflows/desktop-build-f354k\.yml$|\.github/workflows/desktop-release-f354k\.yml$)' | tee /tmp/outside.txt || true
          [ ! -s /tmp/outside.txt ] || { echo "::error:: mudanca FORA do escopo F3.5.4K (Android/Worker/Rules/Functions/nucleo duravel intocaveis)"; exit 1; }
          echo "OK: diff vs 1.0.200 contem SOMENTE os arquivos autorizados F3.5.4K."

      - name: PROVAS VISUAIS F3.5.4K — 10 evidencias reais (Chromium; overlay acima de outro programa; sem IA)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354k-qa-evidence.mjs
          git diff --quiet -- package.json package-lock.json || { echo "::error:: provas visuais alteraram package.json/lock"; exit 1; }
          N=$(ls ../docs/f354k-qa/*.png | wc -l | tr -d ' '); echo "PNGs: $N"; [ "$N" = "10" ] || { echo "::error:: esperadas 10 evidencias, vi $N"; exit 1; }

      - name: Upload evidencias reais F3.5.4K (artifact PRIVADO)
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.201-test-evidencias
          path: |
            docs/f354k-qa/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
    steps:
      - name: Forcar LF no checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA (windows)
        run: |
          set -e
          git merge-base --is-ancestor "$BASE_200_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.200"; exit 1; }

      - name: Gate LINE ENDINGS LF
        run: |
          set -e
          FILES="desktop/src/renderer/index.html desktop/src/main/main.ts desktop/src/main/bgNotify.ts desktop/src/preload/preload.ts desktop/src/main/notifierA.ts desktop/src/main/notifEvents.js desktop/src/main/cardsRules.js desktop/src/main/slaScheduler.ts"
          git ls-files --eol -- $FILES | tee "$RUNNER_TEMP/eol.txt"
          if grep -Eq 'w/(crlf|mixed)' "$RUNNER_TEMP/eol.txt"; then echo "::error:: CRLF/mixed em arquivo-chave"; exit 1; fi
          echo "LINE ENDINGS: LF CONFIRMED"

      - name: Derivar versao — exige 1.0.201 exato
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          [ "$APP_VERSION" = "1.0.201" ] || { echo "::error:: versao != 1.0.201"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f "dist-installer/win-unpacked/resources/icon.png" || { echo "::error:: resources/icon.png AUSENTE"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.201) + renderer EMPACOTADO == fonte + F4.2F AUSENTE
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.201" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.201"; exit 1; }
          EX="$EXDIR/src/renderer/index.html"; SRC="src/renderer/index.html"; test -f "$EX" || { echo "::error:: index.html ausente no asar"; exit 1; }
          EX="$EX" SRC="$SRC" node -e 'const fs=require("fs");const nrm=s=>String(s).replace(/\r\n/g,"\n");if(nrm(fs.readFileSync(process.env.EX,"utf8"))!==nrm(fs.readFileSync(process.env.SRC,"utf8"))){console.error("index.html EMPACOTADO != fonte");process.exit(1);}'
          echo "  index.html EMPACOTADO == fonte"
          test ! -f "$EXDIR/src/renderer/firebaseAuthBridge.js" || { echo "::error:: firebaseAuthBridge.js presente (F4.2F)"; exit 1; }
          for k in 'firebase-auth-compat' 'signInWithCustomToken' 'startFirebaseAuthBridge'; do
            if grep -q "$k" "$EX"; then echo "::error:: '$k' presente no renderer (F4.2F)"; exit 1; fi
          done
          echo "GATE prova-de-versao 1.0.201 + renderer==fonte + F4.2F AUSENTE OK."

      - name: Gate F3.5.4K EMPACOTADO — notificacao em qualquer estado da janela no app.asar (20 gates)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; DM="$EXDIR/dist/main"; EXH="$EXDIR/src/renderer/index.html"
          MJS="$DM/main.js"; BG="$DM/bgNotify.js"; PRE="$EXDIR/dist/preload/preload.js"
          # 1 — windowActive por FOCO (isFocused); sem a regra antiga por visibilidade dentro de windowActive
          grep -qE 'function windowActive\(\)' "$MJS" || { echo "::error:: windowActive ausente"; exit 1; }
          MJS="$MJS" node -e 's=require("fs").readFileSync(process.env.MJS,"utf8");const i=s.indexOf("function windowActive(");const b=s.slice(i,i+260);if(!/isFocused\(\)/.test(b)){console.error("windowActive nao usa isFocused");process.exit(1);}if(/isVisible\(\) && !w\.isMinimized\(\)/.test(b)){console.error("windowActive AINDA por visibilidade");process.exit(1);}'
          # 2 — sessao BLOQUEADA => nativa (sem overlay sobre o lock)
          grep -qE 'if \(sessionLocked\)' "$MJS" || { echo "::error:: branch sessionLocked ausente"; exit 1; }
          grep -q 'notify.locked.native' "$MJS" || { echo "::error:: evento notify.locked.native ausente"; exit 1; }
          # 3 — desfocado => JANELA PREMIUM (showBgNotify no HUB)
          grep -q 'showBgNotify' "$MJS" || { echo "::error:: showBgNotify ausente do HUB"; exit 1; }
          grep -q 'premium-overlay' "$MJS" || { echo "::error:: politica premium-overlay ausente"; exit 1; }
          # 4 — overlay NAO rouba foco / always-on-top preservados no bgNotify EMPACOTADO
          grep -q 'showInactive' "$BG" || { echo "::error:: bgNotify sem showInactive"; exit 1; }
          grep -q 'screen-saver' "$BG" || { echo "::error:: bgNotify sem alwaysOnTop screen-saver"; exit 1; }
          grep -q 'focusable: false' "$BG" || grep -q 'focusable:false' "$BG" || { echo "::error:: bgNotify sem focusable:false"; exit 1; }
          # 5 — MULTIMONITOR (display do cursor)
          grep -q 'getDisplayNearestPoint' "$BG" || { echo "::error:: bgNotify sem multimonitor"; exit 1; }
          # 6 — FILA de deep-link (enfileira ate renderer-ready)
          grep -q 'pendingDeep' "$MJS" || { echo "::error:: fila de deep-link (pendingDeep) ausente"; exit 1; }
          grep -q 'notify.deeplink.queued' "$MJS" || { echo "::error:: evento notify.deeplink.queued ausente"; exit 1; }
          # 7 — bringToFrontAndOpen (traz a frente + abre)
          grep -q 'function bringToFrontAndOpen' "$MJS" || { echo "::error:: bringToFrontAndOpen ausente"; exit 1; }
          # 8 — IPC notif-diag (painel de diagnostico)
          grep -q 'notif-diag' "$MJS" || { echo "::error:: IPC notif-diag ausente do main"; exit 1; }
          grep -q 'notifDiag' "$PRE" || { echo "::error:: preload sem notifDiag"; exit 1; }
          # 9 — 13 eventos notify.* sanitizados
          for ev in notify.event.detected notify.main.received notify.delivery.policy notify.premium.shown notify.premium.failed notify.native.sent notify.native.failed notify.locked.native notify.click.received notify.deeplink.queued notify.deeplink.opened notify.dedup.skipped; do
            grep -q "$ev" "$MJS" || { echo "::error:: evento $ev ausente"; exit 1; }
          done
          # 10 — powerMonitor lock-screen tratado
          grep -q '"lock-screen"' "$MJS" || { echo "::error:: powerMonitor lock-screen ausente"; exit 1; }
          # 11 — reconcile da Categoria A no resume/unlock (recuperacao unica)
          grep -qE 'notifierAHandle\.reconcile' "$MJS" || { echo "::error:: reconcile do notifierA (resume/unlock) ausente"; exit 1; }
          # 12 — renderer: compensacao do toast in-app por FOCO real
          grep -q 'document.hasFocus()' "$EXH" || { echo "::error:: renderer sem gate de foco na compensacao"; exit 1; }
          # 13 — renderer: painel Config->Notificacoes
          grep -q 'notifDiagCardHtml' "$EXH" || { echo "::error:: painel de diagnostico ausente no renderer"; exit 1; }
          grep -q 'data-cfgnotifdiag' "$EXH" || { echo "::error:: acao Atualizar diagnostico ausente"; exit 1; }
          # 14 — FROZEN notifEvents.js EMPACOTADO == fonte (destinatarios/dedup intactos)
          #    comparacao de CONTEUDO normalizando EOL (identica ao gate do index.html na linha ~282):
          #    o .js e COPIADO por scripts/copy-renderer.js (nao passa por tsc) e no runner Windows a
          #    copia empacotada pode ficar com CRLF enquanto a fonte esta em LF (checkout forcado a LF);
          #    o SHA-256 cru acusaria divergencia so por EOL. A congelacao real ja e provada no verify
          #    (MAIN DIFF-CONTROLADO: nucleo duravel byte-identico a 1.0.200) — aqui exigimos igualdade
          #    de conteudo (sem \r) entre empacotado e fonte.
          NE_SRC="src/main/notifEvents.js" NE_PKG="$DM/notifEvents.js" node -e 'const fs=require("fs");const nrm=s=>String(s).replace(/\r\n/g,"\n");if(nrm(fs.readFileSync(process.env.NE_PKG,"utf8"))!==nrm(fs.readFileSync(process.env.NE_SRC,"utf8"))){console.error("notifEvents.js EMPACOTADO != fonte");process.exit(1);}'
          grep -q "recipientMode: 'all_active_users'" "$DM/notifEvents.js" || { echo "::error:: Categoria A (all_active_users) alterada"; exit 1; }
          # 15 — FROZEN task_updated / assigned_designer preservados
          grep -qF "eventId: 'task_updated:' + taskId" "$DM/notifEvents.js" || { echo "::error:: task_updated ausente"; exit 1; }
          grep -qF "recipientMode: 'assigned_designer'" "$DM/notifEvents.js" || { echo "::error:: assigned_designer ausente"; exit 1; }
          # 16 — FROZEN T-30/T-10 (cardsRules)
          grep -qF 'var CARDS_WARN_MS = 30 * 60000' "$DM/cardsRules.js" || { echo "::error:: T-30 dos cards alterada"; exit 1; }
          grep -qF 'var CARDS_RED_MS  = 10 * 60000' "$DM/cardsRules.js" || { echo "::error:: T-10 dos cards alterada"; exit 1; }
          # 17 — FROZEN Cronograma save/send (F3.5.4I) presente
          grep -q 'function cronSanitizeDeep(' "$EXH" || { echo "::error:: cronSanitizeDeep (F3.5.4I) ausente"; exit 1; }
          grep -q 'function cronValidateSend(' "$EXH" || { echo "::error:: cronValidateSend (F3.5.4I) ausente"; exit 1; }
          # 18 — FROZEN sino + SLA monitor (F3.5.4G) presentes
          grep -q 'function slaibToggle(' "$EXH" || { echo "::error:: sino (slaibToggle) ausente"; exit 1; }
          grep -q 'function f354gMonAlerts' "$EXH" || { echo "::error:: monitor SLA (f354gMonAlerts) ausente"; exit 1; }
          # 19 — tray + updater channel latest preservados
          grep -q 'ensureTray' "$MJS" || { echo "::error:: ensureTray ausente"; exit 1; }
          grep -qE 'channel[[:space:]]*=[[:space:]]*"latest"' "$DM/updaterService.js" || { echo "::error:: updater channel != latest"; exit 1; }
          # 20 — Android NAO tocado
          A2=$(git diff --name-only "$BASE_200_SHA" HEAD | grep -c '^android/' || true); [ "$A2" = "0" ] || { echo "::error:: diff toca android/ ($A2)"; exit 1; }
          echo "GATE F3.5.4K EMPACOTADO (20 gates): VERIFIED"

      - name: Gate nucleo durável EMPACOTADO == fonte (notifier/notifierA/notifStore/toastAck/slaScheduler/slaRules)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          for f in notifEvents.js notifierA.js notifStore.js toastAck.js actorProfile.js slaRules.js cardsRules.js; do
            test -f "$EXDIR/dist/main/$f" || { echo "::error:: dist/main/$f AUSENTE no app.asar"; exit 1; }
          done
          grep -q 'startNotifierA' "$EXDIR/dist/main/main.js" || { echo "::error:: notifierA nao ligado no main"; exit 1; }
          echo "NUCLEO DURAVEL EMPACOTADO OK."

      - name: Empacotar bundle (EXE/MSI/latest.yml/blockmap/SBOM/SHA256SUMS/VERSAO-DESKTOP) + SHA256SUMS
        working-directory: ${{ env.APP_DIR }}
        env:
          APP_VERSION: "1.0.201"
        run: |
          set -e
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom-cyclonedx.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom-cyclonedx.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"
          cp "$RUNNER_TEMP/sbom-cyclonedx.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.201-notification-all-window-states (CANDIDATA — entrega imediata com qualquer programa em 1o plano)"
            echo "channel     : latest (estrutura do updater; NADA publicado)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "baseline    : Desktop 1.0.200 OFICIAL (commit e601eaa; tag v1.0.200 preservada)"
            echo "origem      : F3.5.4K — notificacao imediata de movimentacao em QUALQUER estado da janela: roteamento por FOCO (isFocused) no HUB deliverNotification; FOCADO=>toast in-app, desfocado/occluido/minimizado/tray=>JANELA PREMIUM always-on-top (showInactive, sem roubar foco), sessao BLOQUEADA=>Notification nativa (sem overlay sobre o lock); fila de deep-link; multimonitor (display do cursor); suspend/resume/unlock reconcile 1x; 13 eventos notify.* sanitizados; painel Configuracoes->Notificacoes. Destinatarios/dedup/recibos/notifEvents/SLA(T-30/T-10)/scheduler/Cronograma/Card Premium: INTOCADOS; nucleo duravel byte-identico a 1.0.200; bgNotify com DIFF CONTROLADO (multimonitor + bgStatus)"
            echo "assinatura  : mesmo processo da 1.0.200 (sem code-signing -> NotSigned)"
            echo "distribuicao: CANDIDATA DE TESTE PRIVADA — SEM release, SEM tag, SEM stable/latest, SEM deploy; somente artifact p/ teste fisico do owner"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload artifact — installer (EXE + MSI) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.201-test-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact — updatemeta (latest.yml + blockmap + SHA256SUMS + SBOM + VERSAO) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.201-test-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
