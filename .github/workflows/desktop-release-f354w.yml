# =====================================================================
# F3.5.4W — Publicacao da Desktop 1.0.214 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.214 (F3.5.4W — cards compactos, Central de Detalhes, avatares, Social Medias).
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4W 30851077831 (gated, verde nos 2 jobs;
# --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO:
# run id, digests dos artifacts, 5 hashes SHA-256, tag v1.0.214 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# Base de codigo / rollback imediato: v1.0.213 (baseline FISICAMENTE aprovada). Rollback adicional:
# v1.0.211. As versoes anteriores permanecem PRESERVADAS. A publicacao NAO significa aprovacao fisica —
# o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.4W Desktop Release — 1.0.214 no canal do updater (cards compactos, central de detalhes; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354w-compact-task-cards-details-1.0.214"
    paths:
      - ".github/workflows/desktop-release-f354w.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4W; run de build 30851077831 verde nos 2 jobs) ──
      RUN_ID: "30851077831"
      STABLE_SHA: "8ede593bfab27cb212b0502bbbcdaed3f9c81f74"
      TEST_BRANCH: "desktop/f354w-compact-task-cards-details-1.0.214"
      BASE_213_SHA: "e626d36921e269e28b74494ff51afb9c77f8d94d"
      BASE_211_SHA: "fe303b8ab9546ff00d0459b98e0e9eaab20dd8e2"
      TAG: "v1.0.214"
      TITLE: "Agenda ID Seven Desktop 1.0.214 — Cards Compactos e Central de Detalhes"
      ART_INST: "agenda-id-seven-desktop-1.0.214-installer"
      ART_INST_DIGEST: "sha256:9052cc23aaf206fcf411f756f6a5ca11b7787ff01c9b575ff7cf1d1d712cd991"
      ART_META: "agenda-id-seven-desktop-1.0.214-updatemeta"
      ART_META_DIGEST: "sha256:4a1daa950c8b28918cb76ca2149c994b4bf8119c09ead92a5a39dcb03eb62ea4"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.214-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.214-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.214-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "321a11261d62d455b1ae44ddb2346b2f6b0bfd0bd8f5440669955b68d52b52d9"
      EXP_MSI: "8cd5b7a4786bc09848603737e2c89be3224e48c56591dc698af405576e24ded4"
      EXP_LY: "7ffbdaeb01043dd032908b689b82bdb6ada171a7aeab98dcb1d4131c26b04f0f"
      EXP_BM: "511e1a15e53b0e8c6f27749dad4de7ee18723419f12dec000b47be9417463be5"
      EXP_SBOM: "5b65ed4b53c26fb156c9d4d489897600e53088865ef9e2d4b86927af542e1ac2"
      PROD_ROLLBACK_TAG: "v1.0.213"
      PROD_ROLLBACK2_TAG: "v1.0.211"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4W)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4W completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354w\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_213_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.213 ($CMP2)"; exit 1; }
          CMP3="$(gh api "repos/$REPO/compare/$BASE_211_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP3" = "ahead" ] || [ "$CMP3" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.211 ($CMP3)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.213/1.0.211 na linhagem"

      - name: "Gate 3 — release v1.0.214 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.214" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.214"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.214" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.214"; exit 1; }
          grep -q "1.0.214-compact-cards-details" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.214/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.214 — Cards Compactos e Central de Detalhes

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          O QUE MUDA vs 1.0.213 (F3.5.4W — cards compactos, central de detalhes, avatares e Social Medias)

          1) CARDS COMPACTOS — cada card do quadro deixa de listar todos os temas/legendas e passa a
             mostrar um RESUMO curto ("12 temas · 12 legendas", "8 vídeos/roteiros", "Legenda ·
             Observações"). O card tem altura controlada e NÃO cresce mais conforme a quantidade de
             temas — um card de 12 temas fica do mesmo tamanho de um de 3.

          2) CENTRAL DE DETALHES — ao abrir uma tarefa, a janela de detalhes agora é ampla e
             organizada: cada conteúdo vira um bloco numerado (TEMA/ROTEIRO/VÍDEO/CARD 01, 02, …) em
             acordeões que abrem e fecham, com botões "Expandir todos" / "Recolher todos". Os textos
             preservam parágrafos e quebras de linha; fecha com Esc; o foco é preso na janela e
             devolvido ao card ao fechar. A Edição de Cards mostra Legenda e Observações em blocos
             próprios.

          3) AVATARES DOS QUADROS — as fotos/iniciais da faixa superior (Designers e Social) não são
             mais cortadas: o ajuste foi feito no container (altura/rolagem/espaçamento), sem diminuir
             o avatar.

          4) SOCIAL MEDIAS — ao abrir a aba "Social Medias", o quadro aparece automaticamente (sem
             precisar clicar num nome): o app abre a última seleção válida, ou o seu próprio quadro,
             ou o primeiro em ordem alfabética. As colunas aparecem mesmo quando um quadro tem 0
             tarefas.

          PRESERVAÇÃO (provado pelos gates do app.asar no build)
          - Único arquivo alterado vs 1.0.213: o renderer (index.html). Processo principal, núcleo de
            autenticação e persistência/restauração de sessão (1.0.213), notificações comuns premium e
            de horário, alertas amarelo/vermelho, fila central, check-in, decisões, T-30/T-10, prazos,
            deduplicação, destinatários, recibos, sino, Minhas Prioridades, Monitor de SLA, watchdog,
            tray, atualizador, Card Premium, Cronograma, a quantidade personalizada de vídeos,
            backend, Firebase Rules/Functions/Worker e Android: INTOCADOS (byte-idênticos à 1.0.213).
          - Regras de negócio, schema e permissões: inalterados (a Central de Detalhes só LÊ dados já
            disponíveis; nada é gravado por estas mudanças).
          - Rollback imediato: 1.0.213 (baseline fisicamente aprovada). Rollback adicional: 1.0.211.

          IMPORTANTE: esta versão ainda DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows (conferir os
          cards compactos, a Central de Detalhes com acordeões e Esc/foco, os avatares sem corte e o
          quadro Social abrindo sozinho). A publicação apenas disponibiliza a atualização pelo
          mecanismo oficial; não constitui aprovação física.

          Procedência: run de build F3.5.4W 30851077831 (success; --publish never; jobs de verificação +
          Windows verdes, incluindo o Gate F3.5.4W EMPACOTADO no app.asar — resumo compacto sem nós de
          tema no DOM, .det-sheet ampliada + acordeões + Esc/foco, .f354-dstrip corrigido, Social
          auto-render por estado, e a stack de notificação/SLA/auth/persistência congelada byte vs
          1.0.213) @ commit 8ede593bfab27cb212b0502bbbcdaed3f9c81f74
          (branch desktop/f354w-compact-task-cards-details-1.0.214). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.214 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.214; 1.0.213 rollback imediato + 1.0.211 rollback adicional preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.214 no canal do updater (Latest); 1.0.213 rollback imediato; 1.0.211 rollback adicional preservadas ====="
