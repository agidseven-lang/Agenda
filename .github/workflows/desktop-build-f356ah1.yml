 por tarefa em cascata, campo lk preserva a chave crua) + MIGRACAO no workflowNotifier.ts (recibo legado aceito SOMENTE para eventos com at <= cursor capturado no start: o historico ja notificado pela 1.0.229 NAO re-entrega no upgrade; eventos novos nunca casam com recibo legado). PROVAS: RED de superficie FALHOU na 1.0.229 (aprovacao da 2a tarefa jamais chegou ao ingresso; head-of-line + recibo colidido) e ficou 8/8 VERDE com a correcao (S0 boot sem auto-notificacao; S1 cliente visualizou -> card real na premium sem som; S2 cliente APROVOU -> card real Temas aprovados com som unico na premium; S3 zero duplicacao em re-snapshots; S4 toast real focado da 2a tarefa; S5 nativa 0x); suite da fase 128/128 (com casos multi-tarefa RED->GREEN e migracao D10-D14); bateria herdada completa 32/32. Worker V64.61 INALTERADO (zero deploy nesta fase); infraestrutura de notificacoes 1.0.228 byte-identica (gates)."; echo "distribuicao: CANDIDATA — publicação no Latest ocorre no workflow desktop-release-f356ah1.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
