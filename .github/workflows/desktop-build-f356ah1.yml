        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão + HANDOFF H4 + VISIBILIDADE H3 + REFERÊNCIA H2 + herdados no app.asar (suítes contra o pacote)"
