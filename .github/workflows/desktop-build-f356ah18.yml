          grep -qF "if(_fat>0){ at=_fat; by=_fby||by; if(_fext&&_fby) byLabel=_fby; }" "$I"
          grep -qF "return {key:m.key,label:dispLabel,state:state,done:!!m.done,optional:!!m.optional,at:at,by:by,byLabel:byLabel};" "$I"
          grep -qF "<div class=\"det-tl-meta\">'+esc(meta)+'</div>" "$I"
          # >>> GATE CRÍTICO (fecha o furo da H17): RODA o TESTE DE RENDERIZAÇÃO H18 contra os BYTES EMPACOTADOS <<<
          F356AH18_SRC=asar-x/src/renderer/index.html F356AH18_PKG=asar-x/package.json node scripts/f356ah18-external-actor-final-render.test.mjs
          # H17 (C1..C4) + H16 (E1..E6) preservados no app.asar
