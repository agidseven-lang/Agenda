# F3.5.6A-H18 — Desktop 1.0.244 (renderizacao correta do ATOR EXTERNO no marco FINAL da timeline).
# Falha fisica 1.0.243 (Cronograma Teste 6, Detalhes, tarefa CONCLUIDA): marco final tinha "15:43" mas SEM
# "por Cliente". CAUSA (auditoria H18): o RESOLVER (taskTimeline) ja produzia by="Cliente" desde a 1.0.242,
# mas o RENDERER (opPanelBlock) resolvia m.by SO como UID de equipe (state.users.find) — "Cliente" e NOME
# literal externo, nao UID -> a busca falhava e "por Cliente" era descartado. Os testes da H17 so checavam a
# SAIDA do resolver e NUNCA renderizavam opPanelBlock (por isso verdes com o fisico vermelho).
# CORRECAO 1.0.244 (RENDERER-only, index.html): C1 taskTimeline marco 'concluido' emite byLabel SO p/ ator
# LITERAL externo (recordedBy vazio + clientFinalApprovedBy, ou clientReview.byName casado ao MESMO instante
# final); 'by' IDENTICO a 1.0.243; NAO infere label de UID; NAO reutiliza ator dos TEMAS. C2 opPanelBlock:
# who = byLabel ? byLabel : (by ? nome-em-state.users : ''); byLabel tem PRECEDENCIA; UID desconhecido e SEM
# byLabel => vazio (NUNCA UID cru); byLabel escapado via esc(meta). O gate app.asar RODA o teste de
# RENDERIZACAO H18 contra os BYTES EMPACOTADOS (fecha o furo de cobertura da H17). MUDANCA de producao =
# SOMENTE desktop/src/renderer/index.html. build GATED, --publish never. Publicacao no Latest so no
# desktop-release-f356ah18.yml (mesmos bytes). Base tecnica 1.0.243 (d954b9b). BASELINE FISICA 1.0.228.
# ROLLBACK IMEDIATO 1.0.228. slaRules.js byte-identico; Worker V64.61 INALTERADO.
name: "[push/manual] F3.5.6A-H18 — Desktop 1.0.244 (ator externo no marco final) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356ah18-external-actor-final-milestone-1.0.244"]
    paths-ignore: [".github/workflows/desktop-release-f356ah18.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356ah18-external-actor-final-milestone-1.0.244"
  BASE_243_SHA: "d954b9b2ffdbeecc8db73ae5837b33878c0a73a7"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.243 base técnica e da 1.0.228 baseline física)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_243_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSÃO 1.0.244 (package + lock x2 + marcador H18 + cadeia herdada H17..H12)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.244'){console.error('versão',p.version);process.exit(1);} for(const m of ['f356ah18-external-actor-final-milestone-render','postcompletion-write-guards','final-completed-precedence','nextaction-final-wait-text','timeline-step7-final-wait','timeline-honest-preenvio','final-state-premature-fix']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.244"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: "Gate MARCADORES H18 (contrato resolver+renderer) no renderer"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          C=$(grep -c 'F3.5.6A-H18' "$S"); [ "$C" -eq 2 ] || { echo "::error::esperados 2 marcadores H18, achei $C"; exit 1; }
          # C1 RESOLVER: proveniência _fext + byLabel só p/ ator literal externo; 'by' preservado (ramos 2/3)
          grep -qF "var _cr=wfLatestRound(t,'captions'); var _crr=_cr&&_cr.round; var _fat=0, _fby=null, _fext=false;" "$S"
          grep -qF "if(_crr.recordedBy){ _fby=_crr.recordedBy; _fext=false; }" "$S"
          grep -qF "else if(t.clientFinalApprovedBy){ _fby=t.clientFinalApprovedBy; _fext=true; }" "$S"
          grep -qF "if(_fat>0){ at=_fat; by=_fby||by; if(_fext&&_fby) byLabel=_fby; }" "$S"
          grep -qF "return {key:m.key,label:dispLabel,state:state,done:!!m.done,optional:!!m.optional,at:at,by:by,byLabel:byLabel};" "$S"
          # C2 RENDERER: byLabel tem precedência; by segue como UID; UID desconhecido s/ byLabel => vazio
          grep -qF "const who=m.byLabel?m.byLabel:(m.by?((state.users.find(u=>u.id===m.by)||{}).name||''):'');" "$S"
          # ESCAPING: byLabel entra via esc(meta) — nunca cru
          grep -qF "<div class=\"det-tl-meta\">'+esc(meta)+'</div>" "$S"
          # ORDEM: 'by' é atribuído ANTES de byLabel (byLabel nunca precede a semântica de by)
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const i=s.indexOf('if(_fat>0){ at=_fat; by=_fby||by; if(_fext&&_fby) byLabel=_fby; }');if(i<0){console.error('linha final do resolver ausente');process.exit(1);}console.log('H18 ordem by->byLabel OK');"
          echo "MARCADORES H18 (C1 resolver + C2 renderer + escaping): VERIFIED."
      - name: "Gate H17 (C1..C4) + H16 (E1..E6) PRESERVADOS + isTaskCompleted/isFullyComplete INALTERADOS"
        working-directory: desktop
        run: |
          set -euo pipefail
          S=src/renderer/index.html
          # H17 markers intactos (9)
          C=$(grep -c 'F3.5.6A-H17' "$S"); [ "$C" -eq 9 ] || { echo "::error::esperados 9 marcadores H17, achei $C"; exit 1; }
          grep -qF "if(_fat>0 && !_fby && t.clientReview && t.clientReview.status==='aprovado' && Number(t.clientReview.at)===Number(_fat)){" "$S"
          grep -qF "flashToast('Esta tarefa já foi concluída. O prazo está disponível apenas para consulta.'); return; }" "$S"
          grep -qF "canSeeAll(state.user)&&!(typeof isTaskCompleted==='function'&&isTaskCompleted(t)))" "$S"
          grep -qF "flashToast('Esta tarefa já foi concluída e não pode ser movimentada.'); return; }" "$S"
          MG=$(grep -cF "((typeof isTaskCompleted==='function'&&isTaskCompleted(t))?'':'<button" "$S"); [ "$MG" -eq 3 ] || { echo "::error::esperados 3 render-gates de Mover, achei $MG"; exit 1; }
          grep -qF "+svg('trash')+'Remover</button>':'')" "$S"
          # H16 E1..E6 intactos (6 marcadores)
          H16=$(grep -c 'F3.5.6A-H16' "$S"); [ "$H16" -eq 6 ] || { echo "::error::esperados 6 marcadores H16, achei $H16"; exit 1; }
          grep -qF "if(isTaskCompleted(t))return 'concluido';                             // F3.5.6A-H16: conclusão final tem PRECEDÊNCIA" "$S"
          grep -qF "carimbo do marco FINAL a partir da FONTE REAL" "$S"
          # isTaskCompleted / isFullyComplete NÃO tocados por H18
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const a=s.indexOf('function isTaskCompleted(t){');const b=s.indexOf('}',a);if(s.slice(a,b+1).includes('F3.5.6A-H18')){console.error('isTaskCompleted mutado por H18');process.exit(1);}console.log('isTaskCompleted INALTERADO');"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/renderer/index.html','utf8');const a=s.indexOf('function isFullyComplete(t){');const b=s.indexOf('}',s.indexOf('return !!(t.finalApprovalCompleted',a));const body=s.slice(a,b+1);if(!/if\(pendingProduction\(t\)\)return false;/.test(body)||!/if\(pendingStory\(t\)\)return false;/.test(body)){console.error('isFullyComplete: guardas duras ausentes');process.exit(1);}if(body.includes('F3.5.6A-H18')){console.error('isFullyComplete mutado por H18');process.exit(1);}console.log('isFullyComplete INALTERADO');"
          echo "H17 (C1..C4) + H16 (E1..E6) + predicados: PRESERVED."
      - name: "Gate SUÍTE H18 (RENDERER REAL, RED→GREEN) + suítes H17..H12 + F3.5.5* [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356ah18-external-actor-final-render.test.mjs
          node scripts/f356ah17-postcompletion-write-guards.test.mjs
          node scripts/f356ah16-final-completed-precedence.test.mjs
          node scripts/f356ah15-nextaction-final-text.test.mjs
          node scripts/f356ah14-timeline-step7-final-wait.test.mjs
          node scripts/f356ah13-timeline-preenvio.test.mjs
          node scripts/f356ah12-final-state-premature.test.mjs
          node scripts/f356ah10-team-session-recovery.test.mjs
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          node scripts/f332-panel.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="e89867de5120fe88e2f639effd59d24c3181f427" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUÍTES herdadas — notificações/handoff/visibilidade/referência + cadeia F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integração + regressão canônica (som/sessão)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate RED EMPACOTADO — CLIQUE REAL (H5) + H4 (caminho real) + H3 (token≠envio) GREEN em 1.0.244 — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          H5_VERSION=1.0.244 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah5-red-main.js
          H4_VERSION=1.0.244 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah4-red-main.js
          H3_VERSION=1.0.244 timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f356ah3-red-main.js
      - name: "Gate ISOLAMENTO — produção = SOMENTE index.html vs 1.0.243 (d954b9b); src/main INALTERADO; slaRules byte-idêntico; infra 1.0.228 congelada"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_243_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.243 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356ah18\.yml$|desktop/src/renderer/index\.html$|desktop/package(-lock)?\.json$|desktop/scripts/[A-Za-z0-9._-]+\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H18: $BAD"; exit 1; }
          git diff --quiet "$BASE_243_SHA"..HEAD -- desktop/src/main desktop/src/preload cloudflare-worker.js desktop/scripts/copy-renderer.js desktop/electron-builder.yml desktop/tsconfig.json functions android-native android-native-beta desktop/src/renderer/priorityEngine.js desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds || { echo "::error::mudança fora de index.html — H18 altera SOMENTE o renderer index.html"; exit 1; }
          CHG_MAIN=$(git diff --name-only "$BASE_243_SHA"..HEAD -- desktop/src/main || true)
          [ -z "$CHG_MAIN" ] || { echo "::error::src/main alterado (H18 não toca main): $CHG_MAIN"; exit 1; }
          git diff --quiet "$BASE_243_SHA"..HEAD -- desktop/src/main/slaRules.js || { echo "::error::slaRules.js alterado (paridade golden master exige byte-idêntico)"; exit 1; }
          git diff --quiet "$BASE_228_SHA"..HEAD -- desktop/src/main/bgNotify.ts desktop/src/main/notificationGrouping.ts desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/preload/bgnotify-preload.ts desktop/src/preload/slareminder-preload.ts desktop/src/preload/preload.ts desktop/electron-builder.yml desktop/tsconfig.json || { echo "::error::congelado 1.0.228 alterado"; exit 1; }
          echo "ISOLAMENTO H18: VERIFIED (index.html é o ÚNICO arquivo de produção alterado vs 1.0.243; slaRules INALTERADO; infra 1.0.228 congelada)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
