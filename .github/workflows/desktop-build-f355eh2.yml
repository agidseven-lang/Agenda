# "Abrir →" (clique/taskId/deep-link/teclado/aria preservados). Headroom do avatar = padding
# transparente no bounding (nada cortado; bgNotify.ts CONGELADO auto-dimensiona). ZERO mudança
# funcional (payload/dedupe/fila/caps/agrupamento/recibos/som 1.0.216/sino/permissões).
# PARIDADE byte-a-byte dos 9 builders nas 2 superfícies verificada por suíte própria (62).
name: "[push/manual] F3.5.5E-H2 — Desktop 1.0.226 (Notificação Premium na Referência do Owner) — Desktop Build"
"on":
  push:
    branches: ["desktop/f355eh2-reference-notification-1.0.226"]
    paths-ignore: [".github/workflows/desktop-release-f355eh2.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
