# Base de código 1.0.225 @ 24b76b5 (publicada no Latest; VISUALMENTE REPROVADA pelo owner —
# NÃO-baseline). BASELINE FÍSICA OFICIAL: 1.0.224 @ 0fcad3e5; ROLLBACK IMEDIATO 1.0.224;
# adicional 1.0.223; físico seguro 1.0.218. A imagem do owner É o conceito (nenhuma proposta
# criativa nova): AVATAR circular 62px FLUTUANTE parcialmente fora do card (~37% acima; ring
# 2px gradiente azul→violeta; micro-scale .98→1 sem bounce/glow), card radius 24 SEM barra
