          git merge-base --is-ancestor "$BASE_225_SHA" HEAD || { echo "::error::não descende da 1.0.225"; exit 1; }
          git merge-base --is-ancestor "$BASE_224_SHA" HEAD || { echo "::error::não descende da 1.0.224"; exit 1; }
          git merge-base --is-ancestor "$BASE_223_SHA" HEAD || { echo "::error::não descende da 1.0.223"; exit 1; }
          git merge-base --is-ancestor "$BASE_222_SHA" HEAD || { echo "::error::não descende da 1.0.222"; exit 1; }
          git merge-base --is-ancestor "$BASE_221_SHA" HEAD || { echo "::error::não descende da 1.0.221"; exit 1; }
          git merge-base --is-ancestor "$BASE_220_SHA" HEAD || { echo "::error::não descende da 1.0.220"; exit 1; }
          git merge-base --is-ancestor "$BASE_218_SHA" HEAD || { echo "::error::não descende da 1.0.218"; exit 1; }
          git merge-base --is-ancestor "$BASE_216_SHA" HEAD || { echo "::error::não descende da 1.0.216"; exit 1; }
      - name: "Gate VERSAO 1.0.226 (package + lock x2 + description da fase + cadeia de bases preservada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.226') process.exit(1); if(!/reference-notification/.test(p.description||'')) process.exit(1); if(!/f355eh1-ultra-premium-notifications/.test(p.description||'')) process.exit(1); if(!/retire-legacy-modules-premium-notifications/.test(p.description||'')) process.exit(1); if(!/custom-cronograma-quantity-universal-paste/.test(p.description||'')) process.exit(1); if(!/stale-alert-terminal-task-hotfix/.test(p.description||'')) process.exit(1); if(!/session-restore-boot-hotfix/.test(p.description||'')) process.exit(1); if(!/custom-script-quantity-rich-editor/.test(p.description||'')) process.exit(1);"
