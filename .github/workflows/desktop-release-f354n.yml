# =====================================================================
# F3.5.4N — Publicacao da Desktop 1.0.204 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.204 (F3.5.4N — 100% em producao; sem canal de teste/candidata/prerelease/fault-injection):
#   (1) INICIALIZACAO COM O WINDOWS: inicia automaticamente com o sistema, minimizado na bandeja
#       (default-ON de 1a execucao; "o SO e a verdade"; verify do estado real). UI em Configuracoes.
#   (2) AUTOCORRECAO DO CANAL DE NOTIFICACOES: o reconectador PRIMARIO segue no firebase.ts (re-attach
#       5s->60s, timer UNICO por colecao); o watchdog SO observa os sinais REAIS (attach/snapshot/error/
#       rearm) e, em falha SUSTENTADA, faz UM restart de ultimo recurso (single-active). Reconcile por
#       retorno de rede. Flag p/ desligar SO a autocorrecao. Diagnostico sanitizado. Alerta admin so
#       quando a autocorrecao FALHA. "Sem novos eventos" NUNCA e tratado como falha.
# TODO O RESTO byte-identico a 1.0.203: notificacoes comuns, tempos T-30/T-10, destinatarios,
# Card Premium/Cronograma/Monitor SLA/sino, lembrete central de SLA, updater e Android: INTOCADOS.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.4N 30664200367 (gated, verde nos 2 jobs; --publish
# never): NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests
# dos artifacts, 5 hashes SHA-256, tag v1.0.204 no head EXATO da branch. 6 assets: EXE, MSI, latest.yml,
# blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release Bot"
# (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# v1.0.203, v1.0.202, v1.0.201 e v1.0.200 permanecem PRESERVADAS (releases/tags intocadas).
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner vem depois, pelo atualizador.
# =====================================================================
name: "F3.5.4N Desktop Release — 1.0.204 no canal do updater (inicializacao Windows + autocorrecao; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f354n-windows-startup-self-healing-1.0.204"
    paths:
      - ".github/workflows/desktop-release-f354n.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.4N GO tecnico; run de build 30664200367 verde nos 2 jobs) ──
      RUN_ID: "30664200367"
      STABLE_SHA: "151cf6545d15fcfd8c4ed56b017fcc925957bbfd"
      TEST_BRANCH: "desktop/f354n-windows-startup-self-healing-1.0.204"
      BASE_203_SHA: "12abeefe547f57700c8faba07b512204c2d24dec"
      TAG: "v1.0.204"
      TITLE: "Agenda ID Seven Desktop 1.0.204 — Inicializacao com o Windows + Autocorrecao do Canal de Notificacoes"
      ART_INST: "agenda-id-seven-desktop-1.0.204-installer"
      ART_INST_DIGEST: "sha256:1d8587726cc4ed407dac9831d06a6e3d7f3a705111d9dce5d767ef9c218adbef"
      ART_META: "agenda-id-seven-desktop-1.0.204-updatemeta"
      ART_META_DIGEST: "sha256:8b09512a7ea9ccf132d43236342583e594d3c3f50c75a60e4bcde6c180425bae"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.204-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.204-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.204-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "72ab62f4a8a25f3a42c2ea9942915f5ac10f34fc852ce7aeb31ea50f42ee4da4"
      EXP_MSI: "6ce70e09b68c309784c25e1d5c7c63a4229b72480d4111782452a80203716f6a"
      EXP_LY: "ce731cc24d1e45249e19f10afd62b7b6521f8cb48e54aa85eb111d1cfbed565b"
      EXP_BM: "7d253406167575c1b181d251d8dd5326c08d35cedc3e911067266ec89ea18a78"
      EXP_SBOM: "096314d5b32084b4fea87ce349b7266cc5f8ee55373aecdfb831667ccb6bc57e"
      PROD_PREV_TAG: "v1.0.203"
      PROD_ROLLBACK_TAG: "v1.0.202"
      PROD_HIST_TAG: "v1.0.201"
      PROD_HIST2_TAG: "v1.0.200"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.4N)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.4N completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f354n\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          CMP2="$(gh api "repos/$REPO/compare/$BASE_203_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP2" = "ahead" ] || [ "$CMP2" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.203 ($CMP2)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; base 1.0.203 na linhagem"

      - name: "Gate 3 — release v1.0.204 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.204" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.204"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.204" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.204"; exit 1; }
          grep -q "1.0.204-windows-startup-self-healing" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.204/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.204 — Inicializacao com o Windows + Autocorrecao do Canal de Notificacoes

          Atualizacao disponibilizada pelo ATUALIZADOR INTERNO do app (Configuracoes ->
          Atualizacoes -> Verificar atualizacoes -> Baixar -> Instalar e reiniciar).
          NENHUM download manual e necessario.

          O QUE MUDA vs 1.0.203 (F3.5.4N)
          - INICIAR COM O WINDOWS: o Agenda passa a iniciar automaticamente junto com o Windows, ja
            minimizado na bandeja, sem roubar a tela. Ligado por padrao na primeira execucao desta versao;
            pode ser ligado/desligado em Configuracoes -> "Inicializacao com o Windows" (o app respeita a
            sua escolha e nao reativa sozinho depois). O estado real do registro do Windows e verificavel.
          - AUTOCORRECAO DO CANAL DE NOTIFICACOES: o app agora supervisiona a saude da conexao de
            notificacoes em tempo real e se recupera sozinho de falhas reais (por exemplo, quando o
            provedor encerra a assinatura em definitivo). A reconexao primaria continua sendo a ja
            existente; um supervisor age apenas como ultimo recurso, sem criar um segundo ciclo
            concorrente: um unico listener por usuario, uma unica reconexao por vez, a geracao antiga e
            encerrada antes da nova, sem reinicios simultaneos e sem notificacoes duplicadas depois de
            ficar offline, retornar da suspensao/bloqueio ou de um erro do provedor. "Sem novos eventos"
            (periodo tranquilo) NUNCA e tratado como falha.
          - CONTROLE E TRANSPARENCIA: em Configuracoes -> Notificacoes ha um diagnostico sanitizado
            (estado do canal, rede, reconexoes, iniciar-com-Windows) e uma chave para desligar SOMENTE a
            autocorrecao (a reconexao normal continua). O administrador so e avisado quando a autocorrecao
            realmente falha.

          PRESERVACAO (provado por gates no build)
          - Notificacoes comuns no canto inferior direito, alertas amarelos/vermelhos e o lembrete central
            de SLA (fila, promocao amarelo->vermelho, botao OK, som, persistencia), tempos T-30/T-10
            (Cronograma, Edicao de Video, Edicao de Cards), destinatarios, Monitor SLA, sino, Card Premium,
            Roteiro, atualizador, login/logout e Android: INTOCADOS. A entrega e a reconexao ja existentes
            no cliente permaneceram byte-preservadas (o supervisor apenas OBSERVA sinais reais, de forma
            aditiva). Rollback: 1.0.203, 1.0.202, 1.0.201 e 1.0.200 PRESERVADAS (releases e tags intactas).

          IMPORTANTE: esta versao ainda DEPENDE DE VALIDACAO FISICA do owner (reiniciar o Windows e
          confirmar o inicio automatico minimizado; e provocar uma queda/retorno real da conexao e
          confirmar a recuperacao sem duplicar notificacoes). A publicacao apenas disponibiliza a
          atualizacao pelo mecanismo oficial.

          Procedencia: run de build F3.5.4N 30664200367 (success; --publish never; gates de verificacao +
          Windows verdes, incluindo os 24 gates F3.5.4N no app.asar) @ commit
          151cf6545d15fcfd8c4ed56b017fcc925957bbfd (branch desktop/f354n-windows-startup-self-healing-1.0.204
          = tag v1.0.203 + commits da fase). Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.204 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.204; 1.0.203 prev + 1.0.202/1.0.201/1.0.200 preservadas)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PROD_PREV_TAG" "$PROD_ROLLBACK_TAG" "$PROD_HIST_TAG" "$PROD_HIST2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservacao/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.204 no canal do updater (Latest); 1.0.203/1.0.202/1.0.201/1.0.200 preservadas ====="

      - name: "Smoke do FEED DO UPDATER — exatamente o que o electron-updater consome (sem instalar)"
        run: |
          set -euo pipefail
          rm -rf smoke; mkdir -p smoke
          curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" -o smoke/latest.yml
          [ "$(sha256sum smoke/latest.yml | awk '{print $1}')" = "$EXP_LY" ] || { echo "::error::feed latest.yml hash divergente"; exit 1; }
          grep -q "version: 1.0.204" smoke/latest.yml || { echo "::error::feed sem version 1.0.204"; exit 1; }
          grep -qE "^path: $EXE_NAME" smoke/latest.yml || { echo "::error::feed sem path do EXE"; exit 1; }
          curl -fsSL -o smoke/"$EXE_NAME" "https://github.com/$REPO/releases/latest/download/$EXE_NAME"
          [ "$(sha256sum smoke/$EXE_NAME | awk '{print $1}')" = "$EXP_EXE" ] || { echo "::error::EXE do canal divergente"; exit 1; }
          curl -fsSL -o smoke/"$BM_NAME" "https://github.com/$REPO/releases/latest/download/$BM_NAME"
          [ "$(sha256sum smoke/$BM_NAME | awk '{print $1}')" = "$EXP_BM" ] || { echo "::error::blockmap do canal divergente"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' smoke/latest.yml | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "smoke/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do feed != EXE do feed"; exit 1; }
          echo "SMOKE DO UPDATER OK: 1.0.203/1.0.202 vao detectar/baixar a 1.0.204 (versao+path+sha512+blockmap integros). Nenhuma instalacao executada no CI."
