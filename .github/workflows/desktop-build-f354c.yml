# =====================================================================
# [push/manual] F3.5.4C — Desktop Build de TESTE (candidata 1.0.195 — card SaaS Premium)
# ---------------------------------------------------------------------
# Build da CANDIDATA DE TESTE 1.0.195 (rotulo: 1.0.195-card-saas-premium-test) sobre a base
# 1.0.194 OFICIAL (@f5a38a35, tag v1.0.194). Delta F3.5.4B (reprovacao fisica do card na 1.0.194):
#   - campo "por" exibe SO o PRIMEIRO NOME (helper kbv2FirstName; tooltip preserva nome completo);
#   - TODOS os temas no card (1->1, 4->4, 8->8, 12->12); "+N temas · ver em Detalhes" EXTINTO;
#   - cap CSS nth-child(n+3) REMOVIDO; SEM scroll interno nos temas/notas; card de ALTURA NATURAL
#     (max-height:none por cascata; literais CARD-FIT preservados como registro historico);
#   - TEMAS ampliado (13px, badge 20px, cabecalho com contagem) + hierarquia SaaS Premium
#     (bloco <style id="f354b-card-styles">); mesmos handlers data-* e mesmo kbv2Card nos 5 quadros.
# GATES ANTIGOS SUBSTITUIDOS (nao apagados silenciosamente): o gate do asar que EXIGIA a previa
# "+N temas" (grep kbv2-themes-more) foi INVERTIDO para exigir a AUSENCIA; suite f354-kanban-unified
# reancorada (40/40) com substituicao funcional explicita de S3/S4/S5 (contrato reprovado).
# Congelados byte-identicos a 1.0.194: main.ts, slaSeenUser.ts, TODA a Categoria B, nucleo duravel
# (notifier/notifierA/notifEvents/notifStore/toastAck/actorProfile/preloads/bgnotify), Card Premium
# e colagem fora do diff do renderer. Worker/Rules/Functions/Android intocados (gate de isolamento).
#
# Roda no PROPRIO ref (on: push desta branch de teste + workflow_dispatch): NENHUM commit em main.
# `--publish never`: NUNCA publica; NAO cria release/tag/stable/latest. Artefatos = artifacts
# PRIVADOS do run, exclusivamente para TESTE FISICO do owner. Producao 1.0.194 permanece intocada.
# =====================================================================
name: "[push/manual] F3.5.4C Desktop Build (candidata de TESTE 1.0.195 — card SaaS Premium)"
"on":
  push:
    branches:
      - "desktop/f354c-card-saas-premium-1.0.195-test"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_194_SHA: "f5a38a35934dd92203a87e76e23d267e18bd974c" # Desktop 1.0.194 OFICIAL (tag v1.0.194; base do delta F3.5.4B)
  TEST_BRANCH: "desktop/f354c-card-saas-premium-1.0.195-test"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (SHA do push nesta branch de teste; history completo p/ baselines)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA — branch de teste correta e descendente da 1.0.194 pinada
        run: |
          set -e
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error:: ref '${{ github.ref_name }}' != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_194_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.194 ($BASE_194_SHA)"; exit 1; }
          echo "ref=$TEST_BRANCH head=$(git rev-parse HEAD) base=$BASE_194_SHA OK"

      - name: Derivar versao — exige 1.0.195 exato, sem sufixo (candidata de teste; NAO producao)
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "versao=$APP_VERSION"
          [ "$APP_VERSION" = "1.0.195" ] || { echo "::error:: versao != 1.0.195"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido ($APP_VERSION)"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      - name: Gate F3.5.3 — notificacoes duraveis 37/37 + colagem 15/15
        working-directory: desktop
        run: |
          set -e
          node scripts/f353-durable-notifications.test.mjs || { echo "::error:: f353 duraveis vermelho"; exit 1; }
          node scripts/f353-paste-recovery.test.mjs || { echo "::error:: f353 colagem vermelho"; exit 1; }

      - name: Gate F3.5.3A — foto do ator 25/25 (resolvedor canonico + payload + notifierA ponta-a-ponta)
        working-directory: desktop
        run: |
          set -e
          node scripts/f353a-actor-photo.test.mjs || { echo "::error:: f353a foto do ator vermelho"; exit 1; }

      - name: Gate F3.5.4/B — Kanban unificado SaaS Premium 40/40 + Designers autoload 16/16 + notificacoes confiaveis 36/36
        working-directory: desktop
        run: |
          set -e
          node scripts/f354-kanban-unified.test.mjs || { echo "::error:: f354 kanban unificado (contrato F3.5.4B) vermelho"; exit 1; }
          node scripts/f354-designer-autoload.test.mjs || { echo "::error:: f354 designers autoload vermelho"; exit 1; }
          node scripts/f354-notifications-reliability.test.mjs || { echo "::error:: f354 notificacoes vermelho"; exit 1; }

      - name: Gate F3.5.2/A funcionais (notify + source-invariance/Card-Premium + recipient + substituicao + intervalo + packaging)
        working-directory: desktop
        run: |
          set -e
          for t in f352-cards-notify f352-cards-source-invariance f352-cards-recipient f352-cards-channel-substitution f352a-cards-interval; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate F3.5.2/A $t vermelho"; exit 1; }
          done
          echo "== f352-cards-packaging =="
          node scripts/f352-cards-packaging.mjs || { echo "::error:: gate de empacotamento cardsRules vermelho"; exit 1; }

      - name: Gate PRESERVACAO aplicavel (golden masters + canal/dedup/SLA/opblock/updater/bg/central/clock/baseline)
        working-directory: desktop
        run: |
          set -e
          for t in f343-sla-golden-master f344-flow-golden-master f345-sla-timestamp-golden-master \
                   f343-delivery-channel f343-preservation f341a-updater-state-machine \
                   f347-immediate-visual-delivery f347-independent-behavior f33F-bg-notify \
                   f343-main-scheduler f343-operational-block f33A-notif-central \
                   f3377a-r4b-http-date-clock f3311-baseline-freeze; do
            echo "== $t =="; node "scripts/$t.test.mjs" || { echo "::error:: gate de preservacao $t vermelho"; exit 1; }
          done
          echo "PRESERVACAO APLICAVEL: TODOS VERDES."

      - name: Gate CATEGORIA B — byte-identidade a 1.0.194 (T-30/T-10 intocadas)
        run: |
          set -e
          for f in desktop/src/main/slaRules.js desktop/src/main/cardsRules.js desktop/src/main/slaScheduler.ts \
                   desktop/src/main/bgNotify.ts desktop/src/main/tray.ts desktop/src/main/updaterService.ts \
                   desktop/src/main/firebase.ts desktop/src/main/reminder.ts; do
            D=$(git diff "$BASE_194_SHA" HEAD -- "$f" || true)
            [ -z "$D" ] || { echo "::error:: $f ALTERADO vs 1.0.194 (Categoria B deve ser byte-identica)"; exit 1; }
          done
          echo "CATEGORIA B: 8 arquivos byte-identicos a 1.0.194."

      - name: Gate SUPERFICIES CONGELADAS — main/pipeline de notificacao/preloads/bg byte-identicos a 1.0.194
        run: |
          set -e
          for f in desktop/src/main/main.ts desktop/src/main/slaSeenUser.ts desktop/src/renderer/bgnotify.html \
                   desktop/src/preload/preload.ts desktop/src/preload/bgnotify-preload.ts \
                   desktop/src/main/notifier.ts desktop/src/main/toastAck.ts desktop/src/main/notifStore.ts \
                   desktop/src/main/notifierA.ts desktop/src/main/notifEvents.js desktop/src/main/actorProfile.js; do
            D=$(git diff "$BASE_194_SHA" HEAD -- "$f" || true)
            [ -z "$D" ] || { echo "::error:: $f ALTERADO vs 1.0.194 (F3.5.4C e SO apresentacao do card no renderer)"; exit 1; }
          done
          echo "SUPERFICIES CONGELADAS: 11 arquivos byte-identicos a 1.0.194 (main, slaSeenUser, bg-window, preloads, notifier, ACK, store, notifierA, eventos, actorProfile)."

      - name: Gate COLAGEM — f353WirePasteRecovery fora do diff do renderer (-U0 = so linhas +/- reais)
        run: |
          set -e
          N=$(git diff -U0 "$BASE_194_SHA" HEAD -- desktop/src/renderer/index.html | grep -c "f353WirePasteRecovery" || true)
          [ "$N" = "0" ] || { echo "::error:: diff do index.html toca a colagem ($N linhas)"; exit 1; }
          echo "COLAGEM NA LEGENDA: fora do diff (0 mencoes nas linhas alteradas)."

      - name: Gate CARD PREMIUM — funcoes/regioes fora do diff do renderer (-U0 = so linhas +/- reais)
        run: |
          set -e
          # -U0: o helper kbv2FirstName foi inserido ADJACENTE ao inicio de kbv2Card, cujas 2 primeiras
          # linhas (INALTERADAS) citam isClientSector — com contexto default elas apareceriam na hunk
          # sem serem mudanca. O gate conta APENAS linhas realmente adicionadas/removidas.
          N=$(git diff -U0 "$BASE_194_SHA" HEAD -- desktop/src/renderer/index.html | grep -cE 'ensureReviewToken|ensureStableClientReviewToken|buildShareClientUrl|buildClientMessage|canSendToClient|openSendClientModal|clientReviewToken|og:image|/share/|isClientSector' || true)
          [ "$N" = "0" ] || { echo "::error:: diff do index.html toca Card Premium ($N linhas)"; exit 1; }
          echo "CARD PREMIUM: fora do diff (0 mencoes nas linhas alteradas)."

      - name: Gate SUITES SUPERADAS — preservadas byte-identicas (classificadas; nao rodadas como gate)
        run: |
          set -e
          for f in f333-notif f3377a-r3-single-producer-clock f33C-assignment-toast f33D-background-notif \
                   f33E-main-notifier f33K-notif-actor f33N-assign-baseline-fix f343-assignment-transition \
                   f343-preexisting-registry f344-repeated-move-contract f352d-cards-board-card-proportion; do
            P="desktop/scripts/$f.test.mjs"
            test -f "$P" || { echo "::error:: suite superada $f AUSENTE (proibido apagar)"; exit 1; }
            D=$(git diff "$BASE_194_SHA" HEAD -- "$P" || true)
            [ -z "$D" ] || { echo "::error:: suite superada $f ALTERADA (proibido reancorar)"; exit 1; }
          done
          echo "11 suites superadas: PRESERVADAS byte-identicas."

      - name: Gate NOVO CONTRATO DO CARD na FONTE (primeiro nome + todos os temas + sem ocultacao + cascata)
        run: |
          set -e
          H="desktop/src/renderer/index.html"
          # negativos (contrato antigo REPROVADO extinto)
          N=$(grep -c 'kbv2-themes-more' "$H" || true); [ "$N" = "0" ] || { echo "::error:: kbv2-themes-more ainda presente ($N)"; exit 1; }
          if grep -q 'nth-child(n+3)' "$H"; then echo "::error:: seletor de ocultacao nth-child(n+3) presente"; exit 1; fi
          if grep -E '\.kbv2-theme(-t)?\{[^}]*(line-clamp|text-overflow)' "$H" >/dev/null; then echo "::error:: clamp/ellipsis nos temas"; exit 1; fi
          # positivos (novo contrato)
          grep -q 'function kbv2FirstName' "$H" || { echo "::error:: helper kbv2FirstName ausente"; exit 1; }
          grep -qF "por <b>'+esc(kbv2FirstName(reqName))+'</b>" "$H" || { echo "::error:: campo 'por' nao usa kbv2FirstName"; exit 1; }
          grep -qF "title=\"'+esc('Enviado por '+reqName" "$H" || { echo "::error:: tooltip da origem sem o nome COMPLETO"; exit 1; }
          grep -q 'kbv2-themes-count' "$H" || { echo "::error:: contagem no cabecalho Temas ausente"; exit 1; }
          grep -q 'id="f354b-card-styles"' "$H" || { echo "::error:: bloco f354b-card-styles ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-column-body>.kbv2-card{ max-height:none; }' "$H" || { echo "::error:: altura natural (max-height:none) ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-card-themes>.kbv2-themes-list{ overflow-y:visible; min-height:auto; }' "$H" || { echo "::error:: override anti-scroll dos temas ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-card>.kbv2-card-notes{ overflow-y:visible; min-height:auto; }' "$H" || { echo "::error:: override anti-scroll das notas ausente"; exit 1; }
          # cascata: bloco f354b vem DEPOIS dos literais historicos CARD-FIT (pinados por suites antigas)
          H="$H" node -e 's=require("fs").readFileSync(process.env.H,"utf8");const a=s.indexOf("overflow-y:auto; overscroll-behavior:contain"),b=s.indexOf("id=\"f354b-card-styles\"");if(!(a>0&&b>a)){console.error("bloco f354b NAO vem depois do CARD-FIT");process.exit(1);}'
          # mesmos handlers e mesmo componente nos 5 quadros
          for a in 'data-detail=' 'data-move=' 'data-cardmenu=' 'data-resend=' 'data-del='; do
            grep -qF "$a" "$H" || { echo "::error:: handler $a ausente"; exit 1; }
          done
          C=$(grep -o 'kbv2BoardHtml(' "$H" | wc -l | tr -d ' '); [ "$C" -ge 6 ] || { echo "::error:: kbv2BoardHtml esperado em >=5 quadros + definicao, vi $C"; exit 1; }
          grep -q 'KanbanTaskCardUnified' "$H" || { echo "::error:: identidade KanbanTaskCardUnified ausente"; exit 1; }
          echo "NOVO CONTRATO DO CARD (fonte): VERIFIED"

      - name: Gate ISOLAMENTO — diff vs 1.0.194 SO nos arquivos autorizados F3.5.4B/C
        run: |
          set -e
          git diff --name-only "$BASE_194_SHA" HEAD | grep -vE '^(desktop/src/renderer/index\.html$|desktop/scripts/f354-kanban-unified\.test\.mjs$|desktop/scripts/f354b-visual-proof\.mjs$|desktop/package\.json$|desktop/package-lock\.json$|docs/F3\.5\.4B-|docs/f354b-visual/|\.github/workflows/desktop-build-f354c\.yml$)' | tee /tmp/outside.txt || true
          [ ! -s /tmp/outside.txt ] || { echo "::error:: mudanca FORA do escopo F3.5.4B/C (Android/Worker/Rules/Functions/main intocaveis)"; exit 1; }
          echo "OK: diff vs 1.0.194 contem SOMENTE os arquivos autorizados."

      - name: PROVAS VISUAIS — re-executar na candidata (Chromium headless; ANTES 1.0.194 × DEPOIS; gates 6/6)
        working-directory: desktop
        run: |
          set -e
          sudo mkdir -p /opt/pw-browsers && sudo chown "$USER" /opt/pw-browsers
          npm i --no-save playwright@1.56.1 --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium
          node scripts/f354b-visual-proof.mjs
          git diff --quiet -- package.json package-lock.json || { echo "::error:: instalacao do playwright alterou package.json/lock"; exit 1; }
          ls ../docs/f354b-visual/*.png | wc -l

      - name: Upload provas visuais (artifact PRIVADO)
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.195-test-visualproofs
          path: |
            docs/f354b-visual/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: "desktop"
    steps:
      - name: Forcar LF no checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate REF + ANCESTRIA (windows)
        run: |
          set -e
          git merge-base --is-ancestor "$BASE_194_SHA" HEAD || { echo "::error:: HEAD nao descende da base 1.0.194"; exit 1; }

      - name: Gate LINE ENDINGS LF
        run: |
          set -e
          FILES="desktop/src/renderer/index.html desktop/src/main/main.ts desktop/src/main/firebase.ts desktop/src/main/bgNotify.ts desktop/src/main/slaScheduler.ts desktop/src/main/cardsRules.js desktop/src/main/notifierA.ts desktop/src/main/notifStore.ts desktop/src/main/toastAck.ts desktop/src/main/notifEvents.js desktop/src/main/actorProfile.js desktop/src/main/slaSeenUser.ts"
          git ls-files --eol -- $FILES | tee "$RUNNER_TEMP/eol.txt"
          if grep -Eq 'w/(crlf|mixed)' "$RUNNER_TEMP/eol.txt"; then echo "::error:: CRLF/mixed em arquivo-chave"; exit 1; fi
          N=$(git ls-files --eol -- $FILES | wc -l | tr -d ' '); [ "$N" -ge 12 ] || { echo "::error:: esperados >=12, vi $N"; exit 1; }
          echo "LINE ENDINGS: LF CONFIRMED"

      - name: Derivar versao — exige 1.0.195 exato
        run: |
          APP_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          [ "$APP_VERSION" = "1.0.195" ] || { echo "::error:: versao != 1.0.195"; exit 1; }
          case "$APP_VERSION" in *-*) echo "::error:: versao com sufixo proibido"; exit 1;; esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate tray icon empacotado
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f "dist-installer/win-unpacked/resources/icon.png" || { echo "::error:: resources/icon.png AUSENTE"; exit 1; }
          echo "resources/icon.png OK"

      - name: Gate prova-de-versao (asar == 1.0.195) + renderer EMPACOTADO == fonte + F4.2F AUSENTE
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.195" ] || { echo "::error:: package.json EMPACOTADO version=$PKGV != 1.0.195"; exit 1; }
          EX="$EXDIR/src/renderer/index.html"; SRC="src/renderer/index.html"; test -f "$EX" || { echo "::error:: index.html ausente no asar"; exit 1; }
          EX="$EX" SRC="$SRC" node -e 'const fs=require("fs");const nrm=s=>String(s).replace(/\r\n/g,"\n");if(nrm(fs.readFileSync(process.env.EX,"utf8"))!==nrm(fs.readFileSync(process.env.SRC,"utf8"))){console.error("index.html EMPACOTADO != fonte");process.exit(1);}'
          echo "  index.html EMPACOTADO == fonte"
          test ! -f "$EXDIR/src/renderer/firebaseAuthBridge.js" || { echo "::error:: firebaseAuthBridge.js presente (F4.2F)"; exit 1; }
          for k in 'firebase-auth-compat' 'signInWithCustomToken' 'startFirebaseAuthBridge' 'DESKTOP_FIREBASE_AUTH'; do
            if grep -q "$k" "$EX"; then echo "::error:: '$k' presente no renderer (F4.2F)"; exit 1; fi
          done
          echo "GATE prova-de-versao 1.0.195 + renderer==fonte + F4.2F AUSENTE OK."

      - name: Gate F3.5.3/A + F3.5.4 EMPACOTADOS (nucleo duravel + actorProfile + slaSeenUser + autoload + retry + IPCs + colagem)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          for f in notifEvents.js notifierA.js notifStore.js toastAck.js actorProfile.js slaSeenUser.js; do
            test -f "$EXDIR/dist/main/$f" || { echo "::error:: dist/main/$f AUSENTE no app.asar"; exit 1; }
          done
          SRC_SHA=$(sha256sum src/main/notifEvents.js | awk '{print $1}' | tr -d '\\')
          ASAR_SHA=$(sha256sum "$EXDIR/dist/main/notifEvents.js" | awk '{print $1}' | tr -d '\\')
          [ "$SRC_SHA" = "$ASAR_SHA" ] || { echo "::error:: notifEvents.js empacotado != fonte"; exit 1; }
          SRCA_SHA=$(sha256sum src/main/actorProfile.js | awk '{print $1}' | tr -d '\\')
          ASARA_SHA=$(sha256sum "$EXDIR/dist/main/actorProfile.js" | awk '{print $1}' | tr -d '\\')
          [ "$SRCA_SHA" = "$ASARA_SHA" ] || { echo "::error:: actorProfile.js empacotado != fonte"; exit 1; }
          grep -q "require('./actorProfile')" "$EXDIR/dist/main/notifEvents.js" || { echo "::error:: notifEvents nao usa o resolvedor actorProfile"; exit 1; }
          grep -q 'actorPhotoDenorm' "$EXDIR/dist/main/notifEvents.js" || { echo "::error:: actorPhotoDenorm ausente do notifEvents"; exit 1; }
          grep -q 'actorAvatar: atorP.photo' "$EXDIR/dist/main/notifEvents.js" || { echo "::error:: payload sem actorAvatar vindo do resolvedor"; exit 1; }
          grep -q 'photo' "$EXDIR/dist/main/notifierA.js" || { echo "::error:: notifierA sem indexacao de foto do usersPublic"; exit 1; }
          MAINJS="$EXDIR/dist/main/main.js"
          grep -q 'notif-toast-ack' "$MAINJS" || { echo "::error:: IPC notif-toast-ack ausente"; exit 1; }
          grep -q 'clipboard-read-text' "$MAINJS" || { echo "::error:: IPC clipboard-read-text ausente"; exit 1; }
          grep -q 'startNotifierA' "$MAINJS" || { echo "::error:: notifierA nao ligado no main"; exit 1; }
          NJS="$EXDIR/dist/main/notifier.js"
          if grep -q '"tasks"' "$NJS"; then echo "::error:: notifier.js ainda escuta tasks (produtores antigos u1/u1b/u3)"; exit 1; fi
          grep -q '"events"' "$NJS" || { echo "::error:: event_new (Agenda) sumiu do notifier"; exit 1; }
          PRE="$EXDIR/dist/preload/preload.js"
          grep -q 'notifToastAck' "$PRE" || { echo "::error:: preload sem notifToastAck"; exit 1; }
          grep -q 'clipboardReadText' "$PRE" || { echo "::error:: preload sem clipboardReadText"; exit 1; }
          EXH="$EXDIR/src/renderer/index.html"
          grep -q 'f353WirePasteRecovery' "$EXH" || { echo "::error:: pipeline de colagem ausente no renderer"; exit 1; }
          grep -q 'notifToastAck' "$EXH" || { echo "::error:: ACK do toast ausente no renderer"; exit 1; }
          node -e 'const n=require(process.env.RUNNER_TEMP+"/asarx/dist/main/notifEvents.js"); for(const k of ["deriveTaskEvents","buildCategoryAPayload"]) if(typeof n[k]!=="function"){console.error(k+" nao exportada");process.exit(1);}'
          node -e 'const a=require(process.env.RUNNER_TEMP+"/asarx/dist/main/actorProfile.js"); for(const k of ["sanitizePhotoUrl","initialsOf","resolveNotificationActorProfile"]) if(typeof a[k]!=="function"){console.error(k+" nao exportada");process.exit(1);} if(a.sanitizePhotoUrl("javascript:alert(1)")!==""){console.error("sanitizePhotoUrl ACEITA javascript:");process.exit(1);} if(a.sanitizePhotoUrl("file:///c:/x.png")!==""){console.error("sanitizePhotoUrl ACEITA file:");process.exit(1);} if(a.sanitizePhotoUrl("https://exemplo.com/f.png")!=="https://exemplo.com/f.png"){console.error("sanitizePhotoUrl REJEITA https valida");process.exit(1);}'
          node -e 'const s=require(process.env.RUNNER_TEMP+"/asarx/dist/main/slaSeenUser.js"); if(typeof s.createUserSlaSeen!=="function"){console.error("createUserSlaSeen nao exportada");process.exit(1);}'
          grep -q 'createUserSlaSeen' "$MAINJS" || { echo "::error:: main.js sem injecao do seen POR USUARIO"; exit 1; }
          grep -q '_notifSeen.clear()' "$MAINJS" || { echo "::error:: main.js sem clear do dedup por sessao (C1)"; exit 1; }
          grep -q 'f354DesignerAutoPick' "$EXH" || { echo "::error:: renderer sem o autoload da tela Designers"; exit 1; }
          grep -q 'f354DesignerStrip' "$EXH" || { echo "::error:: renderer sem a faixa de selecao de Designers"; exit 1; }
          grep -q 'idseven.designerSel.v1' "$EXH" || { echo "::error:: renderer sem persistencia da selecao por usuario"; exit 1; }
          grep -q '_bootDelay' "$EXH" || { echo "::error:: renderer sem retry do bootstrap (C4)"; exit 1; }
          if grep -q "' kbv2-card--cards'" "$EXH"; then echo "::error:: variante --cards ainda emitida"; exit 1; fi
          echo "GATE F3.5.3/A + F3.5.4 EMPACOTADOS: VERIFIED"

      - name: Gate F3.5.4C EMPACOTADO — card SaaS Premium no app.asar (substitui o gate antigo da previa "+N temas")
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXH="$RUNNER_TEMP/asarx/src/renderer/index.html"
          # 1-3: helper + campo "por" com PRIMEIRO NOME + tooltip com nome completo
          grep -q 'function kbv2FirstName' "$EXH" || { echo "::error:: kbv2FirstName ausente no empacotado"; exit 1; }
          grep -qF "por <b>'+esc(kbv2FirstName(reqName))+'</b>" "$EXH" || { echo "::error:: campo 'por' empacotado nao usa kbv2FirstName"; exit 1; }
          grep -qF "title=\"'+esc('Enviado por '+reqName" "$EXH" || { echo "::error:: tooltip empacotado sem nome completo"; exit 1; }
          # 4-6: ocultacoes EXTINTAS (gate ANTIGO exigia kbv2-themes-more; SUBSTITUIDO pela ausencia)
          N=$(grep -c 'kbv2-themes-more' "$EXH" || true); [ "$N" = "0" ] || { echo "::error:: kbv2-themes-more presente no empacotado ($N)"; exit 1; }
          if grep -q 'nth-child(n+3)' "$EXH"; then echo "::error:: nth-child(n+3) presente no empacotado"; exit 1; fi
          if grep -E '\.kbv2-theme(-t)?\{[^}]*(line-clamp|text-overflow)' "$EXH" >/dev/null; then echo "::error:: clamp/ellipsis nos temas empacotados"; exit 1; fi
          # 7: todos os temas iterados (map SEM slice/cap na emissao)
          grep -qF "cron.list.map(c=>'<div class=\"kbv2-theme\">" "$EXH" || { echo "::error:: iteracao completa dos temas ausente"; exit 1; }
          if grep -qF "cron.list.slice(" "$EXH"; then echo "::error:: slice na lista de temas (cap reintroduzido)"; exit 1; fi
          # 8/10/12: altura natural + sem scroll interno efetivo (overrides f354b DEPOIS do CARD-FIT)
          grep -q 'id="f354b-card-styles"' "$EXH" || { echo "::error:: bloco f354b-card-styles ausente no empacotado"; exit 1; }
          grep -qF 'body.desktop .kbv2-column-body>.kbv2-card{ max-height:none; }' "$EXH" || { echo "::error:: max-height:none ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-card-themes>.kbv2-themes-list{ overflow-y:visible; min-height:auto; }' "$EXH" || { echo "::error:: anti-scroll dos temas ausente"; exit 1; }
          grep -qF 'body.desktop .kbv2-card>.kbv2-card-notes{ overflow-y:visible; min-height:auto; }' "$EXH" || { echo "::error:: anti-scroll das notas ausente"; exit 1; }
          EXH="$EXH" node -e 's=require("fs").readFileSync(process.env.EXH,"utf8");const a=s.indexOf("overflow-y:auto; overscroll-behavior:contain"),b=s.indexOf("id=\"f354b-card-styles\"");if(!(a>0&&b>a)){console.error("cascata invalida: f354b nao vem depois do CARD-FIT");process.exit(1);}'
          # 9/11: sem line-clamp na area de temas (acima) e sem filler artificial (esticamento neutralizado)
          grep -qF ':only-child{ flex:0 0 auto; min-height:auto; }' "$EXH" || { echo "::error:: neutralizacao do esticamento ausente"; exit 1; }
          # 13: mesmo componente nos 5 quadros
          C=$(grep -o 'kbv2BoardHtml(' "$EXH" | wc -l | tr -d ' '); [ "$C" -ge 6 ] || { echo "::error:: kbv2BoardHtml esperado >=6 ocorrencias (5 quadros + def), vi $C"; exit 1; }
          grep -q 'KanbanTaskCardUnified' "$EXH" || { echo "::error:: KanbanTaskCardUnified ausente"; exit 1; }
          # 14-18: handlers/data-attributes operacionais integros (Detalhes/Mover/menu/reenviar/excluir)
          for a in 'data-detail=' 'data-move=' 'data-cardmenu=' 'data-resend=' 'data-del=' 'data-menu-of=' 'kbv2-menu-it'; do
            grep -qF "$a" "$EXH" || { echo "::error:: '$a' ausente no empacotado"; exit 1; }
          done
          # contagem no cabecalho Temas
          grep -q 'kbv2-themes-count' "$EXH" || { echo "::error:: contagem do cabecalho Temas ausente"; exit 1; }
          echo "GATE F3.5.4C EMPACOTADO (card SaaS Premium): VERIFIED"

      - name: Gate cardsRules EMPACOTADO (SHA-256 == fonte; 1 copia; cardsEmissionsFor exportada)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"
          test -f "$EXDIR/dist/main/cardsRules.js" || { echo "::error:: dist/main/cardsRules.js AUSENTE no app.asar"; exit 1; }
          SRC_SHA=$(sha256sum src/main/cardsRules.js | awk '{print $1}' | tr -d '\\')
          ASAR_SHA=$(sha256sum "$EXDIR/dist/main/cardsRules.js" | awk '{print $1}' | tr -d '\\')
          echo "cardsRules.js SHA fonte=$SRC_SHA asar=$ASAR_SHA"
          [ "$SRC_SHA" = "$ASAR_SHA" ] || { echo "::error:: cardsRules.js empacotado != fonte"; exit 1; }
          N=$(find "$EXDIR" -name cardsRules.js | wc -l | tr -d ' '); [ "$N" = "1" ] || { echo "::error:: esperado 1 cardsRules.js, vi $N"; exit 1; }
          node -e 'const c=require(process.env.RUNNER_TEMP+"/asarx/dist/main/cardsRules.js"); if(typeof c.cardsEmissionsFor!=="function"){console.error("cardsEmissionsFor nao exportada");process.exit(1);}'
          grep -q 'require("./cardsRules")' "$EXDIR/dist/main/slaScheduler.js" || { echo "::error:: slaScheduler NAO require ./cardsRules"; exit 1; }
          echo "CARDS RULES PACKAGING: VERIFIED"

      - name: Gate FLAGS do updater no app.asar (estrutural; build de teste NAO publica)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          US="$RUNNER_TEMP/asarx/dist/main/updaterService.js"; test -f "$US" || { echo "::error:: updaterService.js ausente"; exit 1; }
          grep -Eq 'autoUpdater\.allowPrerelease[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowPrerelease != false"; exit 1; }
          grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"latest"' "$US" || { echo "::error:: channel != latest"; exit 1; }
          grep -Eq 'autoUpdater\.allowDowngrade[[:space:]]*=[[:space:]]*false' "$US" || { echo "::error:: allowDowngrade != false"; exit 1; }
          if grep -Eq 'autoUpdater\.channel[[:space:]]*=[[:space:]]*"canary"' "$US"; then echo "::error:: channel=canary"; exit 1; fi
          echo "GATE flags do updater OK (estrutura stable/latest; nada publicado)."

      - name: Gate identidade Windows (AppUserModelId + appId + close-to-tray)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          MAINJS="$RUNNER_TEMP/asarx/dist/main/main.js"
          grep -q 'br.com.idseven.agenda.desktop' "$MAINJS" || { echo "::error:: AppUserModelId ausente"; exit 1; }
          grep -q 'setAppUserModelId' "$MAINJS" || { echo "::error:: setAppUserModelId ausente"; exit 1; }
          grep -q 'preventDefault' "$MAINJS" || { echo "::error:: close-to-tray ausente"; exit 1; }
          grep -q 'appId: br.com.idseven.agenda.desktop' electron-builder.yml || { echo "::error:: appId divergente"; exit 1; }
          echo "GATE identidade Windows OK."

      - name: Inspecao de ASSINATURA Authenticode (paridade 1.0.194)
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $exe = (Get-ChildItem dist-installer -Filter 'Agenda-ID-Seven-Desktop-*-x64.exe' | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          "EXE: $exe"; "AuthenticodeStatus: $($sig.Status)"
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'NotSigned') { Write-Error "Status inesperado: $($sig.Status)"; exit 1 }
          "PARIDADE 1.0.194: mesmo processo (sem cert -> NotSigned)."

      - name: Gate metadata de update (latest.yml 1.0.195 + blockmap + app-update.yml sem segredo; NADA e publicado)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          LY="dist-installer/latest.yml"; test -f "$LY" || { echo "::error:: latest.yml NAO gerado"; ls -la dist-installer || true; exit 1; }
          if [ -f "dist-installer/canary.yml" ]; then echo "::error:: canary.yml gerado"; exit 1; fi
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap 2>/dev/null | head -1); test -n "$BM" || { echo "::error:: blockmap NAO gerado"; exit 1; }
          AU="dist-installer/win-unpacked/resources/app-update.yml"; test -f "$AU" || { echo "::error:: app-update.yml NAO empacotado"; exit 1; }
          EXE_PATH=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); EXE_NAME=$(basename "$EXE_PATH")
          grep -q "version: $APP_VERSION" "$LY" || { echo "::error:: latest.yml version != $APP_VERSION"; exit 1; }
          grep -qE "^path: $EXE_NAME" "$LY" || { echo "::error:: latest.yml path != $EXE_NAME"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "$LY" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "$EXE_PATH" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error:: sha512 do latest.yml != EXE"; exit 1; }
          grep -q "provider: github" "$AU" && grep -q "owner: agidseven-lang" "$AU" && grep -q "repo: Agenda" "$AU" || { echo "::error:: app-update.yml provider/owner/repo divergente"; exit 1; }
          if grep -qiE '(token|secret|password|pat)[[:space:]]*[:=][[:space:]]*[^[:space:]]' "$AU"; then echo "::error:: app-update.yml com possivel segredo"; exit 1; fi
          echo "GATE metadata OK: latest.yml 1.0.195 + app-update.yml github SEM segredo (arquivos ficam SO no artifact)."

      - name: SBOM (CycloneDX via npm sbom) + fallback
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null
          if [ ! -s "$RUNNER_TEMP/sbom-cyclonedx.json" ]; then npm ls --all --json > "$RUNNER_TEMP/sbom-cyclonedx.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/sbom-cyclonedx.json"; fi
          wc -c "$RUNNER_TEMP/sbom-cyclonedx.json"

      - name: Empacotar bundle (instalador + metadata + SBOM + hashes)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"
          cp "$RUNNER_TEMP/sbom-cyclonedx.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.195-card-saas-premium-test (CANDIDATA DE TESTE — nao e producao)"
            echo "channel     : latest (estrutura do updater; NADA publicado)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "baseline    : Desktop 1.0.194 OFICIAL (commit f5a38a35; tag v1.0.194 INTOCADA como Latest)"
            echo "origem      : F3.5.4B/C — card SaaS Premium: 'por' com primeiro nome (kbv2FirstName); TODOS os temas visiveis (sem '+N temas', sem cap, sem scroll interno); TEMAS ampliado; altura natural; handlers/data-* preservados; main/Categoria B/nucleo duravel byte-identicos a 1.0.194"
            echo "assinatura  : mesmo processo da 1.0.194 (sem code-signing -> NotSigned)"
            echo "distribuicao: CANDIDATA DE TESTE PRIVADA — SEM release, SEM tag, SEM stable/latest, SEM deploy; somente artifact p/ teste fisico do owner"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload installer (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.195-test-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload metadata + SBOM + hashes (artifact PRIVADO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.195-test-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
