# =====================================================================
# F3.5.6A-H18 — Publicacao da Desktop 1.0.244 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# A 1.0.243 (H17) fechou 3 residuos pos-conclusao, mas o ATOR "por Cliente" ainda NAO aparecia no marco
# final da timeline (falha fisica). CAUSA (auditoria H18): o resolver (taskTimeline) ja produzia
# by="Cliente" desde a 1.0.242, mas o RENDERER (opPanelBlock) resolvia m.by SO como UID de equipe
# (state.users.find) — "Cliente" e NOME literal externo, nao UID -> "por Cliente" era descartado. CORRECAO
# 1.0.244 renderer-only (index.html): taskTimeline marco 'concluido' emite byLabel p/ ator LITERAL externo
# (recordedBy vazio + clientFinalApprovedBy, ou clientReview.byName casado ao MESMO instante final); 'by'
# IDENTICO a 1.0.243. opPanelBlock: who = byLabel ? byLabel : (by ? nome-em-state.users : ''); byLabel tem
# precedencia; UID desconhecido s/ byLabel => vazio (NUNCA UID cru); byLabel escapado via esc(meta). O gate
# app.asar RODOU o teste de RENDERIZACAO H18 contra os BYTES EMPACOTADOS (fecha o furo de cobertura da H17).
# H16/H17-C2/C3/C4/isTaskCompleted/slaRules.js/Worker V64.61 INALTERADOS. Distribuida EXCLUSIVAMENTE pelo
# updater. USA os BYTES do run de build F3.5.6A-H18 31442317849 (gated, verde nos 2 jobs; --publish never):
# NAO RECOMPILA — baixa os 2 artifacts e publica os MESMOS bytes. TUDO PINADO: run id, digests, 5 hashes
# SHA-256, tag v1.0.244 no head EXATO. ESCRITAS so via GitHub App "Agenda ID Seven Release Bot".
# baseline fisica 1.0.228; ROLLBACK IMEDIATO 1.0.228.
# =====================================================================
name: "F3.5.6A-H18 Desktop Release — 1.0.244 no canal do updater (ator externo no marco final; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f356ah18-external-actor-final-milestone-1.0.244"
    paths:
      - ".github/workflows/desktop-release-f356ah18.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.6A-H18; do run de build verde 31442317849) ──
      RUN_ID: "31442317849"
      STABLE_SHA: "28a081ca44dc5445a40fd28b7be3fe6e55b96ca4"
      TEST_BRANCH: "desktop/f356ah18-external-actor-final-milestone-1.0.244"
      BASE_243_SHA: "d954b9b2ffdbeecc8db73ae5837b33878c0a73a7"
      BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
      TAG: "v1.0.244"
      TITLE: "Agenda ID Seven Desktop 1.0.244 — autor externo (Cliente) no marco final da timeline (pelo updater)"
      ART_INST: "agenda-id-seven-desktop-1.0.244-installer"
      ART_INST_DIGEST: "sha256:0f7f95e34c9d72553b84d037b94c43872fb986804635fa7863f4f3fab64ad7a1"
      ART_META: "agenda-id-seven-desktop-1.0.244-updatemeta"
      ART_META_DIGEST: "sha256:e18cd5e0130c967b8fb25001c37f303fb68e0ec5cb89a372ae0e12097297c125"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.244-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.244-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.244-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "e1210ba537e158b7f637dcdc1f9bbee17925cdadce5eb1de8198f29d4e2ef92f"
      EXP_MSI: "6aefdf5f48e997cf2ff4c9c31dc402d85b86c4784647d422c0026fd9eb91a5b9"
      EXP_LY: "4c72ff71f1fba259772e13ff3d87ce5d8bf9b3f26442ad7cbb6631776dc37069"
      EXP_BM: "9e35f8fab7e99a8935d014d6a180a9d450b7e7b3b0f14d6ded00ad27a2d92207"
      EXP_SBOM: "fc4c6393dfaf24178134e295dff3b7bd44eee7aa5cb7ee22da89e95cdf6acb38"
      PREV_LATEST_TAG: "v1.0.243"
      PRES_242_TAG: "v1.0.242"
      PRES_241_TAG: "v1.0.241"
      PRES_240_TAG: "v1.0.240"
      PRES_238_TAG: "v1.0.238"
      PRES_236_TAG: "v1.0.236"
      PRES_234_TAG: "v1.0.234"
      PRES_232_TAG: "v1.0.232"
      PRES_230_TAG: "v1.0.230"
      PRES_228_TAG: "v1.0.228"
      PROD_ROLLBACK_TAG: "v1.0.223"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.6A-H18)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.6A-H18 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release; insumos de build intactos; bases na linhagem"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f356ah18\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          for B in "$BASE_243_SHA" "$BASE_228_SHA"; do
            C="$(gh api "repos/$REPO/compare/$B...$STABLE_SHA" --jq '.status')"
            { [ "$C" = "ahead" ] || [ "$C" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende de $B ($C)"; exit 1; }
          done
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.243/1.0.228 na linhagem"

      - name: "Gate 3 — release v1.0.244 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.244" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.244"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.244" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.244"; exit 1; }
          grep -q "1.0.244-f356ah18-external-actor-final-milestone-render" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.244/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.244 — autor externo (Cliente) no marco final da linha do tempo (pelo atualizador interno)

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).

          Continuação da 1.0.243. Correção pontual e de baixo risco: SÓ o texto do autor no marco final.

          O QUE MUDA vs 1.0.243 (SÓ o renderer index.html):
          - Linha do tempo operacional: o marco "Aprovado final / Concluído" agora mostra também o AUTOR
            externo real da aprovação — "por Cliente" — ao lado do horário. Antes, o horário aparecia
            (ex.: "15:43") mas o "por Cliente" sumia, porque a tela tentava resolver o autor como se fosse
            um membro da equipe (por ID interno), e "Cliente" é um NOME, não um ID.
          - Agora: autores da EQUIPE continuam sendo resolvidos pelo ID (mostra o 1º nome, como antes);
            o autor EXTERNO ("Cliente") é exibido diretamente pelo nome. Autor interno desconhecido (sem
            nome) continua NÃO aparecendo — nunca é mostrado um código/ID cru. O texto do autor é sempre
            escapado (nunca vira HTML).

          O QUE NÃO MUDA (preservado; garantido por gate):
          - o horário do marco final (ex.: 15:43) e a fonte da aprovação continuam idênticos; a timeline
            (H14/H16), a tela Detalhes concluída (H16), o SLA somente leitura e o bloqueio de mover após
            concluir (H17), o "Remover", isTaskCompleted/isFullyComplete, notificações 1.0.228, slaRules.js
            e o Worker V64.61 seguem INALTERADOS. O autor dos TEMAS nunca é reaproveitado no marco final.
          Delta de produção vs 1.0.243: SOMENTE desktop/src/renderer/index.html.

          COMO VALIDAR (reutilize o Cronograma Teste 6, já concluído):
          Detalhes -> Linha do tempo operacional -> o marco final deve mostrar
          "Aprovado final / Concluído · 10/08/2026 às 15:43 · há X · por Cliente · OK".
          Confira também que seguem: SLA sem "Editar prazo"; sem "Mover status"; "Remover" disponível.
          Em caso de problema: ROLLBACK IMEDIATO v1.0.228.

          Procedencia: run de build F3.5.6A-H18 31442317849 (success; --publish never; verify + Windows
          verdes). Destaque: o gate do app.asar RODOU o TESTE DE RENDERIZACAO H18 (opPanelBlock real)
          contra os BYTES EMPACOTADOS — o HTML gerado contem "por Cliente" — fechando o furo de cobertura
          da H17 (cujos testes so verificavam a saida do resolver, nunca renderizavam). Nova suite
          f356ah18-external-actor-final-render (RED na 1.0.243 -> GREEN 37/0 na 1.0.244); regressao
          simetrica base x candidata = ZERO PASS->FAIL; isolamento: delta de producao SO em index.html.
          @ commit 28a081ca44dc5445a40fd28b7be3fe6e55b96ca4
          (branch desktop/f356ah18-external-actor-final-milestone-1.0.244). Mesmos bytes; sem recompilar.
          Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.244 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.244; 1.0.243/242/241/240/238/236/234/232/230/228 preservadas; rollback 1.0.223 preservado)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_242_TAG" "$PRES_241_TAG" "$PRES_240_TAG" "$PRES_238_TAG" "$PRES_236_TAG" "$PRES_234_TAG" "$PRES_232_TAG" "$PRES_230_TAG" "$PRES_228_TAG" "$PROD_ROLLBACK_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.244 (ator externo no marco final) no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.228; 1.0.243/242/241/240/238/236/234/232/230/228 preservadas ====="
