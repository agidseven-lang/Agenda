# F3.5.6B-H1 — Desktop 1.0.245 (dedupe da notificacao de ATRIBUICAO ao Designer).
# Falha fisica "A3" (F3.5.6B, Cronograma Teste 7): ao atribuir uma tarefa a um Designer, o Designer
# recebia DUAS notificacoes — a CANONICA e superior "Tarefa atribuida" (Categoria A legada,
# notifEvents.task_assigned, derivada do campo designerAssignment) E uma SEGUNDA "Nova atribuicao"
# (workflow, WF_POLICY[DESIGNER_ASSIGNED]). A acao de atribuicao grava 2 produtores no MESMO instante.
# CORRECAO 1.0.245 (1 arquivo de producao: desktop/src/main/workflowEvents.js): REMOVER a entrada
# DESIGNER_ASSIGNED de WF_POLICY -> wfRecipientOk=false e buildWorkflowPayload=null (o consumidor filtra
# antes do ingresso, sem recibo/cursor/retry), exatamente como *_APPROVAL_REQUESTED/WORKFLOW_COMPLETED.
# PRESERVADO: "Tarefa atribuida" (task_assigned) intacta; ledger ev_dassign_/DESIGNER_ASSIGNED segue
# gravado e derivado (observabilidade/timeline); demais eventos do workflow notificam; renderer,
# notifEvents.js, workflowNotifier.ts, deliverNotification, Worker V64.61 e infra 1.0.228 INTOCADOS;
# slaRules.js byte-identico. build GATED, --publish never. Publicacao no Latest so no
# desktop-release-f356bh1.yml (mesmos bytes). Base 1.0.244 (28a081c). BASELINE FISICA OFICIAL 1.0.244.
# ROLLBACK IMEDIATO 1.0.228.
name: "[push/manual] F3.5.6B-H1 — Desktop 1.0.245 (dedupe atribuicao Designer) — Desktop Build"
"on":
  push:
    branches: ["desktop/f356bh1-designer-assigned-dedupe-1.0.245"]
    paths-ignore: [".github/workflows/desktop-release-f356bh1.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f356bh1-designer-assigned-dedupe-1.0.245"
  BASE_244_SHA: "28a081ca44dc5445a40fd28b7be3fe6e55b96ca4"
  BASE_230_SHA: "e89867de5120fe88e2f639effd59d24c3181f427"
  BASE_228_SHA: "3f0d0af192b4b6b32a8e8bbda4153dcf4df1bc6d"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.244 base + da 1.0.228 baseline fisica)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          for B in "$BASE_244_SHA" "$BASE_228_SHA"; do
            git merge-base --is-ancestor "$B" HEAD || { echo "::error::não descende de $B"; exit 1; }
          done
      - name: "Gate VERSAO 1.0.245 (package + lock x2 + marcador H1 + cadeia herdada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.245'){console.error('versão',p.version);process.exit(1);} for(const m of ['f356bh1-designer-assigned-dedupe','f356ah18-external-actor-final-milestone-render','postcompletion-write-guards','final-completed-precedence','durable-diag-honest-timeline','custom-script-quantity-rich-editor']){ if(!(p.description||'').includes(m)){console.error('marcador ausente:',m);process.exit(1);} }"
          [ "$(grep -c '"version": "1.0.245"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers (vm.Script) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK:',b.length);"
          node --check ../cloudflare-worker.js
      - name: "npm run build (tsc + copy-renderer: workflowEvents.js -> dist/main)"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
          test -f dist/main/workflowEvents.js
          test -f dist/main/notifEvents.js
          test -f dist/main/workflowNotifier.js
      - name: "Gate CONTRATO H1 (workflowEvents.js): DESIGNER_ASSIGNED fora de WF_POLICY; no-policy => sem entrega"
        working-directory: desktop
        run: |
          set -euo pipefail
          WE=src/main/workflowEvents.js
          # DESIGNER_ASSIGNED NAO esta mais na tabela de politica (nem no dist copiado)
          ! grep -qE "^\s*DESIGNER_ASSIGNED:\s*\{ aud: 'designer_ru'" "$WE" || { echo "::error::DESIGNER_ASSIGNED ainda em WF_POLICY (fonte)"; exit 1; }
          ! grep -qE "^\s*DESIGNER_ASSIGNED:\s*\{ aud: 'designer_ru'" dist/main/workflowEvents.js || { echo "::error::DESIGNER_ASSIGNED ainda em WF_POLICY (dist)"; exit 1; }
          # comentario da correcao presente
          grep -qF "F3.5.6B-H1 — DESIGNER_ASSIGNED SAIU da tabela" "$WE"
          # o gate no-policy do motor esta intacto (wfRecipientOk/buildWorkflowPayload retornam false/null)
          grep -qF "var pol = WF_POLICY[ev.type]; if (!pol) return false;" "$WE"
          grep -qF "var pol = WF_POLICY[ev.type]; if (!pol) return null;" "$WE"
          # WF_POLICY tem EXATAMENTE 10 entradas (11 - DESIGNER_ASSIGNED)
          node -e "const w=require('./src/main/workflowEvents.js'); const k=Object.keys(w.WF_POLICY); if(k.length!==10||k.includes('DESIGNER_ASSIGNED')){console.error('WF_POLICY inesperada:',k);process.exit(1);} console.log('WF_POLICY OK (10):',k.join(','));"
          echo "CONTRATO H1 (workflowEvents.js): VERIFIED."
      - name: "Gate CONGELADOS — renderer/notifEvents/workflowNotifier/slaRules byte-identicos a 1.0.244; infra 1.0.228; Worker"
        run: |
          set -euo pipefail
          # H1 NAO toca: renderer, notifEvents.js (produtor legado canonico), workflowNotifier.ts (consumidor),
          # slaRules.js (golden master), Worker, e toda a infra congelada da 1.0.228.
          git diff --quiet "$BASE_244_SHA"..HEAD -- \
            desktop/src/renderer/index.html \
            desktop/src/main/notifEvents.js \
            desktop/src/main/workflowNotifier.ts \
            desktop/src/main/slaRules.js \
            desktop/src/main/notifierA.ts \
            cloudflare-worker.js \
            desktop/src/main/bgNotify.ts \
            desktop/src/main/notificationGrouping.ts \
            desktop/src/renderer/bgnotify.html \
            desktop/src/renderer/slareminder.html \
            desktop/src/preload/preload.ts \
            desktop/electron-builder.yml \
            desktop/tsconfig.json \
            desktop/scripts/copy-renderer.js \
            || { echo "::error::arquivo congelado alterado (H1 só toca workflowEvents.js)"; exit 1; }
          echo "CONGELADOS (renderer/notifEvents/workflowNotifier/slaRules/Worker/infra 1.0.228): VERIFIED."
      - name: "Gate SUITE H1 (RED->GREEN dedupe) + orquestracao + suites F3.5.6A/F3.5.5* [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f356bh1-designer-assigned-dedupe.test.mjs
          node scripts/f356a-workflow-orchestration.test.mjs
          node scripts/f356ah18-external-actor-final-render.test.mjs
          node scripts/f356ah17-postcompletion-write-guards.test.mjs
          node scripts/f356ah16-final-completed-precedence.test.mjs
          node scripts/f356ah15-nextaction-final-text.test.mjs
          node scripts/f356ah14-timeline-step7-final-wait.test.mjs
          node scripts/f356ah13-timeline-preenvio.test.mjs
          node scripts/f356ah12-final-state-premature.test.mjs
          node scripts/f356ah10-team-session-recovery.test.mjs
          node scripts/f356ah8-durable-diagnostic.test.mjs
          node scripts/f356ah8-honest-timeline.test.mjs
          node scripts/f356ah4-single-source-real-path.test.mjs
          node scripts/f356ah3-single-source-sent-state.test.mjs
          node scripts/f344-flow-golden-master.test.mjs
          node scripts/f332-panel.test.mjs
          H2_BASE_228="$BASE_228_SHA" H2_BASE_230="$BASE_230_SHA" node scripts/f356ah2-client-approvals.test.mjs
      - name: "Gate SUITES herdadas — notificacoes/handoff/visibilidade/referencia + F3.5.5* + central [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355eh4-grouped-notification-handoff.test.mjs
          node scripts/f355eh3-global-notification-visibility.test.mjs
          node scripts/f355eh2-reference-notification.test.mjs
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
      - name: "Gate herdado — rich editor + agenda + notas + integracao + regressao canonica (som/sessao)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
          node scripts/f355b-agenda-premium.test.mjs
          node scripts/f355ah1-internal-notes.test.mjs
          node scripts/f355a-integration.test.mjs
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate ISOLAMENTO — producao = SOMENTE workflowEvents.js vs 1.0.244 (28a081c); renderer/main/worker INALTERADOS"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_244_SHA"..HEAD > /tmp/delta.txt; echo "== DELTA vs 1.0.244 =="; cat /tmp/delta.txt
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f356bh1\.yml$|desktop/src/main/workflowEvents\.js$|desktop/package(-lock)?\.json$|desktop/scripts/[A-Za-z0-9._-]+\.test\.mjs$)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist H1: $BAD"; exit 1; }
          # producao (src/): SOMENTE workflowEvents.js
          SRC_CHG=$(git diff --name-only "$BASE_244_SHA"..HEAD -- desktop/src | grep -vE '^desktop/src/main/workflowEvents\.js$' || true)
          [ -z "$SRC_CHG" ] || { echo "::error::producao fora de workflowEvents.js: $SRC_CHG"; exit 1; }
          echo "ISOLAMENTO H1: VERIFIED (workflowEvents.js é o ÚNICO arquivo de producao alterado vs 1.0.244)."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versao 1.0.245 + DESIGNER_ASSIGNED fora de WF_POLICY no app.asar + SUITE H1 contra os BYTES EMPACOTADOS"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.245') process.exit(1);"
          WE=asar-x/dist/main/workflowEvents.js; test -f "$WE"
          # >>> GATE CRITICO: nos BYTES EMPACOTADOS, DESIGNER_ASSIGNED NAO esta em WF_POLICY <<<
          ! grep -qE "^\s*DESIGNER_ASSIGNED:\s*\{ aud: 'designer_ru'" "$WE" || { echo "::error::DESIGNER_ASSIGNED em WF_POLICY no app.asar"; exit 1; }
          node -e "const w=require('./asar-x/dist/main/workflowEvents.js'); const k=Object.keys(w.WF_POLICY); if(k.length!==10||k.includes('DESIGNER_ASSIGNED')){console.error('WF_POLICY empacotada inesperada:',k);process.exit(1);}"
          # produtor legado canonico e consumidor presentes e intocados nos bytes empacotados
          test -f asar-x/dist/main/notifEvents.js && test -f asar-x/dist/main/workflowNotifier.js
          # >>> RODA a SUITE H1 (RED->GREEN) contra os MODULOS EMPACOTADOS: prova 1 unica entrega ao Designer <<<
          # LOCK usa o package-lock.json da FONTE (nao empacotado no asar); os modulos WE/NOTIF/WN e o PKG vem dos BYTES EMPACOTADOS.
          F356BH1_WE=asar-x/dist/main/workflowEvents.js F356BH1_NOTIF=asar-x/dist/main/notifEvents.js F356BH1_PKG=asar-x/package.json F356BH1_WN=asar-x/dist/main/workflowNotifier.js node scripts/f356bh1-designer-assigned-dedupe.test.mjs
          echo "GATE F3.5.6B-H1 EMPACOTADO (DESIGNER_ASSIGNED fora + 1 entrega ao Designer nos bytes reais): VERIFIED."
      - name: Empacotar bundle + SHA256SUMS + VERSAO-DESKTOP
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1); MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi | head -1); BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$MSI" "$BM" dist-installer/latest.yml "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$(basename "$MSI"); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" "$MSI_NAME" latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          { echo "productName : Agenda ID Seven Desktop"; echo "versionName : 1.0.245"; echo "rotulo      : 1.0.245-f356bh1-designer-assigned-dedupe (dedupe da notificacao de atribuicao ao Designer — pelo updater interno)"; echo "channel     : latest (NADA publicado neste build)"; echo "appId       : br.com.idseven.agenda.desktop"; echo "instalador  : $EXE_NAME"; echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"; echo "instalador2 : $MSI_NAME"; echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"; echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"; echo "base-codigo : Desktop 1.0.244 (28a081c). BASELINE FISICA OFICIAL 1.0.244. ROLLBACK imediato 1.0.228 (3f0d0af1)."; echo "origem      : F3.5.6B-H1 — dedupe da notificacao de atribuicao ao Designer (1 arquivo: desktop/src/main/workflowEvents.js): DESIGNER_ASSIGNED removido de WF_POLICY -> zero toast por essa via; 'Tarefa atribuida' (task_assigned legado) preservada; ledger ev_dassign_ segue gravado. renderer/notifEvents/workflowNotifier/slaRules/Worker V64.61/infra 1.0.228 INALTERADOS."; echo "distribuicao: pelo updater interno; publicacao no Latest ocorre no workflow desktop-release-f356bh1.yml (mesmos bytes)"; } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.245-installer, path: "dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-id-seven-desktop-1.0.245-updatemeta, path: "dist-pkg/latest.yml\ndist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap\ndist-pkg/SHA256SUMS\ndist-pkg/SBOM-cyclonedx.json\ndist-pkg/VERSAO-DESKTOP.txt", if-no-files-found: error, retention-days: 30 }
