# =====================================================================
# [manual] F3.3.21-B3.41 — Reset CONTROLADO da senha do usuario CANARIO. PREP + gate.
# Roda scripts/worker-ops/f3321-b341a-canary-password-reset.e2e.mjs (de main).
#   DRY-RUN / PREP (PADRAO): valida alvo==canario + escopo 1 usuario; NAO conecta no
#     Firestore, NAO escreve, NAO usa credencial, NAO imprime senha/hash/salt/segredo.
#   APPLY (fase posterior, autorizada): reseta SOMENTE o doc do canario, gravando
#     pass/salt no MESMO formato do app. NAO e executado nesta fase (defaults seguros
#     mantem DRY-RUN).
# EXECUCAO/APPLY bloqueado por padrao. RECUSA confirm errado / target != canario /
# max_users != 1 / hosting_publish=true / fcm_token_server=true / (APPLY sem secret de
# senha ou sem service account). permissions minimos.
# Os secrets CANARY_NEW_PASSWORD e FIREBASE_SERVICE_ACCOUNT sao consumidos SOMENTE no
# caminho APPLY gated e NUNCA impressos.
# =====================================================================
name: "[manual] F3.3.21-B3.41 Canary Password Reset (controlled)"

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: "Digite RESET_CANARY_PASSWORD para confirmar"
        required: true
        default: ""
        type: string
      dry_run:
        description: "true = PREP/validacao (sem escrita). APPLY e bloqueado nesta fase."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      target_email:
        description: "E-mail alvo (fixo: somente o canario)"
        required: true
        default: "teste.webpush@idseven.com.br"
        type: string
      max_users:
        description: "Maximo de usuarios alvo (fixo: 1)"
        required: true
        default: "1"
        type: string
      allow_apply_reset:
        description: "Permitir APPLY real (sempre false nesta fase; futuro: com confirm+secrets)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      must_change_password:
        description: "Forcar troca no proximo login (grava mustChangePassword)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      hosting_publish:
        description: "Publicar Hosting (sempre false; true recusado)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      fcm_token_server:
        description: "Estado da flag (sempre false; true recusado)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: auth-canary-password-reset
  cancel-in-progress: false

env:
  EXPECTED_TARGET_EMAIL: "teste.webpush@idseven.com.br"
  RUNNER_SCRIPT: "scripts/worker-ops/f3321-b341a-canary-password-reset.e2e.mjs"
  RETEST_OUT: "canary-password-reset-artifacts"

jobs:
  canary-password-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard confirm_reset (== RESET_CANARY_PASSWORD)
        env:
          CONFIRM: ${{ github.event.inputs.confirm_reset }}
        run: |
          set -eu
          if [ "$CONFIRM" != "RESET_CANARY_PASSWORD" ]; then
            echo "::error:: confirm_reset invalido — abortando antes de tudo."; exit 1
          fi
          echo "confirm_reset OK."

      - name: Guard escopo/seguranca (somente canario; 1 usuario; flags travadas)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          EMAIL: ${{ github.event.inputs.target_email }}
          MAXU: ${{ github.event.inputs.max_users }}
          ALLOW_APPLY: ${{ github.event.inputs.allow_apply_reset }}
          HOSTING: ${{ github.event.inputs.hosting_publish }}
          FCM: ${{ github.event.inputs.fcm_token_server }}
          HAS_PW: ${{ secrets.CANARY_NEW_PASSWORD != '' }}
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          set -eu
          if [ "$HOSTING" = "true" ]; then echo "::error:: hosting_publish=true e proibido."; exit 1; fi
          if [ "$FCM" = "true" ]; then echo "::error:: fcm_token_server=true e proibido."; exit 1; fi
          if [ "$EMAIL" != "$EXPECTED_TARGET_EMAIL" ]; then echo "::error:: target_email diferente do canario — recusado."; exit 1; fi
          if [ "$MAXU" != "1" ]; then echo "::error:: max_users != 1 — recusado."; exit 1; fi
          # APPLY real exige os dois secrets presentes. Sem eles => so DRY-RUN/PREP.
          if [ "$ALLOW_APPLY" = "true" ] && [ "$DRY_RUN" = "false" ]; then
            if [ "$HAS_PW" != "true" ]; then echo "::error:: CANARY_NEW_PASSWORD ausente para APPLY — abortando."; exit 1; fi
            if [ "$HAS_SA" != "true" ]; then echo "::error:: FIREBASE_SERVICE_ACCOUNT ausente para APPLY — abortando."; exit 1; fi
          fi
          echo "guards de escopo/seguranca OK (dry_run=$DRY_RUN; somente canario; 1 usuario)."

      - name: Checkout (main; traz o runner)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirma runner + node --check
        run: |
          set -eu
          test -f "$RUNNER_SCRIPT" || { echo "::error:: runner ausente: $RUNNER_SCRIPT"; exit 1; }
          node --check "$RUNNER_SCRIPT"
          echo "Runner presente e com sintaxe OK."

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instala firebase-admin (somente APPLY gated)
        if: ${{ github.event.inputs.dry_run == 'false' && github.event.inputs.allow_apply_reset == 'true' }}
        run: |
          set -eu
          npm i --no-save firebase-admin@12 >/dev/null 2>&1
          echo "firebase-admin instalado (APPLY)."

      - name: Rodar reset (DRY-RUN/PREP por padrao; APPLY so em fase posterior gated)
        env:
          CONFIRM_RESET: ${{ github.event.inputs.confirm_reset }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TARGET_EMAIL: ${{ github.event.inputs.target_email }}
          MAX_USERS: ${{ github.event.inputs.max_users }}
          ALLOW_APPLY_RESET: ${{ github.event.inputs.allow_apply_reset }}
          MUST_CHANGE_PASSWORD: ${{ github.event.inputs.must_change_password }}
          HOSTING_PUBLISH: ${{ github.event.inputs.hosting_publish }}
          FCM_TOKEN_SERVER: ${{ github.event.inputs.fcm_token_server }}
          # Consumidos SOMENTE no APPLY gated; NUNCA impressos. Em DRY-RUN sao ignorados.
          CANARY_NEW_PASSWORD: ${{ secrets.CANARY_NEW_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -eu
          node "$RUNNER_SCRIPT"

      - name: Upload artifact sanitizado (summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-password-reset
          path: canary-password-reset-artifacts/
          if-no-files-found: warn
          retention-days: 14
