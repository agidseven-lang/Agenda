# =====================================================================
# [manual] F3.3.20-B1.7-E — Deploy TRIGGER-ONLY (parcial) de UMA trigger Firestore:
# syncUsersPublic (onDocumentWritten "users/{uid}"). SEPARADO do deploy total
# (firebase-functions-deploy.yml), do ENDPOINT-only (firebase-functions-deploy-endpoint.yml)
# e do DORMANT-1 (3 triggers). Motivo da rota propria: trigger gen2/Eventarc NAO tem
# endpoint HTTP para sondar => os postchecks sao de eventTrigger/Firestore (gcloud describe),
# nao probes HTTP. O ENDPOINT-only nao serve (allowlist e token DEPLOY_ENDPOINT proprios de
# endpoints HTTPS); o DORMANT-1 nao serve (allowlist/pin/token de outros 3 triggers).
# workflow_dispatch only; dry_run=true por padrao. Guards: confirm_deploy == DEPLOY_TRIGGER;
# allowlist FIXA {syncUsersPublic}; rejeita total/endpoints/lista/virgula/espaco/curinga/':'/
# vazio/desconhecido; pin do blob 6f6d0c8 (functions/index.js @ app/main); prechecks
# node --check + f33R..f33V + f33X + f33AA + f33AC + f33AD + f33AF + f33AG; checkout FIXO app/main.
# NAO faz Hosting/Rules/Firestore deploy; NAO faz deploy total; NAO faz backfill; NAO escreve
# docs; NAO popula usersPublic (a trigger so executa em write FUTURO em users/{uid}).
# Segredos: AUTH_SESSION_SECRET e NOTIF_PREFS_SECRET ja possuem versao real (fases anteriores)
# => a analise do codebase passa SEM placeholder; este workflow NAO cria/le/rotaciona segredo
# (zero operacao de Secret Manager). syncUsersPublic NAO usa secret.
# f33AB/f33AE ficam FORA dos prechecks (E2E live/canario; tocam estado vivo/endpoints reais).
# Pos-deploy (so dry_run=false): functions:list before/after; delta de Function NOVA == so
# syncUsersPublic; helpers _-prefix ausentes; gcloud describe confirma gen2/ACTIVE/eventTrigger
# Firestore document users/{uid} evento ...written; sem secrets; nao e HTTP function.
# Rollback: firebase functions:delete syncUsersPublic --gen2 --region us-central1 --force
#   (ou: gcloud functions delete syncUsersPublic --gen2 --region us-central1). Como a UI ainda
#   NAO usa usersPublic e nao ha backfill, o impacto imediato de um rollback e zero.
# Inputs sao mapeados para env (evita injecao de expressao no shell).
# =====================================================================
name: "[manual] Firebase Functions Deploy — TRIGGER (parcial, 1 trigger usersPublic)"

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite DEPLOY_TRIGGER para confirmar (qualquer outro valor aborta)"
        required: true
        default: ""
      dry_run:
        description: "true = apenas plano/list/prechecks (NAO faz deploy); false = deploy real"
        required: true
        default: "true"
      function_name:
        description: "Trigger alvo (allowlist fixa: syncUsersPublic)"
        required: true
        default: "syncUsersPublic"

permissions:
  contents: read

concurrency:
  group: ff-deploy-trigger
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"
  PINNED_FUNCTIONS_BLOB: "6f6d0c865426f5cbb15a59c17454eb3965ca9342"

jobs:
  deploy-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Guard confirm_deploy (== DEPLOY_TRIGGER)
        env:
          CONFIRM: ${{ github.event.inputs.confirm_deploy }}
        run: |
          set -eu
          if [ "$CONFIRM" != "DEPLOY_TRIGGER" ]; then
            echo "::error:: confirm_deploy != DEPLOY_TRIGGER — abortando antes de tudo."
            exit 1
          fi
          echo "confirm_deploy OK."

      - name: Guard allowlist (1 trigger; rejeita total/endpoints/lista/vazio/curinga)
        env:
          FUNCTION_NAME: ${{ github.event.inputs.function_name }}
        run: |
          set -eu
          ALLOW="syncUsersPublic"
          FN="$FUNCTION_NAME"
          if [ -z "$FN" ]; then echo "::error:: function_name vazio"; exit 1; fi
          case "$FN" in
            *,*)   echo "::error:: lista/virgula proibida (1 trigger por vez)"; exit 1 ;;
            *" "*) echo "::error:: espaco proibido"; exit 1 ;;
            *"*"*) echo "::error:: curinga proibido"; exit 1 ;;
            *:*)   echo "::error:: ':' proibido (use o nome puro; o prefixo functions: e adicionado aqui)"; exit 1 ;;
            functions) echo "::error:: alvo total proibido"; exit 1 ;;
          esac
          MATCH=0
          for a in $ALLOW; do [ "$FN" = "$a" ] && MATCH=1; done
          if [ "$MATCH" != "1" ]; then echo "::error:: token fora da allowlist: $FN"; exit 1; fi
          TARGET="functions:$FN"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "FN=$FN" >> "$GITHUB_ENV"
          echo "Allowlist OK — alvo: $TARGET"

      - name: Checkout (ref FIXO app/main)
        uses: actions/checkout@v4
        with:
          ref: app/main
          fetch-depth: 0

      - name: Pin do blob functions/index.js (== 6f6d0c8)
        run: |
          set -eu
          B="$(git rev-parse HEAD:functions/index.js)"
          if [ "$B" != "$PINNED_FUNCTIONS_BLOB" ]; then
            echo "::error:: functions/index.js ($B) != pin ($PINNED_FUNCTIONS_BLOB)"
            exit 1
          fi
          echo "Pin OK: $B"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pre-checks (syntax + f33R..f33V + f33X + f33AA/AC/AD + f33AF/f33AG)
        run: |
          set -eu
          # f33AB/f33AE FORA: E2E live/canario (endpoints reais; estado vivo) — nao sao precheck de deploy.
          node --check functions/index.js
          for t in \
            f33R-notif-prefs-log \
            f33S-notif-prefs-endpoint \
            f33T-notif-prefs-token-issuer \
            f33U-notif-send-prefs-integration \
            f33V-notif-hardening \
            f33X-notifprefs-selfread-endpoint \
            f33AA-auth-login-user \
            f33AC-auth-session-scope \
            f33AD-auth-get-user-contact \
            f33AF-auth-userspublic-projection \
            f33AG-auth-userspublic-trigger; do
            echo "==== $t ===="; node "scripts/worker-ops/$t.test.mjs"
          done
          echo "Pre-checks OK (inclui f33AF/f33AG; 0 FAIL exigido)."

      - name: Auth gcloud (service account via secret -> arquivo temporario)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: service account ausente."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null

      - name: Estado ANTES (functions:list + nomes gen2 — leitura)
        run: |
          set -eu
          npm install -g firebase-tools >/dev/null 2>&1
          firebase functions:list --project "$GCP_PROJECT" | tee before.txt || true
          # baseline preciso p/ o delta do pos-deploy; read-only; nunca le valor de segredo.
          # (gcloud functions list NAO aceita --gen2; usa --regions p/ filtrar a regiao.)
          gcloud functions list --regions=us-central1 --project "$GCP_PROJECT" --format='value(name)' 2>/dev/null | sed 's#.*/##' | sort -u > names-before.txt || true
          echo "syncUsersPublic ANTES: $(grep -qx syncUsersPublic names-before.txt && echo presente || echo ausente)"

      - name: functions/.env SEM flags (somente RESET_EMAIL_*; trigger nao usa secret)
        env:
          RESET_EMAIL_FROM: ${{ secrets.RESET_EMAIL_FROM }}
          RESET_EMAIL_FROM_NAME: ${{ secrets.RESET_EMAIL_FROM_NAME }}
          RESET_EMAIL_PROVIDER: ${{ secrets.RESET_EMAIL_PROVIDER }}
        run: |
          set -eu
          # O firebase analisa o codebase INTEIRO: password-reset declara defineString(RESET_EMAIL_*),
          # exigidas em --non-interactive mesmo com --only de 1 trigger (mesma classe da falha B1.6-K).
          # AUTH_SESSION_SECRET/NOTIF_PREFS_SECRET ja tem versao real (fases anteriores) => analise
          # passa SEM placeholder; este workflow NAO cria/le/rotaciona segredo. syncUsersPublic NAO usa secret.
          # Grava SOMENTE RESET_EMAIL_* (defaults seguros, nao-sensiveis). NUNCA flags ENABLE_NOTIF_*.
          FROM="${RESET_EMAIL_FROM:-no-reply@agendaidseven.com.br}"
          {
            printf 'RESET_EMAIL_FROM=%s\n' "$FROM"
            printf 'RESET_EMAIL_FROM_NAME=%s\n' "${RESET_EMAIL_FROM_NAME:-ID Seven Agenda}"
            printf 'RESET_EMAIL_PROVIDER=%s\n' "${RESET_EMAIL_PROVIDER:-resend}"
          } > "functions/.env.${GCP_PROJECT}"
          if grep -q 'ENABLE_NOTIF_' "functions/.env.${GCP_PROJECT}"; then
            echo "::error:: .env contem ENABLE_NOTIF_*"; exit 1
          fi
          echo ".env gravado sem flags."

      - name: Deploy TRIGGER (somente se dry_run=false)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          # travas FINAIS: alvo nunca total / nunca Hosting / nunca Firestore-Rules; alvo exato
          case "$TARGET" in
            functions|functions:) echo "::error:: alvo total bloqueado"; exit 1 ;;
            *hosting*)            echo "::error:: Hosting bloqueado"; exit 1 ;;
            *firestore*)          echo "::error:: Firestore/Rules bloqueado"; exit 1 ;;
          esac
          if [ "$TARGET" != "functions:syncUsersPublic" ]; then
            echo "::error:: TARGET inesperado ($TARGET) — abortando"; exit 1
          fi
          if [ "$DRY_RUN" = "false" ]; then
            echo "DEPLOY real — alvo: $TARGET"
            firebase deploy --only "$TARGET" --project "$GCP_PROJECT" --non-interactive --force
          else
            echo "DRY-RUN=true — nenhum deploy executado. Alvo planejado: $TARGET"
          fi

      - name: Postcheck/Verify (trigger/Eventarc; describe INDEPENDENTE do baseline)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          # Read-only por metadados; nunca le valor de segredo; nunca escreve docs.
          # Roda em AMBOS os modos:
          #   dry_run=false => postcheck pos-deploy (exige presenca + delta == so syncUsersPublic);
          #   dry_run=true  => verificacao READ-ONLY da trigger ja publicada (describe), SEM deploy.
          # (gcloud functions list NAO aceita --gen2; usa --regions. O describe roda INDEPENDENTE
          #  do baseline/delta — era ali que o bug do --gen2 impedia a validacao do eventTrigger.)
          firebase functions:list --project "$GCP_PROJECT" | tee after.txt || true
          gcloud functions list --regions=us-central1 --project "$GCP_PROJECT" --format='value(name)' 2>/dev/null | sed 's#.*/##' | sort -u > names-after.txt || true

          PRESENT=0; grep -qx syncUsersPublic names-after.txt && PRESENT=1
          echo "syncUsersPublic presente=$PRESENT (DRY_RUN=$DRY_RUN)"

          # helpers _-prefix NUNCA podem aparecer como CloudFunctions (sempre)
          for H in _handleSyncUsersPublic _projectUserPublicOut _handleGetUserContact _authVerifySessionToken; do
            if grep -qx "$H" names-after.txt; then
              echo "::error:: helper publicado indevidamente como Function: $H"; exit 1
            fi
          done
          echo "Helpers _-prefix ausentes (OK)."

          # delta before/after: SO apos deploy real (fail-closed se baseline vazio)
          if [ "$DRY_RUN" = "false" ]; then
            if ! grep -qx syncUsersPublic names-after.txt; then
              echo "::error:: syncUsersPublic ausente apos deploy"; exit 1
            fi
            if [ ! -s names-before.txt ]; then
              echo "::error:: baseline names-before vazio — nao da p/ validar delta com seguranca"; exit 1
            fi
            NEW="$(comm -13 names-before.txt names-after.txt || true)"
            EXTRA="$(printf '%s\n' "$NEW" | sed '/^$/d' | grep -vx 'syncUsersPublic' || true)"
            if [ -n "$EXTRA" ]; then
              echo "::error:: deploy publicou Function(s) nova(s) inesperada(s): $EXTRA"; exit 1
            fi
            echo "Delta novo OK: [$(printf '%s' "$NEW" | tr '\n' ' ')]"
          fi

          # DESCRIBE: roda SEMPRE que a Function existe — INDEPENDENTE do baseline/delta.
          if [ "$PRESENT" = "1" ]; then
            gcloud functions describe syncUsersPublic --gen2 --region us-central1 --project "$GCP_PROJECT" > desc.txt 2>/dev/null \
              || { echo "::error:: gcloud describe falhou"; exit 1; }
            ENVN="$(gcloud functions describe syncUsersPublic --gen2 --region us-central1 --project "$GCP_PROJECT" --format='value(environment)' 2>/dev/null || true)"
            ST="$(gcloud functions describe syncUsersPublic --gen2 --region us-central1 --project "$GCP_PROJECT" --format='value(state)' 2>/dev/null || true)"
            ET="$(gcloud functions describe syncUsersPublic --gen2 --region us-central1 --project "$GCP_PROJECT" --format='value(eventTrigger.eventType)' 2>/dev/null || true)"
            SEC="$(gcloud functions describe syncUsersPublic --gen2 --region us-central1 --project "$GCP_PROJECT" --format='value(serviceConfig.secretEnvironmentVariables)' 2>/dev/null || true)"
            echo "environment=$ENVN state=$ST eventType=$ET"
            [ "$ENVN" = "GEN_2" ] || { echo "::error:: nao e gen2 (environment=$ENVN)"; exit 1; }
            [ "$ST" = "ACTIVE" ] || { echo "::error:: state != ACTIVE ($ST)"; exit 1; }
            [ -n "$ET" ] || { echo "::error:: eventTrigger ausente (parece HTTP function)"; exit 1; }
            [ "$ET" = "google.cloud.firestore.document.v1.written" ] || { echo "::error:: eventType inesperado ($ET)"; exit 1; }
            grep -q 'users/{uid}' desc.txt || { echo "::error:: document filter != users/{uid}"; exit 1; }
            grep -q '(default)' desc.txt || echo "::warning:: database (default) nao confirmado no describe"
            if grep -qiE 'httpsTrigger' desc.txt; then echo "::error:: httpsTrigger presente (Function HTTP)"; exit 1; fi
            if [ -n "$SEC" ]; then echo "::error:: syncUsersPublic tem secrets vinculados ($SEC) — esperado nenhum"; exit 1; fi
            echo "VERIFY OK: gen2 ACTIVE; eventTrigger Firestore document users/{uid} (written); database (default); nao e HTTP function (sem httpsTrigger); sem secrets vinculados; helpers nao publicados."
          elif [ "$DRY_RUN" = "false" ]; then
            echo "::error:: syncUsersPublic ausente apos deploy — describe nao pode validar"; exit 1
          else
            echo "DRY-RUN verify: syncUsersPublic ainda nao publicada — describe pulado (pre-deploy)."
          fi

      - name: Limpeza (service account + .env temporario + artefatos)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" functions/.env.* before.txt after.txt names-before.txt names-after.txt desc.txt 2>/dev/null || true
