# =====================================================================
# [manual] F3.3.20-B1.7-E — Backfill GATED de `usersPublic` (dry-run default).
# Executa o runner scripts/worker-ops/f33AH-auth-userspublic-backfill.e2e.mjs (em app/main)
# que le `users` (Admin SDK), projeta via projectUserPublicOut e escreve SOMENTE
# usersPublic/{uid}. workflow_dispatch only. dry_run=true por padrao => ZERO writes.
# APPLY (dry_run=false) exige confirm_backfill == RUN_USERSPUBLIC_BACKFILL (aborta antes
# das credenciais/writes se nao bater). Checkout FIXO app/main. Instala SOMENTE firebase-admin.
# Credencial via GOOGLE_APPLICATION_CREDENTIALS_JSON -> arquivo temporario (nunca impresso;
# nunca `gcloud secrets versions access`). Artifacts SANITIZADOS (so JSON de contagens/hashes).
# NAO faz deploy; NAO altera Rules/UI; NAO toca Web Push; NAO escreve users/notifPrefs.
# NESTA FASE o workflow NAO e disparado.
# =====================================================================
name: "[manual] usersPublic Backfill (gated; dry-run default)"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = leitura/projecao/contagens (ZERO writes); false = APPLY real"
        type: boolean
        default: true
      confirm_backfill:
        description: "Digite RUN_USERSPUBLIC_BACKFILL para APPLY (ignorado em dry-run)"
        required: true
        default: ""
      limit:
        description: "Maximo de usuarios (0 = todos; use p/ canario)"
        required: false
        default: "0"
      page_size:
        description: "Tamanho da pagina de leitura (<=500)"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: userspublic-backfill
  cancel-in-progress: false

env:
  GCP_PROJECT: "agenda-id-seven"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Guard APPLY (confirm_backfill se dry_run=false)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONFIRM_BACKFILL: ${{ github.event.inputs.confirm_backfill }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "false" ]; then
            if [ "$CONFIRM_BACKFILL" != "RUN_USERSPUBLIC_BACKFILL" ]; then
              echo "::error:: APPLY (dry_run=false) exige confirm_backfill=RUN_USERSPUBLIC_BACKFILL"; exit 1
            fi
            echo "APPLY confirmado."
          else
            echo "DRY-RUN (default) — zero writes."
          fi

      - name: Checkout (ref FIXO app/main)
        uses: actions/checkout@v4
        with:
          ref: app/main
          fetch-depth: 0

      - name: Confirma ref app/main (log; valida tip de origin/app/main)
        run: |
          set -eu
          H="$(git rev-parse HEAD)"
          echo "app/main HEAD=$H"
          git rev-parse --verify HEAD >/dev/null
          test -f scripts/worker-ops/f33AH-auth-userspublic-backfill.e2e.mjs \
            || { echo "::error:: runner f33AH ausente no checkout app/main"; exit 1; }

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check do runner
        run: node --check scripts/worker-ops/f33AH-auth-userspublic-backfill.e2e.mjs

      - name: Instalar firebase-admin (somente)
        run: npm install --no-save --no-package-lock firebase-admin

      - name: Auth SA -> credencial temporaria (nunca impressa)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -eu
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: service account ausente."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"

      - name: Executar runner backfill (dry-run/apply conforme inputs)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONFIRM_BACKFILL: ${{ github.event.inputs.confirm_backfill }}
          LIMIT: ${{ github.event.inputs.limit }}
          PAGE_SIZE: ${{ github.event.inputs.page_size }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts-backfill
        run: |
          set -eu
          mkdir -p "$ARTIFACT_DIR"
          node scripts/worker-ops/f33AH-auth-userspublic-backfill.e2e.mjs

      - name: Upload artifacts (sanitizados; so JSON de contagens/hashes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userspublic-backfill-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts-backfill/*.json
          if-no-files-found: warn

      - name: Limpeza (credencial temporaria)
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" 2>/dev/null || true
