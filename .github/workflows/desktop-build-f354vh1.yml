# =====================================================================
# [push/manual] F3.5.4V-H1 — Desktop Build (1.0.213 — PERSISTÊNCIA/RESTAURAÇÃO da sessão no autostart)
# ---------------------------------------------------------------------
# Base de código/rollback imediato: Desktop 1.0.212 (@3145a1d = tag v1.0.212). Baseline FÍSICA aprovada:
# 1.0.211 (@fe303b8). Rollback adicional: 1.0.208 (@db8cdca).
# Corrige o bug de "abriu deslogado" no autostart do Windows: substitui o login estático + renderLogin()
# incondicional no boot por uma MÁQUINA DE ESTADOS com SPLASH neutro padrão (AUTH_INITIALIZING →
# AUTH_RESTORING → {AUTHENTICATED | AUTH_OFFLINE_CACHED | AUTH_UNAUTHENTICATED_CONFIRMED | AUTH_REVOKED}).
# Login só em NEGATIVA REAL (no_session/expired) ou escape manual; erro de rede MANTÉM o splash (offline≠logout).
# Delta autorizado vs 1.0.212 em desktop/src: SOMENTE desktop/src/renderer/index.html. main.ts/auth-core.ts/
# preloads/stack de notificação + a funcionalidade 1.0.212 (quantidade personalizada de vídeos) INTOCADOS.
# `--publish never` (nada publicado aqui; a publicação ocorre no desktop-release-f354vh1.yml, mesmos bytes).
# =====================================================================
name: "[push/manual] F3.5.4V-H1 Desktop Build (1.0.213 — persistência da sessão no autostart)"
"on":
  push:
    branches:
      - "desktop/f354v-h1-session-persistence-startup-1.0.213"
    paths-ignore:
      - ".github/workflows/desktop-release-f354vh1.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE_208_SHA: "db8cdca1d92cd42f3ec98aced39e6a418c4d478e" # 1.0.208 OFICIAL (rollback adicional)
  BASE_211_SHA: "fe303b8ab9546ff00d0459b98e0e9eaab20dd8e2" # 1.0.211 (baseline FÍSICA aprovada)
  BASE_212_SHA: "3145a1db5579f7b5977112cefbde796a0e27bd34" # 1.0.212 (base de código/rollback = tag v1.0.212)
  BRANCH_POINT_SHA: "3145a1db5579f7b5977112cefbde796a0e27bd34" # ponto de fork da branch (= 1.0.212)
  TEST_BRANCH: "desktop/f354v-h1-session-persistence-startup-1.0.213"
  APP_DIR: "desktop"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Checkout (SHA do push; history completo)
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }

      - name: Gate REF + ANCESTRIA — branch correta e descendente de 1.0.212, 1.0.211 e 1.0.208
        working-directory: desktop
        run: |
          set -e
          [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ] || { echo "::error:: ref $GITHUB_REF_NAME != $TEST_BRANCH"; exit 1; }
          git merge-base --is-ancestor "$BASE_212_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.212"; exit 1; }
          git merge-base --is-ancestor "$BASE_211_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.211"; exit 1; }
          git merge-base --is-ancestor "$BASE_208_SHA" HEAD || { echo "::error:: HEAD nao descende de 1.0.208"; exit 1; }
          echo "REF/ANCESTRIA OK"

      - name: Derivar versao — exige 1.0.213 exato (package + lock x2)
        working-directory: desktop
        run: |
          set -e
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));const l=JSON.parse(fs.readFileSync("package-lock.json","utf8"));if(p.version!=="1.0.213"){console.error("package.json version "+p.version+" != 1.0.213");process.exit(1);}if(l.version!=="1.0.213"||(l.packages&&l.packages[""]&&l.packages[""].version!=="1.0.213")){console.error("package-lock version != 1.0.213");process.exit(1);}console.log("versao 1.0.213 OK (3 campos)");'

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: TypeScript build (main + preload + renderer + modulos .js)
        working-directory: desktop
        run: npm run build
      - name: Lint (tsc --noEmit)
        working-directory: desktop
        run: npx tsc --noEmit -p tsconfig.json

      - name: Gate SINTAXE DOS RENDERERS — <script> inline de index/bgnotify/slareminder DEVEM parsear
        working-directory: desktop
        run: |
          set -e
          node -e '
            const fs=require("fs");
            function chk(file){ const s=fs.readFileSync(file,"utf8").replace(/\r\n/g,"\n");
              const re=/<script(\b[^>]*)>([\s\S]*?)<\/script>/gi; let m,n=0;
              while((m=re.exec(s))){ if(/\bsrc\s*=/.test(m[1]||"")) continue; n++;
                try{ new Function(m[2]); }catch(e){ console.error("::error:: SyntaxError "+file+" #"+n+": "+(e&&e.message||e)); process.exit(1);} }
              if(!n){ console.error("::error:: sem <script> inline "+file); process.exit(1);} }
            chk("src/renderer/index.html"); chk("src/renderer/bgnotify.html"); chk("src/renderer/slareminder.html");
            console.log("SINTAXE dos <script> inline OK.");'

      - name: Gate F3.5.4V-H1 — contrato da persistência/máquina de estados (40 asserts)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354vh1-session-persistence.test.mjs || { echo "::error:: f354vh1 vermelho"; exit 1; }

      - name: Gate REGRESSAO 1.0.212 — quantidade personalizada (72) + contrato de vídeos f3377a (79)
        working-directory: desktop
        run: |
          set -e
          node scripts/f354v-custom-video-quantity.test.mjs || { echo "::error:: f354v (quantidade de vídeos) regrediu"; exit 1; }
          node scripts/f3377a-media-editing.test.mjs || { echo "::error:: f3377a (contrato de vídeos) regrediu"; exit 1; }

      - name: Gate AUTH/CONTA — auth-core hermético (16) + account-anchor (server-side, splash-first)
        working-directory: desktop
        run: |
          set -e
          node scripts/f3356-auth-core.test.mjs || { echo "::error:: auth-core hermético regrediu"; exit 1; }
          node scripts/f33L-account-anchor.test.mjs || { echo "::error:: account-anchor regrediu"; exit 1; }

      - name: Gate REGRESSAO — notificações/SLA/decisão/idle/lembrete/agrupamento/renderer (verdes)
        working-directory: desktop
        run: |
          set -e
          for t in \
            f354u-h1-notification-hotfix f354u-premium-common-notifications f354r-priority-assistant \
            f354q-task-idle-detection f354o-common-notification-grouping f354n-watchdog f354n-startup \
            f354k-notification-all-window-states f354l-sla-central-persistent-reminders f354h-red-notification-boundary \
            f354i-cronograma-save-send-client f354-notifications-reliability f354f-task-edit-update-notification \
            f354f-sla-designer-live-timer f353-durable-notifications f353a-actor-photo f347-immediate-visual-delivery \
            f352-cards-notify f33A-notif-central f33F-bg-notify f33B-form-typing f33C-assignment-toast \
            f3377a-r4b-http-date-clock ; do
            node "scripts/$t.test.mjs" || { echo "::error:: regressao vermelha: $t"; exit 1; }
          done
          echo "REGRESSAO verde."

      - name: Gate ISOLAMENTO — delta vs 1.0.212 SÓ nos arquivos autorizados; src só o index.html
        working-directory: desktop
        run: |
          set -e
          # (a) delta vs o PONTO DE FORK (=1.0.212) = exatamente os arquivos desta fase
          git -C "$GITHUB_WORKSPACE" diff --name-only "$BRANCH_POINT_SHA" HEAD > /tmp/diff.txt
          echo "== arquivos alterados vs 1.0.212 =="; cat /tmp/diff.txt
          ALLOW='^(desktop/src/renderer/index\.html|desktop/package\.json|desktop/package-lock\.json|desktop/scripts/f354vh1-session-persistence\.test\.mjs|desktop/scripts/f354vh1-electron-proof\.mjs|desktop/scripts/f354vh1-electron-proof-main\.js|desktop/scripts/f354vh1-proof-preload\.js|desktop/scripts/f33L-account-anchor\.test\.mjs|desktop/scripts/f354-notifications-reliability\.test\.mjs|desktop/scripts/f354i-cronograma-save-send-client\.test\.mjs|docs/f354vh1-qa/.*|\.gitignore|\.github/workflows/desktop-build-f354vh1\.yml|\.github/workflows/desktop-release-f354vh1\.yml)$'
          if grep -vE "$ALLOW" /tmp/diff.txt | grep -q .; then echo "::error:: arquivo fora da allowlist F3.5.4V-H1:"; grep -vE "$ALLOW" /tmp/diff.txt; exit 1; fi
          # (b) em desktop/src, o ÚNICO arquivo alterado vs 1.0.212 é o renderer index.html
          SRC=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_212_SHA" HEAD -- desktop/src | grep -v '^desktop/src/renderer/index\.html$' || true)
          [ -z "$SRC" ] || { echo "::error:: alteração em desktop/src além do index.html vs 1.0.212:"; echo "$SRC"; exit 1; }
          # (c) congelados byte-idênticos vs 1.0.212 (main/preload/renderers comuns/priorityEngine)
          git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_212_SHA" HEAD -- desktop/src/main desktop/src/preload desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/priorityEngine.js || { echo "::error:: arquivo congelado alterado vs 1.0.212"; exit 1; }
          echo "ISOLAMENTO OK."

      - name: Gate ANDROID/BACKEND intactos — diff nao toca android/functions/worker/Rules
        working-directory: desktop
        run: |
          set -e
          A=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_208_SHA" HEAD | grep -cE '^(android/|functions/|worker/|.*\.rules$|firestore\.rules)' || true)
          [ "$A" = "0" ] || { echo "::error:: diff toca android/backend ($A)"; exit 1; }
          echo "ANDROID/BACKEND intactos."

  build:
    needs: verify
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Forcar LF no checkout
        run: git config --global core.autocrlf false
      - name: Checkout (mesmo SHA do run)
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }

      - name: Gate REF + ANCESTRIA (windows)
        working-directory: desktop
        run: |
          set -e
          [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ] || { echo "::error:: ref != branch"; exit 1; }
          git merge-base --is-ancestor "$BASE_212_SHA" HEAD || { echo "::error:: nao descende de 1.0.212"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: TypeScript build
        working-directory: desktop
        run: npm run build
      - name: electron-builder (NSIS + MSI; --publish never)
        working-directory: desktop
        run: npx electron-builder --win nsis msi --publish never

      - name: Gate prova-de-versao (asar == 1.0.213) + index.html EMPACOTADO == fonte (EOL-normalizado)
        working-directory: desktop
        run: |
          set -e
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR" || { echo "::error:: app.asar ausente"; exit 1; }
          EXDIR="$RUNNER_TEMP/asarx"; rm -rf "$EXDIR"; mkdir -p "$EXDIR"; npx --yes @electron/asar extract "$ASAR" "$EXDIR"
          PKGV=$(P="$EXDIR/package.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.P,"utf8")).version||"")')
          [ "$PKGV" = "1.0.213" ] || { echo "::error:: asar version=$PKGV != 1.0.213"; exit 1; }
          cmp_norm() { EX="$1" SRC="$2" node -e 'const fs=require("fs");const n=s=>String(s).replace(/\r\n/g,"\n");if(n(fs.readFileSync(process.env.EX,"utf8"))!==n(fs.readFileSync(process.env.SRC,"utf8"))){console.error(process.env.SRC+" EMPACOTADO != fonte");process.exit(1);}'; }
          cmp_norm "$EXDIR/src/renderer/index.html" "src/renderer/index.html"
          cmp_norm "$EXDIR/src/renderer/bgnotify.html" "src/renderer/bgnotify.html"
          cmp_norm "$EXDIR/src/renderer/slareminder.html" "src/renderer/slareminder.html"
          echo "GATE prova-de-versao 1.0.213 + renderers==fonte OK."

      - name: Gate F3.5.4V-H1 EMPACOTADO — máquina de estados+splash no asar + 1.0.212 preservada + stack congelada
        working-directory: desktop
        run: |
          set -e
          EXDIR="$RUNNER_TEMP/asarx"; RR="$EXDIR/src/renderer"; DM="$EXDIR/dist/main"; IDX="$RR/index.html"; MJS="$DM/main.js"
          # ── SPLASH neutro é o estado padrão; login NÃO é mais o default estático ──
          grep -qF 'id="authSplash"' "$IDX" || { echo "::error:: #authSplash ausente no asar"; exit 1; }
          grep -qF 'id="authSplashMsg">Restaurando sessão…' "$IDX" || { echo "::error:: mensagem de restauração ausente no asar"; exit 1; }
          grep -qF '<section id="login" class="hidden">' "$IDX" || { echo "::error:: #login não nasce oculto no asar"; exit 1; }
          # ── boot NÃO abre com renderLogin() incondicional (a causa do bug) ──
          node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8");if(/async function boot\(\)\{\s*renderLogin\(\)/.test(s)){console.error("::error:: boot ainda abre com renderLogin() incondicional no asar");process.exit(1)}' "$IDX"
          # ── máquina de estados AUTH_* + escape/observabilidade presentes no asar ──
          for m in AUTH_INITIALIZING AUTH_RESTORING AUTHENTICATED AUTH_OFFLINE_CACHED AUTH_UNAUTHENTICATED_CONFIRMED AUTH_REVOKED _revealLogin authManualLogin 'auth.startup.'; do
            grep -qF "$m" "$IDX" || { echo "::error:: marcador '$m' ausente no asar"; exit 1; }
          done
          grep -qF 'authState:authPhase,networkAvailable:on,manualOrAutostart:mode' "$IDX" || { echo "::error:: observabilidade sanitizada ausente no asar"; exit 1; }
          # ── segurança: sem senha/token em localStorage ──
          node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8");if(/localStorage\.setItem\((["\x27])[^"\x27]*(pass|senha|token)/i.test(s)){console.error("::error:: localStorage grava senha/token no asar");process.exit(1)}' "$IDX"
          # ── 1.0.212 (quantidade personalizada de vídeos) PRESERVADA no asar ──
          grep -q 'data-vqminus' "$IDX" && grep -q 'data-vqplus' "$IDX" || { echo "::error:: seletor de quantidade [−]/[+] ausente no asar"; exit 1; }
          grep -q 'var VIDEO_QTY_MAX=500;' "$IDX" || { echo "::error:: teto técnico VIDEO_QTY_MAX ausente no asar"; exit 1; }
          grep -q 'function synthVideoSub(' "$IDX" || { echo "::error:: synthVideoSub ausente no asar"; exit 1; }
          grep -qF 'if(_vids.length)data.videos=_vids;' "$IDX" || { echo "::error:: contrato data.videos alterado no asar"; exit 1; }
          # ── stack de notificação/SLA/persistência do main PRESERVADA no asar ──
          grep -q "function deliverNotification" "$MJS" && grep -q "showBgNotify" "$MJS" || { echo "::error:: HUB de entrega alterado no asar"; exit 1; }
          grep -q "createSlaReminderController" "$DM/slaReminder.js" && grep -q "onDecide" "$DM/slaReminder.js" || { echo "::error:: decisão SLA ausente no asar"; exit 1; }
          grep -q "createNotificationGrouping" "$DM/notificationGrouping.js" || { echo "::error:: agrupamento ausente no asar"; exit 1; }
          grep -qF 'error: "network"' "$DM/auth-core.js" || { echo "::error:: auth-core (offline≠logout) alterado no asar"; exit 1; }
          grep -qF 'requestSingleInstanceLock' "$MJS" || { echo "::error:: single-instance lock ausente no asar"; exit 1; }
          # ── CONGELADOS byte-idênticos vs 1.0.212 (fonte) ──
          git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_212_SHA" HEAD -- desktop/src/main desktop/src/preload desktop/src/renderer/bgnotify.html desktop/src/renderer/slareminder.html desktop/src/renderer/priorityEngine.js || { echo "::error:: congelado alterado vs 1.0.212"; exit 1; }
          SRC=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_212_SHA" HEAD -- desktop/src | grep -v '^desktop/src/renderer/index\.html$' || true)
          [ -z "$SRC" ] || { echo "::error:: src além do index.html vs 1.0.212: $SRC"; exit 1; }
          echo "GATE F3.5.4V-H1 EMPACOTADO: VERIFIED."

      - name: Empacotar bundle (EXE/MSI/latest.yml/blockmap/SBOM/SHA256SUMS/VERSAO-DESKTOP)
        working-directory: ${{ env.APP_DIR }}
        env: { APP_VERSION: "1.0.213" }
        run: |
          set -e
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "$RUNNER_TEMP/sbom.json" || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$RUNNER_TEMP/sbom.json"
          OUT="$GITHUB_WORKSPACE/dist-pkg"; mkdir -p "$OUT"
          EXE=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe | head -1)
          MSI=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.msi 2>/dev/null | head -1)
          BM=$(ls dist-installer/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap | head -1)
          cp "$EXE" "$OUT/"; [ -n "$MSI" ] && cp "$MSI" "$OUT/"; cp dist-installer/latest.yml "$OUT/"; cp "$BM" "$OUT/"; cp "$RUNNER_TEMP/sbom.json" "$OUT/SBOM-cyclonedx.json"
          EXE_NAME=$(basename "$EXE"); MSI_NAME=$([ -n "$MSI" ] && basename "$MSI" || echo ""); BM_NAME=$(basename "$BM")
          ( cd "$OUT" && sha256sum "$EXE_NAME" ${MSI_NAME:+$MSI_NAME} latest.yml "$BM_NAME" SBOM-cyclonedx.json > SHA256SUMS )
          {
            echo "productName : Agenda ID Seven Desktop"
            echo "versionName : $APP_VERSION"
            echo "rotulo      : 1.0.213-session-persistence-startup (CANDIDATA — persistência/restauração da sessão no autostart)"
            echo "channel     : latest (estrutura do updater; NADA publicado neste build)"
            echo "appId       : br.com.idseven.agenda.desktop"
            echo "instalador  : $EXE_NAME"
            echo "SHA-256 exe : $(sha256sum "$OUT/$EXE_NAME" | awk '{print $1}')"
            [ -n "$MSI_NAME" ] && echo "instalador2 : $MSI_NAME" && echo "SHA-256 msi : $(sha256sum "$OUT/$MSI_NAME" | awk '{print $1}')"
            echo "commit      : $GITHUB_SHA (branch $GITHUB_REF_NAME)"
            echo "base-codigo : Desktop 1.0.212 (commit 3145a1d = tag v1.0.212; rollback imediato)"
            echo "baseline-fis: Desktop 1.0.211 OFICIAL (commit fe303b8; fisicamente aprovada)"
            echo "rollback2   : Desktop 1.0.208 OFICIAL (commit db8cdca)"
            echo "origem      : F3.5.4V-H1 — corrige 'abriu deslogado' no autostart do Windows. Boot com SPLASH neutro + máquina de estados AUTH_*; login só em negativa REAL (no_session/expired) ou escape manual; erro de rede MANTÉM o splash (offline≠logout); observabilidade auth.startup.* sanitizada. Só o renderer index.html muda vs 1.0.212. Notificações/SLA/Card Premium/Cronograma/updater/persistência(main)/quantidade personalizada de vídeos (1.0.212)/Android: INTOCADOS (byte vs 1.0.212)."
            echo "distribuicao: CANDIDATA — build gated; publicacao no Latest ocorre no workflow desktop-release-f354vh1.yml (mesmos bytes deste run)"
          } > "$OUT/VERSAO-DESKTOP.txt"
          echo "== SHA256SUMS =="; cat "$OUT/SHA256SUMS"

      - name: Upload artifact — installer (EXE + MSI) PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.213-installer
          path: |
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.msi
          if-no-files-found: error
          retention-days: 30
      - name: Upload artifact — updatemeta PRIVADO
        uses: actions/upload-artifact@v4
        with:
          name: agenda-id-seven-desktop-1.0.213-updatemeta
          path: |
            dist-pkg/latest.yml
            dist-pkg/Agenda-ID-Seven-Desktop-*-x64.exe.blockmap
            dist-pkg/SHA256SUMS
            dist-pkg/SBOM-cyclonedx.json
            dist-pkg/VERSAO-DESKTOP.txt
          if-no-files-found: error
          retention-days: 30
