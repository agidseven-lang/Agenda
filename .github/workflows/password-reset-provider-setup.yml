# Setup do provedor de e-mail (port do GitLab setup_password_reset_provider).
# PREPARADO — execucao SOMENTE manual. Exige confirm_deploy=DEPLOY.
# Injeta RESEND_API_KEY (Secret Manager), env do remetente verificado, e
# re-deploya APENAS as 4 Functions de reset. NUNCA imprime a API key.
name: "[manual] Password Reset Provider Setup"

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite DEPLOY para confirmar (qualquer outro valor aborta)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: "agenda-id-seven"
      GCP_PROJECT_NUMBER: "391529908613"
    steps:
      - name: Guard confirm_deploy
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "::error:: confirm_deploy != DEPLOY — abortando antes de qualquer alteracao."
            exit 1
          fi

      - name: Validar secrets obrigatorios
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESET_EMAIL_FROM: ${{ secrets.RESET_EMAIL_FROM }}
        run: |
          MISS=""
          [ -z "$RESEND_API_KEY" ] && MISS="$MISS RESEND_API_KEY"
          # RESET_EMAIL_FROM tem default no passo abaixo (dominio verificado);
          # so alertamos se ambos secret e default ausentes (default cobre).
          if [ -n "$MISS" ]; then
            echo "::error:: Falta configurar$MISS nos Secrets do GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: app/main

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auth gcloud
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error:: GOOGLE_APPLICATION_CREDENTIALS_JSON ausente."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null
          gcloud services enable secretmanager.googleapis.com cloudresourcemanager.googleapis.com --project "$GCP_PROJECT" >/dev/null 2>&1 || true

      - name: Atualizar secret RESEND_API_KEY (stdin, nunca em log)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          if ! gcloud secrets describe RESEND_API_KEY --project="$GCP_PROJECT" >/dev/null 2>&1; then
            gcloud secrets create RESEND_API_KEY --replication-policy=automatic --project="$GCP_PROJECT" >/dev/null
          fi
          printf '%s' "$RESEND_API_KEY" | gcloud secrets versions add RESEND_API_KEY --data-file=- --project="$GCP_PROJECT" >/dev/null
          echo "Nova versao do secret adicionada (valor nunca exibido)."
          for RSA in "${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com" "${GCP_PROJECT}@appspot.gserviceaccount.com"; do
            gcloud secrets add-iam-policy-binding RESEND_API_KEY --member="serviceAccount:$RSA" --role="roles/secretmanager.secretAccessor" --project="$GCP_PROJECT" --quiet >/dev/null 2>&1 || true
          done

      - name: Preparar functions/.env e re-deploy das 4 Functions de reset
        env:
          RESET_EMAIL_FROM: ${{ secrets.RESET_EMAIL_FROM }}
          RESET_EMAIL_FROM_NAME: ${{ secrets.RESET_EMAIL_FROM_NAME }}
          RESET_EMAIL_PROVIDER: ${{ secrets.RESET_EMAIL_PROVIDER }}
        run: |
          set -e
          FROM="${RESET_EMAIL_FROM:-no-reply@agendaidseven.com.br}"
          {
            printf 'RESET_EMAIL_FROM=%s\n' "$FROM"
            printf 'RESET_EMAIL_FROM_NAME=%s\n' "${RESET_EMAIL_FROM_NAME:-ID Seven Agenda}"
            printf 'RESET_EMAIL_PROVIDER=%s\n' "${RESET_EMAIL_PROVIDER:-resend}"
          } > "functions/.env.${GCP_PROJECT}"
          npm install -g firebase-tools >/dev/null 2>&1
          ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          firebase deploy \
            --only "functions:requestPasswordReset,functions:confirmPasswordReset,functions:requestPasswordResetHttp,functions:confirmPasswordResetHttp" \
            --project "$GCP_PROJECT" --non-interactive --force

      - name: Limpeza (.env e SA)
        if: always()
        run: rm -f functions/.env.* "$RUNNER_TEMP/gcp-sa.json" 2>/dev/null || true
