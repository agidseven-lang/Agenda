# F4.2C — GATES TECNICOS do Android nativo (build/lint/testes). SEM DISTRIBUICAO.
# Dispara por PUSH no proprio branch F4.2C (nao toca a main). Produz APK DEBUG + relatorios
# apenas como EVIDENCIA PROTEGIDA de CI (nao e metodo de instalacao). Nao publica AAB/APK
# oficial, nao mexe em Rules/Play/assinatura oficial.
name: "[F4.2C] Android verify (gates tecnicos; sem distribuicao)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - "android/f42c-firebase-custom-token-production-auth"
    paths:
      - "android-native/**"
      - ".github/workflows/f42c-android-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug keystore (assinatura de TESTE; NAO producao)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Gate SEGREDOS — nada sensivel versionado
        run: |
          set -e
          if git ls-files android-native | grep -q 'google-services.json'; then echo "::error:: google-services.json versionado"; exit 1; fi
          if git ls-files android-native | grep -Ei '\.(keystore|jks)$'; then echo "::error:: keystore/jks versionado em android-native"; exit 1; fi
          if grep -rEn 'AIza[0-9A-Za-z_\-]{25,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' android-native/app/src 2>/dev/null; then echo "::error:: possivel segredo no fonte"; exit 1; fi
          echo "OK: sem segredos versionados"

      - name: Gate SEM WebView/PWA
        run: |
          if grep -rn "WebView" android-native/app/src 2>/dev/null; then echo "::error:: WebView presente"; exit 1; fi
          echo "OK: nativo puro, sem WebView"

      - name: Gate ARQUITETURA — bridge Firebase + FCM por endpoint + sem write direto em users
        run: |
          set -e
          grep -rq "signInWithCustomToken" android-native/app/src || { echo "::error:: bridge Firebase (signInWithCustomToken) ausente"; exit 1; }
          grep -rq "registerFcmToken" android-native/app/src || { echo "::error:: registro FCM por endpoint ausente"; exit 1; }
          if grep -rEn 'collection\("users"\)\s*\)?\.(document|add|set|update)' android-native/app/src 2>/dev/null; then echo "::error:: escrita/uso direto de users (use usersPublic/endpoints)"; exit 1; fi
          echo "OK: bridge presente; FCM por endpoint; sem uso direto de users"

      - name: Restaurar google-services.json (do secret; runner-only)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$GS_B64" ] || { echo "::error:: secret GOOGLE_SERVICES_JSON_BASE64 ausente (necessario pelo plugin google-services)"; exit 1; }
          echo "$GS_B64" | base64 -d > android-native/app/google-services.json
          echo "google-services.json restaurado ($(wc -c < android-native/app/google-services.json) bytes)."

      - name: Gates HARD — clean + testes unitarios + assembleDebug
        working-directory: android-native
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Gate lint (advisory; relatorio anexado)
        continue-on-error: true
        working-directory: android-native
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Evidencia de CI (APK debug + relatorios) — NAO distribuicao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f42c-android-verify-${{ github.sha }}
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/reports/tests/**
            android-native/app/build/reports/lint-results-*.*
          if-no-files-found: warn
          retention-days: 14
