# [manual] F3.3.72C — deploy PINADO do corte de e-mail nos endpoints legados
# (updateUserSelf + adminUpdateUser). Fonte: app/f3372c-adminupdateuser-email-cut
# @ e179f28 (SHA verificado). Alvo FIXO --only das 2 functions afetadas —
# "equivalente tecnicamente comprovado" da autorizacao: o gate 72B provou o
# MESMO buraco nas duas (email sem unicidade/auditoria/literal; vazio aceito).
# NUNCA hosting/rules/firestore/alvo total. Canarios pos-deploy sem dados reais
# (401 esperados; endpoints dedicados vivos). Rollback: redeploy do escopo
# anterior (a2087eb) das mesmas 2 functions.
name: "[manual] F3.3.72C — deploy email-cut legados (2 functions; dry-run/apply)"
"on":
  workflow_dispatch:
    inputs:
      confirm: { description: "Digite DEPLOY-ADMINUPDATEUSER-EMAIL-CUT-72C (apply) ou DRYRUN (dry-run)", required: true, default: "DRYRUN" }
  push:
    branches: ["claude/bold-hopper-4boo17"]
permissions: { contents: read }
concurrency: { group: f3372c-deploy, cancel-in-progress: false }
env:
  GCP_PROJECT: "agenda-id-seven"
  SRC_REF: "app/f3372c-adminupdateuser-email-cut"
  SRC_SHA: "e179f28"
  DEPLOY_TARGET: "functions:updateUserSelf,functions:adminUpdateUser"
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '72C-DRYRUN-EMAILCUT') ||
      contains(github.event.head_commit.message, 'DEPLOY-ADMINUPDATEUSER-EMAIL-CUT-72C')
    runs-on: ubuntu-latest
    steps:
      - name: Gate — modo (literal via dispatch OU head-commit)
        env: { CONFIRM: "${{ github.event.inputs.confirm }}", HEADMSG: "${{ github.event.head_commit.message }}" }
        run: |
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$CONFIRM" in DEPLOY-ADMINUPDATEUSER-EMAIL-CUT-72C) MODE=false;; DRYRUN) MODE=true;; *) echo "::error::confirm invalido"; exit 1;; esac
          else
            case "$HEADMSG" in *DEPLOY-ADMINUPDATEUSER-EMAIL-CUT-72C*) MODE=false;; *72C-DRYRUN-EMAILCUT*) MODE=true;; *) echo "push sem literal 72C — no-op"; exit 1;; esac
          fi
          echo "DRY_RUN=$MODE" >> "$GITHUB_ENV"; echo "modo DRY_RUN=$MODE"
      - name: Checkout fonte pinada
        uses: actions/checkout@v4
        with: { ref: "app/f3372c-adminupdateuser-email-cut", fetch-depth: 1 }
      - name: Guard SHA + pre-checks (harness 37/37; corte de email PROVADO no fonte)
        run: |
          set -eu
          HEADSHA=$(git rev-parse --short=7 HEAD); [ "$HEADSHA" = "$SRC_SHA" ] || { echo "::error::SHA divergente: $HEADSHA"; exit 1; }
          node --check functions/index.js
          node scripts/worker-ops/f3371a-email-change.test.mjs
          for FN in changeLoginEmail adminChangeUserEmail loginUser getUserSelf changePassword updateUserSelf adminUpdateUser adminCreateUser; do
            grep -qE "exports\.${FN} = onRequest" functions/index.js || { echo "::error::export ausente: $FN"; exit 1; }
          done
          grep -q 'USER_SELF_UPDATE_KEYS = \["color", "photo", "reminderMinutes", "name", "phone"\]' functions/index.js || { echo "::error::allowlist self ainda tem email?"; exit 1; }
          grep -q 'USER_ADMIN_UPDATE_KEYS = \["name", "role", "phone", "color", "photo", "reminderMinutes"\]' functions/index.js || { echo "::error::allowlist admin ainda tem email?"; exit 1; }
          [ "$(grep -c 'email_change_dedicated_flow' functions/index.js)" -ge 2 ] || { echo "::error::rejeicao explicita ausente"; exit 1; }
          case "$DEPLOY_TARGET" in functions|functions:) echo "::error::alvo total bloqueado"; exit 1;; esac
          case "$DEPLOY_TARGET" in *hosting*|*firestore*|*rules*) echo "::error::alvo proibido"; exit 1;; esac
          echo "pre-checks OK"
      - name: Auth gcloud (SA via secret; nunca impresso)
        env: { GOOGLE_APPLICATION_CREDENTIALS_JSON: "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" }
        run: |
          set -eu
          [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ] || { echo "::error::SA ausente"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json" >/dev/null
          gcloud config set project "$GCP_PROJECT" >/dev/null
          npm install -g firebase-tools >/dev/null 2>&1
      - name: Estado ANTES (functions:list)
        run: firebase functions:list --project "$GCP_PROJECT" | tee before.txt || true
      - name: functions/.env (somente RESET_EMAIL_* defaults; sem segredo)
        run: |
          set -eu
          { printf 'RESET_EMAIL_FROM=%s\n' "no-reply@agendaidseven.com.br"; printf 'RESET_EMAIL_FROM_NAME=%s\n' "ID Seven Agenda"; printf 'RESET_EMAIL_PROVIDER=%s\n' "resend"; } > "functions/.env.${GCP_PROJECT}"
      - name: Deploy (SOMENTE apply)
        run: |
          set -eu
          ( cd functions && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          if [ "$DRY_RUN" = "false" ]; then
            firebase deploy --only "$DEPLOY_TARGET" --project "$GCP_PROJECT" --non-interactive --force
          else
            echo "DRY-RUN — nenhum deploy. Alvo planejado: $DEPLOY_TARGET"
          fi
      - name: Pos-deploy + canarios seguros (somente apply)
        run: |
          set -eu
          [ "$DRY_RUN" = "false" ] || { echo "dry-run: sem canarios"; exit 0; }
          firebase functions:list --project "$GCP_PROJECT" | tee after.txt
          for FN in changeLoginEmail adminChangeUserEmail loginUser getUserSelf changePassword updateUserSelf adminUpdateUser; do
            grep -qi "$FN" after.txt || { echo "::error::function ausente pos-deploy: $FN"; exit 1; }
          done
          C1=$(curl -s -o r1.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"email":"canario-72c@x.com"}' https://updateuserself-de36pi7vza-uc.a.run.app); cat r1.json; echo
          [ "$C1" = "401" ] || { echo "::error::updateUserSelf sem-sessao esperava 401 (auth antes do campo), veio $C1"; exit 1; }
          C2=$(curl -s -o r2.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"targetId":"x","patch":{"email":"canario-72c@x.com"}}' https://adminupdateuser-de36pi7vza-uc.a.run.app); cat r2.json; echo
          [ "$C2" = "401" ] || { echo "::error::adminUpdateUser sem-sessao esperava 401, veio $C2"; exit 1; }
          C3=$(curl -s -o r3.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://changeloginemail-de36pi7vza-uc.a.run.app); cat r3.json; echo
          [ "$C3" = "401" ] || { echo "::error::changeLoginEmail dedicado esperava 401, veio $C3"; exit 1; }
          C4=$(curl -s -o r4.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://adminchangeuseremail-de36pi7vza-uc.a.run.app); cat r4.json; echo
          [ "$C4" = "401" ] || { echo "::error::adminChangeUserEmail dedicado esperava 401, veio $C4"; exit 1; }
          C5=$(curl -s -o r5.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"identifier":"canario-inexistente-72c@x.com","password":"x"}' https://loginuser-de36pi7vza-uc.a.run.app); cat r5.json; echo
          [ "$C5" = "401" ] || { echo "::error::loginUser canario esperava 401, veio $C5"; exit 1; }
          grep -qiE 'pass|salt|token"' r1.json r2.json r3.json r4.json r5.json && { echo "::error::PII em resposta"; exit 1; } || true
          echo "== EMAILCUT-72C =="
          echo "deploy_target : $DEPLOY_TARGET"
          echo "src           : $SRC_REF @ $SRC_SHA"
          echo "canarios      : updateUserSelf=401 adminUpdateUser=401 changeLoginEmail=401 adminChangeUserEmail=401 loginUser=401"
          echo "== FIM EMAILCUT-72C =="
          echo "===== GO: DEPLOY EMAIL-CUT + CANARIOS OK ====="
      - name: Limpeza credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" || true
