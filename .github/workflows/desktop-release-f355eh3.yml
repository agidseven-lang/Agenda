# =====================================================================
# F3.5.5E-H3 — Publicacao da Desktop 1.0.227 no CANAL DO ATUALIZADOR INTERNO (Latest)
# ---------------------------------------------------------------------
# Publica a 1.0.227 (F3.5.5E-H3 — VISIBILIDADE GLOBAL das notificacoes imediatas: a
# notificacao fica visivel SOBRE qualquer janela comum do Windows enquanto o Agenda
# estiver ativo em background, SEM roubar o foco. Causa-raiz corrigida: REASSERT
# completo de topmost/bounds a cada apresentacao da janela premium (position ->
# setAlwaysOnTop screen-saver -> showInactive -> moveTop) + reafirmacao no update de
# grupo + reposicionamento em display-changed + HANDOFF do toast no blur (cards
# ativos migram para a janela premium com sound:false — mover, nunca duplicar).
# VISUAL da referencia do owner (1.0.226) BYTE-CONGELADO — bgnotify.html diff-vazio
# por gate; roteamento por FOCO REAL congelado; som/dedupe/fila/recibos/sino/SLA
# intocados. BASE E BASELINE FISICA OFICIAL: 1.0.226. ROLLBACK IMEDIATO: v1.0.226.
# Rollback adicional: v1.0.224. Rollback fisico de seguranca: v1.0.223.
# USA EXCLUSIVAMENTE os BYTES do run de build F3.5.5E-H3 31199591435 (gated, verde
# nos 2 jobs; --publish never): NAO RECOMPILA — baixa os 2 artifacts e publica os
# MESMOS bytes. TUDO PINADO: run id, digests dos artifacts, 5 hashes SHA-256, tag
# v1.0.227 no head EXATO da branch.
# 6 assets: EXE, MSI, latest.yml, blockmap, SHA256SUMS, VERSAO-DESKTOP.txt.
# ESCRITAS (tag + release + Latest) SO via token temporario do GitHub App "Agenda ID Seven Release
# Bot" (expira sozinho); GITHUB_TOKEN permanece somente leitura; sem RELEASE_PAT.
# Roda NA PROPRIA branch de teste (main INTOCAVEL): dispara no push DESTE arquivo + workflow_dispatch.
# A publicacao NAO significa aprovacao fisica — o teste fisico do owner (A/B/C/D do
# mandato: minimizado sob Chrome maximizado; X/tray; aberto atras; digitacao) vem depois.
# =====================================================================
name: "F3.5.5E-H3 Desktop Release — 1.0.227 no canal do updater (Visibilidade Global das Notificações; sem build novo)"
"on":
  push:
    branches:
      - "desktop/f355eh3-global-notification-visibility-1.0.227"
    paths:
      - ".github/workflows/desktop-release-f355eh3.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agidseven-lang/Agenda
      # ── PINAGEM COMPLETA (F3.5.5E-H3; run de build 31199591435 verde nos 2 jobs) ──
      RUN_ID: "31199591435"
      STABLE_SHA: "a958aa32d2e05ba4f070bf3d040e86733869928e"
      TEST_BRANCH: "desktop/f355eh3-global-notification-visibility-1.0.227"
      BASE_226_SHA: "267f8c8593e6724ad6460ed8bbb42201ade09d0b"
      BASE_225_SHA: "24b76b51faf4d2778f025df79d6047563f089b48"
      BASE_224_SHA: "0fcad3e56d39320b8853807861417a0a5eca1e78"
      BASE_223_SHA: "217ed0622993acced1a20b72ba677e9d17ed2f03"
      BASE_222_SHA: "1eac3672ab07a56bfd5d692e9ecb24688ac2ee83"
      BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
      BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
      BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
      BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
      TAG: "v1.0.227"
      TITLE: "Agenda ID Seven Desktop 1.0.227 — Visibilidade Global das Notificações"
      ART_INST: "agenda-id-seven-desktop-1.0.227-installer"
      ART_INST_DIGEST: "sha256:bee2df8b96bf3d28d6e715b2258173c2259d1a8c40f2296681abc4cfc01ea336"
      ART_META: "agenda-id-seven-desktop-1.0.227-updatemeta"
      ART_META_DIGEST: "sha256:61450d80617b4f5fb942b959d320c107b190ec76608a56c378e278882a18c3df"
      EXE_NAME: "Agenda-ID-Seven-Desktop-1.0.227-x64.exe"
      MSI_NAME: "Agenda-ID-Seven-Desktop-1.0.227-x64.msi"
      BM_NAME: "Agenda-ID-Seven-Desktop-1.0.227-x64.exe.blockmap"
      LY_NAME: "latest.yml"
      EXP_EXE: "45180d1ffde66f1e28991488ed0bc81c458009a0a31925f4304179f98205bab8"
      EXP_MSI: "9680c19d9949aec0df74828e343fbb074dbc94ee9369ab3a92e34509dcf8ccc2"
      EXP_LY: "757445cc6644d8279623381e3e0856da198ae0fad50ac98dd7077860b1a16047"
      EXP_BM: "e705ac6510249c0c1a1e0bd3cec681bc39bf7e0077652302e509f822a08b6827"
      EXP_SBOM: "5426d5744cc6574a9171aecdc1cb8624c800ce6c39bd3175b521da2730f11664"
      PREV_LATEST_TAG: "v1.0.226"
      PRES_225_TAG: "v1.0.225"
      PRES_224_TAG: "v1.0.224"
      PRES_223_TAG: "v1.0.223"
      PRES_222_TAG: "v1.0.222"
      PROD_ROLLBACK_TAG: "v1.0.218"
      PROD_ROLLBACK2_TAG: "v1.0.216"
    steps:
      - name: "Gate 0 — contexto: branch de teste correta (publicacao autorizada F3.5.5E-H3)"
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = "$TEST_BRANCH" ] || { echo "::error::ref '${{ github.ref_name }}' != $TEST_BRANCH — nada publicado"; exit 1; }
          echo "OK: rodando na branch de teste autorizada"

      - name: "Gate 0a — token temporario do Release Bot (GitHub App; expira sozinho)"
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Agenda
          permission-contents: write
          permission-workflows: write

      - name: "Gate 0b — token do Release Bot ATIVO + escopo SO Agenda"
        env:
          BOT_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$BOT_TOKEN" ] || { echo "::error::token do Release Bot vazio — NADA publicado."; exit 1; }
          FN="$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$REPO" --jq '.full_name' 2>/dev/null || true)"
          [ "$FN" = "$REPO" ] || { echo "::error::Release Bot sem acesso a $REPO."; exit 1; }
          J="$(GH_TOKEN="$BOT_TOKEN" gh api /installation/repositories)"
          N="$(echo "$J" | jq -r '.total_count')"; R="$(echo "$J" | jq -r '.repositories[0].full_name')"
          { [ "$N" = "1" ] && [ "$R" = "$REPO" ]; } || { echo "::error::escopo do Release Bot != {1 repo, $REPO} ($N,$R)."; exit 1; }
          echo "OK: Release Bot ativo, escopo restrito a $REPO"

      - name: "Gate 1 — run de build F3.5.5E-H3 completed/success e head EXATO"
        run: |
          set -euo pipefail
          J="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          ST="$(echo "$J" | jq -r '.status + "|" + .conclusion')"
          HS="$(echo "$J" | jq -r '.head_sha')"
          BR="$(echo "$J" | jq -r '.head_branch')"
          echo "run $RUN_ID: $ST head=$HS branch=$BR"
          [ "$ST" = "completed|success" ] || { echo "::error::run de build invalido"; exit 1; }
          [ "$HS" = "$STABLE_SHA" ] || { echo "::error::head do run != STABLE_SHA"; exit 1; }
          [ "$BR" = "$TEST_BRANCH" ] || { echo "::error::branch do run != branch de teste"; exit 1; }

      - name: "Gate 2 — STABLE_SHA na linhagem do tip; commits alem dele SO o workflow de release"
        run: |
          set -euo pipefail
          H="$(gh api "repos/$REPO/git/ref/heads/$TEST_BRANCH" --jq '.object.sha')"
          CMP="$(gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.status')"
          echo "compare $STABLE_SHA...$H: $CMP"
          { [ "$CMP" = "identical" ] || [ "$CMP" = "ahead" ]; } || { echo "::error::STABLE_SHA fora da linhagem do tip ($CMP)"; exit 1; }
          gh api "repos/$REPO/compare/$STABLE_SHA...$H" --jq '.files[].filename' | tee /tmp/extra.txt || true
          if grep -vE '^\.github/workflows/desktop-release-f355eh3\.yml$' /tmp/extra.txt | grep -q .; then
            echo "::error::commits pos-candidato tocam arquivos alem do workflow de release"; exit 1; fi
          if grep -qE '^(desktop/src/|desktop/scripts/copy-renderer\.js|desktop/package\.json|desktop/package-lock\.json|desktop/tsconfig\.json|desktop/electron-builder)' /tmp/extra.txt; then
            echo "::error::insumo de build alterado apos STABLE_SHA — bytes publicados nao corresponderiam ao build"; exit 1; fi
          CMP26="$(gh api "repos/$REPO/compare/$BASE_226_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP26" = "ahead" ] || [ "$CMP26" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline fisica 1.0.226 ($CMP26)"; exit 1; }
          CMP25="$(gh api "repos/$REPO/compare/$BASE_225_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP25" = "ahead" ] || [ "$CMP25" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da base 1.0.225 ($CMP25)"; exit 1; }
          CMP24="$(gh api "repos/$REPO/compare/$BASE_224_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP24" = "ahead" ] || [ "$CMP24" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline fisica 1.0.224 ($CMP24)"; exit 1; }
          CMP23="$(gh api "repos/$REPO/compare/$BASE_223_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP23" = "ahead" ] || [ "$CMP23" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.223 ($CMP23)"; exit 1; }
          CMP22="$(gh api "repos/$REPO/compare/$BASE_222_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP22" = "ahead" ] || [ "$CMP22" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.222 ($CMP22)"; exit 1; }
          CMP21="$(gh api "repos/$REPO/compare/$BASE_221_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP21" = "ahead" ] || [ "$CMP21" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.221 ($CMP21)"; exit 1; }
          CMP20="$(gh api "repos/$REPO/compare/$BASE_220_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP20" = "ahead" ] || [ "$CMP20" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.220 ($CMP20)"; exit 1; }
          CMP0="$(gh api "repos/$REPO/compare/$BASE_218_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP0" = "ahead" ] || [ "$CMP0" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da baseline fisica segura 1.0.218 ($CMP0)"; exit 1; }
          CMP1="$(gh api "repos/$REPO/compare/$BASE_216_SHA...$STABLE_SHA" --jq '.status')"
          { [ "$CMP1" = "ahead" ] || [ "$CMP1" = "identical" ]; } || { echo "::error::STABLE_SHA nao descende da 1.0.216 ($CMP1)"; exit 1; }
          echo "OK: STABLE_SHA ancestral do tip; extras = so o workflow de release; bases 1.0.226/1.0.225/1.0.224/1.0.223/1.0.222/1.0.221/1.0.220/1.0.218/1.0.216 na linhagem"

      - name: "Gate 3 — release v1.0.227 NAO existe; tag so pode preexistir apontando p/ STABLE_SHA"
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "::error::release $TAG ja existe"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          fi
          echo "OK: release/tag livres (ou tag ja em STABLE_SHA)"

      - name: "Gate 4 — artifacts: ids+digests conferem (mesmos bytes do run verde)"
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate)"
          chk() { local d; d="$(echo "$json" | jq -r --arg n "$1" '.artifacts[]|select(.name==$n)|.digest')"; echo "$1: $d"; [ "$d" = "$2" ] || { echo "::error::digest $1 divergente"; exit 1; }; }
          chk "$ART_INST" "$ART_INST_DIGEST"
          chk "$ART_META" "$ART_META_DIGEST"

      - name: "Baixar artifacts (installer + updatemeta) — SEM recompilar"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_INST" -D pacote
          gh run download "$RUN_ID" -R "$REPO" -n "$ART_META" -D pacote
          for f in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS SBOM-cyclonedx.json VERSAO-DESKTOP.txt; do
            test -f "pacote/$f" || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          if [ -f pacote/canary.yml ]; then echo "::error::canary.yml presente — canal ambiguo"; exit 1; fi

      - name: "Gate 5 — hashes SHA-256 + latest.yml (versao/EXE/sha512) + VERSAO-DESKTOP"
        run: |
          set -euo pipefail
          declare -A EXP=( ["$EXE_NAME"]="$EXP_EXE" ["$MSI_NAME"]="$EXP_MSI" ["$LY_NAME"]="$EXP_LY" ["$BM_NAME"]="$EXP_BM" ["SBOM-cyclonedx.json"]="$EXP_SBOM" )
          for f in "${!EXP[@]}"; do
            H="$(sha256sum "pacote/$f" | awk '{print $1}')"; echo "$f=$H"
            [ "$H" = "${EXP[$f]}" ] || { echo "::error::hash $f divergente"; exit 1; }
          done
          ( cd pacote && sha256sum -c SHA256SUMS ) || { echo "::error::SHA256SUMS nao confere"; exit 1; }
          grep -q "version: 1.0.227" "pacote/$LY_NAME" || { echo "::error::latest.yml version != 1.0.227"; exit 1; }
          grep -qE "^path: $EXE_NAME" "pacote/$LY_NAME" || { echo "::error::latest.yml path != EXE"; exit 1; }
          META_SHA512=$(grep -E '^sha512:' "pacote/$LY_NAME" | head -1 | sed -E 's/^sha512:[[:space:]]*//' | tr -d '\r')
          CALC_SHA512=$(openssl dgst -sha512 -binary "pacote/$EXE_NAME" | openssl base64 -A)
          [ "$META_SHA512" = "$CALC_SHA512" ] || { echo "::error::sha512 do latest.yml != EXE (updater rejeitaria)"; exit 1; }
          grep -q "versionName : 1.0.227" pacote/VERSAO-DESKTOP.txt || { echo "::error::VERSAO-DESKTOP sem 1.0.227"; exit 1; }
          grep -q "1.0.227-f355eh3-global-notification-visibility" pacote/VERSAO-DESKTOP.txt || { echo "::error::rotulo da candidata ausente"; exit 1; }
          echo "OK: 5 hashes + SHA256SUMS + latest.yml (1.0.227/EXE/sha512==EXE) + VERSAO-DESKTOP"

      - name: "Release notes"
        run: |
          cat > notas.md <<'NOTAS'
          Agenda ID Seven Desktop 1.0.227 — Visibilidade Global das Notificações

          Atualização disponibilizada pelo ATUALIZADOR INTERNO do app (Configurações ->
          Atualizações -> Verificar atualizações -> Baixar -> Instalar e reiniciar).
          NENHUM download manual é necessário.

          CONTEXTO: hotfix P0 sobre a 1.0.226 FISICAMENTE APROVADA (baseline oficial).
          O visual aprovado da referência do owner está 100% CONGELADO — byte-idêntico
          (verificado por gate no CI). Esta versão corrige APENAS a VISIBILIDADE:
          a notificação agora fica visível SOBRE qualquer janela comum do Windows
          enquanto o Agenda estiver ativo em background, SEM roubar o foco.

          O QUE MUDA vs 1.0.226 (F3.5.5E-H3) — SOMENTE visibilidade/roteamento:
          - JANELA PREMIUM sempre reapresentada com TOPMOST e POSIÇÃO reafirmados
            (antes, depois de esconder por fila vazia ou de trocar monitor/DPI, ela
            podia reaparecer ATRÁS de outras janelas ou fora do lugar);
          - card de GRUPO ("N atualizações") também reafirma o topo ao atualizar;
          - troca de monitor/resolução/taskbar reposiciona a janela na hora;
          - NOVO HANDOFF NO BLUR: se um toast está na tela e você alterna para outro
            programa (Alt+Tab, clique), o MESMO card migra imediatamente para a
            janela premium por cima do outro programa — sem tocar som de novo, sem
            duplicar (mover, nunca duplicar); fechados manualmente não reaparecem;
          - o roteamento por FOCO REAL segue o mesmo: Agenda focado -> toast interno;
            Agenda atrás/minimizado/oculto no tray -> janela premium topmost;
          - a notificação NUNCA rouba o foco: você continua digitando onde estava
            (provado tecla a tecla); SÓ o clique em "Abrir ->" traz o Agenda.

          O QUE NÃO MUDA (CONGELADO por gate):
          - o VISUAL 1.0.226 aprovado (avatar flutuante 62px, cápsula com segmento
            "Abrir ->", radius 24, navy premium) — bgnotify.html byte-idêntico;
          - som (1x), deduplicação, fila/caps, agrupamento, recibos, sino/histórico,
            deep-link, SLA/lembretes centrais, Acompanhamento, sessão automática,
            tray, autostart, updater, Cronograma/editor/colagem, portal, auth;
          - sessão BLOQUEADA continua indo pela Notification nativa do Windows
            (nenhum overlay sobre a tela de bloqueio — limitação legítima do SO);
          - main/preloads alheios/Worker/Functions/Rules/Android intocados.

          IMPORTANTE: esta versão DEPENDE DE VALIDAÇÃO FÍSICA do owner no Windows.
          Teste decisivo (mandato): A) Agenda minimizado + Chrome maximizado +
          evento real -> notificação aparece POR CIMA; B) X/tray + trabalhar em
          outro app -> notificação aparece; C) Agenda aberto ATRÁS de Photoshop/
          Premiere/Chrome -> aparece por cima; D) digitando no Word/Bloco de Notas
          quando chega notificação -> a digitação NÃO é interrompida.
          A publicação não é aprovação física.
          Em caso de problema: ROLLBACK IMEDIATO v1.0.226 (baseline física);
          adicional v1.0.224; físico de segurança v1.0.223; extra v1.0.218;
          todas as versões anteriores permanecem publicadas.

          Procedência: run de build F3.5.5E-H3 31199591435 (success; --publish
          never; verify + Windows verdes: suíte da fase 56 — contrato do reassert
          + handoff + roteamento congelado + visual 1.0.226 byte-congelado +
          comportamento do dist em sandbox — rodada TAMBÉM contra o app.asar;
          22 provas Electron REAIS com o pipeline REAL do dist compilado
          (handoff no blur E2E, digitação preservada tecla a tecla, reassert
          pós-hide, destroy/recreate, rajada 20 com cap 5, empilhamento,
          125/150 por cento, workArea); suíte da referência herdada 62 + bateria
          herdada completa + provas herdadas F3.5.5E-H2 23 + F3.5.5E 27 +
          F3.5.5D 27 + C-H2 9 + C-H1 10+ciclos + smoke RTE 91 + F3.5.5B 20 +
          A-H1 15 + A 25; isolamento: delta SÓ na camada de visibilidade
          autorizada vs 1.0.226 + visual da referência e funcional alheio
          DIFF-VAZIO; limitações de CI declaradas — z-order do DWM real,
          minimize sem window manager e Notification nativa ficam para a
          validação física) @ commit a958aa32d2e05ba4f070bf3d040e86733869928e
          (branch desktop/f355eh3-global-notification-visibility-1.0.227).
          Mesmos bytes; sem recompilar. Confira SHA-256 em SHA256SUMS.
          NOTAS

      - name: "Criar tag v1.0.227 pinada em STABLE_SHA — ESCRITA via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TS="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            [ "$TS" = "$STABLE_SHA" ] || { echo "::error::tag $TAG aponta para outro sha ($TS)"; exit 1; }
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$STABLE_SHA" >/dev/null
            echo "tag $TAG criada em $STABLE_SHA"
          fi

      - name: "Publicar release no canal do updater (latest=true, prerelease=false) — 6 assets — via Release Bot"
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" \
            --target "$STABLE_SHA" --latest=true \
            --title "$TITLE" --notes-file notas.md \
            "pacote/$EXE_NAME" "pacote/$MSI_NAME" "pacote/$LY_NAME" "pacote/$BM_NAME" "pacote/SHA256SUMS" "pacote/VERSAO-DESKTOP.txt"
          echo "publicado: $TAG (canal do electron-updater: release Latest com latest.yml)"

      - name: "Pos-verificacao (Latest=1.0.227; 1.0.226/1.0.225/1.0.224/1.0.223/1.0.222 preservadas; rollbacks 1.0.218/1.0.216 preservados)"
        run: |
          set -euo pipefail
          FLAGS="$(gh release view "$TAG" -R "$REPO" --json isPrerelease,isDraft --jq '(.isPrerelease|tostring)+"|"+(.isDraft|tostring)')"
          [ "$FLAGS" = "false|false" ] || { echo "::error::flags incorretas: $FLAGS"; exit 1; }
          N="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets|length')"
          [ "$N" = "6" ] || { echo "::error::esperado 6 assets, encontrados $N"; exit 1; }
          for a in "$EXE_NAME" "$MSI_NAME" "$LY_NAME" "$BM_NAME" SHA256SUMS VERSAO-DESKTOP.txt; do
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$a" || { echo "::error::asset $a ausente"; exit 1; }
          done
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "app-update.yml"; then echo "::error::app-update.yml nao pode ser asset"; exit 1; fi
          TAGSHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          [ "$TAGSHA" = "$STABLE_SHA" ] || { echo "::error::tag != STABLE_SHA"; exit 1; }
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [ "$LATEST_TAG" = "$TAG" ] || { echo "::error::Latest do repo != $TAG (got $LATEST_TAG)"; exit 1; }
          for t in "$PREV_LATEST_TAG" "$PRES_225_TAG" "$PRES_224_TAG" "$PRES_223_TAG" "$PRES_222_TAG" "$PROD_ROLLBACK_TAG" "$PROD_ROLLBACK2_TAG"; do
            gh release view "$t" -R "$REPO" --json tagName --jq '.tagName' | grep -qx "$t" || { echo "::error::$t (preservada/rollback) sumiu"; exit 1; }
          done
          echo "===== GO: 1.0.227 no canal do updater (Latest); ROLLBACK IMEDIATO 1.0.226 (baseline fisica); adicional 1.0.224; fisico de seguranca 1.0.223; 1.0.225/1.0.222 preservadas; extras 1.0.218/1.0.216 ====="
