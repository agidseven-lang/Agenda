# F3.5.5E-H1 — Desktop 1.0.225 (Redesign Ultra Premium das Notificações Imediatas)
# build GATED, --publish never. Publicação SÓ no desktop-release-f355eh1.yml (mesmos bytes).
# Base de código 1.0.224 @ 0fcad3e5 (Latest publicada e FISICAMENTE aprovada — BASELINE OFICIAL);
# rollback imediato 1.0.224; adicional 1.0.223; físico seguro 1.0.218. Delta: SOMENTE CAMADA
# VISUAL das notificações imediatas nas DUAS superfícies (toast index.html + janela premium
# bgnotify.html) — conceito A "Compact Enterprise": card 440px (antes 480), header em grid com
# pastilha de ícone do EVENTO (paths do PRÓPRIO icon set do app; sem emoji), título 18/700,
# CLIENTE em linha própria 14/650 (1 linha + tooltip), contexto 12.5/450, chips 26px sutis
# (borda 1px fraca + fundo 9%), responsável em linha própria, FOOTER com hairline (avatar 28px
# ring 1px + autor com ellipsis/tooltip + CTA ghost "Abrir tarefa →" 30px), fechar com hit-area
# 32×32, barra lateral 2px, animação preservada (180ms fade+translateY + reduced-motion).
# ZERO mudança funcional: evento/hora/payload, clique/deep-link, fechar, fila/caps, dedupe,
# agrupamento, recibos, som (1.0.216), sino, prioridade, permissões, aria-live, teclado — tudo
# CONGELADO byte-a-byte no main/preloads/worker/functions/android vs 1.0.224 (diff vazio).
# PARIDADE byte-a-byte dos builders nas 2 superfícies verificada por suíte própria (77 asserts).
name: "[push/manual] F3.5.5E-H1 — Desktop 1.0.225 (Notificações Ultra Premium) — Desktop Build"
"on":
  push:
    branches: ["desktop/f355eh1-ultra-premium-notifications-1.0.225"]
    paths-ignore: [".github/workflows/desktop-release-f355eh1.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  TEST_BRANCH: "desktop/f355eh1-ultra-premium-notifications-1.0.225"
  BASE_224_SHA: "0fcad3e56d39320b8853807861417a0a5eca1e78"
  BASE_223_SHA: "217ed0622993acced1a20b72ba677e9d17ed2f03"
  BASE_222_SHA: "1eac3672ab07a56bfd5d692e9ecb24688ac2ee83"
  BASE_221_SHA: "98caad68e83230c2ada88ce1b35e709a0d62ab8c"
  BASE_220_SHA: "2d003adaeeec00499e95a9eac5fe01f48859e4ed"
  BASE_218_SHA: "1a945159dd563eba5c80657427519d0f22b4b673"
  BASE_216_SHA: "e509f43ae8f3130a9922791f89db0ba29aa7a410"
  APP_DIR: desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Gate REF + ANCESTRIA (descende da 1.0.224, 1.0.223, 1.0.222, 1.0.221, 1.0.220, 1.0.218 e 1.0.216)"
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$TEST_BRANCH" ] || { echo "::error::branch errada"; exit 1; }
          git merge-base --is-ancestor "$BASE_224_SHA" HEAD || { echo "::error::não descende da 1.0.224"; exit 1; }
          git merge-base --is-ancestor "$BASE_223_SHA" HEAD || { echo "::error::não descende da 1.0.223"; exit 1; }
          git merge-base --is-ancestor "$BASE_222_SHA" HEAD || { echo "::error::não descende da 1.0.222"; exit 1; }
          git merge-base --is-ancestor "$BASE_221_SHA" HEAD || { echo "::error::não descende da 1.0.221"; exit 1; }
          git merge-base --is-ancestor "$BASE_220_SHA" HEAD || { echo "::error::não descende da 1.0.220"; exit 1; }
          git merge-base --is-ancestor "$BASE_218_SHA" HEAD || { echo "::error::não descende da 1.0.218"; exit 1; }
          git merge-base --is-ancestor "$BASE_216_SHA" HEAD || { echo "::error::não descende da 1.0.216"; exit 1; }
      - name: "Gate VERSAO 1.0.225 (package + lock x2 + description da fase + cadeia de bases preservada)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.0.225') process.exit(1); if(!/ultra-premium-notifications/.test(p.description||'')) process.exit(1); if(!/retire-legacy-modules-premium-notifications/.test(p.description||'')) process.exit(1); if(!/custom-cronograma-quantity-universal-paste/.test(p.description||'')) process.exit(1); if(!/stale-alert-terminal-task-hotfix/.test(p.description||'')) process.exit(1); if(!/session-restore-boot-hotfix/.test(p.description||'')) process.exit(1); if(!/custom-script-quantity-rich-editor/.test(p.description||'')) process.exit(1);"
          [ "$(grep -c '"version": "1.0.225"' package-lock.json)" -ge 2 ]
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "npm ci + TypeScript + sintaxe dos renderers como SCRIPT CLÁSSICO (vm.Script — parser do browser; new Function mascara return de topo) + worker"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/bgnotify.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'bgnotify-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/slareminder.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1],{filename:'slareminder-inline'});"
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('src/renderer/index.html','utf8');const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);if(b.length<2){console.error('esperados >=2 blocos inline (guarda + principal)');process.exit(1);}b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i}));console.log('blocos inline OK (Script clássico):',b.length);"
          node --check ../cloudflare-worker.js
      - name: "Gate F3.5.5E-H1 — CONTRATO VISUAL do redesign (77: CSS 2 superfícies + paridade 8 builders + icon set + variantes + tooltips + a11y + congelados) [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
          node scripts/f355eh1-visual-redesign.test.mjs
      - name: "Gate F3.5.5E herdado — retirada dos módulos (30) + notificações premium (40) + segurança + congelados [RE-PINADO F3.5.5E-H1: versão/visual] [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355e-retire-modules-premium-notifications.test.mjs
      - name: "Gate F3.5.5D herdado — cronograma qty + colagem universal + menu nativo 88 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355d-cron-quantity-universal-paste.test.mjs
      - name: "Gate F3.5.3 herdado — colagem base 15 (choke-point com guard readOnly) + duráveis 37"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f353-paste-recovery.test.mjs
          node scripts/f353-durable-notifications.test.mjs
      - name: "Gate F3.5.5C-H2 herdado — alertas residuais 53 (3 barreiras + limpeza + ciclos) [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355ch2-stale-alert.test.mjs
      - name: "Gate central herdado — f354l 56 + f354p 126 + f354q 94 + f354o 50 + f354u 108 [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f354l-sla-central-persistent-reminders.test.mjs
          node scripts/f354p-sla-decision-actions.test.mjs
          node scripts/f354q-task-idle-detection.test.mjs
          node scripts/f354o-common-notification-grouping.test.mjs
          node scripts/f354u-premium-common-notifications.test.mjs
          node scripts/f354u-h1-notification-hotfix.test.mjs
      - name: "Gate F3.5.5C-H1 herdado — restauração de sessão + auth-core [dist]"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355ch1-session-restore.test.mjs
          node scripts/f3356-auth-core.test.mjs
      - name: "Gate F3.5.5C herdado — quantidade + editor rico 128"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355c-script-quantity-rich-editor.test.mjs
      - name: "Gate F3.5.5C herdado — validador RTE do PORTAL 97"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-rte-worker-validator.test.mjs
      - name: "Gate F3.5.5B herdado — Agenda Premium 84"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355b-agenda-premium.test.mjs
      - name: "Gate F3.5.5A-H1 herdado — observações internas 72"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355ah1-internal-notes.test.mjs
      - name: "Gate F3.5.5A herdado — planner + orquestrador + central + integração (dist)"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f355a-execution-planner.test.mjs
          node scripts/f355a-orchestrator.test.mjs
          node scripts/f355a-execution-central.test.mjs
          node scripts/f355a-integration.test.mjs
      - name: "Gate REGRESSÃO canônica — som 37 + detalhes 74 + cards 53 + sessão 40"
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/f354wh2-immediate-notification-sound.test.mjs
          node scripts/f354wh1-details-status-notes.test.mjs
          node scripts/f354w-compact-cards-details.test.mjs
          node scripts/f354vh1-session-persistence.test.mjs
      - name: "Gate PROVAS REAIS Electron — F3.5.5E-H1 (20 provas: 17 cenas do mandato + métricas ANTES×DEPOIS + variantes; PNGs) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          timeout -k 15 700 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355eh1-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5E — 27 cenas (retirada + notificações premium) [RE-PINADO F3.5.5E-H1: P10 tooltip + P15 ordem responsável/footer] — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 700 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355e-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5D — 27 cenas (asar real, clipboard real, right-click real) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 700 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355d-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5C-H2 — 9 cenas (janela slareminder REAL) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 500 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch2-electron-proof-main.js
      - name: "Gate PROVAS herdadas F3.5.5C-H1 — boot de sessão (10 cenas) + ciclos 20x — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-electron-proof-main.js
          timeout -k 15 400 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ch1-cycle-proof-main.js
      - name: "Gate SMOKE RTE herdado — 91 comportamentais no Chromium REAL"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 300 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355c-rte-behavior-main.js
      - name: "Gate PROVAS herdadas — F3.5.5C re-escopado (superfície do Roteiro retirada; verdade herdada da F3.5.5E) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355e-retired-legacy-inherited-proof.js
      - name: "Gate PARIDADE CRUZADA herdada — canônicos validados pelo Worker"
        run: |
          set -euo pipefail
          node scripts/worker-ops/f355c-canon-crossparity.mjs
      - name: "Gate PROVAS herdadas — F3.5.5B (20) + F3.5.5A-H1 (15) + F3.5.5A (25) — xvfb"
        working-directory: desktop
        run: |
          set -euo pipefail
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355b-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355ah1-proof-main.js
          timeout -k 15 600 xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/f355a-execution-proof-main.js
      - uses: actions/upload-artifact@v4
        with: { name: f355eh1-provas-qa, path: "docs/f355eh1-qa/**", if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: f355eh1-provas-herdadas-qa, path: "docs/f355e-qa/**\ndocs/f355d-qa/**\ndocs/f355ch2-qa/**\ndocs/f355ch1-qa/**", if-no-files-found: error, retention-days: 30 }
      - name: "Gate ISOLAMENTO — delta vs 1.0.224 SÓ nos arquivos autorizados; funcional CONGELADO diff-vazio"
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_224_SHA"..HEAD > /tmp/delta.txt; cat /tmp/delta.txt
          # allowlist F3.5.5E-H1: SOMENTE camada visual (renderers das 2 superfícies) + versão +
          # suíte/harness/docs/workflows da fase + re-pins herdados ROTULADOS (RE-PINADO F3.5.5E-H1:
          # pins de versão 1.0.225 e pins visuais que apontavam para o design de 480px/38px/uppercase;
          # nenhum pin FUNCIONAL foi alterado) + desktop-release-f355e.yml (registro pinado da release
          # 1.0.224, commit 0c88a32, posterior ao STABLE_SHA da base).
          BAD=$(grep -vE '^(\.github/workflows/desktop-(build|release)-f355eh1\.yml$|\.github/workflows/desktop-release-f355e\.yml$|desktop/src/renderer/index\.html$|desktop/src/renderer/bgnotify\.html$|desktop/package(-lock)?\.json$|desktop/scripts/f355eh1-|desktop/scripts/f355e-retire-modules-premium-notifications\.test\.mjs$|desktop/scripts/f355e-electron-proof-main\.js$|desktop/scripts/f355d-cron-quantity-universal-paste\.test\.mjs$|desktop/scripts/f354p-sla-decision-actions\.test\.mjs$|desktop/scripts/f354u-premium-common-notifications\.test\.mjs$|desktop/scripts/f354u-h1-notification-hotfix\.test\.mjs$|desktop/scripts/f354vh1-session-persistence\.test\.mjs$|desktop/scripts/f354wh2-immediate-notification-sound\.test\.mjs$|desktop/scripts/f355a-integration\.test\.mjs$|desktop/scripts/f355ah1-internal-notes\.test\.mjs$|desktop/scripts/f355b-agenda-premium\.test\.mjs$|desktop/scripts/f355c-script-quantity-rich-editor\.test\.mjs$|docs/f355eh1(-qa)?/)' /tmp/delta.txt || true)
          [ -z "$BAD" ] || { echo "::error::fora da allowlist: $BAD"; exit 1; }
          # REGRA MÁXIMA da fase: ZERO mudança fora da camada visual dos renderers.
          git diff --quiet "$BASE_224_SHA"..HEAD -- desktop/src/main desktop/src/preload desktop/src/renderer/slareminder.html desktop/src/renderer/bgcall.html desktop/src/renderer/sounds desktop/src/renderer/priorityEngine.js desktop/scripts/copy-renderer.js desktop/tsconfig.json desktop/electron-builder.yml cloudflare-worker.js scripts/worker-ops functions android-native android-native-beta || { echo "::error::código funcional/congelado alterado (fase é SÓ visual)"; exit 1; }
      - name: "Gate MARCADORES F3.5.5E-H1 — redesign nas 2 superfícies + herdados F3.5.5E preservados (fonte)"
        run: |
          set -euo pipefail
          # redesign H1 nas DUAS superfícies (paridade de marcadores):
          for F in desktop/src/renderer/index.html desktop/src/renderer/bgnotify.html; do
            grep -q 'function premiumEvtIcon' "$F"
            grep -q 'ntfp-ei' "$F"
            grep -q 'ntfp-ft' "$F"
            grep -q 'height:26px' "$F"
            grep -q 'width:32px;height:32px' "$F"
            grep -q 'width:28px;height:28px' "$F"
            grep -q 'padding:12px 14px 12px 13px' "$F"
            grep -q 'Abrir tarefa<span class="car"' "$F"
            grep -q 'Responsável · ' "$F"
          done
          grep -q '.ntf.ntfp-w{width:440px;max-width:calc(100vw - 36px)}' desktop/src/renderer/index.html
          grep -q '.ntf.ntfp-w{width:100%;max-width:100%}' desktop/src/renderer/bgnotify.html
          # herdados F3.5.5E preservados (retirada + premium + D + H2 + H1):
          grep -q 'const RETIRED_SECTOR_KEYS={copywriting:1,roteiro:1,programacao_posts:1};' desktop/src/renderer/index.html
          grep -q 'function retiredCutoffFilter' desktop/src/renderer/index.html
          grep -q 'Este módulo foi descontinuado e não está mais disponível no Agenda ID Seven.' desktop/src/renderer/index.html
          grep -q 'function isRetiredSector' desktop/src/main/notifEvents.js
          grep -q 'retired-dropped' desktop/src/main/main.ts
          grep -q 'sla.reminder.retired_module' desktop/src/main/main.ts
          grep -q 'isRetiredSector' desktop/src/main/taskIdleScheduler.ts
          grep -q 'modulo_descontinuado' desktop/src/main/executionTracking.js
          grep -q 'function cronNotifContext' desktop/src/main/notifEvents.js
          grep -q 'function cronNotifContextR' desktop/src/renderer/index.html
          grep -q 'ntfp-client' desktop/src/renderer/index.html
          grep -q 'ntfp-client' desktop/src/renderer/bgnotify.html
          grep -q 'Sem cliente vinculado' desktop/src/renderer/index.html
          grep -q 'Sem cliente vinculado' desktop/src/renderer/bgnotify.html
          grep -q 'aria-live' desktop/src/renderer/index.html
          grep -q 'function cronQtyCommit' desktop/src/renderer/index.html
          grep -q 'function f355dWireUniversalPaste' desktop/src/renderer/index.html
          grep -q 'attachEditContextMenu' desktop/src/main/main.ts
          grep -q 'taskGate' desktop/src/main/slaReminder.ts
          grep -q 'Esta tarefa já foi encerrada.' desktop/src/main/slaReminder.ts
          grep -q 'server_unauthorized_confirmed' desktop/src/main/auth-core.ts
          grep -q 'authRetryNow' desktop/src/renderer/index.html
          grep -q 'id="fScriptQty"' desktop/src/renderer/index.html
          grep -q 'id="fVideoQty"' desktop/src/renderer/index.html
          echo "MARCADORES F3.5.5E-H1: VERIFIED."
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm ci + build + electron-builder (--publish never)
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis msi --publish never
      - name: "Gate EMPACOTADO — versão + REDESIGN H1 + herdados no app.asar (suítes contra o pacote)"
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          ASAR="dist-installer/win-unpacked/resources/app.asar"; test -f "$ASAR"
          npx --yes @electron/asar extract "$ASAR" asar-x
          node -e "const p=require('./asar-x/package.json'); if(p.version!=='1.0.225') process.exit(1);"
          # REDESIGN H1 nos BYTES do pacote (2 superfícies):
          grep -q 'function premiumEvtIcon' asar-x/src/renderer/index.html
          grep -q 'function premiumEvtIcon' asar-x/src/renderer/bgnotify.html
          grep -q 'ntfp-ft' asar-x/src/renderer/index.html
          grep -q 'ntfp-ft' asar-x/src/renderer/bgnotify.html
          grep -q '.ntf.ntfp-w{width:440px;max-width:calc(100vw - 36px)}' asar-x/src/renderer/index.html
          grep -q '.ntf.ntfp-w{width:100%;max-width:100%}' asar-x/src/renderer/bgnotify.html
          grep -q 'height:26px' asar-x/src/renderer/index.html
          grep -q 'width:32px;height:32px' asar-x/src/renderer/index.html
          # F3.5.5E intacto nos BYTES do pacote:
          grep -q 'function retiredCutoffFilter' asar-x/src/renderer/index.html
          grep -q 'Este módulo foi descontinuado e não está mais disponível no Agenda ID Seven.' asar-x/src/renderer/index.html
          grep -q 'ntfp-client' asar-x/src/renderer/index.html
          grep -q 'ntfp-client' asar-x/src/renderer/bgnotify.html
          grep -q 'Sem cliente vinculado' asar-x/src/renderer/bgnotify.html
          grep -q 'isRetiredSector' asar-x/dist/main/notifEvents.js
          grep -q 'cronNotifContext' asar-x/dist/main/notifEvents.js
          grep -q 'retired-dropped' asar-x/dist/main/main.js
          grep -q 'retired_module' asar-x/dist/main/main.js
          grep -q 'isRetiredSector' asar-x/dist/main/taskIdleScheduler.js
          grep -q 'modulo_descontinuado' asar-x/dist/main/executionTracking.js
          # F3.5.5D intacto no pacote:
          grep -q 'id="fCronQty"' asar-x/src/renderer/index.html
          grep -q 'function f355dWireUniversalPaste' asar-x/src/renderer/index.html
          test -f asar-x/dist/main/editContextMenu.js
          grep -q 'Colar' asar-x/dist/main/editContextMenu.js
          grep -q 'attachEditContextMenu' asar-x/dist/main/main.js
          grep -q 'clipboardReadHTML' asar-x/dist/preload/preload.js
          # H2 intacto no pacote:
          grep -q 'stale_terminal_task' asar-x/dist/main/slaReminder.js
          grep -q 'Esta tarefa já foi encerrada.' asar-x/dist/main/slaReminder.js
          grep -q 'slaTaskMapReady' asar-x/dist/main/main.js
          # H1 (sessão) intacto no pacote:
          grep -q 'server_unauthorized_confirmed' asar-x/dist/main/auth-core.js
          grep -q 'authRetryNow' asar-x/src/renderer/index.html
          # herdados intactos no pacote:
          grep -q 'id="fScriptQty"' asar-x/src/renderer/index.html
          grep -q 'function rteSanitize' asar-x/src/renderer/index.html
          grep -q "CHECK-IN DE EXECUÇÃO" asar-x/src/renderer/slareminder.html
