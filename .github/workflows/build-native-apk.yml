# Build do APK debug do app nativo (/native) no CI — sem depender da máquina local.
# Roda manualmente (workflow_dispatch) e em push na branch da PR #7.
# O google-services.json NÃO fica no repo: é restaurado de um secret base64 no build.
name: Build APK Nativo (debug)

on:
  workflow_dispatch:
  push:
    branches: [feat/native-android]
    paths:
      - 'native/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar google-services.json (do secret)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 ausente. Crie-o (base64 do google-services.json) em Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > native/android/app/google-services.json
          echo "google-services.json gerado ($(wc -c < native/android/app/google-services.json) bytes)."

      - name: Gerar debug keystore (assinatura de teste)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: npm install
        working-directory: native
        run: npm install --legacy-peer-deps

      - name: gradlew assembleRelease (APK standalone)
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK release (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
