# ============================================================================
# idseven-presence-canary — STAGE 1 (AUTH-ONLY) — config do PRIMEIRO DEPLOY.
# ----------------------------------------------------------------------------
# Correção de sequência (owner): o primeiro deploy NÃO cria Durable Object,
# NÃO tem binding PRESENCE_HUB, NÃO tem migration, NÃO tem WebSocket. Só prova
# o contrato Desktop -> /auth -> getUserSelf. O DO fica em src/presenceHub.ts +
# wrangler.stage2.toml (no branch), mas NÃO é implantado/vinculado ainda.
#
# TOTALMENTE ISOLADO do Worker J6 (idseven-push): outro name/secret/deploy.
# SECRET (só via `wrangler secret put`, NUNCA aqui/código/chat):
#   - PRESENCE_TICKET_SECRET
#
# DEPLOY (owner): cd presence-service && wrangler deploy   (usa este arquivo)
# STAGE 2 (depois, autorização literal): wrangler deploy -c wrangler.stage2.toml
# ============================================================================

name = "idseven-presence-canary"
main = "src/auth-only.ts"
compatibility_date = "2026-05-24"
workers_dev = true

# SEM durable_objects, SEM [[migrations]] — stage 1 é AUTH-ONLY (correção de sequência).

[vars]
PRESENCE_AUTH_ENABLED = "true"
PRESENCE_WS_ENABLED = "false"
PRESENCE_BROADCAST_ENABLED = "false"
GETUSERSELF_URL = "https://getuserself-de36pi7vza-uc.a.run.app"
PRESENCE_TICKET_TTL_MS = "60000"
SERVICE_VERSION = "canary-stage1"
