org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
# Arquiteturas do APK (RN 0.76)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
# New Architecture desligada na Fase 1 (build de CI mais leve/estável: sem codegen C++/NDK).
# Hermes mantido (binário pré-compilado). Pode reativar a New Arch numa fase futura.
newArchEnabled=false
hermesEnabled=true
